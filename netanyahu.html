<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netanyahu — Knobsock</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
  }
  html {
    background: #000;
  }
  html, body {
    color-scheme: dark;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  #tribute-view {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
  }

  .site-header { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
  .site-header img { display: block; width: min(70vw, 480px); height: auto; aspect-ratio: 50 / 19; object-fit: contain; }

  .tribute-text-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px clamp(16px, 4vw, 40px) clamp(24px, 5vw, 56px);
  }
  .tribute-text {
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-size: clamp(32px, 9vw, 72px);
    color: #fff;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    max-width: 100%;
  }
</style></head>
<body>
  <div id="tribute-view">
    <header class="site-header">
      <a href="/">
        <img src="/knobsock-main.PNG" alt="Knobsock">
      </a>
    </header>
    <div class="tribute-text-wrap">
      <div class="tribute-text" id="tributeText"></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const NETANYAHU_REF = db.collection('chat_config').doc('netanyahu');
  const tributeTextEl = document.getElementById('tributeText');

  NETANYAHU_REF.get().then(function (doc) {
    const data = doc.exists ? doc.data() : null;
    tributeTextEl.textContent = (data && data.text) || '';
  }).catch(function () {
    tributeTextEl.textContent = '';
  });
</script>
</body>
</html>
