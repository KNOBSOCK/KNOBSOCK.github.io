<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fully transparent — sits directly on the front page's starfield
     background, not a panel of its own. This version fills the EXACT box
     Universe gives it (width and height), rather than sizing off the
     image's own aspect ratio — since that box is now a fixed grid cell you
     control directly, not an auto-sizing code block. */
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    /* Anything that overflows this box (like the hover pop below) gets
       clipped by the iframe boundary rather than spilling visibly, so the
       button-item sizing below deliberately leaves room for that. */
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  a { text-decoration: none; color: inherit; display: block; }

  .button-item {
    position: relative;
    /* Deliberately smaller than the full box — this is the headroom the
       hover pop below grows into. At 88% resting size, scaling by 1.08 on
       hover lands at ~95%, still safely inside the box instead of getting
       clipped at its edge. */
    width: 88%;
    height: 88%;
    cursor: pointer;
    /* Cartoonish "pop": same spring-y cubic-bezier used on the other
       widgets' hover animations (recent articles, SoundCloud player) —
       overshoots past 1.0 before settling, instead of a flat ease. */
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .button-item:hover {
    transform: scale(1.08) rotate(-2deg);
  }

  /* object-fit:contain "brute forces" the image to fit inside whatever
     width/height this box ends up being (letterboxing rather than
     stretching/distorting if the box's aspect ratio doesn't exactly match
     the image's own) — width/height attributes below still help the
     browser reserve the right space before the image finishes loading. */
  .btn-base {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* The animated gif/icon layered on top of the blob (paste its URL
     below). Centered over the blob; pointer-events:none so it never
     blocks the link/hover underneath it. Nudge top/width here if it looks
     off-center once the real gif is in. */
  .btn-icon {
    position: absolute;
    left: 50%;
    top: 34%;
    width: 50%;
    height: auto;
    transform: translateX(-50%);
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- EDIT: href is the page this button should link to; the second img's
       src is the animated gif/icon that sits on top of the blob. -->
  <a class="button-item" href="PASTE_MUSIC_LINK_HERE" target="_top">
    <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_0E600FC4-6378-49CD-B81A-0AEF5BDE4858.PNG" width="961" height="1426" alt="Music">
    <img class="btn-icon" src="PASTE_MUSIC_GIF_URL_HERE" alt="">
  </a>

</body>
</html>
