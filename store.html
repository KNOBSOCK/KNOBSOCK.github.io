<style>
  /* Full rebuild per the provided desktop/mobile mockups — one big
     product image (whatever's next/prev/current in store_products,
     same admin.html-authored source every other page reads), flanked by
     prev/next arrows, a "next merch item" arrow below, and a color-swatch
     picker bottom-right. Tiled cloud-gif page background (see html,body's
     own comment) rather than this site's usual dark-panel widget look —
     the product art itself is the whole page, not content living inside
     a themed card.

     Desktop: prev/next arrows are absolutely positioned over the sides
     of the product image itself. Mobile: per the approved mobile mockup,
     .stage itself becomes one big CSS grid and every element (including
     prev/next) is explicitly placed into it — see the mobile media
     query's own comment for why and how. Both switch at this site's
     usual 860px mobile breakpoint (videos.html/music.html/live.html's
     own `@media (max-width: 860px)`).

     Title/price/material + Add to Cart flank the Next Item button in the
     footer row. Add to Cart writes to the same knobsock_cart localStorage
     key cart.html reads — cart.html (which owns the actual Checkout
     button/Stripe handoff, hence no separate checkout.html) and
     confirmation.html were re-themed alongside this rebuild to carry the
     same white/black/yellow/pink look. A fixed cart button sits top-right
     of the viewport (see .cart-btn) with a badge showing total item
     count, read from the same knobsock_cart key on load and after every
     Add to Cart. */
  * { box-sizing: border-box; }

  /* Site's display font, used here for the cart-count badge only — no
     other live (non-image) text on this page needed it. */
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }

  :root {
    --ks-pink: #ff4fa8;
    --ks-yellow: #f5e94a;
    --ks-ink: #1a1a1a;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* Tiled repeating background, same old-GeoCities-style approach as
       index.html's own body background (see that file's own comment) —
       a plain CSS repeat, no scroll/animation. The underlying color
       (shows through on iOS Safari's rubber-band overscroll above/below
       the page, even with overflow:hidden here) is the sky blue from
       the cloud gif itself, not white, so an overscroll bounce reads as
       "more sky" rather than a stark white flash. */
    background: #A5C6DE url('/store-clouds-bg.gif') repeat;
    font-family: Arial, Helvetica, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header-logo-link {
    flex: 0 0 auto;
    display: block;
    width: min(42vw, 640px);
    margin: clamp(8px, 2.4vh, 26px) 0 0;
    line-height: 0;
  }
  .header-logo {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* Desktop only (mobile's own size above already read fine live) — the
     logo doesn't need to compete with the product for attention the way
     the mobile mockup's own tighter vertical space made it naturally do
     on a phone. */
  @media (min-width: 861px) {
    .header-logo-link { width: min(11vw, 170px); }
  }

  /* ---------- CART BUTTON ---------- */
  /* position:fixed against the viewport, not .stage — works identically
     whether .stage is desktop's flex column or mobile's grid, and needs
     no grid-row/column slot of its own on mobile. */
  .cart-btn {
    position: fixed;
    top: clamp(10px, 2.4vh, 26px);
    right: clamp(10px, 3vw, 32px);
    z-index: 20;
    display: block;
    width: clamp(38px, 5.6vw, 60px);
    transition: transform 0.15s ease;
    -webkit-user-drag: none;
    user-select: none;
  }
  .cart-btn:hover { transform: scale(1.06); }
  .cart-btn:active { transform: scale(0.94); }
  .cart-btn img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  .cart-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    min-width: 20px;
    height: 20px;
    padding: 0 4px;
    border-radius: 999px;
    background: #fff;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-size: 12px;
    line-height: 1;
    color: var(--ks-yellow);
    -webkit-text-stroke: 1px #000;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .cart-badge[hidden] { display: none; }

  /* ---------- PRODUCT + PREV/NEXT ---------- */
  .product-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  /* position:absolute + inset:0 rather than a flex-item percentage
     height — this used to be `flex:1 1 auto; height:100%` inside a
     row-direction flex .product-stage, which (confirmed live) resolved
     to a height noticeably SHORTER than .product-stage's own actual
     height, silently shrinking the product image along with it (a
     flex-item cross-axis percentage-height quirk, not something
     max-height on the image itself could fix). inset:0 against
     .product-stage's own position:relative has no such ambiguity — it's
     just "fill the positioned ancestor exactly," always. */
  .product-viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    /* Tells the browser not to run its OWN default touch gestures here
       at all — pinch-zooming the whole page (mobile's own complaint)
       included — since the pinch handling below (see the touchmove
       listener on this same element) is what actually drives the
       photo's own zoom instead. Doesn't affect the single-finger swipe-
       to-navigate handling right below it either way, since that's
       already fully custom JS with no native touch behavior of its own
       to preserve. */
    touch-action: none;
  }
  /* Both the outgoing and incoming image during a slide, and the single
     resting image the rest of the time — always centered, translateX is
     layered on top of that same centering transform by JS (see
     showProduct()) rather than replacing it. object-fit:contain (via
     max-width/max-height, since these are plain <img> tags, not a fixed
     box) rather than cropping — "take up the whole page" means dominant
     within the space actually left after the header/footer rows, not
     cropped to fill it. */
  .product-img {
    position: absolute;
    top: 50%;
    left: 50%;
    max-width: 82%;
    max-height: 94%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    /* Invisible until showProduct's decode() call resolves (see its own
       comment) — mobile Safari in particular will happily paint a
       raster image mid-decode, native size and all, before this box's
       own max-width/max-height have anything correct to clamp against,
       which is what the cropped-corner flash on a slow mobile load
       actually was. Fading in only once decoding is confirmed complete
       means there's simply never a frame with the wrong size to see. */
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), max-width 0.3s ease, max-height 0.3s ease;
    -webkit-user-drag: none;
    user-select: none;
    cursor: zoom-in;
  }
  .product-img.is-ready { opacity: 1; }
  /* Click-to-expand — same fit-to-window/actual-size toggle Chrome's own
     built-in image viewer does when you click a standalone image, with
     the matching zoom-in/zoom-out cursor. There's no way for a webpage to
     summon the OS-level magnifier itself, so this reproduces the browser-
     native image-viewer behavior instead. Desktop only — see the mobile
     media query for its own, much bigger, non-cropping override; on a
     narrow screen .product-viewport is already too small a box to zoom
     "into" without either barely growing at all (bounded to its own
     100%) or spilling past its edges and getting clipped by its own
     overflow:hidden, so mobile escapes that box entirely instead (below)
     rather than reusing this. */
  .product-img.is-zoomed {
    max-width: 100%;
    max-height: 100%;
    cursor: zoom-out;
  }
  /* Backdrop behind a zoomed image — mobile-only overlay treatment (see
     the mobile media query for the real rules); display:none here keeps
     it fully inert on desktop with zero layout/paint footprint no
     matter what JS does with its is-active class. */
  .zoom-backdrop { display: none; }

  /* One wrapper per side, holding one button each — display:contents
     makes the wrapper's own box disappear so .nav-btn behaves as a
     direct child of whatever actually lays it out: .product-stage (the
     nearest positioned ancestor) on desktop, .stage's own grid on
     mobile (see that media query's own comment). Same on both — no
     duplicated markup needed for the two very different layouts. */
  .nav-row {
    display: contents;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: clamp(52px, 7vw, 120px);
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:hover { transform: translateY(-50%) scale(1.06); }
  .nav-btn:active { transform: translateY(-50%) scale(0.94); }
  .nav-btn img { display: block; width: 100%; height: auto; -webkit-user-drag: none; user-select: none; }
  .nav-prev { left: clamp(6px, 3vw, 48px); }
  .nav-next { right: clamp(6px, 3vw, 48px); }

  /* ---------- FOOTER: INFO + NEXT ITEM + ADD TO CART/COLOR PICKER ----------
     Three-column row: product info (title/price/material) on the left,
     the Next Item arrow centered, Add to Cart + the color picker stacked
     on the right — left/right columns share equal flex-basis so the
     center arrow actually lands in the middle. */
  .footer-row {
    position: relative;
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: clamp(10px, 3vw, 28px);
    padding: 0 clamp(10px, 3vw, 32px) clamp(10px, 2.4vh, 26px);
  }
  .product-info {
    flex: 1 1 0;
    min-width: 0;
    text-align: left;
  }
  .info-title {
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(13px, 1.7vw, 18px);
    color: var(--ks-ink);
    overflow-wrap: break-word;
  }
  .info-price {
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(13px, 1.7vw, 18px);
    color: var(--ks-pink);
    margin-top: 2px;
  }
  .info-material {
    font-size: clamp(11px, 1.2vw, 13px);
    color: #767676;
    margin-top: 2px;
  }
  .info-material:empty { display: none; }

  .next-item-btn {
    flex: 0 0 auto;
    width: clamp(60px, 8vw, 140px);
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.15s ease;
  }
  .next-item-btn:hover { transform: scale(1.06); }
  .next-item-btn:active { transform: scale(0.94); }
  .next-item-btn img { display: block; width: 100%; height: auto; -webkit-user-drag: none; user-select: none; }

  .footer-right {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: clamp(6px, 1.4vh, 12px);
  }
  /* Sizes come from the same per-product Sizes field admin.html already
     had (comma-separated, e.g. "S, M, L, XL") — hidden entirely (like
     .color-picker) when a product has none set. Plain live text, same
     yellow-fill/black-outline technique as .cart-badge, rather than
     baked-into-an-image like PREV/NEXT/etc., since the actual size list
     is dynamic per product. */
  .size-selector {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: clamp(2px, 0.6vh, 6px);
  }
  .size-selector[hidden] { display: none; }
  .size-label {
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-size: clamp(12px, 1.4vw, 16px);
    letter-spacing: 0.04em;
    color: #FF00FF;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;
  }
  .size-options {
    display: flex;
    gap: clamp(8px, 1.4vw, 16px);
  }
  .size-option {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: 0;
    padding: 2px;
    margin: 0;
    cursor: pointer;
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-size: clamp(16px, 2.1vw, 23px);
    line-height: 1;
    color: var(--ks-yellow);
    -webkit-text-stroke: 0.65px #000;
    text-shadow: -0.65px -0.65px 0 #000, 0.65px -0.65px 0 #000, -0.65px 0.65px 0 #000, 0.65px 0.65px 0 #000;
    transition: transform 0.15s ease;
  }
  .size-option:hover { transform: scale(1.25); }
  .size-option.is-selected { color: var(--ks-pink); transform: scale(1.2); }
  .size-option.is-selected:hover { transform: scale(1.32); }

  /* Nudge feedback for trying to Add to Cart without picking a size —
     see addToCartBtn's click handler. Not scoped to mobile like
     .is-popping; this should read the same on desktop (hover-driven)
     too, it's not a tap-vs-hover distinction. */
  @keyframes size-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .size-options.is-shaking { animation: size-shake 0.4s ease; }

  /* Two swapped button-art images (add/added), not CSS-styled text —
     see the JS side's addToCartBtn click handler. */
  .add-to-cart-btn {
    position: relative;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    border: 0;
    background: none;
    padding: 0;
    margin: 0;
    width: clamp(110px, 13vw, 190px);
    transition: transform 0.15s ease;
  }
  .add-to-cart-btn:not(:disabled):hover { transform: scale(1.06); }
  .add-to-cart-btn:not(:disabled):active { transform: scale(0.94); }
  .add-to-cart-btn img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* Checkout isn't wired up yet — this banner sits over the button
     (small enough that the yellow/black button art still shows around
     it) rather than replacing it, and the native `disabled` attribute
     (see the HTML) blocks clicks/hover without any JS changes, since
     the existing click handler and popOnClick() just never fire. */
  .add-to-cart-btn:disabled { cursor: not-allowed; }
  /* .add-to-cart-btn .add-to-cart-construction (two classes) rather than
     just .add-to-cart-construction — needs to out-specificity the
     .add-to-cart-btn img rule above (one class + one element still beats
     a lone class), which would otherwise win and stretch this to 100%
     width like the main button art. */
  .add-to-cart-btn .add-to-cart-construction {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 78%;
    max-height: 78%;
    width: auto;
    height: auto;
    pointer-events: none;
  }

  .color-picker {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: clamp(4px, 1vw, 8px);
  }
  .color-picker[hidden] { display: none; }
  .color-picker-heading {
    display: block;
    width: clamp(90px, 12vw, 170px);
    height: auto;
  }
  .color-swatches {
    display: flex;
    gap: clamp(3px, 0.8vw, 6px);
  }
  .color-swatch {
    width: clamp(22px, 3.2vw, 40px);
    height: clamp(22px, 3.2vw, 40px);
    padding: 0;
    cursor: pointer;
    border: 2px solid #000;
    box-shadow: 0 0 0 2px transparent;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .color-swatch:hover { transform: translateY(-2px); }
  .color-swatch.is-selected { box-shadow: 0 0 0 2px #ff4fa8; }

  /* ---------- MOBILE ----------
     Per the approved mobile mockup: shirt, then color picker, then a
     single row of [prev][add to cart][next], then title/price/material,
     then Next Item — in that exact order. An earlier flex-wrap-based
     attempt at this reordered unpredictably on real devices (prev/next
     landing above the info block, Next Item stranded alone at the
     bottom-left) because flex-wrap only ever preserves DOM source order
     line by line; it can't move an item like add-to-cart-btn (which
     lives in a completely different DOM branch, .footer-row, from
     .nav-row's prev/next) into the middle of another element's row.
     Fixed here by making .stage itself the one grid every element is
     explicitly placed in — every intermediate wrapper (.product-stage,
     .nav-row, .footer-row, .footer-right) turns to display:contents so
     its children become direct, explicitly-positioned grid items,
     regardless of which branch of the markup they actually live in. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }

    .stage {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto 1fr auto auto auto auto auto;
      row-gap: clamp(6px, 1.4vh, 14px);
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 0 clamp(14px, 5vw, 32px) clamp(10px, 2.4vh, 26px);
    }
    .header-logo-link { grid-column: 1 / -1; grid-row: 1; justify-self: center; }

    .product-stage { display: contents; }
    /* align-self:stretch overrides .stage's own align-items:center
       (needed so the shorter items in row 5 — add-to-cart-btn next to
       the taller prev/next triangles — center instead of stretching
       oddly) specifically for this one item. Without it, .product-
       viewport has no intrinsic content height of its own (.product-img
       is position:absolute, so it doesn't contribute to normal-flow
       sizing) and collapses to 0 instead of filling its 1fr row —
       confirmed live: the row's own computed track height was fine
       (430px), the item just wasn't stretched into it. */
    .product-viewport { grid-column: 1 / -1; grid-row: 2; position: relative; inset: auto; align-self: stretch; }

    .size-selector { grid-column: 1 / -1; grid-row: 3; justify-self: center; align-items: center; }
    .color-picker { grid-column: 1 / -1; grid-row: 4; justify-self: center; align-items: center; }

    .nav-btn {
      grid-row: 5;
      position: static;
      transform: none;
      width: clamp(56px, 18vw, 120px);
    }
    .nav-btn:hover, .nav-btn:active { transform: none; }
    .nav-prev { grid-column: 1; justify-self: start; }
    .nav-next { grid-column: 3; justify-self: end; }

    .footer-row { display: contents; }
    .product-info { grid-column: 1 / -1; grid-row: 6; text-align: center; }
    .next-item-btn { grid-column: 1 / -1; grid-row: 7; justify-self: center; }

    .footer-right { display: contents; }
    .add-to-cart-btn { grid-column: 2; grid-row: 5; justify-self: center; }

    /* Tap feedback — a quick scale-up-then-settle "pop" on every button,
       triggered by JS toggling .is-popping (see popOnClick) rather than
       :active alone, since a touch tap's :active window is too brief to
       read as a deliberate animation. The animated transform wins over
       the plain `transform: none`/scale() set elsewhere for these same
       elements while it's running (animated values take priority over
       the static cascade), then hands back to the normal resting style
       once .is-popping is removed on animationend. */
    .nav-btn.is-popping,
    .next-item-btn.is-popping,
    .add-to-cart-btn.is-popping,
    .color-swatch.is-popping,
    .cart-btn.is-popping,
    .size-option.is-popping {
      animation: btn-pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tap-to-zoom "overlay" — see the desktop .product-img.is-zoomed
       rule's own comment for why this needs a different approach here:
       .product-viewport is a small, fixed-size box on a phone (barely
       taller than the shirt itself), so anything zoomed relative to IT
       either barely grows (capped at its own 100%) or spills past its
       edges and gets clipped by its own overflow:hidden — cropping the
       collar/shoulders off, which is exactly the "don't crop" ask this
       is fixing. position:fixed escapes .product-viewport (and .stage's
       grid placement) entirely, sizing instead against the real
       viewport in vw/vh — object-fit:contain math against the WHOLE
       screen instead of one row of it, so the full photo, aspect ratio
       intact, always fits with nothing cut off. #zoomBackdrop (dimming
       the rest of the page behind it, toggled in lockstep by JS — see
       wireZoom) is what actually makes this read as a lightbox
       overlay rather than a giant photo just floating over the nav/
       footer UI underneath it. */
    .product-img.is-zoomed {
      position: fixed;
      top: 50%;
      left: 50%;
      max-width: 92vw;
      max-height: 92vh;
      z-index: 100;
    }
    .zoom-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      /* Fingers pinching the dimmed margin around the photo (not the
         photo itself) still land on this element, not .product-viewport
         underneath it — same reasoning as that element's own
         touch-action, just covering the rest of the overlay's area. */
      touch-action: none;
      transition: opacity 0.25s ease, visibility 0s linear 0.25s;
    }
    .zoom-backdrop.is-active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease, visibility 0s linear 0s;
    }
  }

  @keyframes btn-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
</style>
</head>

<!-- ============================================================
     FIREBASE — same project as every other page, read-only here: this
     page only ever reads published products, never writes them (that
     happens from admin.html's Store tab). Guarded the same way the rest
     of the site guards a Firebase read — a blocked/failed load just
     means the local/seed product shows instead of a broken page. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
  let STORE_PRODUCTS_REF = null;
  if (window.firebase) {
    const firebaseConfig = {
      apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
      authDomain: "chat-for-website-efee2.firebaseapp.com",
      projectId: "chat-for-website-efee2",
      storageBucket: "chat-for-website-efee2.firebasestorage.app",
      messagingSenderId: "509309222193",
      appId: "1:509309222193:web:f487258cfba2f7f7b00410"
    };
    const firebaseApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    STORE_PRODUCTS_REF = db.collection('store_products');
  }
</script>

<script>
(function () {
  function normalizeProduct(d, id) {
    return {
      id: id,
      title: d.title || 'Untitled',
      image: (Array.isArray(d.images) && d.images[0]) ? d.images[0] : '',
      priceCents: d.priceCents || 0,
      material: d.material || '',
      category: d.category || '',
      colors: Array.isArray(d.colors) ? d.colors.filter(function (c) { return c && c.hex; }) : [],
      sizes: Array.isArray(d.sizes) ? d.sizes.filter(Boolean) : []
    };
  }

  function formatCents(cents) {
    return '$' + (Math.max(0, cents || 0) / 100).toFixed(2);
  }

  // Only shown when there's genuinely nothing else to show — real
  // products (even just one) always win. Points at store-test-product
  // .webp, the actual asset supplied specifically "to help with
  // scaling" — so this page never looks broken/empty before the first
  // real product gets added from admin.html.
  var SEED_PRODUCT = {
    id: 'seed-test-product',
    title: 'Test Product',
    image: '/store-test-product.webp',
    priceCents: 2800,
    material: '100% Cotton',
    colors: [{ name: 'White', hex: '#ffffff' }, { name: 'Black', hex: '#000000' }],
    sizes: ['S', 'M', 'L', 'XL']
  };

  function loadProducts() {
    if (!STORE_PRODUCTS_REF) return Promise.resolve([SEED_PRODUCT]);
    return STORE_PRODUCTS_REF.where('active', '==', true).orderBy('sortOrder').get()
      .then(function (snap) {
        var products = snap.docs.map(function (doc) { return normalizeProduct(doc.data(), doc.id); });
        return products.length ? products : [SEED_PRODUCT];
      })
      .catch(function (err) {
        console.error('Failed to load store products', err);
        return [SEED_PRODUCT];
      });
  }

  // ====================================================================
  // CAROUSEL — one <img> at rest at any given time; showProduct() adds a
  // second (the incoming one), animates both simultaneously via CSS
  // transition on transform, then drops the old one once it's finished.
  // dir is +1 for next (old slides out left, new comes in from the
  // right) or -1 for prev (mirrored) — the "should slide off your
  // browser's screen" part comes for free from 100vw translateX combined
  // with html/body's own overflow:hidden clipping anything past the
  // actual edge, no extra clipping container needed.
  // ====================================================================
  var viewport = document.getElementById('productViewport');
  var colorPicker = document.getElementById('colorPicker');
  var colorSwatches = document.getElementById('colorSwatches');
  var sizeSelector = document.getElementById('sizeSelector');
  var sizeOptions = document.getElementById('sizeOptions');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var nextItemBtn = document.getElementById('nextItemBtn');
  var infoTitle = document.getElementById('infoTitle');
  var infoPrice = document.getElementById('infoPrice');
  var infoMaterial = document.getElementById('infoMaterial');
  var addToCartBtn = document.getElementById('addToCartBtn');
  var addToCartImg = document.getElementById('addToCartImg');
  var cartBtn = document.querySelector('.cart-btn');
  var cartBadge = document.getElementById('cartBadge');
  var zoomBackdrop = document.getElementById('zoomBackdrop');

  var PRODUCTS = [];
  var activeIndex = 0;
  var selectedColorIndex = 0;
  var selectedSize = '';
  var currentImg = null;
  var animating = false;
  var SLIDE_MS = 500;

  function escapeAttr(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Mobile-only "pop" tap feedback (see .is-popping's own CSS comment) —
  // harmless no-op on desktop, where that class has no matching rule.
  // Removing before re-adding, plus the offsetWidth read in between,
  // forces a reflow so a second tap mid-animation restarts it from
  // scratch instead of doing nothing (re-adding an already-present class
  // doesn't retrigger a CSS animation on its own).
  function popOnClick(el) {
    el.addEventListener('click', function () {
      el.classList.remove('is-popping');
      void el.offsetWidth;
      el.classList.add('is-popping');
    });
    el.addEventListener('animationend', function () {
      el.classList.remove('is-popping');
    });
  }

  function renderColorSwatches(product) {
    var colors = product.colors || [];
    selectedColorIndex = 0;
    colorPicker.hidden = colors.length === 0;
    colorSwatches.innerHTML = colors.map(function (c, i) {
      return '<button type="button" class="color-swatch' + (i === 0 ? ' is-selected' : '') + '" ' +
        'style="background:' + escapeAttr(c.hex) + ';" data-index="' + i + '" ' +
        'aria-label="' + escapeAttr(c.name || c.hex) + '" title="' + escapeAttr(c.name || c.hex) + '"></button>';
    }).join('');
    Array.prototype.forEach.call(colorSwatches.querySelectorAll('.color-swatch'), function (btn) {
      popOnClick(btn);
      btn.addEventListener('click', function () {
        selectedColorIndex = parseInt(btn.dataset.index, 10) || 0;
        Array.prototype.forEach.call(colorSwatches.querySelectorAll('.color-swatch'), function (b) {
          b.classList.toggle('is-selected', b === btn);
        });
        // Swap in that color's own photo (admin.html's per-color photo
        // upload) if it has one; otherwise fall back to the product's
        // default photo — an in-place src swap, not a prev/next slide,
        // since this is the same design/product, just a different shot
        // of it.
        var color = colors[selectedColorIndex];
        if (currentImg) loadImageSrc(currentImg, (color && color.image) ? color.image : product.image);
      });
    });
  }

  function renderSizeOptions(product) {
    var sizes = product.sizes || [];
    selectedSize = '';
    sizeSelector.hidden = sizes.length === 0;
    sizeOptions.innerHTML = sizes.map(function (s) {
      return '<button type="button" class="size-option" data-size="' + escapeAttr(s) + '">' + escapeAttr(s) + '</button>';
    }).join('');
    Array.prototype.forEach.call(sizeOptions.querySelectorAll('.size-option'), function (btn) {
      popOnClick(btn);
      btn.addEventListener('click', function () {
        selectedSize = btn.dataset.size;
        Array.prototype.forEach.call(sizeOptions.querySelectorAll('.size-option'), function (b) {
          b.classList.toggle('is-selected', b === btn);
        });
      });
    });
  }

  function renderProductInfo(product) {
    infoTitle.textContent = product.title || '';
    infoPrice.textContent = product.priceCents ? formatCents(product.priceCents) : '';
    infoMaterial.textContent = product.material || '';
  }

  // Click-to-expand — see .product-img.is-zoomed's own comment for why
  // this (not a real OS-level magnifier, which a webpage has no way to
  // summon) is the closest available equivalent. Ignored mid-swipe (see
  // the touch handling below) so a drag-to-swipe gesture on mobile can't
  // also toggle zoom. zoomBackdrop only actually renders on mobile (see
  // its own CSS) — toggling it here unconditionally is harmless on
  // desktop, where it stays display:none regardless of is-active.
  function wireZoom(img) {
    img.addEventListener('click', function () {
      if (suppressNextClick) { suppressNextClick = false; return; }
      var zoomed = img.classList.toggle('is-zoomed');
      zoomBackdrop.classList.toggle('is-active', zoomed);
    });
  }
  // Tapping the dimmed area around a zoomed photo closes it, same as
  // tapping the photo itself again — standard lightbox behavior, and
  // the backdrop is otherwise just dead space with nothing else to do.
  zoomBackdrop.addEventListener('click', function () {
    if (currentImg) currentImg.classList.remove('is-zoomed');
    zoomBackdrop.classList.remove('is-active');
  });

  // Shared by showProduct below (a brand-new <img>) and the color-swatch
  // swap in renderColorSwatches above (an existing one getting a new
  // src) — both point a .product-img at a fresh photo, so both carry the
  // same risk of a slow mobile decode painting it at the wrong size
  // before max-width/max-height have anything correct to clamp against
  // (see .product-img's own comment). decode() is what actually closes
  // that window; the fallback covers a browser missing it.
  function loadImageSrc(img, src) {
    img.classList.remove('is-ready');
    img.decoding = 'async';
    img.src = src;
    function reveal() { img.classList.add('is-ready'); }
    if (img.decode) {
      img.decode().then(reveal).catch(reveal);
    } else {
      img.addEventListener('load', reveal, { once: true });
      img.addEventListener('error', reveal, { once: true });
    }
  }

  function showProduct(index, dir) {
    if (animating || !PRODUCTS.length) return;
    activeIndex = ((index % PRODUCTS.length) + PRODUCTS.length) % PRODUCTS.length;
    var product = PRODUCTS[activeIndex];

    var incoming = document.createElement('img');
    incoming.className = 'product-img';
    incoming.alt = product.title || '';
    loadImageSrc(incoming, product.image);
    incoming.style.transform = 'translate(-50%, -50%) translateX(' + (dir * 100) + 'vw)';
    wireZoom(incoming);
    viewport.appendChild(incoming);
    void incoming.offsetWidth; // force layout so the transition below actually animates from the line above

    animating = true;
    incoming.style.transform = 'translate(-50%, -50%) translateX(0)';
    if (currentImg) currentImg.style.transform = 'translate(-50%, -50%) translateX(' + (-dir * 100) + 'vw)';

    var outgoing = currentImg;
    currentImg = incoming;
    setTimeout(function () {
      if (outgoing) outgoing.remove();
      animating = false;
    }, SLIDE_MS + 40);

    renderColorSwatches(product);
    renderSizeOptions(product);
    renderProductInfo(product);
  }

  // ---- Category-aware navigation ----
  // Prev/next (and swipe) cycle within the CURRENT product's category
  // (admin.html's Category field — same bucket as "Uncategorized"/''
  // for anything left blank). Next Item (and the Up/Down arrow keys)
  // instead jump to the first product of the next/previous category in
  // the list, cycling back around — "next design" vs. "next kind of
  // merch," per the original mockup spec (shirts vs. hats vs. stickers,
  // say).
  //
  // Trimmed + lowercased before comparing — confirmed live that two
  // real products typed as "T-Shirt" and "T-shirts" (differing only in
  // case) were landing in separate one-product "categories" instead of
  // one shared one, since Category is a free-text field admin.html
  // doesn't otherwise constrain. This still can't merge genuinely
  // different wording (a straight-up typo like "T-Shirt" vs "T-Shirts"
  // still won't match — that needs the actual text in admin.html made
  // consistent), just the case/whitespace variety of "same category,
  // typed slightly differently."
  function normalizeCategory(category) {
    return String(category || '').trim().toLowerCase();
  }
  function categoryIndices(category) {
    var result = [];
    var target = normalizeCategory(category);
    for (var i = 0; i < PRODUCTS.length; i++) {
      if (normalizeCategory(PRODUCTS[i].category) === target) result.push(i);
    }
    return result;
  }
  function showRelativeInCategory(dir) {
    if (!PRODUCTS.length) return;
    var list = categoryIndices(PRODUCTS[activeIndex].category);
    var pos = list.indexOf(activeIndex);
    if (pos === -1) pos = 0;
    var newPos = ((pos + dir) % list.length + list.length) % list.length;
    showProduct(list[newPos], dir);
  }
  function showRelativeCategory(dir) {
    if (!PRODUCTS.length) return;
    var categories = [];
    PRODUCTS.forEach(function (p) {
      var cat = normalizeCategory(p.category);
      if (categories.indexOf(cat) === -1) categories.push(cat);
    });
    var curPos = categories.indexOf(normalizeCategory(PRODUCTS[activeIndex].category));
    var newPos = ((curPos + dir) % categories.length + categories.length) % categories.length;
    var newCat = categories[newPos];
    var firstIndex = PRODUCTS.findIndex(function (p) { return normalizeCategory(p.category) === newCat; });
    showProduct(firstIndex, dir);
  }

  prevBtn.addEventListener('click', function () { showRelativeInCategory(-1); });
  nextBtn.addEventListener('click', function () { showRelativeInCategory(1); });
  nextItemBtn.addEventListener('click', function () { showRelativeCategory(1); });
  popOnClick(prevBtn);
  popOnClick(nextBtn);
  popOnClick(nextItemBtn);
  popOnClick(addToCartBtn);
  popOnClick(cartBtn);

  // ---- Arrow-key navigation (desktop) ----
  // Left/Right mirror the prev/next buttons; Down mirrors Next Item, and
  // Up walks the same category list backward — there's no separate
  // "prev item" button on screen, so the keyboard is the only way to
  // reach that direction.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); showRelativeInCategory(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); showRelativeInCategory(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); showRelativeCategory(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); showRelativeCategory(-1); }
  });

  // ---- Swipe left/right (mobile) ----
  // Delegated onto the viewport itself rather than each image, since
  // .product-img elements get swapped out on every navigation.
  // suppressNextClick stops a swipe gesture's touchend from also
  // triggering the image's own click-to-zoom handler.
  var touchStartX = 0, touchStartY = 0, touchActive = false, suppressNextClick = false;
  var SWIPE_THRESHOLD = 50;
  viewport.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  viewport.addEventListener('touchend', function (e) {
    if (!touchActive) return;
    touchActive = false;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
    suppressNextClick = true;
    showRelativeInCategory(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ---- Pinch to zoom (mobile) ----
  // A two-finger pinch on the product photo opens/closes the exact same
  // overlay tapping it does (see wireZoom) — not a continuously-scaling
  // photo viewer, just pinch as a second, more natural-feeling trigger
  // for the same "show it bigger" gesture. The touchmove listener's
  // preventDefault (needs { passive: false } to be allowed to fire at
  // all) is what actually stops the BROWSER's own native pinch-zoom
  // from also kicking in and scaling the whole page — the reported bug.
  // zoomBackdrop gets the same preventDefault treatment below since a
  // pinch with fingers on its dimmed margin (rather than the photo
  // itself) never reaches this element at all.
  function touchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  var PINCH_OPEN_RATIO = 1.15;  // fingers spread >15% opens
  var PINCH_CLOSE_RATIO = 0.85; // fingers pinched in >15% closes
  var pinchStartDist = 0;
  var pinchHandled = false;
  viewport.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) return;
    // A second finger landing mid-gesture means the swipe tracker above
    // already latched touchActive=true off the first one — left alone,
    // its eventual touchend (now reporting wherever a pinching finger
    // ended up, compared against where the FIRST finger started) reads
    // as a huge, spurious swipe and navigates to the next/prev product
    // right as the pinch ends. Cancelling it here is what stops that.
    touchActive = false;
    pinchStartDist = touchDistance(e.touches);
    pinchHandled = false;
  }, { passive: true });
  viewport.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    if (pinchHandled || !pinchStartDist || !currentImg) return;
    var ratio = touchDistance(e.touches) / pinchStartDist;
    var zoomed = currentImg.classList.contains('is-zoomed');
    if (ratio >= PINCH_OPEN_RATIO && !zoomed) {
      currentImg.classList.add('is-zoomed');
      zoomBackdrop.classList.add('is-active');
      pinchHandled = true;
    } else if (ratio <= PINCH_CLOSE_RATIO && zoomed) {
      currentImg.classList.remove('is-zoomed');
      zoomBackdrop.classList.remove('is-active');
      pinchHandled = true;
    }
  }, { passive: false });
  zoomBackdrop.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2) e.preventDefault();
  }, { passive: false });

  // ---- Add to Cart / cart badge ----
  // Same localStorage cart cart.html already reads (knobsock_cart) — a
  // matching productId+color line just bumps quantity instead of
  // duplicating.
  var CART_KEY = 'knobsock_cart';
  var ADD_TO_CART_IMG = '/store-btn-addtocart.webp';
  var ADDED_IMG = '/store-btn-added.webp';
  var addToCartResetTimer = null;
  function getCart() {
    try {
      var raw = localStorage.getItem(CART_KEY);
      var cart = raw ? JSON.parse(raw) : [];
      return Array.isArray(cart) ? cart : [];
    } catch (err) { return []; }
  }
  function updateCartBadge() {
    var count = getCart().reduce(function (sum, l) { return sum + (l.quantity || 0); }, 0);
    cartBadge.hidden = count === 0;
    cartBadge.textContent = count > 99 ? '99+' : String(count);
  }
  // A shake, not a status-text message — there's no status-line element
  // near Add to Cart the way admin.html's modals have, and a quick nudge
  // on the sizes themselves points straight at what needs picking.
  // Remove-before-add (+ the offsetWidth reflow) mirrors popOnClick's own
  // restart trick, so mashing Add to Cart repeatedly without picking a
  // size keeps re-triggering the shake instead of doing nothing after
  // the first tap.
  function promptSelectSize() {
    sizeOptions.classList.remove('is-shaking');
    void sizeOptions.offsetWidth;
    sizeOptions.classList.add('is-shaking');
  }

  addToCartBtn.addEventListener('click', function () {
    if (!PRODUCTS.length) return;
    var product = PRODUCTS[activeIndex];
    if ((product.sizes || []).length && !selectedSize) {
      promptSelectSize();
      return;
    }
    var color = (product.colors || [])[selectedColorIndex];

    var cart = getCart();
    var existing = cart.find(function (l) {
      return l.productId === product.id && (l.color || '') === (color ? color.name : '') && (l.size || '') === selectedSize;
    });
    if (existing) {
      existing.quantity = Math.min(20, existing.quantity + 1);
    } else {
      cart.push({
        productId: product.id,
        title: product.title,
        image: product.image,
        color: color ? color.name : '',
        size: selectedSize,
        quantity: 1,
        priceCents: product.priceCents || 0
      });
    }
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (err) { /* storage full/blocked */ }
    updateCartBadge();

    addToCartImg.src = ADDED_IMG;
    clearTimeout(addToCartResetTimer);
    addToCartResetTimer = setTimeout(function () {
      addToCartImg.src = ADD_TO_CART_IMG;
    }, 1400);
  });

  updateCartBadge();

  loadProducts().then(function (products) {
    PRODUCTS = products;
    showProduct(0, 1);
  });
})();
</script>
