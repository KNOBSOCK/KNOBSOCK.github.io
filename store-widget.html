<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Store</title>
<style>
  /* Same shell/theme system as photos-widget.html and the other widgets on
     this site (CSS vars, .bg-glow, a frosted card, hover-pop tiles), just
     pink instead of orange/blue/gold/red.

     Products normally come straight from Firestore's store_products
     collection (added/edited from admin.html's Store tab) — see
     loadProducts() near the bottom of the script. Whenever there are zero
     active products (nothing added yet, or everything's a draft), this
     falls back to the "opening soon" category preview instead of an empty
     grid.

     TEMPORARY: Firebase's store rules aren't deployed yet, so
     STORE_LOCAL_MODE below reads from the same browser-local copy
     admin.html's Store tab writes to instead of Firestore — see that
     file's own comment on its matching flag. Flip both back to false once
     Firebase's store rules and Storage rules are deployed for real. */
  :root {
    --ink: #4a0a2e;
    --panel-2: rgba(74, 10, 46, 0.8);
    --line: rgba(255, 170, 210, 0.6);
    --accent: #ff4fa8;
    --accent-dim: #a3195f;
    --accent-yellow: #ffdd00;
    --text: #ffffff;
    --text-dim: #ffd6ec;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;
    /* Shared between .bg-glow and .layout below so the panel's edges and
       the content's padding can never drift apart at any window size. */
    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { position: relative; }

  /* Full-bleed edge-to-edge frosted wash, same technique as every other
     widget's .bg-glow — a width cap here while .layout's height is free to
     grow unbounded is what would make the widget elongate instead of
     scaling proportionally on a big/zoomed-out window. */
  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(255, 79, 168, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  .layout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  /* ---------- THE CARD ----------
     One panel, not a main-pane/side-pane split like photos or video — a
     store is fundamentally one browsable grid, so it gets the same
     frosted-card shape those widgets' own side panes use (.grid-card in
     photos-widget.html), just as the whole widget instead of half of it,
     and with no header bar of its own — store.html's own big logo above
     this iframe already says KNOBSOCK STORE, so repeating that in a
     second, smaller bar in here just duplicated it. position:relative so
     .cart-btn below can pin to its corner without its own header row. */
  .store-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .store-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: clamp(14px, 2.6vw, 22px) clamp(12px, 2.6vw, 18px);
  }
  .store-body::-webkit-scrollbar { width: 8px; }
  .store-body::-webkit-scrollbar-track { background: transparent; }
  .store-body::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }

  /* ---------- CART BUTTON ----------
     Pinned to the card's own corner rather than living in a header bar —
     see the comment on .store-card above for why there isn't one. Only
     shown once there's an actual store to shop from (see toggleCartBtn in
     the script) — no point offering a cart while every product is a draft. */
  .cart-btn {
    position: absolute;
    top: clamp(10px, 2.2vw, 16px);
    right: clamp(10px, 2.2vw, 16px);
    z-index: 5;
    display: none;
    width: clamp(34px, 8vw, 42px);
    aspect-ratio: 1 / 1;
    -webkit-appearance: none;
    appearance: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--line);
    color: var(--text);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s;
  }
  .cart-btn.is-visible { display: inline-flex; }
  .cart-btn:hover { background: var(--accent-dim); transform: scale(1.1) rotate(-4deg); }
  .cart-btn svg { width: 56%; height: 56%; }
  .cart-count {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 17px;
    height: 17px;
    padding: 0 3px;
    border-radius: 999px;
    background: var(--accent-yellow);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 10px;
    line-height: 17px;
    text-align: center;
    display: none;
  }
  .cart-count.is-visible { display: block; }

  /* ---------- HERO ("not open yet") ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(8px, 1.6vw, 12px);
    padding: clamp(10px, 3vw, 22px) clamp(8px, 2vw, 16px) clamp(20px, 4vw, 32px);
  }
  .hero-icon-wrap {
    width: clamp(58px, 12vw, 84px);
    height: clamp(58px, 12vw, 84px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim));
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
    color: var(--text);
    animation: bagFloat 3.6s ease-in-out infinite;
  }
  @keyframes bagFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }
  .hero-icon-wrap svg { width: 52%; height: 52%; }
  .hero-icon-wrap img { width: 68%; height: 68%; object-fit: contain; }
  .hero-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(17px, 3.6vw, 24px);
    color: var(--text);
  }
  .hero-text {
    margin: 0;
    max-width: 46ch;
    font-family: var(--font-body);
    font-size: clamp(12px, 2.6vw, 14px);
    line-height: 1.5;
    color: var(--text-dim);
  }

  /* ---------- "WHAT'S COMING" PREVIEW ---------- */
  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 clamp(10px, 2vw, 14px);
  }
  .section-label span:first-child {
    flex: 0 0 auto;
    font-family: var(--font-display);
    font-size: clamp(10px, 2.2vw, 12px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .section-line {
    flex: 1 1 auto;
    height: 1px;
    background: var(--line);
  }

  .preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(120px, 22vw, 160px), 1fr));
    gap: clamp(10px, 2vw, 14px);
  }

  /* Decorative, not clickable — cursor stays default and the hover is a
     gentle lift with no border/color change, unlike .product-card below,
     so it doesn't visually promise an action that isn't there yet. */
  .preview-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    padding: clamp(14px, 2.6vw, 20px) clamp(8px, 1.6vw, 12px);
    background: rgba(0, 0, 0, 0.16);
    border: 1px solid var(--line);
    border-radius: clamp(10px, 2vw, 14px);
    cursor: default;
    transition: transform 0.25s ease;
  }
  .preview-card:hover { transform: translateY(-3px); }
  .pc-icon {
    width: clamp(28px, 6vw, 36px);
    height: clamp(28px, 6vw, 36px);
    color: var(--accent);
  }
  .pc-icon svg { width: 100%; height: 100%; }
  .pc-name {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(12px, 2.6vw, 14px);
    color: var(--text);
  }
  .pc-tag {
    font-family: var(--font-body);
    font-size: clamp(9px, 2vw, 11px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: rgba(0, 0, 0, 0.22);
    border-radius: 999px;
    padding: 3px 10px;
  }

  /* ---------- PRODUCT GRID ----------
     Dormant (hidden, empty) until loadProducts() actually finds active
     products in Firestore — see the script. Cards are buttons (not links)
     since clicking one opens the in-widget product detail view below
     rather than navigating anywhere. */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 20vw, 160px), 1fr));
    gap: clamp(10px, 2vw, 14px);
    margin-bottom: clamp(16px, 3vw, 24px);
  }
  .product-grid[hidden] { display: none; }

  .product-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: rgba(0, 0, 0, 0.16);
    border: 1px solid var(--line);
    border-radius: clamp(10px, 2vw, 14px);
    text-align: left;
    font: inherit;
    color: inherit;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s;
  }
  .product-card:hover,
  .product-card:focus-visible {
    border-color: var(--accent);
    transform: scale(1.05) rotate(-1deg);
    z-index: 2;
  }
  .product-card:active { transform: scale(0.97); }
  .prod-thumb {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    border-radius: clamp(6px, 1.4vw, 10px);
    overflow: hidden;
    background: rgba(0, 0, 0, 0.25);
    color: var(--text-dim);
  }
  .prod-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .prod-thumb svg { width: 34%; height: 34%; }
  .prod-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 2.4vw, 13px);
    color: var(--text);
    /* Clamp to two lines rather than letting a long product name push
       every card in the row to a different height. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .prod-price {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 2.4vw, 13px);
    color: var(--accent-yellow);
  }

  /* ---------- PRODUCT DETAIL OVERLAY ----------
     Covers the widget's own bounds (position:fixed inside an iframe is
     relative to the iframe's own viewport, which here already is the
     whole store — no need for the parent-page postMessage dance
     photos-widget.html's lightbox uses, since that one deliberately needs
     to cover the logo above it too). */
  .product-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 3vw, 24px);
  }
  .product-overlay[hidden] { display: none; }
  .overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(10, 2, 7, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .product-detail {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    max-height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: clamp(12px, 2.5vw, 20px);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
  }
  @media (min-width: 561px) {
    .product-detail { flex-direction: row; }
    .detail-gallery { width: 48%; flex: 0 0 auto; }
  }
  .detail-close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 30px;
    height: 30px;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .detail-close:hover { background: var(--accent-dim); }

  .detail-gallery {
    position: relative;
    aspect-ratio: 1 / 1;
    background: rgba(0, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .detail-gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-gallery svg { width: 30%; height: 30%; }
  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .gallery-nav:hover { background: var(--accent-dim); }
  .gallery-nav[hidden] { display: none; }
  .gallery-prev { left: 8px; }
  .gallery-next { right: 8px; }
  .gallery-dots {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
  }
  .gallery-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
  }
  .gallery-dots span.active { background: var(--text); }

  .detail-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.8vw, 12px);
    padding: clamp(16px, 3.4vw, 26px);
  }
  .detail-title {
    margin: 0;
    padding-right: 26px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(17px, 3.4vw, 21px);
    color: var(--text);
  }
  .detail-price {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(15px, 3vw, 18px);
    color: var(--accent-yellow);
  }
  .detail-desc {
    margin: 0;
    font-family: var(--font-body);
    font-size: clamp(12px, 2.6vw, 14px);
    line-height: 1.55;
    color: var(--text-dim);
    white-space: pre-line;
  }
  .detail-label {
    display: block;
    font-family: var(--font-body);
    font-size: clamp(10px, 2.2vw, 12px);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .detail-sizes[hidden] { display: none; }
  .size-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .size-pill {
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 2.4vw, 13px);
    border-radius: 999px;
    padding: 6px 14px;
    background: rgba(0, 0, 0, 0.24);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .size-pill:hover { border-color: var(--accent); }
  .size-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #2a0018;
  }

  .detail-qty-row { display: flex; align-items: center; gap: 12px; }
  .qty-stepper {
    display: inline-flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .qty-stepper button {
    -webkit-appearance: none;
    appearance: none;
    width: 30px;
    height: 30px;
    background: rgba(0, 0, 0, 0.24);
    border: 0;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .qty-stepper button:hover { background: var(--accent-dim); }
  .qty-stepper span {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--text);
  }

  .add-to-cart-btn {
    margin-top: auto;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(13px, 2.8vw, 15px);
    color: #2a0018;
    background: var(--accent-yellow);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .add-to-cart-btn:hover { transform: translateY(-1px); }
  .add-to-cart-btn.is-added { background: var(--accent-yellow); }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="layout">
  <div class="store-card">
    <button type="button" class="cart-btn" id="cartBtn" title="View cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9.5" cy="20" r="1.2"></circle>
        <circle cx="18" cy="20" r="1.2"></circle>
        <path d="M2.5 3h2l2.2 12.1a2 2 0 0 0 2 1.65h8.6a2 2 0 0 0 1.97-1.66L20.8 7.5H6.1"></path>
      </svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>

    <div class="store-body">
      <div class="hero">
        <span class="hero-icon-wrap" aria-hidden="true">
          <img src="/apple-touch-icon.png" alt="">
        </span>
        <h2 class="hero-title" id="heroTitle">The shop isn't open yet</h2>
        <p class="hero-text" id="heroText">We're setting things up behind the scenes.</p>
      </div>

      <!-- Populated by renderProducts() once Firestore actually has active
           products in it — hidden and empty until then. -->
      <div class="product-grid" id="productGrid" hidden></div>

      <div class="preview-section" id="previewSection">
        <div class="section-label"><span>What's coming</span><span class="section-line" aria-hidden="true"></span></div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>
    </div>
  </div>
</div>

<div class="product-overlay" id="productOverlay" hidden>
  <div class="overlay-backdrop" id="overlayBackdrop"></div>
  <div class="product-detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button type="button" class="detail-close" id="detailClose" aria-label="Close">&times;</button>
    <div class="detail-gallery" id="detailGallery">
      <img id="detailImg" src="" alt="" hidden>
      <svg id="detailImgFallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8h12l1 12.5a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5L6 8Z"/>
        <path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>
      </svg>
      <button type="button" class="gallery-nav gallery-prev" id="galleryPrev" hidden aria-label="Previous photo">&lsaquo;</button>
      <button type="button" class="gallery-nav gallery-next" id="galleryNext" hidden aria-label="Next photo">&rsaquo;</button>
      <div class="gallery-dots" id="galleryDots"></div>
    </div>
    <div class="detail-info">
      <h3 class="detail-title" id="detailTitle"></h3>
      <div class="detail-price" id="detailPrice"></div>
      <p class="detail-desc" id="detailDesc"></p>
      <div class="detail-sizes" id="detailSizes" hidden>
        <span class="detail-label">Size</span>
        <div class="size-pills" id="sizePills"></div>
      </div>
      <div class="detail-qty-row">
        <span class="detail-label" style="margin-bottom:0;">Qty</span>
        <div class="qty-stepper">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">&minus;</button>
          <span id="qtyValue">1</span>
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button type="button" class="add-to-cart-btn" id="addToCartBtn">Add to Cart</button>
    </div>
  </div>
</div>

<!-- ============================================================
     FIREBASE — same project as the other widgets/admin.html, read-only
     here: this widget only ever reads published products, never writes
     them (that happens from admin.html's Store tab). Guarded the same way
     photos-widget.html guards its own Firebase read — a blocked/failed
     load just means the "opening soon" preview shows, not a broken page. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

    const db = firebase.firestore();

  }
</script>

<script>
(function () {
  var CART_KEY = 'knobsock_cart';

  // See the big comment at the top of this file's <style> block — keep
  // this in sync with admin.html's Store tab flag/key of the same name.
  var STORE_LOCAL_MODE = true;
  var STORE_LOCAL_KEY = 'knobsock_store_products_local';

  function localLoadProducts() {
    try {
      var raw = localStorage.getItem(STORE_LOCAL_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (err) { return []; }
  }

  // Small hand-drawn stroke icons, same style/viewBox as the magnify and
  // lightbox icons in photos-widget.html — no icon library needed for
  // four simple shapes.
  var ICONS = {
    shirt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.3 3.6 4 6.5l2.1 3.2L9.3 8v12.5h5.4V8l3.2 1.7L20 6.5l-5.3-2.9Q12 5.4 9.3 3.6Z"/></svg>',
    cap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.2"/><line x1="12" y1="5.2" x2="12" y2="6.6"/><path d="M4 15a8 8 0 0 1 16 0"/><path d="M3 15h18"/></svg>',
    sticker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l5 5v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M15 4v4a1 1 0 0 0 1 1h4"/><path d="M8.5 13.5c1 1 2 1.3 3 0s2-1 3 0"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9.5" width="17" height="10.5" rx="1"/><path d="M3.5 13.5h17"/><path d="M12 9.5v10.5"/><path d="M12 9.5C9 9.5 8 8 8 6.5A2 2 0 0 1 12 5.5 2 2 0 0 1 16 6.5c0 1.5-1 3-4 3Z"/></svg>'
  };

  var CATEGORIES = [
    { name: 'Apparel', icon: ICONS.shirt },
    { name: 'Accessories', icon: ICONS.cap },
    { name: 'Stickers & Prints', icon: ICONS.sticker },
    { name: 'Mystery Drops', icon: ICONS.gift }
  ];

  var heroTitle = document.getElementById('heroTitle');
  var heroText = document.getElementById('heroText');
  var previewSection = document.getElementById('previewSection');
  var previewGrid = document.getElementById('previewGrid');
  var productGrid = document.getElementById('productGrid');
  var cartBtn = document.getElementById('cartBtn');
  var cartCount = document.getElementById('cartCount');

  var PRODUCTS = []; // whatever loadProducts() most recently resolved

  function renderCategoryPreview() {
    previewGrid.innerHTML = CATEGORIES.map(function (cat) {
      return '<div class="preview-card">' +
        '<span class="pc-icon">' + cat.icon + '</span>' +
        '<span class="pc-name">' + cat.name + '</span>' +
        '<span class="pc-tag">Coming soon</span>' +
        '</div>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatCents(cents) {
    return '$' + (Math.max(0, cents | 0) / 100).toFixed(2);
  }

  function renderProducts(products) {
    PRODUCTS = products;
    heroTitle.textContent = 'KNOBSOCK Store';
    heroText.hidden = true;
    previewSection.hidden = true;
    productGrid.hidden = false;
    cartBtn.classList.add('is-visible');

    productGrid.innerHTML = products.map(function (p, i) {
      var thumb = p.images[0]
        ? '<img src="' + escapeHtml(p.images[0]) + '" alt="" loading="lazy" decoding="async">'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 12.5a1 1 0 0 1-1 1.5H6a1 1 0 0 1-1-1.5L6 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
      return '<button type="button" class="product-card" data-index="' + i + '">' +
        '<span class="prod-thumb">' + thumb + '</span>' +
        '<span class="prod-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="prod-price">' + formatCents(p.priceCents) + '</span>' +
        '</button>';
    }).join('');

    Array.prototype.forEach.call(productGrid.querySelectorAll('.product-card'), function (btn) {
      btn.addEventListener('click', function () {
        openProductDetail(PRODUCTS[parseInt(btn.dataset.index, 10)], btn);
      });
    });
  }

  // ====================================================================
  // Where products actually come from: whatever's marked active in the
  // store_products collection, in the order set from admin.html's Store
  // tab. Zero results (nothing added yet, or Firestore didn't load) falls
  // back to the "opening soon" category preview instead of an empty grid.
  // ====================================================================
  function loadProducts() {
    if (STORE_LOCAL_MODE) {
      var local = localLoadProducts()
        .filter(function (d) { return d.active === true; })
        .sort(function (a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); })
        .map(function (d) {
          return {
            id: d.id,
            title: d.title || 'Untitled',
            description: d.description || '',
            priceCents: typeof d.priceCents === 'number' ? d.priceCents : 0,
            images: Array.isArray(d.images) ? d.images.filter(Boolean) : [],
            sizes: Array.isArray(d.sizes) ? d.sizes.filter(Boolean) : []
          };
        });
      return Promise.resolve(local);
    }

    if (!STORE_PRODUCTS_REF) return Promise.resolve([]);
    return STORE_PRODUCTS_REF.where('active', '==', true).orderBy('sortOrder').get()
      .then(function (snap) {
        return snap.docs.map(function (doc) {
          var d = doc.data();
          return {
            id: doc.id,
            title: d.title || 'Untitled',
            description: d.description || '',
            priceCents: typeof d.priceCents === 'number' ? d.priceCents : 0,
            images: Array.isArray(d.images) ? d.images.filter(Boolean) : [],
            sizes: Array.isArray(d.sizes) ? d.sizes.filter(Boolean) : []
          };
        });
      })
      .catch(function (err) {
        // If this logs a "requires an index" error, Firestore's own
        // message includes a link that creates it in one click — this
        // specific shape (one equality filter + orderBy a different
        // field) normally doesn't need one, but if that ever changes,
        // that link is the fix, not a code change here.
        console.error('Failed to load store products', err);
        return [];
      });
  }

  loadProducts().then(function (products) {
    if (products && products.length) renderProducts(products);
    else renderCategoryPreview();
  });

  // ====================================================================
  // CART — plain localStorage, shared with cart.html (same origin, so it
  // reads the exact same key). Each line is { productId, title,
  // priceCents, image, size, quantity }; productId+size together decide
  // whether an "Add to Cart" merges into an existing line or starts a
  // new one.
  // ====================================================================
  function getCart() {
    try {
      var raw = localStorage.getItem(CART_KEY);
      var cart = raw ? JSON.parse(raw) : [];
      return Array.isArray(cart) ? cart : [];
    } catch (err) {
      return [];
    }
  }

  function saveCart(cart) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (err) { /* storage full/blocked — cart just won't persist this time */ }
    updateCartBadge(cart);
  }

  function updateCartBadge(cart) {
    cart = cart || getCart();
    var total = cart.reduce(function (sum, line) { return sum + (line.quantity || 0); }, 0);
    cartCount.textContent = total > 99 ? '99+' : String(total);
    cartCount.classList.toggle('is-visible', total > 0);
  }

  function addToCart(line) {
    var cart = getCart();
    var existing = cart.find(function (l) { return l.productId === line.productId && l.size === line.size; });
    if (existing) existing.quantity += line.quantity;
    else cart.push(line);
    saveCart(cart);
  }

  updateCartBadge();

  cartBtn.addEventListener('click', function () {
    // Escapes the iframe on purpose — the cart is its own top-level page
    // (store.html only embeds the browse experience), same target="_top"
    // pattern the site's other cross-page links already use.
    window.top.location.href = '/cart.html';
  });

  // ====================================================================
  // PRODUCT DETAIL OVERLAY
  // ====================================================================
  var overlay = document.getElementById('productOverlay');
  var overlayBackdrop = document.getElementById('overlayBackdrop');
  var detailClose = document.getElementById('detailClose');
  var detailImg = document.getElementById('detailImg');
  var detailImgFallback = document.getElementById('detailImgFallback');
  var galleryPrev = document.getElementById('galleryPrev');
  var galleryNext = document.getElementById('galleryNext');
  var galleryDots = document.getElementById('galleryDots');
  var detailTitle = document.getElementById('detailTitle');
  var detailPrice = document.getElementById('detailPrice');
  var detailDesc = document.getElementById('detailDesc');
  var detailSizes = document.getElementById('detailSizes');
  var sizePills = document.getElementById('sizePills');
  var qtyValue = document.getElementById('qtyValue');
  var qtyMinus = document.getElementById('qtyMinus');
  var qtyPlus = document.getElementById('qtyPlus');
  var addToCartBtn = document.getElementById('addToCartBtn');

  var currentProduct = null;
  var currentImageIndex = 0;
  var currentSize = '';
  var currentQty = 1;
  var lastFocusedEl = null;
  var addedTimer = null;

  function renderGalleryImage() {
    var images = currentProduct.images;
    if (images.length) {
      detailImg.src = images[currentImageIndex];
      detailImg.hidden = false;
      detailImgFallback.hidden = true;
    } else {
      detailImg.hidden = true;
      detailImgFallback.hidden = false;
    }
    var multi = images.length > 1;
    galleryPrev.hidden = !multi;
    galleryNext.hidden = !multi;
    galleryDots.innerHTML = multi ? images.map(function (_, i) {
      return '<span class="' + (i === currentImageIndex ? 'active' : '') + '"></span>';
    }).join('') : '';
  }

  function renderSizePills() {
    var sizes = currentProduct.sizes;
    detailSizes.hidden = !sizes.length;
    if (!sizes.length) { currentSize = ''; return; }
    if (sizes.indexOf(currentSize) === -1) currentSize = sizes[0];
    sizePills.innerHTML = sizes.map(function (s) {
      return '<button type="button" class="size-pill' + (s === currentSize ? ' active' : '') + '" data-size="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
    }).join('');
    Array.prototype.forEach.call(sizePills.querySelectorAll('.size-pill'), function (btn) {
      btn.addEventListener('click', function () {
        currentSize = btn.dataset.size;
        renderSizePills();
      });
    });
  }

  function openProductDetail(product, triggerEl) {
    currentProduct = product;
    currentImageIndex = 0;
    currentSize = '';
    currentQty = 1;
    lastFocusedEl = triggerEl || null;

    detailTitle.textContent = product.title;
    detailPrice.textContent = formatCents(product.priceCents);
    detailDesc.textContent = product.description;
    detailDesc.hidden = !product.description;
    qtyValue.textContent = '1';
    addToCartBtn.textContent = 'Add to Cart';
    addToCartBtn.classList.remove('is-added');

    renderGalleryImage();
    renderSizePills();

    overlay.hidden = false;
    detailClose.focus();
    document.addEventListener('keydown', handleOverlayKeydown);
  }

  function closeProductDetail() {
    overlay.hidden = true;
    document.removeEventListener('keydown', handleOverlayKeydown);
    if (lastFocusedEl) lastFocusedEl.focus();
  }

  function handleOverlayKeydown(e) {
    if (e.key === 'Escape' || e.key === 'Esc') closeProductDetail();
  }

  detailClose.addEventListener('click', closeProductDetail);
  overlayBackdrop.addEventListener('click', closeProductDetail);

  galleryPrev.addEventListener('click', function () {
    currentImageIndex = (currentImageIndex - 1 + currentProduct.images.length) % currentProduct.images.length;
    renderGalleryImage();
  });
  galleryNext.addEventListener('click', function () {
    currentImageIndex = (currentImageIndex + 1) % currentProduct.images.length;
    renderGalleryImage();
  });

  qtyMinus.addEventListener('click', function () {
    currentQty = Math.max(1, currentQty - 1);
    qtyValue.textContent = String(currentQty);
  });
  qtyPlus.addEventListener('click', function () {
    currentQty = Math.min(20, currentQty + 1);
    qtyValue.textContent = String(currentQty);
  });

  addToCartBtn.addEventListener('click', function () {
    addToCart({
      productId: currentProduct.id,
      title: currentProduct.title,
      priceCents: currentProduct.priceCents,
      image: currentProduct.images[0] || '',
      size: currentSize,
      quantity: currentQty
    });

    addToCartBtn.textContent = 'Added ✓';
    addToCartBtn.classList.add('is-added');
    clearTimeout(addedTimer);
    addedTimer = setTimeout(closeProductDetail, 700);
  });
})();
</script>

</body>
</html>
