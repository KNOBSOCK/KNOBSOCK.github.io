<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos">
<meta property="og:title" content="Videos - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Videos - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild of knobsock.net/videos, same approach as
     main/index.html: a real hosted page instead of the Universe static
     export that used to live here.

     No embedded video player anymore — this used to iframe in
     video-playlist-widget.html (the same admin-managed Video List
     index.html's own player still reads, untouched by this change).
     In its place: a grid of one button per creator from that same
     admin list's Creators section, each one linking wherever
     admin.html's per-creator Link field points it — its own
     destination, not necessarily anything on this site. Reads
     creatorOrder/creatorLinks/creatorPhotos/creatorSounds straight off
     playlist/main, live, same Firestore doc and same project every
     other widget here already uses.

     Every button IS a creator's own uploaded image now — no text, no
     button chrome, nothing rendered at all for a creator that hasn't
     had one uploaded in admin.html yet (see renderGrid below). An
     optional per-creator sound (also admin-uploaded) plays on click;
     when a button has both a sound and a link, the sound gets a moment
     to actually be heard before navigating away, rather than being cut
     off instantly by the page unload. */

  :root {
    --ink: #0a2a4a;
    --panel-2: rgba(10, 42, 74, 0.8);
    --line: rgba(150, 200, 255, 0.6);
    --accent-dim: #1c4e8a;
    --accent-yellow: #ffdd00;
    --text: #ffffff;
    --text-dim: #c9dcf5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the picker's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* Fills whatever's left below the logo, same flex slot the old
     .player-wrap occupied — scrolls internally (rather than growing the
     whole page) if enough creators are added to overflow the box on a
     short screen. */
  .picker-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 28px);
    overflow-y: auto;
  }

  .picker-grid {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 18px);
  }

  /* No button chrome at all anymore — no background, no border, no
     text. The creator's own uploaded image (admin.html's per-creator
     "Button image") is the entire visible button; a creator with no
     image uploaded yet renders nothing here (see renderGrid in the
     script below) rather than a placeholder, per the ask: "without my
     image it would otherwise be invisible." */
  .picker-btn {
    display: block;
    padding: 0;
    border: none;
    background: none;
    line-height: 0;
    cursor: pointer;
  }
  /* A plain <img>, no wrapper element, for a creator with an image but
     neither a link nor a sound — nothing to click for, so it's not
     interactive at all (see renderGrid). */
  .picker-btn-image {
    display: block;
    width: auto;
    height: auto;
    max-width: min(46vw, 260px);
    max-height: 34vh;
  }
  /* Darkens on hover (mouse) or tap (touch, via :active) — no lift, no
     pop, just the one plain feedback state, same as the old Win98
     button had. Only applies to an actually-clickable button (an
     image-only, non-interactive creator has no .picker-btn wrapper to
     match this selector at all). */
  .picker-btn:hover .picker-btn-image,
  .picker-btn:active .picker-btn-image {
    filter: brightness(0.82);
  }

  .picker-empty {
    color: var(--text-dim);
    text-align: center;
    font-size: clamp(13px, 2.4vw, 16px);
    padding: 20px;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it grow/scroll — the picker grid's own overflow-y:auto
     already handles more creators than fit, same reasoning as the
     other pages here locking around a widget's own internal scroll. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .picker-wrap {
      min-height: 0;
    }
  }

  /* Phone rotated to landscape: same one-screen lock as the portrait
     rule above, plus the logo goes away so the grid gets the whole
     screen instead of losing a chunk of an already-short viewport to a
     header — see videos/hamburgernews.html or live.html for the fuller
     version of this same comment (hover:none + pointer:coarse scope
     this to touchscreens specifically, not just any short window). */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      padding: 0;
      gap: 0;
    }
    .logo-link { display: none; }
    .picker-wrap { min-height: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/">
    <img src="/knobsock-videos-logo.png" alt="KNOBSOCK VIDEOS">
  </a>

  <div class="picker-wrap">
    <div class="picker-grid" id="pickerGrid">
      <div class="picker-empty">Loading creators…</div>
    </div>
  </div>
</div>

<!-- ============================================================
     FIREBASE — same project/doc video-playlist-widget.html itself
     reads (playlist/main). Read-only: creatorOrder (who shows up, and
     in what order), creatorLinks (where their button goes),
     creatorPhotos (the button image itself), and creatorSounds (an
     optional click sound) are all set from admin.html's Videos tab,
     live.
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const VIDEO_DOC_REF = db.collection('playlist').doc('main');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const gridEl = document.getElementById('pickerGrid');

  // A sound is given a real chance to be heard before navigating away —
  // otherwise same-tab navigation would tear down the audio context
  // almost instantly, defeating the whole point of it. Capped at 1.8s
  // so an unusually long clip (or one that never fires 'ended', e.g.
  // blocked autoplay) can't stall the click indefinitely.
  function playThenNavigate(soundSrc, href) {
    const audio = new Audio(soundSrc);
    let navigated = false;
    function go() {
      if (navigated) return;
      navigated = true;
      window.location.href = href;
    }
    audio.addEventListener('ended', go);
    setTimeout(go, 1800);
    audio.play().catch(go);
  }

  function renderGrid(creatorOrder, creatorLinks, creatorPhotos, creatorSounds) {
    if (!creatorOrder.length) {
      gridEl.innerHTML = '<div class="picker-empty">No creators yet — check back soon!</div>';
      return;
    }
    // A creator with no button image uploaded in admin.html renders
    // nothing at all here — no placeholder, no text — per the ask:
    // "without my image it would otherwise be invisible."
    const withPhoto = creatorOrder.filter(function (name) { return (creatorPhotos[name] || ''); });
    if (!withPhoto.length) {
      gridEl.innerHTML = '<div class="picker-empty">No creators yet — check back soon!</div>';
      return;
    }
    gridEl.innerHTML = withPhoto.map(function (name) {
      const photo = creatorPhotos[name];
      const imgHtml = '<img class="picker-btn-image" src="' + escapeHtml(photo) + '" alt="">';
      const link = (creatorLinks[name] || '').trim();
      const sound = creatorSounds[name] || '';
      if (!link && !sound) {
        // Nothing to click for — a plain, non-interactive image.
        return imgHtml;
      }
      if (link && !sound) {
        // A plain <a href> — no JS needed, native navigation (including
        // ctrl/cmd-click opening a new tab) just works unmodified.
        return '<a class="picker-btn" href="' + escapeHtml(link) + '">' + imgHtml + '</a>';
      }
      if (sound && !link) {
        // Nowhere to navigate — just plays the sound.
        return '<button type="button" class="picker-btn" data-sound="' + escapeHtml(sound) + '">' + imgHtml + '</button>';
      }
      // Both set: a real <a href> (kept for accessibility/right-click/
      // hover-preview), but a click plays the sound first and delays
      // navigation just long enough for it to be heard.
      return '<a class="picker-btn" href="' + escapeHtml(link) + '" data-sound="' + escapeHtml(sound) + '">' + imgHtml + '</a>';
    }).join('');

    gridEl.querySelectorAll('.picker-btn[data-sound]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        // A modifier/middle click means "open in a new tab" — leave that
        // to the browser's own default handling rather than hijacking it
        // for the sound delay.
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const href = el.getAttribute('href');
        if (href) {
          e.preventDefault();
          playThenNavigate(el.dataset.sound, href);
        } else {
          new Audio(el.dataset.sound).play().catch(function () {});
        }
      });
    });
  }

  VIDEO_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const creatorOrder = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
    const creatorLinks = (data && data.creatorLinks) || {};
    const creatorSounds = (data && data.creatorSounds) || {};
    const creatorPhotos = (data && data.creatorPhotos) || {};
    renderGrid(creatorOrder, creatorLinks, creatorPhotos, creatorSounds);
  }, function (err) {
    console.error('Could not load creators:', err);
    gridEl.innerHTML = '<div class="picker-empty">Could not load creators.</div>';
  });
})();
</script>

</body>
</html>
