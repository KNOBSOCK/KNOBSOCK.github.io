<style>
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #935b8a;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
    transform-origin: 50% 50%;
  }
  body.tv-exit {
    transform: scale(1.18);
    opacity: 0;
    pointer-events: none;
  }

  .room-scene {
    position: fixed;
    inset: 0;
  }
  .room-scene.is-zooming {
    pointer-events: none;
  }

  /* Zoom animates left/top/width/height directly (see zoomifyElement in
     the script below) rather than CSS-transform-scaling a parent, so the
     browser always lays out and paints at the real final pixel size —
     a transform: scale() would instead stretch an already-rasterized
     bitmap captured at the smaller pre-zoom size, blurring it regardless
     of source image resolution. */
  .room-bg, .tv-static, .videos-logo {
    transition: left 0.46s cubic-bezier(0.33, 0, 0.2, 1), top 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      width 0.46s cubic-bezier(0.33, 0, 0.2, 1), height 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  /* Animating left/top/width/height forces layout, unlike a compositor-
     only transform — contain tells the browser these elements' own
     layout/paint can't affect (or be affected by) anything outside
     their box, so it doesn't need to check the rest of the page on
     every animated frame. Meaningfully cheaper on mobile with no
     visual change, since these are already-isolated absolutely
     positioned leaf elements. */
  .room-bg, .tv-static, .videos-logo, .tv-featured-video, .tv-channel-static, .remote-btn {
    contain: layout paint;
  }

  .room-bg {
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }

  /* Sits behind room-bg so it only shows through the TV's transparent
     screen cutout in that artwork. mix-blend-mode: screen means its
     mostly-black frame contributes ~nothing (whatever's playing behind
     it stays fully visible) while only its bright grain/scanline
     highlights add on top — a normal opaque composite would instead
     black out most of the video underneath. */
  .tv-static {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    object-fit: cover;
    mix-blend-mode: screen;
  }

  /* Channel-switching layers, filling the same screen cutout as
     .tv-static above but stacked beneath it — the ambient static gif
     stays visible the whole time as a permanent grain/noise overlay on
     top of whatever's playing underneath. Picking a channel briefly
     shows the MP4 static as a "changing channels" transition, then cuts
     to the featured video looping behind everything. JS toggles opacity
     between these two — see tuneChannel()/resetChannel(). */
  .tv-featured-video, .tv-channel-static {
    position: absolute;
    pointer-events: none;
    object-fit: cover;
    opacity: 0;
    transition: left 0.46s cubic-bezier(0.33, 0, 0.2, 1), top 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      width 0.46s cubic-bezier(0.33, 0, 0.2, 1), height 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      opacity 0.12s linear;
  }
  .tv-featured-video { z-index: -2; }
  .tv-channel-static { z-index: -1; }
  .tv-featured-video.is-live, .tv-channel-static.is-live { opacity: 1; }

  .tv-slot {
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    pointer-events: none;
  }

  .tv-zoom-trigger {
    position: absolute;
    z-index: 2;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .tv-btn {
    flex: 0 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }
  .tv-btn img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    user-select: none;
  }
  .tv-btn-static { cursor: default; }
  .tv-btn:not(.tv-btn-static):hover,
  .tv-btn:not(.tv-btn-static):focus-visible {
    transform: scale(1.07);
    filter: drop-shadow(0 var(--pop-y, 10px) var(--pop-blur, 18px) rgba(0, 0, 0, 0.6));
  }
  .tv-btn:not(.tv-btn-static):active {
    transform: scale(0.97);
    filter: drop-shadow(0 calc(var(--pop-y, 10px) * 0.45) calc(var(--pop-blur, 18px) * 0.6) rgba(0, 0, 0, 0.55));
  }

  .tv-message {
    color: #ffffff;
    font-family: 'Gratis Neue', Arial, sans-serif;
    text-align: center;
    line-height: 1.15;
    padding: 0 6%;
  }

  /* Remote-mounted buttons: only shown once zoomed into the TV. They live
     inside #roomScene so the same CSS zoom transform that scales the room
     also scales/moves these into place on the remote — no separate camera
     math needed to keep them aligned. */
  .remote-btn {
    position: absolute;
    z-index: 4;
    padding: 0;
    border: 0;
    background: none;
    display: block;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    /* Opacity fades in together with the position/size move (both
       0.46s), so the button is never fully visible while still sliding
       into place — a tap aimed at where it's seen could otherwise land
       after it had drifted on to its final spot. */
    transition: opacity 0.46s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease,
      left 0.46s cubic-bezier(0.33, 0, 0.2, 1), top 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      width 0.46s cubic-bezier(0.33, 0, 0.2, 1), height 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  /* .remote-btn's own display:block otherwise wins over the UA
     stylesheet's [hidden]{display:none} at equal specificity — needed
     for remoteSelectBtn, which is hidden until a channel is tuned in. */
  .remote-btn[hidden] {
    display: none;
  }
  .room-scene.is-zooming .remote-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .remote-btn:hover,
  .remote-btn:focus-visible {
    transform: scale(1.07);
    filter: drop-shadow(0 var(--pop-y, 10px) var(--pop-blur, 18px) rgba(0, 0, 0, 0.6));
  }
  .remote-btn:active {
    transform: scale(0.97);
    filter: drop-shadow(0 calc(var(--pop-y, 10px) * 0.45) calc(var(--pop-blur, 18px) * 0.6) rgba(0, 0, 0, 0.55));
  }
  .remote-btn img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* The real red remote button is intentionally tiny in the room art.
     Give it a phone-friendly invisible tap halo without enlarging the
     artwork itself. The image uses the ratio set by layout() so it stays
     perfectly centered and scales with the camera zoom. */
  #remoteBackBtn .btn-idle-img,
  #remoteBackBtn .btn-active-img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100% * var(--remote-back-visual-x, 1));
    height: calc(100% * var(--remote-back-visual-y, 1));
    transform: translate(-50%, -50%);
  }
  #remoteBackBtn .btn-active-img { display: none; }
  #remoteBackBtn.is-pressed .btn-idle-img { display: none; }
  #remoteBackBtn.is-pressed .btn-active-img { display: block; }

  .videos-logo {
    position: absolute;
    z-index: 3;
    display: block;
  }
  .videos-logo img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }

  .privacy-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    z-index: 4;
    pointer-events: none;
  }
  .privacy-footer a {
    pointer-events: auto;
    display: inline-block;
    text-decoration: underline;
    color: #fff;
    font-size: 9px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
</style>

<script>
(function () {
  var MOBILE_MAX_WIDTH = 860;
  var VARIANTS = {
    desktop: {
      src: '/videos-room-desktop.webp',
      w: 7456, h: 4194,
      tv: { cx: 3609, cy: 1414, w: 1882, h: 500 },
      tvTopY: 995,
      tvBezel: { left: 2579, top: 993, w: 2192, h: 1344 },
      // Measured directly off the remote's own art (the plain red power
      // button, and where its Hamburger News icon sits relative to it).
      remoteBack: { cx: 3478.5, cy: 1825, w: 123.9, h: 101.4 },
      // Width only — height is derived from the logo image's own natural
      // aspect ratio at layout time so it never gets stretched/squished.
      remoteHnLogo: { cx: 3597.6, cy: 1892.2, w: 124.2 },
      // The remote's own top-CENTER grid button (moved off the
      // top-left slot per direct feedback), same measure-off-the-art
      // approach as remoteBack: full outline including its black border
      // (not just the inner gray fill), else the graphic sits visibly
      // inset/small within the physical button. w here is the rendered
      // *container* width (the select image's full 144x100 padded
      // canvas) — inflated from the measured 122px button footprint by
      // 144/127 (padding correction) then another 1.15x on top per
      // direct feedback that the fitted size still looked small. cx/cy
      // shifted from the top-left button's own center by the measured
      // gap between adjacent grid buttons (same size, just relocated).
      remoteSelect: { cx: 3602.5, cy: 1997.5, w: 159 },
      // The TV screen's actual transparent cutout (measured off the art's
      // own alpha channel), sized up ~10% so the drawn bezel frames it
      // with no gap at the edges.
      tvStatic: { cx: 3693.5, cy: 1673.5, w: 2152.7, h: 1230.9 }
    },
    mobile: {
      src: '/videos-room-mobile.webp',
      w: 4511, h: 8000,
      tv: { cx: 2236, cy: 2315, w: 2047, h: 546 },
      tvTopY: 1863,
      tvBezel: { left: 1120, top: 1864, w: 2384, h: 1448 },
      tvZoomCenterX: 2242,
      tvStatic: { cx: 2329, cy: 2602.5, w: 2340.8, h: 1349.7 },
      remoteBack: { cx: 2095.5, cy: 2767.5, w: 134.6, h: 110.1 },
      remoteHnLogo: { cx: 2224.9, cy: 2840.5, w: 134.9 },
      remoteSelect: { cx: 2230.5, cy: 2955, w: 173.4 }
    }
  };
  var LOGO_ASPECT = 50 / 19;
  // knobsock-videos-logo.png has ~20% transparent padding above the
  // actual "KNOBSOCK" text within its own canvas, so positioning the
  // element's box at the intended top offset still leaves visible
  // empty space above the text itself — see the desktop-only
  // compensation below.
  var LOGO_TOP_PAD_FRAC = 0.2013;

  var bg = document.getElementById('roomBg');
  var slot = document.getElementById('tvSlot');
  var logo = document.getElementById('videosLogo');
  var roomScene = document.getElementById('roomScene');
  var tvStatic = document.getElementById('tvStatic');
  var tvZoomTrigger = document.getElementById('tvZoomTrigger');
  var remoteBackBtn = document.getElementById('remoteBackBtn');
  var remoteHnBtn = document.getElementById('remoteHnBtn');
  var remoteHnBtnImg = document.getElementById('remoteHnBtnImg');
  var remoteSelectBtn = document.getElementById('remoteSelectBtn');
  var tvFeaturedVideo = document.getElementById('tvFeaturedVideo');
  var tvChannelStatic = document.getElementById('tvChannelStatic');
  var currentVariant = null;
  var layoutBox = null;

  // remote-select-btn.webp's full canvas aspect (144x100) — the
  // container renders the whole padded canvas (img is 100%/100% of it),
  // so remoteSelect.w below is sized so the image's OPAQUE CONTENT
  // (127x82, not the full padded canvas) matches the button's actual
  // measured footprint — see the accompanying width comment.
  var SELECT_BTN_ASPECT = 100 / 144;

  // Sized by width only (see VARIANTS remoteHnLogo) — height is derived
  // from the logo photo's own natural aspect so it's never stretched,
  // and re-fit whenever Firestore swaps in a new photo.
  var hnLogoAspect = 240 / 300;
  remoteHnBtnImg.addEventListener('load', function () {
    if (remoteHnBtnImg.naturalWidth && remoteHnBtnImg.naturalHeight) {
      hnLogoAspect = remoteHnBtnImg.naturalHeight / remoteHnBtnImg.naturalWidth;
      scheduleLayout();
    }
    // Only reveal the button once its photo has actually decoded —
    // starting hidden (rather than showing a broken-image square while
    // the Firestore data URI is still being parsed) fixes the blank
    // square some phones would briefly show.
    remoteHnBtn.hidden = false;
  });

  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  // Mobile Safari fires visualViewport resize/scroll repeatedly during an
  // ordinary tap (toolbar show/hide, elastic bounce), each re-running
  // layout(). Writing sub-pixel-different values every time restarts the
  // left/top/width/height transitions mid-flight, so a zoomed button can
  // end up perpetually re-animating instead of settling — and missing
  // taps as a result. Skip the write when the value hasn't meaningfully
  // changed so an in-progress transition is left alone.
  function setStyleIfChanged(el, prop, px) {
    var current = parseFloat(el.style[prop]);
    if (!isNaN(current) && Math.abs(current - px) < 0.5) return;
    el.style[prop] = px + 'px';
  }

  function placeBox(el, box, ox, oy, s) {
    var w = box.w * s, h = box.h * s;
    setStyleIfChanged(el, 'width', w);
    setStyleIfChanged(el, 'height', h);
    setStyleIfChanged(el, 'left', ox + box.cx * s - w / 2);
    setStyleIfChanged(el, 'top', oy + box.cy * s - h / 2);
    el.style.setProperty('--pop-y', (h * 0.05) + 'px');
    el.style.setProperty('--pop-blur', (h * 0.09) + 'px');
  }

  function placeRemoteBack(box, ox, oy, s) {
    var visualW = box.w * s;
    var visualH = box.h * s;
    // 18px on all sides produces a reliable 50px-plus target on phones
    // while leaving the visible remote drawing at its exact art size.
    var hitPad = 18;
    var hitW = visualW + hitPad * 2;
    var hitH = visualH + hitPad * 2;
    setStyleIfChanged(remoteBackBtn, 'width', hitW);
    setStyleIfChanged(remoteBackBtn, 'height', hitH);
    setStyleIfChanged(remoteBackBtn, 'left', ox + box.cx * s - hitW / 2);
    setStyleIfChanged(remoteBackBtn, 'top', oy + box.cy * s - hitH / 2);
    remoteBackBtn.style.setProperty('--remote-back-visual-x', visualW / hitW);
    remoteBackBtn.style.setProperty('--remote-back-visual-y', visualH / hitH);
    remoteBackBtn.style.setProperty('--pop-y', (visualH * 0.05) + 'px');
    remoteBackBtn.style.setProperty('--pop-blur', (visualH * 0.09) + 'px');
  }

  function layout() {
    var vp = viewportSize();
    var name = vp.w <= MOBILE_MAX_WIDTH ? 'mobile' : 'desktop';
    var v = VARIANTS[name];
    if (name !== currentVariant) {
      currentVariant = name;
      bg.src = v.src;
    }

    var s = Math.max(vp.w / v.w, vp.h / v.h);
    var aw = v.w * s;
    var ah = v.h * s;
    var ox = (vp.w - aw) / 2;
    var oy = (vp.h - ah) / 2;

    bg.style.width = aw + 'px';
    bg.style.height = ah + 'px';
    bg.style.left = ox + 'px';
    bg.style.top = oy + 'px';

    tvZoomTrigger.style.width = (v.tvBezel.w * s) + 'px';
    tvZoomTrigger.style.height = (v.tvBezel.h * s) + 'px';
    tvZoomTrigger.style.left = (ox + v.tvBezel.left * s) + 'px';
    tvZoomTrigger.style.top = (oy + v.tvBezel.top * s) + 'px';

    layoutBox = { ox: ox, oy: oy, s: s, v: v };

    var bw = v.tv.w * s;
    var bh = v.tv.h * s;
    slot.style.width = bw + 'px';
    slot.style.height = bh + 'px';
    slot.style.left = (ox + v.tv.cx * s - bw / 2) + 'px';
    slot.style.top = (oy + v.tv.cy * s - bh / 2) + 'px';
    slot.style.gap = (bh * 0.14) + 'px';
    slot.style.fontSize = Math.max(11, bh * 0.15) + 'px';
    slot.style.setProperty('--pop-y', (bh * 0.05) + 'px');
    slot.style.setProperty('--pop-blur', (bh * 0.09) + 'px');

    placeBox(tvStatic, v.tvStatic, ox, oy, s);
    placeBox(tvFeaturedVideo, v.tvStatic, ox, oy, s);
    placeBox(tvChannelStatic, v.tvStatic, ox, oy, s);
    placeRemoteBack(v.remoteBack, ox, oy, s);
    placeBox(remoteHnBtn, {
      cx: v.remoteHnLogo.cx, cy: v.remoteHnLogo.cy,
      w: v.remoteHnLogo.w, h: v.remoteHnLogo.w * hnLogoAspect
    }, ox, oy, s);
    placeBox(remoteSelectBtn, {
      cx: v.remoteSelect.cx, cy: v.remoteSelect.cy,
      w: v.remoteSelect.w, h: v.remoteSelect.w * SELECT_BTN_ASPECT
    }, ox, oy, s);

    var topY = oy + v.tvTopY * s;
    var pad = Math.max(8, Math.min(20, vp.w * 0.02));
    var targetW = Math.min(vp.w * 0.7, 480);
    var targetH = targetW / LOGO_ASPECT;
    var availH = Math.max(34, topY - pad - vp.h * 0.012);
    var lh = Math.min(targetH, availH);
    // Desktop's logo is normally capped by availH (the gap above the TV),
    // not targetW/targetH, so this has to scale the final size directly —
    // bumping targetW wouldn't do anything visible on its own.
    var logoTop = pad;
    if (name === 'desktop') {
      lh *= 1.25;
      // Shift the box up by its own top padding so the visible text
      // (not the transparent margin above it) sits at `pad` — otherwise
      // the header reads as sitting low even though the element itself
      // is right near the top.
      logoTop = pad - lh * LOGO_TOP_PAD_FRAC;
    }
    var lw = lh * LOGO_ASPECT;
    logo.style.width = lw + 'px';
    logo.style.height = lh + 'px';
    logo.style.left = ((vp.w - lw) / 2) + 'px';
    logo.style.top = logoTop + 'px';

    if (isZoomed) setCameraAnchor();
  }

  var isZoomed = false;
  var zoomTimer = null;

  function setCameraAnchor() {
    if (!layoutBox) return;
    var vp = viewportSize();
    var b = layoutBox.v.tvBezel;
    var s = layoutBox.s;
    // Cover-fit the TV bezel's own box (in art space) to the viewport,
    // the same technique used to cover-fit the whole room-bg — this
    // guarantees the bezel always fills edge-to-edge with zero wall
    // margin above it, regardless of the device's aspect ratio (a fixed
    // anchor point + flat scale factor does not give that guarantee).
    var k = Math.max(vp.w / b.w, vp.h / b.h) / s;
    var centerX = layoutBox.v.tvZoomCenterX != null ? layoutBox.v.tvZoomCenterX : (b.left + b.w / 2);
    var boxCenterX = layoutBox.ox + centerX * s;
    var boxCenterY = layoutBox.oy + (b.top + b.h / 2) * s;
    var tx = vp.w / 2 - boxCenterX * k;
    var ty = vp.h / 2 - boxCenterY * k;
    // Reposition each visible element directly to its zoomed size/place
    // (rather than CSS-transform-scaling the whole room-scene) so the
    // browser lays out and paints every image at its true final pixel
    // size. A transform: scale() on the parent would instead stretch an
    // already-rasterized bitmap captured at the smaller pre-zoom size —
    // blurry no matter how high-res the source images are.
    [bg, tvStatic, logo, remoteBackBtn, remoteHnBtn, remoteSelectBtn, tvFeaturedVideo, tvChannelStatic].forEach(function (el) {
      zoomifyElement(el, tx, ty, k);
    });
  }

  function zoomifyElement(el, tx, ty, k) {
    var left = parseFloat(el.style.left) || 0;
    var top = parseFloat(el.style.top) || 0;
    var w = parseFloat(el.style.width) || 0;
    var h = parseFloat(el.style.height) || 0;
    setStyleIfChanged(el, 'left', tx + left * k);
    setStyleIfChanged(el, 'top', ty + top * k);
    setStyleIfChanged(el, 'width', w * k);
    setStyleIfChanged(el, 'height', h * k);
  }

  var effectContext = null;
  var wooshBuffer = null;
  var wooshLoading = null;
  var legacyWoosh = null;
  function getEffectContext() {
    if (effectContext && effectContext.state !== 'closed') return effectContext;
    var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) return null;
    try { effectContext = new AudioContextCtor(); } catch (_) { effectContext = null; }
    return effectContext;
  }
  function loadWoosh() {
    var context = getEffectContext();
    if (!context) return Promise.reject(new Error('Audio effects unavailable'));
    if (wooshBuffer) return Promise.resolve(wooshBuffer);
    if (!wooshLoading) {
      wooshLoading = fetch('/woosh.m4a', { cache: 'force-cache' })
        .then(function (response) {
          if (!response.ok) throw new Error('Audio effect unavailable');
          return response.arrayBuffer();
        })
        .then(function (data) { return context.decodeAudioData(data); })
        .then(function (buffer) { wooshBuffer = buffer; return buffer; })
        .catch(function (error) { wooshLoading = null; throw error; });
    }
    return wooshLoading;
  }
  function primeWoosh() {
    var context = getEffectContext();
    if (!context) return;
    if (context.state === 'suspended') context.resume().catch(function () {});
    loadWoosh().catch(function () {});
  }
  function playLegacyWoosh() {
    var source = legacyWoosh || (legacyWoosh = new Audio('/woosh.m4a'));
    source.preload = 'none';
    try { source.pause(); source.currentTime = 0; } catch (_) {}
    source.volume = 0.7;
    var playback = source.play();
    if (playback && playback.catch) playback.catch(function () {});
  }
  function startWoosh(context, buffer) {
    try {
      var source = context.createBufferSource();
      var gain = context.createGain();
      source.buffer = buffer;
      gain.gain.value = 0.7;
      source.connect(gain);
      gain.connect(context.destination);
      source.start(0);
    } catch (_) {}
  }
  function playWoosh() {
    var context = getEffectContext();
    if (!context) { playLegacyWoosh(); return; }
    if (context.state === 'suspended') context.resume().catch(function () {});
    if (wooshBuffer) { startWoosh(context, wooshBuffer); return; }
    loadWoosh().then(function (buffer) {
      startWoosh(context, buffer);
    }).catch(function () {
      playLegacyWoosh();
    });
  }

  function playButtonClick() {
    var audio = new Audio('/buttonclick.mp3');
    audio.volume = 0.7;
    audio.play().catch(function () {});
  }

  function playRemoteButtonClick() {
    var audio = new Audio('/remotebuttonclick.mp3');
    audio.volume = 0.7;
    audio.play().catch(function () {});
  }

  function beginZoom() {
    isZoomed = true;
    playWoosh();
    setCameraAnchor();
    roomScene.classList.add('is-zooming');
    // Leave this disabled while zoomed as a safety margin — harmless
    // since the trigger stays tucked at its small unzoomed spot now.
    tvZoomTrigger.style.pointerEvents = 'none';
  }

  function openZoom() {
    if (isZoomed || !layoutBox) return;
    beginZoom();
  }

  function closeZoom() {
    if (!isZoomed) return;
    isZoomed = false;
    playRemoteButtonClick();
    tvZoomTrigger.style.pointerEvents = '';
    resetChannel();
    layout(); // snap bg/tvStatic/logo/remote buttons back to unzoomed size/place
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(function () {
      roomScene.classList.remove('is-zooming');
    }, 90);
  }

  // --- Channel tuning: click a creator on the remote, briefly see static
  // like you're changing the channel, then it cuts to their featured
  // video playing (muted, no controls, starting partway through like it
  // was already broadcasting) with a SELECT button to head to their page.
  var hlsPlayer = null;
  var featuredVideoUrl = '';
  var channelSwitchTimer = null;
  var isTuned = false;
  var tunedHref = '', tunedSound = '', tunedPhoto2 = '', tunedImg = null;

  function loadFeaturedVideo(url) {
    if (!url || featuredVideoUrl === url) return;
    featuredVideoUrl = url;
    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
      hlsPlayer = new Hls();
      hlsPlayer.loadSource(url);
      hlsPlayer.attachMedia(tvFeaturedVideo);
    } else {
      tvFeaturedVideo.src = url;
    }
  }

  tvFeaturedVideo.addEventListener('loadedmetadata', function () {
    if (tvFeaturedVideo.duration && isFinite(tvFeaturedVideo.duration)) {
      try { tvFeaturedVideo.currentTime = tvFeaturedVideo.duration / 2; } catch (_) {}
    }
  });

  function resetChannel() {
    clearTimeout(channelSwitchTimer);
    isTuned = false;
    tvChannelStatic.classList.remove('is-live');
    tvFeaturedVideo.classList.remove('is-live');
    tvChannelStatic.pause();
    tvFeaturedVideo.pause();
    remoteSelectBtn.hidden = true;
  }

  function tuneChannel(opts) {
    clearTimeout(channelSwitchTimer);
    tunedHref = opts.href;
    tunedSound = opts.sound;
    tunedPhoto2 = opts.photo2;
    tunedImg = opts.img;

    // Both start muted (autoplay-safe); a real click is a user gesture,
    // so unmuting here is allowed and makes the channel switch audible.
    tvChannelStatic.muted = false;
    tvFeaturedVideo.muted = false;

    remoteSelectBtn.hidden = true;
    tvFeaturedVideo.classList.remove('is-live');
    tvFeaturedVideo.pause();
    tvChannelStatic.classList.add('is-live');
    tvChannelStatic.currentTime = 0;
    var p = tvChannelStatic.play();
    if (p && p.catch) p.catch(function () {});

    // Look up the featured-video URL now (via opts.getUrl) rather than
    // requiring it to already be loaded at click time — its own
    // Firestore fetch is separate from (and can resolve slower than)
    // the one that makes the button clickable, so gating the click on
    // it being ready already caused clicks to silently do nothing.
    function cutToVideo() {
      loadFeaturedVideo(opts.getUrl());
      tvChannelStatic.classList.remove('is-live');
      tvChannelStatic.pause();
      tvFeaturedVideo.classList.add('is-live');
      var fp = tvFeaturedVideo.play();
      if (fp && fp.catch) fp.catch(function () {});
      remoteSelectBtn.hidden = false;
      isTuned = true;
    }

    channelSwitchTimer = setTimeout(function () {
      if (opts.getUrl()) { cutToVideo(); return; }
      // Not loaded yet — keep the static playing and poll briefly
      // rather than cutting to a blank video.
      var tries = 0;
      channelSwitchTimer = setInterval(function () {
        tries++;
        if (opts.getUrl()) {
          clearInterval(channelSwitchTimer);
          cutToVideo();
        } else if (tries > 20) {
          clearInterval(channelSwitchTimer);
        }
      }, 200);
    }, 1300);
  }

  remoteSelectBtn.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (!isTuned || !tunedHref || tunedHref === '#') return;
    playButtonClick();
    if (tunedPhoto2 && tunedImg) tunedImg.src = tunedPhoto2;
    if (tunedSound) {
      playThenNavigate(tunedSound, tunedHref);
    } else {
      setTimeout(function () { navigateAfterEffect(tunedHref); }, 700);
    }
  });

  tvZoomTrigger.addEventListener('click', openZoom);
  tvZoomTrigger.addEventListener('pointerenter', primeWoosh);
  remoteBackBtn.addEventListener('click', closeZoom);
  remoteBackBtn.addEventListener('pointerdown', function () { remoteBackBtn.classList.add('is-pressed'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
    remoteBackBtn.addEventListener(evt, function () { remoteBackBtn.classList.remove('is-pressed'); });
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' || event.key === 'Esc') closeZoom();
  });

  function idlePreload(fn) {
    if (window.requestIdleCallback) window.requestIdleCallback(fn, { timeout: 2000 });
    else setTimeout(fn, 600);
  }
  idlePreload(primeWoosh);

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function playThenNavigate(soundSrc, href) {
    var audio = new Audio(soundSrc);
    audio.volume = 0.5;
    var navigated = false;
    function go() {
      if (navigated) return;
      navigated = true;
      navigateAfterEffect(href);
    }
    audio.addEventListener('ended', go);
    setTimeout(go, 1800);
    audio.play().catch(go);
  }

  function navigateAfterEffect(href) {
    /* The app shell owns the address bar.  Let it navigate only after this
       page has had time to play the button effect and swap its artwork. */
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'knobsock-shell-navigate-after-effect',
        href: href
      }, window.location.origin);
      return;
    }
    window.location.href = href;
  }

  function renderCreators(order, links, photos, sounds, photos2) {
    var withPhoto = order.filter(function (name) { return (photos[name] || '').trim(); });
    if (!withPhoto.length) {
      slot.innerHTML = '';
      return;
    }
    slot.innerHTML = withPhoto.map(function (name) {
      var img = '<img src="' + escapeHtml(photos[name]) + '" alt="' + escapeHtml(name) + '" draggable="false">';
      var link = (links[name] || '').trim();
      var sound = (sounds[name] || '').trim();
      var photo2 = (photos2[name] || '').trim();
      var extra = photo2 ? ' data-photo2="' + escapeHtml(photo2) + '"' : '';
      if (!link && !sound) return '<span class="tv-btn tv-btn-static">' + img + '</span>';
      if (link && !sound) return '<a class="tv-btn" href="' + escapeHtml(link) + '"' + (photo2 ? ' data-shell-navigate-after-effect' : '') + extra + '>' + img + '</a>';
      if (sound && !link) return '<button type="button" class="tv-btn" data-sound="' + escapeHtml(sound) + '"' + extra + '>' + img + '</button>';
      return '<a class="tv-btn" href="' + escapeHtml(link) + '" data-sound="' + escapeHtml(sound) + '" data-shell-navigate-after-effect' + extra + '>' + img + '</a>';
    }).join('');

    slot.querySelectorAll('.tv-btn[data-sound], .tv-btn[data-photo2]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var photo2 = el.dataset.photo2;
        if (photo2) {
          var img = el.querySelector('img');
          if (img) img.src = photo2;
        }
        var href = el.getAttribute('href');
        var soundSrc = el.dataset.sound;
        if (href) {
          e.preventDefault();
          document.body.classList.add('tv-exit');
          if (soundSrc) {
            playThenNavigate(soundSrc, href);
          } else {
            setTimeout(function () { navigateAfterEffect(href); }, 700);
          }
        } else if (soundSrc) {
          var audio = new Audio(soundSrc);
          audio.volume = 0.5;
          audio.play().catch(function () {});
        }
      });
    });
  }

  // Hamburger News lives on the remote now (see remoteHnBtn), not on the
  // TV screen, so it's excluded from the normal tv-slot creator list —
  // matched by name since that's how the Firestore data identifies it.
  var HAMBURGER_NEWS_NAME = 'Hamburger News with Joe Medina';
  // Which playlist doc holds each creator's episodes, so their first
  // (featured) episode can be looked up for the channel-tuning preview.
  // Add an entry here for each future creator moved onto the remote.
  var CREATOR_PLAYLIST_DOC = {};
  CREATOR_PLAYLIST_DOC[HAMBURGER_NEWS_NAME] = 'hamburgerNews';

  var hnSound = '';
  var hnPhoto2 = '';
  var hnFeaturedUrl = '';

  remoteHnBtn.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    var href = remoteHnBtn.getAttribute('href');
    if (!href || href === '#') return;
    playRemoteButtonClick();
    tuneChannel({
      getUrl: function () { return hnFeaturedUrl; },
      href: href, sound: hnSound, photo2: hnPhoto2, img: remoteHnBtnImg
    });
  });

  if (window.firebase) {
    var db = firebase.firestore(
      firebase.apps.length ? firebase.apps[0] : firebase.initializeApp({
        apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
        authDomain: "chat-for-website-efee2.firebaseapp.com",
        projectId: "chat-for-website-efee2",
        storageBucket: "chat-for-website-efee2.firebasestorage.app",
        messagingSenderId: "509309222193",
        appId: "1:509309222193:web:f487258cfba2f7f7b00410"
      }));

    db.collection('playlist').doc('main').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var order = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
      var photos = (data && data.creatorPhotos) || {};
      var links = (data && data.creatorLinks) || {};
      var sounds = (data && data.creatorSounds) || {};
      var photos2 = (data && data.creatorPhotos2) || {};

      var hnPhoto = (photos[HAMBURGER_NEWS_NAME] || '').trim();
      var hnLink = (links[HAMBURGER_NEWS_NAME] || '').trim();
      if (hnPhoto) remoteHnBtnImg.src = hnPhoto;
      remoteHnBtn.setAttribute('href', hnLink || '#');
      hnSound = (sounds[HAMBURGER_NEWS_NAME] || '').trim();
      hnPhoto2 = (photos2[HAMBURGER_NEWS_NAME] || '').trim();

      renderCreators(
        order.filter(function (name) { return name !== HAMBURGER_NEWS_NAME; }),
        links,
        photos,
        sounds,
        photos2
      );
    }, function (err) {
      console.error('Could not load creators:', err);
      slot.innerHTML = '';
    });

    var hnPlaylistDoc = CREATOR_PLAYLIST_DOC[HAMBURGER_NEWS_NAME];
    if (hnPlaylistDoc) {
      db.collection('playlist').doc(hnPlaylistDoc).onSnapshot(function (doc) {
        var data = doc.exists ? doc.data() : null;
        var videos = (data && Array.isArray(data.videos)) ? data.videos : [];
        hnFeaturedUrl = (videos[0] && videos[0].url) || '';
      }, function (err) {
        console.error('Could not load featured video:', err);
      });
    }
  }
})();
</script>

<script>
(function () {
  if (!window.firebase || !firebase.apps.length) return;
  var db = firebase.firestore(firebase.apps[0]);
  function setMeta(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.setAttribute('content', value);
  }
  db.collection('chat_config').doc('seo').get().then(function (doc) {
    var data = doc.exists ? doc.data() : null;
    var page = data && data.pages && data.pages['videos'];
    if (!page) return;
    if (page.title) {
      document.title = page.title;
      setMeta('meta[property="og:title"]', page.title);
    }
    if (page.description) {
      setMeta('meta[name="description"]', page.description);
      setMeta('meta[property="og:description"]', page.description);
    }
  }).catch(function () {});
})();
</script>
