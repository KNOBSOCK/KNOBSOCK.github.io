<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos">
<meta property="og:title" content="Videos - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Videos - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild of knobsock.net/videos, same approach as
     main/index.html: a real hosted page instead of the Universe static
     export that used to live here.

     No embedded video player anymore — this used to iframe in
     video-playlist-widget.html (the same admin-managed Video List
     index.html's own player still reads, untouched by this change).
     In its place: a grid of one button per creator from that same
     admin list's Creators section, each one linking wherever
     admin.html's new per-creator Link field points it — its own
     destination, not necessarily anything on this site. Reads
     creatorOrder/creatorLinks straight off playlist/main, live, same
     Firestore doc and same project every other widget here already
     uses. */

  :root {
    --ink: #0a2a4a;
    --panel-2: rgba(10, 42, 74, 0.8);
    --line: rgba(150, 200, 255, 0.6);
    --accent-dim: #1c4e8a;
    --accent-yellow: #ffdd00;
    --text: #ffffff;
    --text-dim: #c9dcf5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the picker's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* Fills whatever's left below the logo, same flex slot the old
     .player-wrap occupied — scrolls internally (rather than growing the
     whole page) if enough creators are added to overflow the box on a
     short screen. */
  .picker-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 28px);
    overflow-y: auto;
  }

  .picker-grid {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 18px);
  }

  /* A real Windows 98 button graphic (raised bevel, light-gray fill)
     as the background instead of a flat rounded panel — stretched to
     fill whatever size a given creator's name needs (the source image
     is soft/blurred rather than crisp pixel art to begin with, so a
     9-slice border-image wouldn't preserve genuinely sharp edges here
     anyway; a plain stretch reads the same). Sharp rectangular corners
     throughout — a real Win98 button was never rounded. Text is black,
     not this page's usual white, since it's now sitting on a light
     gray button instead of a dark blue panel; Tahoma is the same
     "looks like an old OS" font already used elsewhere on this site
     for exactly this reason (livestream-chat-widget.html,
     chat-monitor-widget.html) rather than a made-up substitute. */
  .picker-btn {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    text-decoration: none;
    font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
    font-weight: 700;
    text-align: center;
    color: #000;
    background-image: url('/SIX_7C253015-38BC-4F38-A780-1A55020546D2.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: none;
    border-radius: 0;
    padding: clamp(16px, 3.4vw, 26px) clamp(20px, 4vw, 34px);
    font-size: clamp(15px, 2.6vw, 20px);
    cursor: pointer;
  }
  /* Darkens on hover (mouse) or tap (touch, via :active) — no lift, no
     pop, just the one plain feedback state per the ask. */
  .picker-btn:not(.no-link):hover,
  .picker-btn:not(.no-link):active {
    filter: brightness(0.82);
  }
  /* Only present when admin.html's own per-creator photo upload has
     something saved — a button with no photo just stays text-only
     rather than reserving empty space for one, same as any avatar list
     where not everyone's set a picture yet. */
  .picker-btn.has-photo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .picker-avatar {
    width: clamp(48px, 9vw, 64px);
    height: clamp(48px, 9vw, 64px);
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--line);
  }
  /* A creator with no link saved yet (admin.html's own new field) —
     shown rather than hidden, so an admin who forgot to fill one in
     can tell at a glance from the live page, but visibly inert. */
  .picker-btn.no-link {
    opacity: 0.45;
    cursor: default;
  }

  .picker-empty {
    color: var(--text-dim);
    text-align: center;
    font-size: clamp(13px, 2.4vw, 16px);
    padding: 20px;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it grow/scroll — the picker grid's own overflow-y:auto
     already handles more creators than fit, same reasoning as the
     other pages here locking around a widget's own internal scroll. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .picker-wrap {
      min-height: 0;
    }
  }

  /* Phone rotated to landscape: same one-screen lock as the portrait
     rule above, plus the logo goes away so the grid gets the whole
     screen instead of losing a chunk of an already-short viewport to a
     header — see videos/hamburgernews.html or live.html for the fuller
     version of this same comment (hover:none + pointer:coarse scope
     this to touchscreens specifically, not just any short window). */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      padding: 0;
      gap: 0;
    }
    .logo-link { display: none; }
    .picker-wrap { min-height: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/">
    <img src="/knobsock-videos-logo.png" alt="KNOBSOCK VIDEOS">
  </a>

  <div class="picker-wrap">
    <div class="picker-grid" id="pickerGrid">
      <div class="picker-empty">Loading creators…</div>
    </div>
  </div>
</div>

<!-- ============================================================
     FIREBASE — same project/doc video-playlist-widget.html itself
     reads (playlist/main). Read-only: creatorOrder (who shows up, and
     in what order) and creatorLinks (where their button goes) are both
     set from admin.html's Videos tab, live.
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const VIDEO_DOC_REF = db.collection('playlist').doc('main');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const gridEl = document.getElementById('pickerGrid');

  function renderGrid(creatorOrder, creatorLinks, creatorPhotos) {
    if (!creatorOrder.length) {
      gridEl.innerHTML = '<div class="picker-empty">No creators yet — check back soon!</div>';
      return;
    }
    gridEl.innerHTML = creatorOrder.map(function (name) {
      const link = (creatorLinks[name] || '').trim();
      const photo = creatorPhotos[name] || '';
      const innerHtml = (photo ? '<img class="picker-avatar" src="' + escapeHtml(photo) + '" alt="">' : '') +
        '<span class="picker-btn-label">' + escapeHtml(name) + '</span>';
      const photoClass = photo ? ' has-photo' : '';
      if (!link) {
        return '<span class="picker-btn no-link' + photoClass + '" title="No link set yet">' + innerHtml + '</span>';
      }
      // A plain <a href> — no animation to wait for anymore, so no
      // click handler needed either; the browser's own default
      // navigation (including ctrl/cmd-click opening a new tab) just
      // works unmodified.
      return '<a class="picker-btn' + photoClass + '" href="' + escapeHtml(link) + '">' + innerHtml + '</a>';
    }).join('');
  }

  VIDEO_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const creatorOrder = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
    const creatorLinks = (data && data.creatorLinks) || {};
    const creatorPhotos = (data && data.creatorPhotos) || {};
    renderGrid(creatorOrder, creatorLinks, creatorPhotos);
  }, function (err) {
    console.error('Could not load creators:', err);
    gridEl.innerHTML = '<div class="picker-empty">Could not load creators.</div>';
  });
})();
</script>

</body>
</html>
