<style>
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #935b8a;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
    transform-origin: 50% 50%;
  }
  body.tv-exit {
    transform: scale(1.18);
    opacity: 0;
    pointer-events: none;
  }

  .room-scene {
    position: fixed;
    inset: 0;
    transform-origin: 0 0;
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .room-scene.is-zooming {
    transform: translate(var(--tv-zoom-tx, 0), var(--tv-zoom-ty, 0)) scale(var(--tv-zoom-scale, 2));
    pointer-events: none;
  }

  .room-bg {
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }

  .tv-slot {
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    pointer-events: none;
  }

  .tv-zoom-trigger {
    position: absolute;
    z-index: 2;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .tv-btn {
    flex: 0 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }
  .tv-btn img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    -webkit-user-drag: none;
    user-select: none;
  }
  .tv-btn-static { cursor: default; }
  .tv-btn:not(.tv-btn-static):hover,
  .tv-btn:not(.tv-btn-static):focus-visible {
    transform: scale(1.07);
    filter: drop-shadow(0 var(--pop-y, 10px) var(--pop-blur, 18px) rgba(0, 0, 0, 0.6));
  }
  .tv-btn:not(.tv-btn-static):active {
    transform: scale(0.97);
    filter: drop-shadow(0 calc(var(--pop-y, 10px) * 0.45) calc(var(--pop-blur, 18px) * 0.6) rgba(0, 0, 0, 0.55));
  }

  .tv-message {
    color: #ffffff;
    font-family: 'Gratis Neue', Arial, sans-serif;
    text-align: center;
    line-height: 1.15;
    padding: 0 6%;
  }

  /* Remote-mounted buttons: only shown once zoomed into the TV. They live
     inside #roomScene so the same CSS zoom transform that scales the room
     also scales/moves these into place on the remote — no separate camera
     math needed to keep them aligned. */
  .remote-btn {
    position: absolute;
    z-index: 4;
    padding: 0;
    border: 0;
    background: none;
    display: block;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }
  .room-scene.is-zooming .remote-btn {
    opacity: 1;
    pointer-events: auto;
  }
  .remote-btn:hover,
  .remote-btn:focus-visible {
    transform: scale(1.07);
    filter: drop-shadow(0 var(--pop-y, 10px) var(--pop-blur, 18px) rgba(0, 0, 0, 0.6));
  }
  .remote-btn:active {
    transform: scale(0.97);
    filter: drop-shadow(0 calc(var(--pop-y, 10px) * 0.45) calc(var(--pop-blur, 18px) * 0.6) rgba(0, 0, 0, 0.55));
  }
  .remote-btn img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  #remoteBackBtn .btn-active-img { display: none; }
  #remoteBackBtn.is-pressed .btn-idle-img { display: none; }
  #remoteBackBtn.is-pressed .btn-active-img { display: block; }

  .videos-logo {
    position: absolute;
    z-index: 3;
    display: block;
  }
  .videos-logo img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }

  .privacy-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    z-index: 4;
    pointer-events: none;
  }
  .privacy-footer a {
    pointer-events: auto;
    display: inline-block;
    text-decoration: underline;
    color: #fff;
    font-size: 9px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
</style>

<div class="room-scene" id="roomScene">
  <img class="room-bg" id="roomBg" alt="">
  <script>
    document.getElementById('roomBg').src = window.innerWidth <= 860
      ? '/videos-room-mobile.webp'
      : '/videos-room-desktop.webp';
  </script>

  <a class="videos-logo" id="videosLogo" href="/">
    <img src="/knobsock-videos-logo.png" alt="KNOBSOCK VIDEOS">
  </a>

  <button type="button" class="tv-zoom-trigger" id="tvZoomTrigger" aria-label="Zoom into the TV"></button>
  <div class="tv-slot" id="tvSlot"></div>

  <button type="button" class="remote-btn" id="remoteBackBtn" aria-label="Zoom out of the TV">
    <img class="btn-idle-img" src="/remote-back-btn.webp" alt="">
    <img class="btn-active-img" src="/remote-back-btn-active.webp" alt="">
  </button>
  <a class="remote-btn" id="remoteHnBtn" href="#" aria-label="Hamburger News" data-shell-navigate-after-effect>
    <img id="remoteHnBtnImg" src="" alt="">
  </a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  var MOBILE_MAX_WIDTH = 860;
  var VARIANTS = {
    desktop: {
      src: '/videos-room-desktop.webp',
      w: 7456, h: 4194,
      tv: { cx: 3609, cy: 1414, w: 1882, h: 500 },
      tvTopY: 995,
      tvBezel: { left: 2579, top: 993, w: 2192, h: 1344 },
      // Measured directly off the remote's own art (the plain red power
      // button, and where its Hamburger News icon sits relative to it).
      remoteBack: { cx: 3478.5, cy: 1825, w: 123.9, h: 101.4 },
      // Width only — height is derived from the logo image's own natural
      // aspect ratio at layout time so it never gets stretched/squished.
      remoteHnLogo: { cx: 3597.6, cy: 1892.2, w: 124.2 }
    },
    mobile: {
      src: '/videos-room-mobile.webp',
      w: 4511, h: 8000,
      tv: { cx: 2236, cy: 2315, w: 2047, h: 546 },
      tvTopY: 1863,
      tvBezel: { left: 1120, top: 1864, w: 2384, h: 1448 },
      tvZoomCenterX: 2242,
      remoteBack: { cx: 2095.5, cy: 2767.5, w: 134.6, h: 110.1 },
      remoteHnLogo: { cx: 2224.9, cy: 2840.5, w: 134.9 }
    }
  };
  var LOGO_ASPECT = 50 / 19;

  var bg = document.getElementById('roomBg');
  var slot = document.getElementById('tvSlot');
  var logo = document.getElementById('videosLogo');
  var roomScene = document.getElementById('roomScene');
  var tvZoomTrigger = document.getElementById('tvZoomTrigger');
  var remoteBackBtn = document.getElementById('remoteBackBtn');
  var remoteHnBtn = document.getElementById('remoteHnBtn');
  var remoteHnBtnImg = document.getElementById('remoteHnBtnImg');
  var currentVariant = null;
  var layoutBox = null;

  // Sized by width only (see VARIANTS remoteHnLogo) — height is derived
  // from the logo photo's own natural aspect so it's never stretched,
  // and re-fit whenever Firestore swaps in a new photo.
  var hnLogoAspect = 240 / 300;
  remoteHnBtnImg.addEventListener('load', function () {
    if (remoteHnBtnImg.naturalWidth && remoteHnBtnImg.naturalHeight) {
      hnLogoAspect = remoteHnBtnImg.naturalHeight / remoteHnBtnImg.naturalWidth;
      scheduleLayout();
    }
  });

  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  function placeBox(el, box, ox, oy, s) {
    var w = box.w * s, h = box.h * s;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = (ox + box.cx * s - w / 2) + 'px';
    el.style.top = (oy + box.cy * s - h / 2) + 'px';
    el.style.setProperty('--pop-y', (h * 0.05) + 'px');
    el.style.setProperty('--pop-blur', (h * 0.09) + 'px');
  }

  function layout() {
    var vp = viewportSize();
    var name = vp.w <= MOBILE_MAX_WIDTH ? 'mobile' : 'desktop';
    var v = VARIANTS[name];
    if (name !== currentVariant) {
      currentVariant = name;
      bg.src = v.src;
    }

    var s = Math.max(vp.w / v.w, vp.h / v.h);
    var aw = v.w * s;
    var ah = v.h * s;
    var ox = (vp.w - aw) / 2;
    var oy = (vp.h - ah) / 2;

    bg.style.width = aw + 'px';
    bg.style.height = ah + 'px';
    bg.style.left = ox + 'px';
    bg.style.top = oy + 'px';

    tvZoomTrigger.style.width = (v.tvBezel.w * s) + 'px';
    tvZoomTrigger.style.height = (v.tvBezel.h * s) + 'px';
    tvZoomTrigger.style.left = (ox + v.tvBezel.left * s) + 'px';
    tvZoomTrigger.style.top = (oy + v.tvBezel.top * s) + 'px';

    layoutBox = { ox: ox, oy: oy, s: s, v: v };
    if (isZoomed) setCameraAnchor();

    var bw = v.tv.w * s;
    var bh = v.tv.h * s;
    slot.style.width = bw + 'px';
    slot.style.height = bh + 'px';
    slot.style.left = (ox + v.tv.cx * s - bw / 2) + 'px';
    slot.style.top = (oy + v.tv.cy * s - bh / 2) + 'px';
    slot.style.gap = (bh * 0.14) + 'px';
    slot.style.fontSize = Math.max(11, bh * 0.15) + 'px';
    slot.style.setProperty('--pop-y', (bh * 0.05) + 'px');
    slot.style.setProperty('--pop-blur', (bh * 0.09) + 'px');

    placeBox(remoteBackBtn, v.remoteBack, ox, oy, s);
    placeBox(remoteHnBtn, {
      cx: v.remoteHnLogo.cx, cy: v.remoteHnLogo.cy,
      w: v.remoteHnLogo.w, h: v.remoteHnLogo.w * hnLogoAspect
    }, ox, oy, s);

    var topY = oy + v.tvTopY * s;
    var pad = Math.max(8, Math.min(20, vp.w * 0.02));
    var targetW = Math.min(vp.w * 0.7, 480);
    var targetH = targetW / LOGO_ASPECT;
    var availH = Math.max(34, topY - pad - vp.h * 0.012);
    var lh = Math.min(targetH, availH);
    var lw = lh * LOGO_ASPECT;
    logo.style.width = lw + 'px';
    logo.style.height = lh + 'px';
    logo.style.left = ((vp.w - lw) / 2) + 'px';
    logo.style.top = pad + 'px';
  }

  var isZoomed = false;
  var zoomTimer = null;

  function setCameraAnchor() {
    if (!layoutBox) return;
    var vp = viewportSize();
    var b = layoutBox.v.tvBezel;
    var s = layoutBox.s;
    // Cover-fit the TV bezel's own box (in art space) to the viewport,
    // the same technique used to cover-fit the whole room-bg — this
    // guarantees the bezel always fills edge-to-edge with zero wall
    // margin above it, regardless of the device's aspect ratio (a fixed
    // anchor point + flat scale factor does not give that guarantee).
    var k = Math.max(vp.w / b.w, vp.h / b.h) / s;
    var centerX = layoutBox.v.tvZoomCenterX != null ? layoutBox.v.tvZoomCenterX : (b.left + b.w / 2);
    var boxCenterX = layoutBox.ox + centerX * s;
    var boxCenterY = layoutBox.oy + (b.top + b.h / 2) * s;
    roomScene.style.setProperty('--tv-zoom-scale', k);
    roomScene.style.setProperty('--tv-zoom-tx', (vp.w / 2 - boxCenterX * k) + 'px');
    roomScene.style.setProperty('--tv-zoom-ty', (vp.h / 2 - boxCenterY * k) + 'px');
  }

  var effectContext = null;
  var wooshBuffer = null;
  var wooshLoading = null;
  var legacyWoosh = null;
  function getEffectContext() {
    if (effectContext && effectContext.state !== 'closed') return effectContext;
    var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextCtor) return null;
    try { effectContext = new AudioContextCtor(); } catch (_) { effectContext = null; }
    return effectContext;
  }
  function loadWoosh() {
    var context = getEffectContext();
    if (!context) return Promise.reject(new Error('Audio effects unavailable'));
    if (wooshBuffer) return Promise.resolve(wooshBuffer);
    if (!wooshLoading) {
      wooshLoading = fetch('/woosh.m4a', { cache: 'force-cache' })
        .then(function (response) {
          if (!response.ok) throw new Error('Audio effect unavailable');
          return response.arrayBuffer();
        })
        .then(function (data) { return context.decodeAudioData(data); })
        .then(function (buffer) { wooshBuffer = buffer; return buffer; })
        .catch(function (error) { wooshLoading = null; throw error; });
    }
    return wooshLoading;
  }
  function primeWoosh() {
    var context = getEffectContext();
    if (!context) return;
    if (context.state === 'suspended') context.resume().catch(function () {});
    loadWoosh().catch(function () {});
  }
  function playLegacyWoosh() {
    var source = legacyWoosh || (legacyWoosh = new Audio('/woosh.m4a'));
    source.preload = 'none';
    try { source.pause(); source.currentTime = 0; } catch (_) {}
    source.volume = 0.7;
    var playback = source.play();
    if (playback && playback.catch) playback.catch(function () {});
  }
  function startWoosh(context, buffer) {
    try {
      var source = context.createBufferSource();
      var gain = context.createGain();
      source.buffer = buffer;
      gain.gain.value = 0.7;
      source.connect(gain);
      gain.connect(context.destination);
      source.start(0);
    } catch (_) {}
  }
  function playWoosh() {
    var context = getEffectContext();
    if (!context) { playLegacyWoosh(); return; }
    if (context.state === 'suspended') context.resume().catch(function () {});
    if (wooshBuffer) { startWoosh(context, wooshBuffer); return; }
    loadWoosh().then(function (buffer) {
      startWoosh(context, buffer);
    }).catch(function () {
      playLegacyWoosh();
    });
  }

  function beginZoom() {
    isZoomed = true;
    playWoosh();
    setCameraAnchor();
    roomScene.classList.add('is-zooming');
  }

  function openZoom() {
    if (isZoomed || !layoutBox) return;
    beginZoom();
  }

  function closeZoom() {
    if (!isZoomed) return;
    isZoomed = false;
    playWoosh();
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(function () {
      roomScene.classList.remove('is-zooming');
    }, 90);
  }

  tvZoomTrigger.addEventListener('click', openZoom);
  tvZoomTrigger.addEventListener('pointerenter', primeWoosh);
  remoteBackBtn.addEventListener('click', closeZoom);
  remoteBackBtn.addEventListener('pointerdown', function () { remoteBackBtn.classList.add('is-pressed'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
    remoteBackBtn.addEventListener(evt, function () { remoteBackBtn.classList.remove('is-pressed'); });
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' || event.key === 'Esc') closeZoom();
  });

  function idlePreload(fn) {
    if (window.requestIdleCallback) window.requestIdleCallback(fn, { timeout: 2000 });
    else setTimeout(fn, 600);
  }
  idlePreload(primeWoosh);

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function playThenNavigate(soundSrc, href) {
    var audio = new Audio(soundSrc);
    audio.volume = 0.5;
    var navigated = false;
    function go() {
      if (navigated) return;
      navigated = true;
      navigateAfterEffect(href);
    }
    audio.addEventListener('ended', go);
    setTimeout(go, 1800);
    audio.play().catch(go);
  }

  function navigateAfterEffect(href) {
    /* The app shell owns the address bar.  Let it navigate only after this
       page has had time to play the button effect and swap its artwork. */
    if (window.parent !== window) {
      window.parent.postMessage({
        type: 'knobsock-shell-navigate-after-effect',
        href: href
      }, window.location.origin);
      return;
    }
    window.location.href = href;
  }

  function renderCreators(order, links, photos, sounds, photos2) {
    var withPhoto = order.filter(function (name) { return (photos[name] || '').trim(); });
    if (!withPhoto.length) {
      slot.innerHTML = '';
      return;
    }
    slot.innerHTML = withPhoto.map(function (name) {
      var img = '<img src="' + escapeHtml(photos[name]) + '" alt="' + escapeHtml(name) + '" draggable="false">';
      var link = (links[name] || '').trim();
      var sound = (sounds[name] || '').trim();
      var photo2 = (photos2[name] || '').trim();
      var extra = photo2 ? ' data-photo2="' + escapeHtml(photo2) + '"' : '';
      if (!link && !sound) return '<span class="tv-btn tv-btn-static">' + img + '</span>';
      if (link && !sound) return '<a class="tv-btn" href="' + escapeHtml(link) + '"' + (photo2 ? ' data-shell-navigate-after-effect' : '') + extra + '>' + img + '</a>';
      if (sound && !link) return '<button type="button" class="tv-btn" data-sound="' + escapeHtml(sound) + '"' + extra + '>' + img + '</button>';
      return '<a class="tv-btn" href="' + escapeHtml(link) + '" data-sound="' + escapeHtml(sound) + '" data-shell-navigate-after-effect' + extra + '>' + img + '</a>';
    }).join('');

    slot.querySelectorAll('.tv-btn[data-sound], .tv-btn[data-photo2]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var photo2 = el.dataset.photo2;
        if (photo2) {
          var img = el.querySelector('img');
          if (img) img.src = photo2;
        }
        var href = el.getAttribute('href');
        var soundSrc = el.dataset.sound;
        if (href) {
          e.preventDefault();
          document.body.classList.add('tv-exit');
          if (soundSrc) {
            playThenNavigate(soundSrc, href);
          } else {
            setTimeout(function () { navigateAfterEffect(href); }, 700);
          }
        } else if (soundSrc) {
          var audio = new Audio(soundSrc);
          audio.volume = 0.5;
          audio.play().catch(function () {});
        }
      });
    });
  }

  // Hamburger News lives on the remote now (see remoteHnBtn), not on the
  // TV screen, so it's excluded from the normal tv-slot creator list —
  // matched by name since that's how the Firestore data identifies it.
  var HAMBURGER_NEWS_NAME = 'Hamburger News with Joe Medina';

  remoteHnBtn.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var href = remoteHnBtn.getAttribute('href');
    if (!href || href === '#') return;
    e.preventDefault();
    document.body.classList.add('tv-exit');
    setTimeout(function () { navigateAfterEffect(href); }, 700);
  });

  if (window.firebase) {
    var db = firebase.firestore(
      firebase.apps.length ? firebase.apps[0] : firebase.initializeApp({
        apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
        authDomain: "chat-for-website-efee2.firebaseapp.com",
        projectId: "chat-for-website-efee2",
        storageBucket: "chat-for-website-efee2.firebasestorage.app",
        messagingSenderId: "509309222193",
        appId: "1:509309222193:web:f487258cfba2f7f7b00410"
      }));

    db.collection('playlist').doc('main').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var order = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
      var photos = (data && data.creatorPhotos) || {};
      var links = (data && data.creatorLinks) || {};

      var hnPhoto = (photos[HAMBURGER_NEWS_NAME] || '').trim();
      var hnLink = (links[HAMBURGER_NEWS_NAME] || '').trim();
      if (hnPhoto) remoteHnBtnImg.src = hnPhoto;
      remoteHnBtn.setAttribute('href', hnLink || '#');

      renderCreators(
        order.filter(function (name) { return name !== HAMBURGER_NEWS_NAME; }),
        links,
        photos,
        (data && data.creatorSounds) || {},
        (data && data.creatorPhotos2) || {}
      );
    }, function (err) {
      console.error('Could not load creators:', err);
      slot.innerHTML = '';
    });
  }
})();
</script>

<script>
(function () {
  if (!window.firebase || !firebase.apps.length) return;
  var db = firebase.firestore(firebase.apps[0]);
  function setMeta(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.setAttribute('content', value);
  }
  db.collection('chat_config').doc('seo').get().then(function (doc) {
    var data = doc.exists ? doc.data() : null;
    var page = data && data.pages && data.pages['videos'];
    if (!page) return;
    if (page.title) {
      document.title = page.title;
      setMeta('meta[property="og:title"]', page.title);
    }
    if (page.description) {
      setMeta('meta[name="description"]', page.description);
      setMeta('meta[property="og:description"]', page.description);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
