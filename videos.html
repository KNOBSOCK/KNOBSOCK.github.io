<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos">
<meta property="og:title" content="Videos - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Videos - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild of knobsock.net/videos, same approach as
     main/index.html: a real hosted page instead of the Universe static
     export that used to live here.

     The old export was broken for two reasons — every image pointed at
     /_assets/... paths that only exist on Universe's own servers (which
     is why the header logo showed as a broken-image icon), and the
     video widget itself never rendered at all because Universe stores
     custom-HTML blocks inside its __NEXT_DATA__ JSON and hydrates them
     with its own React runtime, which the export doesn't ship.

     So: the logo is now a real file committed to this repo, and the
     player is the same /video-playlist-widget.html iframe pattern the
     other pages here already use. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the video widget's own blue palette (its --ink) instead of
       the tiled GeoCities GIF every other non-widget page here uses, so
       the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: #0a2a4a;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(4px, 1.5vw, 12px);
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The player fills whatever's left. The widget draws its own frosted
     blue panel and handles its own responsive layout, so this is just
     the box it lives in. min-height keeps it usable on very short
     screens, where the page then scrolls instead of squashing. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  /* height:auto (not 100%) on purpose — a percentage height can't
     resolve against a flex container whose own height comes from
     flex-grow, so the iframe was collapsing to its default 150px.
     Letting the parent's default align-items:stretch size it instead
     makes it fill the row properly. */
  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/">
    <img src="/knobsock-videos-logo.png" alt="KNOBSOCK VIDEOS">
  </a>

  <div class="player-wrap">
    <iframe src="/video-playlist-widget.html"
            title="KNOBSOCK Videos"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

<script>
// The widget knows its own natural height (16:9 player + creator chin)
// and posts it over; this sizes the iframe to that instead of letting it
// stretch to the viewport. Without it the blue card ran the full height
// of the window with the player floating in the middle of it.
//
// Desktop only — on phones the widget is meant to fill the remaining
// screen, so the CSS above is left to do its job there. If the message
// never arrives (JS off, or the widget served from another origin), the
// CSS height stands and the page looks the way it did before.
(function () {
  var wrap = document.querySelector('.player-wrap');
  var frame = wrap.querySelector('iframe');
  var MOBILE = 860;

  function clear() {
    wrap.style.flex = '';
    wrap.style.height = '';
    wrap.style.minHeight = '';
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || e.data.type !== 'knobsock-widget-height') return;
    if (window.innerWidth <= MOBILE) { clear(); return; }
    wrap.style.flex = '0 0 auto';
    // min-height from the stylesheet would otherwise win over a smaller
    // measured height and keep the gap.
    wrap.style.minHeight = '0';
    // Never taller than the space actually left below the logo, so a
    // short window scrolls nothing — the widget letterboxes slightly
    // instead, which is the better of the two.
    var available = window.innerHeight - wrap.getBoundingClientRect().top - 12;
    wrap.style.height = Math.min(e.data.height, Math.max(260, available)) + 'px';
  });

  // Crossing back to the phone layout hands sizing back to the CSS.
  window.addEventListener('resize', function () {
    if (window.innerWidth <= MOBILE) clear();
  });
})();
</script>

</body>
</html>
