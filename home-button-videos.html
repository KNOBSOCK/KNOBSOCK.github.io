<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  a { text-decoration: none; color: inherit; display: block; }

  .button-item {
    position: relative;
    width: 80%;
    height: 80%;
    cursor: pointer;
  }

  .button-float {
    width: 100%;
    height: 100%;
    animation: floatY 3.6s ease-in-out infinite;
    animation-delay: 0s;
  }
  @keyframes floatY {
    0%   { transform: translateY(-3%); }
    50%  { transform: translateY(3%); }
    100% { transform: translateY(-3%); }
  }

  .button-pop {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .button-item:hover .button-pop {
    transform: scale(1.2) rotate(-3deg);
  }

  .btn-base {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .btn-icon-wrap {
    position: absolute;
    left: 50%;
    top: 30%;
    width: 100%;
    height: 56%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .btn-icon {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
  }

  /* On hover, the icon gif itself gets a fast little scale/rotate jitter
     looped on top of it — a raw <img> gif's own frame timing can't be sped
     up with CSS/JS (that's baked into the file), so this fakes "excited"
     by shaking and pulsing the whole gif faster than it could animate on
     its own. Scoped to :hover only, so it's inert the rest of the time. */
  @keyframes iconExcited {
    0%, 100% { transform: scale(1) rotate(0deg); }
    20% { transform: scale(1.08) rotate(-4deg); }
    40% { transform: scale(0.96) rotate(3deg); }
    60% { transform: scale(1.06) rotate(-3deg); }
    80% { transform: scale(0.98) rotate(2deg); }
  }
  .button-item:hover .btn-icon {
    animation: iconExcited 0.35s ease-in-out infinite;
  }
</style>
</head>
<body>

  <!-- EDIT: href is the page this button should link to; the second img's
       src is the animated gif/icon that sits on top of the blob. -->
  <a class="button-item" href="https://knobsock.net/videos" target="_top">
    <div class="button-float">
      <div class="button-pop">
        <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_3B78D67E-1306-47B2-B47F-CD20BFD335A9.PNG" width="1006" height="1436" alt="Videos">
        <div class="btn-icon-wrap">
          <img class="btn-icon" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/pic_00.gif" alt="">
        </div>
      </div>
    </div>
  </a>

</body>
</html>
