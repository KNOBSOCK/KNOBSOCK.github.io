<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Stream + Chat</title>
<style>
  :root {
    --ink: #3a0a0a;
    --panel: rgba(58, 10, 10, 0.32);
    --panel-2: rgba(58, 10, 10, 0.8);
    --line: rgba(255, 180, 150, 0.6);
    --accent: #cd3232;
    --accent-dim: #6e1e1e;
    --text: #ffffff;
    --text-dim: #f5c9c9;
    --error: #ffb3b3;
    --font-display: Tahoma, Arial, sans-serif;
    --font-body: Tahoma, Arial, sans-serif;
    --stats-h: 38px;
    /* Shared between .bg-glow and .layout below so the panel's edges and
       the content's padding can never drift apart at any window size —
       both reference the exact same values instead of two independently
       written formulas that merely happened to match. */
    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  /* body is the positioning context for .bg-glow below (absolute,
     not fixed — position:fixed inside an iframe embed is a known
     trouble spot in Safari). */
  body {
    position: relative;
  }

  /* ---------- BACKDROP ----------
     A padded, rounded panel with a 50% frosted backdrop blur — same blur
     treatment as the truth zone page's card (our 1-100 scale: 100% = 20px,
     so 50% = 10px). */
  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(205, 50, 50, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- PAGE LAYOUT ----------
     Desktop: video and chat sit side by side.
     Mobile (<= 860px wide): video sits on top, chat below. */
  .layout {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    margin: 0;
    gap: 14px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .video-pane {
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 62%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: var(--stats-h);
  }

  /* Sits over the video pane while the embed has nothing to show yet —
     before the livestream's first onStateChange PLAYING, and again on a
     rebuffer. The pane keeps its normal solid black background here
     (unlike the other widgets' loading state) — this is live.html's own
     stream, not something you're switching away from, so there's no
     stale frame to worry about hiding; the iframe is still hidden below
     just so a rebuffer doesn't leave an old frame showing under the
     gif. */
  .video-loading {
    position: absolute;
    inset: 0;
    bottom: var(--stats-h);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  .gif-loader {
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .chat-pane {
    flex: 1 1 38%;
    min-width: 300px;
    display: flex;
    container-type: size;
    container-name: chatbox;
  }

  @media (max-width: 860px) {
    .layout {
      flex-direction: column;
    }
    .video-pane {
      flex: 0 0 38vh;
    }
    /* min-height:0 (not just min-width) is required here: .layout is
       column-direction on mobile, so .chat-pane's relevant flex-shrink
       axis is now height, not width — without this override a flex item
       won't shrink below its content's natural height, so .messages'
       own overflow-y:auto never gets a bounded height to actually clip
       against and the list just grows past the widget's own visible
       bounds instead of scrolling internally. */
    .chat-pane {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
    }
  }

  /* When chat is hidden, the video takes the whole layout */
  .layout.chat-hidden .chat-pane {
    display: none;
  }
  .layout.chat-hidden .video-pane {
    flex: 1 1 100%;
  }

  /* Whichever fullscreen path is active, explicitly hide the chat pane
     rather than relying on the video simply covering it, so there's no
     overlap even if a browser sizes fullscreen differently than
     expected. */
  .layout.fullscreen-active .chat-pane {
    display: none;
  }

  /* When chat has been popped out into its own window, show a small
     centered placeholder in its place instead of the normal layout. */
  .chat-pane.popped-out {
    align-items: center;
    justify-content: center;
  }

  /* Live stats bar (active viewers + total views). .video-pane reserves
     a fixed strip at its bottom via padding-bottom, so the video itself
     (sized via cqw/cqh above) never extends into this area — the bar
     sits right below the video instead of overlaying it. */
  .stream-stats {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--stats-h);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    background: rgba(58, 10, 10, 0.55);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 14px);
    white-space: nowrap;
  }

  .stat-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex: none;
  }

  .stat-divider {
    color: var(--accent-dim);
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #ffffff;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  /* Wrapper for the top-right video pane action buttons (hide chat /
     pop out chat), so they sit side by side. */
  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .unmute-btn {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
  }

  .auth-submit-btn {
    width: 100%;
  }

  /* Overlay controls stay hidden until the video pane is hovered/focused */
  .video-pane .unmute-btn,
  .video-pane .video-pane-actions,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane:hover .unmute-btn,
  .video-pane:hover .video-pane-actions,
  .video-pane:hover .video-controls,
  .video-pane:focus-within .unmute-btn,
  .video-pane:focus-within .video-pane-actions,
  .video-pane:focus-within .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- CUSTOM VIDEO PLAYBACK CONTROLS ---------- */
  .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--stats-h);
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(58, 10, 10, 0.85), rgba(58, 10, 10, 0));
  }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }
  .play-pause-btn:disabled { opacity: 0.5; cursor: default; }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  /* Fallback for browsers (iOS Safari) that don't support the real
     Fullscreen API on non-video elements — simulate it with CSS. */
  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }
  /* A resize on entering/leaving fullscreen can make the YouTube embed
     report a brief rebuffer, which applies .is-loading above — fine for
     the small in-page pane (it's meant to show the page through), but
     while fullscreen that pane IS the whole screen, so a transparent
     background there means the chat behind it bleeds through instead.
     Keep it solid black here regardless of loading state. */
  .video-pane.pseudo-fullscreen.is-loading {
    background: #000;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }
  .scrub-range::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
  }
  .scrub-range::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .scrub-range::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  /* ---------- CHAT WIDGET (scales with .chat-pane's own size) ---------- */
  /* Fully transparent shell — only the text boxes (inputs, message
     bubbles) get a readable background. */
  .chat-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .chat-screen {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
    overflow: hidden;
  }

  .who {
    font-size: clamp(10px, 3cqw, 13px);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .who b { color: var(--text); font-weight: 600; }

  /* ---------- FLAT CIRCULAR BUTTONS (Windows 98 blue, no 3D shadow) ---------- */
  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: var(--accent);
    border: 1px solid var(--line);
    color: #ffffff;
  }
  .round-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .round-btn:active:not(:disabled) { background: var(--accent-dim); }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .signout {
    width: clamp(22px, 7cqw, 28px);
    font-size: clamp(11px, 3.4cqw, 14px);
    background: var(--accent-dim);
    color: #ffffff;
    border-color: var(--line);
    flex: none;
  }

  .status-actions {
    display: flex;
    align-items: center;
    gap: clamp(6px, 2cqw, 10px);
    flex: none;
  }

  /* Native color input — cheapest reliable cross-browser color picker,
     just restyled down to a small round swatch matching the round
     buttons next to it. */
  .color-picker {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(20px, 6.4cqw, 26px);
    height: clamp(20px, 6.4cqw, 26px);
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    background: none;
    cursor: pointer;
    flex: none;
  }
  .color-picker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .color-picker::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-picker::-moz-color-swatch { border: none; border-radius: 50%; }

  /* Auth screen now fills the whole chat card and centers its content,
     since the top tab/header bar has been removed on this screen. */
  .auth {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5cqh, 28px) clamp(14px, 4cqw, 24px) clamp(14px, 4cqh, 24px);
    overflow-y: auto;
  }
  .auth-inner {
    width: 100%;
    max-width: 320px;
  }
  label {
    display: block;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    margin: clamp(8px, 2.5cqh, 14px) 0 clamp(4px, 1.2cqh, 6px);
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* Readable text box — flat, no inset/bevel shadow */
  input[type="text"] {
    width: 100%;
    padding: clamp(8px, 2.4cqh, 11px) clamp(8px, 2.4cqw, 12px);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: clamp(2px, 1cqw, 4px);
    color: var(--text);
    font-size: max(16px, 3.6cqw);
    font-family: var(--font-body);
    outline: none;
  }
  input:focus { border-color: var(--accent); }

  .auth-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1.4cqh, 6px);
    margin-top: clamp(14px, 4.5cqh, 22px);
  }

  .auth-msg {
    margin-top: clamp(8px, 2.4cqh, 12px);
    font-size: clamp(10px, 2.8cqw, 13px);
    color: var(--error);
    min-height: 16px;
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(10px, 3.2cqh, 16px) clamp(10px, 3.4cqw, 18px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2.4cqh, 12px);
  }
  /* flat, thin scrollbar */
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--accent-dim);
    border-radius: 4px;
  }

  .msg {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }

  .msg-meta {
    font-size: clamp(8px, 2.2cqw, 11px);
    color: var(--text-dim);
    font-family: var(--font-display);
    letter-spacing: 0.02em;
  }
  .msg.mine .msg-meta { color: var(--accent); }

  /* Message bubbles are the one readable "text box" in the message list */
  .msg-bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: clamp(6px, 1.8cqh, 8px) clamp(8px, 2.4cqw, 12px);
    border-radius: clamp(6px, 2cqw, 10px);
    font-size: clamp(11px, 2.8cqw, 14px);
    line-height: 1.4;
    word-break: break-word;
  }
  .msg.mine .msg-bubble {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #ffffff;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 20px;
  }

  /* Shown in the chat-pane's spot on the main page while the chat is
     popped out into its own window. */
  .popout-placeholder {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(11px, 2.8cqw, 14px);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2.4cqh, 12px);
  }

  .composer-bar {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: transparent;
  }

  .composer-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(5px, 1.6cqh, 8px) clamp(10px, 3cqw, 14px) 0;
  }

  .composer {
    display: flex;
    gap: clamp(5px, 1.8cqw, 8px);
    padding: clamp(8px, 2.8cqh, 14px);
    flex: 0 0 auto;
  }
  .composer input {
    flex: 1;
  }
  .send-btn {
    width: clamp(34px, 10cqw, 42px);
    font-size: clamp(14px, 3.8cqw, 18px);
    flex: none;
  }

  .loading {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 40px 20px;
  }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="layout" id="layout">
  <div class="video-pane is-loading" id="videoPane">
    <div class="video-stage" id="videoStage">
      <button class="pill-btn unmute-btn" id="unmuteBtn" title="Unmute">Unmute</button>
      <div class="video-pane-actions">
        <button class="pill-btn popout-chat-btn" id="popoutChatBtn" title="Pop out chat into a separate window">Pop Out Chat</button>
        <button class="pill-btn toggle-chat-btn" id="toggleChatBtn" title="Hide chat">Hide Chat</button>
      </div>
      <div class="video-frame-wrap">
        <iframe
          id="ytFrame"
          src="https://www.youtube.com/embed/91UOOY-od88?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0"
          allowfullscreen
          scrolling="no"
          allow="accelerometer *; autoplay *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
          referrerpolicy="strict-origin"
          style="pointer-events: none;">
        </iframe>
      </div>
      <div class="video-loading" id="videoLoading">
        <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
      </div>
      <div class="video-controls" id="videoControls">
        <button class="round-btn play-pause-btn" id="playPauseBtn" title="Pause" disabled>&#10074;&#10074;</button>
        <input type="range" class="scrub-range" id="scrubRange" min="0" max="100" step="0.1" value="0" disabled />
        <span class="time-label" id="timeLabel">0:00 / 0:00</span>
        <button class="round-btn fullscreen-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
      </div>
    </div>
    <div class="stream-stats" id="streamStats">
      <span class="" aria-hidden="true"></span>
      <span id="activeViewersCount">0</span>watching
      <span class="stat-divider">&middot;</span>
      <span id="totalViewsCount">0</span>views
    </div>
  </div>

  <div class="chat-pane" id="chatPane">
    <div class="chat-card" id="app">
      <div class="loading">Loading chat…</div>
    </div>
  </div>
</div>

<script>
(function () {
  var layout = document.getElementById('layout');
  var toggleBtn = document.getElementById('toggleChatBtn');
  toggleBtn.addEventListener('click', function () {
    var hidden = layout.classList.toggle('chat-hidden');
    toggleBtn.textContent = hidden ? 'Show Chat' : 'Hide Chat';
    toggleBtn.title = hidden ? 'Show chat' : 'Hide chat';
  });
})();

(function () {
  // Browsers block unmuted autoplay, so the video has to start muted.
  // The YouTube IFrame Player API attaches to the existing #ytFrame embed
  // (it must have enablejsapi=1 in its src, which it does) so the custom
  // controls below can drive real playback without reloading the video.
  var unmuteBtn = document.getElementById('unmuteBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var scrubRange = document.getElementById('scrubRange');
  var timeLabel = document.getElementById('timeLabel');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var videoPane = document.getElementById('videoPane');
  var videoLoading = document.getElementById('videoLoading');
  var layoutEl = document.getElementById('layout');
  var ytPlayer = null;
  var isDragging = false;
  var pollTimer = null;

  function showVideoLoading() {
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');
  }
  function hideVideoLoading() {
    videoLoading.hidden = true;
    videoPane.classList.remove('is-loading');
  }

  unmuteBtn.disabled = true;

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    var min = parseFloat(scrubRange.min) || 0;
    var max = parseFloat(scrubRange.max) || 100;
    var val = parseFloat(scrubRange.value) || 0;
    var pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(state) {
    if (state === YT.PlayerState.PLAYING) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {
      playPauseBtn.innerHTML = '&#9658;';
      playPauseBtn.title = 'Play';
    }
  }

  function updateProgress() {
    if (!ytPlayer || isDragging) return;
    var duration = ytPlayer.getDuration();
    var current = ytPlayer.getCurrentTime();
    if (duration > 0) {
      scrubRange.max = duration;
      scrubRange.value = current;
      updateRangeFill();
      timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          unmuteBtn.disabled = false;
          playPauseBtn.disabled = false;
          scrubRange.disabled = false;
          updatePlayPauseIcon(YT.PlayerState.PLAYING);
          updateProgress();
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(updateProgress, 500);
        },
        onStateChange: function (event) {
          updatePlayPauseIcon(event.data);
          if (event.data === YT.PlayerState.PLAYING) {
            hideVideoLoading();
          } else if (event.data === YT.PlayerState.BUFFERING) {
            showVideoLoading();
          }
        }
      }
    });
  };

  unmuteBtn.addEventListener('click', function () {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) {
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      unmuteBtn.textContent = 'Mute';
      unmuteBtn.title = 'Mute';
    } else {
      ytPlayer.mute();
      unmuteBtn.textContent = 'Unmute';
      unmuteBtn.title = 'Unmute';
    }
  });

  playPauseBtn.addEventListener('click', function () {
    if (!ytPlayer) return;
    var state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    var duration = ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max);
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (ytPlayer) ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    isDragging = false;
  });

  var usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen
    );
  }

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      var result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(function () { enterPseudoFullscreen(); });
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function updateFullscreenIcon() {
    var fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';
    // Belt-and-suspenders alongside the video pane's own fullscreen
    // sizing: explicitly hide the chat pane rather than relying solely
    // on the video covering it, so there's no overlap even if a
    // rebuffer briefly makes the (fullscreened) video pane's background
    // transparent again.
    layoutEl.classList.toggle('fullscreen-active', fs);
  }

  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) {
      requestFs(videoPane);
    } else {
      enterPseudoFullscreen();
    }
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenIcon);
    }
  );
})();
</script>

<!-- ---------- CHAT POP-OUT WINDOW ----------
     Lets the chat widget be popped into its own separate browser window
     (handy for screen-capturing/streaming just the chat as its own
     source). It works by literally moving the #app DOM node into a new
     window's document (adopting it), so all of the chat script's event
     listeners and its live Firestore subscription keep working exactly
     as before — nothing about the chat logic itself is touched. -->
<script>
(function () {
  var popoutBtn = document.getElementById('popoutChatBtn');
  var chatPane = document.getElementById('chatPane');
  var appEl = document.getElementById('app');
  var popoutWindow = null;
  var closingFromHere = false;

  function getPageStyles() {
    var styleEl = document.querySelector('style');
    return styleEl ? styleEl.textContent : '';
  }

  function buildPopoutHtml() {
    return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>Chat</title><style>' + getPageStyles() +
      // Black base layer on the window itself, with a brick-red glow
      // layer sitting on top of it — same technique as the main page's
      // .layout / .layout::before pair: a padded, rounded box
      // (.popout-bg) whose ::before is an oversized, blurred color
      // layer, so the tint reads as a soft glow instead of a flat,
      // edge-to-edge block.
      'html, body { margin:0; width:100%; height:100%; background: #000000; overflow: hidden; }' +
      '.popout-bg { position: fixed; inset: clamp(8px, 3vw, 24px); border-radius: clamp(10px, 2.5vw, 28px); z-index: 0; }' +
      '.popout-bg::before { content: ""; position: absolute; inset: -60px; background: rgba(205, 50, 50, 0.5); filter: blur(50px); border-radius: inherit; z-index: -1; }' +
      '.chat-pane { position: relative; z-index: 1; width:100%; height:100%; min-width:0; }' +
      '</style></head><body><div class="popout-bg"></div></body></html>';
  }

  function returnChatToMain() {
    if (!popoutWindow) return;
    closingFromHere = true;
    var win = popoutWindow;
    popoutWindow = null;

    chatPane.classList.remove('popped-out');
    chatPane.innerHTML = '';
    chatPane.appendChild(appEl);

    popoutBtn.textContent = 'Pop Out Chat';
    popoutBtn.title = 'Pop out chat into a separate window';

    if (win && !win.closed) win.close();
    closingFromHere = false;
  }

  function openPopout() {
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.focus();
      return;
    }

    var popW = 400;
    var popH = 650;
    var screenLeft = window.screenLeft !== undefined ? window.screenLeft : window.screenX || 0;
    var screenTop = window.screenTop !== undefined ? window.screenTop : window.screenY || 0;
    var screenW = window.screen.availWidth || popW;
    var screenH = window.screen.availHeight || popH;
    var popLeft = Math.max(0, Math.round(screenLeft + (screenW - popW) / 2));
    var popTop = Math.max(0, Math.round(screenTop + (screenH - popH) / 2));
    // Explicit width/height/left/top (plus the no-chrome flags below)
    // signal to the browser that this is a small popup window, not a
    // maximized/fullscreen one.
    var features = 'width=' + popW + ',height=' + popH +
      ',left=' + popLeft + ',top=' + popTop +
      ',resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=no,status=no';
    var win = window.open('', 'chatPopoutWindow', features);
    if (win) {
      try {
        win.resizeTo(popW, popH);
        win.moveTo(popLeft, popTop);
      } catch (e) {}
    }
    if (!win) {
      alert('Your browser blocked the pop-out window. Please allow pop-ups for this page and try again.');
      return;
    }

    var doc = win.document;
    doc.open();
    doc.write(buildPopoutHtml());
    doc.close();

    var wrapper = doc.createElement('div');
    wrapper.className = 'chat-pane';
    wrapper.id = 'chatPane';
    doc.body.appendChild(wrapper);
    wrapper.appendChild(appEl); // moves (adopts) the live chat node as-is

    popoutWindow = win;

    chatPane.classList.add('popped-out');
    chatPane.innerHTML =
      '<div class="popout-placeholder">Chat is popped out into a separate window.<br>' +
      '<button class="pill-btn" id="returnChatBtn">Return Chat Here</button></div>';
    var returnBtn = document.getElementById('returnChatBtn');
    if (returnBtn) returnBtn.addEventListener('click', returnChatToMain);

    popoutBtn.textContent = 'Return Chat';
    popoutBtn.title = 'Bring chat back to this page';

    win.addEventListener('unload', function () {
      if (!closingFromHere) returnChatToMain();
    });
  }

  popoutBtn.addEventListener('click', function () {
    if (popoutWindow && !popoutWindow.closed) {
      returnChatToMain();
    } else {
      openPopout();
    }
  });

  // If the main page/tab closes while the chat is popped out, close the
  // pop-out window too instead of leaving it orphaned.
  window.addEventListener('beforeunload', function () {
    if (popoutWindow && !popoutWindow.closed) {
      try { popoutWindow.close(); } catch (e) {}
    }
  });
})();
</script>

<script>
(function () {
  const app = document.getElementById('app');

  // Looks up an element by id within the chat widget itself, instead of
  // `document.getElementById`. Plain `document.getElementById` always
  // searches the main page's document, which breaks once the widget is
  // popped out into a separate window (its elements live in that
  // window's document at that point). Searching from `app` works either
  // way, since `app` moves along with the widget.
  function $(id) {
    return app.querySelector('#' + id);
  }

  // ====================================================================
  // Your Firebase config
  // ====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410",
    measurementId: "G-RQF7G6VD1L"
  };
  // ====================================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const usernamesRef = db.collection('chat_usernames');
  const usernameCountersRef = db.collection('chat_username_counters');
  const messagesRef = db.collection('chat_messages');
  const bansRef = db.collection('chat_bans');
  const configRef = db.collection('chat_config');

  let session = null; // { username }
  let unsubscribeMessages = null;

  // ---------- DEVICE ID ----------
  // A static site with no server has no way to see (let alone block) a
  // visitor's real network IP — that needs a server component this site
  // doesn't have, and a client-only IP check is trivially skipped anyway.
  // What a browser CAN carry reliably is a random ID stashed in its own
  // localStorage: it survives a username change (unlike the username
  // itself, which anyone can just retype as something else), and — sent
  // with every message/join below — it's what admin.html's ban feature
  // actually targets. Firestore's own security rules (not just this
  // page's JS) are what make a ban on this ID stick; see admin.html's
  // Live tab for the rest of the moderation flow.
  function getClientId() {
    try {
      let id = localStorage.getItem('chat_client_id');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2));
        localStorage.setItem('chat_client_id', id);
      }
      return id;
    } catch (e) {
      // Private/incognito mode can block localStorage entirely — falls
      // back to a session-only id rather than failing to load chat at
      // all; this one visit just won't be persistently recognizable
      // across a future session on the same browser.
      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    }
  }
  const CLIENT_ID = getClientId();

  // ---------- USERNAME CLAIMING ----------
  // Never rejects a name outright: the first person to type "gunoguap"
  // gets it bare, and everyone after that gets the next free
  // "gunoguap#0001", "gunoguap#0002", etc., up to "#9999". A per-base-name
  // counter doc (chat_username_counters/<key>) hands out the next number
  // instead of scanning up to 9999 possible docs to find a free one, and
  // the whole read-then-write runs inside a single Firestore transaction
  // so two people claiming the same name at the same instant can't both
  // land on the bare name or the same number — Firestore itself retries
  // one of the transactions against the other's committed result.
  const USERNAME_SUFFIX_LIMIT = 9999;

  function padSuffix(n) {
    return String(n).padStart(4, '0');
  }

  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const counterRef = usernameCountersRef.doc(baseKey);

    return db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (!baseDoc.exists) {
        tx.set(baseRef, {
          username: rawUsername,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          // Whoever claims a given username slot keeps it forever (see
          // the comment above) — this is what lets admin.html resolve
          // "ban this person" from a username straight to the one
          // device that has ever actually owned it.
          lastDeviceId: CLIENT_ID
        });
        return rawUsername;
      }

      const counterDoc = await tx.get(counterRef);
      const next = (counterDoc.exists ? counterDoc.data().next : 0) + 1;
      if (next > USERNAME_SUFFIX_LIMIT) {
        throw new Error('USERNAME_LIMIT_REACHED');
      }

      const suffixedUsername = rawUsername + '#' + padSuffix(next);
      tx.set(counterRef, { next: next });
      // Also registers the numbered form itself, so if someone later
      // types "gunoguap#0001" literally, they get bumped to their own
      // free number instead of colliding with this one.
      tx.set(usernamesRef.doc(baseKey + '#' + padSuffix(next)), {
        username: suffixedUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastDeviceId: CLIENT_ID
      });
      return suffixedUsername;
    });
  }

  // Fetches this browser's public IP from a keyless lookup service and
  // logs it on the just-claimed username doc — purely a reference clue
  // for admin.html (e.g. "these two names share an IP, might be the same
  // person"), never an enforcement point; see the CLIENT_ID comment
  // above for why a real IP block isn't possible from a static site.
  // Best-effort and fire-and-forget: a blocked/failed lookup just means
  // this one detail stays blank, nothing about chat itself depends on it.
  function logIpBestEffort(finalUsername) {
    fetch('https://api.ipify.org?format=json')
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (!data || !data.ip) return;
        return usernamesRef.doc(finalUsername.toLowerCase()).set({
          lastIp: data.ip,
          lastSeenAt: Date.now()
        }, { merge: true });
      })
      .catch(() => {});
  }

  async function sendMessageToFirestore(entry) {
    await messagesRef.add({
      username: entry.username,
      text: entry.text,
      deviceId: CLIENT_ID,
      ts: Date.now()
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---------- SLUR / PROFANITY FILTER ----------
  // Words are censored wherever they appear (own word boundaries), case-insensitive,
  // and tolerant of a few common letter substitutions (0 for o, 1 for i, etc).
  // This default list is what the filter uses until chat_config/censoredWords
  // loads (and what it falls back to if that doc is ever missing/emptied) —
  // admin.html's "Censored Words" section is where the live list is actually
  // edited from here on; see the onSnapshot listener below.
  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {
    // Map each letter to itself plus common leetspeak substitutes.
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*'); // allow stray symbols/spaces slipped between letters
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
  }, () => {}); // offline/blocked read just keeps whatever list is already loaded

  // Set by admin.html's "Clear Chat" button — see subscribeToMessages()
  // further down, which is what actually applies this cutoff to the
  // messages query.
  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;
    // Re-subscribe with the new cutoff immediately for anyone already
    // sitting in the chat — same "takes effect right away" treatment as
    // a ban, rather than only on their next reload.
    if (session) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ---------- USERNAME COLORS ----------
  // Every username gets a stable color derived from its own text (so the
  // same name always lands on the same color for everyone, with no
  // shared state needed) unless its claimant has picked a custom one from
  // the composer bar below — that choice lives on the same chat_usernames
  // doc the username claim itself already created, since that's the one
  // place this app has anything resembling "this slot belongs to me."
  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  // Bright, readable-on-dark hues at fixed saturation/lightness — only
  // the hue varies per username.
  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  // key -> resolved hex color, or the string 'pending' while a lookup for
  // that username's custom color choice is in flight. Populated lazily —
  // only usernames actually seen in the rendered message list ever get
  // looked up, rather than subscribing to the whole chat_usernames
  // collection just for this.
  const usernameColorCache = {};

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username); // shown immediately; onResolved repaints if a custom pick exists
  }

  // ---------- RENDER: AUTH ----------
  // No top tab/header bar here — the whole card centers the join form.
  function renderAuth(errorMsg) {
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <label for="username">what are you gonna call yourself?</label>
            <input type="text" id="username" autocomplete="off" placeholder="e.g. gunoguap" />
            <div class="auth-actions">
              <button class="pill-btn auth-submit-btn" id="authSubmit" title="Join Chat">Join Chat</button>
            </div>
            <div class="auth-msg">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
          </div>
        </div>
      </div>
    `;

    $('authSubmit').addEventListener('click', handleAuthSubmit);
    $('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAuthSubmit();
    });
    $('username').focus();
  }

  async function handleAuthSubmit() {
    const username = $('username').value.trim();
    const btn = $('authSubmit');

    if (!username) {
      renderAuth('Enter a username.');
      return;
    }
    if (username.length > 24 || /\s/.test(username)) {
      renderAuth('Username must be 24 chars or fewer, no spaces.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const finalUsername = await claimUsernameSlot(username);
      session = { username: finalUsername };
      logIpBestEffort(finalUsername);
      startChat();
    } catch (e) {
      console.error(e);
      if (e && e.message === 'USERNAME_LIMIT_REACHED') {
        renderAuth('That username has hit its 9999-user limit. Try another one.');
      } else {
        renderAuth('Something went wrong. Please try again.');
      }
    }
  }

  // ---------- RENDER: CHAT ----------
  function renderChatShell() {
    // Own color resolves the same lazy way everyone else's does (see
    // colorForUsername) — usernameColorCache already has it "pending" or
    // resolved by the time this runs in the common case (colorForUsername
    // is called for every visible message, including your own), so this
    // just reads whatever that returns rather than doing a second lookup.
    const myColor = colorForUsername(session.username, () => {
      const picker = $('colorPicker');
      if (picker) picker.value = usernameColorCache[session.username.toLowerCase()];
    });

    app.innerHTML = `
      <div class="chat-screen">
        <div class="messages" id="messages">
          <div class="empty-state">Loading messages…</div>
        </div>
        <div class="composer-bar">
          <div class="composer-status">
            <div class="who">Signed in as <b>${escapeHtml(session.username)}</b></div>
            <div class="status-actions">
              <input type="color" class="color-picker" id="colorPicker" title="Pick your name color" value="${myColor}">
              <button class="round-btn signout" id="signoutBtn" title="Sign out">&times;</button>
            </div>
          </div>
          <div class="composer">
            <input type="text" id="msgInput" placeholder="Type a message…" maxlength="500" />
            <button class="round-btn send-btn" id="sendBtn" title="Send">&#9658;</button>
          </div>
        </div>
      </div>
    `;

    $('signoutBtn').addEventListener('click', () => {
      session = null;
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderAuth();
    });

    $('colorPicker').addEventListener('input', (e) => {
      const color = e.target.value;
      const key = session.username.toLowerCase();
      usernameColorCache[key] = color; // repaints this tab immediately, no round trip needed
      usernamesRef.doc(key).set({ color: color }, { merge: true }).catch((err) => console.error(err));
      if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);
    });

    $('sendBtn').addEventListener('click', sendMessage);
    $('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  }

  // Kept around so a username color that resolves (or gets picked) after
  // the fact can trigger a repaint of the list already on screen, without
  // renderMessages' every caller needing to also remember the last batch.
  let lastRenderedMsgs = null;

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say hello 👋</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      const mine = m.username === session.username;
      // "Mine" already stands out via its own accent-colored bubble/
      // alignment, so it keeps that fixed accent instead of taking on
      // its own name color here — the per-user color is there to tell
      // OTHER people's messages apart from each other, not from yours.
      const nameHtml = mine
        ? escapeHtml(m.username)
        : `<span style="color:${colorForUsername(m.username, () => renderMessages(lastRenderedMsgs))}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble">${escapeHtml(censorText(m.text))}</div>
        </div>
      `;
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = $('msgInput');
    const text = censorText(input.value.trim());
    if (!text) return;
    input.value = '';
    input.disabled = true;

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  // Set by admin.html's "Clear Chat" button (chat_config/clear) — the
  // messages themselves are never deleted (admin.html's own chat log and
  // search still see everything), this just moves the cutoff every
  // visitor's own message query starts from. Kept live (see
  // subscribeToConfig below) so an in-progress clear takes effect for an
  // already-open tab immediately, the same way a ban does.
  let clearedAt = 0;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();

    let query = messagesRef.orderBy('ts', 'asc');
    if (clearedAt) query = query.where('ts', '>', clearedAt);

    unsubscribeMessages = query
      .limitToLast(200)
      .onSnapshot(
        (snapshot) => {
          const msgs = snapshot.docs.map(doc => doc.data());
          renderMessages(msgs);
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    renderChatShell();
    subscribeToMessages();
    $('msgInput').focus();
  }

  // ---------- BAN GATE ----------
  // A permanent ban has no expiresAt at all; a timeout has one in the
  // future. Checked against a *live* listener (not a one-time read) so a
  // ban placed while this exact tab is sitting open takes effect right
  // away instead of only on the next reload.
  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ---------- INIT ----------
  let currentlyBanned = false;
  bansRef.doc(CLIENT_ID).onSnapshot((doc) => {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
    } else if (currentlyBanned) {
      // The ban was lifted, or a timeout expired, while this tab was
      // already sitting on the banned screen.
      currentlyBanned = false;
      renderAuth();
    } else if (!session) {
      renderAuth();
    }
  }, () => {
    // Can't confirm ban status (offline, rules not yet deployed, etc.) —
    // fails open to the normal join screen rather than locking everyone
    // out over a read error.
    if (!session) renderAuth();
  });
})();
</script>

<!-- ---------- LIVE STATS (active viewers + total views) ----------
     Reuses the same Firebase app/project the chat above already
     initialized — no separate config needed. "Views" increments once
     per browser tab/session. "Watching now" is a lightweight presence
     system: each open tab writes a heartbeat every 15s, and every
     client independently counts how many heartbeats are still fresh
     to get a live concurrent-viewer count, with no extra backend. -->
<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  const totalEl = document.getElementById('totalViewsCount');
  if (!activeEl || !totalEl) return;

  const db = firebase.firestore(); // reuses the app the chat widget already initialized
  const statsRef = db.collection('chat_stats').doc('overview');
  const presenceId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  const presenceRef = db.collection('chat_presence').doc(presenceId);

  const HEARTBEAT_MS = 15000;      // how often this tab refreshes its own presence
  const ACTIVE_WINDOW_MS = 40000;  // a presence doc counts as "active" if newer than this
  const STALE_CLEANUP_MS = 120000; // opportunistically delete very old presence docs

  // ---- total view count: count this tab once, then just listen live ----
  if (!sessionStorage.getItem('streamViewCounted')) {
    sessionStorage.setItem('streamViewCounted', '1');
    statsRef
      .set({ totalViews: firebase.firestore.FieldValue.increment(1) }, { merge: true })
      .catch((e) => console.error(e));
  }

  statsRef.onSnapshot(
    (doc) => {
      const data = doc.data();
      totalEl.textContent = data && typeof data.totalViews === 'number' ? data.totalViews : 0;
    },
    (err) => console.error(err)
  );

  // ---- active viewers: heartbeat presence, counted client-side ----
  let presenceById = {};

  function writeHeartbeat() {
    presenceRef.set({ lastSeen: Date.now() }).catch((e) => console.error(e));
  }

  function recomputeActiveCount() {
    const now = Date.now();
    let count = 0;
    Object.keys(presenceById).forEach((id) => {
      if (now - presenceById[id] < ACTIVE_WINDOW_MS) count++;
    });
    activeEl.textContent = count;
  }

  db.collection('chat_presence').onSnapshot(
    (snapshot) => {
      const next = {};
      const now = Date.now();
      snapshot.forEach((doc) => {
        const data = doc.data();
        const lastSeen = data && typeof data.lastSeen === 'number' ? data.lastSeen : 0;
        next[doc.id] = lastSeen;
        // Opportunistic cleanup so this collection doesn't grow forever —
        // any client that notices a very stale doc removes it.
        if (now - lastSeen > STALE_CLEANUP_MS) {
          doc.ref.delete().catch(() => {});
        }
      });
      presenceById = next;
      recomputeActiveCount();
    },
    (err) => console.error(err)
  );

  writeHeartbeat();
  setInterval(writeHeartbeat, HEARTBEAT_MS);
  setInterval(recomputeActiveCount, 5000);

  function leavePresence() {
    presenceRef.delete().catch(() => {});
  }
  window.addEventListener('pagehide', leavePresence);
  window.addEventListener('beforeunload', leavePresence);
})();
</script>

</body>
