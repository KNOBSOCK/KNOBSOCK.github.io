  // Live chat is intentionally forward-only for viewers: a new tab begins
  // empty and receives messages from that moment on.  The transcript is kept
  // in sessionStorage only, so a reload of the same tab is seamless without
  // pulling history from Firestore, while a new visitor never sees old chat.
  const MESSAGE_CACHE_KEY = 'chat_message_session_v1';
  const MESSAGE_CACHE_LIMIT = 50;
  let messageCacheSaveTimer = null;
  let messageCache = [];
  let messageSessionStartedAt = 0;
  let messageSessionOwner = null;
  let messageStreamCursor = 0;

  function startMessageSession(username) {
    if (messageSessionOwner === username && messageSessionStartedAt) return;
    messageSessionOwner = username;
    messageSessionStartedAt = Date.now();
    messageCache = [];
    messageStreamCursor = 0;
    try {
      const saved = JSON.parse(sessionStorage.getItem(MESSAGE_CACHE_KEY) || 'null');
      if (saved && saved.owner === username && typeof saved.startedAt === 'number' && Array.isArray(saved.messages)) {
        messageSessionStartedAt = saved.startedAt;
        messageStreamCursor = Math.max(0, Number(saved.streamCursor) || 0);
        messageCache = saved.messages
          .filter((m) => m && typeof m.id === 'string' && typeof m.ts === 'number')
          .sort((a, b) => a.ts - b.ts)
          .slice(-MESSAGE_CACHE_LIMIT);
      }
    } catch (e) {}
  }

  function saveMessageCache() {
    clearTimeout(messageCacheSaveTimer);
    messageCacheSaveTimer = setTimeout(() => {
      try {
        sessionStorage.setItem(MESSAGE_CACHE_KEY, JSON.stringify({
          owner: messageSessionOwner,
          startedAt: messageSessionStartedAt,
          streamCursor: messageStreamCursor,
          messages: messageCache
        }));
      } catch (e) {}
    }, 250);
  }

  function mergeMessageCache(incoming) {
    const byId = new Map(messageCache.map((m) => [m.id, m]));
    incoming.forEach((m) => {
      byId.set(m.id, m);
      messageStreamCursor = Math.max(messageStreamCursor, Number(m && m.ts) || 0);
    });
    messageCache = Array.from(byId.values())
      // The one-per-second live packets are handled directly by the listener;
      // keeping them in the 50-message transcript cache would push actual
      // chat messages out during a full fight.
      .filter((m) => m && m.type !== 'fight_live' && typeof m.ts === 'number' && m.ts > clearedAt)
      .sort((a, b) => a.ts - b.ts)
      .slice(-MESSAGE_CACHE_LIMIT);
    saveMessageCache();
  }

  function messageCursor() {
    return messageCache.reduce(
      (latest, m) => Math.max(latest, m.ts || 0),
      Math.max(clearedAt || 0, messageSessionStartedAt || 0, messageStreamCursor || 0)
    );
  }

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    const hasVisibleMessage = msgs.some((message) => message && (
      !isFightEvent(message) ||
      message.type === 'fight_challenge' ||
      message.type === 'fight_result' ||
      message.type === 'fight_draw'
    ));
    const screen = app.querySelector('.chat-screen');
    if (screen) screen.classList.toggle('is-chat-empty', !hasVisibleMessage);
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say wassup</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      if (m.type === 'join') {
        return `<div class="system-msg">${escapeHtml(m.username)} has joined</div>`;
      }
      if (m.type === 'tapin') {
        return `<div class="system-msg">${escapeHtml(m.username)} just tapped in</div>`;
      }
      if (m.type === 'fight_challenge') {
        return `<div class="system-msg">${escapeHtml(m.challenger)} challenged ${escapeHtml(m.opponent)} to a fight.</div>`;
      }
      if (m.type === 'fight_result') {
        return `<div class="system-msg">${escapeHtml(m.winner)} knocked out ${escapeHtml(m.loser)}.</div>`;
      }
      if (m.type === 'fight_draw') {
        return `<div class="system-msg">${escapeHtml(m.challenger)} and ${escapeHtml(m.opponent)} fought to a draw.</div>`;
      }
      if (isFightEvent(m)) return '';
      const mine = m.username === session.username;

      const nameColor = m.color || colorForUsername(m.username, () => renderMessages(lastRenderedMsgs));
      const nameHtml = `<span class="msg-name" role="button" tabindex="0" data-username="${escapeHtml(m.username)}" style="color:${nameColor}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml}${adminBadgeHtml(m.username)} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble${isEmojiOnlyMessage(m.text) ? ' emoji-only' : ''}">${renderMessageText(m.text)}</div>
        </div>
      `;
    }).join('');

    void container.offsetHeight;

    container.scrollTop = container.scrollHeight;
    const fightMenu = $('fightMenu');
    if (fightMenu && fightMenu.classList.contains('is-open')) renderFightTargetList();
  }

  async function sendMessage() {
    if (!isChatUnlocked()) return;
    const input = $('msgInput');
    if (input.value.length > MAX_MSG_LEN) {
      flashLimitMsg();
      return;
    }
    const text = censorText(input.value.trim());
    if (!text) return;
    markSeen();
    const refocus = document.activeElement === input || canAutoFocusInput();
    input.value = '';
    input.disabled = true;
    updateCharCounter();

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
      updateCharCounter();
    } finally {
      input.disabled = false;
      if (refocus) input.focus();
    }
  }

  let clearedAt = 0;
  let subscribedClearedAt = null;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = null;
    if (document.visibilityState === 'hidden') return;
    subscribedClearedAt = clearedAt;

    let query = messagesRef.orderBy('ts', 'asc');
    const cursor = messageCursor();
    if (cursor) {
      // Include the cursor document and de-duplicate it locally.  `>=` avoids
      // losing two messages written in the same millisecond.
      query = query.where('ts', '>=', cursor);
    } else if (clearedAt) {
      query = query.where('ts', '>', clearedAt);
    }

    let sawServerSnapshot = false;

    const TAPIN_EFFECT_MAX_AGE_MS = 15000;
    const FIGHT_EVENT_MAX_AGE_MS = FIGHT_CHALLENGE_MS + FIGHT_START_DELAY_MS + FIGHT_DURATION_MS + FIGHT_RESULT_HOLD_MS;

    function handleAddedChange(change, stillSettling) {
      if (change.type !== 'added') return;
      const m = change.doc.data();
      const isFreshFight = isFightEvent(m) && Date.now() - m.ts < FIGHT_EVENT_MAX_AGE_MS;
      const isPendingOwnEvent = pendingOwnTapinTimestamps.has(m.ts) || pendingOwnFightTimestamps.has(m.ts);
      const isCompletedFight = m.type === 'fight_result' || m.type === 'fight_draw';
      // A completed result in a brand-new listener baseline is historical
      // state from a reload, not something to pop open again.  There is one
      // important exception: a tab can reconnect while it is already showing
      // the live fight. In that case this baseline result is the exact final
      // packet it needs to leave the 0-second screen, so apply it normally.
      if (stillSettling && isCompletedFight && !isPendingOwnEvent) {
        const isResolvingVisibleFight = currentFight && currentFight.id === m.fightId &&
          (currentFight.status === 'countdown' || currentFight.status === 'playing');
        if (isResolvingVisibleFight) handleFightMessage(m);
        return;
      }
      if (stillSettling && !isPendingOwnEvent && !isFreshFight) return;
      if (isFightEvent(m)) handleFightMessage(m);
      else rememberFightTarget(m.username, m.ts);
      checkSpam(m);
      if (m.type === 'tapin' && Date.now() - m.ts < TAPIN_EFFECT_MAX_AGE_MS) {
        triggerTapInEffect(m.username);
      }
    }

    // Bound even a long-hidden tab: the UI only retains one screenful, so a
    // reconnect must never turn every message since its last visit into a
    // fresh baseline read.
    query = query.limitToLast(MESSAGE_CACHE_LIMIT);

    // Paint cached history before the network listener settles.  On a return
    // visit this is the same transcript the user just had, not an empty chat.
    renderMessages(messageCache);

    unsubscribeMessages = query
      .onSnapshot(
        (snapshot) => {
          const incoming = snapshot.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()));
          mergeMessageCache(incoming);
          renderMessages(messageCache);

          const stillSettling = !sawServerSnapshot;
          if (!snapshot.metadata.fromCache) sawServerSnapshot = true;
          snapshot.docChanges().forEach((change) => handleAddedChange(change, stillSettling));
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    window.KNOBSOCK_CHAT_USERNAME = session.username;
    try { window.dispatchEvent(new Event('knobsock-chat-identity')); } catch (e) {}
    startMessageSession(session.username);
    loadAccountTapIn(session.username);
    markSeen();
    renderChatShell();
    subscribeToMessages();
    if (canAutoFocusInput()) $('msgInput').focus();
  }

  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function enterAuthOrRestore() {
    await deviceLockPromise;

    if (currentlyBanned) return;

    if (isStandaloneAccountRestoreCallback()) {
      await finishAccountRestoreCallback();
      return;
    }

    const activeAccountSession = await currentAccountSession().catch(() => null);

    if (deviceLockedUsername) {

      session = { username: deviceLockedUsername, accountLinked: deviceAccountLinked };
      rememberUsername(deviceLockedUsername);
      startChat();
      handleAccountLinkCallback();
      return;
    }

    const saved = getRememberedUsername();
    if (saved) {
      session = { username: saved, accountLinked: deviceAccountLinked };

      deviceLockedUsername = saved;
      devicesRef.doc(CLIENT_ID).set({
        username: saved,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));
      startChat();
      handleAccountLinkCallback();
      return;
    }

    try {
      const restored = await restoreAccountToThisBrowser();
      if (restored && restored.username) {
        session = { username: restored.username, accountLinked: true };
        deviceLockedUsername = restored.username;
        rememberUsername(restored.username);
        if (isStandaloneAccountCallback()) {
          returnToLivePage();
          return;
        }
        startChat();
        return;
      }
    } catch (error) {
      if (error && error.code !== 'functions/not-found') console.error('Could not restore linked chat account:', error);
      if (activeAccountSession) {
        if (error && error.code === 'not-found') supabaseClient.auth.signOut().catch(() => {});
        renderAuth(isStandaloneAccountCallback() && error && error.code === 'not-found'
          ? WRONG_BROWSER_LINK_MESSAGE
          : accountErrorMessage(error, 'Could not restore your linked account.'));
        return;
      }
    }

    renderAuth();
  }

  let currentlyBanned = false;
  let banExpiryTimer = null;

  function clearBanExpiryTimer() {
    if (banExpiryTimer) { clearTimeout(banExpiryTimer); banExpiryTimer = null; }
  }

  function scheduleBanExpiryRecheck(ban) {
    clearBanExpiryTimer();
    if (!ban || !ban.expiresAt) return;
    const msUntilExpiry = ban.expiresAt - Date.now();
    if (msUntilExpiry <= 0) return;
    banExpiryTimer = setTimeout(() => {

      bansRef.doc(CLIENT_ID).get().then(handleBanDoc).catch(() => {});
    }, msUntilExpiry + 250);
  }

  function handleBanDoc(doc) {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      window.KNOBSOCK_CHAT_USERNAME = '';
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
      scheduleBanExpiryRecheck(ban);
      return;
    }
    clearBanExpiryTimer();

    if (ban && ban.expiresAt) {
      bansRef.doc(CLIENT_ID).delete().catch(() => {});
    }
    if (currentlyBanned) {

      currentlyBanned = false;
      enterAuthOrRestore();
    } else if (!session) {
      enterAuthOrRestore();
    }
  }

  bansRef.doc(CLIENT_ID).onSnapshot(handleBanDoc, () => {

    if (!session) enterAuthOrRestore();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (unsubscribeMessages) unsubscribeMessages();
      unsubscribeMessages = null;
      return;
    }
    if (session && !currentlyBanned) subscribeToMessages();
    // Mobile browsers can suspend iframe intervals while the browser chrome
    // is changing. Recreate the local timer on return; its Date.now()-based
    // label immediately catches up without a database request.
    if (currentFight && (currentFight.status === 'countdown' || currentFight.status === 'playing')) {
      clearInterval(fightTicker);
      fightTicker = null;
      startFightTicker();
    }
  });

})();
</script>

<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  if (!activeEl) return;

  const db = firebase.firestore();

  // These values are deliberately longer than the original 60s / 30s cadence.
  // Presence is still announced immediately when a tab opens, regains focus,
  // or learns a chat identity, so this does not make the live UI feel slower.
  // It does prevent an idle tab from creating a Firestore write every minute
  // and an aggregation read every 30 seconds all day long.
  const HEARTBEAT_MS = 120000;
  const COUNT_REFRESH_MS = 120000;
  // Leave enough headroom for a delayed background timer: a genuine active
  // tab remains visible to the fighter picker between two heartbeats.
  const ACTIVE_WINDOW_MS = 270000;

  const COUNT_URL = 'https://firestore.googleapis.com/v1/projects/chat-for-website-efee2/databases/(default)/documents:runAggregationQuery?key=AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM';

  const COUNT_TIMEOUT_MS = 15000;

  let presenceRef = null;
  let countInFlight = false;
  let serverSkewMs = 0;
  let presenceSelectionVersion = 0;

  function serverNow() {
    return Date.now() + serverSkewMs;
  }

  function presenceSeed() {
    if (window.KNOBSOCK_CLIENT_ID) return window.KNOBSOCK_CLIENT_ID;
    try {
      const stored = localStorage.getItem('chat_client_id');
      if (stored) return stored;
    } catch (e) {}
    return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  }

  function isUsablePresenceUsername(username) {
    return typeof username === 'string' && username.length >= 1 && username.length <= 24 && !/\s/.test(username);
  }

  // A signed-in heartbeat can identify itself through its document id, so
  // the picker needs no second presence collection or extra polling write.
  // Base64url keeps every accepted handle safe as one Firestore path segment.
  function namedPresenceDocId(username) {
    if (!isUsablePresenceUsername(username)) return '';
    try {
      const bytes = new TextEncoder().encode(username);
      let binary = '';
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return 'u_' + btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    } catch (e) {
      return '';
    }
  }

  function usernameFromPresenceDocId(id) {
    if (typeof id !== 'string' || id.indexOf('u_') !== 0) return '';
    try {
      const encoded = id.slice(2).replace(/-/g, '+').replace(/_/g, '/');
      const padded = encoded + '='.repeat((4 - encoded.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const username = new TextDecoder().decode(bytes);
      return isUsablePresenceUsername(username) ? username : '';
    } catch (e) {
      return '';
    }
  }

  window.KNOBSOCK_PRESENCE_USERNAME_FROM_ID = usernameFromPresenceDocId;

  async function presenceDocId(seed, username) {
    const namedId = namedPresenceDocId(username);
    if (namedId) return namedId;
    try {
      const bytes = new TextEncoder().encode('knobsock-presence-v1' + seed);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).slice(0, 16)
        .map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      let h = 7;
      for (let k = 0; k < seed.length; k++) h = (h * 31 + seed.charCodeAt(k)) >>> 0;
      return 'p' + h.toString(36) + seed.length.toString(36);
    }
  }

  function writeHeartbeat() {
    if (!presenceRef || document.visibilityState === 'hidden') return;
    presenceRef.set({ lastSeen: serverNow() }).catch(() => {});
  }

  const presenceSeedValue = presenceSeed();

  function selectPresenceRef() {
    const selection = ++presenceSelectionVersion;
    const username = window.KNOBSOCK_CHAT_USERNAME;
    presenceDocId(presenceSeedValue, username).then((id) => {
      if (selection !== presenceSelectionVersion) return;
      const previousRef = presenceRef;
      if (previousRef && previousRef.id === id) {
        writeHeartbeat();
        return;
      }
      presenceRef = db.collection('chat_presence').doc(id);
      writeHeartbeat();
      // A visitor may first be counted anonymously while choosing a handle.
      // Retire that one row immediately after moving to the named row so the
      // viewer badge never double-counts them for the active window.
      if (previousRef && previousRef.id !== id && document.visibilityState !== 'hidden') {
        previousRef.set({ lastSeen: serverNow() - ACTIVE_WINDOW_MS - 1000 }).catch(() => {});
      }
    }).catch(() => {});
  }

  function readActiveCount() {
    if (countInFlight || document.visibilityState === 'hidden') return Promise.resolve();
    countInFlight = true;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), COUNT_TIMEOUT_MS);
    return fetch(COUNT_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        structuredAggregationQuery: {
          structuredQuery: {
            from: [{ collectionId: 'chat_presence' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'lastSeen' },
                op: 'GREATER_THAN',
                value: { integerValue: String(serverNow() - ACTIVE_WINDOW_MS) }
              }
            }
          },
          aggregations: [{ alias: 'viewers', count: {} }]
        }
      })
    })
      .then((res) => (res.ok ? res.json() : null))
      .then((rows) => {
        if (!Array.isArray(rows)) return;
        for (const row of rows) {
          if (!row || !row.result) continue;
          if (row.readTime) {
            const serverMs = Date.parse(row.readTime);
            if (serverMs) serverSkewMs = serverMs - Date.now();
          }
          const field = row.result.aggregateFields && row.result.aggregateFields.viewers;
          if (!field || field.integerValue == null) continue;
          activeEl.textContent = String(Math.max(1, parseInt(field.integerValue, 10) || 0));
          return;
        }
      })
      .catch(() => {})
      .finally(() => { clearTimeout(timer); countInFlight = false; });
  }

  {
    // Give a remembered chat session a moment to announce its handle. That
    // lets returning chatters start directly on their named row instead of
    // briefly creating an anonymous one first.
    window.addEventListener('knobsock-chat-identity', selectPresenceRef);
    setTimeout(() => {
      if (!presenceRef) selectPresenceRef();
    }, 1500);
    readActiveCount().then(writeHeartbeat, writeHeartbeat);
    setInterval(writeHeartbeat, HEARTBEAT_MS);
    setInterval(readActiveCount, COUNT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      readActiveCount().then(writeHeartbeat, writeHeartbeat);
    });
  }
})();
</script>
