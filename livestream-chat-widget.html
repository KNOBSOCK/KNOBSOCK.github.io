<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Stream + Chat</title>
<style>
  :root {
    --ink: #3a0a0a;
    --panel: rgba(58, 10, 10, 0.32);
    --panel-2: rgba(58, 10, 10, 0.8);
    --line: rgba(255, 180, 150, 0.6);
    --accent: #cd3232;
    --accent-dim: #6e1e1e;
    --text: #ffffff;
    --text-dim: #f5c9c9;
    --error: #ffb3b3;
    /* Opaque on purpose — the VODs drawer/tab sit over live chat text,
       where the translucent --panel/--panel-2 used elsewhere lets it
       bleed through and read as broken. This exact value is what
       .stream-stats' old rgba(58,10,10,0.55) composited to over the
       video pane's black; both use this now, so the watching bar and
       the drawer extending out of it are the same colour by
       construction rather than by two values that happen to be close. */
    --vods-bg: #200606;
    --font-display: Tahoma, Arial, sans-serif;
    --font-body: Tahoma, Arial, sans-serif;
    --stats-h: 38px;
    /* Shared between .bg-glow and .layout below so the panel's edges and
       the content's padding can never drift apart at any window size —
       both reference the exact same values instead of two independently
       written formulas that merely happened to match. */
    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  /* body is the positioning context for .bg-glow below (absolute,
     not fixed — position:fixed inside an iframe embed is a known
     trouble spot in Safari). */
  body {
    position: relative;
  }

  /* ---------- BACKDROP ----------
     A padded, rounded panel with a 50% frosted backdrop blur — same blur
     treatment as the truth zone page's card (our 1-100 scale: 100% = 20px,
     so 50% = 10px). */
  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(205, 50, 50, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- PAGE LAYOUT ----------
     Desktop: video and chat sit side by side.
     Mobile (<= 860px wide): video sits on top, chat below. */
  .layout {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    margin: 0;
    gap: 14px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .video-pane {
    position: relative;
    /* Above .chat-pane (z-index:1) so the VODs tab, which extends back
       past the layout gap, slides UNDER this pane instead of over it —
       the pane's own black then hides the tucked-in part and fills the
       corner curve, so the curve reads as the video sitting on top of
       the tab rather than as a notch cut out of it. Without this, DOM
       order alone would paint the (later) chat pane on top. */
    z-index: 2;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 62%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;
    /* No padding-bottom reserved here — the strip it would leave room
       for (.stream-stats) is hidden on desktop, so reserving space for
       it would just leave the video, and the controls overlaid on it,
       stopping short of a flush bottom edge. The mobile block below
       re-adds this once that strip is visible again. */
  }

  /* Sits over the video pane while the embed has nothing to show yet —
     before the livestream's first onStateChange PLAYING, and again on a
     rebuffer. The pane keeps its normal solid black background here
     (unlike the other widgets' loading state) — this is live.html's own
     stream, not something you're switching away from, so there's no
     stale frame to worry about hiding; the iframe is still hidden below
     just so a rebuffer doesn't leave an old frame showing under the
     offline card. */
  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  /* Same 16:9 box, same centering, as .video-frame-wrap below — sized so
     it sits exactly where the video itself would instead of just filling
     whatever shape .video-pane happens to be. On mobile this gets
     overridden below to fill the whole pane instead (cropping the image
     rather than letterboxing it) — see the mobile media query. */
  .offline-frame {
    position: absolute;
    display: block;
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
    object-fit: cover;
  }

  .gif-loader {
    position: relative;
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .chat-pane {
    position: relative;
    z-index: 1; /* below .video-pane — see the note there */
    flex: 1 1 38%;
    min-width: 300px;
    display: flex;
    container-type: size;
    container-name: chatbox;
  }

  /* ---------- VODs DRAWER ----------
     Reads as the video's own "N watching" bar unfolding rather than as
     a second bar of its own: on mobile the tab is just a small nub
     hanging off that bar's bottom edge (pulled up by .layout's own gap
     so it looks attached to it), and on desktop it's a full-width
     "VODS" bar butted right against the video pane. Either way the
     viewer count itself stays where it always was, in .stream-stats —
     this never repeats it.

     DOM order is drawer-then-tab on purpose: the tab stays pinned to
     the panel's BOTTOM edge, so opening pushes it down below the list
     instead of stranding it above. Backgrounds are opaque (not the
     translucent --panel-2 the rest of the chat uses) since this panel
     sits over live chat text — anything see-through reads as a
     rendering glitch here. */
  .vods-panel {
    position: absolute;
    top: 0;
    /* Runs back past .layout's own 14px gap and a further ~14px behind
       the video pane, which paints on top of it (see .video-pane's
       z-index). So it doesn't just meet the video's edge, it disappears
       under it: the pane's rounded corner then curves over the tab
       rather than over page background, and there's no crescent to
       line up in the first place. Anchored to both edges, so it
       re-fits itself at any window width. */
    left: -28px;
    right: 0;
    /* Top-right only: the left edge is tucked under the video, and the
       bottom edge is where the drawer unrolls out of, so a curve there
       reads as the bar being clipped short rather than as a shape that
       opens. On the panel with overflow:hidden rather than on the tab
       and drawer separately, so the two read as one shape with no
       notch at the seam where they meet. */
    border-radius: 0 10px 0 0;
    overflow: hidden;
    z-index: 8;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    /* The panel's own box spans the full width even when the tab
       inside it doesn't (mobile's centered nub) — without this it
       would swallow clicks meant for the chat on either side of it. */
    pointer-events: none;
  }
  .vods-tab {
    pointer-events: auto;
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.5cqw, 10px);
    width: 100%;
    /* No rules top or bottom — --line is a pale peach that reads as
       two stray white lines across the bar. The opaque fill against
       the red chat is enough of an edge on its own. (Mobile's nub
       re-adds a border below, where it needs the outline to hold its
       tab shape against the chat behind it.) */
    border: 0;
    background: var(--vods-bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: clamp(6px, 1.6cqh, 10px) 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  /* Desktop-only in effect — mobile sets this display:none further
     down, so there's nothing here to hover on a touch device anyway.
     Without this the bar had zero visual feedback on hover, so it
     never read as clickable next to the rest of this UI, which
     highlights everything else interactive. */
  .vods-tab:hover {
    background: var(--accent-dim);
  }
  /* Same red as the "N watching" text this is meant to look like an
     extension of, rather than the plain white used inside the chat. */
  .vods-tab-label,
  .vods-tab-chevron {
    color: var(--accent);
  }
  .vods-tab-chevron {
    display: inline-block;
    font-size: 9px;
    /* Pinned so the mobile nub's height is font-metric independent —
       the chat pane's padding-top below is sized against it. */
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-tab-chevron { transform: rotate(180deg); }

  .vods-drawer {
    pointer-events: auto;
    flex: none;
    display: flex;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    background: var(--vods-bg);
    transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-drawer {
    max-height: min(70cqh, 460px);
  }
  /* Desktop doesn't need this — the tab itself is labelled there. The
     mobile nub has no room for a label, so the heading carries it. */
  .vods-heading {
    display: none;
    flex: none;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 3cqw, 14px);
    color: var(--text);
    padding: 10px 10px 4px;
  }
  .vods-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vods-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: clamp(10px, 2.8cqw, 12px);
  }
  .vod-row {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }
  .vod-row:hover { background: rgba(255, 255, 255, 0.08); }
  .vod-row.active { border-color: var(--accent); background: rgba(205, 50, 50, 0.25); }
  .vod-row-thumb {
    flex: none;
    width: 88px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    object-fit: cover;
    background: var(--panel);
  }
  .vod-row-title {
    min-width: 0;
    font-size: clamp(11px, 2.8cqw, 13px);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  @media (max-width: 860px) {
    .layout {
      flex-direction: column;
    }
    .video-pane {
      flex: 0 0 38vh;
      padding-bottom: var(--stats-h);
    }
    /* Mirrors the padding-bottom above, restoring room for .stream-stats
       now that the mobile block re-shows it — desktop's flush bottom
       (see the base rule) doesn't apply once that strip is visible. */
    .video-loading {
      bottom: var(--stats-h);
    }
    /* ".layout" prefix is load-bearing, not stylistic: the base rule it
       overrides (bottom: 0) sits further down this stylesheet, so at
       equal specificity it would win the cascade on mobile too and
       cancel this override — same trap as .layout .stream-stats below. */
    .layout .video-controls {
      bottom: var(--stats-h);
    }
    /* The mobile pane's own aspect ratio isn't 16:9, so fitting the
       offline card to that box like desktop does leaves black bars down
       the sides. Fill the whole pane instead and let object-fit: cover
       crop the image — there's no video controls/letterboxing convention
       to match here like there is on desktop, so cropping reads better
       than bars. */
    .offline-frame {
      width: 100cqw;
      height: 100cqh;
    }
    /* min-height:0 (not just min-width) is required here: .layout is
       column-direction on mobile, so .chat-pane's relevant flex-shrink
       axis is now height, not width — without this override a flex item
       won't shrink below its content's natural height, so .messages'
       own overflow-y:auto never gets a bounded height to actually clip
       against and the list just grows past the widget's own visible
       bounds instead of scrolling internally. */
    .chat-pane {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      /* Runs UP behind the video pane — past .layout's 14px gap and on
         under the watching bar — instead of starting below it. The
         video pane is opaque and paints on top (z-index 2 vs 1), so
         the message list's own top edge, and the half-cut line that
         always sits at it, are hidden behind the bar rather than
         showing as a slice of text under a dead strip. Chat just
         disappears under the bar as it scrolls, which is the whole
         point: nothing is clipped in view, so nothing needs fading. */
      margin-top: calc(-1 * (14px + var(--stats-h)));
    }

    /* Stacked layout: the tab becomes a small nub hanging off the
       bottom edge of the video's own "N watching" bar (the -14px
       closes .layout's column gap so it reads as part of that bar
       rather than a separate one), and the list unrolls down over the
       chat from there. No label — the nub is the whole affordance;
       the drawer's own VODS heading names it once it's open. */
    /* The whole watching bar is the handle here, so it gets the
       pointer, the chevron and a tap glow — and the nub below is
       retired entirely. */
    /* Scoped under .layout, not bare ".stream-stats", purely to outrank
       the base rule's later, equal-specificity "display: none" on
       source order — the exact trap .stream-stats-vods's own comment
       below already warns about. Undoes that default: this bar still
       does a job here (the VODs handle), just not on desktop any more. */
    .layout .stream-stats {
      display: flex;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .stream-stats:active {
      background: #341010;
      box-shadow: inset 0 0 26px rgba(205, 50, 50, 0.5);
    }
    /* Scoped under .stream-stats purely to outrank the base
       "display: none" — that rule lives further DOWN the file than
       this media query, so at equal specificity it would win on source
       order and the pill would never show at all. */
    /* No longer sharing the bar with a viewer count (that moved to
       .viewer-badge on the video pane), so this needs no positioning
       of its own — .stream-stats' own justify-content:center already
       centers it now that it's the bar's only content. */
    .stream-stats .stream-stats-vods {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .layout.vods-open .stream-stats-chevron { transform: rotate(180deg); }
    .vods-tab { display: none; }

    .vods-panel {
      /* The pane's top now sits behind the bar (see .chat-pane's
         margin above), so the drawer starts a bar's height down from
         it — i.e. flush under the bar, where it used to start. */
      top: var(--stats-h);
      left: 0;
      /* Stacked layout: nothing to tuck under sideways, and the
         rounding belongs on the drawer's bottom edge instead (below). */
      border-radius: 0;
    }
    /* The video pane's rounded bottom corners are what the watching bar
       inherits, and a full-width square-cornered drawer butting up
       under them leaves a crescent of background in each corner. While
       the drawer is open the two are one continuous card, so the seam
       between them goes straight and the rounding moves to the bottom
       of the drawer instead. Closed, nothing but the centred nub is
       down there, so the pane keeps its own corners. */
    .layout.vods-open .video-pane {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .vods-drawer {
      border-radius: 0 0 10px 10px;
    }
    .vods-tab {
      align-self: center;
      width: clamp(52px, 16cqw, 74px);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 10px 10px;
      /* Exactly .layout's column gap, which is what the -14px above
         pulls it up by — so the nub fills that gap and stops dead at
         the chat pane's top edge. Sizing it instead of padding it
         means it can't reach the chat and clip a line of text no
         matter what the font metrics do; box-sizing:border-box is
         global here, so the border is inside the 14px. */
      height: 14px;
      padding: 0;
    }
    .vods-tab-chevron { font-size: 10px; }
    .vods-tab-label { display: none; }
    .vods-heading { display: block; }
    /* Covers essentially the whole chat pane when open, like the mock-up */
    .vods-panel.open .vods-drawer {
      max-height: min(88cqh, 560px);
    }
  }

  /* When chat is hidden, the video takes the whole layout */
  .layout.chat-hidden .chat-pane {
    display: none;
  }
  .layout.chat-hidden .video-pane {
    flex: 1 1 100%;
  }

  /* Landscape phone: the mobile stack above assumes a tall portrait
     screen (video capped to 38vh, chat scrolling below it) — on its
     side, that same 38vh is a sliver of an already-short viewport.
     Rather than build a third layout, this applies the same "Hide
     Chat" treatment above unconditionally instead. Checked on
     max-height, not max-width: that's the dimension a phone's short
     side ends up on once rotated, and its width can be well over
     860px lying sideways. The ".layout" prefix is load-bearing, not
     stylistic — .video-pane above (and the mobile-only .video-pane
     rule) are equal-specificity with this, so without it this would
     only win when it happens to land later in the file — same trap
     .layout .stream-stats works around elsewhere in this file. The
     host page's own matching landscape query is what actually frees
     up the room this then fills — see live.html.
     hover:none + pointer:coarse (true only for touchscreens) are load-
     bearing too: an ordinary desktop browser window is "landscape" by
     nature and often under 860px tall as well (a laptop screen minus
     its own chrome), so max-height + orientation alone was hiding
     chat on regular desktop visits — confirmed by testing an actual
     1400x900 window, not just guessing. */
  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .chat-pane { display: none; }
    .layout .video-pane { flex: 1 1 100%; }
  }

  /* Whichever fullscreen path is active, explicitly hide the chat pane
     rather than relying on the video simply covering it, so there's no
     overlap even if a browser sizes fullscreen differently than
     expected. */
  .layout.fullscreen-active .chat-pane {
    display: none;
  }

  /* Live stats bar (active viewers). .video-pane reserves
     a fixed strip at its bottom via padding-bottom, so the video itself
     (sized via cqw/cqh above) never extends into this area — the bar
     sits right below the video instead of overlaying it. */
  /* Desktop has no use for this bar any more: viewer count moved onto
     the video pane itself (.viewer-badge) and VODs already has its own
     tucked-under-the-video tab there (.vods-tab/.vods-panel), so
     showing it would just be an empty red stripe. Hidden here by
     default; the mobile block re-enables it, where it's still the
     VODs handle (see .stream-stats-vods below). */
  .stream-stats {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--stats-h);
    z-index: 5;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--vods-bg);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 14px);
    white-space: nowrap;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  /* Desktop leaves this a plain readout — it only becomes the VODs
     handle in the stacked layout (see the mobile block below). */
  .stream-stats-vods {
    display: none;
  }
  .stream-stats-chevron {
    display: inline-block;
    font-size: 9px;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stat-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex: none;
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #ffffff;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  /* Top-left group (unmute + hide chat), side by side via flex so
     "Unmute"/"Mute" changing width never bumps the button next to it. */
  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  /* Top-right: viewer count, icon + number instead of the "N watching"
     text this replaces (that used to sit permanently in .stream-stats
     below the video — see the badge's own fade rule just below, which
     is what actually makes it come and go with tap/hover now). */
  .viewer-badge {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: clamp(6px, 1.6cqh, 10px) clamp(10px, 2.6cqw, 14px);
    border: 1px solid var(--accent);
    border-radius: clamp(4px, 1.5cqw, 8px);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 3cqw, 14px);
  }
  .viewer-badge svg {
    width: clamp(12px, 3.4cqw, 16px);
    height: clamp(12px, 3.4cqw, 16px);
    fill: var(--accent);
    flex: none;
  }

  .auth-submit-btn {
    width: 100%;
  }

  /* Shown/hidden by the .controls-visible class (see the JS below)
     instead of :hover/:focus-within — a real hover still triggers it on
     desktop (mouseenter/mouseleave), but touch devices get an actual
     tap-to-show/tap-again-to-hide toggle instead of relying on mobile
     browsers' sticky-:hover-after-tap quirk, which never explicitly
     hides again on its own. Just the two top-row groups and the
     control bar — .unmute-btn doesn't need its own entry here now that
     it's a plain flex child of .video-pane-actions, which already
     fades as a whole. */
  .video-pane .video-pane-actions,
  .video-pane .viewer-badge,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane.controls-visible .video-pane-actions,
  .video-pane.controls-visible .viewer-badge,
  .video-pane.controls-visible .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- CUSTOM VIDEO PLAYBACK CONTROLS ---------- */
  .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    /* Flush with the pane's own bottom edge — there's no .stream-stats
       strip below to leave room for on desktop (see the mobile override,
       which pulls this back up once that strip is visible again). */
    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(58, 10, 10, 0.85), rgba(58, 10, 10, 0));
  }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }
  .play-pause-btn:disabled { opacity: 0.5; cursor: default; }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  /* Fallback for browsers (iOS Safari) that don't support the real
     Fullscreen API on non-video elements — simulate it with CSS. */
  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }
  /* A resize on entering/leaving fullscreen can make the YouTube embed
     report a brief rebuffer, which applies .is-loading above — fine for
     the small in-page pane (it's meant to show the page through), but
     while fullscreen that pane IS the whole screen, so a transparent
     background there means the chat behind it bleeds through instead.
     Keep it solid black here regardless of loading state. */
  .video-pane.pseudo-fullscreen.is-loading {
    background: #000;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }
  .scrub-range::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
  }
  .scrub-range::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .scrub-range::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  /* Same idea as YouTube's own "seek to live" pill: grey/hollow dot
     while behind the live edge (a VOD, or scrubbed back during live),
     red once caught up — see updateLiveButtonState() near LIVE STREAM
     VIDEO STATE below. */
  .live-btn {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(10px, 2.8cqw, 12px);
    padding: clamp(4px, 1.2cqh, 6px) clamp(8px, 2.2cqw, 12px);
    cursor: pointer;
  }
  .live-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .live-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .live-btn.at-live .live-dot { background: var(--accent); }

  /* ---------- CHAT WIDGET (scales with .chat-pane's own size) ---------- */
  /* Fully transparent shell — only the text boxes (inputs, message
     bubbles) get a readable background. */
  .chat-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .chat-screen {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
    overflow: hidden;
  }

  .who {
    /* cqmin, matching .status-actions' buttons beside it - see the note there */
    font-size: clamp(10px, 3cqmin, 13px);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .who b { color: var(--text); font-weight: 600; }

  /* ---------- FLAT CIRCULAR BUTTONS (Windows 98 blue, no 3D shadow) ---------- */
  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: var(--accent);
    border: 1px solid var(--line);
    color: #ffffff;
  }
  .round-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .round-btn:active:not(:disabled) { background: var(--accent-dim); }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .status-actions {
    display: flex;
    align-items: center;
    /* cqmin throughout this row (here and in .color-picker/.tapin-btn/
       .composer/.send-btn below): using cqw and cqh separately let a
       container whose width and height scale at different rates (a
       wide-but-short chat pane on a big screen, or Safari zoomed way
       out) pull them out of ratio with each other — width-sized things
       ballooned while height-sized things stayed small, reading as
       everything "smushed" together rather than one consistent scale.
       cqmin keys every one of them off whichever dimension is smaller,
       so they always grow and shrink together regardless of the pane's
       aspect ratio. */
    gap: clamp(6px, 2cqmin, 10px);
    flex: none;
  }

  /* Native color input — cheapest reliable cross-browser color picker,
     just restyled down to a small round swatch matching the round
     buttons next to it. */
  .color-picker {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(20px, 6.4cqmin, 26px);
    height: clamp(20px, 6.4cqmin, 26px);
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    background: none;
    cursor: pointer;
    flex: none;
  }
  .color-picker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .color-picker::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-picker::-moz-color-swatch { border: none; border-radius: 50%; }

  /* Registering --tapin-frac as a real animatable number (not just a
     string substituted into calc()) is what lets the transition below
     actually sweep smoothly between refreshTapInButtonState's once-a-
     second updates, instead of jumping. Unsupported browsers (older
     Firefox/Safari) just skip the transition and jump once a second —
     still correct, just less smooth. */
  @property --tapin-frac {
    syntax: '<number>';
    inherits: false;
    initial-value: 1;
  }

  /* Sits right next to the color picker in .status-actions — same round
     button as the rest of the UI, just sized to sit comfortably beside
     the small circular swatch. Disabled (via .round-btn:disabled above)
     for the 5-minute cooldown between taps, same visual language as the
     video player's own disabled controls. */
  .tapin-btn {
    width: clamp(22px, 7cqmin, 28px);
    font-size: clamp(11px, 3.4cqmin, 14px);
    flex: none;
    transition: --tapin-frac 1s linear;
  }
  /* Countdown "sweep": a conic-gradient wedge that shrinks away to the
     dim color as --tapin-frac (fraction of the cooldown still
     remaining, 1 -> 0) counts down, like a pie-timer's hand sweeping
     round — the second color-stop's position of plain "0" is a standard
     conic-gradient trick: since it's less than the first stop's actual
     angle, it gets clamped up to meet it, so --accent-dim fills exactly
     the rest of the circle instead of needing its own calc(). */
  .tapin-btn.on-cooldown {
    background: conic-gradient(var(--accent) calc(var(--tapin-frac, 1) * 360deg), var(--accent-dim) 0);
  }
  /* Swaps for the mm:ss label at the same cadence (see
     refreshTapInButtonState) — smaller than the emoji it replaces so a
     4-5 character countdown still fits inside this small a circle. */
  .tapin-btn-label.is-countdown {
    font-size: clamp(7px, 2.4cqmin, 9px);
    font-weight: 700;
  }

  /* Auth screen now fills the whole chat card and centers its content,
     since the top tab/header bar has been removed on this screen. */
  .auth {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5cqh, 28px) clamp(14px, 4cqw, 24px) clamp(14px, 4cqh, 24px);
    overflow-y: auto;
  }
  .auth-inner {
    width: 100%;
    max-width: 320px;
  }
  label {
    display: block;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    margin: clamp(8px, 2.5cqh, 14px) 0 clamp(4px, 1.2cqh, 6px);
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* Readable text box — flat, no inset/bevel shadow */
  input[type="text"] {
    width: 100%;
    /* cqmin (not cqw/cqh separately) so this can't drift out of ratio
       with the round buttons beside it (see .status-actions etc. below)
       on a container whose width and height grow at different rates —
       a wide-but-short pane on a big screen, or Safari zoomed out, was
       letting cqw-sized things and cqh-sized things scale apart from
       each other, which read as everything "smushed" together. */
    padding: clamp(8px, 2.4cqmin, 11px) clamp(8px, 2.4cqmin, 12px);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: clamp(2px, 1cqmin, 4px);
    color: var(--text);
    font-size: max(16px, 3.6cqw);
    font-family: var(--font-body);
    outline: none;
  }
  input:focus { border-color: var(--accent); }

  .auth-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1.4cqh, 6px);
    margin-top: clamp(14px, 4.5cqh, 22px);
  }

  .auth-msg {
    margin-top: clamp(8px, 2.4cqh, 12px);
    font-size: clamp(10px, 2.8cqw, 13px);
    color: var(--error);
    min-height: 16px;
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(10px, 3.2cqh, 16px) clamp(10px, 3.4cqw, 18px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2.4cqh, 12px);
  }
  /* flat, thin scrollbar */
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--accent-dim);
    border-radius: 4px;
  }

  .msg {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }

  .msg-meta {
    font-size: clamp(12px, 2.6cqw, 14px);
    color: var(--text-dim);
    font-family: var(--font-display);
    letter-spacing: 0.02em;
  }
  .msg.mine .msg-meta { color: var(--accent); }

  /* Username within the meta line — bolder and a step larger than the
     timestamp it sits next to, so it reads as the "who" at a glance. */
  .msg-name {
    font-weight: 800;
    font-size: 1.15em;
  }

  /* Message bubbles are the one readable "text box" in the message list */
  .msg-bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: clamp(6px, 1.8cqh, 8px) clamp(8px, 2.4cqw, 12px);
    border-radius: clamp(6px, 2cqw, 10px);
    font-size: clamp(13px, 3cqw, 16px);
    line-height: 1.4;
    word-break: break-word;
  }
  .msg.mine .msg-bubble {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #ffffff;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 20px;
  }

  /* "X has tapped in" join notice — smaller and dimmer than a real
     message bubble, and centered rather than left/right-aligned like
     one, so it reads as a system line rather than something someone
     said. */
  .system-msg {
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-display);
    letter-spacing: 0.02em;
    font-size: clamp(10px, 2.4cqw, 12px);
  }

  .composer-bar {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: transparent;
  }

  .composer-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* cqmin — see the note on .status-actions above */
    padding: clamp(5px, 1.6cqmin, 8px) clamp(10px, 3cqmin, 14px) 0;
  }

  .composer {
    display: flex;
    gap: clamp(5px, 1.8cqmin, 8px);
    padding: clamp(8px, 2.8cqmin, 14px);
    flex: 0 0 auto;
  }
  .composer input {
    flex: 1;
  }
  .send-btn {
    width: clamp(34px, 10cqmin, 42px);
    font-size: clamp(14px, 3.8cqmin, 18px);
    flex: none;
  }

  .loading {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 40px 20px;
  }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="layout" id="layout">
  <div class="video-pane is-loading" id="videoPane">
    <div class="video-stage" id="videoStage">
      <div class="video-pane-actions">
        <button class="pill-btn unmute-btn" id="unmuteBtn" title="Unmute">Unmute</button>
        <button class="pill-btn toggle-chat-btn" id="toggleChatBtn" title="Hide chat">Hide Chat</button>
      </div>
      <!-- Was permanent text in the bar below the video; now lives here
           so it shows/hides with the rest of the controls instead of
           sitting on screen at all times. -->
      <div class="viewer-badge" id="viewerBadge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="activeViewersCount">0</span>
      </div>
      <div class="video-frame-wrap">
        <!-- No src here on purpose — it's set by JS once the configured
             video id loads (see LIVE STREAM VIDEO below), so it's never
             pointed at a stale hardcoded id even for a moment. The
             .video-pane.is-loading overlay already hides this iframe
             until playback actually starts, so the brief async gap
             before src is set isn't visible. -->
        <iframe
          id="ytFrame"
          allowfullscreen
          scrolling="no"
          allow="accelerometer *; autoplay *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
          referrerpolicy="strict-origin"
          style="pointer-events: none;">
        </iframe>
      </div>
      <div class="video-loading" id="videoLoading">
        <img class="offline-frame" src="/KNOBSOCK-live-offline.png" alt="We are currently offline">
        <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
      </div>
      <div class="video-controls" id="videoControls">
        <button class="round-btn play-pause-btn" id="playPauseBtn" title="Pause" disabled>&#10074;&#10074;</button>
        <input type="range" class="scrub-range" id="scrubRange" min="0" max="100" step="0.1" value="0" disabled />
        <span class="time-label" id="timeLabel">0:00 / 0:00</span>
        <!-- Grey dot = watching a VOD, or scrubbed behind the live edge;
             red = caught up to live. Click jumps back to live (from a
             VOD or a scrub), or to the offline card if nothing's live
             right now — see updateLiveButtonState()/goLiveClicked()
             near LIVE STREAM VIDEO STATE below. -->
        <button type="button" class="live-btn" id="liveBtn" title="Go to live">
          <span class="live-dot" id="liveDot" aria-hidden="true"></span>
          Live
        </button>
        <button class="round-btn fullscreen-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
      </div>
    </div>
    <!-- Doubles as the VODs handle on mobile: the whole bar is the tap
         target there (see the click wiring in the VODs DRAWER script),
         which is why the chevron lives in here rather than on a
         separate nub below. Desktop keeps its own .vods-tab and this
         bar stays a plain readout. -->
    <div class="stream-stats" id="streamStats">
      <span class="stream-stats-vods" aria-hidden="true">VODS<span class="stream-stats-chevron">&#9660;</span></span>
    </div>
  </div>

  <div class="chat-pane" id="chatPane">
    <!-- Overlays the top of the chat card. Drawer first, tab second, so
         the tab stays on the panel's bottom edge: closed, it's a nub
         hanging off the video's "N watching" bar (mobile) or a "VODS"
         bar butted against the video (desktop); open, it rides down to
         the bottom of the list. See the VODs DRAWER CSS above. -->
    <div class="vods-panel" id="vodsPanel">
      <div class="vods-drawer" id="vodsDrawer">
        <div class="vods-heading">VODS</div>
        <div class="vods-list" id="vodsList">
          <div class="vods-empty">No past streams yet.</div>
        </div>
      </div>
      <button type="button" class="vods-tab" id="vodsTab" title="Past streams">
        <span class="vods-tab-label">VODS</span>
        <span class="vods-tab-chevron" aria-hidden="true">&#9660;</span>
      </button>
    </div>
    <div class="chat-card" id="app">
      <div class="loading">Loading chat…</div>
    </div>
  </div>
</div>

<script>
(function () {
  var layout = document.getElementById('layout');
  var toggleBtn = document.getElementById('toggleChatBtn');
  toggleBtn.addEventListener('click', function () {
    var hidden = layout.classList.toggle('chat-hidden');
    toggleBtn.textContent = hidden ? 'Show Chat' : 'Hide Chat';
    toggleBtn.title = hidden ? 'Show chat' : 'Hide chat';
  });
})();

(function () {
  // Browsers block unmuted autoplay, so the video has to start muted.
  // The YouTube IFrame Player API attaches to the existing #ytFrame embed
  // (it must have enablejsapi=1 in its src, which it does) so the custom
  // controls below can drive real playback without reloading the video.
  var unmuteBtn = document.getElementById('unmuteBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var scrubRange = document.getElementById('scrubRange');
  var timeLabel = document.getElementById('timeLabel');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var videoPane = document.getElementById('videoPane');
  var videoLoading = document.getElementById('videoLoading');
  var layoutEl = document.getElementById('layout');
  var ytPlayer = null;
  var isDragging = false;
  var pollTimer = null;

  function showVideoLoading() {
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');
  }
  function hideVideoLoading() {
    videoLoading.hidden = true;
    videoPane.classList.remove('is-loading');
  }

  // ---------- Controls visibility ----------
  // Real hover reveals the controls on desktop (mouseenter/mouseleave).
  // Touch devices have no hover, so a tap shows them instead, auto-hiding
  // after a few seconds — and, since that leaves no way to dismiss them
  // on purpose, a second tap anywhere on the video itself hides them
  // immediately too. Tapping an actual control (unmute, scrub bar, etc)
  // never counts as that second "close" tap — it should just do its own
  // thing, not also yank the bar out from under it.
  var CONTROLS_AUTO_HIDE_MS = 3000;
  var supportsHover = window.matchMedia('(hover: hover)').matches;
  var controlsHideTimer = null;

  function showControls(autoHide) {
    videoPane.classList.add('controls-visible');
    clearTimeout(controlsHideTimer);
    if (autoHide) {
      controlsHideTimer = setTimeout(function () {
        videoPane.classList.remove('controls-visible');
      }, CONTROLS_AUTO_HIDE_MS);
    }
  }
  function hideControlsNow() {
    clearTimeout(controlsHideTimer);
    videoPane.classList.remove('controls-visible');
  }

  if (supportsHover) {
    videoPane.addEventListener('mouseenter', function () { showControls(false); });
    videoPane.addEventListener('mouseleave', function () { hideControlsNow(); });
  } else {
    videoPane.addEventListener('touchstart', function (e) {
      // The watching bar lives inside this pane but is its own control
      // (it opens the VODs drawer on mobile), so it must not also count
      // as "tapped the video" — otherwise one tap is spent toggling the
      // player controls and the bar needs a second one to register.
      if (e.target.closest('.stream-stats')) return;
      if (e.target.closest('.video-pane-actions, .viewer-badge, .video-controls')) {
        showControls(true);
        return;
      }
      if (videoPane.classList.contains('controls-visible')) {
        hideControlsNow();
      } else {
        showControls(true);
      }
    }, { passive: true });
  }

  unmuteBtn.disabled = true;

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    var min = parseFloat(scrubRange.min) || 0;
    var max = parseFloat(scrubRange.max) || 100;
    var val = parseFloat(scrubRange.value) || 0;
    var pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(state) {
    if (state === YT.PlayerState.PLAYING) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {

  function updateProgress() {

    var current = ytPlayer.getCurrentTime();

  // ---------- LIVE STREAM VIDEO STATE ----------
  // Bridges from the Firebase-backed admin config (videoId + isLive)
  // watched in the main chat script further down — that script runs
  // later, in its own IIFE, so it calls this via window instead of
  // reaching in and touching ytPlayer directly. Keeping every actual
  // player lifecycle call here, next to ytPlayer/showVideoLoading/
  // hideVideoLoading, beats duplicating YT Player API calls across two
  // separate script blocks.
  // configuredLiveVideoId/configuredIsLive track admin.html's live
  // config as-is; loadedVideoId is whatever #ytFrame is ACTUALLY
  // showing right now, which diverges from the config while
  // watchingVodId is set (a viewer picked something from the VODs
  // drawer) — applyLiveVideoState below still runs on every config
  // change either way (so the Live button's grey/red state and
  // "return to live" always have a fresh target), it just skips
  // actually touching the player while a VOD is up, same idea as a
  // podcast app not yanking you off a downloaded episode just because
  // a new one dropped.
  var configuredLiveVideoId = null;
  var configuredIsLive = false;
  var loadedVideoId = null;
  var watchingVodId = null;
  var ytApiRequested = false;
  var liveBtn = document.getElementById('liveBtn');

  function requestYouTubeIframeApi() {
    if (ytApiRequested) return;
    ytApiRequested = true;

    s.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(s);
  }

  // Same "behind live" threshold feel as YouTube's own player: still
  // counts as caught up within a few seconds of the live edge (normal
  // buffering jitter), grey once you've actually scrubbed back.
  var LIVE_EDGE_THRESHOLD_SEC = 8;

  // Red whenever you're on the live slot — including when that slot is
  // showing the offline card, since you're still "on live", there just
  // isn't a stream in it right now. The only two things that grey it
  // out are the two things you'd click it to undo: watching a VOD, and
  // having scrubbed back off the live edge mid-stream.
  function updateLiveButtonState() {
    if (!liveBtn) return;
    var onLiveSlot = !watchingVodId;
    var behindEdge = false;
    if (onLiveSlot && configuredIsLive && ytPlayer && typeof ytPlayer.getDuration === 'function') {
      var duration = ytPlayer.getDuration();
      var current = ytPlayer.getCurrentTime();
      behindEdge = duration > 0 && (duration - current) > LIVE_EDGE_THRESHOLD_SEC;
    }
    var atLive = onLiveSlot && !behindEdge;
    liveBtn.classList.toggle('at-live', atLive);
    liveBtn.title = watchingVodId ? 'Return to live' : (atLive ? 'Live' : 'Jump to live');
  }

  // Called on every config change, not just page load — admin.html's
  // "Go Offline"/"Go Live" toggle needs to take effect immediately for
  // anyone already sitting on the page, not just on their next visit.
  window.applyLiveVideoState = function (videoId, isLive) {
    configuredLiveVideoId = isLive ? videoId : null;
    configuredIsLive = !!isLive;
    updateLiveButtonState();
    if (watchingVodId) return; // a viewer's own VOD choice isn't interrupted by a config change alone

    if (!isLive) {
      loadedVideoId = null;
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      showVideoLoading();
      return;

    if (videoId === loadedVideoId) return; // already showing this exact video
    loadedVideoId = videoId;

    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById(videoId);
      return;
    }

    var frame = document.getElementById('ytFrame');
    if (frame) {
      frame.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0';
    }
    requestYouTubeIframeApi();
  };

  // The VODs drawer (built in the main chat script further down) calls
  // this to switch the player over to a picked-out VOD.
  window.switchToVod = function (vodId) {
    if (!vodId || (watchingVodId === vodId && loadedVideoId === vodId)) return;
    watchingVodId = vodId;
    loadedVideoId = vodId;
    showVideoLoading();
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById(vodId);
    } else {
      var frame = document.getElementById('ytFrame');
      if (frame) {
        frame.src = 'https://www.youtube.com/embed/' + vodId + '?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0';

  // unmuteBtn's — calls this. Also exposed on window since the VODs
  // drawer's "now playing" state needs to know when the viewer has
  // left a VOD via this path, not just by picking a different one.
  window.returnToLive = function () {

    liveBtn.addEventListener('click', function () {
      if (watchingVodId) {
        window.returnToLive();
        return;
      }

        // "take me to the live slot," which is the offline card when
        // there's nothing there.

    // snapshot or player poll — you land on the live slot, so it should
    // already be red when the page finishes loading.
    updateLiveButtonState();
  }

  unmuteBtn.addEventListener('click', function () {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) {
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      unmuteBtn.textContent = 'Mute';
      unmuteBtn.title = 'Mute';
    } else {
      ytPlayer.mute();
      unmuteBtn.textContent = 'Unmute';
      unmuteBtn.title = 'Unmute';
    }
  });

  playPauseBtn.addEventListener('click', function () {
    if (!ytPlayer) return;
    var state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    var duration = ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max);
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (ytPlayer) ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    isDragging = false;
  });

  var usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen
    );
  }

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      var result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(function () { enterPseudoFullscreen(); });
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function updateFullscreenIcon() {
    var fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';
    // Belt-and-suspenders alongside the video pane's own fullscreen
    // sizing: explicitly hide the chat pane rather than relying solely
    // on the video covering it, so there's no overlap even if a
    // rebuffer briefly makes the (fullscreened) video pane's background
    // transparent again.
    layoutEl.classList.toggle('fullscreen-active', fs);
  }

  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) {
      requestFs(videoPane);
    } else {
      enterPseudoFullscreen();
    }
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenIcon);
    }
  );
})();
</script>
