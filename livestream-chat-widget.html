  }

  devicesRef.doc(CLIENT_ID).onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const lockedName = (data && data.username) || null;
    const hadLock = deviceLockedUsername;
    deviceLockedUsername = lockedName;
    markDeviceLockReady();

    lastTapInAt = (data && data.lastTapInAt) || 0;
    refreshTapInButtonState();
    refreshChatGateState();

    myStreak = (data && data.streak) || 0;
    myStreakDay = (data && data.streakDay) || null;

    if (!currentlyBanned && hadLock && !lockedName && session) {
      session = null;
      forgetRememberedUsername();
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderAuth('An admin signed you out — pick a new username to keep chatting.');
    }
  }, () => {

    markDeviceLockReady();
  });

  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const deviceRef = devicesRef.doc(CLIENT_ID);

    try {
      const deviceDoc = await deviceRef.get();
      const lockedName = deviceDoc.exists && deviceDoc.data() && deviceDoc.data().username;
      if (lockedName) {
        return { username: lockedName, isNew: false };
      }
    } catch (e) {
      console.error('Device lock check failed, proceeding as a normal claim:', e);
    }

    const finalUsername = await db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (baseDoc.exists) {
        throw new Error('USERNAME_TAKEN');
      }
      tx.set(baseRef, {
        username: rawUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

        lastDeviceId: CLIENT_ID
      });
      return rawUsername;
    });

    devicesRef.doc(CLIENT_ID).set({
      username: finalUsername,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));

    return { username: finalUsername, isNew: true };
  }

  function logIpBestEffort(finalUsername) {
    fetch('https://api.ipify.org?format=json')
      .then(res => res.ok ? res.json() : null)
      .then(data => (data && data.ip) ? hashIp(data.ip) : null)
      .then(ipHash => {
        if (!ipHash) return;
        const now = Date.now();
        return ipLogRef.doc(finalUsername.toLowerCase()).set({
          ipHash: ipHash,
          loggedAt: now,
          expiresAt: new Date(now + IP_RETENTION_DAYS * 24 * 60 * 60 * 1000)
        });
      })
      .catch(() => {});
  }

  async function sendMessageToFirestore(entry) {
    await messagesRef.add({
      username: entry.username,
      text: entry.text,
      color: myCurrentColor(),
      deviceId: CLIENT_ID,
      ts: Date.now()
    });
  }

  function sendJoinNotice(username) {
    messagesRef.add({
      type: 'join',
      username: username,
      text: 'has joined',
      deviceId: CLIENT_ID,
      ts: Date.now()
    }).catch(() => {});
  }

  const CHAT_UNLOCK_MS = 24 * 60 * 60 * 1000;
  let lastTapInAt = 0;
  let tapinCooldownTimer = null;
  let chatGateTimer = null;

  let myStreak = 0;
  let myStreakDay = null;

  const pendingOwnTapinTimestamps = new Set();

  function formatHms(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function isChatUnlocked() {
    return lastTapInAt > 0 && (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt)) > 0;
  }

  function refreshChatGateState() {
    const status = $('chatGateStatus');
    const lockTimer = $('chatLockTimer');
    const input = $('msgInput');
    const sendBtn = $('sendBtn');
    if (!status || !lockTimer || !input || !sendBtn) return;
    clearTimeout(chatGateTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    const unlocked = lastTapInAt > 0 && remaining > 0;
    input.disabled = !unlocked;
    sendBtn.disabled = !unlocked;
    input.placeholder = unlocked ? 'Type a message…' : 'Tap in above to chat…';
    const tapinBtn = $('tapinBtn');
    if (tapinBtn) tapinBtn.classList.toggle('is-required', !unlocked);
    if (unlocked) {
      status.textContent = '';
      status.classList.remove('is-locked');
      lockTimer.textContent = 'Chat locks again in ' + formatHms(remaining);
      chatGateTimer = setTimeout(refreshChatGateState, 1000);
    } else {
      status.textContent = 'Tap in to chat →';
      status.classList.add('is-locked');
      lockTimer.textContent = '';
    }
  }

  const TAPIN_ICON_HTML = '<img class="tapin-btn-icon" src="/tapin-cheers.png" alt="">';

  function utcDayKey(ts) {
    return new Date(ts).toISOString().slice(0, 10);
  }

  function nextStreakAfterTapIn(ts) {
    const todayKey = utcDayKey(ts);
    if (myStreakDay === todayKey) return { streak: myStreak, day: todayKey };
    const yesterdayKey = utcDayKey(ts - 24 * 60 * 60 * 1000);
    return { streak: myStreakDay === yesterdayKey ? myStreak + 1 : 1, day: todayKey };
  }

  function fetchFirstPlaceStreak() {
    return devicesRef.orderBy('streak', 'desc').limit(15).get().then((snap) => {
      const todayKey = utcDayKey(Date.now());
      const yesterdayKey = utcDayKey(Date.now() - 24 * 60 * 60 * 1000);
      let first = null;
      snap.forEach((doc) => {
        if (first) return;
        const data = doc.data();
        if (!data.streak || (data.streakDay !== todayKey && data.streakDay !== yesterdayKey)) return;
        first = { username: data.username || '?', streak: data.streak };
      });
      return first;
    }).catch(() => null);
  }

  const STREAK_BAR_VISIBLE_MS = 8000;
  let streakBarHideTimer = null;
  let streakBarToken = 0;

  function showStreakBar(streak) {
    const wrap = $('streakBarWrap');
    const bar = $('streakBar');
    if (!wrap || !bar) return;
    const token = ++streakBarToken;

    clearTimeout(streakBarHideTimer);
    bar.innerHTML = `<span class="streak-bar-mine"><img class="streak-fire-icon" src="/streak-fire.gif" alt=""> ${streak} day streak</span>`;
    wrap.classList.add('is-visible');
    streakBarHideTimer = setTimeout(() => {
      wrap.classList.remove('is-visible');

      void wrap.offsetHeight;
    }, STREAK_BAR_VISIBLE_MS);

    fetchFirstPlaceStreak().then((first) => {

      if (token !== streakBarToken || !wrap.classList.contains('is-visible') || !first) return;
      bar.insertAdjacentHTML('beforeend',
        `<span class="streak-bar-divider">|</span><span class="streak-bar-lb-entry"><img class="streak-medal-icon" src="/streak-medal-gold.png" alt=""> 1st place: ${escapeHtml(first.username)}</span>`
      );
    });
  }

  function refreshTapInButtonState() {
    const btn = $('tapinBtn');
    const label = $('tapinBtnLabel');
    if (!btn) return;
    clearTimeout(tapinCooldownTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    if (remaining > 0) {
      btn.disabled = true;
      btn.classList.add('on-cooldown');
      btn.style.setProperty('--tapin-frac', String(Math.max(0, remaining / CHAT_UNLOCK_MS)));
      if (label) label.innerHTML = TAPIN_ICON_HTML;

      tapinCooldownTimer = setTimeout(refreshTapInButtonState, Math.min(remaining, 30000));
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cooldown');
      btn.style.removeProperty('--tapin-frac');
      if (label) label.innerHTML = TAPIN_ICON_HTML;
    }
  }

  async function sendTapIn() {
    if (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt) > 0) return;
    lastTapInAt = Date.now();
    refreshTapInButtonState();
    refreshChatGateState();
    const ts = Date.now();
    pendingOwnTapinTimestamps.add(ts);

    const next = nextStreakAfterTapIn(ts);
    myStreak = next.streak;
    myStreakDay = next.day;
    showStreakBar(myStreak);

    try {
      await devicesRef.doc(CLIENT_ID).set({
        lastTapInAt: lastTapInAt,
        streak: myStreak,
        streakDay: myStreakDay
      }, { merge: true });
      await messagesRef.add({
        type: 'tapin',
        username: session.username,
        text: 'just tapped in',
        deviceId: CLIENT_ID,
        ts: ts
      });
    } catch (e) {
      console.error('Tap in failed:', e);
    } finally {

      setTimeout(() => pendingOwnTapinTimestamps.delete(ts), 30000);
    }
  }

  function triggerTapInEffect(username) {
    try {
      window.parent.postMessage({ type: 'knobsock-tapin', username: username }, '*');
    } catch (e) {}
  }

  const SPAM_MESSAGE_THRESHOLD = 10;
  const SPAM_WINDOW_MS = 60 * 1000;
  const SPAM_TIMEOUT_MS = 10 * 60 * 1000;
  const recentMessagesByDevice = {};
  const spamActionedDeviceIds = new Set();

  function checkSpam(m) {
    if (!m.deviceId || m.type === 'join' || m.type === 'tapin') return;
    const arr = recentMessagesByDevice[m.deviceId] || (recentMessagesByDevice[m.deviceId] = []);
    arr.push(m.ts || Date.now());
    const cutoff = Date.now() - SPAM_WINDOW_MS;
    while (arr.length && arr[0] < cutoff) arr.shift();
    if (arr.length <= SPAM_MESSAGE_THRESHOLD || spamActionedDeviceIds.has(m.deviceId)) return;
    spamActionedDeviceIds.add(m.deviceId);
    bansRef.doc(m.deviceId).set({
      bannedAt: Date.now(),
      bannedBy: 'system (auto spam filter)',
      expiresAt: Date.now() + SPAM_TIMEOUT_MS,
      reason: 'Automatic timeout: sent ' + arr.length + ' messages in under a minute',
      enforced: true,
      usernames: firebase.firestore.FieldValue.arrayUnion(m.username)
    }, { merge: true }).catch((e) => console.error('Auto-timeout failed:', e));
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderMessageText(text) {
    return escapeHtml(censorText(String(text || ''))).replace(/:([a-z0-9_-]{1,32}):/gi, function (match, name) {
      const emoji = chatEmojiByName[String(name).toLowerCase()];
      if (!emoji) return match;
      return '<img class="chat-emoji" src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(match) + '" title="' + escapeHtml(match) + '" loading="lazy">';
    });
  }

  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {

    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  function buildUsernameCensorRegex(word) {
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp(pattern, 'i');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
  let USERNAME_CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildUsernameCensorRegex);

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
    USERNAME_CENSOR_REGEXES = words.map(buildUsernameCensorRegex);
  }, () => {});

  function usernameContainsCensoredWord(name) {
    return USERNAME_CENSOR_REGEXES.some(re => re.test(name));
  }

  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const previousClearedAt = clearedAt;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;

    if (clearedAt > previousClearedAt && typeof messageCache !== 'undefined') {
      messageCache = messageCache.filter((m) => m && m.ts > clearedAt);
      saveMessageCache();
    }

    if (session && subscribedClearedAt !== clearedAt) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  const COLOR_CACHE_KEY = 'chat_color_cache_v1';
  const COLOR_CACHE_TTL = 12 * 60 * 60 * 1000;

  const usernameColorCache = (function () {
    try {
      const raw = JSON.parse(localStorage.getItem(COLOR_CACHE_KEY) || '{}');
      if (raw && typeof raw.at === 'number' && Date.now() - raw.at < COLOR_CACHE_TTL && raw.colors) {
        return raw.colors;
      }
    } catch (e) {}
    return {};
  })();

  let colorCacheSaveTimer = null;
  function persistColorCache() {
    clearTimeout(colorCacheSaveTimer);
    colorCacheSaveTimer = setTimeout(() => {
      try {
        const colors = {};
        Object.keys(usernameColorCache).forEach((k) => {
          if (usernameColorCache[k] !== 'pending') colors[k] = usernameColorCache[k];
        });
        localStorage.setItem(COLOR_CACHE_KEY, JSON.stringify({ at: Date.now(), colors: colors }));
      } catch (e) {}
    }, 1000);
  }

  function rememberColor(username, color) {
    usernameColorCache[username.toLowerCase()] = color;
    persistColorCache();
  }

  function myCurrentColor() {
    if (!session) return null;
    const cached = usernameColorCache[session.username.toLowerCase()];
    return (cached && cached !== 'pending') ? cached : defaultColorFor(session.username);
  }

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        persistColorCache();
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username);
  }

  function renderAuth(errorMsg, prefillUsername, termsChecked) {
    app.innerHTML = `
      <div class="chat-screen auth-screen">
        <div class="auth">
          <div class="auth-inner">
            <label for="chatHandle">what are you gonna call yourself?</label>

            <input type="text" id="chatHandle" name="chatHandle" autocomplete="off" placeholder="e.g. gunoguap" value="${prefillUsername ? escapeHtml(prefillUsername) : ''}" />
            <label class="auth-terms"><input type="checkbox" id="authTerms"${termsChecked ? ' checked' : ''}> I agree to the <a href="/privacy">Privacy Policy &amp; User Agreement</a>.</label>
            <div class="auth-actions">
              <button class="pill-btn auth-submit-btn" id="authSubmit" title="Join Chat">Join Chat</button>
            </div>
            <div class="auth-msg">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
          </div>
        </div>
      </div>
    `;

    $('authSubmit').addEventListener('click', handleAuthSubmit);
    $('chatHandle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAuthSubmit();
    });
    $('chatHandle').focus();
  }

  async function handleAuthSubmit() {
    const username = $('chatHandle').value.trim();
    const termsChecked = $('authTerms').checked;
    const btn = $('authSubmit');

    if (!username) {
      renderAuth('Enter a username.', username, termsChecked);
      return;
    }
    if (username.length > 24 || /\s/.test(username)) {
      renderAuth('Username must be 24 chars or fewer, no spaces.', username, termsChecked);
      return;
    }
    if (usernameContainsCensoredWord(username)) {
      renderAuth('That username isn\'t allowed. Please choose another.', username, termsChecked);
      return;
    }
    if (!termsChecked) {
      renderAuth('Please agree to the Privacy Policy & User Agreement first.', username, termsChecked);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const claim = await claimUsernameSlot(username);
      session = { username: claim.username };
      rememberUsername(claim.username);
      deviceLockedUsername = claim.username;

      if (claim.isNew) {
        logIpBestEffort(claim.username);
        sendJoinNotice(claim.username);
      }
      startChat();
    } catch (e) {
      console.error(e);
      if (e && e.message === 'USERNAME_TAKEN') {
        renderAuth('That username is already taken. Please choose another.', username, termsChecked);
      } else {
        renderAuth('Something went wrong. Please try again.', username, termsChecked);
      }
    }
  }

  const MAX_MSG_LEN = 400;
  const MSG_INPUT_HARD_CAP = 1000;

  function updateCharCounter() {
    const input = $('msgInput');
    const counter = $('charCounter');
    if (!input || !counter) return;
    const len = input.value.length;
    counter.textContent = len + '/' + MAX_MSG_LEN;
    counter.classList.toggle('is-over', len > MAX_MSG_LEN);
  }

  let limitMsgTimer = null;
  function flashLimitMsg() {
    const el = $('composerLimitMsg');
    if (!el) return;
    el.hidden = false;
    clearTimeout(limitMsgTimer);
    limitMsgTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  function renderChatShell() {

    const myColor = colorForUsername(session.username, () => {
      const picker = $('colorPicker');
      if (picker) picker.value = usernameColorCache[session.username.toLowerCase()];
    });

    app.innerHTML = `
      <div class="chat-screen">
        <div class="messages" id="messages">
          <div class="empty-state">Loading messages…</div>
        </div>
        <div class="composer-bar">
          <div class="streak-bar-wrap" id="streakBarWrap">
            <div class="streak-bar" id="streakBar"></div>
          </div>
          <div class="composer-status">
            <div class="who">Signed in as <b>${escapeHtml(session.username)}</b></div>
            <div class="status-actions">
              <span class="chat-gate-status" id="chatGateStatus"></span>
              <button type="button" class="round-btn tapin-btn" id="tapinBtn" title="Tap in!"><span class="tapin-btn-label" id="tapinBtnLabel"><img class="tapin-btn-icon" src="/tapin-cheers.png" alt=""></span></button>
              <input type="color" class="color-picker" id="colorPicker" title="Pick your name color" value="${myColor}">
            </div>
          </div>
          <div class="chat-lock-timer" id="chatLockTimer"></div>
          <div class="composer">
            <div class="composer-input-wrap">
              <input type="text" id="msgInput" placeholder="Type a message…" maxlength="${MSG_INPUT_HARD_CAP}" />
              <span class="char-counter" id="charCounter">0/${MAX_MSG_LEN}</span>
            </div>
            <div class="emoji-picker-wrap">
              <button type="button" class="emoji-picker-toggle" id="emojiPickerToggle" title="Custom emojis" aria-label="Custom emojis" aria-expanded="false">☺</button>
              <div class="emoji-picker-popover" id="emojiPickerPopover"></div>
            </div>
            <button class="send-btn" id="sendBtn" title="Send" aria-label="Send"><img src="/send-button.png" alt=""></button>
          </div>
          <div class="composer-limit-msg" id="composerLimitMsg" hidden>Messages have to be ${MAX_MSG_LEN} characters or fewer — trim it down and hit send again.</div>
        </div>
      </div>
    `;

    $('colorPicker').addEventListener('input', (e) => {
      const color = e.target.value;
      const key = session.username.toLowerCase();
      rememberColor(key, color);
      usernamesRef.doc(key).set({ color: color }, { merge: true }).catch((err) => console.error(err));
      if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);
    });

    $('sendBtn').addEventListener('click', sendMessage);
    $('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    $('msgInput').addEventListener('input', updateCharCounter);
    $('emojiPickerToggle').addEventListener('click', function () {
      const popover = $('emojiPickerPopover');
      const isOpen = popover.classList.toggle('is-open');
      this.setAttribute('aria-expanded', String(isOpen));
    });
    updateCharCounter();
    renderEmojiPicker();

    /* Messages need to keep their native vertical drag-to-scroll behavior.
       A stationary tap on that same surface is treated as a player tap, so
       portrait controls can be revealed from anywhere over the video. */
    const messagesEl = $('messages');
    let messageTouchStart = null;
    let ignoreMessageClickUntil = 0;
    function isMessageInteractive(target) {
      return !!(target && target.closest('a, button, input, textarea, select, label'));
    }
    function toggleFromMessageTap(event) {
      if (isMessageInteractive(event.target)) return;
      if (typeof window.togglePortraitVideoControls === 'function') {
        window.togglePortraitVideoControls();
      }
    }
    messagesEl.addEventListener('touchstart', (event) => {
      if (isMessageInteractive(event.target)) { messageTouchStart = null; return; }
      const touch = event.touches && event.touches[0];
      messageTouchStart = touch ? { x: touch.clientX, y: touch.clientY, at: Date.now() } : null;
    }, { passive: true });
    messagesEl.addEventListener('touchend', (event) => {
      const touch = event.changedTouches && event.changedTouches[0];
      const started = messageTouchStart;
      messageTouchStart = null;
      if (!started || !touch || Date.now() - started.at > 450) return;
      if (Math.abs(touch.clientX - started.x) > 12 || Math.abs(touch.clientY - started.y) > 12) return;
      ignoreMessageClickUntil = Date.now() + 750;
      toggleFromMessageTap(event);
    }, { passive: true });
    messagesEl.addEventListener('click', (event) => {
      if (Date.now() < ignoreMessageClickUntil) return;
      toggleFromMessageTap(event);
    });

    $('tapinBtn').addEventListener('click', () => {
      if (typeof window.unmuteLivePlayer === 'function') window.unmuteLivePlayer();
      sendTapIn();
    });
    refreshTapInButtonState();
    refreshChatGateState();
    if (typeof window.syncPortraitMobileLiveButton === 'function') window.syncPortraitMobileLiveButton();
  }

  let lastRenderedMsgs = null;

  function renderEmojiPicker() {
    const popover = $('emojiPickerPopover');
    if (!popover) return;
    if (!chatEmojis.length) {
      popover.innerHTML = '<div class="emoji-picker-empty">No custom emojis yet.</div>';
      return;
    }
    popover.innerHTML = chatEmojis.map(function (emoji) {
      const code = ':' + emoji.name + ':';
      return '<button type="button" class="emoji-choice" title="' + escapeHtml(code) + '" aria-label="' + escapeHtml(code) + '" data-emoji-code="' + escapeHtml(code) + '"><img src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(code) + '"></button>';
    }).join('');
    popover.querySelectorAll('.emoji-choice').forEach(function (button) {
      button.addEventListener('click', function () {
        const input = $('msgInput');
        if (!input || input.disabled) return;
        const code = button.getAttribute('data-emoji-code');
        const start = input.selectionStart || 0;
        const end = input.selectionEnd || 0;
        input.value = input.value.slice(0, start) + code + input.value.slice(end);
        const cursor = start + code.length;
        input.focus();
        input.setSelectionRange(cursor, cursor);
        updateCharCounter();
        popover.classList.remove('is-open');
        const toggle = $('emojiPickerToggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // Live chat is intentionally forward-only for viewers: a new tab begins
  // empty and receives messages from that moment on.  The transcript is kept
  // in sessionStorage only, so a reload of the same tab is seamless without
  // pulling history from Firestore, while a new visitor never sees old chat.
  const MESSAGE_CACHE_KEY = 'chat_message_session_v1';
  const MESSAGE_CACHE_LIMIT = 50;
  let messageCacheSaveTimer = null;
  let messageCache = [];
  let messageSessionStartedAt = 0;
  let messageSessionOwner = null;

  function startMessageSession(username) {
    if (messageSessionOwner === username && messageSessionStartedAt) return;
    messageSessionOwner = username;
    messageSessionStartedAt = Date.now();
    messageCache = [];
    try {
      const saved = JSON.parse(sessionStorage.getItem(MESSAGE_CACHE_KEY) || 'null');
      if (saved && saved.owner === username && typeof saved.startedAt === 'number' && Array.isArray(saved.messages)) {
        messageSessionStartedAt = saved.startedAt;
        messageCache = saved.messages
          .filter((m) => m && typeof m.id === 'string' && typeof m.ts === 'number')
          .sort((a, b) => a.ts - b.ts)
          .slice(-MESSAGE_CACHE_LIMIT);
      }
    } catch (e) {}
  }

  function saveMessageCache() {
    clearTimeout(messageCacheSaveTimer);
    messageCacheSaveTimer = setTimeout(() => {
      try {
        sessionStorage.setItem(MESSAGE_CACHE_KEY, JSON.stringify({
          owner: messageSessionOwner,
          startedAt: messageSessionStartedAt,
          messages: messageCache
        }));
      } catch (e) {}
    }, 250);
  }

  function mergeMessageCache(incoming) {
    const byId = new Map(messageCache.map((m) => [m.id, m]));
    incoming.forEach((m) => byId.set(m.id, m));
    messageCache = Array.from(byId.values())
      .filter((m) => m && typeof m.ts === 'number' && m.ts > clearedAt)
      .sort((a, b) => a.ts - b.ts)
      .slice(-MESSAGE_CACHE_LIMIT);
    saveMessageCache();
  }

  function messageCursor() {
    return messageCache.reduce(
      (latest, m) => Math.max(latest, m.ts || 0),
      Math.max(clearedAt || 0, messageSessionStartedAt || 0)
    );
  }

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say wassup</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      if (m.type === 'join') {
        return `<div class="system-msg">${escapeHtml(m.username)} has joined</div>`;
      }
      if (m.type === 'tapin') {
        return `<div class="system-msg">${escapeHtml(m.username)} just tapped in</div>`;
      }
      const mine = m.username === session.username;

      const nameColor = m.color || colorForUsername(m.username, () => renderMessages(lastRenderedMsgs));
      const nameHtml = `<span class="msg-name" style="color:${nameColor}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble">${renderMessageText(m.text)}</div>
        </div>
      `;
    }).join('');

    void container.offsetHeight;

    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    if (!isChatUnlocked()) return;
    const input = $('msgInput');
    if (input.value.length > MAX_MSG_LEN) {
      flashLimitMsg();
      return;
    }
    const text = censorText(input.value.trim());
    if (!text) return;
    input.value = '';
    input.disabled = true;
    updateCharCounter();

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
      updateCharCounter();
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  let clearedAt = 0;
  let subscribedClearedAt = null;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = null;
    if (document.visibilityState === 'hidden') return;
    subscribedClearedAt = clearedAt;

    let query = messagesRef.orderBy('ts', 'asc');
    const cursor = messageCursor();
    if (cursor) {
      // Include the cursor document and de-duplicate it locally.  `>=` avoids
      // losing two messages written in the same millisecond.
      query = query.where('ts', '>=', cursor);
    } else if (clearedAt) {
      query = query.where('ts', '>', clearedAt);
    }

    let sawServerSnapshot = false;

    const TAPIN_EFFECT_MAX_AGE_MS = 15000;

    function handleAddedChange(change, stillSettling) {
      if (change.type !== 'added') return;
      const m = change.doc.data();
      if (stillSettling && !pendingOwnTapinTimestamps.has(m.ts)) return;
      checkSpam(m);
      if (m.type === 'tapin' && Date.now() - m.ts < TAPIN_EFFECT_MAX_AGE_MS) {
        triggerTapInEffect(m.username);
      }
    }

    // Bound even a long-hidden tab: the UI only retains one screenful, so a
    // reconnect must never turn every message since its last visit into a
    // fresh baseline read.
    query = query.limitToLast(MESSAGE_CACHE_LIMIT);

    // Paint cached history before the network listener settles.  On a return
    // visit this is the same transcript the user just had, not an empty chat.
    renderMessages(messageCache);

    unsubscribeMessages = query
      .onSnapshot(
        (snapshot) => {
          const incoming = snapshot.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()));
          mergeMessageCache(incoming);
          renderMessages(messageCache);

          const stillSettling = !sawServerSnapshot;
          if (!snapshot.metadata.fromCache) sawServerSnapshot = true;
          snapshot.docChanges().forEach((change) => handleAddedChange(change, stillSettling));
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    startMessageSession(session.username);
    renderChatShell();
    subscribeToMessages();
    $('msgInput').focus();
  }

  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function enterAuthOrRestore() {
    await deviceLockPromise;

    if (currentlyBanned) return;

    if (deviceLockedUsername) {

      session = { username: deviceLockedUsername };
      rememberUsername(deviceLockedUsername);
      startChat();
      return;
    }

    const saved = getRememberedUsername();
    if (saved) {
      session = { username: saved };

      deviceLockedUsername = saved;
      devicesRef.doc(CLIENT_ID).set({
        username: saved,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));
      startChat();
      return;
    }

    renderAuth();
  }

  let currentlyBanned = false;
  let banExpiryTimer = null;

  function clearBanExpiryTimer() {
    if (banExpiryTimer) { clearTimeout(banExpiryTimer); banExpiryTimer = null; }
  }

  function scheduleBanExpiryRecheck(ban) {
    clearBanExpiryTimer();
    if (!ban || !ban.expiresAt) return;
    const msUntilExpiry = ban.expiresAt - Date.now();
    if (msUntilExpiry <= 0) return;
    banExpiryTimer = setTimeout(() => {

      bansRef.doc(CLIENT_ID).get().then(handleBanDoc).catch(() => {});
    }, msUntilExpiry + 250);
  }

  function handleBanDoc(doc) {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
      scheduleBanExpiryRecheck(ban);
      return;
    }
    clearBanExpiryTimer();

    if (ban && ban.expiresAt) {
      bansRef.doc(CLIENT_ID).delete().catch(() => {});
    }
    if (currentlyBanned) {

      currentlyBanned = false;
      enterAuthOrRestore();
    } else if (!session) {
      enterAuthOrRestore();
    }
  }

  bansRef.doc(CLIENT_ID).onSnapshot(handleBanDoc, () => {

    if (!session) enterAuthOrRestore();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (unsubscribeMessages) unsubscribeMessages();
      unsubscribeMessages = null;
      return;
    }
    if (session && !currentlyBanned) subscribeToMessages();
  });
})();
</script>

<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  if (!activeEl) return;

  const db = firebase.firestore();

  const HEARTBEAT_MS = 60000;
  const COUNT_REFRESH_MS = 30000;
  const ACTIVE_WINDOW_MS = 150000;

  const COUNT_URL = 'https://firestore.googleapis.com/v1/projects/chat-for-website-efee2/databases/(default)/documents:runAggregationQuery?key=AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM';

  const COUNT_TIMEOUT_MS = 15000;

  let presenceRef = null;
  let countInFlight = false;
  let serverSkewMs = 0;

  function serverNow() {
    return Date.now() + serverSkewMs;
  }

  function presenceSeed() {
    if (window.KNOBSOCK_CLIENT_ID) return window.KNOBSOCK_CLIENT_ID;
    try {
      const stored = localStorage.getItem('chat_client_id');
      if (stored) return stored;
    } catch (e) {}
    return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  }

  async function presenceDocId(seed) {
    try {
      const bytes = new TextEncoder().encode('knobsock-presence-v1' + seed);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).slice(0, 16)
        .map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      let h = 7;
      for (let k = 0; k < seed.length; k++) h = (h * 31 + seed.charCodeAt(k)) >>> 0;
      return 'p' + h.toString(36) + seed.length.toString(36);
    }
  }

  function writeHeartbeat() {
    if (!presenceRef || document.visibilityState === 'hidden') return;
    presenceRef.set({ lastSeen: serverNow() }).catch(() => {});
  }

  function readActiveCount() {
    if (countInFlight || document.visibilityState === 'hidden') return Promise.resolve();
    countInFlight = true;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), COUNT_TIMEOUT_MS);
    return fetch(COUNT_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        structuredAggregationQuery: {
          structuredQuery: {
            from: [{ collectionId: 'chat_presence' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'lastSeen' },
                op: 'GREATER_THAN',
                value: { integerValue: String(serverNow() - ACTIVE_WINDOW_MS) }
              }
            }
          },
          aggregations: [{ alias: 'viewers', count: {} }]
        }
      })
    })
      .then((res) => (res.ok ? res.json() : null))
      .then((rows) => {
        if (!Array.isArray(rows)) return;
        for (const row of rows) {
          if (!row || !row.result) continue;
          if (row.readTime) {
            const serverMs = Date.parse(row.readTime);
            if (serverMs) serverSkewMs = serverMs - Date.now();
          }
          const field = row.result.aggregateFields && row.result.aggregateFields.viewers;
          if (!field || field.integerValue == null) continue;
          activeEl.textContent = String(Math.max(1, parseInt(field.integerValue, 10) || 0));
          return;
        }
      })
      .catch(() => {})
      .finally(() => { clearTimeout(timer); countInFlight = false; });
  }

  presenceDocId(presenceSeed()).then((id) => {
    presenceRef = db.collection('chat_presence').doc(id);
    readActiveCount().then(writeHeartbeat, writeHeartbeat);
    setInterval(writeHeartbeat, HEARTBEAT_MS);
    setInterval(readActiveCount, COUNT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      readActiveCount().then(writeHeartbeat, writeHeartbeat);
    });
  });
})();
</script>

</body>
