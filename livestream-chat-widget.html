  // device had no durable identity, so two different people who both
  // wanted "gunoguap" needed some way to both get in; now that a device
  // is permanently locked to one name (see DEVICE LOCK above), nobody
  // needs to share a base name in the first place — a straight rejection
  // with a clear "try another name" is simpler and good enough.
  //
  // Returns { username, isNew }. isNew is false when this device already
  // owned a name coming in — the caller uses that to skip re-announcing
  // a "join" for a device that never actually left. Throws
  // Error('USERNAME_TAKEN') if the requested name belongs to a different
  // device already.
  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const deviceRef = devicesRef.doc(CLIENT_ID);

    // Checked as a plain read *before* the claim transaction, and any
    // failure here (offline, chat_devices not yet allowed by Firestore
    // rules, whatever) is treated as "no lock yet" rather than aborting —
    // a problem with the device lock must never be able to stop someone
    // from joining chat at all, only from the anti-impersonation lock
    // taking effect. This does reopen a narrow window where two tabs on
    // a brand-new device could each claim a different name a few
    // milliseconds apart before either lock write lands; that's an
    // acceptable trade for never bricking chat over it.
    try {
      const deviceDoc = await deviceRef.get();
      const lockedName = deviceDoc.exists && deviceDoc.data() && deviceDoc.data().username;
      if (lockedName) {
        return { username: lockedName, isNew: false };
      }
    } catch (e) {
      console.error('Device lock check failed, proceeding as a normal claim:', e);
    }

    // Isolated from the lock write below on purpose — this transaction
    // succeeding is what actually gets someone into chat, and it must
    // not depend on chat_devices being writable.
    const finalUsername = await db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (baseDoc.exists) {
        throw new Error('USERNAME_TAKEN');
      }
      tx.set(baseRef, {
        username: rawUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        // Whoever claims a given username slot keeps it forever (see
        // the comment above) — this is what lets admin.html resolve
        // "ban this person" from a username straight to the one
        // device that has ever actually owned it.
        lastDeviceId: CLIENT_ID
      });
      return rawUsername;
    });

    // Best-effort lock write: never blocks on this, and a failure here
    // (rules not updated for chat_devices yet, offline, etc.) can't undo
    // or fail the claim above — worst case the anti-impersonation lock
    // just doesn't take effect yet, chat still works either way.
    devicesRef.doc(CLIENT_ID).set({
      username: finalUsername,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));

    return { username: finalUsername, isNew: true };
  }

  // Fetches this browser's public IP from a keyless lookup service and
  // logs it on the just-claimed username doc — purely a reference clue
  // for admin.html (e.g. "these two names share an IP, might be the same
  // person"), never an enforcement point; see the CLIENT_ID comment
  // above for why a real IP block isn't possible from a static site.
  // Best-effort and fire-and-forget: a blocked/failed lookup just means
  // this one detail stays blank, nothing about chat itself depends on it.
  function logIpBestEffort(finalUsername) {
    fetch('https://api.ipify.org?format=json')
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (!data || !data.ip) return;
        return usernamesRef.doc(finalUsername.toLowerCase()).set({
          lastIp: data.ip,
          lastSeenAt: Date.now()
        }, { merge: true });
      })
      .catch(() => {});
  }

  async function sendMessageToFirestore(entry) {
    await messagesRef.add({
      username: entry.username,
      text: entry.text,
      deviceId: CLIENT_ID,
      ts: Date.now()
    });
  }

  // Posts a "X has joined" system line to the shared message feed when
  // someone joins. Fire-and-forget like logIpBestEffort above — a failed
  // write here shouldn't block the person from actually joining chat.
  function sendJoinNotice(username) {
    messagesRef.add({
      type: 'join',
      username: username,
      text: 'has joined',
      deviceId: CLIENT_ID,
      ts: Date.now()
    }).catch(() => {});
  }

  // ---------- TAP IN ----------
  // A fun, low-stakes button next to the color picker: posts a "just
  // tapped in" system line (same shared feed as join notices, just a
  // different type/text so the two read distinctly) and tells the
  // top-level page (see live.html) to run the fullscreen beer-can effect.
  // One tap per device per TAPIN_COOLDOWN_MS — enforced the same
  // best-effort way as everything else identity-related on this page
  // (see the DEVICE LOCK comments above): lastTapInAt lives on the same
  // chat_devices/<CLIENT_ID> doc already used for the device lock, and a
  // determined user could bypass the client-side check entirely. Not
  // worth a harder gate for a sound-effect button.
  const TAPIN_COOLDOWN_MS = 5 * 60 * 1000;
  let lastTapInAt = 0;
  let tapinCooldownTimer = null;

  // ts values of tap-in messages THIS TAB is actively in the middle of
  // writing right now — lets subscribeToMessages() recognize "this is
  // my brand new write" precisely during its own settling window (see
  // there for why that matters), without also matching this same
  // device's tap-ins from a past session that are simply still sitting
  // in history (deviceId alone can't tell those apart, since CLIENT_ID
  // persists across reloads). In-memory only and short-lived — nothing
  // here needs to survive a reload.
  const pendingOwnTapinTimestamps = new Set();

  // mm:ss, e.g. 299999ms -> "5:00", 7000ms -> "0:07".
  function formatCooldown(ms) {
    const totalSeconds = Math.ceil(ms / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  const TAPIN_EMOJI = '\u{1F37A}'; // matches the &#127866; the button starts with in the template above

  function refreshTapInButtonState() {
    const btn = $('tapinBtn');
    const label = $('tapinBtnLabel');
    if (!btn) return;
    clearTimeout(tapinCooldownTimer);
    const remaining = TAPIN_COOLDOWN_MS - (Date.now() - lastTapInAt);
    if (remaining > 0) {
      btn.disabled = true;
      btn.classList.add('on-cooldown');
      btn.style.setProperty('--tapin-frac', String(Math.max(0, remaining / TAPIN_COOLDOWN_MS)));
      if (label) {
        label.textContent = formatCooldown(remaining);
        label.classList.add('is-countdown');
      }
      // Reruns every second (not just once at the very end) so the
      // sweep and mm:ss label actually count down instead of only
      // flipping the button back on when the cooldown finally expires.
      tapinCooldownTimer = setTimeout(refreshTapInButtonState, Math.min(remaining, 1000));
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cooldown');
      btn.style.removeProperty('--tapin-frac');
      if (label) {
        label.textContent = TAPIN_EMOJI;
        label.classList.remove('is-countdown');
      }
    }
  }

  async function sendTapIn() {
    if (TAPIN_COOLDOWN_MS - (Date.now() - lastTapInAt) > 0) return; // button should already be disabled — belt & suspenders
    lastTapInAt = Date.now();
    refreshTapInButtonState();
    const ts = Date.now();
    pendingOwnTapinTimestamps.add(ts);
    try {
      await devicesRef.doc(CLIENT_ID).set({ lastTapInAt: lastTapInAt }, { merge: true });
      await messagesRef.add({
        type: 'tapin',
        username: session.username,
        text: 'just tapped in',
        deviceId: CLIENT_ID,
        ts: ts
      });
    } catch (e) {
      console.error('Tap in failed:', e);
    } finally {
      // Generous cleanup window — well past any realistic settling
      // delay, just here so this doesn't grow forever across a long
      // chat session with lots of tap-ins.
      setTimeout(() => pendingOwnTapinTimestamps.delete(ts), 30000);
    }
  }

  // Tells live.html (this widget's parent page, not itself — see the
  // "position:fixed inside an iframe" note near the top of this file) to
  // run the actual fullscreen sound+animation. The effect has to live up
  // there: this widget only ever fills the iframe box live.html gives it,
  // which on desktop sits below a header logo, so anything "fullscreen"
  // drawn in here could never actually cover the real browser viewport.
  function triggerTapInEffect(username) {
    try {
      window.parent.postMessage({ type: 'knobsock-tapin', username: username }, '*');
    } catch (e) {}
  }

  // ---------- SPAM AUTO-TIMEOUT ----------
  // More than SPAM_MESSAGE_THRESHOLD messages from the same device within
  // a rolling SPAM_WINDOW_MS gets a SPAM_TIMEOUT_MS timeout — written as
  // an ordinary expiring chat_bans doc, so every existing ban code path
  // (the ban-gate listener below, admin.html's ban list/unban button)
  // handles it with zero changes. Every connected tab independently
  // watches the same live message feed and can be the one to notice and
  // write the ban — including the spamming tab's own — the same
  // "whoever notices first cleans it up" pattern already used for stale
  // presence docs, so this doesn't depend on trusting the spamming
  // client to police itself. spamActionedDeviceIds just stops one tab
  // from re-writing the same ban on every subsequent message while
  // already over the threshold.
  const SPAM_MESSAGE_THRESHOLD = 10;
  const SPAM_WINDOW_MS = 60 * 1000;
  const SPAM_TIMEOUT_MS = 10 * 60 * 1000;
  const recentMessagesByDevice = {};
  const spamActionedDeviceIds = new Set();

  function checkSpam(m) {
    if (!m.deviceId || m.type === 'join' || m.type === 'tapin') return;
    const arr = recentMessagesByDevice[m.deviceId] || (recentMessagesByDevice[m.deviceId] = []);
    arr.push(m.ts || Date.now());
    const cutoff = Date.now() - SPAM_WINDOW_MS;
    while (arr.length && arr[0] < cutoff) arr.shift();
    if (arr.length <= SPAM_MESSAGE_THRESHOLD || spamActionedDeviceIds.has(m.deviceId)) return;
    spamActionedDeviceIds.add(m.deviceId);
    bansRef.doc(m.deviceId).set({
      bannedAt: Date.now(),
      bannedBy: 'system (auto spam filter)',
      expiresAt: Date.now() + SPAM_TIMEOUT_MS,
      reason: 'Automatic timeout: sent ' + arr.length + ' messages in under a minute',
      enforced: true,
      usernames: firebase.firestore.FieldValue.arrayUnion(m.username)
    }, { merge: true }).catch((e) => console.error('Auto-timeout failed:', e));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---------- SLUR / PROFANITY FILTER ----------
  // Words are censored wherever they appear (own word boundaries), case-insensitive,
  // and tolerant of a few common letter substitutions (0 for o, 1 for i, etc).
  // This default list is what the filter uses until chat_config/censoredWords
  // loads (and what it falls back to if that doc is ever missing/emptied) —
  // admin.html's "Censored Words" section is where the live list is actually
  // edited from here on; see the onSnapshot listener below.
  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {
    // Map each letter to itself plus common leetspeak substitutes.
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*'); // allow stray symbols/spaces slipped between letters
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  // Same letter-substitution pattern as buildCensorRegex, but without the
  // \b word-boundary anchors — "the glass shattered" shouldn't get
  // censored in chat just for containing "ass", but someone picking a
  // username tends to embed a banned word between other characters
  // specifically to dodge a boundary-anchored filter (e.g. "xXslurXx"),
  // so the username check has to match anywhere in the string instead.
  function buildUsernameCensorRegex(word) {
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp(pattern, 'i');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
  let USERNAME_CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildUsernameCensorRegex);

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
    USERNAME_CENSOR_REGEXES = words.map(buildUsernameCensorRegex);
  }, () => {}); // offline/blocked read just keeps whatever list is already loaded

  function usernameContainsCensoredWord(name) {
    return USERNAME_CENSOR_REGEXES.some(re => re.test(name));
  }

  // Set by admin.html's "Clear Chat" button — see subscribeToMessages()
  // further down, which is what actually applies this cutoff to the
  // messages query.
  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;
    // Re-subscribe with the new cutoff immediately for anyone already
    // sitting in the chat — same "takes effect right away" treatment as
    // a ban, rather than only on their next reload.
    if (session) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ---------- USERNAME COLORS ----------
  // Every username gets a stable color derived from its own text (so the
  // same name always lands on the same color for everyone, with no
  // shared state needed) unless its claimant has picked a custom one from
  // the composer bar below — that choice lives on the same chat_usernames
  // doc the username claim itself already created, since that's the one
  // place this app has anything resembling "this slot belongs to me."
  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  // Bright, readable-on-dark hues at fixed saturation/lightness — only
  // the hue varies per username.
  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  // key -> resolved hex color, or the string 'pending' while a lookup for
  // that username's custom color choice is in flight. Populated lazily —
  // only usernames actually seen in the rendered message list ever get
  // looked up, rather than subscribing to the whole chat_usernames
  // collection just for this.
  const usernameColorCache = {};

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username); // shown immediately; onResolved repaints if a custom pick exists
  }

  // ---------- RENDER: AUTH ----------
  // No top tab/header bar here — the whole card centers the join form.
  function renderAuth(errorMsg) {
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <label for="chatHandle">what are you gonna call yourself?</label>
            <!-- Safari ignores autocomplete="off" on a field it pattern-matches
                 as a login/contact field by id/name alone (a known, long-
                 standing WebKit quirk) — the id was literally "username",
                 which is exactly the pattern it's watching for. Renaming it
                 away from that (id, name, and autocomplete's own value) is
                 what actually stops the AutoFill prompt in Safari; plain
                 autocomplete="off" alone wasn't enough. -->
            <input type="text" id="chatHandle" name="chatHandle" autocomplete="off" placeholder="e.g. gunoguap" />
            <div class="auth-actions">
              <button class="pill-btn auth-submit-btn" id="authSubmit" title="Join Chat">Join Chat</button>
            </div>
            <div class="auth-msg">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
          </div>
        </div>
      </div>
    `;

    $('authSubmit').addEventListener('click', handleAuthSubmit);
    $('chatHandle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAuthSubmit();
    });
    $('chatHandle').focus();
  }

  async function handleAuthSubmit() {
    const username = $('chatHandle').value.trim();
    const btn = $('authSubmit');

    if (!username) {
      renderAuth('Enter a username.');
      return;
    }
    if (username.length > 24 || /\s/.test(username)) {
      renderAuth('Username must be 24 chars or fewer, no spaces.');
      return;
    }
    if (usernameContainsCensoredWord(username)) {
      renderAuth('That username isn\'t allowed. Please choose another.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const claim = await claimUsernameSlot(username);
      session = { username: claim.username };
      rememberUsername(claim.username);
      deviceLockedUsername = claim.username;
      // A device that already owned a name never actually "joins" again
      // here — claimUsernameSlot just handed back its existing identity
      // regardless of what was typed, so there's nothing new to announce.
      if (claim.isNew) {
        logIpBestEffort(claim.username);
        sendJoinNotice(claim.username);
      }
      startChat();
    } catch (e) {
      console.error(e);
      if (e && e.message === 'USERNAME_TAKEN') {
        renderAuth('That username is already taken. Please choose another.');
      } else {
        renderAuth('Something went wrong. Please try again.');
      }
    }
  }

  // ---------- RENDER: CHAT ----------
  function renderChatShell() {
    // Own color resolves the same lazy way everyone else's does (see
    // colorForUsername) — usernameColorCache already has it "pending" or
    // resolved by the time this runs in the common case (colorForUsername
    // is called for every visible message, including your own), so this
    // just reads whatever that returns rather than doing a second lookup.
    const myColor = colorForUsername(session.username, () => {
      const picker = $('colorPicker');
      if (picker) picker.value = usernameColorCache[session.username.toLowerCase()];
    });

    app.innerHTML = `
      <div class="chat-screen">
        <div class="messages" id="messages">
          <div class="empty-state">Loading messages…</div>
        </div>
        <div class="composer-bar">
          <div class="composer-status">
            <div class="who">Signed in as <b>${escapeHtml(session.username)}</b></div>
            <div class="status-actions">
              <input type="color" class="color-picker" id="colorPicker" title="Pick your name color" value="${myColor}">
              <button type="button" class="round-btn tapin-btn" id="tapinBtn" title="Tap in!"><span class="tapin-btn-label" id="tapinBtnLabel">&#127866;</span></button>
            </div>
          </div>
          <div class="composer">
            <input type="text" id="msgInput" placeholder="Type a message…" maxlength="500" />
            <button class="round-btn send-btn" id="sendBtn" title="Send">&#9658;</button>
          </div>
        </div>
      </div>
    `;

    $('colorPicker').addEventListener('input', (e) => {
      const color = e.target.value;
      const key = session.username.toLowerCase();
      usernameColorCache[key] = color; // repaints this tab immediately, no round trip needed
      usernamesRef.doc(key).set({ color: color }, { merge: true }).catch((err) => console.error(err));
      if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);
    });

    $('sendBtn').addEventListener('click', sendMessage);
    $('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    $('tapinBtn').addEventListener('click', sendTapIn);
    refreshTapInButtonState();
  }

  // Kept around so a username color that resolves (or gets picked) after
  // the fact can trigger a repaint of the list already on screen, without
  // renderMessages' every caller needing to also remember the last batch.
  let lastRenderedMsgs = null;

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say hello 👋</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      if (m.type === 'join') {
        return `<div class="system-msg">${escapeHtml(m.username)} has joined</div>`;
      }
      if (m.type === 'tapin') {
        return `<div class="system-msg">${escapeHtml(m.username)} just tapped in</div>`;
      }
      const mine = m.username === session.username;
      // Own messages get their real picked/auto color too now, same as
      // everyone else's — "mine" still stands out on its own via the
      // accent-colored bubble and right-aligned layout, so this doesn't
      // lose that distinction, it just stops overriding your own name
      // color specifically with a flat red regardless of what you chose.
      const nameHtml = `<span class="msg-name" style="color:${colorForUsername(m.username, () => renderMessages(lastRenderedMsgs))}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble">${escapeHtml(censorText(m.text))}</div>
        </div>
      `;
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = $('msgInput');
    const text = censorText(input.value.trim());
    if (!text) return;
    input.value = '';
    input.disabled = true;

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  // Set by admin.html's "Clear Chat" button (chat_config/clear) — the
  // messages themselves are never deleted (admin.html's own chat log and
  // search still see everything), this just moves the cutoff every
  // visitor's own message query starts from. Kept live (see
  // subscribeToConfig below) so an in-progress clear takes effect for an
  // already-open tab immediately, the same way a ban does.
  let clearedAt = 0;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();

    let query = messagesRef.orderBy('ts', 'asc');
    if (clearedAt) query = query.where('ts', '>', clearedAt);

    // The initial callback reports every doc in the batch as an "added"
    // change (normal Firestore behavior) — skipping docChanges on that
    // first batch is what stops a page load from retroactively
    // "spam-banning" someone or replaying every past tap-in's
    // sound/animation. But "the first callback" isn't reliably "the
    // real initial batch": Firestore can deliver an incomplete snapshot
    // from LOCAL CACHE first (snapshot.metadata.fromCache === true) —
    // e.g. on a slow/flaky connection — before the real, server-
    // confirmed one arrives a moment later. A flag that latches false
    // after only the very first callback treats that second, larger,
    // server-confirmed batch as "not initial", so every message that
    // was merely missing from the smaller cached batch (which can
    // easily include a tap-in still within the last 200 messages) looks
    // like it was just newly added — this was the bug behind the gif
    // sometimes playing itself on login with nobody having clicked
    // anything. Waiting for an actual non-cached snapshot before ever
    // touching docChanges closes that gap.
    //
    // But that gate has its own edge: the composer (tap-in button
    // included) is clickable the instant renderChatShell() runs, which
    // can easily be before this SAME listener's first real snapshot
    // has come back — someone trying the new button right away, the
    // moment they see it, races straight into that window. A tap-in
    // THIS tab is actively in the middle of sending right now (tracked
    // in pendingOwnTapinTimestamps, see sendTapIn) is never "historical
    // catch-up" by definition, so it's let through regardless of the
    // settling gate — checking deviceId alone wouldn't be enough, since
    // CLIENT_ID persists across reloads and would just as easily match
    // this same device's tap-ins from a past session still sitting in
    // history. Only other devices' (or this device's own OLD) messages
    // arriving mid-settling are held back as possibly-stale.
    let sawServerSnapshot = false;

    function handleAddedChange(change, stillSettling) {
      if (change.type !== 'added') return;
      const m = change.doc.data();
      if (stillSettling && !pendingOwnTapinTimestamps.has(m.ts)) return;
      checkSpam(m);
      if (m.type === 'tapin') triggerTapInEffect(m.username);
    }

    unsubscribeMessages = query
      .limitToLast(200)
      .onSnapshot(
        (snapshot) => {
          const msgs = snapshot.docs.map(doc => doc.data());
          renderMessages(msgs);

          const stillSettling = !sawServerSnapshot;
          if (!snapshot.metadata.fromCache) sawServerSnapshot = true;
          snapshot.docChanges().forEach((change) => handleAddedChange(change, stillSettling));
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    renderChatShell();
    subscribeToMessages();
    $('msgInput').focus();
  }

  // ---------- BAN GATE ----------
  // A permanent ban has no expiresAt at all; a timeout has one in the
  // future. Checked against a *live* listener (not a one-time read) so a
  // ban placed while this exact tab is sitting open takes effect right
  // away instead of only on the next reload.
  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // Goes straight back into chat under the last remembered username
  // instead of the join form, whenever there's no more pressing reason
  // (like an active ban) to make someone type a name again.
  async function enterAuthOrRestore() {
    await deviceLockPromise; // near-instant once resolved; only waits on first check

    // A ban can land while the check above was still in flight (this only
    // ever has a real network wait on the very first call) — don't let a
    // slow-resolving restore stomp the ban screen it raced against.
    if (currentlyBanned) return;

    if (deviceLockedUsername) {
      // Authoritative: this device already has a permanent identity, so
      // it always resumes as that name — never a way to become someone
      // else, whatever a stale local cache might otherwise suggest.
      session = { username: deviceLockedUsername };
      rememberUsername(deviceLockedUsername);
      startChat();
      return;
    }

    const saved = getRememberedUsername();
    if (saved) {
      session = { username: saved };
      // Backfills a device that picked its name before device-locking
      // existed, so it's pinned from here on same as a fresh claim.
      deviceLockedUsername = saved;
      devicesRef.doc(CLIENT_ID).set({
        username: saved,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));
      startChat();
      return;
    }

    renderAuth();
  }

  // ---------- INIT ----------
  let currentlyBanned = false;
  bansRef.doc(CLIENT_ID).onSnapshot((doc) => {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
    } else if (currentlyBanned) {
      // The ban was lifted, or a timeout expired, while this tab was
      // already sitting on the banned screen.
      currentlyBanned = false;
      enterAuthOrRestore();
    } else if (!session) {
      enterAuthOrRestore();
    }
  }, () => {
    // Can't confirm ban status (offline, rules not yet deployed, etc.) —
    // fails open to the normal join screen (or a remembered session)
    // rather than locking everyone out over a read error.
    if (!session) enterAuthOrRestore();
  });
})();
</script>

<!-- ---------- LIVE STATS (active viewers) ----------
     Reuses the same Firebase app/project the chat above already
     initialized — no separate config needed. "Watching now" is a
     lightweight presence system: each open tab writes a heartbeat
     every 15s, and every client independently counts how many
     heartbeats are still fresh to get a live concurrent-viewer count,
     with no extra backend. -->
<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  if (!activeEl) return;

  const db = firebase.firestore(); // reuses the app the chat widget already initialized
  const presenceId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  const presenceRef = db.collection('chat_presence').doc(presenceId);

  const HEARTBEAT_MS = 15000;      // how often this tab refreshes its own presence
  const ACTIVE_WINDOW_MS = 40000;  // a presence doc counts as "active" if newer than this
  const STALE_CLEANUP_MS = 120000; // opportunistically delete very old presence docs

  // ---- active viewers: heartbeat presence, counted client-side ----
  let presenceById = {};

  function writeHeartbeat() {
    presenceRef.set({ lastSeen: Date.now() }).catch((e) => console.error(e));
  }

  function recomputeActiveCount() {
    const now = Date.now();
    let count = 0;
    Object.keys(presenceById).forEach((id) => {
      if (now - presenceById[id] < ACTIVE_WINDOW_MS) count++;
    });
    activeEl.textContent = count;
  }

  db.collection('chat_presence').onSnapshot(
    (snapshot) => {
      const next = {};
      const now = Date.now();
      snapshot.forEach((doc) => {
        const data = doc.data();
        const lastSeen = data && typeof data.lastSeen === 'number' ? data.lastSeen : 0;
        next[doc.id] = lastSeen;
        // Opportunistic cleanup so this collection doesn't grow forever —
        // any client that notices a very stale doc removes it.
        if (now - lastSeen > STALE_CLEANUP_MS) {
          doc.ref.delete().catch(() => {});
        }
      });
      presenceById = next;
      recomputeActiveCount();
    },
    (err) => console.error(err)
  );

  writeHeartbeat();
  setInterval(writeHeartbeat, HEARTBEAT_MS);
  setInterval(recomputeActiveCount, 5000);

  function leavePresence() {
    presenceRef.delete().catch(() => {});
  }
  window.addEventListener('pagehide', leavePresence);
  window.addEventListener('beforeunload', leavePresence);
})();
</script>

</body>
</html>
