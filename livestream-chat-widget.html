<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Stream + Chat</title>
<style>
  :root {
    --ink: #3a0a0a;

    --ink-rgb: 58, 10, 10;
    --panel: rgba(var(--ink-rgb), 0.32);
    --panel-2: rgba(var(--ink-rgb), 0.8);
    --line: rgba(255, 180, 150, 0.6);
    --accent: #cd3232;
    --accent-rgb: 205, 50, 50;
    --accent-dim: #6e1e1e;
    --text: #ffffff;
    --text-dim: #f5c9c9;
    --error: #ffb3b3;

    --vods-bg: #200606;
    --font-display: Tahoma, Arial, sans-serif;
    --font-body: Tahoma, Arial, sans-serif;
    --stats-h: 38px;

    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  html.is-offline {
    --ink: #0d0d0d;
    --ink-rgb: 13, 13, 13;
    --line: rgba(120, 120, 120, 0.6);
    --accent: #5a1717;
    --accent-rgb: 90, 23, 23;
    --accent-dim: #333333;
    --text-dim: #aaaaaa;
    --error: #aaaaaa;
    --vods-bg: #080808;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(var(--accent-rgb), 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  .layout {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    margin: 0;
    gap: 14px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .video-pane {
    position: relative;

    z-index: 2;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 62%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;

  }

  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  .offline-frame {
    position: absolute;
    display: block;
    width: 100cqw;
    height: 100cqh;
    object-fit: cover;
  }

  .gif-loader {
    position: relative;
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .chat-pane {
    position: relative;
    z-index: 1;
    flex: 1 1 38%;
    min-width: 300px;
    display: flex;
    container-type: size;
    container-name: chatbox;
  }

  .vods-panel {
    position: absolute;
    top: 0;

    left: -28px;
    right: 0;

    border-radius: 0 10px 0 0;
    overflow: hidden;
    z-index: 8;
    display: flex;
    flex-direction: column;
    align-items: stretch;

    pointer-events: none;
  }
  .vods-tab {
    pointer-events: auto;
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.5cqw, 10px);
    width: 100%;

    border: 0;
    background: var(--vods-bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: clamp(6px, 1.6cqh, 10px) 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .vods-tab:hover {
    background: var(--accent-dim);
  }

  .vods-tab-label,
  .vods-tab-chevron {
    color: var(--text);
  }
  .vods-tab-chevron {
    display: inline-block;
    font-size: 9px;

    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-tab-chevron { transform: rotate(180deg); }

  .vods-drawer {
    pointer-events: auto;
    flex: none;
    display: flex;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    background: var(--vods-bg);
    transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-drawer {
    max-height: min(70cqh, 460px);
  }

  .vods-heading {
    display: none;
    flex: none;
    text-align: center;
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 3cqw, 14px);
    color: var(--text);
    padding: 10px 10px 4px;
  }
  .vods-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vods-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: clamp(10px, 2.8cqw, 12px);
  }
  .vod-row {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }
  .vod-row:hover { background: rgba(255, 255, 255, 0.08); }
  .vod-row.active { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.25); }
  .vod-row-thumb {
    flex: none;
    width: 88px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    object-fit: cover;
    background: var(--panel);
  }
  .vod-row-title {
    min-width: 0;
    font-size: clamp(11px, 2.8cqw, 13px);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  @media (max-width: 860px) {
    .layout {
      flex-direction: column;
    }
    .video-pane {
      flex: 0 1 auto;
      box-sizing: content-box;
      aspect-ratio: 16 / 9;
      padding-bottom: var(--stats-h);
    }

    .video-loading {
      bottom: var(--stats-h);
    }

    .layout .video-controls {
      bottom: var(--stats-h);
    }

    .chat-pane {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;

      margin-top: calc(-1 * (14px + var(--stats-h)));
    }

    .layout .stream-stats {
      display: flex;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .stream-stats:active {
      background: var(--ink);
      box-shadow: inset 0 0 26px rgba(var(--accent-rgb), 0.5);
    }

    .stream-stats .stream-stats-vods {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;

      color: var(--text);
    }
    .layout.vods-open .stream-stats-chevron { transform: rotate(180deg); }
    .vods-tab { display: none; }

    .vods-panel {

      top: var(--stats-h);
      left: 0;

      border-radius: 0;
    }

    .layout.vods-open .video-pane {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .vods-drawer {
      border-radius: 0 0 10px 10px;
    }
    .vods-tab {
      align-self: center;
      width: clamp(52px, 16cqw, 74px);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 10px 10px;

      height: 14px;
      padding: 0;
    }
    .vods-tab-chevron { font-size: 10px; }
    .vods-tab-label { display: none; }

    .vods-panel.open .vods-drawer {
      max-height: min(88cqh, 560px);
    }
  }

  .layout.chat-hidden .chat-pane {
    display: none;
  }
  .layout.chat-hidden .video-pane {
    flex: 1 1 100%;
  }

  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .chat-pane { display: none; }

    .layout .video-pane { flex: 1 1 100%; padding-bottom: 0; }
    .layout .stream-stats { display: none; }

    .layout { padding-bottom: 0; }

    .bg-glow { bottom: 0; }

    .layout .video-controls { bottom: 0; }
  }

  .layout.fullscreen-active .chat-pane {
    display: none;
  }

  .stream-stats {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--stats-h);
    z-index: 5;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--vods-bg);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 14px);
    white-space: nowrap;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .stream-stats-vods {
    display: none;
  }
  .stream-stats-chevron {
    display: inline-block;
    font-size: 9px;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stat-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex: none;
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #ffffff;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .viewer-badge {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: clamp(6px, 1.6cqh, 10px) clamp(10px, 2.6cqw, 14px);
    border: 1px solid var(--accent);
    border-radius: clamp(4px, 1.5cqw, 8px);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 3cqw, 14px);
  }
  .viewer-badge svg {
    width: clamp(12px, 3.4cqw, 16px);
    height: clamp(12px, 3.4cqw, 16px);
    fill: var(--accent);
    flex: none;
  }

  .auth-submit-btn {
    width: 100%;
  }

  .video-pane .video-pane-actions,
  .video-pane .viewer-badge,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane.controls-visible .video-pane-actions,
  .video-pane.controls-visible .viewer-badge,
  .video-pane.controls-visible .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  .video-pane.offline-card .video-pane-actions,
  .video-pane.offline-card .viewer-badge,
  .video-pane.offline-card .video-controls {
    display: none;
  }

  .video-pane.offline-card .gif-loader {
    display: none;
  }

  .video-controls {
    position: absolute;
    left: 0;
    right: 0;

    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(var(--ink-rgb), 0.85), rgba(var(--ink-rgb), 0));
  }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
    color: #ffffff;
  }
  .play-pause-btn:hover:not(:disabled),
  .play-pause-btn:active:not(:disabled) { color: #ffffff; }
  .play-pause-btn:disabled { opacity: 0.5; cursor: default; }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }

  .video-pane.pseudo-fullscreen.is-loading {
    background: #000;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }
  .scrub-range::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
  }
  .scrub-range::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .scrub-range::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  .live-btn {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(10px, 2.8cqw, 12px);
    padding: clamp(4px, 1.2cqh, 6px) clamp(8px, 2.2cqw, 12px);
    cursor: pointer;
  }
  .live-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .live-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .live-btn.at-live .live-dot { background: var(--accent); }

  .chat-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .chat-screen {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
    overflow: hidden;
  }

  .who {

    font-size: clamp(10px, 3cqmin, 13px);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .who b { color: var(--text); font-weight: 600; }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: none;
    border: 0;
    color: var(--accent);
  }
  .round-btn:hover:not(:disabled) { color: var(--accent-dim); }
  .round-btn:active:not(:disabled) { color: var(--accent-dim); }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .status-actions {
    display: flex;
    align-items: center;

    gap: clamp(6px, 2cqmin, 10px);
    flex: none;
  }

  .color-picker {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(20px, 6.4cqmin, 26px);
    height: clamp(20px, 6.4cqmin, 26px);
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    background: none;
    cursor: pointer;
    flex: none;
  }
  .color-picker::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .color-picker::-webkit-color-swatch { border: none; border-radius: 50%; }
  .color-picker::-moz-color-swatch { border: none; border-radius: 50%; }

  @property --tapin-frac {
    syntax: '<number>';
    inherits: false;
    initial-value: 1;
  }

  .tapin-btn {
    width: clamp(22px, 7cqmin, 28px);
    font-size: clamp(11px, 3.4cqmin, 14px);
    flex: none;
    transition: --tapin-frac 1s linear;
  }

  .tapin-btn.on-cooldown {
    background: conic-gradient(var(--accent) calc(var(--tapin-frac, 1) * 360deg), var(--accent-dim) 0);
  }

  .tapin-btn-label.is-countdown {
    font-size: clamp(7px, 2.4cqmin, 9px);
    font-weight: 700;
  }

  .tapin-btn-icon {
    width: clamp(18px, 5.7cqmin, 23px);
    height: clamp(18px, 5.7cqmin, 23px);
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .auth {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5cqh, 28px) clamp(14px, 4cqw, 24px) clamp(14px, 4cqh, 24px);
    overflow-y: auto;
  }
  .auth-inner {
    width: 100%;
    max-width: 320px;
  }
  label {
    display: block;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    margin: clamp(8px, 2.5cqh, 14px) 0 clamp(4px, 1.2cqh, 6px);
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  input[type="text"] {
    width: 100%;

    padding: clamp(8px, 2.4cqmin, 11px) clamp(8px, 2.4cqmin, 12px);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: clamp(2px, 1cqmin, 4px);
    color: var(--text);
    font-size: max(16px, 3.6cqw);
    font-family: var(--font-body);
    outline: none;
  }
  input:focus { border-color: var(--accent); }

  .auth-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1.4cqh, 6px);
    margin-top: clamp(14px, 4.5cqh, 22px);
  }

  .auth-msg {
    margin-top: clamp(8px, 2.4cqh, 12px);
    font-size: clamp(10px, 2.8cqw, 13px);
    color: var(--error);
    min-height: 16px;
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(10px, 3.2cqh, 16px) clamp(10px, 3.4cqw, 18px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2.4cqh, 12px);

    transform: translateZ(0);
  }

  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--accent-dim);
    border-radius: 4px;
  }

  .msg {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }

  .msg-meta {
    font-size: clamp(12px, 2.6cqw, 14px);
    color: var(--text-dim);
    font-family: var(--font-display);
    letter-spacing: 0.02em;
  }
  .msg.mine .msg-meta { color: var(--accent); }

  .msg-name {
    font-weight: 800;
    font-size: 1.15em;
  }

  .msg-bubble {
    background: var(--panel-2);

<script>
(function () {
  var layout = document.getElementById('layout');
  var toggleBtn = document.getElementById('toggleChatBtn');
  toggleBtn.addEventListener('click', function () {
    var hidden = layout.classList.toggle('chat-hidden');
    toggleBtn.textContent = hidden ? 'Show Chat' : 'Hide Chat';
    toggleBtn.title = hidden ? 'Show chat' : 'Hide chat';
  });
})();

(function () {

  var offlineVideo = document.getElementById('offlineVideo');
  if (offlineVideo) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && offlineVideo.paused) {
        offlineVideo.play().catch(function () {});
      }
    });
  }
})();

(function () {

  var unmuteBtn = document.getElementById('unmuteBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var scrubRange = document.getElementById('scrubRange');
  var timeLabel = document.getElementById('timeLabel');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var videoPane = document.getElementById('videoPane');
  var videoLoading = document.getElementById('videoLoading');
  var layoutEl = document.getElementById('layout');
  var ytPlayer = null;
  var isDragging = false;
  var pollTimer = null;

  function showVideoLoading() {
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');
  }
  function hideVideoLoading() {
    videoLoading.hidden = true;
    videoPane.classList.remove('is-loading');
  }

  var CONTROLS_AUTO_HIDE_MS = 3000;
  var supportsHover = window.matchMedia('(hover: hover)').matches;
  var controlsHideTimer = null;

  function showControls(autoHide) {
    videoPane.classList.add('controls-visible');
    clearTimeout(controlsHideTimer);
    if (autoHide) {
      controlsHideTimer = setTimeout(function () {
        videoPane.classList.remove('controls-visible');
      }, CONTROLS_AUTO_HIDE_MS);
    }
  }
  function hideControlsNow() {
    clearTimeout(controlsHideTimer);
    videoPane.classList.remove('controls-visible');
  }

  if (supportsHover) {
    videoPane.addEventListener('mouseenter', function () { showControls(false); });
    videoPane.addEventListener('mouseleave', function () { hideControlsNow(); });
  } else {
    videoPane.addEventListener('touchstart', function (e) {

      if (e.target.closest('.stream-stats')) return;
      if (e.target.closest('.video-pane-actions, .viewer-badge, .video-controls')) {
        showControls(true);
        return;
      }
      if (videoPane.classList.contains('controls-visible')) {
        hideControlsNow();
      } else {
        showControls(true);
      }
    }, { passive: true });
  }

  unmuteBtn.disabled = true;

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    var min = parseFloat(scrubRange.min) || 0;
    var max = parseFloat(scrubRange.max) || 100;
    var val = parseFloat(scrubRange.value) || 0;
    var pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(state) {
    if (state === YT.PlayerState.PLAYING) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {
      playPauseBtn.innerHTML = '&#9658;';
      playPauseBtn.title = 'Play';
    }
  }

  function updateProgress() {
    if (!ytPlayer || isDragging) return;
    var duration = ytPlayer.getDuration();
    var current = ytPlayer.getCurrentTime();
    if (duration > 0) {
      scrubRange.max = duration;
      scrubRange.value = current;
      updateRangeFill();
      timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
    updateLiveButtonState();
  }

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          unmuteBtn.disabled = false;
          playPauseBtn.disabled = false;
          scrubRange.disabled = false;
          updatePlayPauseIcon(YT.PlayerState.PLAYING);
          updateProgress();
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(updateProgress, 500);
        },
        onStateChange: function (event) {
          updatePlayPauseIcon(event.data);
          if (event.data === YT.PlayerState.PLAYING) {
            hideVideoLoading();
          } else if (event.data === YT.PlayerState.BUFFERING) {
            showVideoLoading();
          }
        }
      }
    });
  };

  var configuredLiveVideoId = null;
  var configuredIsLive = false;
  var loadedVideoId = null;
  var watchingVodId = null;
  var ytApiRequested = false;
  var liveBtn = document.getElementById('liveBtn');

  function requestYouTubeIframeApi() {
    if (ytApiRequested) return;
    ytApiRequested = true;
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(s);
  }

  var LIVE_EDGE_THRESHOLD_SEC = 8;

  function updateLiveButtonState() {
    if (!liveBtn) return;
    var onLiveSlot = !watchingVodId;
    var behindEdge = false;
    if (onLiveSlot && configuredIsLive && ytPlayer && typeof ytPlayer.getDuration === 'function') {
      var duration = ytPlayer.getDuration();
      var current = ytPlayer.getCurrentTime();
      behindEdge = duration > 0 && (duration - current) > LIVE_EDGE_THRESHOLD_SEC;
    }
    var atLive = onLiveSlot && !behindEdge;
    liveBtn.classList.toggle('at-live', atLive);
    liveBtn.title = watchingVodId ? 'Return to live' : (atLive ? 'Live' : 'Jump to live');
  }

  function updateOfflineCardState() {
    videoPane.classList.toggle('offline-card', !watchingVodId && !configuredIsLive);
  }
  updateOfflineCardState();

  function updateOfflineTheme() {
    document.documentElement.classList.toggle('is-offline', !configuredIsLive);
    try { window.parent.postMessage({ type: 'knobsock-live-state', isLive: configuredIsLive }, '*'); } catch (e) {}
  }
  updateOfflineTheme();

  window.applyLiveVideoState = function (videoId, isLive) {
    configuredLiveVideoId = isLive ? videoId : null;
    configuredIsLive = !!isLive;
    updateLiveButtonState();
    updateOfflineCardState();
    updateOfflineTheme();
    if (watchingVodId) return;

    if (!isLive) {
      loadedVideoId = null;
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      showVideoLoading();
      return;
    }

    if (videoId === loadedVideoId) return;
    loadedVideoId = videoId;

    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById(videoId);
      return;
    }

    var frame = document.getElementById('ytFrame');
    if (frame) {
      frame.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0';
    }
    requestYouTubeIframeApi();
  };

  window.switchToVod = function (vodId) {
    if (!vodId || (watchingVodId === vodId && loadedVideoId === vodId)) return;
    watchingVodId = vodId;
    loadedVideoId = vodId;
    showVideoLoading();
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById(vodId);
    } else {
      var frame = document.getElementById('ytFrame');
      if (frame) {
        frame.src = 'https://www.youtube.com/embed/' + vodId + '?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0';
      }
      requestYouTubeIframeApi();
    }
    updateLiveButtonState();
    updateOfflineCardState();
    if (typeof window.onVodStateChange === 'function') window.onVodStateChange(watchingVodId);
  };

  window.returnToLive = function () {
    watchingVodId = null;
    loadedVideoId = null;
    window.applyLiveVideoState(configuredLiveVideoId, configuredIsLive);
    if (typeof window.onVodStateChange === 'function') window.onVodStateChange(null);
  };

  if (liveBtn) {
    liveBtn.addEventListener('click', function () {
      if (watchingVodId) {
        window.returnToLive();
        return;
      }
      if (!configuredIsLive) {

        window.applyLiveVideoState(configuredLiveVideoId, false);
        return;
      }
      if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
        var duration = ytPlayer.getDuration();
        if (duration > 0) ytPlayer.seekTo(duration, true);
      }
    });

    updateLiveButtonState();
  }

  unmuteBtn.addEventListener('click', function () {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) {
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      unmuteBtn.textContent = 'Mute';
      unmuteBtn.title = 'Mute';
    } else {
      ytPlayer.mute();
      unmuteBtn.textContent = 'Unmute';
      unmuteBtn.title = 'Unmute';
    }
  });

  playPauseBtn.addEventListener('click', function () {
    if (!ytPlayer) return;
    var state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    var duration = ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max);
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (ytPlayer) ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    isDragging = false;
  });

  var usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen
    );
  }

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      var result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(function () { enterPseudoFullscreen(); });
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function updateFullscreenIcon() {
    var fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';

    layoutEl.classList.toggle('fullscreen-active', fs);
  }

  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) {
      requestFs(videoPane);
    } else {
      enterPseudoFullscreen();
    }
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenIcon);
    }
  );
})();
</script>

  let session = null;
  let unsubscribeMessages = null;

  function getClientId() {
    try {
      let id = localStorage.getItem('chat_client_id');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2));
        localStorage.setItem('chat_client_id', id);
      }
      return id;
    } catch (e) {

      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    }
  }
  const CLIENT_ID = getClientId();

  const LAST_USERNAME_KEY = 'chat_last_username';

  function rememberUsername(username) {
    try { localStorage.setItem(LAST_USERNAME_KEY, username); } catch (e) {}
  }

  function getRememberedUsername() {
    try { return localStorage.getItem(LAST_USERNAME_KEY); } catch (e) { return null; }
  }

  function forgetRememberedUsername() {
    try { localStorage.removeItem(LAST_USERNAME_KEY); } catch (e) {}
  }

  let deviceLockedUsername = null;
  let resolveDeviceLockReady;
  const deviceLockPromise = new Promise((resolve) => { resolveDeviceLockReady = resolve; });
  let deviceLockReady = false;

  function markDeviceLockReady() {
    if (deviceLockReady) return;
    deviceLockReady = true;
    resolveDeviceLockReady();
  }

  devicesRef.doc(CLIENT_ID).onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const lockedName = (data && data.username) || null;
    const hadLock = deviceLockedUsername;
    deviceLockedUsername = lockedName;
    markDeviceLockReady();

    lastTapInAt = (data && data.lastTapInAt) || 0;
    refreshTapInButtonState();

    myStreak = (data && data.streak) || 0;
    myStreakDay = (data && data.streakDay) || null;

    if (!currentlyBanned && hadLock && !lockedName && session) {
      session = null;
      forgetRememberedUsername();
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderAuth('An admin signed you out — pick a new username to keep chatting.');
    }
  }, () => {

    markDeviceLockReady();
  });

  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const deviceRef = devicesRef.doc(CLIENT_ID);

    try {
      const deviceDoc = await deviceRef.get();
      const lockedName = deviceDoc.exists && deviceDoc.data() && deviceDoc.data().username;
      if (lockedName) {
        return { username: lockedName, isNew: false };
      }
    } catch (e) {
      console.error('Device lock check failed, proceeding as a normal claim:', e);
    }

    const finalUsername = await db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (baseDoc.exists) {
        throw new Error('USERNAME_TAKEN');
      }
      tx.set(baseRef, {
        username: rawUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

        lastDeviceId: CLIENT_ID
      });
      return rawUsername;
    });

    devicesRef.doc(CLIENT_ID).set({
      username: finalUsername,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));

    return { username: finalUsername, isNew: true };
  }

  function logIpBestEffort(finalUsername) {
    fetch('https://api.ipify.org?format=json')
      .then(res => res.ok ? res.json() : null)
      .then(data => (data && data.ip) ? hashIp(data.ip) : null)
      .then(ipHash => {
        if (!ipHash) return;
        const now = Date.now();
        return ipLogRef.doc(finalUsername.toLowerCase()).set({
          ipHash: ipHash,
          loggedAt: now,
          expiresAt: new Date(now + IP_RETENTION_DAYS * 24 * 60 * 60 * 1000)
        });
      })
      .catch(() => {});
  }

  async function sendMessageToFirestore(entry) {
    await messagesRef.add({
      username: entry.username,
      text: entry.text,
      deviceId: CLIENT_ID,
      ts: Date.now()
    });

  function sendJoinNotice(username) {
    messagesRef.add({
      type: 'join',
      username: username,
      text: 'has joined',
      deviceId: CLIENT_ID,
      ts: Date.now()
    }).catch(() => {});

  const TAPIN_COOLDOWN_MS = 5 * 60 * 1000;
  let lastTapInAt = 0;
  let tapinCooldownTimer = null;

  let myStreak = 0;
  let myStreakDay = null;

  const pendingOwnTapinTimestamps = new Set();

  function formatCooldown(ms) {
    const totalSeconds = Math.ceil(ms / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  const TAPIN_ICON_HTML = '<img class="tapin-btn-icon" src="/tapin-cheers.png" alt="">';

  function utcDayKey(ts) {
    return new Date(ts).toISOString().slice(0, 10);
  }

  function nextStreakAfterTapIn(ts) {
    const todayKey = utcDayKey(ts);
    if (myStreakDay === todayKey) return { streak: myStreak, day: todayKey };
    const yesterdayKey = utcDayKey(ts - 24 * 60 * 60 * 1000);
    return { streak: myStreakDay === yesterdayKey ? myStreak + 1 : 1, day: todayKey };
  }

  function fetchTopStreaks() {
    return devicesRef.orderBy('streak', 'desc').limit(15).get().then((snap) => {
      const todayKey = utcDayKey(Date.now());
      const yesterdayKey = utcDayKey(Date.now() - 24 * 60 * 60 * 1000);
      const alive = [];
      snap.forEach((doc) => {
        const data = doc.data();
        if (!data.streak || (data.streakDay !== todayKey && data.streakDay !== yesterdayKey)) return;
        alive.push({ username: data.username || '?', streak: data.streak, isYou: doc.id === CLIENT_ID });
      });
      return alive.slice(0, 3);
    }).catch(() => []);
  }

  const STREAK_BAR_VISIBLE_MS = 8000;
  let streakBarHideTimer = null;
  let streakBarToken = 0;

  function showStreakBar(streak) {
    const wrap = $('streakBarWrap');
    const bar = $('streakBar');
    if (!wrap || !bar) return;
    const token = ++streakBarToken;

    clearTimeout(streakBarHideTimer);
    bar.innerHTML = `<span class="streak-bar-mine"><img class="streak-fire-icon" src="/streak-fire.png" alt=""> ${streak}-day streak</span>`;
    wrap.classList.add('is-visible');
    streakBarHideTimer = setTimeout(() => {
      wrap.classList.remove('is-visible');

      void wrap.offsetHeight;
    }, STREAK_BAR_VISIBLE_MS);

    fetchTopStreaks().then((top) => {

      if (token !== streakBarToken || !wrap.classList.contains('is-visible') || !top.length) return;
      const medals = ['/streak-rank-1.png', '/streak-rank-2.png', '/streak-rank-3.png'];
      const entries = top.map((row, i) =>
        `<span class="streak-bar-lb-entry${row.isYou ? ' is-you' : ''}"><img class="streak-medal-icon" src="${medals[i]}" alt=""> ${escapeHtml(row.username)} ${row.streak}</span>`
      ).join('');
      bar.insertAdjacentHTML('beforeend',
        `<span class="streak-bar-divider">·</span><span class="streak-bar-lb">${entries}</span>`
      );
    });
  }

  function refreshTapInButtonState() {
    const btn = $('tapinBtn');
    const label = $('tapinBtnLabel');
    if (!btn) return;
    clearTimeout(tapinCooldownTimer);
    const remaining = TAPIN_COOLDOWN_MS - (Date.now() - lastTapInAt);
    if (remaining > 0) {
      btn.disabled = true;
      btn.classList.add('on-cooldown');
      btn.style.setProperty('--tapin-frac', String(Math.max(0, remaining / TAPIN_COOLDOWN_MS)));
      if (label) {
        label.textContent = formatCooldown(remaining);
        label.classList.add('is-countdown');
      }

      tapinCooldownTimer = setTimeout(refreshTapInButtonState, Math.min(remaining, 1000));
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cooldown');
      btn.style.removeProperty('--tapin-frac');
      if (label) {
        label.innerHTML = TAPIN_ICON_HTML;
        label.classList.remove('is-countdown');
      }
    }
  }

  async function sendTapIn() {
    if (TAPIN_COOLDOWN_MS - (Date.now() - lastTapInAt) > 0) return;
    lastTapInAt = Date.now();
    refreshTapInButtonState();
    const ts = Date.now();
    pendingOwnTapinTimestamps.add(ts);

    const next = nextStreakAfterTapIn(ts);
    myStreak = next.streak;
    myStreakDay = next.day;
    showStreakBar(myStreak);

    try {
      await devicesRef.doc(CLIENT_ID).set({
        lastTapInAt: lastTapInAt,
        streak: myStreak,
        streakDay: myStreakDay
      }, { merge: true });
      await messagesRef.add({
        type: 'tapin',
        username: session.username,
        text: 'just tapped in',
        deviceId: CLIENT_ID,
        ts: ts
      });
    } catch (e) {
      console.error('Tap in failed:', e);
    } finally {

      setTimeout(() => pendingOwnTapinTimestamps.delete(ts), 30000);
    }
  }

  function triggerTapInEffect(username) {
    try {
      window.parent.postMessage({ type: 'knobsock-tapin', username: username }, '*');
    } catch (e) {}
  }

  const SPAM_MESSAGE_THRESHOLD = 10;
  const SPAM_WINDOW_MS = 60 * 1000;
  const SPAM_TIMEOUT_MS = 10 * 60 * 1000;
  const recentMessagesByDevice = {};
  const spamActionedDeviceIds = new Set();

  function checkSpam(m) {
    if (!m.deviceId || m.type === 'join' || m.type === 'tapin') return;
    const arr = recentMessagesByDevice[m.deviceId] || (recentMessagesByDevice[m.deviceId] = []);
    arr.push(m.ts || Date.now());
    const cutoff = Date.now() - SPAM_WINDOW_MS;
    while (arr.length && arr[0] < cutoff) arr.shift();
    if (arr.length <= SPAM_MESSAGE_THRESHOLD || spamActionedDeviceIds.has(m.deviceId)) return;
    spamActionedDeviceIds.add(m.deviceId);
    bansRef.doc(m.deviceId).set({
      bannedAt: Date.now(),
      bannedBy: 'system (auto spam filter)',
      expiresAt: Date.now() + SPAM_TIMEOUT_MS,
      reason: 'Automatic timeout: sent ' + arr.length + ' messages in under a minute',
      enforced: true,
      usernames: firebase.firestore.FieldValue.arrayUnion(m.username)
    }, { merge: true }).catch((e) => console.error('Auto-timeout failed:', e));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {

    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  function buildUsernameCensorRegex(word) {
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp(pattern, 'i');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
  let USERNAME_CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildUsernameCensorRegex);

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
    USERNAME_CENSOR_REGEXES = words.map(buildUsernameCensorRegex);
  }, () => {});

  function usernameContainsCensoredWord(name) {
    return USERNAME_CENSOR_REGEXES.some(re => re.test(name));
  }

  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;

    if (session) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  const usernameColorCache = {};

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username);
  }

  function renderAuth(errorMsg) {
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <label for="chatHandle">what are you gonna call yourself?</label>

            <input type="text" id="chatHandle" name="chatHandle" autocomplete="off" placeholder="e.g. gunoguap" />
            <div class="auth-actions">
              <button class="pill-btn auth-submit-btn" id="authSubmit" title="Join Chat">Join Chat</button>
            </div>
            <div class="auth-msg">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
          </div>
        </div>
      </div>
    `;

    $('authSubmit').addEventListener('click', handleAuthSubmit);
    $('chatHandle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAuthSubmit();
    });
    $('chatHandle').focus();
  }

  async function handleAuthSubmit() {
    const username = $('chatHandle').value.trim();
    const btn = $('authSubmit');

    if (!username) {
      renderAuth('Enter a username.');
      return;
    }
    if (username.length > 24 || /\s/.test(username)) {
      renderAuth('Username must be 24 chars or fewer, no spaces.');
      return;
    }
    if (usernameContainsCensoredWord(username)) {
      renderAuth('That username isn\'t allowed. Please choose another.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const claim = await claimUsernameSlot(username);
      session = { username: claim.username };
      rememberUsername(claim.username);
      deviceLockedUsername = claim.username;

      if (claim.isNew) {
        logIpBestEffort(claim.username);
        sendJoinNotice(claim.username);
      }
      startChat();
    } catch (e) {
      console.error(e);
      if (e && e.message === 'USERNAME_TAKEN') {
        renderAuth('That username is already taken. Please choose another.');
      } else {
        renderAuth('Something went wrong. Please try again.');
      }
    }
  }

  const MAX_MSG_LEN = 400;
  const MSG_INPUT_HARD_CAP = 1000;

  function updateCharCounter() {
    const input = $('msgInput');
    const counter = $('charCounter');
    if (!input || !counter) return;
    const len = input.value.length;
    counter.textContent = len + '/' + MAX_MSG_LEN;
    counter.classList.toggle('is-over', len > MAX_MSG_LEN);
  }

  let limitMsgTimer = null;
  function flashLimitMsg() {
    const el = $('composerLimitMsg');
    if (!el) return;
    el.hidden = false;
    clearTimeout(limitMsgTimer);
    limitMsgTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  function renderChatShell() {

    const myColor = colorForUsername(session.username, () => {
      const picker = $('colorPicker');
      if (picker) picker.value = usernameColorCache[session.username.toLowerCase()];
    });

    app.innerHTML = `
      <div class="chat-screen">
        <div class="messages" id="messages">
          <div class="empty-state">Loading messages…</div>
        </div>
        <div class="composer-bar">
          <div class="streak-bar-wrap" id="streakBarWrap">
            <div class="streak-bar" id="streakBar"></div>
          </div>
          <div class="composer-status">
            <div class="who">Signed in as <b>${escapeHtml(session.username)}</b></div>
            <div class="status-actions">
              <button type="button" class="round-btn tapin-btn" id="tapinBtn" title="Tap in!"><span class="tapin-btn-label" id="tapinBtnLabel"><img class="tapin-btn-icon" src="/tapin-cheers.png" alt=""></span></button>
              <input type="color" class="color-picker" id="colorPicker" title="Pick your name color" value="${myColor}">
            </div>
          </div>
          <div class="composer">
            <div class="composer-input-wrap">
              <input type="text" id="msgInput" placeholder="Type a message…" maxlength="${MSG_INPUT_HARD_CAP}" />
              <span class="char-counter" id="charCounter">0/${MAX_MSG_LEN}</span>
            </div>
            <button class="send-btn" id="sendBtn" title="Send" aria-label="Send"><img src="/send-button.png" alt=""></button>
          </div>
          <div class="composer-limit-msg" id="composerLimitMsg" hidden>Messages have to be ${MAX_MSG_LEN} characters or fewer — trim it down and hit send again.</div>
        </div>
      </div>
    `;

    $('colorPicker').addEventListener('input', (e) => {
      const color = e.target.value;
      const key = session.username.toLowerCase();
      usernameColorCache[key] = color;
      usernamesRef.doc(key).set({ color: color }, { merge: true }).catch((err) => console.error(err));
      if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);
    });

    $('sendBtn').addEventListener('click', sendMessage);
    $('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    $('msgInput').addEventListener('input', updateCharCounter);
    updateCharCounter();

    $('tapinBtn').addEventListener('click', sendTapIn);
    refreshTapInButtonState();
  }

  let lastRenderedMsgs = null;

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say hello 👋</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      if (m.type === 'join') {
        return `<div class="system-msg">${escapeHtml(m.username)} has joined</div>`;
      }
      if (m.type === 'tapin') {
        return `<div class="system-msg">${escapeHtml(m.username)} just tapped in</div>`;
      }
      const mine = m.username === session.username;

      const nameHtml = `<span class="msg-name" style="color:${colorForUsername(m.username, () => renderMessages(lastRenderedMsgs))}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble">${escapeHtml(censorText(m.text))}</div>
        </div>
      `;
    }).join('');

    void container.offsetHeight;

    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = $('msgInput');
    if (input.value.length > MAX_MSG_LEN) {
      flashLimitMsg();
      return;
    }
    const text = censorText(input.value.trim());
    if (!text) return;
    input.value = '';
    input.disabled = true;
    updateCharCounter();

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
      updateCharCounter();
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  let clearedAt = 0;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();

    let query = messagesRef.orderBy('ts', 'asc');
    if (clearedAt) query = query.where('ts', '>', clearedAt);

    let sawServerSnapshot = false;

    const TAPIN_EFFECT_MAX_AGE_MS = 15000;

    function handleAddedChange(change, stillSettling) {
      if (change.type !== 'added') return;
      const m = change.doc.data();
      if (stillSettling && !pendingOwnTapinTimestamps.has(m.ts)) return;
      checkSpam(m);
      if (m.type === 'tapin' && Date.now() - m.ts < TAPIN_EFFECT_MAX_AGE_MS) {
        triggerTapInEffect(m.username);
      }
    }

    unsubscribeMessages = query
      .limitToLast(200)
      .onSnapshot(
        (snapshot) => {
          const msgs = snapshot.docs.map(doc => doc.data());
          renderMessages(msgs);

          const stillSettling = !sawServerSnapshot;
          if (!snapshot.metadata.fromCache) sawServerSnapshot = true;
          snapshot.docChanges().forEach((change) => handleAddedChange(change, stillSettling));
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    renderChatShell();
    subscribeToMessages();
    $('msgInput').focus();
  }

  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function enterAuthOrRestore() {
    await deviceLockPromise;

    if (currentlyBanned) return;

    if (deviceLockedUsername) {

      session = { username: deviceLockedUsername };
      rememberUsername(deviceLockedUsername);
      startChat();
      return;
    }

    const saved = getRememberedUsername();
    if (saved) {
      session = { username: saved };

      deviceLockedUsername = saved;
      devicesRef.doc(CLIENT_ID).set({
        username: saved,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));
      startChat();
      return;
    }

    renderAuth();
  }

  let currentlyBanned = false;
  let banExpiryTimer = null;

  function clearBanExpiryTimer() {
    if (banExpiryTimer) { clearTimeout(banExpiryTimer); banExpiryTimer = null; }
  }

  function scheduleBanExpiryRecheck(ban) {
    clearBanExpiryTimer();
    if (!ban || !ban.expiresAt) return;
    const msUntilExpiry = ban.expiresAt - Date.now();
    if (msUntilExpiry <= 0) return;
    banExpiryTimer = setTimeout(() => {

      bansRef.doc(CLIENT_ID).get().then(handleBanDoc).catch(() => {});
    }, msUntilExpiry + 250);
  }

  function handleBanDoc(doc) {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
      scheduleBanExpiryRecheck(ban);
      return;
    }
    clearBanExpiryTimer();

    if (ban && ban.expiresAt) {
      bansRef.doc(CLIENT_ID).delete().catch(() => {});
    }
    if (currentlyBanned) {

      currentlyBanned = false;
      enterAuthOrRestore();
    } else if (!session) {
      enterAuthOrRestore();
    }
  }

  bansRef.doc(CLIENT_ID).onSnapshot(handleBanDoc, () => {

    if (!session) enterAuthOrRestore();
  });
})();
</script>

<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  if (!activeEl) return;

  const db = firebase.firestore();
  const presenceId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  const presenceRef = db.collection('chat_presence').doc(presenceId);

  const HEARTBEAT_MS = 15000;
  const ACTIVE_WINDOW_MS = 40000;
  const STALE_CLEANUP_MS = 120000;

  let presenceById = {};

  function writeHeartbeat() {
    presenceRef.set({ lastSeen: Date.now() }).catch((e) => console.error(e));
  }

  function recomputeActiveCount() {
    const now = Date.now();
    let count = 0;
    Object.keys(presenceById).forEach((id) => {
      if (now - presenceById[id] < ACTIVE_WINDOW_MS) count++;
    });
    activeEl.textContent = count;
  }

  db.collection('chat_presence').onSnapshot(
    (snapshot) => {
      const next = {};
      const now = Date.now();
      snapshot.forEach((doc) => {
        const data = doc.data();
        const lastSeen = data && typeof data.lastSeen === 'number' ? data.lastSeen : 0;
        next[doc.id] = lastSeen;

        if (now - lastSeen > STALE_CLEANUP_MS) {
          doc.ref.delete().catch(() => {});
        }
      });
      presenceById = next;
      recomputeActiveCount();
    },
    (err) => console.error(err)
  );

  writeHeartbeat();
  setInterval(writeHeartbeat, HEARTBEAT_MS);
  setInterval(recomputeActiveCount, 5000);

  function leavePresence() {
    presenceRef.delete().catch(() => {});
  }
  window.addEventListener('pagehide', leavePresence);
  window.addEventListener('beforeunload', leavePresence);
})();
</script>
