<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Stream + Chat</title>
<style>
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }
  :root {
    --ink: #3a0a0a;

    --ink-rgb: 58, 10, 10;
    --panel: rgba(var(--ink-rgb), 0.32);
    --panel-2: rgba(var(--ink-rgb), 0.8);
    --line: rgba(255, 180, 150, 0.6);
    --accent: #cd3232;
    --accent-rgb: 205, 50, 50;
    --accent-dim: #6e1e1e;
    --interactive-hover: #ffff00;
    --interactive-hover-text: #000000;
    --text: #ffffff;
    --text-dim: #f5c9c9;
    --error: #ffb3b3;

    --vods-bg: #200606;
    --font-display: Tahoma, Arial, sans-serif;
    --font-body: Tahoma, Arial, sans-serif;
    --stats-h: 38px;

    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  html.is-offline {
    --ink: #0d0d0d;
    --ink-rgb: 13, 13, 13;
    --line: rgba(120, 120, 120, 0.6);
    --accent: #5a1717;
    --accent-rgb: 90, 23, 23;
    --accent-dim: #333333;
    --text-dim: #aaaaaa;
    --error: #aaaaaa;
    --vods-bg: #080808;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  .widget-privacy-footer { display: none; }

  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(var(--accent-rgb), 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  .layout {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    margin: 0;
    gap: 14px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .video-pane {
    position: relative;

    z-index: 2;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 62%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;

  }

  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  /* Keep native HLS video rendered while buffering. Safari suspends a video
     that becomes invisible during a seek, which leaves it stuck on `waiting`. */
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  .offline-frame {
    position: absolute;
    display: none;
    width: 100cqw;
    height: 100cqh;
    object-fit: cover;
  }

  .video-pane.offline-card .offline-frame { display: block; }

  .gif-loader {
    position: relative;
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-frame-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .video-frame-wrap video::-webkit-media-controls { display: none !important; }

  .chat-pane {
    position: relative;
    z-index: 1;
    flex: 1 1 38%;
    min-width: 300px;
    display: flex;
    container-type: size;
    container-name: chatbox;
  }

  /* On desktop, make the shared row as tall as the 16:9 player. This lets the
     chat sit flush with the player instead of stretching down the page. */
  @media (min-width: 861px) {
    .bg-glow {
      /* Match the 16:9 video-column height instead of the iframe's height. */
      bottom: auto;
      height: calc(34.875vw - 10.5px);
    }
    body.is-chat-hidden .bg-glow {
      height: min(calc(56.25vw - 9px), calc(100dvh - 40px));
      background: transparent;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 62fr) minmax(300px, 38fr);
      align-content: start;
    }
    .video-pane {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }
    .chat-pane { min-width: 0; }
    .layout.chat-hidden,
    .layout.fullscreen-active { grid-template-columns: 1fr; }
    .layout.chat-hidden {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body.is-chat-hidden .layout.chat-hidden .video-pane {
      flex: 0 1 auto;
      width: auto;
      height: min(calc(56.25vw - 9px), calc(100dvh - 40px));
      max-width: 100%;
    }
    .widget-privacy-footer {
      position: absolute;
      top: calc(34.875vw + 10px);
      left: 0;
      right: 0;
      display: block;
      text-align: center;
      padding: 3px 0;
    }
    .widget-privacy-footer a {
      color: #fff;
      font: 9px Arial, Helvetica, sans-serif;
      opacity: 0.75;
    }
    .widget-privacy-footer a:hover { opacity: 1; }
    body.is-chat-hidden .widget-privacy-footer {
      top: min(calc(56.25vw + 10px), calc(100dvh - 21px));
    }
  }

  .vods-panel {
    position: absolute;
    top: 0;

    left: -28px;
    right: 0;

    border-radius: 0 10px 0 0;
    overflow: hidden;
    z-index: 8;
    display: flex;
    flex-direction: column;
    align-items: stretch;

    pointer-events: none;
  }
  .vods-tab {
    pointer-events: auto;
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.5cqw, 10px);
    width: 100%;

    border: 0;
    background: var(--vods-bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: clamp(6px, 1.6cqh, 10px) 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .vods-tab:hover,
  .vods-tab:active {
    background: var(--interactive-hover);
    color: var(--interactive-hover-text);
  }
  .vods-tab:hover .vods-tab-label,
  .vods-tab:hover .vods-tab-chevron,
  .vods-tab:active .vods-tab-label,
  .vods-tab:active .vods-tab-chevron { color: var(--interactive-hover-text); }

  .vods-tab-label,
  .vods-tab-chevron {
    color: var(--text);
  }
  .vods-tab-label {
    font-family: 'Gratis Neue', var(--font-body);
  }
  .vods-tab-chevron {
    display: inline-block;
    font-size: 9px;

    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-tab-chevron { transform: rotate(180deg); }

  .vods-drawer {
    pointer-events: auto;
    flex: none;
    display: flex;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    background: var(--vods-bg);
    transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-drawer {
    max-height: min(70cqh, 460px);
  }

  .vods-heading {
    display: none;
    flex: none;
    text-align: center;
    font-family: 'Gratis Neue', var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 3cqw, 14px);
    color: var(--text);
    padding: 10px 10px 4px;
  }
  .vods-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    padding: 8px 8px 8px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vods-list::-webkit-scrollbar { display: none; }
  .vods-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: clamp(10px, 2.8cqw, 12px);
  }
  .vod-row {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }
  .vod-row:hover { background: rgba(255, 255, 0, 0.12); }
  .vod-row.active { border-color: var(--interactive-hover); background: rgba(255, 255, 0, 0.15); }
  .vod-row-thumb {
    flex: none;
    width: 88px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    object-fit: cover;
    background: var(--panel);
  }
  .vod-row-details {
    min-width: 0;
  }
  .vod-row-title {
    font-family: 'Gratis Neue', var(--font-body);
    font-size: clamp(11px, 2.8cqw, 13px);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .vod-row-date {
    display: block;
    margin-top: 3px;
    color: var(--text-dim);
    font-size: clamp(9px, 2.3cqw, 11px);
    line-height: 1.2;
  }

  @media (max-width: 860px) {
    .layout {
      flex-direction: column;
    }
    .video-pane {
      flex: 0 1 auto;
      box-sizing: content-box;
      aspect-ratio: 16 / 9;
      padding-bottom: var(--stats-h);
    }

    .video-loading {
      bottom: var(--stats-h);
    }

    .layout .video-controls {
      bottom: var(--stats-h);
    }

    .chat-pane {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;

      margin-top: calc(-1 * (14px + var(--stats-h)));
    }

    .layout .stream-stats {
      display: flex;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .stream-stats:active {
      background: var(--ink);
      box-shadow: inset 0 0 26px rgba(var(--accent-rgb), 0.5);
    }

    .stream-stats .stream-stats-vods {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;

      color: var(--text);
    }
    .layout.vods-open .stream-stats-chevron { transform: rotate(180deg); }
    .vods-tab { display: none; }

    .vods-panel {

      top: var(--stats-h);
      left: 0;

      border-radius: 0;
    }

    .layout.vods-open .video-pane {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .vods-drawer {
      border-radius: 0 0 10px 10px;
    }
    .vods-tab {
      align-self: center;
      width: clamp(52px, 16cqw, 74px);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 10px 10px;

      height: 14px;
      padding: 0;
    }
    .vods-tab-chevron { font-size: 10px; }
    .vods-tab-label { display: none; }

    .vods-panel.open .vods-drawer {
      max-height: min(88cqh, 560px);
    }
  }

  .layout.chat-hidden .chat-pane {
    display: none;
  }
  .layout.chat-hidden .video-pane {
    flex: 1 1 100%;
  }

  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .chat-pane { display: none; }

    .layout .video-pane { flex: 1 1 100%; padding-bottom: 0; }
    .layout .stream-stats { display: none; }

    .layout { padding-bottom: 0; }

    .bg-glow { bottom: 0; }

    .layout .video-controls { bottom: 0; }
  }

  .layout.fullscreen-active .chat-pane {
    display: none;
  }

  .stream-stats {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--stats-h);
    z-index: 5;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--vods-bg);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 14px);
    white-space: nowrap;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .stream-stats-vods {
    display: none;
    font-family: 'Gratis Neue', var(--font-body);
  }
  .stream-stats-chevron {
    display: inline-block;
    font-family: var(--font-body);
    font-size: 9px;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stat-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    flex: none;
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Gratis Neue', var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #ffffff;
  }
  .pill-btn:hover:not(:disabled),
  .pill-btn:active:not(:disabled) {
    background: var(--interactive-hover);
    border-color: var(--interactive-hover);
    color: var(--interactive-hover-text);
  }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .viewer-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: clamp(6px, 1.6cqh, 10px) clamp(10px, 2.6cqw, 14px);
    border: 1px solid var(--accent);
    border-radius: clamp(4px, 1.5cqw, 8px);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 3cqw, 14px);
  }
  .viewer-badge svg {
    width: clamp(12px, 3.4cqw, 16px);
    height: clamp(12px, 3.4cqw, 16px);
    fill: var(--accent);
    flex: none;
  }

  .auth-submit-btn {
    width: 100%;
  }

  .video-pane .video-pane-actions,
  .video-pane .viewer-badge,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane.controls-visible .video-pane-actions,
  .video-pane.controls-visible .viewer-badge,
  .video-pane.controls-visible .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  .video-pane.offline-card .video-pane-actions,
  .video-pane.offline-card .viewer-badge,
  .video-pane.offline-card .video-controls {
    display: none;
  }

  .video-pane.offline-card .gif-loader {
    display: none;
  }

  .video-controls {
    position: absolute;
    left: 0;
    right: 0;

    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(var(--ink-rgb), 0.85), rgba(var(--ink-rgb), 0));
  }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }
  .play-pause-btn:disabled { opacity: 0.5; cursor: default; }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }

  .video-pane.pseudo-fullscreen.is-loading {
    background: #000;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }
  .scrub-range::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
  }
  .scrub-range::-moz-range-progress {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }
  .scrub-range::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  .live-btn {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font-family: 'Gratis Neue', var(--font-body);
    font-weight: 700;
    font-size: clamp(10px, 2.8cqw, 12px);
    padding: clamp(4px, 1.2cqh, 6px) clamp(8px, 2.2cqw, 12px);
    cursor: pointer;
  }
  .live-btn:hover,
  .live-btn:active {
    background: var(--interactive-hover);
    border-color: var(--interactive-hover);
    color: var(--interactive-hover-text);
  }
  .live-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }
  .live-btn.at-live .live-dot { background: var(--accent); }

  .chat-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .chat-screen {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
    overflow: hidden;
  }

  .who {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: clamp(10px, 3cqmin, 13px);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .who b {
    color: var(--text);
    font-weight: 600;
    font-family: 'Gratis Neue', var(--font-body);
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: none;
    border: 0;
    color: var(--accent);
  }
  .round-btn:hover:not(:disabled),
  .round-btn:active:not(:disabled) {
    background: var(--interactive-hover);
    color: var(--interactive-hover-text);
  }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .round-btn.play-pause-btn,
  .round-btn.fullscreen-btn { color: #ffffff; }
  .round-btn.play-pause-btn:hover:not(:disabled),
  .round-btn.play-pause-btn:active:not(:disabled),
  .round-btn.fullscreen-btn:hover:not(:disabled),
  .round-btn.fullscreen-btn:active:not(:disabled) { color: var(--interactive-hover-text); }

  .status-actions {
    display: flex;
    align-items: center;

    gap: clamp(6px, 2cqmin, 10px);
    flex: none;
  }

  .color-picker {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(20px, 6.4cqmin, 26px);
    height: clamp(20px, 6.4cqmin, 26px);
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    background: none;

<script>
(function () {
  var layout = document.getElementById('layout');
  var toggleBtn = document.getElementById('toggleChatBtn');
  var activeLiveAspect = '16:9';
  toggleBtn.addEventListener('click', function () {
    var hidden = layout.classList.toggle('chat-hidden');
    document.body.classList.toggle('is-chat-hidden', hidden);
    try {
      var parentPlayerWrap = window.parent.document.querySelector('.player-wrap');
      if (parentPlayerWrap) parentPlayerWrap.classList.toggle('chat-hidden', hidden);
      var parentPage = window.parent.document.querySelector('.page');
      if (parentPage) parentPage.classList.toggle('chat-hidden', hidden);
    } catch (e) {}
    toggleBtn.textContent = hidden ? 'Show Chat' : 'Hide Chat';
    toggleBtn.title = hidden ? 'Show chat' : 'Hide chat';
  });

  window.setLiveAspectMode = function (aspect) {
    var isPortrait = aspect === '9:16';
    activeLiveAspect = isPortrait ? '9:16' : '16:9';
    layout.classList.toggle('mode-portrait', isPortrait);
    document.body.classList.toggle('is-portrait', isPortrait);
    /* The live page and widget are same-origin. Update it directly as well as
       posting the event, so a very fast Firestore response cannot beat the
       parent page's message listener during startup. */
    try {
      /* Live can sit inside the app shell, so update every same-origin parent
         rather than assuming the widget's immediate parent owns the header. */
      var frame = window;
      while (frame.parent && frame.parent !== frame) {
        frame = frame.parent;
        var parentPage = frame.document.querySelector('.page');
        if (parentPage) parentPage.classList.toggle('layout-portrait', isPortrait);
        frame.document.querySelectorAll('.page .logo-link').forEach(function (parentLogo) {
          parentLogo.style.display = isPortrait ? 'none' : '';
        });
      }
    } catch (e) {}
    try {
      window.parent.postMessage({ type: 'knobsock-layout-mode', mode: isPortrait ? '9:16' : '16:9' }, '*');
    } catch (e) {}
    window.dispatchEvent(new Event('knobsock-aspect-change'));
  };
  window.setLiveAspectMode('16:9');
  window.addEventListener('load', function () {
    setTimeout(function () { window.setLiveAspectMode(activeLiveAspect); }, 250);
  });

})();

(function () {
  function isPortraitPhone() {
    return document.body.classList.contains('is-portrait') && window.matchMedia('(max-width: 600px)').matches;
  }
  function lockPortraitScroll() {
    if (!isPortraitPhone()) return;
    window.scrollTo(0, 0);
    try { window.parent.postMessage({ type: 'knobsock-lock-live-scroll' }, '*'); } catch (e) {}
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', lockPortraitScroll);
    window.visualViewport.addEventListener('scroll', lockPortraitScroll);
  }
  window.addEventListener('scroll', lockPortraitScroll, { passive: true });
  document.addEventListener('focusin', function (event) {
    if (!event.target.matches('#msgInput')) return;
    requestAnimationFrame(lockPortraitScroll);
    setTimeout(lockPortraitScroll, 80);
  });
})();

(function () {

  var offlineVideo = document.getElementById('offlineVideo');
  if (offlineVideo) {
    document.addEventListener('visibilitychange', function () {
      var pane = document.getElementById('videoPane');
      if (!pane || !pane.classList.contains('offline-card')) return;
      if (document.visibilityState === 'visible' && offlineVideo.paused) {
        offlineVideo.play().catch(function () {});

})();

(function () {

  var unmuteBtn = document.getElementById('unmuteBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var scrubRange = document.getElementById('scrubRange');
  var timeLabel = document.getElementById('timeLabel');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var videoPane = document.getElementById('videoPane');
  var videoLoading = document.getElementById('videoLoading');
  var layoutEl = document.getElementById('layout');
  var ytFrame = document.getElementById('ytFrame');
  var videoEl = document.getElementById('videoEl');
  var ytPlayer = null;
  var isDragging = false;
  var pollTimer = null;
  var backend = 'youtube';
  var apiReady = false;
  var videoReady = false;
  var hlsInstance = null;
  var resumeAfterDirectSeek = false;
  var directSeekRecoveryTimer = null;
  var directSeekRetryTimer = null;
  var directSeekReloadTimer = null;

  var directSeekTarget = 0;
  var directSeekGeneration = 0;

  function resumeDirectVideoAfterSeek() {
    if (!resumeAfterDirectSeek || backend !== 'video' || videoEl.ended) return;
    videoEl.play().catch(function () {});
  }

  function recoverDirectVideoAfterSeek() {
    var seekGeneration = directSeekGeneration;
    clearTimeout(directSeekRecoveryTimer);
    clearTimeout(directSeekRetryTimer);
    clearTimeout(directSeekReloadTimer);
    resumeDirectVideoAfterSeek();
    directSeekRecoveryTimer = setTimeout(resumeDirectVideoAfterSeek, 350);
    directSeekRetryTimer = setTimeout(function () {
      resumeDirectVideoAfterSeek();
    }, 1200);
    directSeekReloadTimer = setTimeout(function () {
      if (seekGeneration !== directSeekGeneration || hlsInstance || !resumeAfterDirectSeek || backend !== 'video' || videoEl.ended || !videoEl.currentSrc || (!videoEl.seeking && videoEl.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA)) return;
      var source = videoEl.currentSrc;
      var target = directSeekTarget;
      videoEl.addEventListener('loadedmetadata', function restoreStalledSeek() {
        if (seekGeneration !== directSeekGeneration) return;
        var duration = videoEl.duration;
        videoEl.currentTime = isFinite(duration) ? Math.min(target, Math.max(0, duration - 0.05)) : target;
        videoEl.play().catch(function () {});
      }, { once: true });

      videoEl.src = source;
      videoEl.load();

  }

  // Safari can mark native HLS paused while it seeks. Remembering the last
  // playing state lets an active Bunny video resume without overriding a pause.
  videoEl.addEventListener('seeking', function () {

      (!videoEl.paused || directVideoWasPlaying);
    if (resumeAfterDirectSeek) recoverDirectVideoAfterSeek();
  });
  videoEl.addEventListener('seeked', function () {
    recoverDirectVideoAfterSeek();
  });

  function seekDirectVideo(t) {
    directSeekTarget = t;
    directSeekGeneration += 1;

  function isDirectVideoUrl(input) {
    if (!input) return false;
    var trimmed = String(input).trim();
    return /^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed);
  }

  function showBackendEl(kind) {
    /* Hiding a media element does not stop its audio. Tear down the previous
       backend before showing the next one so VOD audio cannot survive a
       Return to Live transition. */
    if (kind === 'youtube') {
      stopDirectVideo();
    } else {
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (e) {}
      } else if (ytFrame.src && ytFrame.src !== 'about:blank') {

      }

    videoEl.style.display = kind === 'video' ? '' : 'none';

    if (isIOS) {

      }

    showBackendEl('video');
    showVideoLoading();
    videoReady = false;
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    videoEl.play().catch(function () {});

    unmuteBtn.disabled = false;
    playPauseBtn.disabled = false;
    scrubRange.disabled = false;

  videoEl.addEventListener('playing', function () { if (backend === 'video') { directVideoWasPlaying = true; hideVideoLoading(); updatePlayPauseIcon(true); } });

    if (backend === 'video') updatePlayPauseIcon(false);
    setTimeout(function () { if (!videoEl.seeking) directVideoWasPlaying = false; }, 0);

  function showVideoLoading() {

    if (videoPane.classList.contains('offline-card')) return;
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');

      youtubeRevealTimer = setTimeout(function () {

    }
  }
  function hideVideoLoading() {
    if (videoPane.classList.contains('offline-card')) return;
    clearTimeout(youtubeRevealTimer);
    videoLoading.hidden = true;
    videoPane.classList.remove('is-loading');
  }

  ytFrame.addEventListener('load', function () {
    if (backend !== 'youtube') return;
    clearTimeout(youtubeRevealTimer);
    youtubeRevealTimer = setTimeout(function () {
      if (backend === 'youtube') hideVideoLoading();
    }, 250);
  });

  var CONTROLS_AUTO_HIDE_MS = 3000;
  var supportsHover = window.matchMedia('(hover: hover)').matches;
  var controlsHideTimer = null;

  function showControls(autoHide) {
    videoPane.classList.add('controls-visible');
    clearTimeout(controlsHideTimer);
    if (autoHide) {

        videoPane.classList.remove('controls-visible');
      }, CONTROLS_AUTO_HIDE_MS);
    }
  }
  function hideControlsNow() {
    clearTimeout(controlsHideTimer);

    videoPane.addEventListener('mouseenter', function () { showControls(true); });
    videoPane.addEventListener('mousemove', function () { showControls(true); });

    videoPane.addEventListener('touchstart', function (e) {

         the controls before the browser can follow that link. */
      if (e.target.closest('.portrait-video-logo')) return;
      if (e.target.closest('.stream-stats')) return;
      if (e.target.closest('.video-pane-actions, .viewer-badge, .video-controls')) {
        showControls(true);
        return;
      }
      if (videoPane.classList.contains('controls-visible')) {
        hideControlsNow();
      } else {

      lastPortraitRevealTouchAt = Date.now();

    unmuteBtn.title = isMuted ? 'Unmute' : 'Mute';

  function applyPendingUnmute() {
    if (!pendingUnmute) return;
    userMutedDeliberately = false;
    if (backend === 'video') {
      videoEl.muted = false;

    }
  }

  window.unmuteLivePlayer = function () {
    if (userMutedDeliberately) return;
    if (backend === 'video') {
      if (!videoReady) { pendingUnmute = true; return; }
      if (!videoEl.muted) return;
      videoEl.muted = false;
      videoEl.volume = 1;
      setMutedUiState(false);
      return;
    }
    if (!ytPlayer || typeof ytPlayer.unMute !== 'function') { pendingUnmute = true; return; }
    if (!youtubeMuted) return;
    pendingUnmute = true;
    applyPendingUnmute();
  };

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    var min = parseFloat(scrubRange.min) || 0;
    var max = parseFloat(scrubRange.max) || 100;
    var val = parseFloat(scrubRange.value) || 0;
    var pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(isPlaying) {
    if (isPlaying) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {
      playPauseBtn.innerHTML = '&#9658;';
      playPauseBtn.title = 'Play';
    }
  }

  function updateProgress() {
    if (isDragging) { updateLiveButtonState(); return; }
    if (backend === 'video') {
      if (videoReady) {
        var vDuration = videoEl.duration || 0;
        var vCurrent = videoEl.currentTime || 0;
        if (vDuration > 0 && isFinite(vDuration)) {
          scrubRange.max = vDuration;
          scrubRange.value = vCurrent;
          updateRangeFill();
          timeLabel.textContent = formatTime(vCurrent) + ' / ' + formatTime(vDuration);
        }
      }
      updateLiveButtonState();
      return;
    }
    if (!apiReady || !ytPlayer) { updateLiveButtonState(); return; }
    var duration = ytPlayer.getDuration();
    var current = ytPlayer.getCurrentTime();
    if (duration > 0) {
      scrubRange.max = duration;
      scrubRange.value = current;
      updateRangeFill();
      timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
    updateLiveButtonState();
  }

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          apiReady = true;
          unmuteBtn.disabled = false;
          playPauseBtn.disabled = false;
          scrubRange.disabled = false;
          updatePlayPauseIcon(true);
          updateProgress();
          applyPendingUnmute();
          hideVideoLoading();
        },
        onStateChange: function (event) {
          if (backend !== 'youtube') return;
          updatePlayPauseIcon(event.data === YT.PlayerState.PLAYING);
          if (event.data === YT.PlayerState.PLAYING) {
            hideVideoLoading();
            applyPendingUnmute();

      }
    });
  };

  var configuredLiveSource = null;
  var configuredIsLive = false;
  var configuredLiveAspect = '16:9';
  var loadedVideoId = null;
  var watchingVodId = null;
  var ytApiRequested = false;
  var ytApiRetryCount = 0;
  var youtubeRevealTimer = null;
  var liveBtn = document.getElementById('liveBtn');

  /* On a portrait phone, the chat composer is above the video. Move the real
     Live button beside Send instead of rendering a second control or letting
     video controls disappear under the composer. */
  function syncPortraitMobileLiveButton() {
    var controls = document.getElementById('videoControls');
    var composer = document.querySelector('.composer');
    var sendBtn = document.getElementById('sendBtn');
    if (!controls || !liveBtn) return;
    var useComposerControl = layoutEl.classList.contains('mode-portrait') && window.matchMedia('(max-width: 600px)').matches;
    var stack = document.getElementById('portraitSendStack');

    if (useComposerControl && composer && sendBtn) {
      if (!stack) {
        stack = document.createElement('div');
        stack.className = 'portrait-send-stack';
        stack.id = 'portraitSendStack';
        composer.insertBefore(stack, sendBtn);
        stack.appendChild(sendBtn);
      }
      if (liveBtn.parentNode !== stack) stack.insertBefore(liveBtn, stack.firstChild);
      return;
    }

    if (liveBtn.parentNode !== controls) controls.insertBefore(liveBtn, fullscreenBtn);
    if (stack) {
      var stackedSend = stack.querySelector('.send-btn');
      var stackComposer = stack.closest('.composer');
      if (stackedSend && stackComposer) stackComposer.appendChild(stackedSend);
      stack.remove();
    }
  }
  window.syncPortraitMobileLiveButton = syncPortraitMobileLiveButton;
  window.addEventListener('knobsock-aspect-change', syncPortraitMobileLiveButton);
  window.addEventListener('resize', syncPortraitMobileLiveButton);

  function requestYouTubeIframeApi() {
    if (window.YT && typeof window.YT.Player === 'function') {
      if (!ytPlayer) window.onYouTubeIframeAPIReady();
      return;
    }
    if (ytApiRequested) return;
    ytApiRequested = true;
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () {
      ytApiRequested = false;
      if (ytApiRetryCount++ < 1) setTimeout(requestYouTubeIframeApi, 1000);
    };
    document.body.appendChild(s);
  }

  function youtubeEmbedUrl(videoId) {
    return 'https://www.youtube.com/embed/' + videoId +
      '?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0';
  }

  function replaceYouTubeFrame() {
    /* A backgrounded iOS browser can discard the renderer behind a
       cross-origin iframe while leaving the old YT.Player object in this
       document. Replace the iframe itself, rather than reusing that stale
       object, so the next user tap always reaches a live player. */
    var replacement = ytFrame.cloneNode(false);
    replacement.removeAttribute('src');
    ytFrame.parentNode.replaceChild(replacement, ytFrame);
    ytFrame = replacement;
    ytFrame.addEventListener('load', function () {
      if (backend !== 'youtube') return;
      clearTimeout(youtubeRevealTimer);
      youtubeRevealTimer = setTimeout(function () {
        if (backend === 'youtube') hideVideoLoading();
      }, 250);
    });
  }

  function reloadYoutubePlayer(videoId) {
    if (!videoId) return;
    apiReady = false;
    videoReady = false;
    ytPlayer = null;
    youtubeMuted = true;
    pendingUnmute = false;
    setMutedUiState(true);
    unmuteBtn.disabled = false;
    replaceYouTubeFrame();
    ytFrame.src = youtubeEmbedUrl(videoId);
    requestYouTubeIframeApi();
  }

  var LIVE_EDGE_THRESHOLD_SEC = 8;

  function updateLiveButtonState() {
    if (!liveBtn) return;
    var onLiveSlot = !watchingVodId;
    var behindEdge = false;
    if (onLiveSlot && configuredIsLive && backend === 'youtube' && ytPlayer && typeof ytPlayer.getDuration === 'function') {
      var duration = ytPlayer.getDuration();
      var current = ytPlayer.getCurrentTime();
      behindEdge = duration > 0 && (duration - current) > LIVE_EDGE_THRESHOLD_SEC;
    }
    var atLive = onLiveSlot && !behindEdge;
    liveBtn.classList.toggle('at-live', atLive);
    liveBtn.title = watchingVodId ? 'Return to live' : (atLive ? 'Live' : 'Jump to live');
  }

  function updateOfflineCardState() {
    var showOfflineCard = !watchingVodId && !configuredIsLive;
    videoPane.classList.toggle('offline-card', showOfflineCard);
    var offlineVideo = document.getElementById('offlineVideo');
    if (!offlineVideo) return;
    if (showOfflineCard) {
      videoLoading.hidden = false;
      videoPane.classList.remove('is-loading');
      offlineVideo.play().catch(function () {});
    } else {
      offlineVideo.pause();
    }
  }
  updateOfflineCardState();

  function updateOfflineTheme() {
    document.documentElement.classList.toggle('is-offline', !configuredIsLive);
    try { window.parent.postMessage({ type: 'knobsock-live-state', isLive: configuredIsLive }, '*'); } catch (e) {}
  }
  updateOfflineTheme();

  window.applyLiveVideoState = function (source, isLive, aspect) {
    pendingUnmute = false;
    configuredLiveSource = isLive ? source : null;
    configuredIsLive = !!isLive;
    configuredLiveAspect = aspect === '9:16' ? '9:16' : '16:9';
    /* Portrait is a live-only presentation. Going offline always restores the
       normal player, even if the next configured live stream is vertical. */
    if (!watchingVodId) window.setLiveAspectMode(isLive ? configuredLiveAspect : '16:9');
    updateLiveButtonState();
    updateOfflineCardState();
    updateOfflineTheme();
    if (watchingVodId) return;

    if (!isLive || !source) {
      loadedVideoId = null;
      stopDirectVideo();
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      showVideoLoading();
      return;
    }

    var key = source.type === 'direct' ? source.url : source.id;
    if (key === loadedVideoId) return;
    loadedVideoId = key;

    if (source.type === 'direct') {
      loadDirectVideo(source.url);
      return;
    }

    backend = 'youtube';
    showBackendEl('youtube');
    youtubeMuted = true;
    setMutedUiState(true);
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      ytPlayer.loadVideoById(source.id);
      return;
    }

    var frame = document.getElementById('ytFrame');
    if (frame) {
      frame.src = youtubeEmbedUrl(source.id);
    }
    requestYouTubeIframeApi();
  };

  window.switchToVod = function (vodId, entry, unmute) {
    if (!vodId || (watchingVodId === vodId && loadedVideoId === vodId)) return;
    watchingVodId = vodId;
    /* VOD playback always uses the standard player layout. */
    window.setLiveAspectMode('16:9');
    loadedVideoId = vodId;
    pendingUnmute = !!unmute;
    youtubeMuted = !pendingUnmute;
    setMutedUiState(youtubeMuted);
    showVideoLoading();
    if (entry && entry.type === 'direct') {
      loadDirectVideo(entry.url);
    } else {
      backend = 'youtube';
      showBackendEl('youtube');
      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(vodId);
      } else {
        var frame = document.getElementById('ytFrame');
        if (frame) {
          frame.src = youtubeEmbedUrl(vodId);
        }
        requestYouTubeIframeApi();
      }
    }
    applyPendingUnmute();
    updateLiveButtonState();
    updateOfflineCardState();
    if (typeof window.onVodStateChange === 'function') window.onVodStateChange(watchingVodId);
  };

  window.returnToLive = function () {
    watchingVodId = null;
    loadedVideoId = null;
    window.applyLiveVideoState(configuredLiveSource, configuredIsLive, configuredLiveAspect);
    if (typeof window.onVodStateChange === 'function') window.onVodStateChange(null);
  };

  if (liveBtn) {
    liveBtn.addEventListener('click', function () {
      if (watchingVodId) {
        window.returnToLive();
        return;
      }
      if (!configuredIsLive) {

        window.applyLiveVideoState(configuredLiveSource, false);
        return;
      }
      if (backend === 'video') {
        var shouldResume = !videoEl.paused;
        if (hlsInstance && typeof hlsInstance.liveSyncPosition === 'number') {
          videoEl.currentTime = hlsInstance.liveSyncPosition;
        } else if (videoReady && isFinite(videoEl.duration)) {
          videoEl.currentTime = videoEl.duration;
        }
        if (shouldResume) videoEl.play().catch(function () {});
        return;
      }
      if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
        var duration = ytPlayer.getDuration();
        if (duration > 0) ytPlayer.seekTo(duration, true);
      }
    });

    updateLiveButtonState();
  }

  unmuteBtn.addEventListener('click', function () {
    pendingUnmute = false;
    if (backend === 'video') {
      if (!videoReady) return;
      if (videoEl.muted) {
        videoEl.muted = false;
        videoEl.volume = 1;
        userMutedDeliberately = false;
        setMutedUiState(false);
      } else {
        videoEl.muted = true;
        userMutedDeliberately = true;
        setMutedUiState(true);
      }
      return;
    }

         apply it as soon as the new player is usable. */
      pendingUnmute = true;
      userMutedDeliberately = false;
      applyPendingUnmute();
      return;
    }
    if (!ytPlayer || typeof ytPlayer.mute !== 'function') return;
    ytPlayer.mute();
    youtubeMuted = true;
    userMutedDeliberately = true;
    setMutedUiState(true);
  });

  var playerWasBackgrounded = false;
  var playerResumeTimer = null;

  function isPortraitMobileLive() {
    return configuredIsLive && !watchingVodId && backend === 'youtube' &&
      document.body.classList.contains('is-portrait') &&
      window.matchMedia('(max-width: 600px)').matches;
  }

  function recoverPortraitPlayerAfterBackground() {
    if (!isPortraitMobileLive() || !configuredLiveSource ||
        configuredLiveSource.type === 'direct') return;
    clearTimeout(playerResumeTimer);
    playerResumeTimer = setTimeout(function () {
      if (!isPortraitMobileLive()) return;
      reloadYoutubePlayer(configuredLiveSource.id);
    }, 100);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      playerWasBackgrounded = true;
      return;
    }
    if (!playerWasBackgrounded) return;
    playerWasBackgrounded = false;
    recoverPortraitPlayerAfterBackground();
  });
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) recoverPortraitPlayerAfterBackground();
  });

  playPauseBtn.addEventListener('click', function () {
    if (backend === 'video') {
      if (!videoReady) return;
      if (!videoEl.paused && !videoEl.ended) videoEl.pause();
      else videoEl.play().catch(function () {});
      return;
    }
    if (!ytPlayer) return;
    var state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    var duration = backend === 'video'
      ? (videoEl.duration || parseFloat(scrubRange.max))
      : (ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max));
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (backend === 'video') {
      if (videoReady) {
        seekDirectVideo(parseFloat(scrubRange.value));
      }
    } else if (ytPlayer) {
      ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    }
    isDragging = false;
  });

  var usingPseudoFullscreen = false;

  var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    /iP(hone|od|ad)/.test(navigator.platform) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      var result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(function () { enterPseudoFullscreen(); });
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }

  function updateFullscreenIcon() {
    var fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';

    layoutEl.classList.toggle('fullscreen-active', fs);
  }

  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    // Keep Bunny HLS in this document on iOS. The native video fullscreen
    // player has its own seek pipeline and can stall after a scrub.
    if (isIOS && backend === 'video') {
      enterPseudoFullscreen();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) {
      requestFs(videoPane);
    } else {
      enterPseudoFullscreen();
    }
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenIcon);
    }
  );

  pollTimer = setInterval(updateProgress, 500);
})();

  const IP_RETENTION_DAYS = 90;

  let chatEmojis = [];
  let chatEmojiByName = {};

  function normalizeChatEmoji(item) {
    const name = String(item && item.name || '').toLowerCase();
    const url = String(item && item.url || '');
    if (!/^[a-z0-9_-]{1,32}$/.test(name) || (!/^https?:\/\//i.test(url) && url.charAt(0) !== '/')) return null;
    return { name: name, url: url };

  function setChatEmojis(items) {

    chatEmojis = (Array.isArray(items) ? items : []).map(normalizeChatEmoji).filter(function (item) {
      if (!item || byName[item.name]) return false;

      .then(function (data) { setChatEmojis(data && data.emojis); })
      .catch(function () { setChatEmojis([]); });
  }
  loadChatEmojis();

  async function hashIp(ip) {
    const bytes = new TextEncoder().encode(IP_LOG_SALT + ip);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

      : { type: 'youtube', id: (data && data.videoId) || DEFAULT_LIVE_VIDEO_ID };
    const isLive = !(data && data.isLive === false);
    if (typeof window.applyLiveVideoState === 'function') {

    if (typeof window.applyLiveVideoState === 'function') {
      window.applyLiveVideoState({ type: 'youtube', id: DEFAULT_LIVE_VIDEO_ID }, true);
    }
  });

  function extractVideoId(input) {
    if (!input) return null;
    const trimmed = String(input).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
    const m = trimmed.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function isDirectVideoUrl(input) {

    return /^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed);
  }

  function extractDirectVideoId(input) {
    const trimmed = String(input || '').trim();
    const m = trimmed.match(/\/([0-9a-fA-F-]{10,})\/playlist\.m3u8(?:\?.*)?$/i);
    if (m) return m[1];
    let hash = 0;

  function toggleVods() {
    setVodsOpen(!vodsPanel.classList.contains('open'));

  if (vodsTab) vodsTab.addEventListener('click', toggleVods);

  const vodsBarQuery = window.matchMedia('(max-width: 860px)');
  const streamStatsEl = document.getElementById('streamStats');
  if (streamStatsEl) {
    streamStatsEl.addEventListener('click', () => {
      if (vodsBarQuery.matches) toggleVods();

  }

  window.onVodStateChange = function (vodId) {
    activeVodId = vodId;
    renderVods();
    try { window.parent.postMessage({ type: 'knobsock-vod-state', vodId: vodId }, '*'); } catch (e) {}
  };

  function renderVods() {
    if (!vodsListEl) return;
    if (!latestVods.length) {
      vodsListEl.innerHTML = '<div class="vods-empty">No past streams yet.</div>';
      return;
    }
    vodsListEl.innerHTML = latestVods.map((v) => {

  function formatVodAddedDate(value) {

  let vodDeepLinkAttempted = false;

    const items = (data && Array.isArray(data.items)) ? data.items : [];
    latestVods = items.map((v) => {
      const ytId = extractVideoId(v.url);
      if (ytId) return { id: ytId, type: 'youtube', title: v.title, thumb: v.thumb || '', aspect: v.aspect === '9:16' ? '9:16' : '16:9', addedAt: v.addedAt || 0 };
      if (isDirectVideoUrl(v.url)) return { id: extractDirectVideoId(v.url), type: 'direct', url: v.url, title: v.title, thumb: v.thumb || '', aspect: v.aspect === '9:16' ? '9:16' : '16:9', addedAt: v.addedAt || 0 };
      return null;
    }).filter(Boolean);

  let session = null;
  let unsubscribeMessages = null;

  function getClientId() {
    try {
      let id = localStorage.getItem('chat_client_id');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2));
        localStorage.setItem('chat_client_id', id);
      }
      return id;
    } catch (e) {

      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    }
  }
  const CLIENT_ID = getClientId();
  window.KNOBSOCK_CLIENT_ID = CLIENT_ID;

  const LAST_USERNAME_KEY = 'chat_last_username';

  function rememberUsername(username) {
    try { localStorage.setItem(LAST_USERNAME_KEY, username); } catch (e) {}
  }

  function getRememberedUsername() {
    try { return localStorage.getItem(LAST_USERNAME_KEY); } catch (e) { return null; }
  }

  function forgetRememberedUsername() {

  }

  let deviceLockedUsername = null;
  let resolveDeviceLockReady;
  const deviceLockPromise = new Promise((resolve) => { resolveDeviceLockReady = resolve; });

  function markDeviceLockReady() {
    if (deviceLockReady) return;
