  function getClientId() {
    try {
      let id = localStorage.getItem('chat_client_id');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2));
        localStorage.setItem('chat_client_id', id);
      }
      return id;
    } catch (e) {

      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    }
  }
  const CLIENT_ID = getClientId();
  window.KNOBSOCK_CLIENT_ID = CLIENT_ID;

  const LAST_USERNAME_KEY = 'chat_last_username';

  function rememberUsername(username) {
    try { localStorage.setItem(LAST_USERNAME_KEY, username); } catch (e) {}
  }

  function getRememberedUsername() {
    try { return localStorage.getItem(LAST_USERNAME_KEY); } catch (e) { return null; }
  }

  function forgetRememberedUsername() {
    try { localStorage.removeItem(LAST_USERNAME_KEY); } catch (e) {}
  }

  let deviceLockedUsername = null;
  let resolveDeviceLockReady;
  const deviceLockPromise = new Promise((resolve) => { resolveDeviceLockReady = resolve; });
  let deviceLockReady = false;

  function markDeviceLockReady() {
    if (deviceLockReady) return;
    deviceLockReady = true;
    resolveDeviceLockReady();
  }

  devicesRef.doc(CLIENT_ID).onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const lockedName = (data && data.username) || null;
    const hadLock = deviceLockedUsername;
    deviceLockedUsername = lockedName;
    markDeviceLockReady();

    lastTapInAt = (data && data.lastTapInAt) || 0;
    refreshTapInButtonState();
    refreshChatGateState();

    myStreak = (data && data.streak) || 0;
    myStreakDay = (data && data.streakDay) || null;
    myFightWins = (data && data.fightWins) || 0;
    const savedFightCooldown = Number(data && data.fightCooldownUntil);
    myFightCooldownUntil = Number.isFinite(savedFightCooldown) ? savedFightCooldown : 0;
    refreshFightPanel();

    if (!currentlyBanned && hadLock && !lockedName && session) {
      session = null;
      forgetRememberedUsername();
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderAuth('An admin signed you out — pick a new username to keep chatting.');
    }
  }, () => {

    markDeviceLockReady();
  });

  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const deviceRef = devicesRef.doc(CLIENT_ID);

    try {
      const deviceDoc = await deviceRef.get();
      const lockedName = deviceDoc.exists && deviceDoc.data() && deviceDoc.data().username;
      if (lockedName) {
        return { username: lockedName, isNew: false };
      }
    } catch (e) {
      console.error('Device lock check failed, proceeding as a normal claim:', e);
    }

    const finalUsername = await db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (baseDoc.exists) {
        throw new Error('USERNAME_TAKEN');
      }
      tx.set(baseRef, {
        username: rawUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

        lastDeviceId: CLIENT_ID
      });
      return rawUsername;
    });

    devicesRef.doc(CLIENT_ID).set({
      username: finalUsername,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));

    return { username: finalUsername, isNew: true };
  }

  function logIpBestEffort(finalUsername) {
    fetch('https://api.ipify.org?format=json')
      .then(res => res.ok ? res.json() : null)
      .then(data => (data && data.ip) ? hashIp(data.ip) : null)
      .then(ipHash => {
        if (!ipHash) return;
        const now = Date.now();
        return ipLogRef.doc(finalUsername.toLowerCase()).set({
          ipHash: ipHash,
          loggedAt: now,
          expiresAt: new Date(now + IP_RETENTION_DAYS * 24 * 60 * 60 * 1000)
        });
      })
      .catch(() => {});
  }

  async function sendMessageToFirestore(entry) {
    await messagesRef.add({
      username: entry.username,
      text: entry.text,
      color: myCurrentColor(),
      deviceId: CLIENT_ID,
      ts: Date.now()
    });
  }

  function sendJoinNotice(username) {
    messagesRef.add({
      type: 'join',
      username: username,
      text: 'has joined',
      deviceId: CLIENT_ID,
      ts: Date.now()
    }).catch(() => {});
  }

  const CHAT_UNLOCK_MS = 24 * 60 * 60 * 1000;
  let lastTapInAt = 0;
  let tapinCooldownTimer = null;
  let chatGateTimer = null;

  let myStreak = 0;
  let myStreakDay = null;

  const pendingOwnTapinTimestamps = new Set();

  function formatHms(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function isChatUnlocked() {
    return lastTapInAt > 0 && (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt)) > 0;
  }

  function refreshChatGateState() {
    const status = $('chatGateStatus');
    const lockTimer = $('chatLockTimer');
    const input = $('msgInput');
    const sendBtn = $('sendBtn');
    if (!status || !lockTimer || !input || !sendBtn) return;
    clearTimeout(chatGateTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    const unlocked = lastTapInAt > 0 && remaining > 0;
    const screen = app.querySelector('.chat-screen');
    if (screen) screen.classList.toggle('is-chat-locked', !unlocked);
    input.disabled = !unlocked;
    sendBtn.disabled = !unlocked;
    input.placeholder = unlocked ? 'Type a message…' : 'Tap in above to chat…';
    const tapinBtn = $('tapinBtn');
    const tapinGate = $('tapinGate');
    if (tapinBtn) tapinBtn.classList.toggle('is-required', !unlocked);
    if (tapinGate) tapinGate.classList.toggle('is-locked', !unlocked);
    if (unlocked) {
      status.textContent = '';
      status.classList.remove('is-locked');
      lockTimer.textContent = 'Chat locks again in ' + formatHms(remaining);
      chatGateTimer = setTimeout(refreshChatGateState, 1000);
    } else {
      status.textContent = 'Tap in to chat';
      status.classList.add('is-locked');
      lockTimer.textContent = '';
    }
    refreshFightPanel();
  }

  const TAPIN_ICON_HTML = '<img class="tapin-btn-icon" src="/tapin-cheers.png" alt="">';

  function utcDayKey(ts) {
    return new Date(ts).toISOString().slice(0, 10);
  }

  function nextStreakAfterTapIn(ts) {
    const todayKey = utcDayKey(ts);
    if (myStreakDay === todayKey) return { streak: myStreak, day: todayKey };
    const yesterdayKey = utcDayKey(ts - 24 * 60 * 60 * 1000);
    return { streak: myStreakDay === yesterdayKey ? myStreak + 1 : 1, day: todayKey };
  }

  function fetchFirstPlaceStreak() {
    return devicesRef.orderBy('streak', 'desc').limit(15).get().then((snap) => {
      const todayKey = utcDayKey(Date.now());
      const yesterdayKey = utcDayKey(Date.now() - 24 * 60 * 60 * 1000);
      let first = null;
      snap.forEach((doc) => {
        if (first) return;
        const data = doc.data();
        if (!data.streak || (data.streakDay !== todayKey && data.streakDay !== yesterdayKey)) return;
        first = { username: data.username || '?', streak: data.streak };
      });
      return first;
    }).catch(() => null);
  }

  const STREAK_BAR_VISIBLE_MS = 8000;
  let streakBarHideTimer = null;
  let streakBarToken = 0;

  function showStreakBar(streak) {
    const wrap = $('streakBarWrap');
    const bar = $('streakBar');
    if (!wrap || !bar) return;
    const token = ++streakBarToken;

    clearTimeout(streakBarHideTimer);
    bar.innerHTML = `<span class="streak-bar-mine"><img class="streak-fire-icon" src="/streak-fire.gif" alt=""> ${streak} day streak</span>`;
    wrap.classList.add('is-visible');
    streakBarHideTimer = setTimeout(() => {
      wrap.classList.remove('is-visible');

      void wrap.offsetHeight;
    }, STREAK_BAR_VISIBLE_MS);

    fetchFirstPlaceStreak().then((first) => {

      if (token !== streakBarToken || !wrap.classList.contains('is-visible') || !first) return;
      bar.insertAdjacentHTML('beforeend',
        `<span class="streak-bar-divider">|</span><span class="streak-bar-lb-entry"><img class="streak-medal-icon" src="/streak-medal-gold.png" alt=""> 1st place: ${escapeHtml(first.username)}</span>`
      );
    });
  }

  // Fights use the existing chat_messages subscription as their event stream.
  // Clicks stay in the browser. During a match a fighter publishes an
  // aggregate at most once a second, which keeps the tug live for everyone
  // without making every punch a Firestore write or adding another listener.
  const FIGHT_CHALLENGE_MS = 25 * 1000;
  const FIGHT_START_DELAY_MS = 3 * 1000;
  const FIGHT_DURATION_MS = 30 * 1000;
  const FIGHT_LIVE_SCORE_INTERVAL_MS = 1000;
  const FIGHT_RESULT_HOLD_MS = 8 * 1000;
  const FIGHT_COOLDOWN_MS = 10 * 60 * 1000;
  const FIGHT_TARGET_ACTIVE_MS = 150 * 1000;
  const FIGHT_TARGET_CACHE_MS = 60 * 1000;
  const FIGHT_TARGET_EMPTY_RETRY_MS = 1600;

  let currentFight = null;
  let fightTicker = null;
  let fightExpiryTimer = null;
  let fightResultTimer = null;
  let fightCooldownTimer = null;
  let fightTargetFetchAt = 0;
  let fightTargetFetchInFlight = false;
  let fightTargetEmptyRetries = 0;
  let fightTargetRetryTimer = null;
  const fightPresenceTargets = new Map();
  const pendingOwnFightTimestamps = new Set();
  const FIGHT_PUNCH_SOURCES = [
    '/Punch1.mp3',
    '/Punch2.mp3',
    '/Punch3.mp3'
  ];
  const FIGHT_HIT_WORDS = ['POW!', "THAT'LL TEACH ’EM!", 'BAM!', 'WHAM!'];
  let fightPunchAudio = null;
  let fightPunchIndex = 0;
  let fightPunchAnimationTimer = null;
  let fightHitWordIndex = 0;

  function isFightEvent(message) {
    return !!(message && typeof message.type === 'string' && message.type.indexOf('fight_') === 0);
  }

  function isFightParticipant(fight) {
    return !!(fight && session && (session.username === fight.challenger || session.username === fight.opponent));
  }

  function fightRole(fight) {
    if (!fight || !session) return 'spectator';
    if (session.username === fight.challenger) return 'challenger';
    if (session.username === fight.opponent) return 'opponent';
    return 'spectator';
  }

  function fightCooldownRemaining() {
    return Math.max(0, myFightCooldownUntil - Date.now());
  }

  function isFightOnCooldown() {
    return fightCooldownRemaining() > 0;
  }

  function formatFightCooldown(remaining) {
    const seconds = Math.max(0, Math.ceil(remaining / 1000));
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }

  function scheduleFightCooldownRefresh() {
    clearTimeout(fightCooldownTimer);
    const remaining = fightCooldownRemaining();
    if (!remaining) return;
    fightCooldownTimer = setTimeout(refreshFightPanel, Math.min(remaining, 1000));
  }

  function setFightCooldown(until) {
    const nextUntil = Number(until) || 0;
    if (nextUntil <= Date.now() || nextUntil <= myFightCooldownUntil + 500) return;
    myFightCooldownUntil = nextUntil;
    let shouldPersist = true;
    try {
      const key = 'knobsock_fight_cooldown_' + CLIENT_ID;
      const alreadyPersisted = Number(localStorage.getItem(key)) || 0;
      shouldPersist = alreadyPersisted < nextUntil - 500;
      if (shouldPersist) localStorage.setItem(key, String(nextUntil));
    } catch (e) {}
    if (shouldPersist) {
      devicesRef.doc(CLIENT_ID).set({
        fightCooldownUntil: nextUntil
      }, { merge: true }).catch((error) => {
        console.error('Could not persist fight cooldown:', error);
      });
    }
    refreshFightPanel();
  }

  function playFightPunchSound() {
    if (!fightPunchAudio && typeof Audio !== 'undefined') {
      fightPunchAudio = FIGHT_PUNCH_SOURCES.map((src) => {
        const clip = new Audio(src);
        clip.preload = 'auto';
        return clip;
      });
    }
    if (!fightPunchAudio || !fightPunchAudio.length) return;
    const clip = fightPunchAudio[fightPunchIndex % fightPunchAudio.length];
    fightPunchIndex += 1;
    if (!clip) return;
    try {
      clip.pause();
      clip.currentTime = 0;
      const play = clip.play();
      if (play && typeof play.catch === 'function') play.catch(() => {});
    } catch (e) {}
  }

  function showFightHitWord(button) {
    const panel = $('fightPanel');
    if (!panel || !button) return;
    const olderWords = Array.from(panel.querySelectorAll('.fight-hit-word'));
    // Let a quick burst feel energetic without letting a rapid tapper cover
    // the whole small arena in labels.
    olderWords.slice(0, Math.max(0, olderWords.length - 2)).forEach((word) => word.remove());

    const word = document.createElement('span');
    word.className = 'fight-hit-word';
    word.textContent = FIGHT_HIT_WORDS[fightHitWordIndex % FIGHT_HIT_WORDS.length];
    fightHitWordIndex += 1;

    const panelRect = panel.getBoundingClientRect();
    const fistRect = button.getBoundingClientRect();
    const wobble = ((fightHitWordIndex % 3) - 1) * 7;
    const x = Math.max(18, Math.min(panelRect.width - 22, fistRect.left - panelRect.left + fistRect.width * .72 + wobble));
    const y = Math.max(16, fistRect.top - panelRect.top + fistRect.height * .18);
    word.style.setProperty('--fight-hit-x', x + 'px');
    word.style.setProperty('--fight-hit-y', y + 'px');
    panel.appendChild(word);
    setTimeout(() => word.remove(), 760);
  }

  function makeFightId() {
    return 'fight_' + CLIENT_ID.replace(/[^a-z0-9]/gi, '').slice(0, 12) + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function emitFightEvent(type, data) {
    const ts = Date.now();
    pendingOwnFightTimestamps.add(ts);
    setTimeout(() => pendingOwnFightTimestamps.delete(ts), 30000);
    // Keep the event compatible with the ordinary chat-message write shape.
    // Some deployed rules require a sender name and text even for typed
    // system events; omitting them made a challenge silently fail there.
    return messagesRef.add(Object.assign({
      type: type,
      username: (session && session.username) || '',
      text: 'fight event',
      ts: ts,
      deviceId: CLIENT_ID
    }, data || {}));
  }

  function rememberFightTarget(username, seenAt) {
    if (!username || !session || username === session.username) return;
    const stamp = typeof seenAt === 'number' ? seenAt : Date.now();
    fightPresenceTargets.set(username, Math.max(fightPresenceTargets.get(username) || 0, stamp));
  }

  function activeFightTargets() {
    const now = Date.now();
    const cutoff = now - FIGHT_TARGET_ACTIVE_MS;
    fightPresenceTargets.forEach((seenAt, username) => {
      if (seenAt < cutoff) fightPresenceTargets.delete(username);
    });
    if (typeof messageCache !== 'undefined') {
      messageCache.forEach((message) => {
        if (!message || isFightEvent(message) || message.ts < cutoff) return;
        rememberFightTarget(message.username, message.ts);
      });
    }
    return Array.from(fightPresenceTargets.entries())
      .filter((entry) => entry[1] >= cutoff)
      .map((entry) => entry[0])
      .filter((username) => username && (!session || username !== session.username))
      .sort((a, b) => a.localeCompare(b));
  }

  function renderFightTargetList() {
    const list = $('fightTargetList');
    if (!list) return;
    if (isFightOnCooldown()) {
      list.innerHTML = '<div class="fight-target-empty">You can challenge again in ' +
        formatFightCooldown(fightCooldownRemaining()) + '.</div>';
      return;
    }
    const targets = activeFightTargets();
    if (!targets.length) {
      list.innerHTML = fightTargetFetchInFlight || !fightTargetFetchAt
        ? '<div class="fight-target-empty is-loading">Checking active chatters…</div>'
        : '<div class="fight-target-empty">No chatters online right now.</div>';
      return;
    }
    list.innerHTML = targets.map((username) =>
      '<button type="button" class="fight-target" data-fight-target="' + escapeHtml(username) + '">' + escapeHtml(username) + '</button>'
    ).join('');
    list.querySelectorAll('[data-fight-target]').forEach((button) => {
      button.addEventListener('click', function () {
        const target = this.getAttribute('data-fight-target');
        closeFightMenu();
        beginFightChallenge(target);
      });
    });
  }

  function queueFightTargetRetry() {
    clearTimeout(fightTargetRetryTimer);
    fightTargetRetryTimer = setTimeout(() => {
      const menu = $('fightMenu');
      if (!menu || !menu.classList.contains('is-open') || currentFight || isFightOnCooldown()) return;
      fetchActiveFightTargets({ force: true });
    }, FIGHT_TARGET_EMPTY_RETRY_MS);
  }

  function fetchActiveFightTargets(options) {
    const force = !!(options && options.force);
    if (fightTargetFetchInFlight || (!force && Date.now() - fightTargetFetchAt < FIGHT_TARGET_CACHE_MS)) return;
    fightTargetFetchInFlight = true;
    renderFightTargetList();
    db.collection('chat_presence')
      .where('lastSeen', '>', Date.now() - FIGHT_TARGET_ACTIVE_MS)
      .get()
      .then((snapshot) => {
        snapshot.forEach((doc) => {
          const data = doc.data() || {};
          const decodePresenceName = window.KNOBSOCK_PRESENCE_USERNAME_FROM_ID;
          const username = typeof data.username === 'string'
            ? data.username
            : (typeof decodePresenceName === 'function' ? decodePresenceName(doc.id) : '');
          if (username) rememberFightTarget(username, data.lastSeen);
        });
      })
      .catch(() => {
        // The cached chatters still make the menu useful if presence reads are
        // restricted by an older Firestore ruleset.
      })
      .finally(() => {
        fightTargetFetchInFlight = false;
        fightTargetFetchAt = Date.now();
        const menu = $('fightMenu');
        if (!menu || !menu.classList.contains('is-open')) return;
        renderFightTargetList();
        if (!activeFightTargets().length && fightTargetEmptyRetries < 1) {
          fightTargetEmptyRetries += 1;
          queueFightTargetRetry();
        }
      });
  }

  function closeFightMenu() {
    const menu = $('fightMenu');
    const button = $('fightBtn');
    clearTimeout(fightTargetRetryTimer);
    if (menu) menu.classList.remove('is-open');
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  function toggleFightMenu() {
    if (!isChatUnlocked()) return;
    if (currentFight) {
      refreshFightPanel();
      return;
    }
    if (isFightOnCooldown()) {
      refreshFightPanel();
      return;
    }
    const menu = $('fightMenu');
    const button = $('fightBtn');
    if (!menu || !button) return;
    const open = !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
    if (!open) return;
    fightTargetEmptyRetries = 0;
    renderFightTargetList();
    fetchActiveFightTargets();
  }

  function clearFightTimers() {
    clearInterval(fightTicker);
    clearTimeout(fightExpiryTimer);
    clearTimeout(fightResultTimer);
    fightTicker = null;
    fightExpiryTimer = null;
    fightResultTimer = null;
  }

  function clearCurrentFight(fightId) {
    if (fightId && (!currentFight || currentFight.id !== fightId)) return;
    clearFightTimers();
    currentFight = null;
    refreshFightPanel();
  }

  function scheduleFightExpiry(fight) {
    clearTimeout(fightExpiryTimer);
    if (!fight || fight.status !== 'pending') return;
    fightExpiryTimer = setTimeout(() => {
      if (!currentFight || currentFight.id !== fight.id || currentFight.status !== 'pending') return;
      clearCurrentFight(fight.id);
    }, Math.max(0, fight.expiresAt - Date.now()) + 20);
  }

  function adoptFightChallenge(message) {
    if (!message || !message.fightId || !message.challenger || !message.opponent) return;
    const expiresAt = typeof message.expiresAt === 'number' ? message.expiresAt : message.ts + FIGHT_CHALLENGE_MS;
    if (expiresAt <= Date.now()) return;
    if (currentFight && currentFight.id !== message.fightId) {
      const currentIsExpired = currentFight.status === 'pending' && currentFight.expiresAt <= Date.now();
      const incomingWinsTie = currentFight.status === 'pending' && (
        message.ts < currentFight.createdAt ||
        (message.ts === currentFight.createdAt && String(message.fightId) < String(currentFight.id))
      );
      if (!currentIsExpired && !incomingWinsTie) return;
      clearFightTimers();
    }
    currentFight = Object.assign(currentFight && currentFight.id === message.fightId ? currentFight : {}, {
      id: message.fightId,
      challenger: message.challenger,
      opponent: message.opponent,
      createdAt: message.ts,
      expiresAt: expiresAt,
      status: 'pending',
      scores: (currentFight && currentFight.id === message.fightId && currentFight.scores) || {},
      liveScores: (currentFight && currentFight.id === message.fightId && currentFight.liveScores) || {}
    });
    scheduleFightExpiry(currentFight);
    closeFightMenu();
    refreshFightPanel();
  }

  function beginFightChallenge(opponent) {
    if (!session || !isChatUnlocked() || !opponent || opponent === session.username || currentFight || isFightOnCooldown()) return;
    const now = Date.now();
    const challenge = {
      fightId: makeFightId(),
      challenger: session.username,
      opponent: opponent,
      expiresAt: now + FIGHT_CHALLENGE_MS,
      ts: now
    };
    adoptFightChallenge(challenge);
    emitFightEvent('fight_challenge', challenge).catch(() => clearCurrentFight(challenge.fightId));
  }

  function acceptFight() {
    const fight = currentFight;
    if (!fight || !session || fight.status !== 'pending' || session.username !== fight.opponent) return;
    const startsAt = Date.now() + FIGHT_START_DELAY_MS;
    const cooldownUntil = startsAt + FIGHT_COOLDOWN_MS;
    applyFightAcceptance(Object.assign({}, fight, {
      startsAt: startsAt,
      cooldownUntil: cooldownUntil
    }), false);
    emitFightEvent('fight_accept', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      startsAt: startsAt,
      cooldownUntil: cooldownUntil
    }).then(() => {
      setFightCooldown(cooldownUntil);
    }).catch(() => {
      if (currentFight && currentFight.id === fight.id) {
        currentFight.status = 'pending';
        scheduleFightExpiry(currentFight);
        refreshFightPanel();
      }
    });
  }

  function declineFight() {
    const fight = currentFight;
    if (!fight || !session || fight.status !== 'pending' || session.username !== fight.opponent) return;
    emitFightEvent('fight_decline', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent
    }).catch(() => {});
    clearCurrentFight(fight.id);
  }

  function applyFightAcceptance(message, persistCooldown) {
    if (!currentFight || currentFight.id !== message.fightId || !message.startsAt) return;
    if (message.startsAt + FIGHT_DURATION_MS + FIGHT_RESULT_HOLD_MS <= Date.now()) return;
    currentFight.status = 'countdown';
    currentFight.startsAt = message.startsAt;
    currentFight.endsAt = message.startsAt + FIGHT_DURATION_MS;
    currentFight.localClicks = 0;
    currentFight.scoreSubmitted = false;
    currentFight.scores = currentFight.scores || {};
    currentFight.liveScores = currentFight.liveScores || {};
    currentFight.lastLiveScore = undefined;
    currentFight.lastLiveScoreAt = 0;
    clearTimeout(fightExpiryTimer);
    const cooldownUntil = Number(message.cooldownUntil) || (message.startsAt + FIGHT_COOLDOWN_MS);
    if (persistCooldown !== false && isFightParticipant(currentFight)) {
      setFightCooldown(cooldownUntil);
    }
    startFightTicker();
    refreshFightPanel();
  }

  function startFightTicker() {
    clearInterval(fightTicker);
    fightTicker = setInterval(updateFightClock, 200);
    updateFightClock();
  }

  function publishFightLiveScore(fight, now) {
    if (!fight || !session || fight.status !== 'playing' || !isFightParticipant(fight) || fight.scoreSubmitted) return;
    const score = Math.max(0, Math.floor(fight.localClicks || 0));
    const previous = Number(fight.lastLiveScore);
    if (Number.isFinite(previous) && previous === score) return;
    if (fight.lastLiveScoreAt && now - fight.lastLiveScoreAt < FIGHT_LIVE_SCORE_INTERVAL_MS) return;

    // Update the fighter's own bar instantly. The coalesced event below is
    // what carries the same aggregate to the opponent and spectators.
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = score;
    fight.lastLiveScore = score;
    fight.lastLiveScoreAt = now;
    emitFightEvent('fight_live', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      player: session.username,
      score: score,
      startsAt: fight.startsAt,
      endsAt: fight.endsAt
    }).catch(() => {
      // A brief offline hiccup should retry at the next ticker pass rather
      // than permanently freezing the public tug state.
      if (currentFight && currentFight.id === fight.id && currentFight.lastLiveScore === score) {
        currentFight.lastLiveScore = undefined;
        currentFight.lastLiveScoreAt = 0;
      }
    });
  }

  function updateFightClock() {
    const fight = currentFight;
    if (!fight || (fight.status !== 'countdown' && fight.status !== 'playing')) return;
    const now = Date.now();
    if (fight.status === 'countdown' && now >= fight.startsAt) {
      fight.status = 'playing';
      refreshFightPanel();
    }
    if (fight.status === 'playing' && now >= fight.endsAt && isFightParticipant(fight) && !fight.scoreSubmitted && (!fight.nextScoreRetryAt || now >= fight.nextScoreRetryAt)) {
      submitFightScore();
    } else if (fight.status === 'playing' && now < fight.endsAt) {
      publishFightLiveScore(fight, now);
    }
    const clock = $('fightClock');
    if (!clock || !currentFight || currentFight.id !== fight.id) return;
    if (fight.status === 'countdown') {
      clock.textContent = 'STARTS IN ' + Math.max(1, Math.ceil((fight.startsAt - now) / 1000));
    } else {
      clock.textContent = Math.max(0, Math.ceil((fight.endsAt - now) / 1000)) + ' SECONDS';
    }
  }

  function clampFightTug(value) {
    return Math.max(5, Math.min(95, value));
  }

  function fightTugRedPercent(fight) {
    if (!fight) return 50;
    let redScore = Number(fight.scores && fight.scores[fight.challenger]);
    let blueScore = Number(fight.scores && fight.scores[fight.opponent]);
    if ((!Number.isFinite(redScore) || !Number.isFinite(blueScore)) && fight.result && !fight.result.draw) {
      const result = fight.result;
      const winnerScore = Number(result.winnerScore);
      const loserScore = Number(result.loserScore);
      if (Number.isFinite(winnerScore) && Number.isFinite(loserScore)) {
        redScore = result.winner === fight.challenger ? winnerScore : loserScore;
        blueScore = result.winner === fight.opponent ? winnerScore : loserScore;
      }
    }
    if (Number.isFinite(redScore) && Number.isFinite(blueScore)) {
      const total = redScore + blueScore;
      return total > 0 ? clampFightTug(Math.round((redScore / total) * 100)) : 50;
    }

    const liveScores = fight.liveScores || {};
    const liveRed = Number(liveScores[fight.challenger]);
    const liveBlue = Number(liveScores[fight.opponent]);
    if (Number.isFinite(liveRed) || Number.isFinite(liveBlue)) {
      const red = Number.isFinite(liveRed) ? liveRed : 0;
      const blue = Number.isFinite(liveBlue) ? liveBlue : 0;
      const total = red + blue;
      return total > 0 ? clampFightTug(Math.round((red / total) * 100)) : 50;
    }

    const role = fightRole(fight);
    const localPush = Math.min(40, Math.round((fight.localClicks || 0) * 2.5));
    if (role === 'challenger') return 50 + localPush;
    if (role === 'opponent') return 50 - localPush;
    return 50;
  }

  function updateFightTug() {
    const fight = currentFight;
    const tug = $('fightTug');
    if (!fight || !tug) return;
    const red = fightTugRedPercent(fight);
    tug.style.setProperty('--fight-red', red + '%');
    tug.setAttribute('aria-valuenow', String(red));
    const hint = $('fightTugHint');
    if (!hint) return;
    const role = fightRole(fight);
    if (fight.status === 'result') {
      hint.textContent = red === 50 ? 'Dead even at the center.' : (red > 50 ? 'Red held the line.' : 'Blue held the line.');
    } else if (role === 'spectator') {
      hint.textContent = Object.keys(fight.liveScores || {}).length
        ? 'Watching the live tug.'
        : 'Watching the tug — fighters are getting ready.';
    } else {
      const mineIsAhead = (role === 'challenger' && red > 50) || (role === 'opponent' && red < 50);
      hint.textContent = mineIsAhead ? 'You are past the middle — hold the line!' : 'Push your color past the yellow middle!';
    }
  }

  function fightTugMarkup(fight) {
    const red = fightTugRedPercent(fight);
    return '<div class="fight-tug" id="fightTug" role="progressbar" aria-label="Red versus blue tug of war" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + red + '" style="--fight-red:' + red + '%">' +
      '<div class="fight-tug-red"><span class="fight-tug-side-label">Red</span></div>' +
      '<div class="fight-tug-blue"><span class="fight-tug-side-label">Blue</span></div>' +
      '<div class="fight-tug-center" aria-hidden="true"></div>' +
      '</div><div class="fight-tug-hint" id="fightTugHint"></div>';
  }

  function punchFight() {
    const fight = currentFight;
    if (!fight || fight.status !== 'playing' || !isFightParticipant(fight) || fight.scoreSubmitted || Date.now() >= fight.endsAt) return;
    fight.localClicks = (fight.localClicks || 0) + 1;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = fight.localClicks;
    const clicks = $('fightClicks');
    if (clicks) clicks.textContent = fight.localClicks + ' knock outs';
    const button = $('fightSmashBtn');
    if (button) {
      clearTimeout(fightPunchAnimationTimer);
      button.classList.remove('is-punching');
      void button.offsetWidth;
      button.classList.add('is-punching');
      fightPunchAnimationTimer = setTimeout(() => button.classList.remove('is-punching'), 180);
      showFightHitWord(button);
    }
    updateFightTug();
    playFightPunchSound();
  }

  function submitFightScore() {
    const fight = currentFight;
    if (!fight || !isFightParticipant(fight) || fight.scoreSubmitted) return;
    fight.scoreSubmitted = true;
    fight.nextScoreRetryAt = 0;
    const score = Math.max(0, Math.floor(fight.localClicks || 0));
    fight.scores[session.username] = score;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = score;
    refreshFightPanel();
    emitFightEvent('fight_score', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      player: session.username,
      score: score
    }).then(() => resolveFightScores()).catch(() => {
      if (currentFight && currentFight.id === fight.id) {
        currentFight.scoreSubmitted = false;
        currentFight.nextScoreRetryAt = Date.now() + 5000;
        delete currentFight.scores[session.username];
        refreshFightPanel();
      }
    });
  }

  function claimFightPublication(fightId, kind) {
    const key = 'knobsock_fight_' + kind + '_' + fightId;
    try {
      if (localStorage.getItem(key)) return false;
      localStorage.setItem(key, String(Date.now()));
      return true;
    } catch (e) {
      return true;
    }
  }

  function releaseFightPublication(fightId, kind) {
    try { localStorage.removeItem('knobsock_fight_' + kind + '_' + fightId); } catch (e) {}
  }

  function fetchFightLeader() {
    return devicesRef.orderBy('fightWins', 'desc').limit(1).get().then((snapshot) => {
      const doc = snapshot.docs && snapshot.docs[0];
      if (!doc) return null;
      const data = doc.data() || {};
      return data.fightWins ? { username: data.username || '?', wins: data.fightWins } : null;
    }).catch(() => null);
  }

  async function publishFightResult(fight, winner, loser) {
    if (!claimFightPublication(fight.id, 'result')) return;
    const winnerScore = fight.scores[winner];
    const loserScore = fight.scores[loser];
    const winnerWins = Math.max(0, myFightWins || 0) + 1;
    try {
      await devicesRef.doc(CLIENT_ID).set({ fightWins: winnerWins }, { merge: true });
      myFightWins = winnerWins;
      const leader = await fetchFightLeader();
      await emitFightEvent('fight_result', {
        fightId: fight.id,
        challenger: fight.challenger,
        opponent: fight.opponent,
        winner: winner,
        loser: loser,
        winnerScore: winnerScore,
        loserScore: loserScore,
        winnerWins: winnerWins,
        leaderUsername: leader && leader.username,
        leaderWins: leader && leader.wins
      });
    } catch (e) {
      releaseFightPublication(fight.id, 'result');
      console.error('Fight result failed:', e);
    }
  }

  function publishFightDraw(fight) {
    if (!claimFightPublication(fight.id, 'draw')) return;
    emitFightEvent('fight_draw', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      score: fight.scores[fight.challenger]
    }).catch(() => releaseFightPublication(fight.id, 'draw'));
  }

  function resolveFightScores() {
    const fight = currentFight;
    if (!fight || !fight.scores || fight.scores[fight.challenger] == null || fight.scores[fight.opponent] == null) return;
    const challengerScore = fight.scores[fight.challenger];
    const opponentScore = fight.scores[fight.opponent];
    if (challengerScore === opponentScore) {
      if (session && session.username === fight.challenger) publishFightDraw(fight);
      return;
    }
    const winner = challengerScore > opponentScore ? fight.challenger : fight.opponent;
    const loser = winner === fight.challenger ? fight.opponent : fight.challenger;
    if (session && session.username === winner) publishFightResult(fight, winner, loser);
  }

  function applyFightScore(message) {
    if (!currentFight || currentFight.id !== message.fightId || !message.player) return;
    if (message.player !== currentFight.challenger && message.player !== currentFight.opponent) return;
    const score = Number(message.score);
    if (!Number.isFinite(score) || score < 0) return;
    currentFight.scores[message.player] = Math.floor(score);
    currentFight.liveScores = currentFight.liveScores || {};
    currentFight.liveScores[message.player] = Math.floor(score);
    resolveFightScores();
    refreshFightPanel();
  }

  function restoreFightFromLiveScore(message) {
    if (!message || !message.fightId || !message.challenger || !message.opponent) return null;
    const startsAt = Number(message.startsAt);
    const endsAt = Number(message.endsAt);
    const now = Date.now();
    if (!Number.isFinite(startsAt) || !Number.isFinite(endsAt) || endsAt <= startsAt || now > endsAt + FIGHT_RESULT_HOLD_MS) return null;

    if (currentFight && currentFight.id !== message.fightId) {
      const replaceablePendingFight = currentFight.status === 'pending' && currentFight.expiresAt <= now;
      if (!replaceablePendingFight) return null;
      clearFightTimers();
    }
    if (currentFight && currentFight.id === message.fightId && currentFight.status === 'result') return currentFight;

    let created = false;
    if (!currentFight || currentFight.id !== message.fightId) {
      currentFight = {
        id: message.fightId,
        challenger: message.challenger,
        opponent: message.opponent,
        createdAt: startsAt - FIGHT_START_DELAY_MS,
        startsAt: startsAt,
        endsAt: endsAt,
        status: now < startsAt ? 'countdown' : 'playing',
        localClicks: 0,
        scoreSubmitted: false,
        scores: {},
        liveScores: {}
      };
      created = true;
    } else {
      currentFight.challenger = message.challenger;
      currentFight.opponent = message.opponent;
      currentFight.startsAt = startsAt;
      currentFight.endsAt = endsAt;
      currentFight.liveScores = currentFight.liveScores || {};
      if (currentFight.status === 'pending') {
        currentFight.status = now < startsAt ? 'countdown' : 'playing';
        clearTimeout(fightExpiryTimer);
        fightExpiryTimer = null;
        created = true;
      }
    }
    if (created) {
      startFightTicker();
      refreshFightPanel();
    }
    return currentFight;
  }

  function applyFightLiveScore(message) {
    const fight = restoreFightFromLiveScore(message);
    if (!fight || !message.player) return;
    if (message.player !== fight.challenger && message.player !== fight.opponent) return;
    const score = Number(message.score);
    if (!Number.isFinite(score) || score < 0) return;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[message.player] = Math.floor(score);
    updateFightTug();
  }

  function applyFightResult(message) {
    if (!message || !message.fightId) return;
    if (!currentFight || currentFight.id !== message.fightId) {
      currentFight = {
        id: message.fightId,
        challenger: message.challenger,
        opponent: message.opponent,
        scores: {}
      };
    }
    currentFight.status = 'result';
    currentFight.result = message.type === 'fight_draw'
      ? { draw: true, score: message.score }
      : {
          winner: message.winner,
          loser: message.loser,
          winnerScore: message.winnerScore,
          loserScore: message.loserScore,
          winnerWins: message.winnerWins,
          leaderUsername: message.leaderUsername,
          leaderWins: message.leaderWins
        };
    clearInterval(fightTicker);
    clearTimeout(fightExpiryTimer);
    refreshFightPanel();
    clearTimeout(fightResultTimer);
    fightResultTimer = setTimeout(() => clearCurrentFight(message.fightId), FIGHT_RESULT_HOLD_MS);
  }

  function handleFightMessage(message) {
    if (!isFightEvent(message)) return;
    if (message.type === 'fight_challenge') adoptFightChallenge(message);
    if (message.type === 'fight_accept') applyFightAcceptance(message);
    if (message.type === 'fight_decline' && currentFight && currentFight.id === message.fightId) clearCurrentFight(message.fightId);
    if (message.type === 'fight_live') applyFightLiveScore(message);
    if (message.type === 'fight_score') applyFightScore(message);
    if (message.type === 'fight_result' || message.type === 'fight_draw') applyFightResult(message);
  }

  function refreshFightPanel() {
    const wrap = $('fightPanelWrap');
    const panel = $('fightPanel');
    const fightButton = $('fightBtn');
    const cooldownRemaining = fightCooldownRemaining();
    if (fightButton) {
      const chatLocked = !isChatUnlocked();
      fightButton.disabled = !!currentFight || cooldownRemaining > 0 || chatLocked;
      fightButton.classList.toggle('on-cooldown', !currentFight && cooldownRemaining > 0);
      fightButton.classList.toggle('is-locked', !currentFight && cooldownRemaining <= 0 && chatLocked);
      if (!currentFight && cooldownRemaining > 0) {
        fightButton.style.setProperty('--fight-frac', String(Math.max(0, cooldownRemaining / FIGHT_COOLDOWN_MS)));
        fightButton.title = 'Fight ready in ' + formatFightCooldown(cooldownRemaining);
        fightButton.setAttribute('aria-label', 'Fight ready in ' + formatFightCooldown(cooldownRemaining));
      } else if (!currentFight && chatLocked) {
        fightButton.style.removeProperty('--fight-frac');
        fightButton.title = 'Tap in to unlock fights';
        fightButton.setAttribute('aria-label', fightButton.title);
      } else {
        fightButton.style.removeProperty('--fight-frac');
        fightButton.title = currentFight ? 'A fight is already in progress' : 'Challenge someone to a fight';
        fightButton.setAttribute('aria-label', fightButton.title);
      }
      if (currentFight || cooldownRemaining > 0) fightButton.setAttribute('aria-expanded', 'false');
    }
    scheduleFightCooldownRefresh();
    if (!wrap || !panel) return;
    const fight = currentFight;
    if (!fight) {
      wrap.classList.remove('is-visible');
      panel.innerHTML = '';
      return;
    }
    wrap.classList.add('is-visible');
    const role = fightRole(fight);
    const challenger = escapeHtml(fight.challenger || '');
    const opponent = escapeHtml(fight.opponent || '');

    if (fight.status === 'pending') {
      const isChallenger = role === 'challenger';
      const isOpponent = role === 'opponent';
      panel.innerHTML = `
        <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">${isOpponent ? challenger + ' called you out' : 'Fight challenge'}</div>
        <div class="fight-panel-copy">${isChallenger ? 'Waiting for ' + opponent + ' to accept.' : isOpponent ? 'Do you want to fight ' + challenger + '?' : challenger + ' challenged ' + opponent + '.'}</div>
        ${isOpponent ? '<div class="fight-panel-actions"><button type="button" class="fight-action-btn" id="fightAcceptBtn">Accept</button><button type="button" class="fight-action-btn decline" id="fightDeclineBtn">Decline</button></div>' : '<div class="fight-spectator-note">This challenge expires in ' + Math.max(1, Math.ceil((fight.expiresAt - Date.now()) / 1000)) + ' seconds.</div>'}
      `;
      const accept = $('fightAcceptBtn');
      const decline = $('fightDeclineBtn');
      if (accept) accept.addEventListener('click', acceptFight);
      if (decline) decline.addEventListener('click', declineFight);
      return;
    }

    if (fight.status === 'result') {
      const result = fight.result || {};
      if (result.draw) {
        panel.innerHTML = `
          <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">It's a draw</div>
          <div class="fight-panel-copy">${challenger} and ${opponent} both finished with ${Number(result.score) || 0} knock outs.</div>
          ${fightTugMarkup(fight)}
        `;
      } else {
        const leader = result.leaderUsername && result.leaderWins
          ? '<div class="fight-result-score">High score: ' + escapeHtml(result.leaderUsername) + ' — ' + Number(result.leaderWins) + ' knock outs</div>'
          : '';
        panel.innerHTML = `
          <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">${escapeHtml(result.winner || '')} knocked out ${escapeHtml(result.loser || '')}</div>
          <div class="fight-panel-copy">${Number(result.winnerScore) || 0} knock outs to ${Number(result.loserScore) || 0}.</div>
          ${fightTugMarkup(fight)}
          ${leader}
        `;
      }
      updateFightTug();
      return;
    }

    const isPlaying = fight.status === 'playing';
    const isFighter = role !== 'spectator';
    const myScoreIsSubmitted = isFighter && !!fight.scoreSubmitted;
    const countdownLabel = isPlaying ? Math.max(0, Math.ceil((fight.endsAt - Date.now()) / 1000)) + ' SECONDS' : 'STARTS IN ' + Math.max(1, Math.ceil((fight.startsAt - Date.now()) / 1000));
    panel.innerHTML = `
      <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">Live fight</div>
      <div class="fight-arena">
        <div class="fight-fighter ${role === 'challenger' ? 'is-me' : ''}">${challenger}</div>
        <div class="fight-versus">VS</div>
        <div class="fight-fighter ${role === 'opponent' ? 'is-me' : ''}">${opponent}</div>
      </div>
      ${fightTugMarkup(fight)}
      <div class="fight-clock" id="fightClock">${countdownLabel}</div>
      ${isPlaying && isFighter && !myScoreIsSubmitted ? '<div class="fight-clicks" id="fightClicks">' + (fight.localClicks || 0) + ' knock outs</div><button type="button" class="fight-smash-btn" id="fightSmashBtn" title="Knock out!" aria-label="Knock out!"><img src="/fight-punch.png" alt=""></button>' : '<div class="fight-spectator-note">' + (myScoreIsSubmitted ? 'Your score is locked. Waiting for the other fighter.' : isFighter ? 'Get ready to tap fast when the bell rings.' : 'Watching the live tug.') + '</div>'}
    `;
    const smash = $('fightSmashBtn');
    if (smash) smash.addEventListener('click', punchFight);
    updateFightTug();
  }

  function refreshTapInButtonState() {
    const btn = $('tapinBtn');
    const label = $('tapinBtnLabel');
    if (!btn) return;
    clearTimeout(tapinCooldownTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    if (remaining > 0) {
      btn.disabled = true;
      btn.classList.add('on-cooldown');
      btn.style.setProperty('--tapin-frac', String(Math.max(0, remaining / CHAT_UNLOCK_MS)));
      if (label) label.innerHTML = TAPIN_ICON_HTML;

      tapinCooldownTimer = setTimeout(refreshTapInButtonState, Math.min(remaining, 30000));
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cooldown');
      btn.style.removeProperty('--tapin-frac');
      if (label) label.innerHTML = TAPIN_ICON_HTML;
    }
  }

  async function sendTapIn() {
    if (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt) > 0) return;
    lastTapInAt = Date.now();
    refreshTapInButtonState();
    refreshChatGateState();
    const ts = Date.now();
    pendingOwnTapinTimestamps.add(ts);

    const next = nextStreakAfterTapIn(ts);
    myStreak = next.streak;
    myStreakDay = next.day;
    showStreakBar(myStreak);

    try {
      await devicesRef.doc(CLIENT_ID).set({
        lastTapInAt: lastTapInAt,
        streak: myStreak,
        streakDay: myStreakDay
      }, { merge: true });
      await messagesRef.add({
        type: 'tapin',
        username: session.username,
        text: 'just tapped in',
        deviceId: CLIENT_ID,
        ts: ts
      });
    } catch (e) {
      console.error('Tap in failed:', e);
    } finally {

      setTimeout(() => pendingOwnTapinTimestamps.delete(ts), 30000);
    }
  }

  function triggerTapInEffect(username) {
    try {
      window.parent.postMessage({ type: 'knobsock-tapin', username: username }, '*');
    } catch (e) {}
  }

  const SPAM_MESSAGE_THRESHOLD = 10;
  const SPAM_WINDOW_MS = 60 * 1000;
  const SPAM_TIMEOUT_MS = 10 * 60 * 1000;
  const recentMessagesByDevice = {};
  const spamActionedDeviceIds = new Set();

  function checkSpam(m) {
    if (!m.deviceId || m.type === 'join' || m.type === 'tapin' || isFightEvent(m)) return;
    const arr = recentMessagesByDevice[m.deviceId] || (recentMessagesByDevice[m.deviceId] = []);
    arr.push(m.ts || Date.now());
    const cutoff = Date.now() - SPAM_WINDOW_MS;
    while (arr.length && arr[0] < cutoff) arr.shift();
    if (arr.length <= SPAM_MESSAGE_THRESHOLD || spamActionedDeviceIds.has(m.deviceId)) return;
    spamActionedDeviceIds.add(m.deviceId);
    bansRef.doc(m.deviceId).set({
      bannedAt: Date.now(),
      bannedBy: 'system (auto spam filter)',
      expiresAt: Date.now() + SPAM_TIMEOUT_MS,
      reason: 'Automatic timeout: sent ' + arr.length + ' messages in under a minute',
      enforced: true,
      usernames: firebase.firestore.FieldValue.arrayUnion(m.username)
    }, { merge: true }).catch((e) => console.error('Auto-timeout failed:', e));
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderMessageText(text) {
    return escapeHtml(censorText(String(text || ''))).replace(/:([a-z0-9_-]{1,32}):/gi, function (match, name) {
      const emoji = chatEmojiByName[String(name).toLowerCase()];
      if (!emoji) return match;
      return '<img class="chat-emoji" src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(match) + '" title="' + escapeHtml(match) + '" loading="lazy">';
    });
  }

  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {

    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  function buildUsernameCensorRegex(word) {
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp(pattern, 'i');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
  let USERNAME_CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildUsernameCensorRegex);

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
    USERNAME_CENSOR_REGEXES = words.map(buildUsernameCensorRegex);
  }, () => {});

  function usernameContainsCensoredWord(name) {
    return USERNAME_CENSOR_REGEXES.some(re => re.test(name));
  }

  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const previousClearedAt = clearedAt;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;

    if (clearedAt > previousClearedAt && typeof messageCache !== 'undefined') {
      messageCache = messageCache.filter((m) => m && m.ts > clearedAt);
      saveMessageCache();
    }

    if (session && subscribedClearedAt !== clearedAt) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  const COLOR_CACHE_KEY = 'chat_color_cache_v1';
  const COLOR_CACHE_TTL = 12 * 60 * 60 * 1000;

  const usernameColorCache = (function () {
    try {
      const raw = JSON.parse(localStorage.getItem(COLOR_CACHE_KEY) || '{}');
      if (raw && typeof raw.at === 'number' && Date.now() - raw.at < COLOR_CACHE_TTL && raw.colors) {
        return raw.colors;
      }
    } catch (e) {}
    return {};
  })();

  let colorCacheSaveTimer = null;
  function persistColorCache() {
    clearTimeout(colorCacheSaveTimer);
    colorCacheSaveTimer = setTimeout(() => {
      try {
        const colors = {};
        Object.keys(usernameColorCache).forEach((k) => {
          if (usernameColorCache[k] !== 'pending') colors[k] = usernameColorCache[k];
        });
        localStorage.setItem(COLOR_CACHE_KEY, JSON.stringify({ at: Date.now(), colors: colors }));
      } catch (e) {}
    }, 1000);
  }

  function rememberColor(username, color) {
    usernameColorCache[username.toLowerCase()] = color;
    persistColorCache();
  }

  function myCurrentColor() {
    if (!session) return null;
    const cached = usernameColorCache[session.username.toLowerCase()];
    return (cached && cached !== 'pending') ? cached : defaultColorFor(session.username);
  }

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        persistColorCache();
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username);
  }

  function renderAuth(errorMsg, prefillUsername, termsChecked) {
    app.innerHTML = `
      <div class="chat-screen auth-screen">
        <div class="auth">
          <div class="auth-inner">

            <label class="auth-terms"><input type="checkbox" id="authTerms"${termsChecked ? ' checked' : ''}> I agree to the <a href="/privacy">Privacy Policy &amp; User Agreement</a>.</label>
            <div class="auth-actions">
              <button class="pill-btn auth-submit-btn" id="authSubmit" title="Join Chat">Join Chat</button>
            </div>

          </div>
        </div>
      </div>

    $('authSubmit').addEventListener('click', handleAuthSubmit);
    $('chatHandle').addEventListener('keydown', (e) => {

  async function handleAuthSubmit() {
    const username = $('chatHandle').value.trim();
    const termsChecked = $('authTerms').checked;
    const btn = $('authSubmit');

    if (!username) {
      renderAuth('Enter a username.', username, termsChecked);
      return;
    }
    if (username.length > 24 || /\s/.test(username)) {
      renderAuth('Username must be 24 chars or fewer, no spaces.', username, termsChecked);
      return;
    }
    if (usernameContainsCensoredWord(username)) {
      renderAuth('That username isn\'t allowed. Please choose another.', username, termsChecked);
      return;
    }
    if (!termsChecked) {
      renderAuth('Please agree to the Privacy Policy & User Agreement first.', username, termsChecked);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const claim = await claimUsernameSlot(username);
      session = { username: claim.username };
      rememberUsername(claim.username);
      deviceLockedUsername = claim.username;

      if (claim.isNew) {
        logIpBestEffort(claim.username);
        sendJoinNotice(claim.username);
      }
      startChat();
    } catch (e) {
      console.error(e);
      if (e && e.message === 'USERNAME_TAKEN') {
        renderAuth('That username is already taken. Please choose another.', username, termsChecked);
      } else {
        renderAuth('Something went wrong. Please try again.', username, termsChecked);
      }
    }
  }

  const MAX_MSG_LEN = 400;
  const MSG_INPUT_HARD_CAP = 1000;

  function updateCharCounter() {
    const input = $('msgInput');
    const counter = $('charCounter');
    if (!input || !counter) return;
    const len = input.value.length;
    counter.textContent = len + '/' + MAX_MSG_LEN;
    counter.classList.toggle('is-over', len > MAX_MSG_LEN);
  }

  let limitMsgTimer = null;
  function flashLimitMsg() {
    const el = $('composerLimitMsg');
    if (!el) return;
    el.hidden = false;
    clearTimeout(limitMsgTimer);
    limitMsgTimer = setTimeout(() => { el.hidden = true; }, 4000);

              </div>

              <div class="emoji-picker-popover" id="emojiPickerPopover"></div>

            <button class="send-btn" id="sendBtn" title="Send" aria-label="Send"><img src="/send-button.png" alt=""></button>
          </div>
          <div class="composer-limit-msg" id="composerLimitMsg" hidden>Messages have to be ${MAX_MSG_LEN} characters or fewer — trim it down and hit send again.</div>
        </div>
      </div>
    `;

    $('colorPicker').addEventListener('input', (e) => {
      const color = e.target.value;
      const key = session.username.toLowerCase();
      rememberColor(key, color);
      usernamesRef.doc(key).set({ color: color }, { merge: true }).catch((err) => console.error(err));
      if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);
    });

    $('sendBtn').addEventListener('click', sendMessage);
    $('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    $('msgInput').addEventListener('input', updateCharCounter);
    $('emojiPickerToggle').addEventListener('click', function () {
      const popover = $('emojiPickerPopover');
      const isOpen = popover.classList.toggle('is-open');
      this.setAttribute('aria-expanded', String(isOpen));
    });
    updateCharCounter();
    renderEmojiPicker();

    /* Messages need to keep their native vertical drag-to-scroll behavior.
       A stationary tap on that same surface is treated as a player tap, so
       portrait controls can be revealed from anywhere over the video. */
    const messagesEl = $('messages');
    let messageTouchStart = null;
    let ignoreMessageClickUntil = 0;
    function isMessageInteractive(target) {
      return !!(target && target.closest('a, button, input, textarea, select, label'));
    }
    function toggleFromMessageTap(event) {
      if (isMessageInteractive(event.target)) return;
      if (typeof window.togglePortraitVideoControls === 'function') {
        window.togglePortraitVideoControls();
      }
    }
    messagesEl.addEventListener('touchstart', (event) => {
      if (isMessageInteractive(event.target)) { messageTouchStart = null; return; }
      const touch = event.touches && event.touches[0];
      messageTouchStart = touch ? { x: touch.clientX, y: touch.clientY, at: Date.now() } : null;
    }, { passive: true });
    messagesEl.addEventListener('touchend', (event) => {
      const touch = event.changedTouches && event.changedTouches[0];
      const started = messageTouchStart;
      messageTouchStart = null;
      if (!started || !touch || Date.now() - started.at > 450) return;
      if (Math.abs(touch.clientX - started.x) > 12 || Math.abs(touch.clientY - started.y) > 12) return;
      ignoreMessageClickUntil = Date.now() + 750;
      toggleFromMessageTap(event);
    }, { passive: true });
    messagesEl.addEventListener('click', (event) => {
      if (Date.now() < ignoreMessageClickUntil) return;
      toggleFromMessageTap(event);
    });

    $('tapinBtn').addEventListener('click', () => {
      if (typeof window.unmuteLivePlayer === 'function') window.unmuteLivePlayer();
      sendTapIn();

    const fightBtn = $('fightBtn');
    fightBtn.addEventListener('click', toggleFightMenu);
    const fightIcon = fightBtn.querySelector('img');

    app.addEventListener('click', (event) => {
      const menuWrap = event.target && event.target.closest('.fight-menu-wrap');
      if (!menuWrap) closeFightMenu();
      const emojiWrap = event.target && event.target.closest('.emoji-picker-wrap');
      if (!emojiWrap) {
        const popover = $('emojiPickerPopover');
        const toggle = $('emojiPickerToggle');

  let lastRenderedMsgs = null;

  function renderEmojiPicker() {
    const popover = $('emojiPickerPopover');
    if (!popover) return;
    if (!chatEmojis.length) {
      popover.innerHTML = '<div class="emoji-picker-empty">No custom emojis yet.</div>';
      return;
    }
    popover.innerHTML = chatEmojis.map(function (emoji) {
      const code = ':' + emoji.name + ':';
      return '<button type="button" class="emoji-choice" title="' + escapeHtml(code) + '" aria-label="' + escapeHtml(code) + '" data-emoji-code="' + escapeHtml(code) + '"><img src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(code) + '"></button>';
    }).join('');
    popover.querySelectorAll('.emoji-choice').forEach(function (button) {
      button.addEventListener('click', function () {
        const input = $('msgInput');
        if (!input || input.disabled) return;
        const code = button.getAttribute('data-emoji-code');
        const start = input.selectionStart || 0;
        const end = input.selectionEnd || 0;
        input.value = input.value.slice(0, start) + code + input.value.slice(end);
        const cursor = start + code.length;
        input.focus();
        input.setSelectionRange(cursor, cursor);
        updateCharCounter();
        popover.classList.remove('is-open');
        const toggle = $('emojiPickerToggle');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // Live chat is intentionally forward-only for viewers: a new tab begins
  // empty and receives messages from that moment on.  The transcript is kept
  // in sessionStorage only, so a reload of the same tab is seamless without
  // pulling history from Firestore, while a new visitor never sees old chat.
  const MESSAGE_CACHE_KEY = 'chat_message_session_v1';
  const MESSAGE_CACHE_LIMIT = 50;
  let messageCacheSaveTimer = null;
  let messageCache = [];
  let messageSessionStartedAt = 0;
  let messageSessionOwner = null;
  let messageStreamCursor = 0;

  function startMessageSession(username) {
    if (messageSessionOwner === username && messageSessionStartedAt) return;
    messageSessionOwner = username;
    messageSessionStartedAt = Date.now();
    messageCache = [];
    messageStreamCursor = 0;
    try {
      const saved = JSON.parse(sessionStorage.getItem(MESSAGE_CACHE_KEY) || 'null');
      if (saved && saved.owner === username && typeof saved.startedAt === 'number' && Array.isArray(saved.messages)) {
        messageSessionStartedAt = saved.startedAt;
        messageStreamCursor = Math.max(0, Number(saved.streamCursor) || 0);
        messageCache = saved.messages
          .filter((m) => m && typeof m.id === 'string' && typeof m.ts === 'number')
          .sort((a, b) => a.ts - b.ts)
          .slice(-MESSAGE_CACHE_LIMIT);
      }
    } catch (e) {}
  }

  function saveMessageCache() {
    clearTimeout(messageCacheSaveTimer);
    messageCacheSaveTimer = setTimeout(() => {
      try {
        sessionStorage.setItem(MESSAGE_CACHE_KEY, JSON.stringify({
          owner: messageSessionOwner,
          startedAt: messageSessionStartedAt,
          streamCursor: messageStreamCursor,
          messages: messageCache
        }));
      } catch (e) {}
    }, 250);
  }

  function mergeMessageCache(incoming) {
    const byId = new Map(messageCache.map((m) => [m.id, m]));
    incoming.forEach((m) => {
      byId.set(m.id, m);
      messageStreamCursor = Math.max(messageStreamCursor, Number(m && m.ts) || 0);
    });
    messageCache = Array.from(byId.values())
      // The one-per-second live packets are handled directly by the listener;
      // keeping them in the 50-message transcript cache would push actual
      // chat messages out during a full fight.
      .filter((m) => m && m.type !== 'fight_live' && typeof m.ts === 'number' && m.ts > clearedAt)
      .sort((a, b) => a.ts - b.ts)
      .slice(-MESSAGE_CACHE_LIMIT);
    saveMessageCache();
  }

  function messageCursor() {
    return messageCache.reduce(
      (latest, m) => Math.max(latest, m.ts || 0),
      Math.max(clearedAt || 0, messageSessionStartedAt || 0, messageStreamCursor || 0)
    );
  }

  function renderMessages(msgs) {
    const container = $('messages');
    if (!container) return;
    lastRenderedMsgs = msgs;
    const hasVisibleMessage = msgs.some((message) => message && (
      !isFightEvent(message) ||
      message.type === 'fight_challenge' ||
      message.type === 'fight_result' ||
      message.type === 'fight_draw'
    ));
    const screen = app.querySelector('.chat-screen');
    if (screen) screen.classList.toggle('is-chat-empty', !hasVisibleMessage);
    if (!msgs.length) {
      container.innerHTML = `<div class="empty-state">No messages yet. Say wassup</div>`;
      return;
    }

    container.innerHTML = msgs.map(m => {
      if (m.type === 'join') {
        return `<div class="system-msg">${escapeHtml(m.username)} has joined</div>`;
      }
      if (m.type === 'tapin') {
        return `<div class="system-msg">${escapeHtml(m.username)} just tapped in</div>`;
      }
      if (m.type === 'fight_challenge') {
        return `<div class="system-msg">${escapeHtml(m.challenger)} challenged ${escapeHtml(m.opponent)} to a fight.</div>`;
      }
      if (m.type === 'fight_result') {
        return `<div class="system-msg">${escapeHtml(m.winner)} knocked out ${escapeHtml(m.loser)}.</div>`;
      }
      if (m.type === 'fight_draw') {
        return `<div class="system-msg">${escapeHtml(m.challenger)} and ${escapeHtml(m.opponent)} fought to a draw.</div>`;
      }
      if (isFightEvent(m)) return '';
      const mine = m.username === session.username;

      const nameColor = m.color || colorForUsername(m.username, () => renderMessages(lastRenderedMsgs));
      const nameHtml = `<span class="msg-name" style="color:${nameColor}">${escapeHtml(m.username)}</span>`;
      return `
        <div class="msg ${mine ? 'mine' : ''}">
          <div class="msg-meta">${nameHtml} · ${timeLabel(m.ts)}</div>
          <div class="msg-bubble">${renderMessageText(m.text)}</div>
        </div>
      `;
    }).join('');

    void container.offsetHeight;

    container.scrollTop = container.scrollHeight;
    const fightMenu = $('fightMenu');
    if (fightMenu && fightMenu.classList.contains('is-open')) renderFightTargetList();
  }

  async function sendMessage() {
    if (!isChatUnlocked()) return;
    const input = $('msgInput');
    if (input.value.length > MAX_MSG_LEN) {
      flashLimitMsg();
      return;
    }
    const text = censorText(input.value.trim());
    if (!text) return;
    input.value = '';
    input.disabled = true;
    updateCharCounter();

    try {
      await sendMessageToFirestore({
        username: session.username,
        text: text
      });
    } catch (e) {
      console.error(e);
      input.value = text;
      updateCharCounter();
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  let clearedAt = 0;
  let subscribedClearedAt = null;

  function subscribeToMessages() {
    if (unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = null;
    if (document.visibilityState === 'hidden') return;
    subscribedClearedAt = clearedAt;

    let query = messagesRef.orderBy('ts', 'asc');
    const cursor = messageCursor();
    if (cursor) {
      // Include the cursor document and de-duplicate it locally.  `>=` avoids
      // losing two messages written in the same millisecond.
      query = query.where('ts', '>=', cursor);
    } else if (clearedAt) {
      query = query.where('ts', '>', clearedAt);
    }

    let sawServerSnapshot = false;

    const TAPIN_EFFECT_MAX_AGE_MS = 15000;
    const FIGHT_EVENT_MAX_AGE_MS = FIGHT_CHALLENGE_MS + FIGHT_START_DELAY_MS + FIGHT_DURATION_MS + FIGHT_RESULT_HOLD_MS;

    function handleAddedChange(change, stillSettling) {
      if (change.type !== 'added') return;
      const m = change.doc.data();
      const isFreshFight = isFightEvent(m) && Date.now() - m.ts < FIGHT_EVENT_MAX_AGE_MS;
      const isPendingOwnEvent = pendingOwnTapinTimestamps.has(m.ts) || pendingOwnFightTimestamps.has(m.ts);
      const isCompletedFight = m.type === 'fight_result' || m.type === 'fight_draw';
      // A result in the listener's baseline is historical state from a page
      // reload, not a new result worth popping back open. If it closes a
      // fight we restored from live packets, quietly clear that stale panel.
      if (stillSettling && isCompletedFight && !isPendingOwnEvent) {
        if (currentFight && currentFight.id === m.fightId) clearCurrentFight(m.fightId);
        return;
      }
      if (stillSettling && !isPendingOwnEvent && !isFreshFight) return;
      if (isFightEvent(m)) handleFightMessage(m);
      else rememberFightTarget(m.username, m.ts);
      checkSpam(m);
      if (m.type === 'tapin' && Date.now() - m.ts < TAPIN_EFFECT_MAX_AGE_MS) {
        triggerTapInEffect(m.username);
      }
    }

    // Bound even a long-hidden tab: the UI only retains one screenful, so a
    // reconnect must never turn every message since its last visit into a
    // fresh baseline read.
    query = query.limitToLast(MESSAGE_CACHE_LIMIT);

    // Paint cached history before the network listener settles.  On a return
    // visit this is the same transcript the user just had, not an empty chat.
    renderMessages(messageCache);

    unsubscribeMessages = query
      .onSnapshot(
        (snapshot) => {
          const incoming = snapshot.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()));
          mergeMessageCache(incoming);
          renderMessages(messageCache);

          const stillSettling = !sawServerSnapshot;
          if (!snapshot.metadata.fromCache) sawServerSnapshot = true;
          snapshot.docChanges().forEach((change) => handleAddedChange(change, stillSettling));
        },
        (err) => {
          console.error(err);
          const container = $('messages');
          if (container) {
            container.innerHTML = `<div class="empty-state">Couldn't load messages. Check your Firebase config and Firestore rules.</div>`;
          }
        }
      );
  }

  function startChat() {
    window.KNOBSOCK_CHAT_USERNAME = session.username;
    try { window.dispatchEvent(new Event('knobsock-chat-identity')); } catch (e) {}
    startMessageSession(session.username);
    renderChatShell();
    subscribeToMessages();
    $('msgInput').focus();
  }

  function isBanActive(ban) {
    if (!ban) return false;
    if (!ban.expiresAt) return true;
    return ban.expiresAt > Date.now();
  }

  function renderBanned(ban) {
    const until = ban.expiresAt ? new Date(ban.expiresAt).toLocaleString() : null;
    app.innerHTML = `
      <div class="chat-screen">
        <div class="auth">
          <div class="auth-inner">
            <div class="auth-msg" style="color:var(--error);font-size:clamp(12px,3.4cqw,16px);min-height:0;">
              You've been removed from this chat${until ? ' until ' + escapeHtml(until) : ''}.
              ${ban.reason ? '<br><br>Reason: ' + escapeHtml(ban.reason) : ''}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function enterAuthOrRestore() {
    await deviceLockPromise;

    if (currentlyBanned) return;

    if (deviceLockedUsername) {

      session = { username: deviceLockedUsername };
      rememberUsername(deviceLockedUsername);
      startChat();
      return;
    }

    const saved = getRememberedUsername();
    if (saved) {
      session = { username: saved };

      deviceLockedUsername = saved;
      devicesRef.doc(CLIENT_ID).set({
        username: saved,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));
      startChat();
      return;
    }

    renderAuth();
  }

  let currentlyBanned = false;
  let banExpiryTimer = null;

  function clearBanExpiryTimer() {
    if (banExpiryTimer) { clearTimeout(banExpiryTimer); banExpiryTimer = null; }
  }

  function scheduleBanExpiryRecheck(ban) {
    clearBanExpiryTimer();
    if (!ban || !ban.expiresAt) return;
    const msUntilExpiry = ban.expiresAt - Date.now();
    if (msUntilExpiry <= 0) return;
    banExpiryTimer = setTimeout(() => {

      bansRef.doc(CLIENT_ID).get().then(handleBanDoc).catch(() => {});
    }, msUntilExpiry + 250);
  }

  function handleBanDoc(doc) {
    const ban = doc.exists ? doc.data() : null;
    const active = isBanActive(ban);
    if (active) {
      currentlyBanned = true;
      session = null;
      window.KNOBSOCK_CHAT_USERNAME = '';
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
      renderBanned(ban);
      scheduleBanExpiryRecheck(ban);
      return;
    }
    clearBanExpiryTimer();

    if (ban && ban.expiresAt) {
      bansRef.doc(CLIENT_ID).delete().catch(() => {});
    }
    if (currentlyBanned) {

      currentlyBanned = false;
      enterAuthOrRestore();
    } else if (!session) {
      enterAuthOrRestore();
    }
  }

  bansRef.doc(CLIENT_ID).onSnapshot(handleBanDoc, () => {

    if (!session) enterAuthOrRestore();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (unsubscribeMessages) unsubscribeMessages();
      unsubscribeMessages = null;
      return;
    }
    if (session && !currentlyBanned) subscribeToMessages();
  });

})();
</script>

<script>
(function () {
  const activeEl = document.getElementById('activeViewersCount');
  if (!activeEl) return;

  const db = firebase.firestore();

  const HEARTBEAT_MS = 60000;
  const COUNT_REFRESH_MS = 30000;
  const ACTIVE_WINDOW_MS = 150000;

  const COUNT_URL = 'https://firestore.googleapis.com/v1/projects/chat-for-website-efee2/databases/(default)/documents:runAggregationQuery?key=AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM';

  const COUNT_TIMEOUT_MS = 15000;

  let presenceRef = null;
  let countInFlight = false;
  let serverSkewMs = 0;
  let presenceSelectionVersion = 0;

  function serverNow() {
    return Date.now() + serverSkewMs;
  }

  function presenceSeed() {
    if (window.KNOBSOCK_CLIENT_ID) return window.KNOBSOCK_CLIENT_ID;
    try {
      const stored = localStorage.getItem('chat_client_id');
      if (stored) return stored;
    } catch (e) {}
    return 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  }

  function isUsablePresenceUsername(username) {
    return typeof username === 'string' && username.length >= 1 && username.length <= 24 && !/\s/.test(username);
  }

  // A signed-in heartbeat can identify itself through its document id, so
  // the picker needs no second presence collection or extra polling write.
  // Base64url keeps every accepted handle safe as one Firestore path segment.
  function namedPresenceDocId(username) {
    if (!isUsablePresenceUsername(username)) return '';
    try {
      const bytes = new TextEncoder().encode(username);
      let binary = '';
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return 'u_' + btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    } catch (e) {
      return '';
    }
  }

  function usernameFromPresenceDocId(id) {
    if (typeof id !== 'string' || id.indexOf('u_') !== 0) return '';
    try {
      const encoded = id.slice(2).replace(/-/g, '+').replace(/_/g, '/');
      const padded = encoded + '='.repeat((4 - encoded.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const username = new TextDecoder().decode(bytes);
      return isUsablePresenceUsername(username) ? username : '';
    } catch (e) {
      return '';
    }
  }

  window.KNOBSOCK_PRESENCE_USERNAME_FROM_ID = usernameFromPresenceDocId;

  async function presenceDocId(seed, username) {
    const namedId = namedPresenceDocId(username);
    if (namedId) return namedId;
    try {
      const bytes = new TextEncoder().encode('knobsock-presence-v1' + seed);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).slice(0, 16)
        .map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      let h = 7;
      for (let k = 0; k < seed.length; k++) h = (h * 31 + seed.charCodeAt(k)) >>> 0;
      return 'p' + h.toString(36) + seed.length.toString(36);
    }
  }

  function writeHeartbeat() {
    if (!presenceRef || document.visibilityState === 'hidden') return;
    presenceRef.set({ lastSeen: serverNow() }).catch(() => {});
  }

  const presenceSeedValue = presenceSeed();

  function selectPresenceRef() {
    const selection = ++presenceSelectionVersion;
    const username = window.KNOBSOCK_CHAT_USERNAME;
    presenceDocId(presenceSeedValue, username).then((id) => {
      if (selection !== presenceSelectionVersion) return;
      const previousRef = presenceRef;
      if (previousRef && previousRef.id === id) {
        writeHeartbeat();
        return;
      }
      presenceRef = db.collection('chat_presence').doc(id);
      writeHeartbeat();
      // A visitor may first be counted anonymously while choosing a handle.
      // Retire that one row immediately after moving to the named row so the
      // viewer badge never double-counts them for the active window.
      if (previousRef && previousRef.id !== id && document.visibilityState !== 'hidden') {
        previousRef.set({ lastSeen: serverNow() - ACTIVE_WINDOW_MS - 1000 }).catch(() => {});
      }
    }).catch(() => {});
  }

  function readActiveCount() {
    if (countInFlight || document.visibilityState === 'hidden') return Promise.resolve();
    countInFlight = true;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), COUNT_TIMEOUT_MS);
    return fetch(COUNT_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        structuredAggregationQuery: {
          structuredQuery: {
            from: [{ collectionId: 'chat_presence' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'lastSeen' },
                op: 'GREATER_THAN',
                value: { integerValue: String(serverNow() - ACTIVE_WINDOW_MS) }
              }
            }
          },
          aggregations: [{ alias: 'viewers', count: {} }]
        }
      })
    })
      .then((res) => (res.ok ? res.json() : null))
      .then((rows) => {
        if (!Array.isArray(rows)) return;
        for (const row of rows) {
          if (!row || !row.result) continue;
          if (row.readTime) {
            const serverMs = Date.parse(row.readTime);
            if (serverMs) serverSkewMs = serverMs - Date.now();
          }
          const field = row.result.aggregateFields && row.result.aggregateFields.viewers;
          if (!field || field.integerValue == null) continue;
          activeEl.textContent = String(Math.max(1, parseInt(field.integerValue, 10) || 0));
          return;
        }
      })
      .catch(() => {})
      .finally(() => { clearTimeout(timer); countInFlight = false; });
  }

  {
    // Give a remembered chat session a moment to announce its handle. That
    // lets returning chatters start directly on their named row instead of
    // briefly creating an anonymous one first.
    window.addEventListener('knobsock-chat-identity', selectPresenceRef);
    setTimeout(() => {
      if (!presenceRef) selectPresenceRef();
    }, 1500);
    readActiveCount().then(writeHeartbeat, writeHeartbeat);
    setInterval(writeHeartbeat, HEARTBEAT_MS);
    setInterval(readActiveCount, COUNT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      readActiveCount().then(writeHeartbeat, writeHeartbeat);
    });
  }
})();
</script>
