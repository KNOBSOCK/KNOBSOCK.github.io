  }

  const SOUNDCLOUD_ERRORS = {
    notSoundCloud: 'That isn’t a SoundCloud link. Paste a link like soundcloud.com/artist/song.',
    short: 'Short share links (on.soundcloud.com/…) don’t work. Open the link in your browser and copy the full soundcloud.com/artist/song address instead.',
    playlist: 'That’s a playlist or album. Paste a link to a single song.',
    notTrack: 'That link doesn’t go to a song. Paste a link like soundcloud.com/artist/song.',
    missing: 'SoundCloud can’t find that song. It might be private or deleted.'
  };
  const SOUNDCLOUD_RESERVED_USERS = ['discover', 'search', 'stream', 'you', 'upload', 'charts', 'pages', 'settings', 'messages', 'notifications', 'people', 'tags', 'terms-of-use', 'mobile', 'imprint', 'jobs', 'popular', 'signin', 'logout', 'feed', 'player'];
  const SOUNDCLOUD_RESERVED_PAGES = ['likes', 'tracks', 'reposts', 'popular-tracks', 'followers', 'following', 'comments', 'spotlight', 'toptracks', 'playlists'];
  const SOUNDCLOUD_SLUG = /^[A-Za-z0-9_-]+$/;

  function checkSoundCloudUrl(raw) {
    let text = String(raw || '').trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) text = 'https://' + text;
    let url;
    try { url = new URL(text); } catch (e) { return { error: SOUNDCLOUD_ERRORS.notSoundCloud }; }
    if (url.protocol !== 'https:' && url.protocol !== 'http:') return { error: SOUNDCLOUD_ERRORS.notSoundCloud };
    const host = url.hostname.toLowerCase();
    if (host === 'on.soundcloud.com' || host === 'soundcloud.app.goo.gl') return { error: SOUNDCLOUD_ERRORS.short };
    if (host !== 'soundcloud.com' && host !== 'www.soundcloud.com' && host !== 'm.soundcloud.com') return { error: SOUNDCLOUD_ERRORS.notSoundCloud };
    const parts = url.pathname.split('/').filter(Boolean);
    const page = String(parts[1] || '').toLowerCase();
    if (page === 'sets' || page === 'albums') return { error: SOUNDCLOUD_ERRORS.playlist };
    if ((parts.length !== 2 && parts.length !== 3) ||
        !parts.slice(0, 2).every((part) => SOUNDCLOUD_SLUG.test(part)) ||
        (parts[2] && !/^s-[A-Za-z0-9]+$/.test(parts[2])) ||
        SOUNDCLOUD_RESERVED_USERS.includes(parts[0].toLowerCase()) ||
        SOUNDCLOUD_RESERVED_PAGES.includes(page)) {
      return { error: SOUNDCLOUD_ERRORS.notTrack };
    }
    return { url: 'https://soundcloud.com/' + parts.join('/'), secret: parts.length === 3 };
  }

  function normalizeSoundCloudUrl(raw) {
    return String(raw || '').trim() ? (checkSoundCloudUrl(raw).url || '') : '';
  }

  async function verifySoundCloudTrack(url) {
    let res;
    try { res = await fetch('https://soundcloud.com/oembed?format=json&url=' + encodeURIComponent(url)); } catch (e) { return ''; }
    if (res.status === 404 || res.status === 403) return SOUNDCLOUD_ERRORS.missing;
    if (!res.ok) return '';
    const data = await res.json().catch(() => null);
    if (!data || typeof data.html !== 'string') return '';
    if (/api\.soundcloud\.com(%2F|\/)playlists/i.test(data.html)) return SOUNDCLOUD_ERRORS.playlist;
    if (!/api\.soundcloud\.com(%2F|\/)tracks/i.test(data.html)) return SOUNDCLOUD_ERRORS.notTrack;
    return '';
  }

  function soundCloudEngineSrc(songUrl) {
    return 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(songUrl) + '&auto_play=false&show_artwork=false';
  }

  function profileSongHtml() {
    return '<div class="profile-song" id="profileSongPlayer">' +
      '<button class="profile-song-play" id="profileSongPlay" type="button" aria-label="Play" disabled>&#9654;&#xFE0E;</button>' +
      '<div class="profile-song-info">' +
        '<div class="profile-song-title-wrap" id="profileSongTitleWrap"><div class="profile-song-title" id="profileSongTitle"><span class="profile-song-copy">Loading…</span></div></div>' +
        '<div class="profile-song-progress" id="profileSongProgress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
          '<div class="profile-song-progress-bg"><div class="profile-song-fill" id="profileSongFill"></div></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  let profileSongPlayer = null;

  function stopProfileSong() {
    const player = profileSongPlayer;
    profileSongPlayer = null;
    if (!player) return;
    clearInterval(player.retry);
    clearTimeout(player.timeout);
    try { if (player.widget) player.widget.pause(); } catch (e) {}
  }

  function profileSoundCloudApi(doc) {
    const view = doc.defaultView;
    if (view.SC && view.SC.Widget) return Promise.resolve(view.SC);
    if (!view.knobsockSoundCloudApi) {
      view.knobsockSoundCloudApi = new Promise((resolve, reject) => {
        const script = doc.createElement('script');
        script.src = 'https://w.soundcloud.com/player/api.js';
        script.onload = () => (view.SC && view.SC.Widget ? resolve(view.SC) : reject(new Error('SoundCloud unavailable')));
        script.onerror = () => {
          view.knobsockSoundCloudApi = null;
          script.remove();
          reject(new Error('SoundCloud unavailable'));
        };
        doc.head.appendChild(script);
      });
    }
    return view.knobsockSoundCloudApi;
  }

  function pauseSiteMusic(doc) {
    const view = doc.defaultView;
    try {
      const session = view.navigator.mediaSession;
      if (session && session.playbackState === 'playing') {
        view.postMessage({ type: 'knobsock-front-widget-command', action: 'pause' }, location.origin);
      }
    } catch (e) {}
  }

  function mountProfileSong(songUrl) {
    stopProfileSong();
    const box = pq('profileSongPlayer');
    if (!box) return;
    const doc = box.ownerDocument;
    const view = doc.defaultView || window;
    const button = pq('profileSongPlay');
    const titleWrap = pq('profileSongTitleWrap');
    const title = pq('profileSongTitle');
    const progress = pq('profileSongProgress');
    const fill = pq('profileSongFill');
    const player = { widget: null, ready: false, wantsPlay: false, progressSeen: false, duration: 0, position: 0, startAt: 0, requestedAt: 0, retry: 0, timeout: 0, dragging: false };
    profileSongPlayer = player;
    const alive = () => profileSongPlayer === player && box.isConnected;

    const titleCopy = (text, artist) => {
      const copy = doc.createElement('span');
      copy.className = 'profile-song-copy';
      copy.textContent = text;
      if (artist) {
        const credit = doc.createElement('span');
        credit.className = 'profile-song-artist';
        credit.textContent = ' by ' + artist;
        copy.appendChild(credit);
      }
      return copy;
    };
    const setTitle = (text, artist) => {
      title.classList.remove('scrolling');
      title.style.animationDuration = '';
      title.textContent = '';
      title.appendChild(titleCopy(text, artist));
      view.requestAnimationFrame(() => {
        if (!alive() || title.scrollWidth <= titleWrap.clientWidth) return;
        title.appendChild(titleCopy(text, artist));
        title.style.animationDuration = ((title.scrollWidth / 2) / 45) + 's';
        title.classList.add('scrolling');
      });
    };
    const setIcon = (playing) => {
      button.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;&#xFE0E;';
      button.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    };
    const setFill = (fraction) => {
      const value = Math.min(1, Math.max(0, fraction || 0));
      fill.style.width = (value * 100) + '%';
      progress.setAttribute('aria-valuenow', String(Math.round(value * 100)));
    };
    const clearRetry = () => { clearInterval(player.retry); player.retry = 0; };
    const fail = (text) => {
      clearRetry();
      player.wantsPlay = false;
      button.disabled = true;
      setIcon(false);
      setTitle(text);
    };
    const firePlay = () => {
      try { player.widget.setVolume(100); player.widget.play(); } catch (e) {}
    };

    const frame = doc.createElement('iframe');
    frame.className = 'profile-song-engine';
    frame.title = 'SoundCloud audio engine';
    frame.allow = 'autoplay';
    frame.tabIndex = -1;
    frame.setAttribute('aria-hidden', 'true');
    frame.src = soundCloudEngineSrc(songUrl);
    box.appendChild(frame);
    player.timeout = setTimeout(() => { if (alive() && !player.ready) fail('Song unavailable'); }, 20000);

    profileSoundCloudApi(doc).then((SC) => {
      if (!alive()) return;
      const widget = SC.Widget(frame);
      const events = SC.Widget.Events;
      player.widget = widget;
      widget.bind(events.READY, () => {
        if (!alive()) return;
        clearTimeout(player.timeout);
        widget.getCurrentSound((sound) => {
          if (!alive()) return;
          if (!sound) { fail('Song unavailable'); return; }
          player.ready = true;
          player.duration = sound.duration || 0;
          button.disabled = false;
          setTitle(sound.title || 'Untitled', sound.user && sound.user.username);
        });
      });
      widget.bind(events.PLAY_PROGRESS, (data) => {
        if (!alive()) return;
        player.position = data.currentPosition || 0;
        if (!player.progressSeen && player.wantsPlay && player.position > player.startAt) {
          player.progressSeen = true;
          clearRetry();
        }
        if (!player.dragging) setFill(data.relativePosition);
      });
      widget.bind(events.PAUSE, () => {
        if (!alive() || (player.wantsPlay && !player.progressSeen)) return;
        player.wantsPlay = false;
        player.progressSeen = false;
        clearRetry();
        setIcon(false);
      });
      widget.bind(events.FINISH, () => {
        if (!alive()) return;
        player.wantsPlay = false;
        player.progressSeen = false;
        player.position = 0;
        clearRetry();
        setIcon(false);
        setFill(0);
      });
      widget.bind(events.ERROR, () => { if (alive()) fail('Song unavailable'); });
    }).catch(() => { if (alive()) fail('Song unavailable'); });

    button.addEventListener('click', () => {
      button.classList.remove('bounce-spin');
      void button.offsetWidth;
      button.classList.add('bounce-spin');
      if (!alive() || !player.ready) return;
      if (player.wantsPlay) {
        player.wantsPlay = false;
        player.progressSeen = false;
        clearRetry();
        try { player.widget.pause(); } catch (e) {}
        setIcon(false);
        return;
      }
      player.wantsPlay = true;
      player.progressSeen = false;
      player.startAt = player.position;
      player.requestedAt = Date.now();
      setIcon(true);
      pauseSiteMusic(doc);
      firePlay();
      clearRetry();
      player.retry = setInterval(() => {
        if (!alive() || !player.wantsPlay || player.progressSeen) { clearRetry(); return; }
        if (Date.now() - player.requestedAt > 9000) {
          clearRetry();
          player.wantsPlay = false;
          setIcon(false);
          return;
        }
        firePlay();
      }, 300);
    });
    button.addEventListener('animationend', (event) => {
      if (event.animationName !== 'kpSongSpin') return;
      button.style.transition = 'none';
      button.classList.remove('bounce-spin');
      void button.offsetWidth;
      button.style.transition = '';
    });

    const seekFraction = (clientX) => {
      const rect = progress.getBoundingClientRect();
      return rect.width ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
    };
    const commitSeek = (fraction) => {
      const target = fraction * player.duration;
      player.position = target;
      player.startAt = Math.min(player.startAt, target);
      try { player.widget.seekTo(target); } catch (e) {}
    };
    progress.addEventListener('pointerdown', (event) => {
      if (!player.ready || !player.duration) return;
      event.preventDefault();
      player.dragging = true;
      try { progress.setPointerCapture(event.pointerId); } catch (e) {}
      setFill(seekFraction(event.clientX));
    });
    progress.addEventListener('pointermove', (event) => {
      if (player.dragging) setFill(seekFraction(event.clientX));
    });
    progress.addEventListener('pointerup', (event) => {
      if (!player.dragging) return;
      player.dragging = false;
      const fraction = seekFraction(event.clientX);
      setFill(fraction);
      commitSeek(fraction);
    });
    progress.addEventListener('pointercancel', () => { player.dragging = false; });
  }

  function lastOnlineLabel(data, username) {
    if (session && String(username).toLowerCase() === session.username.toLowerCase()) return 'Online now';
    const ts = Math.max(Number(data && data.lastSeenAt) || 0, Number(data && data.lastTapInAt) || 0);
    if (!ts) return 'A while ago';
    const diff = Date.now() - ts;
    if (diff < 5 * 60 * 1000) return 'Online now';
    if (diff < 60 * 60 * 1000) return Math.round(diff / 60000) + ' min ago';
    if (diff < 24 * 60 * 60 * 1000) {
      const hours = Math.round(diff / 3600000);
      return hours + (hours === 1 ? ' hour ago' : ' hours ago');
    }
    if (diff < 7 * 24 * 60 * 60 * 1000) {
      const days = Math.round(diff / 86400000);
      return days + (days === 1 ? ' day ago' : ' days ago');
    }
    return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function profileStats(data) {
    const now = Date.now();
    const fresh = data && (data.streakDay === utcDayKey(now) || data.streakDay === utcDayKey(now - 24 * 60 * 60 * 1000));
    return {
      streak: fresh ? Math.max(0, Number(data.streak) || 0) : 0,
      wins: Math.max(0, Number(data && data.fightWins) || 0),
      losses: Math.max(0, Number(data && data.fightLosses) || 0)
    };
  }

  function streakLabel(streak) {
    return streak === 1 ? '1 day' : streak + ' days';
  }

  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const size = 192;
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(url);
        let quality = 0.82;
        let out = canvas.toDataURL('image/jpeg', quality);
        while (out.length > 40000 && quality > 0.4) {
          quality -= 0.1;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(out);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('That image could not be opened.'));
      };
      img.src = url;
    });
  }

    wireProfileClose();

    pq('profileCardColor').addEventListener('input', recolor);

    pq('profilePhotoInput').addEventListener('change', async function () {

    pq('profileSave').addEventListener('click', async function () {

      }
      const next = {
        photo: draftPhoto,
        favoriteColor: pq('profileFavColor').value.trim().slice(0, 30),
        song: song,

        instagram: socialValues.instagram,
        youtube: socialValues.youtube,
        tiktok: socialValues.tiktok,

        borderColor: safeHex(pq('profileBorderColor').value, PROFILE_DEFAULT_BORDER),

      };

      button.disabled = true;
      button.textContent = 'Saving…';

      if (song && !songCheck.secret && song !== normalizeSoundCloudUrl(profile.song)) {

      const key = session.username.toLowerCase();
      try {

        });
        const saved = Object.assign({}, data || {}, { profile: (result && result.profile) || next });
        if (nextChatColor.toLowerCase() !== chatColor.toLowerCase()) {
          saved.color = nextChatColor;
          rememberColor(key, nextChatColor);
          usernamesRef.doc(key).set({ color: nextChatColor }, { merge: true }).catch((err) => console.error(err));
          if (lastRenderedMsgs) renderMessages(lastRenderedMsgs);

      } catch (error) {

          ? 'Your email sign-in expired. Sign in with email again to save.'

  function openProfile(username) {

    const panel = pq('profilePanel');
    if (!panel) return;
    closeAccountMenu();
    closeFightMenu();
    stopProfileSong();

    profileEditing = false;

    if (hit) renderProfileView(username, hit.data);
    else {
      panel.innerHTML = profileChrome({}, '<div class="profile-empty">Loading profile…</div>');
      wireProfileClose();
    }
    fetchProfileDoc(username).then((data) => {
      if (profileViewing !== username || profileEditing || !pq('knobsockProfile')) return;
      renderProfileView(username, data);
    }).catch(() => {
      if (profileViewing !== username || profileEditing) return;
      panel.innerHTML = profileChrome({}, '<div class="profile-empty">Could not load this profile.</div>');
      wireProfileClose();

  function profileNameFrom(event) {
    const el = event.target && event.target.closest && event.target.closest('.msg-name[data-username]');
    return el ? el.getAttribute('data-username') : null;

  app.addEventListener('click', (event) => {

    if (name) openProfile(name);
  });
  app.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const name = profileNameFrom(event);
    if (!name) return;
    event.preventDefault();
    openProfile(name);
  });

  function releaseProfile(doc) {
    stopProfileSong();
    profileViewing = null;
    profileEditing = false;
    doc.removeEventListener('keydown', profileKeydown);
    document.removeEventListener('keydown', profileKeydown);
  }

  function closeProfile() {
    const doc = profileDoc();
    const root = doc.getElementById('knobsockProfile');
    releaseProfile(doc);
    if (!root || root.classList.contains('is-closing')) return;
    const view = doc.defaultView || window;
    if (view.matchMedia && view.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      removeProfileRoot(doc, root);
      return;
    }
    root.classList.add('is-closing');
    setTimeout(() => removeProfileRoot(doc, root), PROFILE_CLOSE_MS);
  }
  function dropProfileNow() {
    const doc = profileDoc();
    const root = doc.getElementById('knobsockProfile');
    releaseProfile(doc);
    if (root) removeProfileRoot(doc, root);
  }
  window.addEventListener('pagehide', dropProfileNow);

  function toggleFightMenu() {
    if (!isChatUnlocked()) return;
    if (currentFight) {
      refreshFightPanel();
      return;
    }
    if (isFightOnCooldown()) {
      refreshFightPanel();
      return;
    }
    const menu = $('fightMenu');
    const button = $('fightBtn');
    if (!menu || !button) return;
    const open = !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
    if (!open) return;
    closeViewerMenu();
    fightPage = 0;
    fightTargetEmptyRetries = 0;
    renderFightTargetList();
    fetchActiveFightTargets();
  }

  function clearFightTimers() {
    clearInterval(fightTicker);
    clearTimeout(fightExpiryTimer);
    clearTimeout(fightResultTimer);
    clearTimeout(fightOutcomeFallbackTimer);
    fightTicker = null;
    fightExpiryTimer = null;
    fightResultTimer = null;
    fightOutcomeFallbackTimer = null;
  }

  function clearCurrentFight(fightId) {
    if (fightId && (!currentFight || currentFight.id !== fightId)) return;
    clearFightTimers();
    currentFight = null;
    refreshFightPanel();
  }

  function scheduleFightExpiry(fight) {
    clearTimeout(fightExpiryTimer);
    if (!fight || fight.status !== 'pending') return;
    fightExpiryTimer = setTimeout(() => {
      if (!currentFight || currentFight.id !== fight.id || currentFight.status !== 'pending') return;
      clearCurrentFight(fight.id);
    }, Math.max(0, fight.expiresAt - Date.now()) + 20);
  }

  function adoptFightChallenge(message) {
    if (!message || !message.fightId || !message.challenger || !message.opponent) return;
    const expiresAt = typeof message.expiresAt === 'number' ? message.expiresAt : message.ts + FIGHT_CHALLENGE_MS;
    if (expiresAt <= Date.now()) return;
    if (currentFight && currentFight.id !== message.fightId) {
      const currentIsExpired = currentFight.status === 'pending' && currentFight.expiresAt <= Date.now();
      const incomingWinsTie = currentFight.status === 'pending' && (
        message.ts < currentFight.createdAt ||
        (message.ts === currentFight.createdAt && String(message.fightId) < String(currentFight.id))
      );
      if (!currentIsExpired && !incomingWinsTie) return;
      clearFightTimers();
    }
    currentFight = Object.assign(currentFight && currentFight.id === message.fightId ? currentFight : {}, {
      id: message.fightId,
      challenger: message.challenger,
      opponent: message.opponent,
      createdAt: message.ts,
      expiresAt: expiresAt,
      status: 'pending',
      scores: (currentFight && currentFight.id === message.fightId && currentFight.scores) || {},
      liveScores: (currentFight && currentFight.id === message.fightId && currentFight.liveScores) || {}
    });
    scheduleFightExpiry(currentFight);
    closeFightMenu();
    refreshFightPanel();
  }

  function beginFightChallenge(opponent) {
    if (!session || !isChatUnlocked() || !opponent || opponent === session.username || currentFight || isFightOnCooldown()) return;
    if (fightRejectCooldownRemaining(opponent)) {
      renderFightTargetList();
      return;
    }
    const now = Date.now();
    const challenge = {
      fightId: makeFightId(),
      challenger: session.username,
      opponent: opponent,
      expiresAt: now + FIGHT_CHALLENGE_MS,
      ts: now
    };
    adoptFightChallenge(challenge);
    emitFightEvent('fight_challenge', challenge).catch(() => clearCurrentFight(challenge.fightId));
  }

  function acceptFight() {
    const fight = currentFight;
    if (!fight || !session || fight.status !== 'pending' || session.username !== fight.opponent) return;
    const startsAt = Date.now() + FIGHT_START_DELAY_MS;
    const cooldownUntil = startsAt + FIGHT_COOLDOWN_MS;
    applyFightAcceptance(Object.assign({}, fight, {
      startsAt: startsAt,
      cooldownUntil: cooldownUntil
    }), false);
    emitFightEvent('fight_accept', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      startsAt: startsAt,
      cooldownUntil: cooldownUntil
    }).then(() => {
      setFightCooldown(cooldownUntil);
    }).catch(() => {
      if (currentFight && currentFight.id === fight.id) {
        currentFight.status = 'pending';
        scheduleFightExpiry(currentFight);
        refreshFightPanel();
      }
    });
  }

  function declineFight() {
    const fight = currentFight;
    if (!fight || !session || fight.status !== 'pending' || session.username !== fight.opponent) return;
    const rejectCooldownUntil = Date.now() + FIGHT_REJECT_COOLDOWN_MS;
    emitFightEvent('fight_decline', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      rejectCooldownUntil: rejectCooldownUntil
    }).catch(() => {});
    clearCurrentFight(fight.id);
  }

  function applyFightAcceptance(message, persistCooldown) {
    if (!currentFight || currentFight.id !== message.fightId || !message.startsAt) return;
    if (message.startsAt + FIGHT_DURATION_MS + FIGHT_RESULT_HOLD_MS <= Date.now()) return;
    currentFight.status = 'countdown';
    currentFight.startsAt = message.startsAt;
    currentFight.endsAt = message.startsAt + FIGHT_DURATION_MS;
    currentFight.localClicks = 0;
    currentFight.scoreSubmitted = false;
    currentFight.scores = currentFight.scores || {};
    currentFight.liveScores = currentFight.liveScores || {};
    currentFight.lastLiveScore = undefined;
    currentFight.lastLiveScoreAt = 0;
    clearTimeout(fightExpiryTimer);
    const cooldownUntil = Number(message.cooldownUntil) || (message.startsAt + FIGHT_COOLDOWN_MS);
    if (persistCooldown !== false && isFightParticipant(currentFight)) {
      setFightCooldown(cooldownUntil);
    }
    startFightTicker();
    refreshFightPanel();
  }

  function startFightTicker() {
    clearInterval(fightTicker);
    fightTicker = setInterval(updateFightClock, 200);
    updateFightClock();
  }

  function ensureFightTicker(fight) {
    if (!fight || (fight.status !== 'countdown' && fight.status !== 'playing') || fightTicker !== null) return;
    startFightTicker();
  }

  function publishFightLiveScore(fight, now) {
    if (!fight || !session || fight.status !== 'playing' || !isFightParticipant(fight) || fight.scoreSubmitted) return;
    const score = Math.max(0, Math.floor(fight.localClicks || 0));
    const previous = Number(fight.lastLiveScore);
    if (Number.isFinite(previous) && previous === score) return;
    if (fight.lastLiveScoreAt && now - fight.lastLiveScoreAt < FIGHT_LIVE_SCORE_INTERVAL_MS) return;

    // Update the fighter's own bar instantly. The coalesced event below is
    // what carries the same aggregate to the opponent and spectators.
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = score;
    fight.lastLiveScore = score;
    fight.lastLiveScoreAt = now;
    emitFightEvent('fight_live', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      player: session.username,
      score: score,
      startsAt: fight.startsAt,
      endsAt: fight.endsAt
    }).catch(() => {
      // A brief offline hiccup should retry at the next ticker pass rather
      // than permanently freezing the public tug state.
      if (currentFight && currentFight.id === fight.id && currentFight.lastLiveScore === score) {
        currentFight.lastLiveScore = undefined;
        currentFight.lastLiveScoreAt = 0;
      }
    });
  }

  function updateFightClock() {
    const fight = currentFight;
    if (!fight || (fight.status !== 'countdown' && fight.status !== 'playing')) return;
    const now = Date.now();
    if (fight.status === 'countdown' && now >= fight.startsAt) {
      fight.status = 'playing';
      refreshFightPanel();
    }
    if (fight.status === 'playing' && now >= fight.endsAt + FIGHT_STALE_CLEAR_MS) {
      clearCurrentFight(fight.id);
      return;
    }
    if (fight.status === 'playing' && now >= fight.endsAt + FIGHT_MISSING_SCORE_GRACE_MS) {
      fillMissingFightScore(fight);
    }
    if (fight.status === 'playing' && now >= fight.endsAt && isFightParticipant(fight) && !fight.scoreSubmitted && (!fight.nextScoreRetryAt || now >= fight.nextScoreRetryAt)) {
      submitFightScore();
    } else if (fight.status === 'playing' && now < fight.endsAt) {
      publishFightLiveScore(fight, now);
    }
    const clock = $('fightClock');
    if (!clock || !currentFight || currentFight.id !== fight.id) return;
    if (fight.status === 'countdown') {
      clock.textContent = 'STARTS IN ' + Math.max(1, Math.ceil((fight.startsAt - now) / 1000));
    } else {
      clock.textContent = Math.max(0, Math.ceil((fight.endsAt - now) / 1000)) + ' SECONDS';
    }
  }

  function clampFightTug(value) {
    return Math.max(5, Math.min(95, value));
  }

  function fightTugRedPercent(fight) {
    if (!fight) return 50;
    let redScore = Number(fight.scores && fight.scores[fight.challenger]);
    let yellowScore = Number(fight.scores && fight.scores[fight.opponent]);
    if ((!Number.isFinite(redScore) || !Number.isFinite(yellowScore)) && fight.result && !fight.result.draw) {
      const result = fight.result;
      const winnerScore = Number(result.winnerScore);
      const loserScore = Number(result.loserScore);
      if (Number.isFinite(winnerScore) && Number.isFinite(loserScore)) {
        redScore = result.winner === fight.challenger ? winnerScore : loserScore;
        yellowScore = result.winner === fight.opponent ? winnerScore : loserScore;
      }
    }
    if (Number.isFinite(redScore) && Number.isFinite(yellowScore)) {
      const total = redScore + yellowScore;
      return total > 0 ? clampFightTug(Math.round((redScore / total) * 100)) : 50;
    }

    const liveScores = fight.liveScores || {};
    const liveRed = Number(liveScores[fight.challenger]);
    const liveYellow = Number(liveScores[fight.opponent]);
    if (Number.isFinite(liveRed) || Number.isFinite(liveYellow)) {
      const red = Number.isFinite(liveRed) ? liveRed : 0;
      const yellow = Number.isFinite(liveYellow) ? liveYellow : 0;
      const total = red + yellow;
      return total > 0 ? clampFightTug(Math.round((red / total) * 100)) : 50;
    }

    const role = fightRole(fight);
    const localPush = Math.min(40, Math.round((fight.localClicks || 0) * 2.5));
    if (role === 'challenger') return 50 + localPush;
    if (role === 'opponent') return 50 - localPush;
    return 50;
  }

  function updateFightTug() {
    const fight = currentFight;
    const tug = $('fightTug');
    if (!fight || !tug) return;
    const red = fightTugRedPercent(fight);
    tug.style.setProperty('--fight-red', red + '%');
    tug.setAttribute('aria-valuenow', String(red));
  }

  function fightTugMarkup(fight) {
    const red = fightTugRedPercent(fight);
    const redName = escapeHtml(fight && fight.challenger || '');
    const yellowName = escapeHtml(fight && fight.opponent || '');
    return '<div class="fight-tug" id="fightTug" role="progressbar" aria-label="' + redName + ' versus ' + yellowName + ' tug of war" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + red + '" style="--fight-red:' + red + '%">' +
      '<div class="fight-tug-red"><span class="fight-tug-side-label">' + redName + '</span></div>' +
      '<div class="fight-tug-yellow"><span class="fight-tug-side-label">' + yellowName + '</span></div>' +
      '<div class="fight-tug-center" aria-hidden="true"></div>' +
      '</div>';
  }

  function punchFight() {
    const fight = currentFight;
    if (!fight || fight.status !== 'playing' || !isFightParticipant(fight) || fight.scoreSubmitted || Date.now() >= fight.endsAt) return;
    fight.localClicks = (fight.localClicks || 0) + 1;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = fight.localClicks;
    const button = $('fightSmashBtn');
    if (button) {
      clearTimeout(fightPunchAnimationTimer);
      button.classList.remove('is-punching');
      void button.offsetWidth;
      button.classList.add('is-punching');
      fightPunchAnimationTimer = setTimeout(() => button.classList.remove('is-punching'), 180);
      showFightHitWord(button);
    }
    updateFightTug();
    playFightPunchSound();
  }

  function submitFightScore() {
    const fight = currentFight;
    if (!fight || !isFightParticipant(fight) || fight.scoreSubmitted) return;
    fight.scoreSubmitted = true;
    fight.nextScoreRetryAt = 0;
    const score = Math.max(0, Math.floor(fight.localClicks || 0));
    fight.scores[session.username] = score;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[session.username] = score;
    refreshFightPanel();
    emitFightEvent('fight_score', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      player: session.username,
      score: score
    }).then(() => resolveFightScores()).catch(() => {
      if (currentFight && currentFight.id === fight.id) {
        currentFight.scoreSubmitted = false;
        currentFight.nextScoreRetryAt = Date.now() + 5000;
        delete currentFight.scores[session.username];
        refreshFightPanel();
      }
    });
  }

  function claimFightPublication(fightId, kind) {
    const key = 'knobsock_fight_' + kind + '_' + fightId;
    try {
      if (localStorage.getItem(key)) return false;
      localStorage.setItem(key, String(Date.now()));
      return true;
    } catch (e) {
      return true;
    }
  }

  function releaseFightPublication(fightId, kind) {
    try { localStorage.removeItem('knobsock_fight_' + kind + '_' + fightId); } catch (e) {}
  }

  function fetchFightLeader() {
    return devicesRef.orderBy('fightWins', 'desc').limit(1).get().then((snapshot) => {
      const doc = snapshot.docs && snapshot.docs[0];
      if (!doc) return null;
      const data = doc.data() || {};
      return data.fightWins ? { username: data.username || '?', wins: data.fightWins } : null;
    }).catch(() => null);
  }

  function waitForFightPromise(promise, timeoutMs) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (outcome) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(outcome);
      };
      const timer = setTimeout(() => finish({ timedOut: true }), timeoutMs);
      Promise.resolve(promise).then(
        (value) => finish({ value: value, timedOut: false }),
        (error) => finish({ error: error, timedOut: false })
      );
    });
  }

  function fightStillNeedsResult(fightId) {
    return !!(currentFight && currentFight.id === fightId && currentFight.status !== 'result');
  }

  async function publishFightResult(fight, winner, loser, options) {
    if (!claimFightPublication(fight.id, 'result')) return;
    const isFailover = !!(options && options.failover);
    const winnerScore = fight.scores[winner];
    const loserScore = fight.scores[loser];
    // Only the winning player updates their own all-time total.  A delayed
    // loser-side failover below deliberately skips this write: it can safely
    // announce the already-known match result, but must never alter another
    // account's score.
    const winnerWins = isFailover ? null : Math.max(0, myFightWins || 0) + 1;
    if (!isFailover) {
      const saveHighScore = devicesRef.doc(CLIENT_ID).set({ fightWins: winnerWins }, { merge: true });
      if (session) {
        usernamesRef.doc(session.username.toLowerCase()).set({ fightWins: winnerWins }, { merge: true })
          .catch((e) => console.error('Could not save knockouts to account:', e));
      }
      saveHighScore.then(() => {
        myFightWins = winnerWins;
      }).catch((e) => {
        // A device-score write must not prevent the actual match result from
        // reaching the chat. The next fight can retry the score update.
        console.error('Could not save fight high score:', e);
      });
      await waitForFightPromise(saveHighScore, FIGHT_RESULT_SCORE_SAVE_GRACE_MS);
    }

    // Another client may have published the result while this browser was
    // waiting on its device write. Do not create a second announcement.
    if (!fightStillNeedsResult(fight.id)) return;

    const leaderOutcome = await waitForFightPromise(fetchFightLeader(), FIGHT_RESULT_LEADER_GRACE_MS);
    const leader = leaderOutcome.value || null;
    if (!fightStillNeedsResult(fight.id)) return;
    const displayLeader = leader || (winnerWins ? { username: winner, wins: winnerWins } : null);
    try {
      await emitFightEvent('fight_result', {
        fightId: fight.id,
        challenger: fight.challenger,
        opponent: fight.opponent,
        winner: winner,
        loser: loser,
        winnerScore: winnerScore,
        loserScore: loserScore,
        winnerWins: winnerWins,
        leaderUsername: displayLeader && displayLeader.username,
        leaderWins: displayLeader && displayLeader.wins
      });
    } catch (e) {
      releaseFightPublication(fight.id, 'result');
      console.error('Fight result failed:', e);
    }
  }

  function publishFightDraw(fight) {
    if (!claimFightPublication(fight.id, 'draw')) return;
    emitFightEvent('fight_draw', {
      fightId: fight.id,
      challenger: fight.challenger,
      opponent: fight.opponent,
      score: fight.scores[fight.challenger]
    }).catch(() => releaseFightPublication(fight.id, 'draw'));
  }

  function scheduleFightResultFailover(fight, winner, loser) {
    // The loser waits briefly for the winner's normal result publication.
    // This is only a recovery path for a closed/offline winning tab, so it
    // adds no Firestore work during a healthy fight.
    if (!fight || !session || session.username !== loser) return;
    clearTimeout(fightOutcomeFallbackTimer);
    fightOutcomeFallbackTimer = setTimeout(() => {
      fightOutcomeFallbackTimer = null;
      const activeFight = currentFight;
      if (!activeFight || activeFight.id !== fight.id || activeFight.status === 'result') return;
      const challengerScore = Number(activeFight.scores && activeFight.scores[activeFight.challenger]);
      const opponentScore = Number(activeFight.scores && activeFight.scores[activeFight.opponent]);
      if (!Number.isFinite(challengerScore) || !Number.isFinite(opponentScore) || challengerScore === opponentScore) return;
      const resolvedWinner = challengerScore > opponentScore ? activeFight.challenger : activeFight.opponent;
      if (resolvedWinner !== winner) return;
      publishFightResult(activeFight, winner, loser, { failover: true });
    }, FIGHT_RESULT_FAILOVER_MS);
  }

  function scheduleFightDrawFailover(fight) {
    if (!fight || !session || session.username !== fight.opponent) return;
    clearTimeout(fightOutcomeFallbackTimer);
    fightOutcomeFallbackTimer = setTimeout(() => {
      fightOutcomeFallbackTimer = null;
      const activeFight = currentFight;
      if (!activeFight || activeFight.id !== fight.id || activeFight.status === 'result') return;
      const challengerScore = Number(activeFight.scores && activeFight.scores[activeFight.challenger]);
      const opponentScore = Number(activeFight.scores && activeFight.scores[activeFight.opponent]);
      if (!Number.isFinite(challengerScore) || challengerScore !== opponentScore) return;
      publishFightDraw(activeFight);
    }, FIGHT_RESULT_FAILOVER_MS);
  }

  function fillMissingFightScore(fight) {
    if (!fight || !session || fight.filledMissingScore || !isFightParticipant(fight)) return;
    if (fight.scores[session.username] == null) return;
    const other = session.username === fight.challenger ? fight.opponent : fight.challenger;
    if (fight.scores[other] != null) return;
    const lastLive = Number(fight.liveScores && fight.liveScores[other]);
    fight.scores[other] = Number.isFinite(lastLive) && lastLive >= 0 ? Math.floor(lastLive) : 0;
    fight.filledMissingScore = true;
    resolveFightScores();
    refreshFightPanel();
  }

  function resolveFightScores() {
    const fight = currentFight;
    if (!fight || fight.status === 'result' || !fight.scores || fight.scores[fight.challenger] == null || fight.scores[fight.opponent] == null) return;
    const challengerScore = fight.scores[fight.challenger];
    const opponentScore = fight.scores[fight.opponent];
    if (challengerScore === opponentScore) {
      if (fight.filledMissingScore || (session && session.username === fight.challenger)) publishFightDraw(fight);
      else scheduleFightDrawFailover(fight);
      return;
    }
    const winner = challengerScore > opponentScore ? fight.challenger : fight.opponent;
    const loser = winner === fight.challenger ? fight.opponent : fight.challenger;
    if (session && session.username === winner) publishFightResult(fight, winner, loser);
    else if (fight.filledMissingScore) publishFightResult(fight, winner, loser, { failover: true });
    else scheduleFightResultFailover(fight, winner, loser);
  }

  function applyFightScore(message) {
    if (!currentFight || currentFight.id !== message.fightId || !message.player || currentFight.status === 'result') return;
    if (message.player !== currentFight.challenger && message.player !== currentFight.opponent) return;
    const score = Number(message.score);
    if (!Number.isFinite(score) || score < 0) return;
    currentFight.scores[message.player] = Math.floor(score);
    currentFight.liveScores = currentFight.liveScores || {};
    currentFight.liveScores[message.player] = Math.floor(score);
    resolveFightScores();
    refreshFightPanel();
  }

  function restoreFightFromLiveScore(message) {
    if (!message || !message.fightId || !message.challenger || !message.opponent) return null;
    const startsAt = Number(message.startsAt);
    const endsAt = Number(message.endsAt);
    const now = Date.now();
    if (!Number.isFinite(startsAt) || !Number.isFinite(endsAt) || endsAt <= startsAt || now > endsAt + FIGHT_RESULT_HOLD_MS) return null;

    if (currentFight && currentFight.id !== message.fightId) {
      const replaceablePendingFight = currentFight.status === 'pending' && currentFight.expiresAt <= now;
      if (!replaceablePendingFight) return null;
      clearFightTimers();
    }
    if (currentFight && currentFight.id === message.fightId && currentFight.status === 'result') return currentFight;

    let created = false;
    if (!currentFight || currentFight.id !== message.fightId) {
      currentFight = {
        id: message.fightId,
        challenger: message.challenger,
        opponent: message.opponent,
        createdAt: startsAt - FIGHT_START_DELAY_MS,
        startsAt: startsAt,
        endsAt: endsAt,
        status: now < startsAt ? 'countdown' : 'playing',
        localClicks: 0,
        scoreSubmitted: false,
        scores: {},
        liveScores: {}
      };
      created = true;
    } else {
      currentFight.challenger = message.challenger;
      currentFight.opponent = message.opponent;
      currentFight.startsAt = startsAt;
      currentFight.endsAt = endsAt;
      currentFight.liveScores = currentFight.liveScores || {};
      if (currentFight.status === 'pending') {
        currentFight.status = now < startsAt ? 'countdown' : 'playing';
        clearTimeout(fightExpiryTimer);
        fightExpiryTimer = null;
        created = true;
      }
    }
    if (created) {
      startFightTicker();
      refreshFightPanel();
    }
    return currentFight;
  }

  function applyFightLiveScore(message) {
    const fight = restoreFightFromLiveScore(message);
    if (!fight || !message.player) return;
    if (message.player !== fight.challenger && message.player !== fight.opponent) return;
    const score = Number(message.score);
    if (!Number.isFinite(score) || score < 0) return;
    fight.liveScores = fight.liveScores || {};
    fight.liveScores[message.player] = Math.floor(score);
    ensureFightTicker(fight);
    updateFightTug();
  }

  const FIGHT_LOSS_FRESH_MS = 5 * 60 * 1000;

  function recordFightLoss(message) {
    if (!session || message.type !== 'fight_result' || message.loser !== session.username) return;
    const sentAt = Number(message.ts) || 0;
    if (!sentAt || Date.now() - sentAt > FIGHT_LOSS_FRESH_MS) return;
    if (!claimFightPublication(message.fightId, 'loss')) return;
    usernamesRef.doc(session.username.toLowerCase())
      .set({ fightLosses: firebase.firestore.FieldValue.increment(1) }, { merge: true })
      .catch((e) => console.error('Could not save fight loss:', e));
  }

  function applyFightResult(message) {
    if (!message || !message.fightId) return;
    if (currentFight && currentFight.id === message.fightId) recordFightLoss(message);
    if (!currentFight || currentFight.id !== message.fightId) {
      currentFight = {
        id: message.fightId,
        challenger: message.challenger,
        opponent: message.opponent,
        scores: {}
      };
    }
    clearTimeout(fightOutcomeFallbackTimer);
    fightOutcomeFallbackTimer = null;
    currentFight.status = 'result';
    currentFight.result = message.type === 'fight_draw'
      ? { draw: true, score: message.score }
      : {
          winner: message.winner,
          loser: message.loser,
          winnerScore: message.winnerScore,
          loserScore: message.loserScore,
          winnerWins: message.winnerWins,
          leaderUsername: message.leaderUsername,
          leaderWins: message.leaderWins
        };
    clearInterval(fightTicker);
    fightTicker = null;
    clearTimeout(fightExpiryTimer);
    refreshFightPanel();
    clearTimeout(fightResultTimer);
    fightResultTimer = setTimeout(() => clearCurrentFight(message.fightId), FIGHT_RESULT_HOLD_MS);
  }

  function applyFightDecline(message) {
    if (!message || !message.fightId) return;
    // The inviter owns this lightweight, target-specific cooldown. The
    // decline is already an event in the existing message stream, so saving
    // it in localStorage adds no Firestore write or read.
    if (session && message.challenger === session.username && message.opponent) {
      const until = Number(message.rejectCooldownUntil) || ((Number(message.ts) || Date.now()) + FIGHT_REJECT_COOLDOWN_MS);
      setFightRejectCooldown(message.opponent, until);
    }
    if (currentFight && currentFight.id === message.fightId) clearCurrentFight(message.fightId);
  }

  function handleFightMessage(message) {
    if (!isFightEvent(message)) return;
    if (message.type === 'fight_challenge') adoptFightChallenge(message);
    if (message.type === 'fight_accept') applyFightAcceptance(message);
    if (message.type === 'fight_decline') applyFightDecline(message);
    if (message.type === 'fight_live') applyFightLiveScore(message);
    if (message.type === 'fight_score') applyFightScore(message);
    if (message.type === 'fight_result' || message.type === 'fight_draw') applyFightResult(message);
  }

  function refreshFightPanel() {
    const wrap = $('fightPanelWrap');
    const panel = $('fightPanel');
    const fightButton = $('fightBtn');
    const cooldownRemaining = fightCooldownRemaining();
    if (fightButton) {
      const chatLocked = !isChatUnlocked();
      fightButton.disabled = !!currentFight || cooldownRemaining > 0 || chatLocked;
      fightButton.classList.toggle('on-cooldown', !currentFight && cooldownRemaining > 0);
      fightButton.classList.toggle('is-locked', !currentFight && cooldownRemaining <= 0 && chatLocked);
      if (!currentFight && cooldownRemaining > 0) {
        fightButton.style.setProperty('--fight-frac', String(Math.max(0, cooldownRemaining / FIGHT_COOLDOWN_MS)));
        fightButton.title = 'Fight ready in ' + formatFightCooldown(cooldownRemaining);
        fightButton.setAttribute('aria-label', 'Fight ready in ' + formatFightCooldown(cooldownRemaining));
      } else if (!currentFight && chatLocked) {
        fightButton.style.removeProperty('--fight-frac');
        fightButton.title = 'Tap in to unlock fights';
        fightButton.setAttribute('aria-label', fightButton.title);
      } else {
        fightButton.style.removeProperty('--fight-frac');
        fightButton.title = currentFight ? 'A fight is already in progress' : 'Challenge someone to a fight';
        fightButton.setAttribute('aria-label', fightButton.title);
      }
      if (currentFight || cooldownRemaining > 0) fightButton.setAttribute('aria-expanded', 'false');
    }
    scheduleFightCooldownRefresh();
    if (!wrap || !panel) return;
    const fight = currentFight;
    if (!fight) {
      wrap.classList.remove('is-visible');
      panel.innerHTML = '';
      return;
    }
    ensureFightTicker(fight);
    wrap.classList.add('is-visible');
    const role = fightRole(fight);
    const challenger = escapeHtml(fight.challenger || '');
    const opponent = escapeHtml(fight.opponent || '');

    if (fight.status === 'pending') {
      const isChallenger = role === 'challenger';
      const isOpponent = role === 'opponent';
      panel.innerHTML = `
        <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">${isOpponent ? challenger + ' called you out' : 'Fight challenge'}</div>
        <div class="fight-panel-copy">${isChallenger ? 'Waiting for ' + opponent + ' to accept.' : isOpponent ? 'Do you want to fight ' + challenger + '?' : challenger + ' challenged ' + opponent + '.'}</div>
        ${isOpponent ? '<div class="fight-panel-actions"><button type="button" class="fight-action-btn" id="fightAcceptBtn">Accept</button><button type="button" class="fight-action-btn decline" id="fightDeclineBtn">Decline</button></div>' : '<div class="fight-spectator-note">This challenge expires in ' + Math.max(1, Math.ceil((fight.expiresAt - Date.now()) / 1000)) + ' seconds.</div>'}
      `;
      const accept = $('fightAcceptBtn');
      const decline = $('fightDeclineBtn');
      if (accept) accept.addEventListener('click', acceptFight);
      if (decline) decline.addEventListener('click', declineFight);
      return;
    }

    if (fight.status === 'result') {
      const result = fight.result || {};
      if (result.draw) {
        panel.innerHTML = `
          <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">It's a draw</div>
          <div class="fight-panel-copy">${challenger} and ${opponent} both finished with ${Number(result.score) || 0} knock outs.</div>
          ${fightTugMarkup(fight)}
        `;
      } else {
        const leader = result.leaderUsername && result.leaderWins
          ? '<div class="fight-result-score">High score: ' + escapeHtml(result.leaderUsername) + ' — ' + Number(result.leaderWins) + ' knock outs</div>'
          : '';
        panel.innerHTML = `
          <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">${escapeHtml(result.winner || '')} knocked out ${escapeHtml(result.loser || '')}</div>
          <div class="fight-panel-copy">${Number(result.winnerScore) || 0} knock outs to ${Number(result.loserScore) || 0}.</div>
          ${fightTugMarkup(fight)}
          ${leader}
        `;
      }
      updateFightTug();
      return;
    }

    const isPlaying = fight.status === 'playing';
    const isFighter = role !== 'spectator';
    const myScoreIsSubmitted = isFighter && !!fight.scoreSubmitted;
    const countdownLabel = isPlaying ? Math.max(0, Math.ceil((fight.endsAt - Date.now()) / 1000)) + ' SECONDS' : 'STARTS IN ' + Math.max(1, Math.ceil((fight.startsAt - Date.now()) / 1000));
    panel.innerHTML = `
      <div class="fight-live-header">
        <div class="fight-panel-header"><img src="/fight-gloves.png" alt="">Live fight</div>
        <div class="fight-clock" id="fightClock">${countdownLabel}</div>
      </div>
      ${fightTugMarkup(fight)}
      ${isPlaying && isFighter && !myScoreIsSubmitted ? '<button type="button" class="fight-smash-btn" id="fightSmashBtn" title="Knock out!" aria-label="Knock out!"><img src="/fight-punch.png" alt=""></button>' : ''}
    `;
    const smash = $('fightSmashBtn');
    if (smash) smash.addEventListener('click', punchFight);
    updateFightTug();
  }

  function refreshTapInButtonState() {
    const btn = $('tapinBtn');
    const label = $('tapinBtnLabel');
    if (!btn) return;
    clearTimeout(tapinCooldownTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    if (remaining > 0) {
      btn.disabled = true;
      btn.classList.add('on-cooldown');
      btn.style.setProperty('--tapin-frac', String(Math.max(0, remaining / CHAT_UNLOCK_MS)));
      if (label) label.innerHTML = '<span class="tapin-count">' + escapeHtml(formatTapInCount(remaining)) + '</span>';
      btn.title = 'Chat locks again in ' + formatHms(remaining);

      tapinCooldownTimer = setTimeout(refreshTapInButtonState, remaining < 3600000 ? 1000 : 30000);
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cooldown');
      btn.style.removeProperty('--tapin-frac');
      btn.title = 'Tap in!';
      if (label) label.innerHTML = TAPIN_ICON_HTML;
    }
  }

  async function sendTapIn() {
    if (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt) > 0) return;
    lastTapInAt = Date.now();
    refreshTapInButtonState();
    refreshChatGateState();
    const ts = Date.now();
    pendingOwnTapinTimestamps.add(ts);

    const next = nextStreakAfterTapIn(ts);
    myStreak = next.streak;
    myStreakDay = next.day;
    showStreakBar(myStreak);

    const tapInStats = { lastTapInAt: lastTapInAt, streak: myStreak, streakDay: myStreakDay };
    usernamesRef.doc(session.username.toLowerCase()).set(tapInStats, { merge: true })
      .catch((e) => console.error('Could not save tap-in to account:', e));

    try {
      await devicesRef.doc(CLIENT_ID).set(tapInStats, { merge: true });
      await messagesRef.add({
        type: 'tapin',
        username: session.username,
        text: 'just tapped in',
        deviceId: CLIENT_ID,
        ts: ts
      });
    } catch (e) {
      console.error('Tap in failed:', e);
    } finally {

      setTimeout(() => pendingOwnTapinTimestamps.delete(ts), 30000);
    }
  }

  function triggerTapInEffect(username) {
    try {
      window.parent.postMessage({ type: 'knobsock-tapin', username: username }, '*');
    } catch (e) {}
  }

  const SPAM_MESSAGE_THRESHOLD = 10;
  const SPAM_WINDOW_MS = 60 * 1000;
  const SPAM_TIMEOUT_MS = 10 * 60 * 1000;
  const recentMessagesByDevice = {};
  const spamActionedDeviceIds = new Set();

  function checkSpam(m) {
    if (!m.deviceId || m.type === 'join' || m.type === 'tapin' || isFightEvent(m)) return;
    const arr = recentMessagesByDevice[m.deviceId] || (recentMessagesByDevice[m.deviceId] = []);
    arr.push(m.ts || Date.now());
    const cutoff = Date.now() - SPAM_WINDOW_MS;
    while (arr.length && arr[0] < cutoff) arr.shift();
    if (arr.length <= SPAM_MESSAGE_THRESHOLD || spamActionedDeviceIds.has(m.deviceId)) return;
    spamActionedDeviceIds.add(m.deviceId);
    bansRef.doc(m.deviceId).set({
      bannedAt: Date.now(),
      bannedBy: 'system (auto spam filter)',
      expiresAt: Date.now() + SPAM_TIMEOUT_MS,
      reason: 'Automatic timeout: sent ' + arr.length + ' messages in under a minute',
      enforced: true,
      usernames: firebase.firestore.FieldValue.arrayUnion(m.username)
    }, { merge: true }).catch((e) => console.error('Auto-timeout failed:', e));
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderMessageText(text) {
    return escapeHtml(censorText(String(text || ''))).replace(/:([a-z0-9_-]{1,32}):/gi, function (match, name) {
      const emoji = chatEmojiByName[String(name).toLowerCase()];
      if (!emoji) return match;
      return '<img class="chat-emoji" src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(match) + '" title="' + escapeHtml(match) + '" loading="lazy">';
    });
  }

  const EMOJI_ONLY_RE = /^(?:\p{Extended_Pictographic}|\p{Emoji_Modifier}|\p{Regional_Indicator}|[0-9#*]️?⃣|️|‍|\s)+$/u;
  const HAS_EMOJI_RE = /\p{Extended_Pictographic}|\p{Regional_Indicator}|⃣/u;

  function isEmojiOnlyMessage(text) {
    let sawCustomEmoji = false;
    const rest = String(text || '').replace(/:([a-z0-9_-]{1,32}):/gi, function (match, name) {
      if (!chatEmojiByName[String(name).toLowerCase()]) return match;
      sawCustomEmoji = true;
      return ' ';
    });
    if (!rest.trim()) return sawCustomEmoji;
    return EMOJI_ONLY_RE.test(rest) && HAS_EMOJI_RE.test(rest);
  }

  const DEFAULT_CENSORED_WORDS = [
    'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
    'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
    'towelhead', 'raghead', 'cunt'
  ];

  function buildCensorRegex(word) {

    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp('\\b' + pattern + '\\b', 'gi');
  }

  function buildUsernameCensorRegex(word) {
    const subs = {
      a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
      s: '[s$5]', g: '[g9]', t: '[t7]'
    };
    const pattern = word
      .split('')
      .map(ch => subs[ch] || ch)
      .join('[\\W_]*');
    return new RegExp(pattern, 'i');
  }

  let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
  let USERNAME_CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildUsernameCensorRegex);

  let adminUsernames = new Set();

  configRef.doc('censoredWords').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
    CENSOR_REGEXES = words.map(buildCensorRegex);
    USERNAME_CENSOR_REGEXES = words.map(buildUsernameCensorRegex);
    const admins = (data && Array.isArray(data.admins) ? data.admins : []).map((name) => String(name).toLowerCase()).sort();
    if (admins.join('\n') === Array.from(adminUsernames).sort().join('\n')) return;
    adminUsernames = new Set(admins);
    if (lastRenderedMsgs && session) renderMessages(lastRenderedMsgs);
  }, () => {});

  function usernameContainsCensoredWord(name) {
    return USERNAME_CENSOR_REGEXES.some(re => re.test(name));
  }

  configRef.doc('clear').onSnapshot((doc) => {
    const data = doc.exists ? doc.data() : null;
    const previousClearedAt = clearedAt;
    clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;

    if (clearedAt > previousClearedAt && typeof messageCache !== 'undefined') {
      messageCache = messageCache.filter((m) => m && m.ts > clearedAt);
      saveMessageCache();
    }

    if (session && subscribedClearedAt !== clearedAt) subscribeToMessages();
  }, () => {});

  function censorText(text) {
    let result = text;
    CENSOR_REGEXES.forEach(re => {
      result = result.replace(re, match => '*'.repeat(match.length));
    });
    return result;
  }

  function timeLabel(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return hash % 360;
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function defaultColorFor(username) {
    return hslToHex(hashHue(username.toLowerCase()), 70, 72);
  }

  const COLOR_CACHE_KEY = 'chat_color_cache_v1';
  const COLOR_CACHE_TTL = 12 * 60 * 60 * 1000;

  const usernameColorCache = (function () {
    try {
      const raw = JSON.parse(localStorage.getItem(COLOR_CACHE_KEY) || '{}');
      if (raw && typeof raw.at === 'number' && Date.now() - raw.at < COLOR_CACHE_TTL && raw.colors) {
        return raw.colors;
      }
    } catch (e) {}
    return {};
  })();

  let colorCacheSaveTimer = null;
  function persistColorCache() {
    clearTimeout(colorCacheSaveTimer);
    colorCacheSaveTimer = setTimeout(() => {
      try {
        const colors = {};
        Object.keys(usernameColorCache).forEach((k) => {
          if (usernameColorCache[k] !== 'pending') colors[k] = usernameColorCache[k];
        });
        localStorage.setItem(COLOR_CACHE_KEY, JSON.stringify({ at: Date.now(), colors: colors }));
      } catch (e) {}
    }, 1000);
  }

  function rememberColor(username, color) {
    usernameColorCache[username.toLowerCase()] = color;
    persistColorCache();

  function myCurrentColor() {
    if (!session) return null;
    const cached = usernameColorCache[session.username.toLowerCase()];
    return (cached && cached !== 'pending') ? cached : defaultColorFor(session.username);
  }

  function colorForUsername(username, onResolved) {
    const key = username.toLowerCase();
    if (usernameColorCache[key] && usernameColorCache[key] !== 'pending') {
      return usernameColorCache[key];
    }
    if (!usernameColorCache[key]) {
      usernameColorCache[key] = 'pending';
      usernamesRef.doc(key).get().then((doc) => {
        const data = doc.exists ? doc.data() : null;
        usernameColorCache[key] = (data && data.color) || defaultColorFor(username);
        persistColorCache();
        if (onResolved) onResolved();
      }).catch(() => {
        usernameColorCache[key] = defaultColorFor(username);
        if (onResolved) onResolved();
      });
    }
    return defaultColorFor(username);
  }
