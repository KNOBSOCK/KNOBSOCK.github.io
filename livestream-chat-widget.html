<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live Stream + Chat</title>
<style>
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }
  :root {
    --ink: #3a0a0a;

    --ink-rgb: 58, 10, 10;
    --panel: rgba(var(--ink-rgb), 0.32);
    --panel-2: rgba(var(--ink-rgb), 0.8);
    --line: rgba(255, 180, 150, 0.6);
    --accent: #cd3232;
    --accent-rgb: 205, 50, 50;
    --accent-dim: #6e1e1e;
    --interactive-hover: #ffff00;
    --interactive-hover-text: #000000;
    --text: #ffffff;
    --text-dim: #f5c9c9;
    --error: #ffb3b3;

    --vods-bg: #200606;
    --portrait-meta: #d99aff;
    --portrait-input-bg: rgba(25, 3, 3, 0.5);
    --font-display: Tahoma, Arial, sans-serif;
    --font-body: Tahoma, Arial, sans-serif;
    --stats-h: 38px;

    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  html.is-offline {
    --ink: #0d0d0d;
    --ink-rgb: 13, 13, 13;
    --line: rgba(120, 120, 120, 0.6);
    --accent: #5a1717;
    --accent-rgb: 90, 23, 23;
    --accent-dim: #333333;
    --text-dim: #aaaaaa;
    --error: #aaaaaa;
    --vods-bg: #080808;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  .widget-privacy-footer { display: none; }

  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: var(--chat-tint-bg, rgba(var(--accent-rgb), 0.45));
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  .layout {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    margin: 0;
    gap: 14px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .video-pane {
    position: relative;

    z-index: 2;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 62%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;

  }

  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  /* Keep native HLS video rendered while buffering. Safari suspends a video
     that becomes invisible during a seek, which leaves it stuck on `waiting`. */
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  .offline-frame {
    position: absolute;
    display: none;
    width: 100cqw;
    height: 100cqh;
    object-fit: cover;
  }

  .video-pane.offline-card .offline-frame { display: block; }

  .gif-loader {
    position: relative;
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    position: relative;
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .center-toggle-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(56px, 14vw, 96px);
    height: clamp(56px, 14vw, 96px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(22px, 5vw, 34px);
    line-height: 1;
    pointer-events: none;
    opacity: 0;
    z-index: 4;
    transform: translate(-50%, -50%) scale(0.7);
  }
  .center-toggle-icon img { width: 42%; height: auto; display: block; }

  .center-toggle-icon.is-flashing {
    animation: center-toggle-flash 550ms ease-out;
  }

  .video-pane.controls-visible .center-toggle-icon.is-tappable {
    opacity: 0.85;
    pointer-events: auto;
    cursor: pointer;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .center-toggle-icon.is-tappable:active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.94);
  }
  .center-toggle-icon.is-tappable.is-popping {
    animation: center-toggle-pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes center-toggle-pop {
    0%   { transform: translate(-50%, -50%) scale(1); }
    40%  { transform: translate(-50%, -50%) scale(1.3); }
    70%  { transform: translate(-50%, -50%) scale(0.92); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  .video-pane.offline-card .center-toggle-icon,
  .video-pane.is-loading .center-toggle-icon {
    display: none;
  }

  .center-skip-btn {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    top: 50%;
    z-index: 5;
    width: clamp(44px, 13cqmin, 80px);
    height: clamp(44px, 13cqmin, 80px);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
    transform: translate(-50%, -50%);
    transition: opacity 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .center-skip-back { left: calc(50% - clamp(76px, 22%, 170px)); }
  .center-skip-forward { left: calc(50% + clamp(76px, 22%, 170px)); }
  .center-skip-btn img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }
  .video-pane.controls-visible .center-skip-btn:not(:disabled) {
    opacity: 0.92;
    pointer-events: auto;
  }
  @media (hover: hover) {
    .video-pane.controls-visible .center-skip-btn:not(:disabled):hover { opacity: 1; }
  }
  .center-skip-btn:active { transform: translate(-50%, -50%) scale(0.9); }
  .center-skip-back.is-skipping { animation: centerSkipBack 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
  .center-skip-forward.is-skipping { animation: centerSkipForward 0.55s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes centerSkipBack {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(-360deg); }
  }
  @keyframes centerSkipForward {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .center-skip-btn.is-skipping { animation: none; }
  }
  .center-skip-flash {
    position: absolute;
    top: 50%;
    z-index: 4;
    width: clamp(44px, 13cqmin, 80px);
    height: clamp(44px, 13cqmin, 80px);
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
    transform: translate(-50%, -50%);
  }
  .center-skip-flash img {
    display: block;
    width: 100%;
    height: 100%;
  }
  .center-skip-flash.flash-back { left: calc(50% - clamp(76px, 22%, 170px)); }
  .center-skip-flash.flash-forward { left: calc(50% + clamp(76px, 22%, 170px)); }
  .center-skip-flash.flash-back.is-flashing { animation: skipFlashBack 0.7s ease-out; }
  .center-skip-flash.flash-forward.is-flashing { animation: skipFlashForward 0.7s ease-out; }
  @keyframes skipFlashBack {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(0.8); }
    15% { opacity: 0.95; }
    75% { opacity: 0.95; transform: translate(-50%, -50%) rotate(-360deg) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(-360deg) scale(1.05); }
  }
  @keyframes skipFlashForward {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) scale(0.8); }
    15% { opacity: 0.95; }
    75% { opacity: 0.95; transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(360deg) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .center-skip-flash.flash-back.is-flashing,
    .center-skip-flash.flash-forward.is-flashing { animation: center-toggle-flash 550ms ease-out; }
  }
  @media (hover: hover) {
    .center-skip-btn { display: none; }
  }
  .video-pane.offline-card .center-skip-btn,
  .video-pane.is-loading .center-skip-btn,
  .video-pane.offline-card .center-skip-flash,
  .video-pane.is-loading .center-skip-flash {
    display: none;
  }

  @keyframes center-toggle-flash {
    0%   { opacity: 0;   transform: translate(-50%, -50%) scale(0.7); }
    20%  { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.15); }
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-frame-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #videoEl { cursor: pointer; }
  .video-frame-wrap video::-webkit-media-controls { display: none !important; }

  .chat-pane {
    position: relative;
    z-index: 1;
    flex: 1 1 38%;
    min-width: 300px;
    display: flex;
    container-type: size;
    container-name: chatbox;
  }
  .chat-pane:has(.fight-menu.is-open) { z-index: 3; }
  .chat-pane:has(.fight-menu.is-open) .chat-card,
  .chat-pane:has(.fight-menu.is-open) .chat-screen { overflow: visible; }

  /* On desktop, make the shared row as tall as the 16:9 player. This lets the
     chat sit flush with the player instead of stretching down the page. */
  @media (min-width: 861px) {
    .bg-glow {
      /* Match the 16:9 video-column height instead of the iframe's height. */
      bottom: auto;
      height: calc(34.875vw - 10.5px);
    }
    body.is-chat-hidden .bg-glow {
      height: min(calc(56.25vw - 9px), calc(100dvh - 40px));
      background: transparent;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 62fr) minmax(300px, 38fr);
      align-content: start;
    }
    .video-pane {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }
    .chat-pane { min-width: 0; }
    .layout.chat-hidden,
    .layout.fullscreen-active { grid-template-columns: 1fr; }
    .layout.chat-hidden {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    body.is-chat-hidden .layout.chat-hidden .video-pane {
      flex: 0 1 auto;
      width: auto;
      height: min(calc(56.25vw - 9px), calc(100dvh - 40px));
      max-width: 100%;
    }
    .widget-privacy-footer {
      position: absolute;
      top: calc(34.875vw + 10px);
      left: 0;
      right: 0;
      display: block;
      text-align: center;
      padding: 3px 0;
    }
    .widget-privacy-footer a {
      color: #fff;
      font: 9px Arial, Helvetica, sans-serif;
      opacity: 0.75;
    }
    .widget-privacy-footer a:hover { opacity: 1; }
    body.is-chat-hidden .widget-privacy-footer {
      top: min(calc(56.25vw + 10px), calc(100dvh - 21px));
    }
  }

  .vods-panel {
    position: absolute;
    top: 0;

    left: -28px;
    right: 0;

    border-radius: 0 10px 0 0;
    overflow: hidden;
    z-index: 8;
    display: flex;
    flex-direction: column;
    align-items: stretch;

    pointer-events: none;
  }
  .vods-tab {
    pointer-events: auto;
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.5cqw, 10px);
    width: 100%;

    border: 0;
    background: var(--vods-bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: clamp(6px, 1.6cqh, 10px) 10px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .vods-tab:hover,
  .vods-tab:active {
    background: var(--interactive-hover);
    color: var(--interactive-hover-text);
  }
  .vods-tab:hover .vods-tab-label,
  .vods-tab:hover .vods-tab-chevron,
  .vods-tab:active .vods-tab-label,
  .vods-tab:active .vods-tab-chevron { color: var(--interactive-hover-text); }
  @media (hover: none) {
    .vods-tab:hover,
    .vods-tab:active { background: var(--vods-bg); color: var(--text); }
    .vods-tab:hover .vods-tab-label,
    .vods-tab:hover .vods-tab-chevron,
    .vods-tab:active .vods-tab-label,
    .vods-tab:active .vods-tab-chevron { color: var(--text); }
  }

  .vods-tab-label,
  .vods-tab-chevron {
    color: var(--text);
  }
  .vods-tab-label {
    font-family: 'Gratis Neue', var(--font-body);
  }
  .vods-tab-chevron {
    display: inline-block;
    font-size: 9px;

    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-tab-chevron { transform: rotate(180deg); }

  .vods-drawer {
    pointer-events: auto;
    flex: none;
    display: flex;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    background: var(--vods-bg);
    transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .vods-panel.open .vods-drawer {
    max-height: min(70cqh, 460px);
  }

  .vods-heading {
    display: none;
    flex: none;
    text-align: center;
    font-family: 'Gratis Neue', var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: clamp(11px, 3cqw, 14px);
    color: var(--text);
    padding: 10px 10px 4px;
  }
  .vods-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    padding: 8px 8px 8px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .vods-list::-webkit-scrollbar { display: none; }
  .vods-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: clamp(10px, 2.8cqw, 12px);
  }
  .vod-row {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    padding: 6px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }
  .vod-row:hover { background: rgba(255, 255, 0, 0.12); }
  .vod-row.active { border-color: var(--interactive-hover); background: rgba(255, 255, 0, 0.15); }
  .vod-row-thumb {
    flex: none;
    width: 88px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    object-fit: cover;
    background: var(--panel);
  }
  .vod-row-details {
    min-width: 0;
  }
  .vod-row-title {
    font-family: 'Gratis Neue', var(--font-body);
    font-size: clamp(11px, 2.8cqw, 13px);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .vod-row-date {
    display: block;
    margin-top: 3px;
    color: var(--text-dim);
    font-size: clamp(9px, 2.3cqw, 11px);
    line-height: 1.2;
  }

  @media (max-width: 860px) {
    .layout {
      flex-direction: column;
    }
    .video-pane {
      flex: 0 1 auto;
      box-sizing: content-box;
      aspect-ratio: 16 / 9;
      padding-bottom: var(--stats-h);
    }

    .video-loading {
      bottom: var(--stats-h);
    }

    .layout .video-controls {
      bottom: var(--stats-h);
    }

    .chat-pane {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;

      margin-top: calc(-1 * (14px + var(--stats-h)));
    }

    .layout .stream-stats {
      display: flex;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .stream-stats:active {
      background: var(--ink);
      box-shadow: inset 0 0 26px rgba(var(--accent-rgb), 0.5);
    }

    .stream-stats .stream-stats-vods {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;

      color: var(--text);
    }
    .layout.vods-open .stream-stats-chevron { transform: rotate(180deg); }
    .vods-tab { display: none; }

    .vods-panel {

      top: var(--stats-h);
      left: 0;

      border-radius: 0;
    }

    .layout.vods-open .video-pane {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .vods-drawer {
      border-radius: 0 0 10px 10px;
    }
    .vods-tab {
      align-self: center;
      width: clamp(52px, 16cqw, 74px);
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 10px 10px;

      height: 14px;
      padding: 0;
    }
    .vods-tab-chevron { font-size: 10px; }
    .vods-tab-label { display: none; }

    .vods-panel.open .vods-drawer {
      max-height: min(60cqh, 380px);
    }

    .layout.vods-expanded:not(.mode-portrait) .stream-stats .stream-stats-vods { visibility: hidden; }
    .layout.vods-open:not(.mode-portrait) .vods-drawer { border-radius: 0; border-top: 1px solid var(--line); }
    .layout.vods-open:not(.mode-portrait) .chat-pane { z-index: 3; }
    .layout.vods-open:not(.mode-portrait) .vods-panel { top: 0; }
    .layout.vods-expanded:not(.mode-portrait) .vods-tab {
      display: flex;
      align-self: stretch;
      width: 100%;
      height: var(--stats-h);
      padding: 0 14px;
      border: 0;
      border-radius: 0 0 10px 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .layout.vods-expanded:not(.mode-portrait) .vods-tab-label { display: inline; }
    .layout.vods-expanded:not(.mode-portrait) .vods-tab-chevron { font-size: 9px; }

    .layout:not(.mode-portrait) .chat-screen:not(.account-screen) .auth {
      overflow: hidden;
      align-items: safe center;
      padding: clamp(6px, 2cqh, 14px) 14px;
    }
    .layout:not(.mode-portrait) .chat-screen:not(.account-screen) .auth-inner > label:first-child { margin-top: 0; }
    .layout:not(.mode-portrait) .chat-screen:not(.account-screen) .auth-terms { margin-top: 8px; }
    .layout:not(.mode-portrait) .chat-screen:not(.account-screen) .auth-actions { margin-top: 10px; gap: 6px; }
    .layout:not(.mode-portrait) .chat-screen:not(.account-screen) .auth-msg { margin-top: 4px; min-height: 0; }

    .layout:not(.mode-portrait) .chat-pane {
      flex-direction: column;
      padding-top: var(--stats-h);
    }
    .layout:not(.mode-portrait) .chat-card {
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
    }
  }

  @media (max-width: 860px) and (max-height: 500px) and (orientation: portrait) {
    .layout:not(.mode-portrait):not(.chat-hidden) .video-pane {
      max-height: max(84px, calc(100vh - var(--stats-h) - 250px));
    }
  }

  .layout.chat-hidden .chat-pane {
    display: none;
  }
  .layout.chat-hidden .video-pane {
    flex: 1 1 100%;
  }

  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .chat-pane { display: none; }

    .layout .video-pane {
      flex: 1 1 100%;
      padding-bottom: 0;
      width: 100%;
      height: 100%;
    }
    .layout .stream-stats { display: none; }

    .layout {
      padding-bottom: 0;
      grid-template-columns: 1fr;
      align-content: stretch;
    }

    .bg-glow { bottom: 0; }

    .layout .video-controls { bottom: 0; }
  }

  .layout.fullscreen-active .chat-pane {
    display: none;
  }

  .stream-stats {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--stats-h);
    z-index: 5;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--vods-bg);
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(11px, 1.6vw, 14px);
    white-space: nowrap;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .stream-stats-vods {
    display: none;
    font-family: 'Gratis Neue', var(--font-body);
  }
  .stream-stats-chevron {
    display: inline-block;
    font-family: var(--font-body);

<script>
(function () {
  var layout = document.getElementById('layout');
  var toggleBtn = document.getElementById('toggleChatBtn');
  var activeLiveAspect = '16:9';
  toggleBtn.addEventListener('click', function () {
    var hidden = layout.classList.toggle('chat-hidden');
    document.body.classList.toggle('is-chat-hidden', hidden);
    try {
      var parentPlayerWrap = window.parent.document.querySelector('.player-wrap');
      if (parentPlayerWrap) parentPlayerWrap.classList.toggle('chat-hidden', hidden);
      var parentPage = window.parent.document.querySelector('.page');
      if (parentPage) parentPage.classList.toggle('chat-hidden', hidden);
    } catch (e) {}
    toggleBtn.textContent = hidden ? 'Show Chat' : 'Hide Chat';
    toggleBtn.title = hidden ? 'Show chat' : 'Hide chat';
  });

  window.setLiveAspectMode = function (aspect) {
    var isPortrait = aspect === '9:16';
    activeLiveAspect = isPortrait ? '9:16' : '16:9';
    layout.classList.toggle('mode-portrait', isPortrait);
    document.body.classList.toggle('is-portrait', isPortrait);
    /* The live page and widget are same-origin. Update it directly as well as
       posting the event, so a very fast Firestore response cannot beat the
       parent page's message listener during startup. */
    try {
      /* Live can sit inside the app shell, so update every same-origin parent
         rather than assuming the widget's immediate parent owns the header. */
      var frame = window;
      while (frame.parent && frame.parent !== frame) {
        frame = frame.parent;
        var parentPage = frame.document.querySelector('.page');
        if (parentPage) parentPage.classList.toggle('layout-portrait', isPortrait);
        frame.document.querySelectorAll('.page .logo-link').forEach(function (parentLogo) {
          parentLogo.style.display = isPortrait ? 'none' : '';
        });
      }
    } catch (e) {}
    try {
      window.parent.postMessage({ type: 'knobsock-layout-mode', mode: isPortrait ? '9:16' : '16:9' }, '*');
    } catch (e) {}
    window.dispatchEvent(new Event('knobsock-aspect-change'));
  };
  window.setLiveAspectMode('16:9');
  window.addEventListener('load', function () {
    setTimeout(function () { window.setLiveAspectMode(activeLiveAspect); }, 250);
  });

})();

(function () {
  function isPortraitPhone() {
    return document.body.classList.contains('is-portrait') && window.matchMedia('(max-width: 600px)').matches;
  }
  function lockPortraitScroll() {
    if (!isPortraitPhone()) return;
    window.scrollTo(0, 0);
    try { window.parent.postMessage({ type: 'knobsock-lock-live-scroll' }, '*'); } catch (e) {}
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', lockPortraitScroll);
    window.visualViewport.addEventListener('scroll', lockPortraitScroll);
  }
  window.addEventListener('scroll', lockPortraitScroll, { passive: true });
  document.addEventListener('focusin', function (event) {
    if (!event.target.matches('#msgInput')) return;
    requestAnimationFrame(lockPortraitScroll);
    setTimeout(lockPortraitScroll, 80);
  });
})();

(function () {

  var offlineVideo = document.getElementById('offlineVideo');

    document.addEventListener('visibilitychange', function () {
      var pane = document.getElementById('videoPane');
      if (!pane || !pane.classList.contains('offline-card')) return;
      if (document.visibilityState === 'visible' && offlineVideo.paused) {
        offlineVideo.play().catch(function () {});
      }

})();

(function () {

  var unmuteBtn = document.getElementById('unmuteBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var skipBackBtn = document.getElementById('skipBackBtn');
  var skipForwardBtn = document.getElementById('skipForwardBtn');
  var scrubRange = document.getElementById('scrubRange');
  var timeLabel = document.getElementById('timeLabel');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var qualityControl = document.getElementById('qualityControl');
  var qualityBtn = document.getElementById('qualityBtn');
  var qualityMenu = document.getElementById('qualityMenu');
  var videoPane = document.getElementById('videoPane');
  var videoLoading = document.getElementById('videoLoading');
  var layoutEl = document.getElementById('layout');
  var ytFrame = document.getElementById('ytFrame');
  var videoEl = document.getElementById('videoEl');
  var centerToggleIcon = document.getElementById('centerToggleIcon');
  var ytPlayer = null;
  var isDragging = false;
  var pollTimer = null;
  var backend = 'youtube';
  var apiReady = false;
  var videoReady = false;
  var hlsInstance = null;
  var resumeAfterDirectSeek = false;
  var directSeekRecoveryTimer = null;
  var directSeekRetryTimer = null;
  var directSeekReloadTimer = null;
  var directVideoWasPlaying = false;
  var directSeekTarget = 0;
  var directSeekGeneration = 0;
  var directMp4Generation = 0;

  function resumeDirectVideoAfterSeek() {
    if (!resumeAfterDirectSeek || backend !== 'video' || videoEl.ended) return;
    videoEl.play().catch(function () {});
  }

  function recoverDirectVideoAfterSeek() {
    var seekGeneration = directSeekGeneration;
    clearTimeout(directSeekRecoveryTimer);
    clearTimeout(directSeekRetryTimer);
    clearTimeout(directSeekReloadTimer);
    resumeDirectVideoAfterSeek();
    directSeekRecoveryTimer = setTimeout(resumeDirectVideoAfterSeek, 350);
    directSeekRetryTimer = setTimeout(function () {
      resumeDirectVideoAfterSeek();
    }, 1200);
    directSeekReloadTimer = setTimeout(function () {
      if (seekGeneration !== directSeekGeneration || hlsInstance || !resumeAfterDirectSeek || backend !== 'video' || videoEl.ended || !videoEl.currentSrc || (!videoEl.seeking && videoEl.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA)) return;
      var source = videoEl.currentSrc;
      var target = directSeekTarget;
      videoEl.addEventListener('loadedmetadata', function restoreStalledSeek() {
        if (seekGeneration !== directSeekGeneration) return;
        var duration = videoEl.duration;
        videoEl.currentTime = isFinite(duration) ? Math.min(target, Math.max(0, duration - 0.05)) : target;
        videoEl.play().catch(function () {});
      }, { once: true });
      // Re-select the same Bunny manifest only when native iOS HLS remains stalled.
      videoEl.src = source;
      videoEl.load();
    }, 2200);
  }

  // Safari can mark native HLS paused while it seeks. Remembering the last
  // playing state lets an active Bunny video resume without overriding a pause.
  videoEl.addEventListener('seeking', function () {
    directSeekGeneration += 1;
    resumeAfterDirectSeek = backend === 'video' && !videoEl.ended &&
      (!videoEl.paused || directVideoWasPlaying);
    if (resumeAfterDirectSeek) recoverDirectVideoAfterSeek();
  });
  videoEl.addEventListener('seeked', function () {
    recoverDirectVideoAfterSeek();
  });

  function seekDirectVideo(t) {
    directSeekTarget = t;
    directSeekGeneration += 1;
    resumeAfterDirectSeek = backend === 'video' && !videoEl.paused && !videoEl.ended;
    videoEl.currentTime = t;
    if (resumeAfterDirectSeek) recoverDirectVideoAfterSeek();
  }

  function isDirectVideoUrl(input) {
    if (!input) return false;
    var trimmed = String(input).trim();
    return /^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed);
  }

  function showBackendEl(kind) {
    /* Hiding a media element does not stop its audio. Tear down the previous
       backend before showing the next one so VOD audio cannot survive a
       Return to Live transition. */
    if (kind === 'youtube') {
      stopDirectVideo();
    } else {
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch (e) {}
      } else if (ytFrame.src && ytFrame.src !== 'about:blank') {
        ytFrame.src = 'about:blank';
      }
    }
    ytFrame.style.display = kind === 'youtube' ? '' : 'none';
    videoEl.style.display = kind === 'video' ? '' : 'none';
    updatePipButton();
    updateCenterToggleTappable();
  }

  var pipBtn = document.getElementById('pipBtn');
  var pipBlocked = false;
  var pipCheckTimer = null;

  function isInAppBrowser() {
    var ua = navigator.userAgent || '';
    if (/Instagram|FBAN|FBAV|FB_IAB|FBIOS|musical_ly|BytedanceWebview|TikTok|Snapchat|LinkedInApp|Pinterest|Twitter|Line\/|; wv\)/i.test(ua)) return true;
    return !!isIOS && !navigator.standalone && !/Safari\//.test(ua);
  }

  function pipSupported() {
    if (pipBlocked || isInAppBrowser()) return false;
    return !!(document.pictureInPictureEnabled && videoEl.requestPictureInPicture) ||
      typeof videoEl.webkitSetPresentationMode === 'function';
  }

  function blockPip() {
    pipBlocked = true;
    relockPip();
  }

  function isInPip() {
    return document.pictureInPictureElement === videoEl ||
      videoEl.webkitPresentationMode === 'picture-in-picture';
  }

  function updatePipButton() {
    if (!pipBtn) return;
    pipBtn.hidden = backend !== 'video' || !pipSupported();
    var inPip = isInPip();
    pipBtn.textContent = inPip ? 'Exit PiP' : 'PiP';
    pipBtn.title = inPip ? 'Return video to page' : 'Pop out video';
  }

  function relockPip() {
    videoEl.disablePictureInPicture = true;
    updatePipButton();
  }

  if (pipBtn) {
    pipBtn.addEventListener('click', function () {
      if (backend !== 'video') return;
      if (isInPip()) {
        if (document.pictureInPictureElement === videoEl) {
          document.exitPictureInPicture().catch(function () {});
        } else {
          videoEl.webkitSetPresentationMode('inline');
        }
        return;
      }
      videoEl.disablePictureInPicture = false;
      if (document.pictureInPictureEnabled && videoEl.requestPictureInPicture) {
        videoEl.requestPictureInPicture().catch(function (err) {
          if (err && err.name === 'InvalidStateError') relockPip();
          else blockPip();
        });
      } else {
        try {
          videoEl.webkitSetPresentationMode('picture-in-picture');
        } catch (e) {
          blockPip();
          return;
        }
        clearTimeout(pipCheckTimer);
        pipCheckTimer = setTimeout(function () {
          if (!isInPip()) blockPip();
        }, 1200);
      }
    });
  }
  videoEl.addEventListener('enterpictureinpicture', updatePipButton);
  videoEl.addEventListener('leavepictureinpicture', relockPip);
  videoEl.addEventListener('webkitpresentationmodechanged', function () {
    if (videoEl.webkitPresentationMode === 'picture-in-picture') updatePipButton();
    else relockPip();
  });

  function levelLabel(level) {
    if (!level) return '';
    return level.height ? (level.height + 'p') : (Math.round((level.bitrate || 0) / 1000) + 'kbps');
  }

  function setQualityMenuOpen(open) {
    if (!qualityMenu) return;
    qualityMenu.hidden = !open;
  }

  function hideQualityControl() {
    if (qualityBtn) qualityBtn.hidden = true;
    setQualityMenuOpen(false);
  }

  // hls.js's own autoLevelEnabled flag lags a tick behind a manual
  // currentLevel assignment, so the menu would still read back "Auto"
  // immediately after picking a resolution. Track the viewer's choice
  // ourselves instead of trusting that property.
  var qualityAutoMode = true;

  function selectQualityLevel(idx) {
    if (!hlsInstance) return;
    qualityAutoMode = idx === -1;
    hlsInstance.currentLevel = idx;
    renderQualityMenu(hlsInstance.levels, idx, qualityAutoMode);
  }

  function renderQualityMenu(levels, activeIndex, isAuto) {
    if (!qualityMenu || !qualityBtn) return;
    if (!levels || levels.length < 2) { hideQualityControl(); return; }
    qualityMenu.innerHTML = '';
    var autoBtn = document.createElement('button');
    autoBtn.type = 'button';
    autoBtn.textContent = 'Auto';
    autoBtn.className = isAuto ? 'is-active' : '';
    autoBtn.addEventListener('click', function () {
      selectQualityLevel(-1);
      setQualityMenuOpen(false);
    });
    qualityMenu.appendChild(autoBtn);
    var order = levels.map(function (_, idx) { return idx; }).reverse();
    order.forEach(function (idx) {
      var level = levels[idx];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = levelLabel(level);
      btn.className = (!isAuto && idx === activeIndex) ? 'is-active' : '';
      btn.addEventListener('click', function () {
        selectQualityLevel(idx);
        setQualityMenuOpen(false);
      });
      qualityMenu.appendChild(btn);
    });
    qualityBtn.textContent = isAuto ? 'Auto' : levelLabel(levels[activeIndex]);
    qualityBtn.hidden = false;
  }

  if (qualityBtn) {
    qualityBtn.addEventListener('click', function () {
      setQualityMenuOpen(!!qualityMenu && qualityMenu.hidden);
    });
  }
  document.addEventListener('click', function (e) {
    if (qualityControl && !qualityControl.contains(e.target)) setQualityMenuOpen(false);
  });

  function stopDirectVideo() {
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
    videoReady = false;
    hideQualityControl();
  }

  var MP4_QUALITY_HEIGHTS = [1440, 1080, 720, 480, 360, 240];

  function probeMp4QualityExists(url) {
    return fetch(url, { method: 'GET', headers: { Range: 'bytes=0-1' }, cache: 'no-store', mode: 'cors' })
      .then(function (res) { return !!res && (res.ok || res.status === 206); })
      .catch(function () { return false; });
  }

  function activeMp4Height(available) {
    var m = String(videoEl.currentSrc || '').match(/play_(\d+)p\.mp4/i);
    if (m) return parseInt(m[1], 10);
    return available.length ? available[0].height : null;
  }

  function renderMp4QualityMenu(available) {
    if (!qualityMenu || !qualityBtn) return;
    if (!available || available.length < 2) { hideQualityControl(); return; }
    var active = activeMp4Height(available);
    qualityMenu.innerHTML = '';
    available.forEach(function (option) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = option.height + 'p';
      btn.className = option.height === active ? 'is-active' : '';
      btn.addEventListener('click', function () {
        selectMp4Quality(option);
        setQualityMenuOpen(false);
      });
      qualityMenu.appendChild(btn);
    });
    qualityBtn.textContent = active ? (active + 'p') : 'Quality';
    qualityBtn.hidden = false;
  }

  function discoverMp4Qualities(baseUrl, query, generation) {
    var candidates = MP4_QUALITY_HEIGHTS.map(function (h) {
      return { height: h, url: baseUrl + '/play_' + h + 'p.mp4' + (query || '') };
    });
    Promise.all(candidates.map(function (c) { return probeMp4QualityExists(c.url); })).then(function (results) {
      if (generation !== directMp4Generation) return;
      renderMp4QualityMenu(candidates.filter(function (_, i) { return results[i]; }));
    });
  }

  function selectMp4Quality(option) {
    if (backend !== 'video' || !watchingVodId) return;
    var wasPlaying = !videoEl.paused;
    var resumeAt = videoEl.currentTime;
    var generation = ++directMp4Generation;
    videoEl.addEventListener('loadedmetadata', function restoreAfterQualitySwitch() {
      if (generation !== directMp4Generation) return;
      var duration = videoEl.duration;
      videoEl.currentTime = isFinite(duration) ? Math.min(resumeAt, Math.max(0, duration - 0.05)) : resumeAt;
      if (wasPlaying) videoEl.play().catch(function () {});
    }, { once: true });
    videoEl.src = option.url;
    videoEl.load();
    qualityBtn.textContent = option.height + 'p';
    Array.prototype.forEach.call(qualityMenu.children, function (btn) {
      btn.classList.toggle('is-active', btn.textContent === option.height + 'p');
    });
  }

  function loadDirectVideo(url) {
    // Safari's native HLS path can lose the requested segment after a seek.
    // Bunny also publishes a finished MP4 rendition once a VOD is done
    // encoding, whose byte-range seeking is reliable on iOS — but a live
    // stream has no finished MP4 yet, so only substitute it for a VOD.
    var mp4QualityBase = null;
    var mp4QualityQuery = '';
    if (isIOS && watchingVodId) {
      var bunnyVod = url.match(/^(https:\/\/[^/]+)\/(?:live\/)?([0-9a-f-]+)\/playlist\.m3u8(\?.*)?$/i);
      if (bunnyVod && /\.b-cdn\.net$/i.test(new URL(url).hostname)) {
        mp4QualityBase = bunnyVod[1] + '/' + bunnyVod[2];
        mp4QualityQuery = bunnyVod[3] || '';
        url = mp4QualityBase + '/play_720p.mp4' + mp4QualityQuery;
      }
    }
    backend = 'video';
    showBackendEl('video');
    showVideoLoading();
    videoReady = false;
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    hideQualityControl();
    if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
      qualityAutoMode = true;
      hlsInstance = new Hls();
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
        if (!hlsInstance) return;
        renderQualityMenu(hlsInstance.levels, hlsInstance.currentLevel, qualityAutoMode);
      });
      hlsInstance.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
        if (!hlsInstance) return;
        renderQualityMenu(hlsInstance.levels, data.level, qualityAutoMode);
      });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
    } else {
      videoEl.src = url;
    }
    videoEl.muted = true;
    videoEl.play().catch(function () {});
    if (mp4QualityBase) {
      var generation = ++directMp4Generation;
      discoverMp4Qualities(mp4QualityBase, mp4QualityQuery, generation);
    }
  }

  videoEl.addEventListener('loadedmetadata', function () {
    if (watchingVodId) {
      /* Direct-file VODs report their metadata after the player has loaded.
         Re-apply the aspect saved with that VOD instead of resetting every
         archive to landscape. */
      window.setLiveAspectMode(watchingVodAspect);
    }
    videoReady = true;
    unmuteBtn.disabled = false;
    playPauseBtn.disabled = false;
    scrubRange.disabled = false;
    updatePlayPauseIcon(true);
    applyPendingUnmute();
  });
  videoEl.addEventListener('waiting', function () { if (backend === 'video') showVideoLoading(); });
  videoEl.addEventListener('playing', function () { if (backend === 'video') { directVideoWasPlaying = true; hideVideoLoading(); updatePlayPauseIcon(true); } });
  videoEl.addEventListener('pause', function () {
    if (backend === 'video') updatePlayPauseIcon(false);
    setTimeout(function () { if (!videoEl.seeking) directVideoWasPlaying = false; }, 0);
  });
  videoEl.addEventListener('error', function () { if (backend === 'video') hideVideoLoading(); });

  function showVideoLoading() {
    /* The offline card lives inside the loading layer. It is not a loading
       placeholder, so do not let the normal player lifecycle hide it. */
    if (videoPane.classList.contains('offline-card')) return;
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');
    clearTimeout(youtubeRevealTimer);
    if (backend === 'youtube') {

        drawer.style.maxHeight = Math.max(0, closeStartH + Math.min(0, dy)) + 'px';
        return true;
      },
      (dy, fast) => {
        if ((-dy > 70 || fast) && dy < 0) {
          animateDrawerTo(0, () => setVodsOpen(false));
        } else {
          animateDrawerTo(closeStartH, applyVodsPeek);
        }
      });
    swallowClickAfterSwipe(vodsTab);

    if (!bar) return;
    let openTarget = 0;
    track(bar,
      () => !vodsPanel.classList.contains('open') && mobileLayout(),
      (dy, first) => {
        if (first) {
          if (dy < 6) return false;
          drawer.style.transition = 'none';
          setVodsOpen(true);
          openTarget = parseFloat(drawer.style.maxHeight) || Math.min(drawer.scrollHeight, 380);
          drawer.style.maxHeight = '0px';
        }
        drawer.style.maxHeight = Math.min(openTarget, Math.max(0, dy)) + 'px';
        return true;
      },
      (dy, fast) => {
        if ((dy > 70 || fast) && dy > 0) {
          animateDrawerTo(openTarget, applyVodsPeek);
        } else {
          animateDrawerTo(0, () => setVodsOpen(false));
        }
      });
    swallowClickAfterSwipe(bar);
  })();

    if (code === 'already-exists') return error.message || 'That account is already linked.';

    let details = null;
    try { details = await result.error.context.json(); } catch (e) {}
    const error = new Error((details && details.error) || result.error.message || 'Account service unavailable.');
    error.code = details && details.code;
    throw error;

  function loadAccountTapIn(username) {
    const key = username ? String(username).toLowerCase() : null;
    if (key === accountTapInKey) return;
    accountTapInKey = key;
    if (!key) return;
    const device = deviceTapIn && deviceTapIn.usernameKey === key ? deviceTapIn : null;
    applyTapInStats(device || tapInStatsFrom(null));
    myFightWins = device ? device.fightWins : 0;
    usernamesRef.doc(key).get().then((doc) => {
      cacheProfileDoc(key, doc.exists ? doc.data() : {});
      if (accountTapInKey !== key) return;
      const account = tapInStatsFrom(doc.exists ? doc.data() : null);
      if (device && device.fightWins > account.fightWins) {
        usernamesRef.doc(key).set({ fightWins: device.fightWins }, { merge: true })
          .catch((e) => console.error('Could not save knockouts to account:', e));

      myFightWins = Math.max(myFightWins, account.fightWins);
      refreshFightPanel();
      if (device && device.lastTapInAt > account.lastTapInAt) {
        usernamesRef.doc(key).set({
          lastTapInAt: device.lastTapInAt,
          streak: device.streak,
          streakDay: device.streakDay

  async function claimUsernameSlot(rawUsername) {
    const baseKey = rawUsername.toLowerCase();
    const baseRef = usernamesRef.doc(baseKey);
    const deviceRef = devicesRef.doc(CLIENT_ID);

    try {
      const deviceDoc = await deviceRef.get();
      const lockedName = deviceDoc.exists && deviceDoc.data() && deviceDoc.data().username;
      if (lockedName) {
        return { username: lockedName, isNew: false };
      }
    } catch (e) {
      console.error('Device lock check failed, proceeding as a normal claim:', e);
    }

    const finalUsername = await db.runTransaction(async (tx) => {
      const baseDoc = await tx.get(baseRef);
      if (baseDoc.exists) {
        throw new Error('USERNAME_TAKEN');
      }
      tx.set(baseRef, {
        username: rawUsername,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),

        lastDeviceId: CLIENT_ID
      });
      return rawUsername;
    });

    devicesRef.doc(CLIENT_ID).set({
      username: finalUsername,
      claimedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch((e) => console.error('Could not persist device lock:', e));

    return { username: finalUsername, isNew: true };
  }

  const CHAT_UNLOCK_MS = 24 * 60 * 60 * 1000;
  let lastTapInAt = 0;

  let myStreak = 0;

  function formatTapInCount(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    if (totalSeconds >= 3600) return Math.ceil(totalSeconds / 3600) + 'h';
    if (totalSeconds >= 60) return Math.ceil(totalSeconds / 60) + 'm';
    return totalSeconds + 's';
  }

  function formatHms(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function isChatUnlocked() {
    return lastTapInAt > 0 && (CHAT_UNLOCK_MS - (Date.now() - lastTapInAt)) > 0;
  }

  function refreshChatGateState() {
    const status = $('chatGateStatus');
    const lockTimer = $('chatLockTimer');
    const input = $('msgInput');
    const sendBtn = $('sendBtn');
    if (!status || !lockTimer || !input || !sendBtn) return;
    clearTimeout(chatGateTimer);
    const remaining = CHAT_UNLOCK_MS - (Date.now() - lastTapInAt);
    const unlocked = lastTapInAt > 0 && remaining > 0;
    const screen = app.querySelector('.chat-screen');
    if (screen) screen.classList.toggle('is-chat-locked', !unlocked);
    input.disabled = !unlocked;
    sendBtn.disabled = !unlocked;
    input.placeholder = unlocked ? 'Type a message…' : 'Tap in above to chat…';
    const tapinBtn = $('tapinBtn');
    const tapinGate = $('tapinGate');
    if (tapinBtn) tapinBtn.classList.toggle('is-required', !unlocked);
    if (tapinGate) tapinGate.classList.toggle('is-locked', !unlocked);
    if (unlocked) {
      status.textContent = '';
      status.classList.remove('is-locked');
      lockTimer.textContent = '';
      chatGateTimer = setTimeout(refreshChatGateState, 1000);
    } else {
      status.textContent = 'Tap in to chat';
      status.classList.add('is-locked');
      lockTimer.textContent = '';
    }
    refreshFightPanel();

  const TAPIN_ICON_HTML = '<img class="tapin-btn-icon" src="/tapin-cheers.png" alt="">';

  function utcDayKey(ts) {
    return new Date(ts).toISOString().slice(0, 10);
  }

  function nextStreakAfterTapIn(ts) {
    const todayKey = utcDayKey(ts);
    if (myStreakDay === todayKey) return { streak: myStreak, day: todayKey };
    const yesterdayKey = utcDayKey(ts - 24 * 60 * 60 * 1000);
    return { streak: myStreakDay === yesterdayKey ? myStreak + 1 : 1, day: todayKey };
  }

  function fetchFirstPlaceStreak() {
    return devicesRef.orderBy('streak', 'desc').limit(15).get().then((snap) => {
      const todayKey = utcDayKey(Date.now());
      const yesterdayKey = utcDayKey(Date.now() - 24 * 60 * 60 * 1000);
      let first = null;
      snap.forEach((doc) => {
        if (first) return;
        const data = doc.data();
        if (!data.streak || (data.streakDay !== todayKey && data.streakDay !== yesterdayKey)) return;
        first = { username: data.username || '?', streak: data.streak };
      });
      return first;
    }).catch(() => null);

  const STREAK_BAR_VISIBLE_MS = 8000;

      wrap.classList.remove('is-visible');

      if (token !== streakBarToken || !wrap.classList.contains('is-visible') || !first) return;
      bar.insertAdjacentHTML('beforeend',
        `<span class="streak-bar-divider">|</span><span class="streak-bar-lb-entry"><img class="streak-medal-icon" src="/streak-medal-gold.png" alt=""> 1st place: ${escapeHtml(first.username)}</span>`
      );
    });
  }

  // Fights use the existing chat_messages subscription as their event stream.
  // Clicks stay in the browser. During a match a fighter publishes an
  // aggregate at most once a second, which keeps the tug live for everyone
  // without making every punch a Firestore write or adding another listener.
  const FIGHT_CHALLENGE_MS = 25 * 1000;
  const FIGHT_START_DELAY_MS = 3 * 1000;
  const FIGHT_DURATION_MS = 30 * 1000;
  const FIGHT_LIVE_SCORE_INTERVAL_MS = 1000;
  const FIGHT_RESULT_HOLD_MS = 8 * 1000;
  // The loser can publish a final result only if the winner's browser has
  // not done so after this short grace period. This prevents a disconnected
  // winner from leaving every screen at 0 seconds, without adding a normal
  // per-fight write or listener.
  const FIGHT_RESULT_FAILOVER_MS = 4500;
  // A leaderboard lookup is decorative; it must never be allowed to hold up
  // the result event. The known winner total is used as a display fallback.
  const FIGHT_RESULT_SCORE_SAVE_GRACE_MS = 1500;
  const FIGHT_RESULT_LEADER_GRACE_MS = 1500;
  const FIGHT_MISSING_SCORE_GRACE_MS = 5000;
  const FIGHT_STALE_CLEAR_MS = 20 * 1000;
  const FIGHT_COOLDOWN_MS = 10 * 60 * 1000;
  const FIGHT_REJECT_COOLDOWN_MS = 5 * 60 * 1000;
  const FIGHT_TARGET_ACTIVE_MS = 150 * 1000;
  const FIGHT_TARGET_CACHE_MS = 60 * 1000;
  const FIGHT_TARGET_EMPTY_RETRY_MS = 1600;

  let currentFight = null;
  let fightTicker = null;
  let fightExpiryTimer = null;
  let fightResultTimer = null;
  let fightOutcomeFallbackTimer = null;
  let fightCooldownTimer = null;
  let fightTargetFetchAt = 0;
  let fightTargetFetchInFlight = false;
  let fightTargetEmptyRetries = 0;
  let fightTargetRetryTimer = null;
  let fightTargetCooldownTimer = null;
  const fightPresenceTargets = new Map();
  const fightRejectedTargets = new Map();
  const FIGHT_REJECT_COOLDOWNS_KEY = 'knobsock_fight_reject_cooldowns_' + CLIENT_ID;
  const pendingOwnFightTimestamps = new Set();
  const FIGHT_PUNCH_SOURCES = [
    '/Punch1.mp3',
    '/Punch2.mp3',
    '/Punch3.mp3'
  ];
  const FIGHT_HIT_WORDS = ['POW!', "THAT'LL TEACH ’EM!", 'BAM!', 'WHAM!'];
  let fightPunchAudio = null;
  let fightPunchIndex = 0;
  let fightPunchAnimationTimer = null;
  let fightHitWordIndex = 0;

  function fightTargetKey(username) {
    return String(username || '').trim().toLowerCase();
  }

  function pruneFightRejectCooldowns() {
    const now = Date.now();
    let changed = false;
    fightRejectedTargets.forEach((until, target) => {
      if (!Number.isFinite(until) || until <= now) {
        fightRejectedTargets.delete(target);
        changed = true;
      }
    });
    return changed;
  }

  function saveFightRejectCooldowns() {
    pruneFightRejectCooldowns();
    try {
      const saved = {};
      fightRejectedTargets.forEach((until, target) => { saved[target] = until; });
      localStorage.setItem(FIGHT_REJECT_COOLDOWNS_KEY, JSON.stringify(saved));
    } catch (e) {}
  }

  function loadFightRejectCooldowns() {
    fightRejectedTargets.clear();
    try {
      const saved = JSON.parse(localStorage.getItem(FIGHT_REJECT_COOLDOWNS_KEY) || '{}');
      if (saved && typeof saved === 'object') {
        Object.keys(saved).forEach((target) => {
          const until = Number(saved[target]);
          if (target && Number.isFinite(until) && until > Date.now()) fightRejectedTargets.set(target, until);
        });
      }
    } catch (e) {}
  }

  function fightRejectCooldownRemaining(username) {
    const target = fightTargetKey(username);
    const until = Number(fightRejectedTargets.get(target)) || 0;
    const remaining = Math.max(0, until - Date.now());
    if (!remaining && until) {
      fightRejectedTargets.delete(target);
      saveFightRejectCooldowns();
    }
    return remaining;
  }

  function scheduleFightRejectCooldownRefresh() {
    clearTimeout(fightTargetCooldownTimer);
    const menu = $('fightMenu');
    if (!menu || !menu.classList.contains('is-open')) return;
    pruneFightRejectCooldowns();
    let next = Infinity;
    fightRejectedTargets.forEach((until) => { next = Math.min(next, until - Date.now()); });
    if (!Number.isFinite(next) || next <= 0) return;
    fightTargetCooldownTimer = setTimeout(() => {
      renderFightTargetList();
    }, Math.min(next, 1000));
  }

  function setFightRejectCooldown(username, until) {
    const target = fightTargetKey(username);
    const nextUntil = Number(until) || 0;
    if (!target || nextUntil <= Date.now()) return;
    if ((fightRejectedTargets.get(target) || 0) >= nextUntil) return;
    fightRejectedTargets.set(target, nextUntil);
    saveFightRejectCooldowns();
    const menu = $('fightMenu');
    if (menu && menu.classList.contains('is-open')) renderFightTargetList();
  }

  loadFightRejectCooldowns();
  window.addEventListener('storage', (event) => {
    if (event.key !== FIGHT_REJECT_COOLDOWNS_KEY) return;
    loadFightRejectCooldowns();
    const menu = $('fightMenu');
    if (menu && menu.classList.contains('is-open')) renderFightTargetList();
  });

  function isFightEvent(message) {
    return !!(message && typeof message.type === 'string' && message.type.indexOf('fight_') === 0);
  }

  function isFightParticipant(fight) {
    return !!(fight && session && (session.username === fight.challenger || session.username === fight.opponent));
  }

  function fightRole(fight) {
    if (!fight || !session) return 'spectator';
    if (session.username === fight.challenger) return 'challenger';
    if (session.username === fight.opponent) return 'opponent';
    return 'spectator';
  }

  function fightCooldownRemaining() {
    return Math.max(0, myFightCooldownUntil - Date.now());
  }

  function isFightOnCooldown() {
    return fightCooldownRemaining() > 0;
  }

  function formatFightCooldown(remaining) {
    const seconds = Math.max(0, Math.ceil(remaining / 1000));
    return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  }

  function scheduleFightCooldownRefresh() {
    clearTimeout(fightCooldownTimer);
    const remaining = fightCooldownRemaining();
    if (!remaining) return;
    fightCooldownTimer = setTimeout(refreshFightPanel, Math.min(remaining, 1000));
  }

  function setFightCooldown(until) {
    const nextUntil = Number(until) || 0;
    if (nextUntil <= Date.now() || nextUntil <= myFightCooldownUntil + 500) return;
    myFightCooldownUntil = nextUntil;
    let shouldPersist = true;
    try {
      const key = 'knobsock_fight_cooldown_' + CLIENT_ID;
      const alreadyPersisted = Number(localStorage.getItem(key)) || 0;
      shouldPersist = alreadyPersisted < nextUntil - 500;
      if (shouldPersist) localStorage.setItem(key, String(nextUntil));
    } catch (e) {}
    if (shouldPersist) {
      devicesRef.doc(CLIENT_ID).set({
        fightCooldownUntil: nextUntil
      }, { merge: true }).catch((error) => {
        console.error('Could not persist fight cooldown:', error);
      });
    }
    refreshFightPanel();
  }

  function playFightPunchSound() {
    if (!fightPunchAudio && typeof Audio !== 'undefined') {
      fightPunchAudio = FIGHT_PUNCH_SOURCES.map((src) => {
        const clip = new Audio(src);
        clip.preload = 'auto';
        return clip;
      });
    }
    if (!fightPunchAudio || !fightPunchAudio.length) return;
    const clip = fightPunchAudio[fightPunchIndex % fightPunchAudio.length];
    fightPunchIndex += 1;
    if (!clip) return;
    try {
      clip.pause();
      clip.currentTime = 0;
      const play = clip.play();
      if (play && typeof play.catch === 'function') play.catch(() => {});
    } catch (e) {}
  }

  function showFightHitWord(button) {
    const panel = $('fightPanel');
    if (!panel || !button) return;
    const olderWords = Array.from(panel.querySelectorAll('.fight-hit-word'));
    // Let a quick burst feel energetic without letting a rapid tapper cover
    // the whole small arena in labels.
    olderWords.slice(0, Math.max(0, olderWords.length - 2)).forEach((word) => word.remove());

    const word = document.createElement('span');
    word.className = 'fight-hit-word';
    word.textContent = FIGHT_HIT_WORDS[fightHitWordIndex % FIGHT_HIT_WORDS.length];
    fightHitWordIndex += 1;

    const panelRect = panel.getBoundingClientRect();
    const fistRect = button.getBoundingClientRect();
    const wobble = ((fightHitWordIndex % 3) - 1) * 7;
    const x = Math.max(18, Math.min(panelRect.width - 22, fistRect.left - panelRect.left + fistRect.width * .72 + wobble));
    const y = Math.max(16, fistRect.top - panelRect.top + fistRect.height * .18);
    word.style.setProperty('--fight-hit-x', x + 'px');
    word.style.setProperty('--fight-hit-y', y + 'px');
    panel.appendChild(word);
    setTimeout(() => word.remove(), 760);
  }

  function makeFightId() {
    return 'fight_' + CLIENT_ID.replace(/[^a-z0-9]/gi, '').slice(0, 12) + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function emitFightEvent(type, data) {
    const ts = Date.now();
    pendingOwnFightTimestamps.add(ts);
    setTimeout(() => pendingOwnFightTimestamps.delete(ts), 30000);
    // Keep the event compatible with the ordinary chat-message write shape.
    // Some deployed rules require a sender name and text even for typed
    // system events; omitting them made a challenge silently fail there.
    return messagesRef.add(Object.assign({
      type: type,
      username: (session && session.username) || '',
      text: 'fight event',
      ts: ts,
      deviceId: CLIENT_ID
    }, data || {}));
  }

  function rememberFightTarget(username, seenAt) {
    if (!username || !session || username === session.username) return;
    const stamp = typeof seenAt === 'number' ? seenAt : Date.now();
    fightPresenceTargets.set(username, Math.max(fightPresenceTargets.get(username) || 0, stamp));
  }

  function activeFightTargets() {
    const now = Date.now();
    const cutoff = now - FIGHT_TARGET_ACTIVE_MS;
    fightPresenceTargets.forEach((seenAt, username) => {
      if (seenAt < cutoff) fightPresenceTargets.delete(username);
    });
    if (typeof messageCache !== 'undefined') {
      messageCache.forEach((message) => {
        if (!message || isFightEvent(message) || message.ts < cutoff) return;
        rememberFightTarget(message.username, message.ts);
      });
    }
    return Array.from(fightPresenceTargets.entries())
      .filter((entry) => entry[1] >= cutoff)
      .map((entry) => entry[0])
      .filter((username) => username && (!session || username !== session.username))
      .sort((a, b) => a.localeCompare(b));
  }

  const FIGHT_PAGE_SIZE = 5;
  let fightPage = 0;

  function updateFightPager(total) {
    const pages = Math.max(1, Math.ceil(total / FIGHT_PAGE_SIZE));
    fightPage = Math.min(Math.max(0, fightPage), pages - 1);
    const prev = $('fightPrev');
    const next = $('fightNext');
    const label = $('fightPageLabel');
    if (prev) prev.disabled = fightPage === 0;
    if (next) next.disabled = fightPage >= pages - 1;
    if (label) label.textContent = 'Page ' + (fightPage + 1);
  }

  function renderFightTargetList() {
    const list = $('fightTargetList');
    if (!list) return;
    pruneFightRejectCooldowns();
    if (isFightOnCooldown()) {
      list.innerHTML = '<div class="fight-target-empty">You can challenge again in ' +
        formatFightCooldown(fightCooldownRemaining()) + '.</div>';
      updateFightPager(0);
      return;
    }
    const targets = activeFightTargets();
    updateFightPager(targets.length);
    if (!targets.length) {
      list.innerHTML = fightTargetFetchInFlight || !fightTargetFetchAt
        ? '<div class="fight-target-empty is-loading">Checking active chatters…</div>'
        : '<div class="fight-target-empty">No chatters online right now.</div>';
      return;
    }
    list.innerHTML = targets.slice(fightPage * FIGHT_PAGE_SIZE, (fightPage + 1) * FIGHT_PAGE_SIZE).map((username) => {
      const rejectRemaining = fightRejectCooldownRemaining(username);
      if (rejectRemaining) {
        return '<button type="button" class="fight-target is-on-cooldown" disabled aria-label="' + escapeHtml(username) + ' declined your challenge. Try again in ' + formatFightCooldown(rejectRemaining) + '">' +
          '<span>' + escapeHtml(username) + '</span><span class="fight-target-cooldown">Try again ' + formatFightCooldown(rejectRemaining) + '</span></button>';
      }
      return '<button type="button" class="fight-target" data-fight-target="' + escapeHtml(username) + '">' + escapeHtml(username) + '</button>';
    }).join('');
    list.querySelectorAll('[data-fight-target]').forEach((button) => {
      button.addEventListener('click', function () {
        const target = this.getAttribute('data-fight-target');
        closeFightMenu();
        beginFightChallenge(target);
      });
    });
    scheduleFightRejectCooldownRefresh();
  }

  function queueFightTargetRetry() {
    clearTimeout(fightTargetRetryTimer);
    fightTargetRetryTimer = setTimeout(() => {
      const menu = $('fightMenu');
      if (!menu || !menu.classList.contains('is-open') || currentFight || isFightOnCooldown()) return;
      fetchActiveFightTargets({ force: true });
    }, FIGHT_TARGET_EMPTY_RETRY_MS);
  }

  function fetchActiveFightTargets(options) {
    const force = !!(options && options.force);
    if (fightTargetFetchInFlight || (!force && Date.now() - fightTargetFetchAt < FIGHT_TARGET_CACHE_MS)) return;
    fightTargetFetchInFlight = true;
    renderFightTargetList();
    db.collection('chat_presence')
      .where('lastSeen', '>', Date.now() - FIGHT_TARGET_ACTIVE_MS)
      .get()
      .then((snapshot) => {
        snapshot.forEach((doc) => {
          const data = doc.data() || {};
          const decodePresenceName = window.KNOBSOCK_PRESENCE_USERNAME_FROM_ID;
          const username = typeof data.username === 'string'
            ? data.username
            : (typeof decodePresenceName === 'function' ? decodePresenceName(doc.id) : '');
          if (username) rememberFightTarget(username, data.lastSeen);
        });
      })
      .catch(() => {
        // The cached chatters still make the menu useful if presence reads are
        // restricted by an older Firestore ruleset.
      })
      .finally(() => {
        fightTargetFetchInFlight = false;
        fightTargetFetchAt = Date.now();
        const menu = $('fightMenu');
        if (!menu || !menu.classList.contains('is-open')) return;
        renderFightTargetList();
        if (!activeFightTargets().length && fightTargetEmptyRetries < 1) {
          fightTargetEmptyRetries += 1;
          queueFightTargetRetry();
        }
      });
  }

  function closeFightMenu() {
    const menu = $('fightMenu');
    const button = $('fightBtn');
    clearTimeout(fightTargetRetryTimer);
    clearTimeout(fightTargetCooldownTimer);
    if (menu) menu.classList.remove('is-open');
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  function closeAccountMenu() {
    const menu = $('accountMenu');
    const button = $('accountNameBtn');
    if (menu) menu.classList.remove('is-open');
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  const VIEWER_PAGE_SIZE = 5;
  const VIEWER_ACTIVE_MS = 270000;
  const VIEWER_CACHE_MS = 60000;
  let viewerPaging = null;

  function closeViewerMenu() {
    const menu = $('viewerMenu');
    const button = $('viewersBtn');
    if (menu) menu.classList.remove('is-open');
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  function toggleViewerMenu() {
    const menu = $('viewerMenu');
    const button = $('viewersBtn');
    if (!menu || !button) return;
    const open = !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
    if (!open) return;
    closeFightMenu();
    closeAccountMenu();
    if (!viewerPaging || Date.now() - viewerPaging.fetchedAt > VIEWER_CACHE_MS) {
      viewerPaging = {
        cutoff: Date.now() - VIEWER_ACTIVE_MS,
        fetchedAt: Date.now(),
        pages: [],
        lastDocs: [],
        full: [],
        page: 0,
        loading: false,
        error: false
      };
      loadViewerPage(0);
    } else {
      renderViewerMenu();
    }
  }

  function loadViewerPage(index) {
    const paging = viewerPaging;
    if (!paging || paging.loading || index < 0) return;
    if (paging.pages[index]) {
      paging.page = index;
      renderViewerMenu();
      return;
    }
    if (index > 0 && !paging.full[index - 1]) return;
    let query = db.collection('chat_presence')
      .where('lastSeen', '>', paging.cutoff)
      .orderBy('lastSeen', 'desc')
      .limit(VIEWER_PAGE_SIZE);
    if (index > 0) query = query.startAfter(paging.lastDocs[index - 1]);
    paging.loading = true;
    paging.error = false;
    renderViewerMenu();
    query.get().then((snapshot) => {
      if (viewerPaging !== paging) return;
      paging.loading = false;
      if (!snapshot.docs.length && index > 0) {
        paging.full[index - 1] = false;
        renderViewerMenu();
        return;
      }
      const decode = window.KNOBSOCK_PRESENCE_USERNAME_FROM_ID;
      const names = [];
      let guests = 0;
      snapshot.docs.forEach((doc) => {
        const name = typeof decode === 'function' ? decode(doc.id) : '';
        if (name) names.push(name);
        else guests += 1;
      });
      paging.pages[index] = { names, guests };
      paging.lastDocs[index] = snapshot.docs[snapshot.docs.length - 1];
      paging.full[index] = snapshot.docs.length === VIEWER_PAGE_SIZE;
      paging.page = index;
      renderViewerMenu();
    }).catch(() => {
      if (viewerPaging !== paging) return;
      paging.loading = false;
      paging.error = true;
      renderViewerMenu();
    });
  }

  function renderViewerMenu() {
    const list = $('viewerList');
    if (!list) return;
    const paging = viewerPaging;
    const heading = $('viewerMenuHeading');
    const countEl = document.getElementById('activeViewersCount');
    const count = countEl ? parseInt(countEl.textContent, 10) : NaN;
    if (heading) heading.textContent = count > 0 ? 'Who’s watching · ' + count : 'Who’s watching';
    const page = paging && paging.pages[paging.page];
    if (!page && (!paging || paging.loading)) {
      list.innerHTML = '<div class="fight-target-empty is-loading">Loading viewers…</div>';
    } else if (!page && paging.error) {
      list.innerHTML = '<div class="fight-target-empty">Couldn’t load viewers. Try again in a bit.</div>';
    } else if (!page || (!page.names.length && !page.guests)) {
      list.innerHTML = '<div class="fight-target-empty">No one’s here right now.</div>';
    } else {
      const me = session ? session.username.toLowerCase() : '';
      list.innerHTML = page.names.map((name) => {
        const you = name.toLowerCase() === me;
        return '<button type="button" class="fight-target viewer-item' + (you ? ' is-you' : '') + '" data-username="' + escapeHtml(name) + '">' +
          '<span>' + escapeHtml(name) + '</span>' + (you ? '<span class="viewer-you">you</span>' : '') + '</button>';
      }).join('') +
        (page.guests ? '<div class="viewer-guests">+ ' + page.guests + (page.guests === 1 ? ' guest' : ' guests') + '</div>' : '');
    }
    const prev = $('viewerPrev');
    const next = $('viewerNext');
    const label = $('viewerPageLabel');
    const hasOlder = !!paging && (paging.page < paging.pages.length - 1 || !!paging.full[paging.page]);
    if (prev) prev.disabled = !paging || paging.loading || paging.page === 0;
    if (next) next.disabled = !paging || paging.loading || !hasOlder;
    if (label) label.textContent = paging && paging.loading ? 'Loading…' : 'Page ' + ((paging ? paging.page : 0) + 1);
  }

  function jumpViewerArrow(el) {
    if (!el || el.disabled) return;
    el.classList.remove('is-jump');
    void el.offsetWidth;
    el.classList.add('is-jump');
    el.addEventListener('animationend', () => el.classList.remove('is-jump'), { once: true });
  }

  function toggleAccountMenu() {
    const menu = $('accountMenu');
    const button = $('accountNameBtn');
    if (!menu || !button) return;
    const open = !menu.classList.contains('is-open');
    if (open) {
      closeFightMenu();
      closeViewerMenu();
      const bar = menu.parentElement;
      if (bar) {
        const gap = 6;
        const nameTop = button.getBoundingClientRect().top - bar.getBoundingClientRect().top;
        menu.style.bottom = (bar.clientHeight - nameTop + gap) + 'px';
      }
    }
    menu.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
  }

  const PROFILE_POPUP_CSS = `

`;
  const PROFILE_VARS = ['--ink', '--line', '--text', '--text-dim', '--accent', '--accent-dim', '--interactive-hover', '--interactive-hover-text', '--font-body'];
  let profileScrollLock = '';

  function profileDoc() {
    try {
      if (window.top && window.top.document && window.top.document.body) return window.top.document;
    } catch (e) {}
    return document;
  }

  function pq(id) {
    return profileDoc().getElementById(id);
  }

  function profileKeydown(event) {
    if (event.key === 'Escape') closeProfile();
  }

  const PROFILE_CLOSE_MS = 380;

  function removeProfileRoot(doc, root) {
    if (root && root.parentNode) root.remove();
    if (!doc.getElementById('knobsockProfile')) doc.documentElement.style.overflow = profileScrollLock;
  }

  function ensureProfilePopup() {
    const doc = profileDoc();
    const closing = doc.getElementById('knobsockProfile');
    if (closing && closing.classList.contains('is-closing')) removeProfileRoot(doc, closing);
    if (!doc.getElementById('knobsockProfileStyle')) {
      const style = doc.createElement('style');
      style.id = 'knobsockProfileStyle';
      style.textContent = PROFILE_POPUP_CSS;
      doc.head.appendChild(style);
    }
    let root = doc.getElementById('knobsockProfile');
    if (root) return root;
    root = doc.createElement('div');
    root.id = 'knobsockProfile';
    root.innerHTML = '<div class="kp-backdrop" id="knobsockProfileBackdrop"></div>' +
      '<div class="kp-frame" id="profilePanel" role="dialog" aria-modal="true" aria-label="Profile"></div>';
    const vars = getComputedStyle(document.documentElement);
    PROFILE_VARS.forEach((name) => {
      const value = vars.getPropertyValue(name).trim();
      if (value) root.style.setProperty(name, value);
    });
    doc.body.appendChild(root);
    doc.getElementById('knobsockProfileBackdrop').addEventListener('click', closeProfile);
    wireProfileSwipe(doc, root);
    doc.addEventListener('keydown', profileKeydown);
    if (doc !== document) document.addEventListener('keydown', profileKeydown);
    profileScrollLock = doc.documentElement.style.overflow;
    doc.documentElement.style.overflow = 'hidden';
    return root;
  }

  function wireProfileSwipe(doc, root) {
    const frame = root.querySelector('.kp-frame');
    const backdrop = root.querySelector('.kp-backdrop');
    if (!frame || !backdrop) return;
    const OUT_MS = 300;
    let startX = 0;
    let startY = 0;
    let startAt = 0;
    let armed = false;
    let engaged = false;
    let dy = 0;
    let lastSwipeAt = 0;

    function card() {
      return frame.querySelector('.profile-card');
    }

    function atBottom(el) {
      return !el || el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
    }

    function setDrag(offset) {
      const travel = frame.offsetTop + frame.offsetHeight;
      frame.style.transform = 'translateY(' + offset + 'px)';
      backdrop.style.opacity = String(Math.max(0, 1 + offset / Math.max(1, travel)));
    }

    function settle(offset, ms, done) {
      frame.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.2, 0.7, 0.3, 1)';
      backdrop.style.transition = 'opacity ' + ms + 'ms ease';
      void frame.offsetHeight;
      setDrag(offset);
      setTimeout(() => {
        frame.style.transition = '';
        backdrop.style.transition = '';
        if (done) done();
      }, ms + 20);
    }

    function dismiss() {
      root.classList.add('is-closing');
      releaseProfile(doc);
      settle(-(frame.offsetTop + frame.offsetHeight + 40), OUT_MS, () => removeProfileRoot(doc, root));
    }

    frame.addEventListener('touchstart', (e) => {
      armed = false;
      engaged = false;
      dy = 0;
      if (e.touches.length !== 1 || profileEditing || root.classList.contains('is-closing')) return;
      if (e.target.closest && e.target.closest('input, textarea, select, .profile-song-progress')) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startAt = Date.now();
      armed = atBottom(card());
    }, { passive: true });

    frame.addEventListener('touchmove', (e) => {
      if (!armed) return;
      const moveY = e.touches[0].clientY - startY;
      const moveX = e.touches[0].clientX - startX;
      if (!engaged) {
        if (moveY > 0) { armed = false; return; }
        if (e.cancelable) e.preventDefault();
        if (moveY > -6 || Math.abs(moveX) > Math.abs(moveY)) return;
        engaged = true;
        frame.style.animation = 'none';
        backdrop.style.animation = 'none';
        frame.style.transition = 'none';
        backdrop.style.transition = 'none';
      }
      if (e.cancelable) e.preventDefault();
      dy = Math.min(0, moveY);
      setDrag(dy);
    }, { passive: false });

    function end() {
      if (!engaged) { armed = false; return; }
      armed = false;
      engaged = false;
      lastSwipeAt = Date.now();
      const fast = -dy / Math.max(1, Date.now() - startAt) > 0.5;
      if (-dy > 80 || (fast && -dy > 20)) dismiss();
      else settle(0, 220, () => { frame.style.transform = ''; backdrop.style.opacity = ''; });
    }

    frame.addEventListener('touchend', end);
    frame.addEventListener('touchcancel', end);
    frame.addEventListener('click', (e) => {
      if (Date.now() - lastSwipeAt < 500) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);

  const PROFILE_DEFAULT_BORDER = '#ffff00';

  const profileCache = {};
  let profileViewing = null;
  let profileEditing = false;

  function cacheProfileDoc(key, data) {
    profileCache[key] = { data: data || {}, at: Date.now() };
  }

  function fetchProfileDoc(username) {
    const key = String(username).toLowerCase();
    const mine = session && key === session.username.toLowerCase();
    const hit = profileCache[key];
    if (hit && (mine || Date.now() - hit.at < PROFILE_CACHE_MS)) return Promise.resolve(hit.data);
    return usernamesRef.doc(key).get().then((doc) => {
      const data = doc.exists ? doc.data() : {};
      cacheProfileDoc(key, data);
      return data;
    });
  }

  function markSeen() {
    if (!session) return;
    const key = session.username.toLowerCase();
    const storeKey = 'knobsock_last_seen_' + key;
    let last = 0;
    try { last = Number(localStorage.getItem(storeKey)) || 0; } catch (e) {}
    if (Date.now() - last < LAST_SEEN_WRITE_MS) return;
    try { localStorage.setItem(storeKey, String(Date.now())); } catch (e) {}

  }

  function safeHex(value, fallback) {

  function normalizeSocial(kind, raw) {
    let value = String(raw || '').trim();
    if (!value) return '';
    value = value.replace(/^https?:\/\//i, '').replace(/^(www\.|m\.)/i, '');
    if (kind === 'instagram') {

    if (kind === 'tiktok') {

      value = value.replace(/^tiktok\.com\//i, '').replace(/^@/, '').split(/[/?#]/)[0];
