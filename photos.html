<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/photos">
<meta property="og:title" content="Photos - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Photos - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as music.html/videos.html/live.html. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the photo widget's own orange palette (its --ink) instead
       of the tiled GeoCities GIF every other non-widget page here uses,
       so the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: radial-gradient(ellipse at top, #431c00 0%, #000000 70%);
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(4px, 1.5vw, 12px);
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the content area's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The photo widget fills whatever room it's given (it's built at
     100% width/height with its own frosted panels), same as
     live.html's player-wrap — no postMessage height contract needed
     since, unlike the video/music widgets, there's no single natural
     aspect ratio to size it from. */
  .content-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  .content-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/" target="_top">
    <img src="/knobsock-photos-logo.png" alt="KNOBSOCK PHOTOS">
  </a>

  <div class="content-wrap">
    <iframe src="/photos-widget.html"
            title="KNOBSOCK Photos"
            allow="clipboard-write; fullscreen"
            loading="lazy"
            allowfullscreen></iframe>
  </div>
</div>

<script>
// Same knobsock-widget-height contract videos.html uses on
// video-playlist-widget.html — sizes .content-wrap to the widget's own
// natural height instead of letting it stretch to fill the viewport,
// which is what was elongating the black photo pane on tall/4K/8K
// windows. Desktop only; the CSS above is left to size it on phones.
(function () {
  var wrap = document.querySelector('.content-wrap');
  var frame = wrap.querySelector('iframe');
  var MOBILE = 860;

  function clear() {
    wrap.style.flex = '';
    wrap.style.height = '';
    wrap.style.minHeight = '';
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || e.data.type !== 'knobsock-widget-height') return;
    if (window.innerWidth <= MOBILE) { clear(); return; }
    wrap.style.flex = '0 0 auto';
    wrap.style.minHeight = '0';
    var available = window.innerHeight - wrap.getBoundingClientRect().top - 12;
    wrap.style.height = Math.min(e.data.height, Math.max(260, available)) + 'px';
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth <= MOBILE) clear();
  });
})();
</script>

</body>
</html>
