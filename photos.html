<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/photos">
<meta property="og:title" content="Photos - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Photos - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as music.html/videos.html/live.html. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the photo widget's own orange palette (its --ink) instead
       of the tiled GeoCities GIF every other non-widget page here uses,
       so the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: #431c00;
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the content area's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The photo widget fills whatever room it's given (it's built at
     100% width/height with its own frosted panels), same as
     live.html's player-wrap — it's meant to stretch and scale up on a
     tall/4K/8K window rather than being capped to a "natural" height.
     (The script below handles a separate, unrelated contract: briefly
     expanding the iframe to the full viewport while the widget's photo
     zoom overlay is open.) */
  .content-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  .content-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it grow/scroll — the widget's own photo grid already has its
     own internal overflow-y:auto (see photos-widget.html), so scrolling
     stays inside the widget instead of moving the logo off-screen.
     min-height:0 (replacing the desktop floor above) lets .content-wrap
     shrink to whatever's actually left below the logo on a very short
     phone, letterboxing the widget slightly rather than overflowing the
     locked page. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .content-wrap {
      min-height: 0;
    }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/" target="_top">
    <img src="/knobsock-photos-logo.png" alt="KNOBSOCK PHOTOS">
  </a>

  <div class="content-wrap">
    <iframe src="/photos-widget.html"
            title="KNOBSOCK Photos"
            allow="clipboard-write; fullscreen"
            loading="lazy"
            allowfullscreen></iframe>
  </div>
</div>

<script>
// Lightbox open/close: the widget's zoom overlay is `position: fixed`,
// which inside an iframe is relative to the IFRAME'S OWN box — not the
// browser window. .content-wrap just stretches to fill the page (see the
// CSS above), so this is only needed because the overlay itself doesn't
// automatically cover the logo above it — while it's open we blow the
// iframe up to the full viewport (escaping .content-wrap via fixed
// positioning), then hand sizing back to the normal flow on close.
(function () {
  var frame = document.querySelector('.content-wrap iframe');

  function expandFrameFullscreen() {
    frame.style.position = 'fixed';
    frame.style.inset = '0';
    frame.style.width = '100vw';
    frame.style.height = '100dvh';
    frame.style.zIndex = '99999';
    document.body.style.overflow = 'hidden';
  }

  function restoreFrameSizing() {
    frame.style.position = '';
    frame.style.inset = '';
    frame.style.width = '';
    frame.style.height = '';
    frame.style.zIndex = '';
    document.body.style.overflow = '';
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data) return;
    if (e.data.type === 'knobsock-lightbox-open') expandFrameFullscreen();
    else if (e.data.type === 'knobsock-lightbox-close') restoreFrameSizing();
  });
})();
</script>

</body>
</html>
