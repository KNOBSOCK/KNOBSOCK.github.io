<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOBSOCK Chat Monitor</title>
<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #3a0a0a;
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;

    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  #app {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }

  #viewerBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 16px 0;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    font-family: Tahoma, Arial, sans-serif;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  #viewerBar svg { width: 18px; height: 18px; fill: #fff; flex: none; }

  #messages {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    gap: 10px;
    padding: 16px;
    overflow-y: auto;

    overscroll-behavior: contain;
  }

  .msg {
    font-size: 20px;
    line-height: 1.35;
    color: #fff;
    word-wrap: break-word;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    animation: msgIn 0.25s ease-out;
  }
  .msg .msg-name {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: none;
    color: inherit;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    margin: 0;
    padding: 0;
    text-shadow: inherit;
  }
  .msg .msg-name:hover { text-decoration: underline; }
  .msg-reply-tag {
    display: inline-block;
    padding: 1px 7px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
    vertical-align: 2px;
    text-shadow: none;
    white-space: nowrap;
  }
  .msg .msg-name:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
    border-radius: 2px;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-wrap[hidden] { display: none; }
  .login-card {
    width: 100%;
    max-width: 320px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 180, 150, 0.35);
    border-radius: 12px;
    padding: 24px;
  }
  .login-card h1 {
    margin: 0 0 4px;
    font-size: 18px;
    color: #fff;
  }
  .login-card p.sub {
    margin: 0 0 18px;
    color: #f5c9c9;
    font-size: 12px;
  }
  .field-label {
    display: block;
    font-size: 11px;
    color: #f5c9c9;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 12px 0 6px;
  }
  .field-label:first-of-type { margin-top: 0; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 180, 150, 0.35);
    border-radius: 6px;
    color: #fff;
    padding: 8px 10px;
    font-size: 14px;
  }
  input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: #cd3232;
  }
  .btn {
    -webkit-appearance: none;
    appearance: none;
    border: 1px solid rgba(255, 180, 150, 0.35);
    background: rgba(0, 0, 0, 0.3);
    color: #fff;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { border-color: #cd3232; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: #cd3232; border-color: #cd3232; }
  .btn-primary:hover { background: #e04747; }
  .login-actions { margin-top: 16px; display: flex; justify-content: flex-end; }
  .error-text { color: #ffb3b3; font-size: 12px; margin-top: 10px; min-height: 14px; }

  #statusBar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 16px 0;
  }
  #locationControls { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #locationShareStatus { color: #f5c9c9; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #locationShareBtn { min-height: 36px; padding: 7px 10px; white-space: nowrap; }
  #signOutBtn {
    background: none;
    border: none;
    color: #f5c9c9;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px 0;
  }
  #signOutBtn:hover { color: #fff; }

  @media (max-width: 420px) {
    #statusBar { padding: 8px 12px 0; }
    #locationControls { gap: 6px; }
    #locationShareStatus { font-size: 10px; max-width: 112px; }
  }

  .moderation-overlay {
    position: fixed;
    z-index: 10;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(18, 0, 0, 0.72);
  }
  .moderation-overlay[hidden] { display: none; }
  .moderation-card {
    display: flex;
    flex-direction: column;
    width: min(560px, 100%);
    max-height: min(720px, calc(100dvh - 32px));
    overflow: hidden;
    padding: 18px;
    color: #fff;
    background: #4a0d0d;
    border: 1px solid rgba(255, 180, 150, 0.45);
    border-radius: 12px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
  }
  .moderation-card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .moderation-card-head h2 {
    min-width: 0;
    margin: 0;
    overflow: hidden;
    font-size: 18px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .moderation-close {
    flex: none;
    margin-left: auto;
    color: #f5c9c9;
    background: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    text-decoration: underline;
  }
  .moderation-close:hover { color: #fff; }
  .moderation-meta,
  .moderation-history-status,
  .moderation-action-status {
    min-height: 16px;
    margin-top: 7px;
    color: #f5c9c9;
    font-size: 12px;
    line-height: 1.35;
  }
  .moderation-history-title {
    margin: 16px 0 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .moderation-history-list {
    min-height: 112px;
    max-height: 32dvh;
    margin-top: 8px;
    overflow-y: auto;
    border: 1px solid rgba(255, 180, 150, 0.25);
    border-radius: 7px;
    background: rgba(0, 0, 0, 0.18);
  }
  .moderation-log-body { flex: 1 1 auto; min-width: 0; }
  .moderation-log-delete {
    flex: none;
    padding: 4px 10px;
    border: 1px solid rgba(255, 180, 150, 0.45);
    border-radius: 999px;
    background: transparent;
    color: #f5c9c9;
    cursor: pointer;
    font: 700 12px Tahoma, Arial, sans-serif;
  }
  .moderation-log-delete:hover { border-color: #ff6b6b; background: #c62828; color: #fff; }
  .moderation-log-delete:disabled { cursor: default; opacity: 0.4; }
  .moderation-log {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 10px;
    border-bottom: 1px solid rgba(255, 180, 150, 0.16);
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }
  .moderation-log:last-child { border-bottom: 0; }
  .moderation-log-time {
    display: block;
    margin-bottom: 2px;
    color: #f5c9c9;
    font-size: 11px;
  }
  .moderation-empty { padding: 14px 10px; color: #f5c9c9; font-size: 13px; }
  .moderation-pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 9px;
    min-height: 31px;
    margin-top: 8px;
  }
  .moderation-page-label { min-width: 48px; color: #f5c9c9; font-size: 12px; text-align: center; }
  .moderation-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    margin-top: 16px;
  }
  .moderation-controls select {
    min-width: 0;
    color: #fff;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 180, 150, 0.35);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  .moderation-controls select:focus { outline: none; border-color: #cd3232; }
  .moderation-reason { margin-top: 8px; }

  @media (max-width: 420px) {
    .moderation-overlay { align-items: flex-end; padding: 8px; }
    .moderation-card { max-height: calc(100dvh - 16px); padding: 14px; }
    .moderation-history-list { max-height: 28dvh; }
    .moderation-controls { grid-template-columns: 1fr; }
  }
  .chat-emoji {
    display: inline-block;
    width: 1.35em;
    height: 1.35em;
    object-fit: contain;
    vertical-align: -0.28em;
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>KNOBSOCK Chat Monitor</h1>
    <div id="admin2faRoot"></div>
    <div class="error-text" id="loginError"></div>
  </div>
</div>

<div id="app" hidden>
  <div id="statusBar">
    <div id="locationControls" role="group" aria-label="Stream location sharing">
      <button type="button" class="btn btn-primary" id="locationShareBtn" aria-pressed="false">Share location</button>
      <span id="locationShareStatus" aria-live="polite">Location sharing is off.</span>
    </div>
    <button type="button" id="signOutBtn">Sign Out</button>
  </div>
  <div id="viewerBar">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span id="viewerCount">0</span>&nbsp;watching
  </div>
  <div id="messages"></div>
</div>

<div class="moderation-overlay" id="moderationOverlay" hidden>
  <section class="moderation-card" role="dialog" aria-modal="true" aria-labelledby="moderationTitle">
    <div class="moderation-card-head">
      <h2 id="moderationTitle">Chat history</h2>
      <button type="button" class="moderation-close" id="moderationCloseBtn">Close</button>
    </div>
    <div class="moderation-meta" id="moderationMeta"></div>
    <h3 class="moderation-history-title">Chat history</h3>
    <div class="moderation-history-status" id="moderationHistoryStatus"></div>
    <div class="moderation-history-list" id="moderationHistoryList"></div>
    <div class="moderation-pagination" id="moderationPagination">
      <button type="button" class="btn" id="moderationPreviousBtn">Newer</button>
      <span class="moderation-page-label" id="moderationPageLabel"></span>
      <button type="button" class="btn" id="moderationNextBtn">Older</button>
    </div>
    <div class="moderation-controls">
      <select id="moderationDuration" aria-label="Moderation action">
        <option value="3600000">Timeout — 1 hour</option>
        <option value="86400000">Timeout — 24 hours</option>
        <option value="604800000">Timeout — 7 days</option>
        <option value="permanent">Ban — permanent</option>
      </select>
      <button type="button" class="btn btn-primary" id="moderationApplyBtn">Apply timeout</button>
    </div>
    <input class="moderation-reason" type="text" id="moderationReason" maxlength="500" aria-label="Reason, optional" placeholder="Reason (optional, shown to them)">
    <div class="moderation-action-status" id="moderationActionStatus"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin-2fa.js?v=5"></script>

<script>
(function () {

  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const messagesRef = db.collection('chat_messages');
  const usernamesRef = db.collection('chat_usernames');
  const bansRef = db.collection('chat_bans');
  const configRef = db.collection('chat_config');


  const loginWrap = document.getElementById('loginWrap');
  const appEl = document.getElementById('app');
  const loginError = document.getElementById('loginError');
  const admin2faRoot = document.getElementById('admin2faRoot');
  let adminExpiryTimer = null;
  const locationShareBtn = document.getElementById('locationShareBtn');
  const locationShareStatus = document.getElementById('locationShareStatus');
  const openedFromLocationLink = new URLSearchParams(window.location.search).has('location-share');
  const LOCATION_ENDPOINT = 'https://ypofuhazhxtzvtywguew.supabase.co/functions/v1/stream-location';
  const LOCATION_API_KEY = 'sb_publishable_IJH4--fqVrrTrxG7Ou1JKw_G2WPOiIO';
  let locationWatchId = null;
  let locationHeartbeat = null;
  let lastLocationPosition = null;
  let locationSending = false;
  let locationSendPromise = null;
  let locationSharing = false;

  function setLocationStatus(message) {
    locationShareStatus.textContent = message;
    locationShareBtn.textContent = locationSharing ? 'Stop sharing' : 'Share location';
    locationShareBtn.setAttribute('aria-pressed', String(locationSharing));
  }

  function stopLocationWatch() {
    stopCompass();
    if (locationWatchId !== null) navigator.geolocation.clearWatch(locationWatchId);
    if (locationHeartbeat !== null) clearInterval(locationHeartbeat);
    locationWatchId = null;
    locationHeartbeat = null;
    lastLocationPosition = null;
    locationSharing = false;
    locationShareBtn.disabled = false;
    locationShareBtn.textContent = 'Share location';
    locationShareBtn.setAttribute('aria-pressed', 'false');
  }

  async function locationAuthHeaders() {
    const token = await window.KnobsockAdmin2FA.getAccessToken();
    const headers = { Authorization: 'Bearer ' + token, apikey: LOCATION_API_KEY };
    lastAuthHeaders = headers;
    return headers;
  }

  let lastAuthHeaders = null;
  let compassWriterKey = null;
  const HEADING_RPC = LOCATION_ENDPOINT.split('/functions/')[0] + '/rest/v1/rpc/set_stream_heading';
  let compassState = 'off';
  let compassListening = false;
  let compassVector = null;
  let compassHeading = null;
  let compassSentHeading = null;
  let compassSentAt = 0;
  let compassSending = false;
  let compassTimer = null;
  const COMPASS_MIN_TURN = 4;
  const COMPASS_SETTLE_TURN = 1.5;
  const COMPASS_SETTLE_MS = 300;
  const COMPASS_MIN_GAP_MS = 500;
  const COMPASS_HEARTBEAT_MS = 15000;
  let compassMotionRef = null;
  let compassLastMotionAt = 0;

  function requestCompassPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      return DeviceOrientationEvent.requestPermission().catch(function () { return 'denied'; });
    }
    return Promise.resolve(typeof DeviceOrientationEvent !== 'undefined' ? 'granted' : 'unavailable');
  }

  function compassReading(event) {
    let heading = null;
    if (typeof event.webkitCompassHeading === 'number' && event.webkitCompassHeading >= 0) {
      if (typeof event.webkitCompassAccuracy === 'number' && event.webkitCompassAccuracy < 0) return null;
      heading = event.webkitCompassHeading;
    } else if (event.absolute && typeof event.alpha === 'number') {
      heading = 360 - event.alpha;
    }
    if (heading === null || !isFinite(heading)) return null;
    const screenAngle = screen.orientation && typeof screen.orientation.angle === 'number'
      ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? window.orientation : 0);
    return ((heading + screenAngle) % 360 + 360) % 360;
  }

  function onCompassEvent(event) {
    const reading = compassReading(event);
    if (reading === null) return;
    const radians = reading * Math.PI / 180;
    const x = Math.cos(radians), y = Math.sin(radians);
    compassVector = compassVector ? { x: compassVector.x * 0.85 + x * 0.15, y: compassVector.y * 0.85 + y * 0.15 } : { x, y };
    compassHeading = ((Math.atan2(compassVector.y, compassVector.x) * 180 / Math.PI) % 360 + 360) % 360;
    if (compassMotionRef === null || turnBetween(compassHeading, compassMotionRef) > 1) {
      compassMotionRef = compassHeading;
      compassLastMotionAt = Date.now();
    }
    if (compassState !== 'on') {
      compassState = 'on';
      if (locationSharing && lastLocationPosition) setLocationStatus(sharingStatusText());
    }
    maybeSendHeading();
  }

  function turnBetween(a, b) {
    return Math.abs(((a - b) % 360 + 540) % 360 - 180);
  }

  async function postHeading(heading, keepalive) {
    const value = heading === null ? null : Math.round(heading * 10) / 10;
    if (compassWriterKey) {
      try {
        const response = await fetch(HEADING_RPC, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: LOCATION_API_KEY },
          body: JSON.stringify({ writer_token: compassWriterKey, new_heading: value }),
          keepalive: !!keepalive
        });
        if (response.ok && (await response.json().catch(() => false)) === true) return response;
        compassWriterKey = null;
      } catch (_) {
        if (keepalive) return null;
      }
    }
    const headers = keepalive && lastAuthHeaders ? lastAuthHeaders : await locationAuthHeaders();
    return fetch(LOCATION_ENDPOINT, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
      body: JSON.stringify({ heading: value }),
      keepalive: !!keepalive
    });
  }

  function maybeSendHeading() {
    if (!locationSharing || !compassListening || compassHeading === null || document.hidden || compassSending) return;
    const now = Date.now();
    const turned = compassSentHeading === null ? 360 : turnBetween(compassHeading, compassSentHeading);
    const settled = now - compassLastMotionAt >= COMPASS_SETTLE_MS;
    const gapOk = now - compassSentAt >= COMPASS_MIN_GAP_MS;
    const due = (gapOk && (turned >= COMPASS_MIN_TURN || (settled && turned >= COMPASS_SETTLE_TURN))) || now - compassSentAt >= COMPASS_HEARTBEAT_MS;
    if (!due) return;
    const heading = compassHeading;
    compassSending = true;
    compassSentHeading = heading;
    compassSentAt = now;
    postHeading(heading, false).catch(function () {
      compassSentHeading = null;
    }).finally(function () {
      compassSending = false;
    });
  }

  function pauseCompass() {
    if (!compassListening || compassSentHeading === null) return;
    compassSentHeading = null;
    compassSentAt = 0;
    void postHeading(null, true).catch(function () {});
  }

  function startCompass() {
    if (compassListening) return;
    compassListening = true;
    compassVector = null;
    compassHeading = null;
    compassSentHeading = null;
    compassSentAt = 0;
    compassMotionRef = null;
    compassLastMotionAt = 0;
    window.addEventListener('deviceorientation', onCompassEvent);
    window.addEventListener('deviceorientationabsolute', onCompassEvent);
    compassTimer = setInterval(maybeSendHeading, 5000);
  }

  function stopCompass() {
    compassWriterKey = null;
    if (!compassListening) return;
    compassListening = false;
    window.removeEventListener('deviceorientation', onCompassEvent);
    window.removeEventListener('deviceorientationabsolute', onCompassEvent);
    clearInterval(compassTimer);
    compassTimer = null;
    compassHeading = null;
    compassSentHeading = null;
    compassState = 'off';
  }

  function sharingStatusText() {
    if (compassState === 'on') return 'Sharing neighborhood + compass.';
    if (compassState === 'denied') return 'Sharing neighborhood. Compass blocked.';
    return 'Sharing your neighborhood with the map.';
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pauseCompass();
    else maybeSendHeading();
  });
  window.addEventListener('pagehide', pauseCompass);

  async function clearSharedLocation() {
    try {
      const headers = await locationAuthHeaders();
      const response = await fetch(LOCATION_ENDPOINT, { method: 'DELETE', headers });
      if (!response.ok) throw new Error('Could not clear the shared location.');
      return true;
    } catch (_) {
      return false;
    }
  }

  async function stopLocationSharing(message) {
    const wasSharing = locationSharing;
    stopLocationWatch();
    if (!wasSharing) {
      setLocationStatus(message || 'Location sharing is off.');
      return;
    }
    locationShareBtn.disabled = true;
    setLocationStatus('Stopping location sharing…');
    if (locationSendPromise) await locationSendPromise;
    const cleared = await clearSharedLocation();
    locationShareBtn.disabled = false;
    setLocationStatus(cleared ? (message || 'Location sharing is off.') : 'Sharing stopped; map will clear shortly.');
  }

  async function sendCurrentLocation() {
    if (!locationSharing || !lastLocationPosition) return;
    if (locationSending) return locationSendPromise;
    locationSending = true;
    let finishSend;
    locationSendPromise = new Promise(function (resolve) { finishSend = resolve; });
    try {
      const headers = await locationAuthHeaders();
      headers['Content-Type'] = 'application/json';
      const position = lastLocationPosition;
      const response = await fetch(LOCATION_ENDPOINT, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          acc: position.coords.accuracy
        })
      });
      const result = await response.json().catch(() => ({}));
      if (response.ok && typeof result.compassToken === 'string') compassWriterKey = result.compassToken;
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          stopLocationWatch();
          setLocationStatus('Authenticator session expired. Sign in again.');
          return;
        }
        throw new Error(result.error || 'Could not update the map.');
      }
      setLocationStatus(sharingStatusText());
    } catch (error) {
      setLocationStatus(error && error.message ? error.message : 'Could not update the map. Check your connection.');
    } finally {
      locationSending = false;
      finishSend();
      locationSendPromise = null;
    }
  }

  function startLocationSharing() {
    if (!navigator.geolocation) {
      setLocationStatus('This browser does not support location.');
      return;
    }
    locationSharing = true;
    locationShareBtn.disabled = true;
    setLocationStatus('Waiting for phone location permission…');
    locationWatchId = navigator.geolocation.watchPosition(function (position) {
      lastLocationPosition = position;
      void sendCurrentLocation();
    }, function (error) {
      void stopLocationSharing(error.code === 1
        ? 'Allow location access for this site in phone settings.'
        : 'Phone location is unavailable. Check Location Services and try again.');
    }, { enableHighAccuracy: false, maximumAge: 30000, timeout: 20000 });
    locationHeartbeat = setInterval(function () { void sendCurrentLocation(); }, 60000);
    locationShareBtn.disabled = false;
    setLocationStatus('Getting your neighborhood…');
  }

  locationShareBtn.addEventListener('click', function () {
    if (locationSharing) {
      void stopLocationSharing();
      return;
    }
    const compassPermission = requestCompassPermission();
    startLocationSharing();
    compassPermission.then(function (state) {
      if (!locationSharing) return;
      if (state === 'granted') startCompass();
      else compassState = state === 'denied' ? 'denied' : 'off';
    });
  });

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    if (locationSharing) await stopLocationSharing('Location sharing stopped.');
    await window.KnobsockAdmin2FA.signOut(auth);
  });

  let monitorStarted = false;
  auth.onAuthStateChanged(function (user) {
    clearTimeout(adminExpiryTimer);
    if (!user) {
      if (locationSharing) void stopLocationSharing('Sign in again to share location.');
      loginWrap.hidden = false;
      appEl.hidden = true;
      window.KnobsockAdmin2FA.mount(admin2faRoot, auth, {
        buttonClass: 'btn btn-primary',
        inputStyle: 'display:block;width:100%;box-sizing:border-box;margin:6px 0 12px;'
      });
      return;
    }
    window.KnobsockAdmin2FA.twoFactorUntil(user).then(function (until) {
      if (until <= Date.now()) {
        if (locationSharing) void stopLocationSharing('Your admin session expired.');
        void window.KnobsockAdmin2FA.lock(auth);
        return;
      }
      adminExpiryTimer = setTimeout(async function () {
        if (locationSharing) await stopLocationSharing('Your admin session expired.');
        await window.KnobsockAdmin2FA.lock(auth).then(function () {
          loginError.textContent = 'Your 12 hours are up. Enter your authenticator code to keep going.';
        });
      }, Math.min(until - Date.now(), 2147483000));
      loginWrap.hidden = true;
      appEl.hidden = false;
      loginError.textContent = '';
      if (openedFromLocationLink) {
        setLocationStatus('Tap Share location to show your neighborhood on stream.');
        locationShareBtn.focus({ preventScroll: true });
      }
      if (!monitorStarted) {
        monitorStarted = true;
        startMonitor();
      }
    });
  });

  function startMonitor() {

    const FETCH_LIMIT = 120;
    // This is a live monitor, not an archive.  Begin at authentication time
    // and receive only messages posted while the monitor is open.
    const MONITOR_STARTED_AT = Date.now();

    const DEFAULT_CENSORED_WORDS = [
      'nigger', 'nigga', 'faggot', 'fag', 'dyke', 'tranny', 'chink', 'gook',
      'spic', 'kike', 'wetback', 'beaner', 'coon', 'paki', 'retard', 'cracker',
      'towelhead', 'raghead', 'cunt'
    ];
    function buildCensorRegex(word) {
      const subs = {
        a: '[a@4]', e: '[e3]', i: '[i1!]', o: '[o0]', u: '[u]',
        s: '[s$5]', g: '[g9]', t: '[t7]'
      };
      const pattern = word.split('').map(ch => subs[ch] || ch).join('[\\W_]*');
      return new RegExp('\\b' + pattern + '\\b', 'gi');
    }
    let CENSOR_REGEXES = DEFAULT_CENSORED_WORDS.map(buildCensorRegex);
    let deletedIds = new Set();
    configRef.doc('censoredWords').onSnapshot((doc) => {
      const data = doc.exists ? doc.data() : null;
      const words = (data && Array.isArray(data.words) && data.words.length) ? data.words : DEFAULT_CENSORED_WORDS;
      CENSOR_REGEXES = words.map(buildCensorRegex);
      deletedIds = new Set(data && Array.isArray(data.deletedMessageIds) ? data.deletedMessageIds.map(String) : []);
      if (lastMsgs.some((m) => deletedIds.has(m.id))) renderCombined(false);
    }, () => {});
    function censorText(text) {
      let result = text;
      CENSOR_REGEXES.forEach(re => {
        result = result.replace(re, match => '*'.repeat(match.length));
      });
      return result;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function hashHue(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      return hash % 360;
    }
    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
      return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
    }
    function defaultColorFor(username) {
      return hslToHex(hashHue(username.toLowerCase()), 70, 72);
    }

    const container = document.getElementById('messages');
    const moderationOverlay = document.getElementById('moderationOverlay');
    const moderationTitle = document.getElementById('moderationTitle');
    const moderationMeta = document.getElementById('moderationMeta');
    const moderationHistoryStatus = document.getElementById('moderationHistoryStatus');
    const moderationHistoryList = document.getElementById('moderationHistoryList');
    const moderationPagination = document.getElementById('moderationPagination');
    const moderationPreviousBtn = document.getElementById('moderationPreviousBtn');
    const moderationNextBtn = document.getElementById('moderationNextBtn');
    const moderationPageLabel = document.getElementById('moderationPageLabel');
    const moderationDuration = document.getElementById('moderationDuration');
    const moderationApplyBtn = document.getElementById('moderationApplyBtn');
    const moderationReason = document.getElementById('moderationReason');
    const moderationActionStatus = document.getElementById('moderationActionStatus');
    const MODERATION_HISTORY_PAGE_SIZE = 20;

    let lastMsgs = [];
    let chatEmojiByName = {};
    function renderMessageText(text) {
      return escapeHtml(censorText(String(text || ''))).replace(/:([a-z0-9_-]{1,32}):/gi, function (match, name) {
        const emoji = chatEmojiByName[String(name).toLowerCase()];
        if (!emoji) return match;
        return '<img class="chat-emoji" src="' + escapeHtml(emoji.url) + '" alt="' + escapeHtml(match) + '">';
      });
    }
    fetch('/chat-emojis.json', { cache: 'no-cache' })
      .then(function (res) { return res.ok ? res.json() : { emojis: [] }; })
      .then(function (data) {
        const byName = {};
        (data && Array.isArray(data.emojis) ? data.emojis : []).forEach(function (item) {
          const name = String(item && item.name || '').toLowerCase();
          const url = String(item && item.url || '');
          if (!/^[a-z0-9_-]{1,32}$/.test(name) || (!/^https?:\/\//i.test(url) && url.charAt(0) !== '/')) return;
          if (!byName[name]) byName[name] = { name: name, url: url };
        });
        chatEmojiByName = byName;
        if (lastMsgs.length) render(lastMsgs);
      })
      .catch(function () {});
    let messagesById = new Map();
    let moderationTarget = null;
    let moderationPageIndex = 0;
    let moderationRequestToken = 0;
    const moderationHistoryCache = new Map();

    function toMillis(value) {
      if (!value) return 0;
      if (typeof value === 'number') return value;
      if (typeof value.toMillis === 'function') return value.toMillis();
      if (typeof value.seconds === 'number') return value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1e6);
      return 0;
    }

    function historyTimeLabel(value) {
      const ms = toMillis(value);
      return ms ? new Date(ms).toLocaleString() : 'Time unavailable';
    }

    function moderationHistoryKey(target) {
      return target.deviceId ? 'device:' + target.deviceId : 'username:' + target.username.toLowerCase();
    }

    function getModerationHistory(target) {
      const key = moderationHistoryKey(target);
      let history = moderationHistoryCache.get(key);
      if (!history) {
        history = { pages: [], loading: false, error: '' };
        moderationHistoryCache.set(key, history);
      }
      return history;
    }

    function historyQueryFor(target) {
      const field = target.deviceId ? 'deviceId' : 'username';
      const value = target.deviceId || target.username;
      return messagesRef.where(field, '==', value).orderBy('ts', 'desc');
    }

    function renderHistoryMessage(message) {
      const username = String(message.username || 'Unknown');
      const text = message.type === 'join'
        ? 'joined chat'
        : message.type === 'tapin'
          ? 'tapped in'
          : String(message.text || '');
      return '<div class="moderation-log">' +
        '<div class="moderation-log-body">' +
        '<span class="moderation-log-time">' + escapeHtml(historyTimeLabel(message.ts)) + '</span>' +
        '<strong>' + escapeHtml(username) + ':</strong> ' + renderMessageText(text) +
        '</div>' +
        '<button type="button" class="moderation-log-delete" data-delete-id="' + escapeHtml(message.id) + '">Delete</button>' +
        '</div>';
    }

    function updateModerationActionLabel() {
      moderationApplyBtn.textContent = moderationDuration.value === 'permanent' ? 'Ban permanently' : 'Apply timeout';
    }

    function renderModeration() {
      if (!moderationTarget) return;
      const target = moderationTarget;
      const history = getModerationHistory(target);
      const page = history.pages[moderationPageIndex] || null;
      const pageNumber = page ? moderationPageIndex + 1 : 0;
      const hasCachedOlderPage = moderationPageIndex < history.pages.length - 1;
      const mayHaveOlderPage = page && page.hasMore;

      moderationTitle.textContent = target.username;
      moderationMeta.textContent = target.deviceId
        ? 'Ready to moderate using the device ID already attached to this live message.'
        : target.deviceLookupStatus === 'unavailable'
          ? 'No current device was found for this username, so a ban cannot be enforced.'
          : target.deviceLookupStatus === 'error'
            ? 'Could not look up a device for this username. History can still load by username.'
            : 'No device ID was attached to this older message. Checking the username record once so a ban can be enforced.';

      if (history.error) {
        moderationHistoryStatus.textContent = 'Couldn’t load chat history: ' + history.error;
      } else if (history.loading) {
        moderationHistoryStatus.textContent = page ? 'Loading the next 20 messages…' : 'Loading up to 20 messages…';
      } else if (page && page.messages.length) {
        moderationHistoryStatus.textContent = 'Showing ' + page.messages.length + ' message' + (page.messages.length === 1 ? '' : 's') + ' on this page.';
      } else if (page) {
        moderationHistoryStatus.textContent = 'No chat messages found for this user.';
      } else {
        moderationHistoryStatus.textContent = 'Preparing chat history…';
      }

      moderationHistoryList.innerHTML = page
        ? (page.messages.length ? page.messages.map(renderHistoryMessage).join('') : '<div class="moderation-empty">No chat messages found for this user.</div>')
        : '<div class="moderation-empty">Loading…</div>';

      moderationHistoryList.querySelectorAll('.moderation-log-delete').forEach(function (button) {
        button.addEventListener('click', function () {
          deleteChatMessage(button.getAttribute('data-delete-id'), button);
        });
      });

      moderationPagination.hidden = !page;
      moderationPreviousBtn.hidden = !page || moderationPageIndex === 0;
      moderationPreviousBtn.disabled = moderationPageIndex === 0 || history.loading;
      moderationPageLabel.textContent = pageNumber ? 'Page ' + pageNumber : '';
      moderationNextBtn.hidden = !page || (!hasCachedOlderPage && !mayHaveOlderPage);
      moderationNextBtn.disabled = history.loading;

      moderationApplyBtn.disabled = !target.deviceId;
      if (!target.deviceId && !moderationActionStatus.textContent) {
        moderationActionStatus.textContent = 'A ban needs the chat device ID. History can still load by username.';
      }
    }

    function loadModerationHistoryPage() {
      if (!moderationTarget) return;
      const target = moderationTarget;
      const history = getModerationHistory(target);
      if (history.loading) return;
      const previousPage = history.pages.length ? history.pages[history.pages.length - 1] : null;
      if (previousPage && !previousPage.hasMore) return;

      const token = moderationRequestToken;
      history.loading = true;
      history.error = '';
      renderModeration();

      let query = historyQueryFor(target);
      if (previousPage && previousPage.cursor) query = query.startAfter(previousPage.cursor);
      query.limit(MODERATION_HISTORY_PAGE_SIZE).get().then(function (snapshot) {
        if (token !== moderationRequestToken || moderationTarget !== target) return;
        history.loading = false;
        const messages = snapshot.docs.map(function (doc) {
          return Object.assign({ id: doc.id }, doc.data());
        });

        if (!messages.length && previousPage) {
          previousPage.hasMore = false;
        } else {
          history.pages.push({
            messages: messages,
            cursor: snapshot.docs.length ? snapshot.docs[snapshot.docs.length - 1] : null,
            hasMore: snapshot.size === MODERATION_HISTORY_PAGE_SIZE
          });
          moderationPageIndex = history.pages.length - 1;
        }
        renderModeration();
      }).catch(function (err) {
        if (token !== moderationRequestToken || moderationTarget !== target) return;
        history.loading = false;
        history.error = (err && err.message) || 'unknown error';
        renderModeration();
      });
    }

    function loadModerationHistoryForTarget() {
      if (!moderationTarget) return;
      const history = getModerationHistory(moderationTarget);
      if (history.pages.length) {
        moderationPageIndex = 0;
        renderModeration();
      } else {
        loadModerationHistoryPage();
      }
    }

    function openUserModeration(message) {
      const username = String(message && message.username || '').trim();
      if (!username) return;
      const deviceId = message && typeof message.deviceId === 'string' ? message.deviceId : '';
      moderationTarget = { username: username, deviceId: deviceId, deviceLookupStatus: deviceId ? 'ready' : 'checking' };
      moderationPageIndex = 0;
      moderationRequestToken += 1;
      moderationReason.value = '';
      moderationActionStatus.textContent = '';
      moderationOverlay.hidden = false;
      updateModerationActionLabel();
      renderModeration();

      if (deviceId) {
        loadModerationHistoryForTarget();
        return;
      }

      const token = moderationRequestToken;
      usernamesRef.doc(username.toLowerCase()).get().then(function (doc) {
        if (token !== moderationRequestToken || !moderationTarget) return;
        const data = doc.exists ? doc.data() : null;
        const resolvedDeviceId = data && typeof data.lastDeviceId === 'string' ? data.lastDeviceId : '';
        if (resolvedDeviceId) moderationTarget = { username: username, deviceId: resolvedDeviceId, deviceLookupStatus: 'ready' };
        else moderationTarget.deviceLookupStatus = 'unavailable';
        moderationPageIndex = 0;
        renderModeration();
        loadModerationHistoryForTarget();
      }).catch(function () {
        if (token !== moderationRequestToken || !moderationTarget) return;
        moderationTarget.deviceLookupStatus = 'error';
        renderModeration();
        loadModerationHistoryForTarget();
      });
    }

    function closeUserModeration() {
      moderationRequestToken += 1;
      moderationTarget = null;
      moderationOverlay.hidden = true;
    }

    function applyModeration() {
      const target = moderationTarget;
      if (!target || !target.deviceId) return;
      const duration = moderationDuration.value;
      const permanent = duration === 'permanent';
      const expiresAt = permanent ? null : Date.now() + Number(duration);
      const reason = moderationReason.value.trim();

      moderationApplyBtn.disabled = true;
      moderationActionStatus.textContent = permanent ? 'Banning…' : 'Applying timeout…';
      bansRef.doc(target.deviceId).set({
        bannedAt: Date.now(),
        bannedBy: (auth.currentUser && (auth.currentUser.email || auth.currentUser.uid)) || 'admin',
        expiresAt: expiresAt,
        reason: reason,
        enforced: true,
        usernames: firebase.firestore.FieldValue.arrayUnion(target.username)
      }, { merge: true }).then(function () {
        if (moderationTarget === target) {
          moderationActionStatus.textContent = permanent
            ? 'Permanent ban applied.'
            : 'Timeout applied until ' + new Date(expiresAt).toLocaleString() + '.';
        }
      }).catch(function (err) {
        if (moderationTarget === target) {
          moderationActionStatus.textContent = 'Couldn’t apply moderation: ' + ((err && err.message) || 'unknown error');
        }
      }).finally(function () {
        if (moderationTarget === target) renderModeration();
      });
    }

    document.getElementById('moderationCloseBtn').addEventListener('click', closeUserModeration);
    moderationOverlay.addEventListener('click', function (event) {
      if (event.target === moderationOverlay) closeUserModeration();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !moderationOverlay.hidden) closeUserModeration();
    });
    moderationDuration.addEventListener('change', updateModerationActionLabel);
    moderationApplyBtn.addEventListener('click', applyModeration);
    moderationPreviousBtn.addEventListener('click', function () {
      if (!moderationTarget || moderationPageIndex === 0) return;
      moderationPageIndex -= 1;
      renderModeration();
    });
    moderationNextBtn.addEventListener('click', function () {
      if (!moderationTarget) return;
      const history = getModerationHistory(moderationTarget);
      if (moderationPageIndex < history.pages.length - 1) {
        moderationPageIndex += 1;
        renderModeration();
      } else {
        loadModerationHistoryPage();
      }
    });

    function render(msgs) {
      lastMsgs = msgs;
      messagesById = new Map(msgs.map(function (message) { return [message.id, message]; }));

      const wasNearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 40;
      container.innerHTML = msgs.map(m => {
        const username = String(m.username || 'Unknown');
        const color = m.color || defaultColorFor(username);
        return '<div class="msg">' +
          '<button type="button" class="msg-name" data-message-id="' + escapeHtml(m.id) + '" style="color:' + color + '">' + escapeHtml(username) + ':</button> ' +
          (m.replyTo && m.replyTo.username ? '<span class="msg-reply-tag" title="Reply to another chatter">&#8617; reply</span> ' : '') +
          '<span class="msg-text">' + renderMessageText(m.text) + '</span>' +
          '</div>';
      }).join('');
      container.querySelectorAll('.msg-name').forEach(function (button) {
        button.addEventListener('click', function () {
          const message = messagesById.get(button.getAttribute('data-message-id'));
          if (message) openUserModeration(message);
        });
      });
      if (wasNearBottom) container.scrollTop = container.scrollHeight;
    }

    let clearedAt = 0;
    let subscribedClearedAt = null;
    let unsubscribeMessages = null;
    let liveMsgs = [];
    let historyMsgs = [];
    let historyFetched = 0;
    let historyReads = 0;
    let historyOldestTs = MONITOR_STARTED_AT;
    let historyLoading = false;
    let historyDone = false;
    let historyGeneration = 0;
    const HISTORY_PAGE_SIZE = 20;
    const HISTORY_MAX_TOTAL = 150;
    const HISTORY_MAX_READS = 600;

    function isShownMessage(m) {
      return !!m && m.type !== 'join' && !(typeof m.type === 'string' && m.type.indexOf('fight_') === 0) && (m.ts || 0) > clearedAt && !deletedIds.has(m.id);
    }

    const DELETED_MESSAGE_ID_LIMIT = 300;

    function publishDeletedMessageId(id) {
      const ref = configRef.doc('censoredWords');
      return db.runTransaction(function (tx) {
        return tx.get(ref).then(function (doc) {
          const data = doc.exists ? doc.data() : null;
          const existing = data && Array.isArray(data.deletedMessageIds) ? data.deletedMessageIds : [];
          const next = existing.filter(function (existingId) { return existingId !== id; }).concat([id]).slice(-DELETED_MESSAGE_ID_LIMIT);
          tx.set(ref, { deletedMessageIds: next }, { merge: true });
        });
      });
    }

    function findMessageById(id) {
      if (messagesById.has(id)) return messagesById.get(id);
      let found = null;
      moderationHistoryCache.forEach(function (history) {
        history.pages.forEach(function (page) {
          page.messages.forEach(function (message) { if (message.id === id) found = message; });
        });
      });
      return found;
    }

    function removeMessageFromHistory(id) {
      moderationHistoryCache.forEach(function (history) {
        history.pages.forEach(function (page) {
          page.messages = page.messages.filter(function (message) { return message.id !== id; });
        });
      });
    }

    function deleteChatMessage(id, button) {
      const message = findMessageById(id);
      if (!message) return;
      const preview = String(message.text || '').slice(0, 80);
      if (!confirm('Delete this message for everyone?\n\n' + (message.username || 'Unknown') + ': ' + preview)) return;
      if (button) button.disabled = true;
      messagesRef.doc(id).delete().then(function () {
        deletedIds = new Set(deletedIds);
        deletedIds.add(id);
        removeMessageFromHistory(id);
        renderCombined(false);
        renderModeration();
        return publishDeletedMessageId(id).catch(function (err) {
          console.error('Could not hide the deleted message in open chats:', err);
          alert('Deleted, but open chats may keep showing it until they reload: ' + err.message);
        });
      }).catch(function (err) {
        if (button) button.disabled = false;
        alert('Delete failed: ' + err.message);
      });
    }

    function renderCombined(keepScroll) {
      const byId = new Map();
      historyMsgs.concat(liveMsgs).forEach((m) => byId.set(m.id, m));
      const msgs = Array.from(byId.values()).filter(isShownMessage).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (!keepScroll) {
        render(msgs);
        return;
      }
      const prevHeight = container.scrollHeight;
      const prevTop = container.scrollTop;
      render(msgs);
      container.scrollTop = container.scrollHeight - prevHeight + prevTop;
    }

    function loadOlderMessages() {
      if (historyLoading || historyDone) return;
      const pageSize = Math.min(HISTORY_PAGE_SIZE, HISTORY_MAX_READS - historyReads);
      if (pageSize <= 0 || historyFetched >= HISTORY_MAX_TOTAL) {
        historyDone = true;
        return;
      }
      historyLoading = true;
      const generation = historyGeneration;
      const oldest = historyOldestTs;
      let query = messagesRef.orderBy('ts', 'desc').where('ts', '<', oldest);
      if (clearedAt) query = query.where('ts', '>', clearedAt);
      query.limit(pageSize).get().then((snapshot) => {
        if (generation !== historyGeneration) return;
        const docs = snapshot.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()));
        historyReads += docs.length;
        const kept = [];
        for (const doc of docs) {
          if (historyFetched >= HISTORY_MAX_TOTAL) break;
          if (doc.type === 'join' || (typeof doc.type === 'string' && doc.type.indexOf('fight_') === 0)) continue;
          kept.push(doc);
          historyFetched += 1;
        }
        if (docs.length) historyOldestTs = docs[docs.length - 1].ts;
        historyMsgs = historyMsgs.concat(kept);
        if (docs.length < pageSize || historyFetched >= HISTORY_MAX_TOTAL || historyReads >= HISTORY_MAX_READS) historyDone = true;
        historyLoading = false;
        const firstPage = historyMsgs.length === kept.length && historyReads === docs.length;
        renderCombined(!firstPage);
        if (firstPage) container.scrollTop = container.scrollHeight;
        maybeLoadOlderMessages();
      }).catch((err) => {
        if (generation === historyGeneration) historyLoading = false;
        console.error(err);
      });
    }

    function maybeLoadOlderMessages() {
      if (historyLoading || historyDone) return;
      if (container.scrollTop < 60 || container.scrollHeight <= container.clientHeight + 60) loadOlderMessages();
    }

    container.addEventListener('scroll', maybeLoadOlderMessages, { passive: true });
    container.addEventListener('wheel', (event) => {
      if (event.deltaY < 0) maybeLoadOlderMessages();
    }, { passive: true });
    container.addEventListener('touchmove', maybeLoadOlderMessages, { passive: true });

    function subscribeToMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      subscribedClearedAt = clearedAt;
      historyGeneration += 1;
      historyMsgs = [];
      liveMsgs = [];
      historyFetched = 0;
      historyReads = 0;
      historyOldestTs = MONITOR_STARTED_AT;
      historyLoading = false;
      historyDone = false;
      let query = messagesRef.orderBy('ts', 'asc');
      query = query.where('ts', '>=', Math.max(clearedAt || 0, MONITOR_STARTED_AT));
      unsubscribeMessages = query.limitToLast(FETCH_LIMIT).onSnapshot(
        (snapshot) => {
          liveMsgs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
          renderCombined(false);
        },

        (err) => console.error(err)
      );
      loadOlderMessages();
    }

    configRef.doc('clear').onSnapshot((doc) => {
      const data = doc.exists ? doc.data() : null;
      clearedAt = (data && typeof data.clearedAt === 'number') ? data.clearedAt : 0;
      if (subscribedClearedAt !== clearedAt) subscribeToMessages();
    }, () => { if (subscribedClearedAt === null) subscribeToMessages(); });

    const ACTIVE_WINDOW_MS = 150000;
    const COUNT_REFRESH_MS = 30000;
    const COUNT_URL = 'https://firestore.googleapis.com/v1/projects/' + firebaseConfig.projectId + '/databases/(default)/documents:runAggregationQuery?key=' + firebaseConfig.apiKey;
    const COUNT_TIMEOUT_MS = 15000;
    let countInFlight = false;
    let serverSkewMs = 0;

    function refreshActiveCount() {
      if (countInFlight || document.visibilityState === 'hidden') return;
      countInFlight = true;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), COUNT_TIMEOUT_MS);
      fetch(COUNT_URL, {
        method: 'POST',
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredAggregationQuery: {
            structuredQuery: {
              from: [{ collectionId: 'chat_presence' }],
              where: {
                fieldFilter: {
                  field: { fieldPath: 'lastSeen' },
                  op: 'GREATER_THAN',
                  value: { integerValue: String(Date.now() + serverSkewMs - ACTIVE_WINDOW_MS) }
                }
              }
            },
            aggregations: [{ alias: 'viewers', count: {} }]
          }
        })
      })
        .then((res) => (res.ok ? res.json() : null))
        .then((rows) => {
          if (!Array.isArray(rows)) return;
          for (const row of rows) {
            if (!row || !row.result) continue;
            if (row.readTime) {
              const serverMs = Date.parse(row.readTime);
              if (serverMs) serverSkewMs = serverMs - Date.now();
            }
            const field = row.result.aggregateFields && row.result.aggregateFields.viewers;
            if (!field || field.integerValue == null) continue;
            document.getElementById('viewerCount').textContent = String(parseInt(field.integerValue, 10) || 0);
            return;
          }
        })
        .catch(() => {})
        .finally(() => { clearTimeout(timer); countInFlight = false; });
    }

    refreshActiveCount();
    setInterval(refreshActiveCount, COUNT_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshActiveCount();
    });

  }
})();
</script>
