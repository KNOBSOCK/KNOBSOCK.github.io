<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Living Room - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/livingroom">
<meta property="og:title" content="Living Room - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:image" content="https://knobsock.net/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Living Room - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="twitter:image" content="https://knobsock.net/og-image.png">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Fullscreen 3D-room page, same tiled-GIF background as main/index.html.
     The Sketchfab embed and its instructions overlay live in
     /livingroom-widget.html (a nested iframe); this shell just fills the
     browser with it edge to edge and floats the site's header logo on
     top, the same way it sits over the video on the knobsock.net landing page. */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    /* Was plain 100% — that doesn't track mobile Safari's own
       collapsing address-bar toolbar the way .viewer-wrap's 100dvh
       below already does, so this box could end up shorter than the
       actually-visible viewport once the toolbar hides, leaving a gap
       above/below it painted in Safari's own default white rather than
       this element's own black background. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
  }

  .viewer-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
  }
  .viewer-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }

  /* Overlaid on the 3D scene rather than given its own reserved strip
     (unlike live.html/store.html/music.html/videos.html) — the Sketchfab
     embed fills edge to edge either way, so reserving space here just
     left a bare strip of this page's own tiled background showing below
     it instead of more of the room. A translucent pill behind the text
     keeps it legible regardless of what's in the scene behind it (unlike
     a page with a known solid background, the 3D view under this can be
     anything depending on how it's been panned/zoomed). pointer-events
     is off on the wrapper and back on for the link alone so it doesn't
     steal drag/pinch input from the model everywhere else across the
     bottom edge — same trick .site-header above already uses. */
  .privacy-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    z-index: 20;
    pointer-events: none;
  }
  .privacy-footer a {
    pointer-events: auto;
    display: inline-block;
    text-decoration: underline;
    color: #fff;
    font-size: 9px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: rgba(0, 0, 0, 0.55);
    padding: 2px 7px;
    border-radius: 7px;
  }

  /* Header logo — floats over the 3D scene instead of pushing it down,
     same "Knobsock" image the knobsock.net landing page uses. pointer-events is off
     on the row itself so it doesn't block dragging/pinching the model
     underneath it; the link re-enables it just over the logo. */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    padding: clamp(10px, 2.5vw, 22px) clamp(10px, 3vw, 24px) 0;
    pointer-events: none;
  }
  .logo-link {
    display: block;
    width: min(46%, 320px);
    pointer-events: auto;
  }
  .logo-link img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 50 / 19;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="viewer-wrap">
  <iframe src="/livingroom-widget.html"
          title="The Knobsock Living Room"
          allow="autoplay; fullscreen; xr-spatial-tracking; clipboard-write; web-share"
          allowfullscreen></iframe>
</div>

<header class="site-header">
  <a class="logo-link" href="/" target="_top">
    <img src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/knobsock-main.PNG" alt="Knobsock">
  </a>
</header>

<div class="privacy-footer"><a href="/privacy">Privacy Policy &amp; User Agreement</a></div>
</body>
</html>
