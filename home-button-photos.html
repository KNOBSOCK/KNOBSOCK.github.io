<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fully transparent — sits directly on the front page's starfield
     background, not a panel of its own. No forced height:100% — the box
     just hugs this single image's own aspect ratio. */
  html, body {
    background: transparent;
    width: 100%;
  }

  a { text-decoration: none; color: inherit; display: block; }

  .button-item {
    position: relative;
    width: 100%;
    cursor: pointer;
    /* Cartoonish "pop": same spring-y cubic-bezier used on the other
       widgets' hover animations (recent articles, SoundCloud player) —
       overshoots past 1.0 before settling, instead of a flat ease. */
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .button-item:hover {
    transform: scale(1.08) rotate(-2deg);
  }

  /* The label + blob-shape image — width/height attributes below (matching
     the real PNG's pixel dimensions) let the browser reserve the correct
     final layout height immediately, before the image data even finishes
     downloading, so there's no layout shift for an auto-sizing code block
     to get confused by. */
  .btn-base {
    display: block;
    width: 100%;
    height: auto;
  }

  /* The animated gif/icon layered on top of the blob (paste its URL
     below). Centered over the blob; pointer-events:none so it never
     blocks the link/hover underneath it. Nudge top/width here if it looks
     off-center once the real gif is in. */
  .btn-icon {
    position: absolute;
    left: 50%;
    top: 34%;
    width: 55%;
    height: auto;
    transform: translateX(-50%);
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- EDIT: href is the page this button should link to; the second img's
       src is the animated gif/icon that sits on top of the blob. -->
  <a class="button-item" href="PASTE_PHOTOS_LINK_HERE" target="_top">
    <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_DD40FE14-A89B-461D-A545-D25D2C068EF0.PNG" width="982" height="1408" alt="Photos">
    <img class="btn-icon" src="PASTE_PHOTOS_GIF_URL_HERE" alt="">
  </a>

</body>
</html>
