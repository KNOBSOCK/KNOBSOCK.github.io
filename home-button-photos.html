<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos Button</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fully transparent — sits directly on the front page's starfield
     background, not a panel of its own. Fills the EXACT box Universe
     gives it (width and height) — this is a fixed grid cell you control
     directly, not an auto-sizing code block. */
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    /* Anything that overflows this box (like the hover pop below) gets
       clipped by the iframe boundary rather than spilling visibly, so the
       button-item sizing below deliberately leaves room for that. */
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  a { text-decoration: none; color: inherit; display: block; }

  .button-item {
    position: relative;
    /* Deliberately smaller than the full box — this is the headroom the
       hover pop below grows into. At 80% resting size, scaling by 1.2 on
       hover lands at 96%, still safely inside the box instead of getting
       clipped at its edge. */
    width: 80%;
    height: 80%;
    cursor: pointer;
    /* Cartoonish "pop": same spring-y cubic-bezier used on the other
       widgets' hover animations (recent articles, SoundCloud player) —
       overshoots past 1.0 before settling, instead of a flat ease.
       Bumped from 1.08 to 1.2 for a bigger jump. */
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .button-item:hover {
    transform: scale(1.2) rotate(-3deg);
  }

  /* object-fit:contain "brute forces" the image to fit inside whatever
     width/height this box ends up being (letterboxing rather than
     stretching/distorting if the box's aspect ratio doesn't exactly match
     the image's own) — width/height attributes below still help the
     browser reserve the right space before the image finishes loading. */
  .btn-base {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* The gif sits inside a BOUNDING BOX (not just a width cap) — capping
     both width and height and using object-fit:contain on the gif itself
     means it always shrinks to fit whichever dimension is tighter, so it
     can never poke out past the blob's edge regardless of the gif's own
     aspect ratio (which is what let the "PARTY" text on the live button's
     balloon gif hang outside its blob before). Nudge this box's top/width/
     height if an icon still looks off relative to its blob. */
  .btn-icon-wrap {
    position: absolute;
    left: 50%;
    top: 30%;
    width: 58%;
    height: 58%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .btn-icon {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }
</style>
</head>
<body>

  <!-- EDIT: href is the page this button should link to; the second img's
       src is the animated gif/icon that sits on top of the blob. -->
  <a class="button-item" href="https://knobsock.net/photos" target="_top">
    <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_DD40FE14-A89B-461D-A545-D25D2C068EF0.PNG" width="982" height="1408" alt="Photos">
    <div class="btn-icon-wrap">
      <img class="btn-icon" src="https://knobsock.net/_assets/8B9E8614-6F8C-4A0F-82D9-19E64D5EBC80?auto=compress&gif-q=50&w=750&fit=clip" alt="">
    </div>
  </a>

</body>
</html>
