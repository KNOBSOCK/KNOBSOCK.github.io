<style>
  /* Standalone reconstruction of knobsock.net/main, same approach as
     truth.html: a real hosted page (no Universe iframe sandboxing).
     Background is a tiled repeating GIF (old-GeoCities style) instead
     of the video Universe used here — a deliberate departure, not a
     port of Universe's own background.

     This is a simplified rebuild, not a pixel-for-pixel copy of
     Universe's absolute grid layout — that layout was built for
     Universe's own editor canvas (exact px/grid-cell coordinates,
     several purely-decorative solid-color blocks layered under other
     content) and hand-copying every coordinate wasn't worth it. Every
     functional piece is here (nav buttons, Recent Articles, video
     player, Listen widget, floating photos, Instagram links, view
     counter, satellite), just arranged in a cleaner, maintainable CSS
     grid instead. Expect to send screenshots for layout adjustments,
     same as the truth.html build. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    /* Scrolling still works — this only hides the visible scrollbar
       track/thumb, same technique used sitewide on this site. */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    /* Old-GeoCities-style tiled background — a repeating GIF instead of
       Universe's looping video. Scrolls with the page (not fixed), same
       as a classic tiled page background. */
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
  }
  a { text-decoration: none; color: inherit; }

  /* Drifting satellite gif — same free-floating overlay Universe used,
     wanders slowly around the screen and wraps at the edges. Its own
     inline z-index (way above everything else here) is what keeps it
     visible over the video regardless of DOM order. */
  #satellite {
    position: fixed;
    top: 0;
    left: 0;
    width: 60px;
    z-index: 9999;
    pointer-events: none;
  }

  .page {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    /* Top padding cut way down from the other three sides — this was
       the same clamp(16px, 4vw, 40px) on every side, which read as a
       big empty gap above the logo specifically since nothing else on
       the page needs that much breathing room at the very top. */
    padding: clamp(4px, 1vw, 10px) clamp(16px, 4vw, 40px) clamp(16px, 4vw, 40px);
  }

  /* ---------- HEADER ---------- */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
  }
  .logo-link { display: block; width: min(70%, 480px); }
  .logo-link img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 50 / 19;
    object-fit: contain;
  }
  /* Small "Live" badge, pinned top-right — a separate, older link from
     the four nav buttons below, kept for parity with the live page. */
  .live-badge {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: clamp(46px, 9vw, 72px);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .live-badge:hover { transform: translateY(-50%) scale(1.12) rotate(-4deg); }
  .live-badge img { display: block; width: 100%; height: auto; }

  /* ---------- NAV BUTTONS ---------- */
  /* Each button is a fixed, capped size (not a share of the row's width)
     — a grid with "1fr" columns was making each iframe stretch to fill
     whatever slice of the row it got, so fewer columns on a narrow phone
     meant a BIGGER button instead of a smaller one.
     All 4 always stay on one row (flex-wrap: nowrap) instead of the
     4th one dropping to its own line — sized off this row's own actual
     width via calc(), not raw vw (vw is the whole browser window, which
     doesn't account for .page's own side padding narrowing the row's
     real available space — that mismatch was exactly what made the 4th
     button run out of room and wrap). Capped at 150px each so they don't
     grow huge on a wide screen either; below that, all 4 shrink together
     to whatever the row actually has room for. */
  .nav-buttons {
    --nav-gap: clamp(6px, 2vw, 18px);
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: var(--nav-gap);
    margin: 0 0 clamp(10px, 3vw, 24px);
  }
  .nav-buttons iframe {
    display: block;
    flex: 0 1 auto;
    min-width: 0;
    width: min(150px, calc((100% - 3 * var(--nav-gap)) / 4));
    aspect-ratio: 2 / 3;
    border: 0;
  }

  /* ---------- SECTION CARDS ---------- */
  /* A soft, transparent panel behind each content section — not the
     opaque blue "truth zone" card, just enough of a tint to separate
     content from the busy video background underneath. Truth Zone/
     Newest Video/Music Spot below override this with their own solid
     color instead. */
  .panel {
    position: relative;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-radius: 22px;
    padding: clamp(14px, 3vw, 26px);
  }

  /* Floating "Truth Zone" / "Newest Video" / "Music Spot" labels — same
     bobbing animation as the site's other floating photos, pinned to a
     corner of their panel so they read as a label flying over the
     section rather than blocking its content. */
  .panel-label {
    position: absolute;
    top: -14px;
    left: 16px;
    width: clamp(120px, 26%, 200px);
    z-index: 2;
    pointer-events: none;
    animation: floatY 6s ease-in-out infinite;
  }
  .panel-label img { display: block; width: 100%; height: auto; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  /* ---------- TRUTH ZONE / NEWEST VIDEO / MUSIC SPOT ---------- */
  /* Three equal columns side by side, sharing one defined row height so
     each iframe can fill its panel by height (flex + 100%) instead of
     an arbitrary fixed pixel number that never quite matched the
     widget's own content — that mismatch was exactly what made these
     look cut off or scrollable instead of scaling to fit. Each widget
     already scales its OWN content to whatever box it's given (that's
     how they're built to work inside a Universe code block too) — this
     just makes sure the outer iframe box itself is sized right. */
  .columns-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.5vw, 20px);
    margin: clamp(28px, 4vw, 48px) 0 clamp(10px, 2.5vw, 20px);
    height: clamp(420px, 60vh, 680px);
  }
  /* overflow stays visible here on purpose — the panel-label above is
     deliberately positioned partly outside this box (top: -14px) so it
     reads as flying over the panel; overflow:hidden here would clip it
     clean off, which is exactly what was happening before. Whatever
     scrollbar shows up inside an iframe is the EMBEDDED page's own
     doing (a separate document), not something this outer page's own
     overflow property can reach at all — that has to be fixed in each
     widget file itself. */
  .columns-row .panel {
    display: flex;
    flex-direction: column;
  }
  .columns-row iframe {
    display: block;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    border: 0;
  }
  .articles-panel { background: #310098; }
  .video-panel {
    background: #7890f6;
    /* Offsets the middle column up relative to the other two, so the
       row reads as staggered instead of three flush-aligned boxes.
       Desktop only — see the mobile block below, which cancels this. */
    margin-top: clamp(-40px, -4vw, -20px);
  }
  .listen-panel { background: #980237; }

  /* Two lightweight duplicates (background color + label only, no live
     iframe) bookending the real 3 panels, purely so the loop below has
     something to show for one instant mid-swipe before snapping back to
     the real card — see the JS. Invisible/inert on desktop; only
     switched on inside the mobile block below. */
  .panel-clone { display: none; }

  /* Mobile: instead of stacking the 3 panels in a tall scrolling column
     (which is what kept causing scroll/scrollbar problems inside each
     widget), they become a horizontal swipe carousel — one full-width
     card at a time, native scroll-snap for the swipe feel, with a tiny
     bit of JS to make it loop (swipe past the last card and you're back
     at the first, and vice versa). */
  @media (max-width: 720px) {
    .columns-row {
      display: flex;
      grid-template-columns: none;
      height: auto;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: auto;
      touch-action: pan-x;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .columns-row::-webkit-scrollbar { display: none; }
    .columns-row .panel {
      flex: 0 0 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      margin-top: 0;
    }
    .panel-clone { display: flex; }
    .articles-panel { height: 260px; }
    .video-panel { height: 360px; }
    .listen-panel { height: 300px; }
  }

  /* ---------- FOOTER ---------- */
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 4px 0;
  }
  .bottom-row .gif-embed { height: 30px; }
  .bottom-row .gif-embed img { display: block; height: 100%; width: auto; }
  .bottom-row .counter-panel {
    padding: 6px 16px;
    min-width: 120px;
    text-align: center;
  }
  .bottom-row iframe { display: block; width: 140px; height: 28px; border: 0; }
</style>

<body>
  <img id="satellite" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0732.gif" alt="">

  <div class="page">
    <div class="top-row">
      <a class="logo-link" href="/">
        <img src="https://knobsock.net/_assets/E87B50D3-FD94-42AD-A84A-E08497A2D80C?w=1500&q=70&auto=compress,format&fit=clip" alt="Knobsock">
      </a>

      <div class="panel listen-panel panel-clone" aria-hidden="true">

        </span>

      <div class="panel articles-panel">

        <span class="panel-label">
          <img src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_B62A2910-9DAE-4D79-AFFC-A590002F3EEF.png" alt="">

<script>
  const sat = document.getElementById('satellite');
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  let vx = (Math.random() - 0.5) * 0.6; // slow horizontal drift
  let vy = (Math.random() - 0.5) * 0.6; // slow vertical drift

  function drift() {
    x += vx;
    y += vy;

    // gentle random wobble so it doesn't look like a straight line
    vx += (Math.random() - 0.5) * 0.02;
    vy += (Math.random() - 0.5) * 0.02;

    // wrap around edges instead of bouncing
    if (x < -100) x = window.innerWidth + 100;
    if (x > window.innerWidth + 100) x = -100;
    if (y < -100) y = window.innerHeight + 100;
    if (y > window.innerHeight + 100) y = -100;

    sat.style.left = x + 'px';
    sat.style.top = y + 'px';

    requestAnimationFrame(drift);
  }

  drift();
</script>

<script>
  // ---------- MOBILE CARD LOOP ----------
  // On mobile, .columns-row is a horizontal swipe carousel with 5 cards:
  // [Music Spot clone, Truth Zone, Newest Video, Music Spot, Truth Zone clone]
  // (see the CSS above) — indexes 0-4, with 1-3 being the real cards.
  // Landing on a clone (0 or 4) after a swipe silently jumps to the real
  // card it stands in for, with no animation, so it reads as an
  // infinite loop instead of stopping at the ends.
  (function () {
    const row = document.getElementById('columnsRow');
    if (!row) return;

    function isCarouselActive() {
      return window.matchMedia('(max-width: 720px)').matches;
    }

    function cardWidth() {
      return row.clientWidth;
    }

    function jumpTo(index) {
      row.scrollTo({ left: cardWidth() * index, behavior: 'instant' });
    }

    // Starts centered on the first real card (Truth Zone, index 1) —
    // otherwise a fresh page load would open on the leading clone.
    function resetToStart() {
      if (!isCarouselActive()) return;
      jumpTo(1);
    }

    let scrollSettleTimer = null;
    row.addEventListener('scroll', function () {
      if (!isCarouselActive()) return;
      clearTimeout(scrollSettleTimer);
      // Debounced instead of reacting to every scroll tick — this only
      // needs to run once the swipe gesture has actually settled on a
      // card, not mid-motion.
      scrollSettleTimer = setTimeout(function () {
        const width = cardWidth();
        if (!width) return;
        const index = Math.round(row.scrollLeft / width);
        if (index === 0) {
          jumpTo(3); // leading clone (Music Spot) -> the real Music Spot
        } else if (index === 4) {
          jumpTo(1); // trailing clone (Truth Zone) -> the real Truth Zone
        }
      }, 80);
    }, { passive: true });

    let resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resetToStart, 150);
    });

    resetToStart();
  })();
</script>
