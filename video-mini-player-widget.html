<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>
<style>

  html, body { cursor: url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/cursor-pointer.png") 16 11, auto; }
  a, button { cursor: url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/cursor-pointer.png") 16 11, pointer; }
  :root {

    --accent: #FF8C00;
    --accent-rgb: 255, 140, 0;
    --text-dim: rgba(255, 255, 0, 0.65);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    min-height: 100%;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: yellow;
    display: flex;
    flex-direction: column;
    align-items: flex-start;

    padding: 6px;
  }

  a { text-decoration: none; color: inherit; }

  .grid-frame {
    position: relative;
    width: 100%;
    height: 100%;
    align-self: stretch;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 2px;
    overflow: hidden;
  }

  .grid-toggle-btn {
    display: none;
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 30;
    background: rgba(var(--accent-rgb), 0.5);

    color: #fff;
    border: 1px solid rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
  }

  .unmute-btn,
  .grid-toggle-btn,
  .scrubber {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .grid-frame.controls-visible .unmute-btn,
  .grid-frame.controls-visible .grid-toggle-btn,
  .grid-frame.controls-visible .scrubber {
    opacity: 1;
  }

  .player-wrap {
    flex-shrink: 0;
    margin-bottom: 10px;
  }
  .player-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .player-box.is-loading iframe { visibility: hidden; }

  .gif-loader {
    display: block;
    width: min(67.5px, 30%);
    height: auto;
    opacity: 0.35;
  }
  .player-box iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 0;

    pointer-events: none;
  }
  .player-box video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .unmute-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 5;
    background: rgba(var(--accent-rgb), 0.5);

    color: #fff;
    border: 1px solid rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
  }

  .scrubber {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 6px;
    z-index: 5;
    height: 16px;
    display: flex;
    align-items: center;
  }
  .scrubber-track {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  .scrubber-fill {
    width: 0%;
    height: 100%;
    background: rgba(var(--accent-rgb), 0.9);
  }

  .video-grid {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-content: start;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .video-grid::-webkit-scrollbar { display: none; }

  .video-tile {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;

    appearance: none;
    -webkit-appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
  }

  .video-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #222;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }
  .video-tile.active .video-thumb {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-thumb .play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-thumb .play-icon svg {
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7));
  }

  .video-title {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: break-word;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty-state {
    grid-column: 1 / -1;
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  @media (max-width: 220px) {
    .video-grid { gap: 8px; }
  }

  @media (max-width: 480px) {
    .grid-frame { padding: 0; }
    .player-wrap {
      flex: 1 1 auto;
      min-height: 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }

    .player-box {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      border-radius: 0;
    }

    .unmute-btn,
    .grid-toggle-btn {
      padding: 3px 6px;
      font-size: 9px;
      border-radius: 5px;
    }

    .scrubber {
      left: 6px;
      right: 6px;
      bottom: 32px;
      height: 10px;
    }
    .scrubber-track { height: 3px; }

    .grid-toggle-btn { display: inline-flex; align-items: center; justify-content: center; }
    .video-grid { display: none; }
    .grid-frame.grid-open .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(8, 8, 8, 0.97);
      padding: 10px 10px 44px;
      margin: 0;
    }
  }
</style>
</head>
<body>
  <div class="grid-frame" id="gridFrame">

    <button class="grid-toggle-btn" id="gridToggleBtn">Videos</button>

    <div class="player-wrap">
      <div class="player-box is-loading">
        <div id="ytPlayer"></div>
        <video id="videoEl" playsinline webkit-playsinline muted referrerpolicy="origin" disablePictureInPicture disableRemotePlayback controlsList="nodownload noplaybackrate noremoteplayback" style="display:none;"></video>
        <div class="video-loading" id="videoLoading">
          <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
        </div>
        <button class="unmute-btn" id="unmuteBtn" title="Unmute">Unmute</button>
        <div class="scrubber" id="scrubber">
          <div class="scrubber-track">
            <div class="scrubber-fill" id="scrubberFill"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="video-grid" id="videoList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
      authDomain: "chat-for-website-efee2.firebaseapp.com",
      projectId: "chat-for-website-efee2",
      storageBucket: "chat-for-website-efee2.firebasestorage.app",
      messagingSenderId: "509309222193",
      appId: "1:509309222193:web:f487258cfba2f7f7b00410"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PLAYLIST_DOC_REF = db.collection('playlist').doc('main');
  </script>

  <script>

    const DEFAULT_VIDEO_LIST = [
      { url: "https://youtube.com/watch?v=euMJknnSSqk", title: "Video One" },
      { url: "https://youtube.com/watch?v=VuivQyVyKDM", title: "Video Two" },
      { url: "https://youtube.com/watch?v=Jc9Eay0tedo", title: "Video Three" }
    ];

    const videoListEl = document.getElementById('videoList');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const gridFrameEl = document.getElementById('gridFrame');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const scrubberEl = document.getElementById('scrubber');
    const scrubberFillEl = document.getElementById('scrubberFill');
    const videoEl = document.getElementById('videoEl');

    let currentVideos = [];
    let hasLoadedInitialVideo = false;
    let gridOpen = false;
    let backend = 'youtube';
    let videoReady = false;
    let hlsInstance = null;
    let wantsUnmute = false;
    let isUnmutedIntent = false;
    let resumeAfterDirectSeek = false;
    let directSeekRecoveryTimer = null;
    let directSeekRetryTimer = null;
    let directSeekReloadTimer = null;
    let directVideoWasPlaying = false;
    let directSeekTarget = 0;
    let directSeekGeneration = 0;
    const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
      /iP(hone|od|ad)/.test(navigator.platform) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function resumeDirectVideoAfterSeek() {
      if (!resumeAfterDirectSeek || backend !== 'video' || videoEl.ended) return;
      videoEl.play().catch(() => {});
    }

    function recoverDirectVideoAfterSeek() {
      const seekGeneration = directSeekGeneration;
      clearTimeout(directSeekRecoveryTimer);
      clearTimeout(directSeekRetryTimer);
      clearTimeout(directSeekReloadTimer);
      resumeDirectVideoAfterSeek();
      // Native HLS can report `seeked` before iOS has finished pausing its
      // internal player. Retry after that state change without reloading the
      // Bunny stream (which would discard the requested position).
      directSeekRecoveryTimer = setTimeout(resumeDirectVideoAfterSeek, 350);
      directSeekRetryTimer = setTimeout(function () {
        resumeDirectVideoAfterSeek();
      }, 1200);
      directSeekReloadTimer = setTimeout(function () {
        if (seekGeneration !== directSeekGeneration || hlsInstance || !resumeAfterDirectSeek || backend !== 'video' || videoEl.ended || !videoEl.currentSrc || (!videoEl.seeking && videoEl.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA)) return;
        const source = videoEl.currentSrc;
        const target = directSeekTarget;
        videoEl.addEventListener('loadedmetadata', function restoreStalledSeek() {
          if (seekGeneration !== directSeekGeneration) return;
          const duration = videoEl.duration;
          videoEl.currentTime = isFinite(duration) ? Math.min(target, Math.max(0, duration - 0.05)) : target;
          videoEl.play().catch(() => {});
        }, { once: true });
        // iOS native HLS occasionally leaves the old media request stalled.
        videoEl.src = source;
        videoEl.load();
      }, 2200);
    }

    // Covers our scrubber and Safari's native fullscreen scrubber. Safari may
    // temporarily set `paused` during an HLS seek, so retain the last playing
    // state instead of trusting `paused` only at this event.
    videoEl.addEventListener('seeking', () => {
      directSeekGeneration += 1;
      resumeAfterDirectSeek = backend === 'video' && !videoEl.ended &&
        (!videoEl.paused || directVideoWasPlaying);
      if (resumeAfterDirectSeek) recoverDirectVideoAfterSeek();
    });
    videoEl.addEventListener('seeked', () => {
      recoverDirectVideoAfterSeek();
    });

    function seekDirectVideo(t) {
      directSeekTarget = t;
      directSeekGeneration += 1;
      resumeAfterDirectSeek = backend === 'video' && !videoEl.paused && !videoEl.ended;
      videoEl.currentTime = t;
      if (resumeAfterDirectSeek) recoverDirectVideoAfterSeek();
    }

    function isDirectVideoUrl(input) {
      if (!input) return false;
      const trimmed = input.trim();
      return /^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed);
    }

    function setGridOpen(open) {
      gridOpen = open;
      gridFrameEl.classList.toggle('grid-open', gridOpen);
      gridToggleBtn.textContent = gridOpen ? 'Close' : 'Videos';
    }
    gridToggleBtn.addEventListener('click', () => {
      setGridOpen(!gridOpen);
      showControls(true);
    });

    const CONTROLS_AUTO_HIDE_MS = 3000;
    const supportsHover = window.matchMedia('(hover: hover)').matches;
    let controlsHideTimer = null;

    function showControls(autoHide) {
      gridFrameEl.classList.add('controls-visible');
      clearTimeout(controlsHideTimer);
      if (autoHide) {
        controlsHideTimer = setTimeout(() => {
          gridFrameEl.classList.remove('controls-visible');
        }, CONTROLS_AUTO_HIDE_MS);
      }
    }
    function hideControlsNow() {
      clearTimeout(controlsHideTimer);
      gridFrameEl.classList.remove('controls-visible');
    }

    const playerBoxEl = document.querySelector('.player-box');
    if (supportsHover) {
      playerBoxEl.addEventListener('mouseenter', () => showControls(false));
      playerBoxEl.addEventListener('mouseleave', () => hideControlsNow());
    } else {
      playerBoxEl.addEventListener('touchstart', (e) => {
        if (e.target.closest('.unmute-btn, .scrubber')) {
          showControls(true);
          return;
        }
        if (gridFrameEl.classList.contains('controls-visible')) {
          hideControlsNow();
        } else {
          showControls(true);
        }
      }, { passive: true });
    }

    let ytPlayer = null;
    let ytApiReady = false;

    let playerReady = false;
    let pendingVideo = null;
    const videoLoading = document.getElementById('videoLoading');

    function showVideoLoading() {
      videoLoading.hidden = false;
      playerBoxEl.classList.add('is-loading');
    }
    function hideVideoLoading() {
      videoLoading.hidden = true;
      playerBoxEl.classList.remove('is-loading');
    }

    function updateMuteBtnLabel() {
      if (backend === 'video') {
        unmuteBtn.textContent = videoEl.muted ? 'Unmute' : 'Mute';
        return;
      }
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      unmuteBtn.textContent = ytPlayer.isMuted() ? 'Unmute' : 'Mute';
    }

    function showBackendEl(kind) {
      document.getElementById('ytPlayer').style.display = kind === 'youtube' ? '' : 'none';
      videoEl.style.display = kind === 'video' ? '' : 'none';
    }

    function stopDirectVideo() {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      videoReady = false;
    }

    function applyUnmute() {
      if (!wantsUnmute) return;
      if (backend === 'video') {
        if (!videoReady) return;
        videoEl.muted = false;
        videoEl.volume = 1;
      } else {
        if (!ytPlayer || typeof ytPlayer.unMute !== 'function') return;
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
      }
      updateMuteBtnLabel();
      wantsUnmute = false;
    }

    function loadDirectVideo(url) {
      // Safari's native HLS path can lose the requested segment after a seek.
      // Bunny also publishes an MP4 rendition, whose byte-range seeking is
      // reliable on iOS; leave every other source untouched.
      if (isIOS) {
        const bunnyVod = url.match(/^(https:\/\/[^/]+\/[0-9a-f-]+)\/playlist\.m3u8(\?.*)?$/i);
        if (bunnyVod && /\.b-cdn\.net$/i.test(new URL(url).hostname)) {
          url = bunnyVod[1] + '/play_720p.mp4' + (bunnyVod[2] || '');
        }
      }
      backend = 'video';
      showBackendEl('video');
      showVideoLoading();
      videoReady = false;
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoEl);
      } else {
        videoEl.src = url;
      }
      videoEl.muted = true;
      videoEl.play().catch(() => {});
    }

    videoEl.addEventListener('loadedmetadata', () => {
      videoReady = true;
      updateMuteBtnLabel();
      sizePlayerToCover();
      applyUnmute();
    });
    videoEl.addEventListener('waiting', () => { if (backend === 'video') showVideoLoading(); });
    videoEl.addEventListener('playing', () => { if (backend === 'video') { directVideoWasPlaying = true; hideVideoLoading(); } });
    videoEl.addEventListener('pause', () => {
      // Let a same-turn `seeking` event retain the state that preceded it.
      setTimeout(() => { if (!videoEl.seeking) directVideoWasPlaying = false; }, 0);
    });
    videoEl.addEventListener('ended', () => { if (backend === 'video') { videoEl.currentTime = 0; videoEl.play().catch(() => {}); } });

    const OVERSCAN = 1.35;
    function sizePlayerToCover() {
      const box = document.querySelector('.player-box');
      const frame = box ? box.querySelector('iframe') : null;
      if (!box || !frame) return;
      const w = box.clientWidth;
      const h = box.clientHeight;
      if (!w || !h) return;
      const targetRatio = 16 / 9;
      let frameW, frameH;
      if (w / h > targetRatio) {
        frameW = w;
        frameH = w / targetRatio;
      } else {
        frameH = h;
        frameW = h * targetRatio;
      }
      frame.style.width = (frameW * OVERSCAN) + 'px';
      frame.style.height = (frameH * OVERSCAN) + 'px';
    }
    window.addEventListener('resize', sizePlayerToCover);

    function updateScrubber() {
      if (backend === 'video') {
        if (!videoReady) return;
        const duration = videoEl.duration || 0;
        if (!duration || !isFinite(duration)) return;
        const pct = Math.min(100, Math.max(0, (videoEl.currentTime / duration) * 100));
        scrubberFillEl.style.width = pct + '%';
        return;
      }
      if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
      const duration = ytPlayer.getDuration();
      if (!duration) return;
      const pct = Math.min(100, Math.max(0, (ytPlayer.getCurrentTime() / duration) * 100));
      scrubberFillEl.style.width = pct + '%';
    }
    setInterval(updateScrubber, 250);

    scrubberEl.addEventListener('click', (e) => {
      showControls(true);
      const rect = scrubberEl.getBoundingClientRect();
      const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      if (backend === 'video') {
        if (!videoReady) return;
        const duration = videoEl.duration || 0;
        if (!duration || !isFinite(duration)) return;
        seekDirectVideo(fraction * duration);
        scrubberFillEl.style.width = (fraction * 100) + '%';
        return;
      }
      if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
      const duration = ytPlayer.getDuration();
      if (!duration) return;
      ytPlayer.seekTo(fraction * duration, true);
      scrubberFillEl.style.width = (fraction * 100) + '%';
    });

    function onPlayerReady() {
      playerReady = true;
      updateMuteBtnLabel();
      sizePlayerToCover();
      applyUnmute();
      if (pendingVideo) {
        showVideoLoading();
        ytPlayer.loadVideoById(pendingVideo.id);
        pendingVideo = null;
      }
    }

    function onPlayerStateChange(e) {
      if (backend !== 'youtube') return;
      if (e.data === YT.PlayerState.PLAYING) {
        hideVideoLoading();
        applyUnmute();
      } else if (e.data === YT.PlayerState.BUFFERING) {
        showVideoLoading();
      }
      if (e.data === YT.PlayerState.ENDED) {
        ytPlayer.seekTo(0);
        ytPlayer.playVideo();
      } else if (e.data === YT.PlayerState.PAUSED) {

        ytPlayer.playVideo();
      }
    }

    videoEl.addEventListener('pause', () => {
      if (backend === 'video' && videoReady) videoEl.play().catch(() => {});
    });

    function createPlayer(id) {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: id,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          iv_load_policy: 3,
          cc_load_policy: 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function loadVideo(video) {
      const id = video.id;
      document.querySelectorAll('.video-tile').forEach((el) => {
        el.classList.toggle('active', el.getAttribute('data-id') === id);
      });
      setGridOpen(false);
      scrubberFillEl.style.width = '0%';

      if (video.type === 'direct') {
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
        wantsUnmute = isUnmutedIntent;
        loadDirectVideo(video.url);
        return;
      }

      backend = 'youtube';
      showBackendEl('youtube');
      stopDirectVideo();
      if (ytPlayer && playerReady) {
        showVideoLoading();
        ytPlayer.loadVideoById(id);
      } else if (ytApiReady && !ytPlayer) {
        createPlayer(id);
      } else {

        pendingVideo = { id };
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      ytApiReady = true;
      if (pendingVideo && !ytPlayer) {
        const { id } = pendingVideo;
        pendingVideo = null;
        createPlayer(id);
      }
    };

    unmuteBtn.addEventListener('click', () => {
      showControls(true);
      if (backend === 'video') {
        if (!videoReady) return;
        if (videoEl.muted) { videoEl.muted = false; videoEl.volume = 1; isUnmutedIntent = true; }
        else { videoEl.muted = true; isUnmutedIntent = false; }
        updateMuteBtnLabel();
        return;
      }
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        isUnmutedIntent = true;
      } else {
        ytPlayer.mute();
        isUnmutedIntent = false;
      }
      updateMuteBtnLabel();
    });

    function extractVideoId(input) {
      if (!input) return null;
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const m = trimmed.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function renderList(list) {
      const videos = list
        .map(v => {
          const ytId = extractVideoId(v.url);
          const directUrl = !ytId && isDirectVideoUrl(v.url) ? v.url.trim() : null;
          const id = ytId || directUrl;
          if (!id) return null;
          return {
            id,
            type: ytId ? 'youtube' : 'direct',
            url: directUrl,
            title: (v.title && v.title.trim()) ? v.title.trim() : 'Untitled',
            thumb: (v.thumb && v.thumb.trim()) ? v.thumb.trim() : ''
          };
        })
        .filter(Boolean);

      currentVideos = videos;

      if (!videos.length) {
        videoListEl.innerHTML = '<div class="empty-state">No videos yet.</div>';
        return;
      }

      videoListEl.innerHTML = videos.map(v => {
        const thumbSrc = v.thumb || (v.type === 'youtube' ? `https://img.youtube.com/vi/${v.id}/mqdefault.jpg` : '');
        return `
        <button type="button" class="video-tile" data-id="${escapeHtml(v.id)}" data-title="${escapeHtml(v.title)}">
          <span class="video-thumb">
            ${thumbSrc ? `<img src="${escapeHtml(thumbSrc)}" alt="" loading="lazy">` : ''}
            <span class="play-icon">
              <svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.45)"/><polygon points="10 8 17 12 10 16"></polygon></svg>
            </span>
          </span>
          <span class="video-title">${escapeHtml(v.title)}</span>
        </button>
      `;
      }).join('');

      if (!hasLoadedInitialVideo) {
        hasLoadedInitialVideo = true;
        loadVideo(videos[0]);
      }
    }

    videoListEl.addEventListener('click', (e) => {
      const tile = e.target.closest('.video-tile');
      if (!tile) return;
      e.preventDefault();
      const id = tile.getAttribute('data-id');
      const video = currentVideos.find(v => v.id === id);
      if (video) loadVideo(video);
    });

    PLAYLIST_DOC_REF.onSnapshot(function (doc) {
      const data = doc.exists ? doc.data() : null;
      const list = (data && Array.isArray(data.videos) && data.videos.length) ? data.videos : DEFAULT_VIDEO_LIST;
      renderList(list);
    }, function (err) {
      console.error('Playlist sync error:', err);
      renderList(DEFAULT_VIDEO_LIST);
    });
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js"></script>

<script>

  if (window.parent !== window) {
    document.addEventListener('mousemove', function (e) {
      window.parent.postMessage({ type: 'knobsock-chase-mousemove', x: e.clientX, y: e.clientY }, '*');
    }, { passive: true });
  }
</script>

</body>
</html>
