<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos</title>
<style>
  :root {
    /* Forest green, matching the Newest Video card this sits on. */
    --accent: #228B22;
    --accent-rgb: 34, 139, 34;
    --text-dim: rgba(255, 255, 0, 0.65);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Fully transparent — sits directly on whatever background the block
     already has, and scales with whatever size the Universe code block
     gives it. */
  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    min-height: 100%;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: yellow;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* Transparent, so the card's colour shows through it — meaning this
       padding reads as part of the frame around the video, not as space
       inside the widget. Halved along with the card's own padding when
       that frame was thinned. */
    padding: 6px;
  }

  a { text-decoration: none; color: inherit; }

  /* No border, no background of its own — fully transparent, flush to
     the left edge, filling the block's full width at any size. Sizing
     below uses plain flex-basis percentages instead of container-query
     (cqw/cqh) units: those need the frame to have a definite height to
     resolve correctly, which isn't guaranteed in every way this block
     can be embedded, and percentages of the row's real rendered width
     work unconditionally in every case. */
  .grid-frame {
    position: relative;
    width: 100%;
    height: 100%;
    align-self: stretch;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 2px;
    overflow: hidden;
  }

  /* Opens the grid as an overlay on mobile (see the media query below) —
     hidden entirely on wider screens, where the grid is already visible
     inline and there's nothing to toggle. */
  .grid-toggle-btn {
    display: none;
    position: absolute;
    bottom: 8px;
    right: 8px;
    z-index: 30;
    background: rgba(var(--accent-rgb), 0.5);
    /* White, not the dark ink these used before — that read fine on the
       old light periwinkle accent, but forest green at half opacity over
       the video underneath is far too dark to carry it. */
    color: #fff;
    border: 1px solid rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  /* Every overlay control (both buttons and the scrubber below) stays
     half-transparent whenever visible, and fades to invisible by default
     — .grid-frame.controls-visible (toggled by the hover/tap logic in the
     JS) is what actually shows them. Pointer-events stay on even while
     invisible: these sit in fixed spots, so a tap there should always
     work on the first try instead of needing one tap just to reveal a
     control and a second one to actually hit it. */
  .unmute-btn,
  .grid-toggle-btn,
  .scrubber {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .grid-frame.controls-visible .unmute-btn,
  .grid-frame.controls-visible .grid-toggle-btn,
  .grid-frame.controls-visible .scrubber {
    opacity: 1;
  }

  /* Mini player at the top — plain percentage width + aspect-ratio, so it
     scales correctly on any screen without relying on viewport or
     container-query units. */
  .player-wrap {
    flex-shrink: 0;
    margin-bottom: 10px;
  }
  .player-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  /* Sits over the player while the YouTube embed has nothing to show
     yet — before the player's first onReady, and again while switching
     videos — so it doesn't just sit frozen on black. The box's own
     black background (.is-loading below) is dropped for the same
     stretch, so this reads as transparent/matching whatever's behind
     the widget instead of a solid black box. */
  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .player-box.is-loading { background: transparent; }
  .player-box.is-loading iframe { visibility: hidden; }

  .gif-loader {
    display: block;
    width: min(45px, 20%);
    height: auto;
    opacity: 0.5;
  }
  .player-box iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 0;
    /* Width/height are set in JS (sizePlayerToCover) rather than fixed
       here — the iframe is deliberately oversized in one dimension and
       centered so the video crops/fills the box completely instead of
       letterboxing when the box isn't exactly 16:9 (e.g. the full-height
       mobile player). */
    /* Blocks clicks from ever reaching the video itself — that's what
       was triggering YouTube's own big center play/pause icon flash
       and hover-triggered branding. With no interaction possible,
       neither ever appears; the unmute button below is a separate
       element on top, so it isn't affected by this. */
    pointer-events: none;
  }
  /* The only visible control — everything YouTube would normally show
     (play/pause, scrub bar, fullscreen, etc.) is turned off below. */
  .unmute-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 5;
    background: rgba(var(--accent-rgb), 0.5);
    /* White, not the dark ink these used before — that read fine on the
       old light periwinkle accent, but forest green at half opacity over
       the video underneath is far too dark to carry it. */
    color: #fff;
    border: 1px solid rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  /* Matches the buttons' accent color. A generous invisible hit area
     (.scrubber) wraps a thin visible bar (.scrubber-track) so it's easy
     to tap accurately on a phone without the bar itself looking oversized. */
  .scrubber {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 6px;
    z-index: 5;
    height: 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .scrubber-track {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  .scrubber-fill {
    width: 0%;
    height: 100%;
    background: rgba(var(--accent-rgb), 0.9);
  }

  /* Grid instead of a list: each thumbnail gets its own full-width row
     in its column, so the title underneath always has the whole tile's
     width to wrap in — no more squeezing text into a narrow slot next
     to a thumbnail, which was the actual cause of the sizing problems. */
  .video-grid {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-content: start;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .video-grid::-webkit-scrollbar { display: none; }

  .video-tile {
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    min-width: 0;
    /* Stripping the browser's own button chrome — these are <button>s so
       they can't navigate anywhere (see renderList), not for the look. */
    appearance: none;
    -webkit-appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
  }

  .video-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #222;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }
  .video-tile.active .video-thumb {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-thumb .play-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-thumb .play-icon svg {
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7));
  }

  .video-title {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: break-word;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    /* Caps every title at two lines so tiles line up evenly instead of
       one long title making its row taller than the rest. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty-state {
    grid-column: 1 / -1;
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  /* Narrow columns keep 2 tiles per row (not 1) — just tighten the gap
     a bit so two skinny tiles still have breathing room. */
  @media (max-width: 220px) {
    .video-grid { gap: 8px; }
  }

  /* Mobile: the grid disappears entirely and the player takes over the
     whole block. .player-wrap grows to fill all the leftover height in
     .grid-frame, and centers .player-box inside it; .player-box itself
     just goes full-width with height following the locked 16:9 ratio —
     the same plain width + aspect-ratio approach used everywhere else
     in this file, so it doesn't depend on container queries. */
  @media (max-width: 480px) {
    .grid-frame { padding: 0; }
    .player-wrap {
      flex: 1 1 auto;
      min-height: 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }
    /* Fills the whole wrap exactly (not just a 16:9 slice of it) — the
       iframe inside is what stays locked to 16:9 and gets cropped to
       cover this box completely (see sizePlayerToCover in the JS). */
    .player-box {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      border-radius: 0;
    }

    /* Smaller on mobile — same styling, just more compact. */
    .unmute-btn,
    .grid-toggle-btn {
      padding: 3px 6px;
      font-size: 9px;
      border-radius: 5px;
    }
    /* Sits just above the button row instead of directly under it — the
       Videos button lives in that same bottom-right corner, so a scrubber
       flush with the very bottom edge would sit right underneath it. */
    .scrubber {
      left: 6px;
      right: 6px;
      bottom: 32px;
      height: 10px;
    }
    .scrubber-track { height: 3px; }

    /* Closed by default (just the player), opens as a full-screen
       overlay on top of everything when .grid-frame gets .grid-open. */
    .grid-toggle-btn { display: inline-flex; align-items: center; justify-content: center; }
    .video-grid { display: none; }
    .grid-frame.grid-open .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(8, 8, 8, 0.97);
      padding: 10px 10px 44px;
      margin: 0;
    }
  }
</style>
</head>
<body>
  <div class="grid-frame" id="gridFrame">
    <!-- Mobile only (see CSS) — opens/closes the grid as a full overlay
         on top of the player, letting you pick a video without giving
         up the full-size player view. -->
    <button class="grid-toggle-btn" id="gridToggleBtn">Videos</button>

    <div class="player-wrap">
      <div class="player-box is-loading">
        <div id="ytPlayer"></div>
        <div class="video-loading" id="videoLoading">
          <img class="gif-loader" src="/IMG_9407.gif" alt="Loading video…">
        </div>
        <button class="unmute-btn" id="unmuteBtn" title="Unmute">Unmute</button>
        <div class="scrubber" id="scrubber">
          <div class="scrubber-track">
            <div class="scrubber-fill" id="scrubberFill"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="video-grid" id="videoList">
      <div class="empty-state"><img class="gif-loader" src="/IMG_9407.gif" alt="Loading…"></div>
    </div>
  </div>

  <!-- ============================================================
       FIREBASE — same project AND same collection/document as the
       video player widget ("playlist"/"main"). This is read-only:
       whatever's saved there through that widget's admin panel shows
       up here automatically, live, with no separate list to manage.
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
      authDomain: "chat-for-website-efee2.firebaseapp.com",
      projectId: "chat-for-website-efee2",
      storageBucket: "chat-for-website-efee2.firebasestorage.app",
      messagingSenderId: "509309222193",
      appId: "1:509309222193:web:f487258cfba2f7f7b00410"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Same document the video player widget reads/writes.
    const PLAYLIST_DOC_REF = db.collection('playlist').doc('main');
  </script>

  <script>
    // Fallback only, matching the video widget's own default list — used
    // before the Firestore document has ever been saved, or if it's
    // temporarily unreachable.
    const DEFAULT_VIDEO_LIST = [
      { url: "https://youtube.com/watch?v=euMJknnSSqk", title: "Video One" },
      { url: "https://youtube.com/watch?v=VuivQyVyKDM", title: "Video Two" },
      { url: "https://youtube.com/watch?v=Jc9Eay0tedo", title: "Video Three" }
    ];

    const videoListEl = document.getElementById('videoList');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const gridFrameEl = document.getElementById('gridFrame');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const scrubberEl = document.getElementById('scrubber');
    const scrubberFillEl = document.getElementById('scrubberFill');

    let currentVideos = [];
    let hasLoadedInitialVideo = false;
    let gridOpen = false;

    // Mobile only in practice (the button and overlay are both hidden by
    // CSS above 480px) — toggles the grid open/closed on top of the player.
    function setGridOpen(open) {
      gridOpen = open;
      gridFrameEl.classList.toggle('grid-open', gridOpen);
      gridToggleBtn.textContent = gridOpen ? 'Close' : 'Videos';
    }
    gridToggleBtn.addEventListener('click', () => {
      setGridOpen(!gridOpen);
      showControls(true);
    });

    // ---------- Auto-hiding controls ----------
    // Both overlay buttons stay invisible until you interact, then fade
    // out again — hovering keeps them up on a real mouse (desktop), while
    // a touch device has no hover, so a tap reveals them and a timer
    // hides them again a second later.
    const CONTROLS_AUTO_HIDE_MS = 1000;
    const supportsHover = window.matchMedia('(hover: hover)').matches;
    let controlsHideTimer = null;

    function showControls(autoHide) {
      gridFrameEl.classList.add('controls-visible');
      clearTimeout(controlsHideTimer);
      if (autoHide) {
        controlsHideTimer = setTimeout(() => {
          gridFrameEl.classList.remove('controls-visible');
        }, CONTROLS_AUTO_HIDE_MS);
      }
    }
    function hideControlsNow() {
      clearTimeout(controlsHideTimer);
      gridFrameEl.classList.remove('controls-visible');
    }

    const playerBoxEl = document.querySelector('.player-box');
    if (supportsHover) {
      playerBoxEl.addEventListener('mouseenter', () => showControls(false));
      playerBoxEl.addEventListener('mouseleave', () => hideControlsNow());
    } else {
      playerBoxEl.addEventListener('touchstart', () => showControls(true), { passive: true });
    }

    // Real playback goes through the YouTube IFrame Player API (not a
    // plain src iframe) — that's what lets controls be turned off
    // entirely while still exposing our own mute/unmute toggle.
    let ytPlayer = null;
    let ytApiReady = false;
    // playerReady is distinct from ytPlayer existing — the YT.Player
    // instance is returned synchronously, but its methods (loadVideoById,
    // isMuted, etc.) only actually work once onReady has fired.
    let playerReady = false;
    let pendingVideo = null;
    const videoLoading = document.getElementById('videoLoading');

    function showVideoLoading() {
      videoLoading.hidden = false;
      playerBoxEl.classList.add('is-loading');
    }
    function hideVideoLoading() {
      videoLoading.hidden = true;
      playerBoxEl.classList.remove('is-loading');
    }

    function updateMuteBtnLabel() {
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      unmuteBtn.textContent = ytPlayer.isMuted() ? 'Unmute' : 'Mute';
    }

    // Sizes the actual <iframe> (not .player-box) so it's always at least
    // as big as the box in both directions while staying locked to 16:9 —
    // whichever dimension that requires it to overshoot, it overshoots,
    // and .player-box's own overflow:hidden clips the rest. That's what
    // makes the video crop-to-fill instead of letterboxing when the box
    // itself isn't exactly 16:9 (the mobile full-height player).
    //
    // OVERSCAN pushes every edge of the iframe strictly past the box's
    // edges (instead of landing flush on the tighter dimension) — YouTube
    // anchors its own chrome (the captions bar, the "more videos" corner
    // tray) right at the iframe's real edges, so without this margin one
    // edge of that chrome sits exactly on the visible boundary and still
    // shows. Overscanning crops it out along with a small sliver of video.
    const OVERSCAN = 1.35;
    function sizePlayerToCover() {
      const box = document.querySelector('.player-box');
      const frame = box ? box.querySelector('iframe') : null;
      if (!box || !frame) return;
      const w = box.clientWidth;
      const h = box.clientHeight;
      if (!w || !h) return;
      const targetRatio = 16 / 9;
      let frameW, frameH;
      if (w / h > targetRatio) {
        frameW = w;
        frameH = w / targetRatio;
      } else {
        frameH = h;
        frameW = h * targetRatio;
      }
      frame.style.width = (frameW * OVERSCAN) + 'px';
      frame.style.height = (frameH * OVERSCAN) + 'px';
    }
    window.addEventListener('resize', sizePlayerToCover);

    // ---------- Scrubber ----------
    // Polls playback position rather than relying on a player event —
    // the IFrame API has no "time update" event, just onStateChange.
    function updateScrubber() {
      if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
      const duration = ytPlayer.getDuration();
      if (!duration) return;
      const pct = Math.min(100, Math.max(0, (ytPlayer.getCurrentTime() / duration) * 100));
      scrubberFillEl.style.width = pct + '%';
    }
    setInterval(updateScrubber, 250);

    scrubberEl.addEventListener('click', (e) => {
      showControls(true);
      if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
      const duration = ytPlayer.getDuration();
      if (!duration) return;
      const rect = scrubberEl.getBoundingClientRect();
      const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      ytPlayer.seekTo(fraction * duration, true);
      scrubberFillEl.style.width = (fraction * 100) + '%';
    });

    function onPlayerReady() {
      playerReady = true;
      updateMuteBtnLabel();
      sizePlayerToCover();
      showControls(true);
      if (pendingVideo) {
        showVideoLoading();
        ytPlayer.loadVideoById(pendingVideo.id);
        pendingVideo = null;
      }
    }

    // Restarts the current video the instant it ends instead of letting
    // YouTube show its own "more videos" end-screen grid — since the video
    // never actually sits in the ENDED state, that overlay never appears.
    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        hideVideoLoading();
      } else if (e.data === YT.PlayerState.BUFFERING) {
        showVideoLoading();
      }
      if (e.data === YT.PlayerState.ENDED) {
        ytPlayer.seekTo(0);
        ytPlayer.playVideo();
      } else if (e.data === YT.PlayerState.PAUSED) {
        // This player has no visible controls and is never meant to sit
        // paused — resuming instantly here is also what keeps YouTube's
        // own big center pause icon (and the mobile "resume" icon under
        // it) from lingering, since both are tied to the paused state.
        ytPlayer.playVideo();
      }
    }

    function createPlayer(id) {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: id,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 0,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          iv_load_policy: 3,
          cc_load_policy: 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function loadVideo(id) {
      document.querySelectorAll('.video-tile').forEach((el) => {
        el.classList.toggle('active', el.getAttribute('data-id') === id);
      });
      setGridOpen(false);
      scrubberFillEl.style.width = '0%';

      if (ytPlayer && playerReady) {
        showVideoLoading();
        ytPlayer.loadVideoById(id);
      } else if (ytApiReady && !ytPlayer) {
        createPlayer(id);
      } else {
        // Either the player hasn't been created yet, or it has but
        // onReady hasn't fired — either way, queue this and let
        // whichever fires next (API ready or player ready) pick it up.
        pendingVideo = { id };
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      ytApiReady = true;
      if (pendingVideo && !ytPlayer) {
        const { id } = pendingVideo;
        pendingVideo = null;
        createPlayer(id);
      }
    };

    unmuteBtn.addEventListener('click', () => {
      showControls(true);
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
      } else {
        ytPlayer.mute();
      }
      updateMuteBtnLabel();
    });

    function extractVideoId(input) {
      if (!input) return null;
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const m = trimmed.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function renderList(list) {
      const videos = list
        .map(v => ({ id: extractVideoId(v.url), title: (v.title && v.title.trim()) ? v.title.trim() : 'Untitled' }))
        .filter(v => v.id);

      currentVideos = videos;

      if (!videos.length) {
        videoListEl.innerHTML = '<div class="empty-state">No videos yet.</div>';
        return;
      }

      // Deliberately a <button>, not an <a href="youtube.com/watch?v=...">.
      // These tiles always play inline in the mini player above, so the
      // href never got used — it was only ever suppressed by the
      // preventDefault below. That made it a loaded gun: any moment the
      // handler didn't run (Safari replaying a queued tap when you
      // reopen the app, the listener not attached yet, an exception
      // earlier in this script) and the browser would just follow the
      // link straight to youtube.com. A button has nowhere to navigate
      // to, so that can't happen at all.
      videoListEl.innerHTML = videos.map(v => `
        <button type="button" class="video-tile" data-id="${v.id}" data-title="${escapeHtml(v.title)}">
          <span class="video-thumb">
            <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
            <span class="play-icon">
              <svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.45)"/><polygon points="10 8 17 12 10 16"></polygon></svg>
            </span>
          </span>
          <span class="video-title">${escapeHtml(v.title)}</span>
        </button>
      `).join('');

      // Only auto-load a video the very first time the list arrives —
      // later updates (an admin editing the list elsewhere) shouldn't
      // interrupt whatever's currently playing.
      if (!hasLoadedInitialVideo) {
        hasLoadedInitialVideo = true;
        loadVideo(videos[0].id);
      }
    }

    // Clicking a tile plays it in the mini player above instead of
    // navigating away to YouTube.
    videoListEl.addEventListener('click', (e) => {
      const tile = e.target.closest('.video-tile');
      if (!tile) return;
      e.preventDefault();
      loadVideo(tile.getAttribute('data-id'));
    });

    // ---------- LIVE SYNC FROM FIRESTORE ----------
    // Same document the video player widget subscribes to — any change
    // saved from that widget's admin panel updates this list too, live.
    PLAYLIST_DOC_REF.onSnapshot(function (doc) {
      const data = doc.exists ? doc.data() : null;
      const list = (data && Array.isArray(data.videos) && data.videos.length) ? data.videos : DEFAULT_VIDEO_LIST;
      renderList(list);
    }, function (err) {
      console.error('Playlist sync error:', err);
      renderList(DEFAULT_VIDEO_LIST);
    });
  </script>

  <!-- YouTube IFrame Player API — required for controls:0 plus a custom
       mute/unmute toggle to work together. -->
  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
