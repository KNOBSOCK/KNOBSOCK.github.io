:root{--gold:#ffd21a;--cyan:#87939b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#frame{width:100%;height:100%;display:grid;place-items:center;font-family:GratisNeue,Arial,sans-serif;color:#efffff}
#place{-webkit-text-stroke:1.5px #000;paint-order:stroke fill}.kicker,.coords,#status{-webkit-text-stroke:1px #000;paint-order:stroke fill}
.panel{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);aspect-ratio:1/1;max-height:100vh;padding:14px 16px 12px;border:0;background:transparent;box-shadow:none;overflow:hidden}
.kicker{font:bold 9px/1.2 GratisNeue,Arial,sans-serif;letter-spacing:2px;color:var(--cyan)}.title{font:bold 21px/1.1 GratisNeue,Arial,sans-serif;letter-spacing:2px}
.coords{font:9px/1.4 monospace;color:#92aeb3;text-align:right}.map-wrap{position:absolute;inset:10px 8px 10px;overflow:hidden}
.map-wrap svg{display:block;position:absolute;inset:0;height:100%;width:100%;min-height:0;min-width:0;overflow:hidden}.district{stroke:#68727a;stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .4s,stroke .4s,filter .4s}
#districts .district{animation:crt-line-flicker 3.8s steps(1,end) infinite}
#districts .district:nth-child(5n+1){animation-delay:-.7s}#districts .district:nth-child(5n+2){animation-delay:-1.4s}#districts .district:nth-child(5n+3){animation-delay:-2.1s}#districts .district:nth-child(5n+4){animation-delay:-2.8s}
@keyframes crt-line-flicker{0%,17%,19%,46%,48%,73%,75%,100%{stroke-opacity:.96}18%,47%,74%{stroke-opacity:.76}}
.manhattan,.brooklyn,.queens,.bronx,.staten{fill:#202830b8}
.district.is-current{fill:#ffd21a!important;fill-opacity:.92;stroke:#fff2a5;stroke-width:1.6;filter:drop-shadow(0 0 4px #ffd21a) drop-shadow(0 0 11px #ffae00)}
.readout{position:absolute;z-index:3;bottom:12px;left:0;right:0;padding:9px 11px;background:transparent;border:0;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none}
.beacon{width:9px;height:9px;flex:none;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 1.5s infinite}
#place{font:bold 15px/1.1 GratisNeue,Arial,sans-serif;letter-spacing:.02em;color:var(--gold)}#status{font:8px/1.4 GratisNeue,Arial,sans-serif;letter-spacing:1px;color:#aab0b4;margin-top:3px}
@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}
.embed .panel{width:100vw;height:100vh;padding:0}.embed .map-wrap{inset:0}
.embed .readout{bottom:5vh;padding:0 5vw;gap:4vw}.embed .beacon{width:clamp(4px,4.5vw,9px);height:clamp(4px,4.5vw,9px)}
.embed #districts .district{animation:none;stroke-opacity:.92}
.embed .map-wrap svg{animation:crt-map-flicker 1.6s linear infinite}
@keyframes crt-map-flicker{0%,100%{filter:brightness(1)}8%{filter:brightness(.97)}17%{filter:brightness(1.02)}29%{filter:brightness(.98)}41%{filter:brightness(1.03)}53%{filter:brightness(.99)}67%{filter:brightness(1.01)}80%{filter:brightness(.98)}92%{filter:brightness(1.02)}}

</section></div><script>
const ENDPOINT='https://ypofuhazhxtzvtywguew.supabase.co/functions/v1/stream-location';
const API_KEY='sb_publishable_IJH4--fqVrrTrxG7Ou1JKw_G2WPOiIO';
const place=document.getElementById('place');
const beacon=document.querySelector('.beacon');
const mapSvg=document.querySelector('.map-wrap svg');
const districtGroup=document.getElementById('districts');
const FULL_VIEW={x:0,y:50,width:440,height:500};
let activeCode='';let viewFrame=0;let rotationTimer=0;let rotationNode=null;
function stopRotation(){if(rotationTimer){clearTimeout(rotationTimer);rotationTimer=0}if(rotationNode){rotationNode.remove();rotationNode=null}}
function animateViewBox(target,duration){
  cancelAnimationFrame(viewFrame);
  const box=mapSvg.viewBox.baseVal;
  const start={x:box.x,y:box.y,width:box.width,height:box.height};
  const began=performance.now();
  function frame(now){
    const raw=Math.min(1,(now-began)/duration);const t=raw<.5?4*raw*raw*raw:1-Math.pow(-2*raw+2,3)/2;
    const next={x:start.x+(target.x-start.x)*t,y:start.y+(target.y-start.y)*t,width:start.width+(target.width-start.width)*t,height:start.height+(target.height-start.height)*t};
    mapSvg.setAttribute('viewBox',`${next.x} ${next.y} ${next.width} ${next.height}`);
    if(raw<1)viewFrame=requestAnimationFrame(frame);
  }
  viewFrame=requestAnimationFrame(frame);
}
function zoomViewFor(el){
  const b=el.getBBox();const rect=mapSvg.getBoundingClientRect();const aspect=rect.width/Math.max(1,rect.height);
  let width=Math.max(b.width*3.2,46);let height=Math.max(b.height*3.2,46);
  if(width/height<aspect)width=height*aspect;else height=width/aspect;
  const cx=b.x+b.width/2,cy=b.y+b.height/2;
  return{x:cx-width/2,y:cy-height/2,width,height,cx,cy};
}
function beginSlowRotation(cx,cy){
  rotationNode=document.createElementNS('http://www.w3.org/2000/svg','animateTransform');
  rotationNode.setAttribute('attributeName','transform');rotationNode.setAttribute('type','rotate');
  rotationNode.setAttribute('from',`0 ${cx} ${cy}`);rotationNode.setAttribute('to',`360 ${cx} ${cy}`);
  rotationNode.setAttribute('dur','180s');rotationNode.setAttribute('repeatCount','indefinite');rotationNode.setAttribute('begin','indefinite');
  districtGroup.appendChild(rotationNode);rotationNode.beginElement();
}
function restoreCity(){
  if(!activeCode)return;
  activeCode='';stopRotation();
  document.querySelectorAll('.district.is-current').forEach(x=>x.classList.remove('is-current'));
  animateViewBox(FULL_VIEW,1400);
}
function render(data){
if(data.ntaCode&&data.ntaCode!==activeCode){
  const el=document.querySelector('[data-code="'+CSS.escape(data.ntaCode)+'"]');
  if(el){stopRotation();document.querySelectorAll('.district.is-current').forEach(x=>x.classList.remove('is-current'));el.classList.add('is-current');activeCode=data.ntaCode;const target=zoomViewFor(el);animateViewBox(target,1800);rotationTimer=setTimeout(()=>beginSlowRotation(target.cx,target.cy),1900)}
}else if(!data.ntaCode)restoreCity();
if(data.neighborhood){place.textContent=data.neighborhood.toUpperCase()+', '+(data.borough||'NYC').toUpperCase();beacon.hidden=false}
else{place.textContent='LOCATION UNAVAILABLE';beacon.hidden=true}
}
async function update(){try{const r=await fetch(ENDPOINT,{headers:{apikey:API_KEY},cache:'no-store'});if(!r.ok)throw Error();render(await r.json())}catch(e){}}
if(new URLSearchParams(location.search).has('embed')){
  document.documentElement.classList.add('embed');
  if(matchMedia('(pointer: coarse)').matches)districtGroup.removeAttribute('filter');
  addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='knobsock-map')render(e.data.location||{})});
  try{parent.postMessage({type:'knobsock-map-ready'},location.origin)}catch(e){}
}else{update();setInterval(update,15000)}
</script></body></html>
