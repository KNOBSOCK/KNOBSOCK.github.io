<html lang="en">
<head>
<meta charset="UTF-8">

    if (window.top !== window.self) return;
    var route = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace('/app-shell.html?route=' + encodeURIComponent(route));
  })();

<title>Forums - KNOBSOCK</title>
<meta name="description" content="KNOBSOCK Forums">
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/forums">
<meta property="og:title" content="Forums - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="preload" as="image" href="/forums-page-desktop.png?v=2" media="(min-width: 861px)">
<link rel="preload" as="image" href="/forums-page-mobile.png?v=3" media="(max-width: 860px)">
<link rel="stylesheet" href="/forums.css?v=37">
<style>
  * { box-sizing: border-box; }
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  .forums-scene { position: fixed; inset: 0; overflow: hidden; }
  .scene-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
</style>
</head>
<body>
  <main class="forums-scene" aria-label="KNOBSOCK forums">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <linearGradient id="bulgeXGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgb(0,128,128)"/>
          <stop offset="20%" stop-color="rgb(107,128,128)"/>
          <stop offset="50%" stop-color="rgb(128,128,128)"/>
          <stop offset="80%" stop-color="rgb(148,128,128)"/>
          <stop offset="100%" stop-color="rgb(255,128,128)"/>
        </linearGradient>
        <linearGradient id="bulgeYGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgb(128,0,128)"/>
          <stop offset="20%" stop-color="rgb(128,107,128)"/>
          <stop offset="50%" stop-color="rgb(128,128,128)"/>
          <stop offset="80%" stop-color="rgb(128,148,128)"/>
          <stop offset="100%" stop-color="rgb(128,255,128)"/>
        </linearGradient>
        <rect id="bulgeXRect" width="100%" height="100%" fill="url(#bulgeXGrad)"/>
        <rect id="bulgeYRect" width="100%" height="100%" fill="url(#bulgeYGrad)"/>
      </defs>
      <filter id="crtWiggle" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" numOctaves="2" seed="7" result="crtNoise">
          <animate attributeName="baseFrequency" dur="7s" values="0.006 0.09;0.01 0.12;0.006 0.09" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="crtNoise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="crtConvex" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feImage href="#bulgeXRect" xlink:href="#bulgeXRect" x="0" y="0" width="100%" height="100%" result="bx"/>
        <feDisplacementMap id="feBulgeX" in="SourceGraphic" in2="bx" scale="90" xChannelSelector="R" yChannelSelector="G" result="stepX"/>
        <feImage href="#bulgeYRect" xlink:href="#bulgeYRect" x="0" y="0" width="100%" height="100%" result="by"/>
        <feDisplacementMap id="feBulgeY" in="stepX" in2="by" scale="90" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <section id="terminal" aria-label="Forum computer screen">
      <div id="forumScroll" tabindex="0">
        <div class="terminal-content">
          <a class="forum-logo" href="/" aria-label="KNOBSOCK home"><img src="/forums-logo.png" alt="KNOBSOCK FORUMS"></a>
          <nav class="forum-nav" aria-label="Forum navigation">
            <a href="#">Boards</a><a href="#recent">Recent</a><a href="#rules">Rules</a>
          </nav>
          <div id="identity" aria-live="polite"></div>
          <form id="searchForm" class="search"><label class="sr-only" for="forumSearch">Search thread titles</label><input id="forumSearch" maxlength="100" placeholder="Search threads…" type="search"><button>Search</button></form>
          <div id="forumStatus" role="status"></div>
          <div id="forumView" aria-live="polite">Loading boards…</div>
          <footer><a href="/privacy">Privacy &amp; User Agreement</a></footer>
        </div>
      </div>
      <div id="scrollRail"><button type="button" id="scrollUp" aria-label="Scroll forum up">▲</button><div id="scrollTrack"><div id="scrollThumb" role="scrollbar" tabindex="0" aria-label="Forum scroll" aria-controls="forumScroll" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div><button type="button" id="scrollDown" aria-label="Scroll forum down">▼</button></div>
    </section>
    <picture>
      <source media="(max-width: 860px)" srcset="/forums-page-mobile.png?v=3">
      <img class="scene-art" src="/forums-page-desktop.png?v=2" alt="">
    </picture>
    <button type="button" id="crtZoomTrigger" class="crt-zoom-trigger" aria-label="Fill the window with the forum screen" title="Fullscreen"><svg class="crt-zoom-icon" viewBox="0 0 48 20" aria-hidden="true" focusable="false"><path d="M1.5 8V1.5H11M37 1.5H46.5V8M46.5 12V18.5H37M11 18.5H1.5V12" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square"/></svg></button>
    <button type="button" id="crtExit" class="crt-exit" title="Exit fullscreen (Esc)">[ EXIT ]</button>
  </main>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="/forums.js?v=22"></script>
</body>
</html>
