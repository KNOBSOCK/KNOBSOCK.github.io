<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen</title>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>

  html, body { cursor: url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/cursor-pointer.png") 16 11, auto; }
  a, button { cursor: url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/cursor-pointer.png") 16 11, pointer; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    min-height: 100%;

    overflow-x: hidden;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #CBE600;
    display: flex;
    flex-direction: column;
    padding: 12px;
  }

  a { text-decoration: none; color: inherit; }

  .player-wrap {
    width: 100%;
    max-width: 500px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #scWidget {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    border: 0;
  }

  .now-playing {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .play-btn {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: #CBE600;
    color: #111;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);

    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .play-btn:hover:not(:disabled):not(.bounce-spin) {

    transform: scale(1.22) rotate(-6deg);
  }
  .play-btn:disabled { opacity: 0.5; cursor: default; }

  @keyframes playBtnBounceSpin {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.35) rotate(0deg); }
    55%  { transform: scale(0.88) rotate(180deg); }
    80%  { transform: scale(1.15) rotate(360deg); }
    100% { transform: scale(1) rotate(360deg); }
  }
  .play-btn.bounce-spin {
    animation: playBtnBounceSpin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .now-playing-info { min-width: 0; flex: 1 1 auto; }

  .track-title-wrap {
    overflow: hidden;
    white-space: nowrap;
  }

  .track-title {
    display: inline-flex;
    font-size: 15px;
    font-weight: 600;
  }

  .title-copy {
    white-space: nowrap;
    padding-right: 40px;
  }

  .track-title.scrolling {
    animation-name: marquee-scroll;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .progress-track {
    margin-top: 8px;
    width: 100%;
    height: 14px;
    display: flex;
    align-items: center;
  }
  .progress-track-bg {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(203, 230, 0, 0.2);
    overflow: hidden;
  }
  .progress-fill {
    width: 0%;
    height: 100%;
    background: #CBE600;
  }

  .track-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;

    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .track-list::-webkit-scrollbar { display: none; }
  .track-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0.75;

    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, opacity 0.15s;
    transform-origin: left center;
  }
  .track-item:hover { background: rgba(203, 230, 0, 0.12); opacity: 1; transform: scale(1.04); }
  .track-item.active { background: rgba(203, 230, 0, 0.18); opacity: 1; font-weight: 600; }
  .track-item .index { width: 14px; flex-shrink: 0; opacity: 0.6; font-variant-numeric: tabular-nums; }
  .track-item .name { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }

  .track-item .sc-link {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    opacity: 0.6;
  }
  .track-item .sc-link svg { width: 12px; height: 12px; display: block; }
  .track-item .sc-link:hover { opacity: 1; background: rgba(203, 230, 0, 0.2); }

  @media (max-width: 420px) {
    .now-playing { gap: 10px; }
    .play-btn { width: 40px; height: 40px; font-size: 14px; }
    .track-title { font-size: 12px; }
    .track-item { font-size: 11px; gap: 6px; }
  }

  @media (max-width: 220px) {
    .now-playing { gap: 8px; margin-bottom: 12px; }
    .play-btn { width: 32px; height: 32px; font-size: 12px; }
    .track-title { font-size: 11px; }
    .track-item { font-size: 10px; gap: 4px; padding: 6px 4px; }
    .track-item .index { width: 10px; }
    .track-item .sc-link { width: 16px; height: 16px; }
    .track-item .sc-link svg { width: 10px; height: 10px; }
  }
</style>
</head>
<body>
  <div class="player-wrap">

    <iframe
      id="scWidget"
      title="SoundCloud audio engine"
      scrolling="no"
      frameborder="no"
      allow="autoplay">
    </iframe>

    <div class="now-playing">
      <button class="play-btn" id="playBtn" disabled>&#9654;</button>
      <div class="now-playing-info">
        <div class="track-title-wrap" id="trackTitleWrap">
          <div class="track-title" id="trackTitle"><span class="title-copy">Loading…</span></div>
        </div>
        <div class="progress-track" id="progressTrack">
          <div class="progress-track-bg"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>
    </div>

    <div class="track-list" id="trackList"></div>
  </div>

<script>
  const iframeEl = document.getElementById("scWidget");
  const playBtn = document.getElementById("playBtn");
  const trackTitleWrapEl = document.getElementById("trackTitleWrap");
  const trackTitleEl = document.getElementById("trackTitle");
  const progressTrackEl = document.getElementById("progressTrack");
  const progressFillEl = document.getElementById("progressFill");
  const trackListEl = document.getElementById("trackList");

  let widget = null;
  let sounds = [];
  let currentIndex = 0;
  let isPlaying = false;
  let currentDuration = 0;

  function setTrackTitle(text) {
    trackTitleEl.classList.remove("scrolling");
    trackTitleEl.style.animationDuration = "";
    trackTitleEl.innerHTML = "";

    const firstCopy = document.createElement("span");
    firstCopy.className = "title-copy";
    firstCopy.textContent = text;
    trackTitleEl.appendChild(firstCopy);

    requestAnimationFrame(() => {
      if (trackTitleEl.scrollWidth <= trackTitleWrapEl.clientWidth) return;

      const secondCopy = document.createElement("span");
      secondCopy.className = "title-copy";
      secondCopy.textContent = text;
      trackTitleEl.appendChild(secondCopy);

      const pxPerSecond = 45;
      const duration = (trackTitleEl.scrollWidth / 2) / pxPerSecond;
      trackTitleEl.style.animationDuration = duration + "s";
      trackTitleEl.classList.add("scrolling");
    });
  }

  function renderTrackList() {
    trackListEl.innerHTML = sounds.map((sound, i) => `
      <div class="track-item${i === currentIndex ? " active" : ""}" data-index="${i}">
        <span class="index">${i + 1}</span>
        <span class="name">${sound.title}</span>
        <a class="sc-link" href="${sound.permalink_url}" target="_blank" rel="noopener noreferrer" title="Open on SoundCloud">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </a>
      </div>
    `).join("");
  }

  function setActiveTrack(index) {
    currentIndex = index;
    document.querySelectorAll(".track-item").forEach((el, i) => {
      el.classList.toggle("active", i === index);
    });
  }

  function updatePlayIcon() {
    playBtn.innerHTML = isPlaying ? "&#10074;&#10074;" : "&#9654;";
  }

  function bindWidgetEvents() {
    widget.bind(SC.Widget.Events.READY, () => {
      playBtn.disabled = false;

      widget.getSounds((allSounds) => {
        sounds = allSounds;
        renderTrackList();
      });

      widget.getCurrentSound((sound) => {
        if (sound) setTrackTitle(sound.title);
      });
    });

    widget.bind(SC.Widget.Events.PLAY, () => {
      isPlaying = true;
      updatePlayIcon();
      widget.getCurrentSound((sound) => {
        if (!sound) return;
        setTrackTitle(sound.title);
        currentDuration = sound.duration || 0;
        const idx = sounds.findIndex((s) => s.id === sound.id);
        if (idx !== -1) setActiveTrack(idx);
      });
    });

    widget.bind(SC.Widget.Events.PAUSE, () => {
      isPlaying = false;
      updatePlayIcon();
    });

    widget.bind(SC.Widget.Events.PLAY_PROGRESS, (data) => {
      progressFillEl.style.width = `${data.relativePosition * 100}%`;
    });

    widget.bind(SC.Widget.Events.FINISH, () => {
      progressFillEl.style.width = "0%";
    });
  }

  playBtn.addEventListener("click", () => {
    widget.toggle();

    playBtn.classList.remove("bounce-spin");
    void playBtn.offsetWidth;
    playBtn.classList.add("bounce-spin");
  });

  playBtn.addEventListener("animationend", (e) => {
    if (e.animationName !== "playBtnBounceSpin") return;

    playBtn.style.transition = "none";
    playBtn.classList.remove("bounce-spin");
    void playBtn.offsetWidth;
    playBtn.style.transition = "";
  });

  progressTrackEl.addEventListener("click", (e) => {
    if (!currentDuration) return;
    const rect = progressTrackEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    widget.seekTo(fraction * currentDuration);
    progressFillEl.style.width = `${fraction * 100}%`;
  });

  trackListEl.addEventListener("click", (e) => {
    if (e.target.closest(".sc-link")) return;
    const item = e.target.closest(".track-item");
    if (!item) return;
    const index = parseInt(item.getAttribute("data-index"), 10);
    setActiveTrack(index);
    widget.skip(index);
    widget.play();
  });

  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const soundcloudConfigRef = db.collection('chat_config').doc('soundcloud');

  function showNoAccountState() {
    setTrackTitle("No SoundCloud account linked yet.");
  }

  function startPlayer(profileUrl) {
    iframeEl.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(profileUrl) + "&auto_play=false&show_artwork=false";
    widget = SC.Widget(iframeEl);
    bindWidgetEvents();
  }

  soundcloudConfigRef.get().then((doc) => {
    const data = doc.exists ? doc.data() : null;
    if (data && data.profileUrl) {
      startPlayer(data.profileUrl);
    } else {
      showNoAccountState();
    }
  }).catch(() => {
    showNoAccountState();
  });
</script>

<script>

  if (window.parent !== window) {
    document.addEventListener('mousemove', function (e) {
      window.parent.postMessage({ type: 'knobsock-chase-mousemove', x: e.clientX, y: e.clientY }, '*');
    }, { passive: true });
  }
</script>

</body>
</html>
