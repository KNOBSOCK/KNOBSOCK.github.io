<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Video Player + Playlist</title>
<style>
  :root {
    --ink: #0a2a4a;
    --panel: rgba(10, 42, 74, 0.32);
    --panel-2: rgba(10, 42, 74, 0.8);
    --line: rgba(150, 200, 255, 0.6);
    --accent: #2f80ed;
    --accent-dim: #1c4e8a;
    --accent-yellow: #ffdd00;
    --text: #ffffff;
    --text-dim: #c9dcf5;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;
    /* Shared between .bg-glow and .layout below so the panel's edges and
       the content's padding can never drift apart at any window size —
       both reference the exact same values instead of two independently
       written formulas that merely happened to match. */
    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { position: relative; }

  /* ---------- BACKDROP ----------
     A padded, rounded panel with a 50% frosted backdrop blur — same blur
     treatment as the truth zone page's card (our 1-100 scale: 100% = 20px,
     so 50% = 10px). Full-bleed edge-to-edge (same as livestream-chat-
     widget.html's own .bg-glow) rather than capped at a fixed pixel
     width — a width cap here while .layout's height was free to grow
     unbounded is what made the widget elongate (get taller without
     getting wider) on a big/zoomed-out screen instead of scaling
     proportionally like live.html. */
  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(47, 128, 237, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- PAGE LAYOUT ----------
     Desktop: big player + playlist side by side, with the creator chin
     (below) as a fixed-height strip under both. Mobile (<= 860px wide):
     player on top, playlist scrolls below — same breakpoint and stacking
     pattern as the livestream widget; the chin stays pinned to the
     bottom either way since it's a sibling of .main-row inside .layout,
     not part of the row that flips direction. */
  .layout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 10px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .main-row {
    display: flex;
    flex-direction: row;
    flex: 1 1 auto;
    min-height: 0;
    gap: 14px;
  }

  .video-pane {
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    flex: 1 1 66%;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Sits over the video pane while the YouTube embed has nothing to show
     yet — before the player's first onReady, and again on a rebuffer —
     so switching/starting a video doesn't just look frozen on the
     previous frame. The pane keeps its normal solid black background
     here (same as live.html); the iframe is hidden below just so a
     rebuffer doesn't leave a stale frame showing under the gif. */
  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .video-pane.is-loading .video-frame-wrap iframe { visibility: hidden; }

  .gif-loader {
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .playlist-pane {
    flex: 1 1 34%;
    min-width: 280px;
    display: flex;
    container-type: size;
    container-name: playlistbox;
  }

  @media (max-width: 860px) {
    .main-row { flex-direction: column; }
    .video-pane { flex: 0 0 38vh; }
    /* min-height:0 (not just min-width) is required here: .main-row is
       column-direction on mobile, so .playlist-pane's relevant
       flex-shrink axis is now height, not width — without this override
       a flex item won't shrink below its content's natural height. The
       playlist itself already scrolls horizontally on mobile (see
       .playlist-items below) and stays a fixed height regardless of
       item count, so this mostly guards against .playlist-pane forcing
       the widget's own document to overflow (host pages now lock their
       own outer scroll on mobile — see videos.html — and rely on the
       widget staying inside whatever box it's given). */
    .playlist-pane { flex: 1 1 auto; min-width: 0; min-height: 0; }
  }

  .layout.playlist-hidden .playlist-pane { display: none; }
  .layout.playlist-hidden .video-pane { flex: 1 1 100%; }

  /* Landscape phone: the mobile stack above assumes a tall portrait
     screen (video capped to 38vh, playlist scrolling below it) — on
     its side, that same 38vh is a sliver of an already-short viewport.
     Rather than build a third layout, this just applies the same
     "Hide Playlist" treatment above unconditionally instead. Checked
     on max-height, not max-width: that's the dimension a phone's short
     side ends up on once rotated, and its width can be well over
     860px lying sideways. The ".layout" prefix is load-bearing, not
     stylistic — .video-pane/.playlist-pane above are equal-specificity
     with these, so without it this would only win when it happens to
     land later in the file (same trap .layout .stream-stats works
     around in livestream-chat-widget.html). The host page's own
     matching landscape query is what actually frees up the room this
     then fills — see videos.html.
     hover:none + pointer:coarse (true only for touchscreens) are load-
     bearing too: an ordinary desktop browser window is "landscape" by
     nature and often under 860px tall as well (a laptop screen minus
     its own chrome), so max-height + orientation alone was hiding the
     playlist on regular desktop visits — confirmed by testing an
     actual 1400x900 window, not just guessing. */
  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .playlist-pane { display: none; }
    .layout .video-pane { flex: 1 1 100%; }
  }

  /* Whichever fullscreen path is active, explicitly hide the playlist
     (the creator chin lives inside it now, so this already covers that
     too) rather than relying on the video simply covering it, so
     there's no overlap even if a browser sizes fullscreen differently
     than expected. */
  .layout.fullscreen-active .playlist-pane {
    display: none;
  }

  /* ---------- CREATOR CHIN ----------
     A row of pill buttons, one per creator seen in the playlist (plus
     "All"). Auto-populated as each video's author comes back from the
     oEmbed fetch below — clicking one filters the same "Up Next" list to
     just that creator's videos, it doesn't touch what's currently
     playing. */
  .creator-chin {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5vw, 10px);
    /* Equal breathing room above (from the header's divider line below)
       and below (before the list starts). */
    margin: clamp(8px, 2.6cqh, 12px) 0;
    padding: 0 2px;
    overflow-x: auto;
    overflow-y: hidden;
    /* Scrolling (swipe/drag/shift+wheel) still works when there are more
       chips than fit — this just hides the visible scrollbar itself, on
       every device, not just phones. */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* old Edge/IE */
  }
  .creator-chin::-webkit-scrollbar { display: none; } /* Chrome/Safari/new Edge */

  .creator-chip {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    border-radius: 999px;
    padding: clamp(6px, 1.6vw, 9px) clamp(14px, 3vw, 18px);
    font-size: clamp(11px, 2.6vw, 13px);
    white-space: nowrap;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .creator-chip:hover { background: var(--accent-dim); }
  .creator-chip.active {
    /* The selected chip (including "All") stands out in yellow while
       everything else on the page stays blue — text flips to the dark
       ink color here since white-on-yellow doesn't read well. */
    background: var(--accent-yellow);
    border-color: var(--accent-yellow);
    color: var(--ink);
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #ffffff;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .unmute-btn {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
  }

  /* Shown/hidden by the .controls-visible class (see the JS below)
     instead of :hover/:focus-within — a real hover still triggers it on
     desktop (mouseenter/mouseleave), but touch devices get an actual
     tap-to-show/tap-again-to-hide toggle instead of relying on mobile
     browsers' sticky-:hover-after-tap quirk, which never explicitly
     hides again on its own. */
  .video-pane .unmute-btn,
  .video-pane .video-pane-actions,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane.controls-visible .unmute-btn,
  .video-pane.controls-visible .video-pane-actions,
  .video-pane.controls-visible .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- CUSTOM VIDEO PLAYBACK CONTROLS ---------- */
  .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(2, 62, 138, 0.85), rgba(2, 62, 138, 0));
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: var(--accent);
    border: 1px solid var(--line);
    color: #ffffff;
  }
  .round-btn:hover:not(:disabled) { background: var(--accent-dim); }
  .round-btn:active:not(:disabled) { background: var(--accent-dim); }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }
  /* A resize on entering/leaving fullscreen can make the YouTube embed
     report a brief rebuffer, which applies .is-loading above — fine for
     the small in-page pane (it's meant to show the page through), but
     while fullscreen that pane IS the whole screen, so a transparent
     background there means the playlist behind it bleeds through
     instead. Keep it solid black here regardless of loading state. */
  .video-pane.pseudo-fullscreen.is-loading {
    background: #000;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: transparent; }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -4.5px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid #ffffff; cursor: pointer;
  }
  .scrub-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--accent-dim); }
  .scrub-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .scrub-range::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #ffffff; cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  /* ---------- PLAYLIST WIDGET ---------- */
  .playlist-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .playlist-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(8px, 2.6cqh, 12px) clamp(10px, 3cqw, 14px);
    border-bottom: 1px solid var(--line);
  }

  .playlist-title {
    font-size: clamp(12px, 3.2cqw, 15px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    /* Not --accent: this sits directly on .bg-glow's own blue wash with
       no opaque backing behind it, so accent-blue text here read as
       blue-on-blue. White keeps it legible against that glow. */
    color: var(--text);
  }

  .playlist-count {
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
  }

  .playlist-items {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(8px, 2.4cqh, 12px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2cqh, 10px);
  }
  .playlist-items::-webkit-scrollbar { width: 8px; }
  .playlist-items::-webkit-scrollbar-track { background: transparent; }
  .playlist-items::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }

  /* Groups a run of same-creator videos under one label — only rendered
     (see renderPlaylist() below) under "All" itself, since a creator
     filter already narrows the list to one creator with nothing left to
     group. */
  .creator-heading {
    flex: none;
    font-size: clamp(10px, 2.6cqw, 12px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    /* Same blue-on-blue issue as .playlist-title above — this also sits
       right on the glow with nothing opaque behind it. */
    color: var(--text-dim);
    padding: 0 2px;
    margin-top: clamp(2px, 1cqh, 6px);
  }
  .creator-heading:first-child { margin-top: 0; }

  @media (max-width: 860px) {
    .playlist-items { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    /* The list becomes a horizontal strip above — a full-width label
       doesn't fit between cards there, so it collapses to a slim,
       vertically-set tab that scrolls along with its group instead. */
    .creator-heading {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      /* vertical-rl + mixed alone leans the glyphs so the label reads by
         tilting your head left. transform is a paint-time-only op — it
         doesn't touch the top-to-bottom character order the writing-mode
         already laid out — so rotating the whole (tightly-fit) box
         180deg flips just the lean, to read by tilting right instead,
         without reversing or garbling the text itself. */
      transform: rotate(180deg);
      margin-top: 0;
      padding: 4px 0;
    }
  }

  .playlist-item {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.4cqw, 12px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: clamp(6px, 2cqw, 10px);
    padding: clamp(6px, 1.8cqh, 8px);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
    flex: none;
  }
  .playlist-item:hover { background: var(--accent-dim); }
  .playlist-item.active {
    /* Highlighted in yellow (matching the creator chin's active chip)
       instead of blue, so the selected video stands out from the rest
       of the blue UI the same way the active creator filter does. Kept
       as a translucent wash rather than a solid fill so the white title
       text stays legible over it. */
    background: rgba(255, 221, 0, 0.18);
    border-color: var(--accent-yellow);
    box-shadow: 0 0 8px rgba(255, 221, 0, 0.5);
  }

  @media (max-width: 860px) {
    .playlist-item { width: clamp(160px, 42vw, 220px); flex-direction: column; align-items: stretch; }
  }

  .playlist-thumb-wrap {
    position: relative;
    flex: none;
    width: clamp(72px, 24cqw, 108px);
    aspect-ratio: 16 / 9;
    border-radius: clamp(4px, 1cqw, 6px);
    overflow: hidden;
    background: #000;
  }
  @media (max-width: 860px) {
    .playlist-thumb-wrap { width: 100%; }
  }
  .playlist-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .playlist-item.active .playlist-thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--accent-yellow);
    border-radius: inherit;
  }
  .now-playing-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(10, 58, 10, 0.85);
    color: var(--accent-yellow);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    display: none;
  }
  .playlist-item.active .now-playing-badge { display: inline-block; }

  .playlist-meta {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .playlist-item-title {
    font-size: clamp(11px, 2.8cqw, 13px);
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .playlist-item-sub {
    font-size: clamp(9px, 2.4cqw, 11px);
    color: var(--text-dim);
  }

  @media (max-width: 860px) {
    /* Reserves room for a full two lines regardless of how many the
       actual title needs, so a one-line title's card doesn't read as a
       different size than a two-line title's card sitting right next
       to it in this row layout. */
    .playlist-item-title { min-height: calc(2 * 1.3em); }
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 20px;
  }

</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="layout" id="layout">
 <div class="main-row" id="mainRow">
  <div class="video-pane is-loading" id="videoPane">
    <button class="pill-btn unmute-btn" id="unmuteBtn" title="Unmute">Unmute</button>
    <div class="video-pane-actions">
      <button class="pill-btn toggle-playlist-btn" id="togglePlaylistBtn" title="Hide playlist">Hide Playlist</button>
    </div>
    <div class="video-frame-wrap">
      <iframe
        id="ytFrame"
        src=""
        allowfullscreen
        scrolling="no"
        allow="accelerometer *; autoplay *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;"
        referrerpolicy="strict-origin"
        style="pointer-events: none;">
      </iframe>
    </div>
    <div class="video-loading" id="videoLoading">
      <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
    </div>
    <div class="video-controls" id="videoControls">
      <button class="round-btn play-pause-btn" id="playPauseBtn" title="Pause" disabled>&#10074;&#10074;</button>
      <input type="range" class="scrub-range" id="scrubRange" min="0" max="100" step="0.1" value="0" disabled />
      <span class="time-label" id="timeLabel">0:00 / 0:00</span>
      <button class="round-btn fullscreen-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
    </div>
  </div>

  <div class="playlist-pane" id="playlistPane">
    <div class="playlist-card">
      <div class="playlist-header">
        <span class="playlist-title">Up Next</span>
        <span class="playlist-count" id="playlistCount"></span>
      </div>
      <!-- Auto-populated from each video's YouTube author — see
           renderCreatorChin() below. "All" chip clears the filter.
           Lives here (not beside the video) so it never shares space
           with — or gets covered by — the video pane, including in
           fullscreen. -->
      <div class="creator-chin" id="creatorChin"></div>
      <div class="playlist-items" id="playlistItems">
        <div class="empty-state">Loading playlist…</div>
      </div>
    </div>
  </div>
 </div>
</div>

    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Firestore document that holds the shared playlist — everyone reads
  // this live; only a signed-in admin (per your Firestore rules) can write it.
  const PLAYLIST_DOC_REF = db.collection('playlist').doc('main');

<script>
// ============================================================
// DEFAULT PLAYLIST — used as a fallback only: before the Firestore
// document has ever been saved, or if it's temporarily unreachable.
// Once you sign in as admin and save changes, the Firestore document
// becomes the live source of truth for every visitor.
// ============================================================
const DEFAULT_VIDEO_LIST = [
  { url: "https://youtube.com/watch?v=euMJknnSSqk", title: "Video One" },
  { url: "https://youtube.com/watch?v=VuivQyVyKDM", title: "Video Two" },
  { url: "https://youtube.com/watch?v=Jc9Eay0tedo", title: "Video Three" }
];
// ============================================================

let currentVideoList = DEFAULT_VIDEO_LIST;

// Creator settings, editable from admin.html's "Creators" section and
// synced the same way the video list is: creatorAliases renames/combines a
// raw detected author name into a display name (two raw names sharing the
// same display name become one chip), creatorOrder is the explicit chip
// order set there, and hiddenCreators removes a raw author from the chin
// entirely (their videos still show under "All"). Declared at this outer
// script level — not inside either IIFE below — so the player logic can
// read them directly once handlePlaylistSnapshot() below updates them from
// Firestore.
let creatorAliases = {};
let creatorOrder = [];
let hiddenCreators = [];

function resolveAuthorDisplay(rawAuthor) {
  if (!rawAuthor) return rawAuthor;
  return creatorAliases[rawAuthor] || rawAuthor;
}

function extractVideoId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed; // already a bare ID
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return null;
}

// previousPlaylist carries over already-resolved title/author data for any
// video that appears in both the old and new list, by id — instead of
// wiping every entry back to null and re-fetching from scratch every time
// this runs. This matters because Firestore's onSnapshot listener fires
// more than once on a normal page load (once immediately from its local
// cache, then again once the server confirms the same data), and without
// this, that second firing was resetting every author back to null right
// as the first round's fetches were finishing — which is what caused the
// creator chin to get stuck showing "Loading" even though the data had
// already been fetched successfully (a manual click just happened to
// force a re-render against whichever round's data had settled by then).
function buildPlaylist(list, previousPlaylist) {
  const previousById = new Map();
  (previousPlaylist || []).forEach(v => { if (v.id) previousById.set(v.id, v); });

  return list
    .map(v => {
      const id = extractVideoId(v.url);
      if (!id) return null;
      const prev = previousById.get(id);
      const manualTitle = (v.title && v.title.trim()) ? v.title.trim() : null;
      return {
        id,
        title: manualTitle || (prev ? prev.title : null),
        author: prev ? prev.author : null
      };
    })
    .filter(Boolean);
}

let PLAYLIST = buildPlaylist(currentVideoList);

(function () {
  const layout = document.getElementById('layout');
  const toggleBtn = document.getElementById('togglePlaylistBtn');
  toggleBtn.addEventListener('click', function () {
    const hidden = layout.classList.toggle('playlist-hidden');
    toggleBtn.textContent = hidden ? 'Show Playlist' : 'Hide Playlist';
    toggleBtn.title = hidden ? 'Show playlist' : 'Hide playlist';
  });
})();

(function () {
  const unmuteBtn = document.getElementById('unmuteBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const scrubRange = document.getElementById('scrubRange');
  const timeLabel = document.getElementById('timeLabel');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const videoPane = document.getElementById('videoPane');
  const playlistItemsEl = document.getElementById('playlistItems');
  const playlistCountEl = document.getElementById('playlistCount');
  const creatorChinEl = document.getElementById('creatorChin');
  const ytFrame = document.getElementById('ytFrame');
  const videoLoading = document.getElementById('videoLoading');
  const layoutEl = document.getElementById('layout');

  function showVideoLoading() {
    videoLoading.hidden = false;
    videoPane.classList.add('is-loading');
  }
  function hideVideoLoading() {
    videoLoading.hidden = true;
    videoPane.classList.remove('is-loading');
  }

  // ---------- Controls visibility ----------
  // Real hover reveals the controls on desktop (mouseenter/mouseleave).
  // Touch devices have no hover, so a tap shows them instead, auto-hiding
  // after a few seconds — and, since that leaves no way to dismiss them
  // on purpose, a second tap anywhere on the video itself hides them
  // immediately too. Tapping an actual control (unmute, scrub bar, etc)
  // never counts as that second "close" tap — it should just do its own
  // thing, not also yank the bar out from under it.
  const CONTROLS_AUTO_HIDE_MS = 3000;
  const supportsHover = window.matchMedia('(hover: hover)').matches;
  let controlsHideTimer = null;

  function showControls(autoHide) {
    videoPane.classList.add('controls-visible');
    clearTimeout(controlsHideTimer);
    if (autoHide) {
      controlsHideTimer = setTimeout(() => {
        videoPane.classList.remove('controls-visible');
      }, CONTROLS_AUTO_HIDE_MS);
    }
  }
  function hideControlsNow() {
    clearTimeout(controlsHideTimer);
    videoPane.classList.remove('controls-visible');
  }

  if (supportsHover) {
    videoPane.addEventListener('mouseenter', () => showControls(false));
    videoPane.addEventListener('mouseleave', () => hideControlsNow());
  } else {
    videoPane.addEventListener('touchstart', (e) => {
      if (e.target.closest('.unmute-btn, .video-pane-actions, .video-controls')) {
        showControls(true);
        return;
      }
      if (videoPane.classList.contains('controls-visible')) {
        hideControlsNow();
      } else {
        showControls(true);
      }
    }, { passive: true });
  }

  let ytPlayer = null;
  let isDragging = false;
  let pollTimer = null;
  let activeIndex = 0;
  let activeAuthorFilter = null; // null = "All"; a creator's name filters the list below
  let apiReady = false;       // true once the YT.Player instance has fired onReady
  let ytScriptReady = false;  // true once the YouTube iframe API script has loaded
  let firestoreDataReady = false; // true once the first Firestore snapshot has arrived
  let pendingLoadId = null;
  let pendingUnmute = false;

  unmuteBtn.disabled = true;

  function doUnmute() {
    if (!ytPlayer || typeof ytPlayer.unMute !== 'function') return;
    ytPlayer.unMute();
    ytPlayer.setVolume(100);
    unmuteBtn.textContent = 'Mute';
    unmuteBtn.title = 'Mute';
  }

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    const min = parseFloat(scrubRange.min) || 0;
    const max = parseFloat(scrubRange.max) || 100;
    const val = parseFloat(scrubRange.value) || 0;
    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(state) {
    if (state === YT.PlayerState.PLAYING) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {
      playPauseBtn.innerHTML = '&#9658;';
      playPauseBtn.title = 'Play';
    }
  }

  function updateProgress() {
    if (!ytPlayer || isDragging) return;
    const duration = ytPlayer.getDuration();
    const current = ytPlayer.getCurrentTime();
    if (duration > 0) {
      scrubRange.max = duration;
      scrubRange.value = current;
      updateRangeFill();
      timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
  }

  // Groups "All" itself by creator instead of leaving it flat — every
  // video from one creator becomes one contiguous run, ordered by the
  // same admin-set creatorOrder the chin's own chips already use (see
  // music-playlist-widget.html's identical orderVisibleForAll for the
  // full reasoning). An unresolved author (still being fetched) always
  // sorts last, same treatment "Unknown" gets. Within a group, videos
  // keep their original "All" order — this only re-clusters them.
  function orderVisibleForAll(visible) {
    const groups = [];
    const byAuthor = new Map();
    visible.forEach(entry => {
      const display = entry.v.author ? resolveAuthorDisplay(entry.v.author) : null;
      let g = byAuthor.get(display);
      if (!g) {
        g = { display: display, items: [] };
        byAuthor.set(display, g);
        groups.push(g);
      }
      g.items.push(entry);
    });
    groups.sort((a, b) => {
      if (a.display === null || b.display === null) {
        if (a.display === b.display) return 0;
        return a.display === null ? 1 : -1;
      }
      const ia = creatorOrder.indexOf(a.display);
      const ib = creatorOrder.indexOf(b.display);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      if (a.display === 'Unknown') return 1;
      if (b.display === 'Unknown') return -1;
      return a.display.localeCompare(b.display, undefined, { sensitivity: 'base' });
    });
    return groups.reduce((all, g) => all.concat(g.items), []);
  }

  // ---------- PLAYLIST RENDER ----------
  // Filtering by creator happens here, over the same PLAYLIST array/data
  // used everywhere else — data-index still points at the real index in
  // PLAYLIST (not the filtered array's position), so clicking a filtered
  // row still plays the right video and activeIndex stays meaningful.
  function renderPlaylist() {
    if (!PLAYLIST.length) {
      playlistItemsEl.innerHTML = '<div class="empty-state">No videos added yet.</div>';
      playlistCountEl.textContent = '';
      return;
    }

    const visible = PLAYLIST
      .map((v, i) => ({ v, i }))
      .filter(({ v }) => !activeAuthorFilter || resolveAuthorDisplay(v.author) === activeAuthorFilter);

    if (!visible.length) {
      playlistItemsEl.innerHTML = '<div class="empty-state">No videos from this creator yet.</div>';
      playlistCountEl.textContent = '0 videos';
      return;
    }

    const ordered = activeAuthorFilter ? visible : orderVisibleForAll(visible);
    playlistCountEl.textContent = ordered.length + (ordered.length === 1 ? ' video' : ' videos');
    // orderVisibleForAll above already guarantees every video sharing a
    // creator is one contiguous run, so this never fragments one
    // creator's heading into repeats.
    let lastDisplay = undefined;
    playlistItemsEl.innerHTML = ordered.map(({ v, i }) => {
      const title = (typeof v.title === 'string' && v.title.trim()) ? v.title.trim() : 'Loading title…';
      // Shows who made it instead of a generic "Tap to play" once the
      // author's known — falls back to "Tap to play" only while it's
      // still being fetched.
      const sub = i === activeIndex
        ? 'Now playing'
        : (v.author ? escapeHtml(resolveAuthorDisplay(v.author)) : 'Tap to play');
      let heading = '';
      if (!activeAuthorFilter) {
        const display = v.author ? resolveAuthorDisplay(v.author) : null;
        if (display && display !== lastDisplay) {
          const label = display === 'Unknown' ? 'Unknown Channel' : display;
          heading = `<div class="creator-heading">${escapeHtml(label)}</div>`;
        }
        lastDisplay = display || undefined;
      }
      return heading + `
      <button class="playlist-item${i === activeIndex ? ' active' : ''}" data-index="${i}" title="${escapeHtml(title)}">
        <div class="playlist-thumb-wrap">
          <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${escapeHtml(title)}" loading="lazy" />
          <span class="now-playing-badge">Now Playing</span>
        </div>
        <div class="playlist-meta">
          <div class="playlist-item-title">${escapeHtml(title)}</div>
          <div class="playlist-item-sub">${sub}</div>
        </div>
      </button>
    `;
    }).join('');

    playlistItemsEl.querySelectorAll('.playlist-item').forEach(btn => {
      btn.addEventListener('click', function () {
        const idx = parseInt(this.getAttribute('data-index'), 10);
        playIndex(idx, true);
      });
    });
  }

  // ---------- CREATOR CHIN RENDER ----------
  // Auto-populated from whichever authors have shown up on PLAYLIST
  // entries so far (fetchTitles fills v.author in asynchronously, so this
  // gets called again each time one resolves). Clicking a chip only
  // changes the filter used by renderPlaylist above — it never touches
  // what's currently playing.
  //
  // The "All" chip always renders immediately, even before any author has
  // loaded — a panel that only appears once the network fetch succeeds is
  // a panel that can silently never appear at all (one failed request and
  // there's nothing on screen to show something's wrong). "Unknown" is
  // kept as a real, clickable chip too instead of being hidden, so a
  // failed lookup still leaves a working filter rather than making the
  // whole feature vanish.
  function renderCreatorChin() {
    const authors = [];
    let stillLoading = false;
    PLAYLIST.forEach(v => {
      if (v.author === null) { stillLoading = true; return; }
      if (hiddenCreators.includes(v.author)) return; // hidden from the chin (its videos still show under "All")
      const display = resolveAuthorDisplay(v.author);
      if (!authors.includes(display)) authors.push(display);
    });

    // Sorted by the admin-set creatorOrder first (from the "Creators"
    // section of the editor); anything not explicitly ordered falls back
    // to A→Z (case-insensitive) so the chin never looks scrambled just
    // because a brand-new creator hasn't been given a position yet.
    // "Unknown" always goes last since it's a fallback, not a real name.
    authors.sort((a, b) => {
      const ia = creatorOrder.indexOf(a);
      const ib = creatorOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      if (a === 'Unknown') return 1;
      if (b === 'Unknown') return -1;
      return a.localeCompare(b, undefined, { sensitivity: 'base' });
    });

    const allChip = `<button class="creator-chip${!activeAuthorFilter ? ' active' : ''}" data-author="">All</button>`;
    const authorChips = authors.map(a => {
      const label = a === 'Unknown' ? 'Unknown Channel' : a;
      return `<button class="creator-chip${activeAuthorFilter === a ? ' active' : ''}" data-author="${escapeHtml(a)}">${escapeHtml(label)}</button>`;
    });
    const loadingChip = stillLoading
      ? '<span class="creator-chip" style="opacity:0.5;cursor:default;">Loading</span>'
      : '';
    creatorChinEl.innerHTML = [allChip].concat(authorChips).join('') + loadingChip;

    creatorChinEl.querySelectorAll('.creator-chip[data-author]').forEach(btn => {
      btn.addEventListener('click', function () {
        activeAuthorFilter = this.getAttribute('data-author') || null;
        renderCreatorChin();
        renderPlaylist();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Pull each video's real title AND creator name from YouTube's oEmbed
  // data (via noembed.com, which mirrors YouTube's oEmbed response —
  // including author_name — but reliably sends the CORS headers a
  // browser needs; calling youtube.com/oembed directly often fails
  // silently or gets blocked cross-origin). Title-fetching is skipped for
  // entries where one was typed in manually, but the author is always
  // pulled since that's what drives the creator chin.
  //
  // This has to live in here (not at the top level of the script) so its
  // calls to renderPlaylist()/renderCreatorChin() below can actually see
  // those functions — they're declared inside this same IIFE. Calling
  // them from an outer-scope fetchTitles() silently threw a
  // ReferenceError on every fetch completion (visible only in the
  // browser console), which is what left the creator chin permanently
  // stuck showing "Loading" even though the author data itself had
  // already been fetched successfully.
  function fetchTitles() {
    PLAYLIST.forEach((v, i) => {
      const needsTitle = !v.title;
      if (!needsTitle && v.author) return; // nothing left to fetch for this one
      const watchUrl = 'https://www.youtube.com/watch?v=' + v.id;

      // Some desktop setups (ad blockers, browser extensions, corporate
      // networks) silently hang a request to a third-party domain like
      // noembed.com instead of erroring outright — no CORS error, no
      // rejection, it just never comes back. Aborting after 8s guarantees
      // this always settles one way or the other.
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      fetch('https://noembed.com/embed?url=' + encodeURIComponent(watchUrl) + '&format=json', { signal: controller.signal })
        .then(res => { if (!res.ok) throw new Error('oEmbed request failed'); return res.json(); })
        .then(data => {
          clearTimeout(timeoutId);
          if (needsTitle) {
            const t = data && typeof data.title === 'string' ? data.title.trim() : '';
            v.title = t ? t : ('Video ' + (i + 1));
          }
          const a = data && typeof data.author_name === 'string' ? data.author_name.trim() : '';
          v.author = a || 'Unknown';
          renderPlaylist();
          renderCreatorChin();
        })
        .catch(() => {
          clearTimeout(timeoutId);
          if (needsTitle) v.title = 'Video ' + (i + 1);
          v.author = v.author || 'Unknown';
          renderPlaylist();
          renderCreatorChin();
        });
    });
  }

  function playIndex(idx, autoUnmute) {
    if (idx < 0 || idx >= PLAYLIST.length) return;
    activeIndex = idx;
    renderPlaylist();
    const id = PLAYLIST[idx].id;
    if (ytPlayer && apiReady) {
      showVideoLoading();
      ytPlayer.loadVideoById(id);
      if (autoUnmute) doUnmute();
    } else {
      pendingLoadId = id;
      pendingUnmute = autoUnmute;
    }
  }

  // ---------- YT IFRAME API ----------
  function tryInitPlayer() {
    if (ytPlayer || !ytScriptReady || !firestoreDataReady || !PLAYLIST.length) return;

    ytFrame.src = 'https://www.youtube.com/embed/' + PLAYLIST[0].id +
      '?rel=0&autoplay=1&mute=1&controls=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1';

    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          apiReady = true;
          unmuteBtn.disabled = false;
          playPauseBtn.disabled = false;
          scrubRange.disabled = false;
          updatePlayPauseIcon(YT.PlayerState.PLAYING);
          updateProgress();
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(updateProgress, 500);
          if (pendingLoadId) {
            ytPlayer.loadVideoById(pendingLoadId);
            if (pendingUnmute) doUnmute();
            pendingLoadId = null;
            pendingUnmute = false;
          }
        },
        onStateChange: function (event) {
          updatePlayPauseIcon(event.data);
          if (event.data === YT.PlayerState.PLAYING) {
            hideVideoLoading();
          } else if (event.data === YT.PlayerState.BUFFERING) {
            showVideoLoading();
          }
          if (event.data === YT.PlayerState.ENDED) {
            playIndex((activeIndex + 1) % PLAYLIST.length, true);
          }
        }
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    ytScriptReady = true;
    tryInitPlayer();
  };

  unmuteBtn.addEventListener('click', function () {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) {
      doUnmute();
    } else {
      ytPlayer.mute();
      unmuteBtn.textContent = 'Unmute';
      unmuteBtn.title = 'Unmute';
    }
  });

  playPauseBtn.addEventListener('click', function () {
    if (!ytPlayer) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    const duration = ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max);
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (ytPlayer) ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    isDragging = false;
  });

  // ---------- FULLSCREEN ----------
  let usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen);
  }
  function isFullscreen() {
    return usingPseudoFullscreen || iosFsActive || !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  function requestFs(el) {
    try {
      let result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') result.catch(() => enterPseudoFullscreen());
    } catch (e) { enterPseudoFullscreen(); }
  }
  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
  function handleEscKey(e) { if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen(); }
  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function updateFullscreenIcon() {
    const fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';
    // Belt-and-suspenders alongside the video pane's own fullscreen
    // sizing: explicitly hide the playlist/creator chin rather than
    // relying solely on the video covering them, so there's no overlap
    // even if a rebuffer briefly makes the (fullscreened) video pane's
    // background transparent again.
    layoutEl.classList.toggle('fullscreen-active', fs);
  }

  // iOS won't hand our own wrapper div off to its native video player
  // (AirPlay button, its own scrub bar/back button) — that only exists
  // for a real <video> element, and the real one lives inside YouTube's
  // iframe, cross-origin and out of this page's reach. requestFullscreen
  // on our div either isn't supported there at all, or (newer iOS) just
  // fills the screen with our own web content instead of handing off.
  // The only way to get the actual native treatment is to let a YouTube
  // iframe with ITS OWN controls go fullscreen on the tap — so on iOS
  // specifically, this spins up a second, temporary iframe (YouTube's
  // stock controls, seeded to the current position/mute state) just for
  // the fullscreen session, and folds wherever it ends up back into the
  // normal in-page player on exit. Every other platform keeps the
  // wrapper-div fullscreen above, untouched — it already works there.
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    /iP(hone|od|ad)/.test(navigator.platform) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let iosFsFrame = null;
  let iosFsPlayer = null;
  let iosFsActive = false;

  function cleanUpIosFsFrame() {
    if (iosFsFrame && iosFsFrame.parentNode) iosFsFrame.parentNode.removeChild(iosFsFrame);
    iosFsFrame = null;
    iosFsPlayer = null;
  }
  function abortIosFullscreen() {
    iosFsActive = false;
    cleanUpIosFsFrame();
    if (ytPlayer) ytPlayer.playVideo();
    updateFullscreenIcon();
  }
  // Returns true once it's actually kicked off the native-handoff
  // attempt, false if it bailed out for any reason (nothing loaded yet,
  // the requestFullscreen call itself threw, …) — the click handler
  // below falls back to the ordinary wrapper-div/pseudo-fullscreen path
  // whenever this returns false, so a tap always does *something*
  // instead of silently no-oping if this path can't run.
  function enterIosFullscreen() {
    try {
      const current = PLAYLIST[activeIndex];
      if (!ytPlayer || !current || typeof ytPlayer.getCurrentTime !== 'function') return false;
      if (!(HTMLElement.prototype.requestFullscreen || HTMLElement.prototype.webkitRequestFullscreen)) return false;

      const startSeconds = ytPlayer.getCurrentTime() || 0;
      const wasMuted = typeof ytPlayer.isMuted === 'function' ? ytPlayer.isMuted() : true;
      if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();

      iosFsFrame = document.createElement('iframe');
      iosFsFrame.id = 'ytIosFsFrame';
      iosFsFrame.allowFullscreen = true;
      iosFsFrame.setAttribute('allow', 'accelerometer *; autoplay *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *;');
      iosFsFrame.setAttribute('referrerpolicy', 'strict-origin');
      iosFsFrame.style.cssText = 'position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; border:0; z-index:99999; background:#000;';
      iosFsFrame.src = 'https://www.youtube.com/embed/' + current.id +
        '?rel=0&modestbranding=1&enablejsapi=1&playsinline=0' +
        '&autoplay=1&mute=' + (wasMuted ? 1 : 0) +
        '&start=' + Math.max(0, Math.floor(startSeconds));
      document.body.appendChild(iosFsFrame);

      const result = iosFsFrame.requestFullscreen ? iosFsFrame.requestFullscreen() : iosFsFrame.webkitRequestFullscreen();
      if (result && typeof result.catch === 'function') result.catch(abortIosFullscreen);

      iosFsActive = true;
      updateFullscreenIcon();
      iosFsPlayer = new YT.Player('ytIosFsFrame', {
        events: {
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.ENDED) exitIosFullscreen();
          }
        }
      });
      return true;
    } catch (e) {
      abortIosFullscreen();
      return false;
    }
  }
  function exitIosFullscreen(skipExitFs) {
    if (!iosFsActive) return;
    let endSeconds = null;
    let wasPlaying = true;
    let endMuted = null;
    if (iosFsPlayer && typeof iosFsPlayer.getCurrentTime === 'function') {
      try {
        endSeconds = iosFsPlayer.getCurrentTime();
        wasPlaying = iosFsPlayer.getPlayerState() === YT.PlayerState.PLAYING;
        endMuted = iosFsPlayer.isMuted();
      } catch (e) {}
    }
    iosFsActive = false;
    cleanUpIosFsFrame();
    if (ytPlayer) {
      if (endSeconds !== null) ytPlayer.seekTo(endSeconds, true);
      if (endMuted === false) doUnmute();
      else if (endMuted === true) {
        ytPlayer.mute();
        unmuteBtn.textContent = 'Unmute';
        unmuteBtn.title = 'Unmute';
      }
      if (wasPlaying) ytPlayer.playVideo();
    }
    if (!skipExitFs) exitFs();
    updateFullscreenIcon();
  }

  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (iosFsActive) exitIosFullscreen();
      else if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (isIOS && enterIosFullscreen()) return;
    if (hasNativeFullscreenSupport(videoPane)) requestFs(videoPane);
    else enterPseudoFullscreen();
  });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
    document.addEventListener(evt, function () {
      if (iosFsActive) {
        const nativeFsActive = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        if (!nativeFsActive) exitIosFullscreen(true);
      }
      updateFullscreenIcon();
    });
  });

  // ---------- LIVE SYNC FROM FIRESTORE ----------
  // Every visitor (no sign-in required) subscribes to the shared playlist
  // document. The first snapshot boots the player; later snapshots (an
  // admin saving changes) update the on-screen list for everyone without
  // a page reload, and try to keep whatever's currently playing playing.
  function handlePlaylistSnapshot(list) {
    currentVideoList = list;
    const newPlaylist = buildPlaylist(currentVideoList, PLAYLIST);

    if (!firestoreDataReady) {
      firestoreDataReady = true;
      PLAYLIST = newPlaylist;
      activeIndex = 0;
      renderCreatorChin();
      renderPlaylist();
      fetchTitles();
      tryInitPlayer();
      return;
    }

    const currentId = PLAYLIST[activeIndex] ? PLAYLIST[activeIndex].id : null;
    PLAYLIST = newPlaylist;
    const stillThereIndex = currentId ? PLAYLIST.findIndex(v => v.id === currentId) : -1;
    activeIndex = stillThereIndex >= 0 ? stillThereIndex : 0;
    // If the creator currently filtered on has no videos left in the
    // updated list, drop back to "All" instead of showing an empty list.
    if (activeAuthorFilter && !PLAYLIST.some(v => v.author === activeAuthorFilter)) {
      activeAuthorFilter = null;
    }
    renderCreatorChin();
    renderPlaylist();
    fetchTitles();

    if (stillThereIndex < 0 && PLAYLIST.length) {
      // The video that was playing got removed from the list — jump to the first one.
      if (ytPlayer && apiReady) ytPlayer.loadVideoById(PLAYLIST[0].id);
      else pendingLoadId = PLAYLIST[0].id;
    }
  }

  PLAYLIST_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const list = (data && Array.isArray(data.videos) && data.videos.length) ? data.videos : DEFAULT_VIDEO_LIST;
    creatorAliases = (data && data.creatorAliases && typeof data.creatorAliases === 'object') ? data.creatorAliases : {};
    creatorOrder = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
    hiddenCreators = (data && Array.isArray(data.hiddenCreators)) ? data.hiddenCreators : [];
    handlePlaylistSnapshot(list);
  }, function (err) {
    console.error('Playlist sync error:', err);
    handlePlaylistSnapshot(DEFAULT_VIDEO_LIST);
  });

  renderCreatorChin();
  renderPlaylist();
})();
</script>

<script src="https://www.youtube.com/iframe_api"></script>
