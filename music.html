<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/music">
<meta property="og:title" content="Music - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Music - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as videos.html, but with the
     old-GeoCities tiled-GIF background main/index.html uses instead of
     a solid color. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* No page-level scrolling — the widget inside manages its own
       overflow (a scrolling playlist), so the page itself is capped to
       one viewport instead of growing past it. */
    overflow: hidden;
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(4px, 1.5vw, 12px);
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The player fills whatever's left below the logo. The widget draws
     its own frosted panel and handles its own responsive layout, so
     this is just the box it lives in. Sized in JS (see the script at
     the bottom of this file), the same way videos.html sizes its own
     player iframe — CSS alone (vh units, flex cross-axis stretch on a
     replaced element) turned out not to reliably bound this on every
     browser, so the actual pixel height comes from measuring the real
     available space instead. This starting height is just what shows
     before that script runs. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: 0;
    height: min(560px, 68vh);
  }
  .player-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="https://truth.knobsock.net" target="_top">
    <img src="/knobsock-music-logo.png" alt="KNOBSOCK MUSIC">
  </a>

  <div class="player-wrap" id="playerWrap">
    <iframe src="/music-playlist-widget.html"
            title="KNOBSOCK Music"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

<script>
// The widget fills 100% of whatever height it's handed rather than
// having a natural content size of its own, so — unlike
// video-playlist-widget.html's own postMessage — there's nothing for it
// to report; instead this measures the actual space left below the logo
// and sets the iframe to exactly that, in real pixels. vh units and
// flexbox cross-axis stretch on the iframe (tried first) both turned out
// to size it unreliably on some browsers, letting it render taller than
// the viewport instead of actually being capped by it — a plain pixel
// height computed from the real layout has no such ambiguity.
(function () {
  var wrap = document.getElementById('playerWrap');

  function resize() {
    var top = wrap.getBoundingClientRect().top;
    var available = window.innerHeight - top - 12;
    wrap.style.height = Math.max(260, Math.round(available)) + 'px';
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
})();
</script>

</body>
</html>
