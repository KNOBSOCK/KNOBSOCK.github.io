<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/music">
<meta property="og:title" content="Music - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Music - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as videos.html. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the music widget's own gold palette (its --ink) instead of
       the tiled GeoCities GIF every other non-widget page here uses, so
       the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: #3a2a00;
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(4px, 1.5vw, 12px);
    /* Matching bottom padding to the gap the script leaves below the
       player, so a scrolled phone layout doesn't end flush against the
       bottom of the screen. */
    padding: clamp(8px, 2vw, 20px) 0 12px;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The box the player lives in. The widget draws its own frosted panel
     and handles its own responsive layout; the real height comes from
     the widget itself (see the script at the bottom of this file),
     exactly as videos.html does it. These values are only the fallback
     for before that message arrives — or if it never does, e.g. JS off
     or the widget served from another origin.

     min-height (not height) keeps it usable on very short screens,
     where the page then scrolls instead of squashing. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  /* height:auto (not 100%) on purpose — a percentage height can't
     resolve against a flex container whose own height comes from
     flex-grow, so the iframe would collapse to its default 150px.
     Letting the parent's default align-items:stretch size it instead
     makes it fill the row properly. */
  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  /* On mobile, the page itself is locked to exactly one screen instead
     of growing/scrolling with the widget's content. The widget can still
     want more than one screen's worth of height there (video + Now
     Playing card + playlist stacked) — see the script at the bottom,
     which on mobile gives the iframe its full natural height directly
     and leaves #playerWrap (bounded by .page below) to scroll it via
     overflow-y, so all scrolling stays inside the widget's own box
     instead of moving the logo off-screen. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .player-wrap {
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/" target="_top">
    <img src="/knobsock-music-logo.png" alt="KNOBSOCK MUSIC">
  </a>

  <div class="player-wrap" id="playerWrap">
    <iframe src="/music-playlist-widget.html"
            title="KNOBSOCK Music"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

<script>
// The widget reports the height its content actually wants (a 16:9
// player, the Now Playing card, and on a phone the playlist stacked
// under them) and this sizes the iframe to that — the same
// knobsock-widget-height contract videos.html uses.
//
// Sizing it to the leftover window instead, which is what this used to
// do, is what made the gold panel run all the way to the bottom of a
// zoomed-out or 4K/8K screen: the widget fills whatever height it is
// handed, so every extra pixel of window turned into empty panel under
// the player.
//
// Desktop caps the result at the room actually left below the logo, so
// a short window letterboxes the widget slightly rather than scrolling
// the page. The phone layout does the same thing now — #playerWrap gets
// an explicit height measured the same way, and the iframe inside it
// gets the full, uncapped natural height, so #playerWrap's own
// overflow-y:auto scrolls the taller iframe internally instead of the
// page growing past the screen (the page itself is locked to one screen —
// see the mobile media query above). #playerWrap's height is set
// explicitly here rather than left to flex-shrink + min-height:0 to
// figure out on its own — Safari's flex intrinsic-sizing doesn't reliably
// shrink a flex item to the space actually available the way Chromium
// does, so this computes the real number in JS instead of trusting the
// flex algorithm to land on it.
//
// If the message never arrives (JS off, or the widget served from
// another origin), the CSS above stands on its own.
(function () {
  var wrap = document.getElementById('playerWrap');
  var frame = wrap.querySelector('iframe');
  var MOBILE = 860;
  var natural = 0;

  function apply() {
    if (!natural) return;

    wrap.style.flex = '0 0 auto';
    // min-height from the stylesheet would otherwise win over a smaller
    // measured height and keep the gap.
    wrap.style.minHeight = '0';
    // Page position, not viewport position: getBoundingClientRect()
    // alone would shrink the answer once the page is scrolled.
    var top = wrap.getBoundingClientRect().top + window.pageYOffset;
    var available = window.innerHeight - top - 12;

    if (window.innerWidth <= MOBILE) {
      // #playerWrap gets exactly the room available (not capped by
      // natural — it can be smaller than the content) and the iframe
      // gets its full natural height, which is what makes #playerWrap's
      // own overflow-y actually have something to scroll.
      wrap.style.height = Math.round(Math.max(200, available)) + 'px';
      frame.style.height = Math.round(natural) + 'px';
      return;
    }

    frame.style.height = '';
    var height = Math.min(natural, Math.max(260, available));
    wrap.style.height = Math.round(height) + 'px';
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (e.source !== frame.contentWindow) return;
    if (!e.data || e.data.type !== 'knobsock-widget-height') return;
    natural = e.data.height;
    apply();
  });

  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
})();
</script>

</body>
</html>
