<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #a69af2;
  }

  .music-scene {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .music-scene.is-zooming {
    opacity: 1;
    transform: scale(var(--scene-zoom-scale, 2));
    pointer-events: none;
  }

  .scene-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Cover the viewport, preserving the drawing's coordinate system. */
    width: max(100vw, calc(100vh * 8000 / 4511));
    height: max(100vh, calc(100vw * 4511 / 8000));
    transform: translate(-50%, -50%);
  }

  .scene-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }

  .music-logo-link {
    position: absolute;
    z-index: 2;
    /* Coordinates are relative to the illustration, not the browser. */
    top: 1%;
    left: 50%;
    display: block;
    width: 29.5%;
    transform: translateX(-50%);
    line-height: 0;
  }
  .music-logo-link img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }

  .boombox-overlay {
    position: absolute;
    z-index: 1;
    /* Matched to the boombox artwork in music-room-desktop.png. */
    left: 28.6875%;
    top: 20.3946%;
    width: 43.375%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .boombox-overlay img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @media (hover: hover) {
    .boombox-overlay:hover img {
      transform: scale(1.018);
    }
  }
  .boombox-overlay:active img { transform: scale(0.97); }
  .boombox-overlay.is-popping img {
    animation: boombox-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes boombox-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.055); }
    100% { transform: scale(1); }
  }
  .boombox-overlay.is-playing img {
    animation: boombox-party 0.68s cubic-bezier(.42, 0, .58, 1) infinite alternate;
    transform-origin: 50% 88%;
  }
  @keyframes boombox-party {
    0% { transform: translateY(2%) rotate(-.4deg) scale(.99, 1.015); }
    18% { transform: translateY(-10%) rotate(-1deg) scale(1.025, .975); }
    36% { transform: translateY(1%) rotate(.3deg) scale(.99, 1.015); }
    56% { transform: translateY(-7%) rotate(.8deg) scale(1.018, .982); }
    76% { transform: translateY(1%) rotate(-.2deg) scale(.99, 1.015); }
    100% { transform: translateY(-5%) rotate(.6deg) scale(1.01, .99); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boombox-overlay.is-playing img { animation: none; }
  }

  .music-zoom {
    position: fixed;
    z-index: 10;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    /* Reveal the registered close-up before the room layer is hidden. */
    transition: opacity 0s linear 0.40s;
  }
  .music-zoom[hidden] { display: none; }
  .music-zoom.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .music-zoom.is-closing {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.08s linear;
  }
  .music-zoom .scene-canvas {
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
    will-change: transform;
  }
  .music-controls {
    position: absolute;
    z-index: 2;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .music-zoom.is-open .music-controls {
    opacity: 1;
    transition-delay: 0.42s;
  }
  .music-control {
    position: absolute;
    display: block;
    width: var(--control-width);
    aspect-ratio: var(--control-aspect, 2 / 1);
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    line-height: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .music-control img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform 0.16s ease;
  }
  @media (hover: hover) {
    .music-control:hover img {
      animation: boombox-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  }
  .music-control:focus-visible {
    outline: 3px solid #fff45a;
    outline-offset: 2px;
  }
  .music-control:active img { transform: scale(0.998); }
  .music-wheel {
    touch-action: none;
    --control-aspect: 1 / 1;
  }
  .music-wheel.is-dragging { cursor: grabbing; }
  .music-wheel.is-dragging img { animation: none; }
  @media (hover: hover) {
    .music-wheel:hover img { animation: none; }
  }
  /* Coordinates are in the 8000 × 4511 close-up artwork. */
  .music-control--artist { left: 27.4375%; top: 21.125%; --control-width: 7.4%; }
  .music-control--album { left: 27.54%; top: 29.18%; --control-width: 7.575%; }
  .music-control--shuffle { left: 27.30%; top: 36.13%; --control-width: 7.875%; }
  .music-wheel { left: 63.3625%; top: 24.25%; --control-width: 8.30%; }
  .music-control--select { left: 70.6625%; top: 18.40%; --control-width: 6.875%; --control-aspect: 1 / 1; }
  .music-action-bar {
    position: absolute;
    left: 26.375%;
    top: 44.934%;
    z-index: 2;
    width: 47.475%;
    aspect-ratio: 3798 / 550;
    pointer-events: auto;
  }
  .music-action-art {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  .music-action-hit {
    position: absolute;
    top: 14.5%;
    width: 25%;
    height: 71%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .music-action-hit--play { left: 0; }
  .music-action-hit--pause { left: 25%; }
  .music-action-hit--previous { left: 50%; }
  .music-action-hit--forward { left: 75%; }
  .music-action-hit:focus-visible { outline: 3px solid #fff45a; outline-offset: -3px; }
  .music-zoom-close {
    position: absolute;
    z-index: 1;
    top: 0;
    left: 0;
    width: 100%;
    height: 18%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  @media (max-width: 860px) and (orientation: portrait) {
    .scene-canvas {
      width: max(100vw, calc(100vh * 4511 / 8000));
      height: max(100vh, calc(100vw * 8000 / 4511));
      transform: translate(-50.8%, -50%);
    }
    .music-scene .scene-art { content: url('/music-room-mobile-no-boombox.png'); }
    .music-logo-link {
      top: 3.2%;
      width: 72%;
    }
    .boombox-overlay {
      /* Matched separately to the portrait illustration. */
      left: 15.1851%;
      top: 23.875%;
      width: 70.828%;
    }
    /* Matched independently to the 4511 × 8000 portrait close-up artwork. */
    .music-control--artist {
      left: 13.567%; top: 31.913%; --control-width: 12.280%;
    }
    .music-control--album {
      left: 13.744%; top: 36.175%; --control-width: 12.569%;
    }
    .music-control--shuffle {
      left: 13.345%; top: 39.850%; --control-width: 13.057%;
    }
    .music-wheel { left: 73.154%; top: 33.563%; --control-width: 13.767%; }
    .music-control--select { left: 85.212%; top: 30.475%; --control-width: 11.394%; }
    .music-action-bar { left: 11.815%; top: 44.50%; width: 78.72%; }
    .music-zoom-close { height: 20%; }
  }
</style>
</head>
<body>

<main class="music-scene" id="musicScene">
  <div class="scene-canvas">
    <img class="scene-art" src="/music-room-desktop-no-boombox.png" alt="A room with a table between two windows">
    <button class="boombox-overlay" id="boomboxOverlay" type="button" aria-label="Animated boombox">
      <img src="/music-boombox-overlay.png" alt="">
    </button>
    <a class="music-logo-link" href="/index.html" aria-label="KNOBSOCK home">
      <img src="/knobsock-music-scene-logo.png" alt="KNOBSOCK Music">
    </a>
  </div>
</main>

<div class="music-zoom" id="musicZoom" hidden aria-hidden="true">
  <div class="scene-canvas" id="musicZoomCanvas">
    <img class="scene-art" id="musicZoomArt" src="/music-boombox-zoom-desktop.png" alt="Close-up of a boombox">
    <div class="music-controls" aria-label="Boombox controls">
      <section class="music-lcd" id="musicLcd" aria-label="Music library and player">
        <div class="lcd-inner"><header class="lcd-header"><button id="lcdBack" aria-label="Back to library">‹</button><span id="lcdTitle">KNOBSOCK</span><span id="lcdState">■</span></header><div id="lcdBody" class="lcd-body"></div><footer id="lcdFooter">Loading library...</footer></div>
      </section>
      <button class="music-control music-control--artist" type="button" data-control="artist" aria-label="Artist view">
        <img src="/music-button-artist.png" data-idle-src="/music-button-artist.png" data-active-src="/music-button-artist-active.png" alt="">
      </button>
      <button class="music-control music-control--album" type="button" data-control="album" aria-label="Album view">
        <img src="/music-button-album.png" data-idle-src="/music-button-album.png" data-active-src="/music-button-album-active.png" alt="">
      </button>
      <button class="music-control music-control--shuffle" type="button" data-control="shuffle" aria-label="Shuffle" aria-pressed="false">
        <img src="/music-button-shuffle.png" data-idle-src="/music-button-shuffle.png" data-active-src="/music-button-shuffle-active.png" alt="">
      </button>
      <button class="music-control music-wheel" id="musicTracksWheel" type="button" aria-label="Scroll library; use arrow keys or drag to browse">
        <img src="/music-wheel-tracks.png" data-idle-src="/music-wheel-tracks.png" data-active-src="/music-wheel-tracks-active.png" alt="">
      </button>
      <button class="music-control music-control--select" id="musicSelectButton" type="button" aria-label="Select">
        <img src="/music-button-select.png" data-idle-src="/music-button-select.png" data-active-src="/music-button-select-active.png" alt="">
      </button>
      <div class="music-action-bar" id="musicActionBar" aria-label="Playback controls">
        <img class="music-action-art" id="musicActionArt" src="/music-NoneClicked.png" alt="">
        <button class="music-action-hit music-action-hit--play" type="button" data-action="play" aria-label="Play" aria-pressed="false"></button>
        <button class="music-action-hit music-action-hit--pause" type="button" data-action="pause" aria-label="Pause" aria-pressed="false"></button>
        <button class="music-action-hit music-action-hit--previous" type="button" data-action="previous" aria-label="Previous track"></button>
        <button class="music-action-hit music-action-hit--forward" type="button" data-action="forward" aria-label="Next track"></button>
      </div>
    </div>
  </div>
  <button class="music-zoom-close" id="musicZoomClose" type="button" aria-label="Zoom out to the full music room"></button>
</div>

<script>
  (function () {
    var boombox = document.getElementById('boomboxOverlay');
    var scene = document.getElementById('musicScene');
    var zoom = document.getElementById('musicZoom');
    var zoomArt = document.getElementById('musicZoomArt');
    var zoomClose = document.getElementById('musicZoomClose');
    var controls = Array.prototype.slice.call(document.querySelectorAll('.music-control'));
    var tracksWheel = document.getElementById('musicTracksWheel');
    var selectButton = document.getElementById('musicSelectButton');
    var actionBar = document.getElementById('musicActionBar');
    var actionArt = document.getElementById('musicActionArt');
    if (!boombox || !scene || !zoom || !zoomArt || !zoomClose) return;
    var mobileQuery = window.matchMedia('(max-width: 860px) and (orientation: portrait)');
    var zoomTimer = null;
    var sceneHideTimer = null;
    var danceResumeTimer = null;
    var isZoomed = false;
    var isOpening = false;
    var musicIsPlaying = false;
    function popBoombox() {
      boombox.classList.remove('is-popping');
      void boombox.offsetWidth;
      boombox.classList.add('is-popping');
    }
    function zoomSource() {
      return mobileQuery.matches ? '/music-boombox-zoom-mobile.png' : '/music-boombox-zoom-desktop.png';
    }
    function cameraFrame() {
      if (mobileQuery.matches) {
        return { width: 4511, height: 8000, scale: 4.51, anchorX: 2345.09, anchorY: 2357.91 };
      }
      return { width: 8000, height: 4511, scale: 4.4, anchorX: 4115.29, anchorY: 1591.76 };
    }
    function setCameraAnchor() {
      var frame = cameraFrame();
      var canvas = scene.querySelector('.scene-canvas');
      var rect = canvas.getBoundingClientRect();
      scene.style.transformOrigin =
        (rect.left + frame.anchorX * rect.width / frame.width) + 'px ' +
        (rect.top + frame.anchorY * rect.height / frame.height) + 'px';
      scene.style.setProperty('--scene-zoom-scale', frame.scale);
    }
    function beginZoom(source) {
      if (isZoomed) return;
      isZoomed = true;
      isOpening = false;
      popBoombox();
      setCameraAnchor();
      zoom.hidden = false;
      zoom.setAttribute('aria-hidden', 'false');
      void zoom.offsetWidth;
      zoom.classList.remove('is-closing');
      zoom.classList.add('is-open');
      scene.classList.add('is-zooming');
      clearTimeout(sceneHideTimer);
      scene.style.visibility = '';
      sceneHideTimer = setTimeout(function () {
        if (isZoomed) scene.style.visibility = 'hidden';
      }, 470);
    }
    function openZoom() {
      if (isZoomed || isOpening) return;
      isOpening = true;
      /* Freeze the party bounce before the click's pop/zoom animation begins. */
      clearTimeout(danceResumeTimer);
      boombox.classList.remove('is-playing');
      var source = zoomSource();
      function start() { beginZoom(source); }
      if (zoomArt.getAttribute('src') === source && zoomArt.complete) {
        start();
        return;
      }
      zoomArt.src = source;
      if (zoomArt.decode) {
        zoomArt.decode().then(start).catch(start);
      } else {
        zoomArt.addEventListener('load', start, { once: true });
        zoomArt.addEventListener('error', start, { once: true });
      }
    }
    function closeZoom() {
      if (!isZoomed) return;
      isZoomed = false;
      zoom.classList.remove('is-open');
      zoom.classList.add('is-closing');
      clearTimeout(sceneHideTimer);
      scene.style.visibility = '';
      zoom.setAttribute('aria-hidden', 'true');
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(function () {
        scene.classList.remove('is-zooming');
        zoom.classList.remove('is-closing');
      }, 90);
      clearTimeout(danceResumeTimer);
      danceResumeTimer = setTimeout(function () {
        if (!isZoomed && musicIsPlaying) boombox.classList.add('is-playing');
      }, 100);
      setTimeout(function () { zoom.hidden = true; }, 560);
    }
    function setControlPressed(control, pressed) {
      var image = control.querySelector('img');
      control.setAttribute('aria-pressed', String(pressed));
      image.src = pressed ? image.getAttribute('data-active-src') : image.getAttribute('data-idle-src');
    }
    boombox.addEventListener('click', openZoom);
    boombox.addEventListener('animationend', function () {
      boombox.classList.remove('is-popping');
    });
    zoomClose.addEventListener('click', closeZoom);
    controls.forEach(function (control) {
      control.addEventListener('click', function () {
        if (!control.getAttribute('data-control')) return;
        if (control.getAttribute('data-control') !== 'shuffle') {
          var image = control.querySelector('img');
          image.src = image.getAttribute('data-active-src');
          clearTimeout(control.pressTimer);
          control.pressTimer = setTimeout(function () { image.src = image.getAttribute('data-idle-src'); }, 150);
          return;
        }
        var pressed = control.getAttribute('aria-pressed') !== 'true';
        setControlPressed(control, pressed);
      });
    });
    if (selectButton) {
      selectButton.addEventListener('click', function () {
        var image = selectButton.querySelector('img');
        image.src = image.getAttribute('data-active-src');
        setTimeout(function () { image.src = image.getAttribute('data-idle-src'); }, 150);
      });
    }
    if (tracksWheel) {
      var wheelImage = tracksWheel.querySelector('img');
      var wheelLastAngle = 0;
      var wheelDragRemainder = 0;
      var wheelScrollRemainder = 0;
      var wheelDisplayRotation = 0;
      var wheelResetTimer = null;
      var wheelDragging = false;
      function wheelAngle(event) {
        var rect = tracksWheel.getBoundingClientRect();
        return Math.atan2(event.clientY - rect.top - rect.height / 2, event.clientX - rect.left - rect.width / 2) * 180 / Math.PI;
      }
      function normalizeAngle(angle) {
        return ((angle + 180) % 360 + 360) % 360 - 180;
      }
      function setWheelVisual(angle, immediate) {
        wheelImage.style.transition = immediate ? 'none' : 'transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1)';
        wheelImage.style.transform = 'rotate(' + angle + 'deg)';
      }
      function resetWheelVisual() {
        setWheelVisual(0, false);
      }
      function pulseWheel() {
        clearTimeout(wheelResetTimer);
        wheelImage.src = wheelImage.getAttribute('data-active-src');
        wheelResetTimer = setTimeout(function () {
          if (!wheelDragging) wheelImage.src = wheelImage.getAttribute('data-idle-src');
        }, 110);
      }
      function advanceTrack(step) {
        if (!step) return;
        document.dispatchEvent(new CustomEvent('music-wheel-step', { detail: step }));
        if (navigator.vibrate) navigator.vibrate(8);
        pulseWheel();
      }
      tracksWheel.addEventListener('pointerdown', function (event) {
        event.preventDefault();
        wheelDragging = true;
        wheelLastAngle = wheelAngle(event);
        wheelDragRemainder = 0;
        wheelDisplayRotation = 0;
        clearTimeout(wheelResetTimer);
        tracksWheel.setPointerCapture(event.pointerId);
        tracksWheel.classList.add('is-dragging');
        wheelImage.src = wheelImage.getAttribute('data-active-src');
      });
      tracksWheel.addEventListener('pointermove', function (event) {
        if (!wheelDragging) return;
        var angle = wheelAngle(event);
        var angleDelta = normalizeAngle(angle - wheelLastAngle);
        wheelDragRemainder += angleDelta;
        wheelDisplayRotation += angleDelta;
        wheelLastAngle = angle;
        var steps = wheelDragRemainder > 0 ? Math.floor(wheelDragRemainder / 15) : Math.ceil(wheelDragRemainder / 15);
        if (steps) {
          advanceTrack(steps);
          wheelDragRemainder -= steps * 15;
        }
        setWheelVisual(wheelDisplayRotation, true);
      });
      function releaseWheel(event) {
        if (!wheelDragging) return;
        wheelDragging = false;
        wheelDisplayRotation = 0;
        tracksWheel.classList.remove('is-dragging');
        wheelImage.src = wheelImage.getAttribute('data-idle-src');
        resetWheelVisual();
        if (tracksWheel.hasPointerCapture(event.pointerId)) tracksWheel.releasePointerCapture(event.pointerId);
      }
      tracksWheel.addEventListener('pointerup', releaseWheel);
      tracksWheel.addEventListener('pointercancel', releaseWheel);
      tracksWheel.addEventListener('lostpointercapture', releaseWheel);
      tracksWheel.addEventListener('wheel', function (event) {
        event.preventDefault();
        var amount = Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
        if (!amount) return;
        if (event.deltaMode === 1) amount *= 40;
        else if (event.deltaMode === 2) amount *= 500;
        else if (Math.abs(amount) >= 80) amount = Math.sign(amount) * 120;
        wheelScrollRemainder += amount;
        var steps = wheelScrollRemainder > 0 ? Math.floor(wheelScrollRemainder / 120) : Math.ceil(wheelScrollRemainder / 120);
        wheelScrollRemainder -= steps * 120;
        if (steps) advanceTrack(steps);
        wheelDisplayRotation += -amount * 0.12;
        setWheelVisual(wheelDisplayRotation, false);
        clearTimeout(wheelResetTimer);
        wheelResetTimer = setTimeout(function () {
          wheelImage.src = wheelImage.getAttribute('data-idle-src');
          wheelDisplayRotation = 0;
          resetWheelVisual();
        }, 280);
      }, { passive: false });
    }
    if (actionBar && actionArt) {
      var pressedActions = {};
      var playbackAction = null;
      var buttonSoundSources = {
        play: '/PlayButtonSound.mp3',
        pause: '/PauseButtonSound.mp3',
        previous: '/Forward%20and%20Backward%20button%20sound.mp3',
        forward: '/Forward%20and%20Backward%20button%20sound.mp3'
      };
      var buttonSounds = {};
      Object.keys(buttonSoundSources).forEach(function (action) {
        buttonSounds[action] = new Audio(buttonSoundSources[action]);
        buttonSounds[action].preload = 'auto';
      });
      function playButtonSound(action) {
        var source = buttonSounds[action];
        if (!source) return;
        var effect = source.cloneNode();
        effect.volume = 0.8;
        effect.play().catch(function () {});
        if (navigator.vibrate) navigator.vibrate(8);
      }
      var actionArtSources = {
        '': '/music-NoneClicked.png',
        play: '/music-PlayButtonClicked.png',
        pause: '/music-PauseButtonClicked.png',
        previous: '/music-PreviousButtonClicked.png',
        forward: '/music-ForwardButtonClicked.png',
        'play,previous': '/music-PlayAndPreviousButtonClicked.png',
        'play,forward': '/music-PlayAndForwardButtonClicked.png',
        'pause,previous': '/music-PauseAndPreviousButtonClicked.png',
        'pause,forward': '/music-PauseAndForwardButtonClicked.png'
      };
      function renderActionBar() {
        var keys = [];
        if (playbackAction) keys.push(playbackAction);
        if (pressedActions.previous) keys.push('previous');
        else if (pressedActions.forward) keys.push('forward');
        actionArt.src = actionArtSources[keys.join(',')] || actionArtSources[keys[0] || ''];
      }
      function setPlaybackAction(action) {
        playbackAction = action;
        actionBar.querySelector('[data-action="play"]').setAttribute('aria-pressed', String(action === 'play'));
        actionBar.querySelector('[data-action="pause"]').setAttribute('aria-pressed', String(action === 'pause'));
        renderActionBar();
      }
      document.addEventListener('music-playback-state', function (event) {
        setPlaybackAction(event.detail);
        musicIsPlaying = event.detail === 'play';
        if (!isZoomed && !isOpening) boombox.classList.toggle('is-playing', musicIsPlaying);
      });
      Array.prototype.slice.call(actionBar.querySelectorAll('.music-action-hit')).forEach(function (button) {
        var action = button.getAttribute('data-action');
        function press(event) {
          if (event) playButtonSound(action);
          if (action === 'play' || action === 'pause') {
            return;
          }
          if (event) {
            event.preventDefault();
            button.setPointerCapture(event.pointerId);
          }
          pressedActions[action] = true;
          renderActionBar();
        }
        function release(event) {
          if (action === 'play' || action === 'pause') return;
          delete pressedActions[action];
          renderActionBar();
          if (event && button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
        }
        button.addEventListener('pointerdown', press);
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('click', function (event) {
          if (event.detail === 0) playButtonSound(action);
          document.dispatchEvent(new CustomEvent('music-transport', { detail: action }));
        });
      });
    }
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' || event.key === 'Esc') closeZoom();
    });
    mobileQuery.addEventListener('change', function () {
      if (isZoomed) {
        zoomArt.src = zoomSource();
        setCameraAnchor();
      }
    });
    ['/music-boombox-zoom-desktop.png', '/music-boombox-zoom-mobile.png'].forEach(function (source) {
      var image = new Image();
      image.src = source;
    });
  })();
</script>
