<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;

    background: #f5e94a;
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;

    padding: clamp(8px, 2vw, 20px) 0 12px;
  }

  .logo-link {
    flex: 0 0 auto;
    display: block;
    width: min(70vw, 480px);
    margin: 0 auto;
  }
  .logo-link img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 50 / 19;
    object-fit: contain;
  }

  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }

  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  .privacy-footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 3px 0;
  }
  .privacy-footer a {
    display: inline-block;
    text-decoration: underline;
    color: #fff;
    font-size: 9px;
    opacity: 0.75;
  }
  .privacy-footer a:hover { opacity: 1; }

  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .player-wrap {
      min-height: 0;
    }
  }

  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      padding: 0;
      gap: 0;
    }
    .logo-link { display: none; }
    .player-wrap { min-height: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/" target="_top">
    <img src="/knobsock-music-logo.png" alt="KNOBSOCK MUSIC">
  </a>

  <div class="player-wrap">
    <iframe src="/music-playlist-widget.html"
            title="KNOBSOCK Music"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>

  <div class="privacy-footer"><a href="/privacy">Privacy Policy &amp; User Agreement</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  var firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  var db = firebase.firestore(firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(firebaseConfig));
  function setMeta(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.setAttribute('content', value);
  }
  db.collection('chat_config').doc('seo').get().then(function (doc) {
    var data = doc.exists ? doc.data() : null;
    var page = data && data.pages && data.pages['music'];
    if (!page) return;
    if (page.title) {
      document.title = page.title;
      setMeta('meta[property="og:title"]', page.title);
    }
    if (page.description) {
      setMeta('meta[name="description"]', page.description);
      setMeta('meta[property="og:description"]', page.description);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
