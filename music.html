<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as videos.html, but with the
     old-GeoCities tiled-GIF background main/index.html uses instead of
     a solid color. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* No page-level scrolling — the widget inside manages its own
       overflow (a scrolling playlist), so the page itself is capped to
       one viewport instead of growing past it. */
    overflow: hidden;
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    /* A fixed viewport height (not min-height) is what actually bounds
       the player below — without a definite height here, flexbox has no
       free space to give it, and the widget (which fills 100% of
       whatever height it's handed) has nothing definite to fill either,
       so it was rendering itself far taller than the screen instead of
       capping at one viewport. */
    height: 100vh;
    height: 100dvh;
    gap: clamp(4px, 1.5vw, 12px);
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The player fills whatever's left below the logo. The widget draws
     its own frosted panel and handles its own responsive layout down to
     small heights, so this is just the box it lives in. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }
  /* Absolutely positioned to exactly match .player-wrap's box, rather
     than relying on flexbox cross-axis stretch to size a replaced
     element — that stretch depends on the flex item's own flex-basis
     resolving first, which is circular for an iframe with no intrinsic
     height, and on some browsers/zoom levels it was falling back to a
     much taller size than the available space instead of actually being
     capped by it. inset:0 has no such ambiguity. */
  .player-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="https://truth.knobsock.net" target="_top">
    <img src="/knobsock-music-logo.png" alt="KNOBSOCK MUSIC">
  </a>

  <div class="player-wrap">
    <iframe src="/music-playlist-widget.html"
            title="KNOBSOCK Music"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

</body>
</html>
