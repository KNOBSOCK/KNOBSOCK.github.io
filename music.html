<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/music">
<meta property="og:title" content="Music - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:image" content="https://knobsock.net/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Music - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="twitter:image" content="https://knobsock.net/og-image.png">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #a69af2;
  }

  .music-scene {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: opacity 0.46s cubic-bezier(0.62, 0, 0.86, 0.42), transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .music-scene.is-zooming {
    opacity: 0;
    transform: scale(0.88);
    pointer-events: none;
  }

  .scene-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Cover the viewport, preserving the drawing's coordinate system. */
    width: max(100vw, calc(100vh * 8000 / 4511));
    height: max(100vh, calc(100vw * 4511 / 8000));
    transform: translate(-50%, -50%);
  }

  .scene-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }

  .music-logo-link {
    position: absolute;
    z-index: 2;
    /* Coordinates are relative to the illustration, not the browser. */
    top: 1%;
    left: 50%;
    display: block;
    width: 29.5%;
    transform: translateX(-50%);
    line-height: 0;
  }
  .music-logo-link img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }

  .boombox-overlay {
    position: absolute;
    z-index: 1;
    /* Matched to the boombox artwork in music-room-desktop.png. */
    left: 28.6875%;
    top: 20.3946%;
    width: 43.375%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .boombox-overlay img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
    transition: filter 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @media (hover: hover) {
    .boombox-overlay:hover img {
      filter: drop-shadow(0 0 8px rgba(255, 244, 90, 0.95)) drop-shadow(0 0 20px rgba(80, 235, 155, 0.8));
      transform: scale(1.018);
    }
  }
  .boombox-overlay:active img { transform: scale(0.97); }
  .boombox-overlay.is-popping img {
    animation: boombox-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 10px rgba(255, 244, 90, 1)) drop-shadow(0 0 24px rgba(80, 235, 155, 0.9));
  }
  @keyframes boombox-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.055); }
    100% { transform: scale(1); }
  }

  .music-zoom {
    position: fixed;
    z-index: 10;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .music-zoom[hidden] { display: none; }
  .music-zoom.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .music-zoom .scene-canvas {
    transform: translate(-50%, -50%) scale(0.88);
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .music-zoom.is-open .scene-canvas { transform: translate(-50%, -50%) scale(1); }
  .music-zoom-close {
    position: absolute;
    z-index: 1;
    top: 0;
    left: 0;
    width: 100%;
    height: 18%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: zoom-out;
    -webkit-tap-highlight-color: transparent;
  }

  @media (max-width: 860px) and (orientation: portrait) {
    .scene-canvas {
      width: max(100vw, calc(100vh * 4511 / 8000));
      height: max(100vh, calc(100vw * 8000 / 4511));
      transform: translate(-50.8%, -50%);
    }
    .music-scene .scene-art { content: url('/music-room-mobile.png'); }
    .music-logo-link {
      top: 3.2%;
      width: 72%;
    }
    .boombox-overlay {
      /* Matched separately to the portrait illustration. */
      left: 15.1851%;
      top: 23.875%;
      width: 70.828%;
    }
    .music-zoom-close { height: 20%; }
    .music-zoom .scene-canvas { transform: translate(-50.8%, -50%) scale(0.88); }
    .music-zoom.is-open .scene-canvas { transform: translate(-50.8%, -50%) scale(1); }
  }
</style>
</head>
<body>

<main class="music-scene" id="musicScene">
  <div class="scene-canvas">
    <img class="scene-art" src="/music-room-desktop.png" alt="A boombox on a table between two windows">
    <button class="boombox-overlay" id="boomboxOverlay" type="button" aria-label="Animated boombox">
      <img src="/music-boombox-overlay.png" alt="">
    </button>
    <a class="music-logo-link" href="/index.html" aria-label="KNOBSOCK home">
      <img src="/knobsock-music-scene-logo.png" alt="KNOBSOCK Music">
    </a>
  </div>
</main>

<div class="music-zoom" id="musicZoom" hidden aria-hidden="true">
  <div class="scene-canvas">
    <img class="scene-art" id="musicZoomArt" src="/music-boombox-zoom-desktop.png" alt="Close-up of a boombox">
  </div>
  <button class="music-zoom-close" id="musicZoomClose" type="button" aria-label="Zoom out to the full music room"></button>
</div>

<script>
  (function () {
    var boombox = document.getElementById('boomboxOverlay');
    var scene = document.getElementById('musicScene');
    var zoom = document.getElementById('musicZoom');
    var zoomArt = document.getElementById('musicZoomArt');
    var zoomClose = document.getElementById('musicZoomClose');
    if (!boombox || !scene || !zoom || !zoomArt || !zoomClose) return;
    var mobileQuery = window.matchMedia('(max-width: 860px) and (orientation: portrait)');
    var zoomTimer = null;
    var isZoomed = false;
    function popBoombox() {
      boombox.classList.remove('is-popping');
      void boombox.offsetWidth;
      boombox.classList.add('is-popping');
    }
    function zoomSource() {
      return mobileQuery.matches ? '/music-boombox-zoom-mobile.png' : '/music-boombox-zoom-desktop.png';
    }
    function setZoomOrigin() {
      var rect = boombox.getBoundingClientRect();
      scene.style.transformOrigin = (rect.left + rect.width / 2) + 'px ' + (rect.top + rect.height / 2) + 'px';
    }
    function openZoom() {
      if (isZoomed) return;
      isZoomed = true;
      popBoombox();
      setZoomOrigin();
      zoomArt.src = zoomSource();
      zoom.hidden = false;
      zoom.setAttribute('aria-hidden', 'false');
      void zoom.offsetWidth;
      zoom.classList.add('is-open');
      scene.classList.add('is-zooming');
    }
    function closeZoom() {
      if (!isZoomed) return;
      isZoomed = false;
      zoom.classList.remove('is-open');
      scene.classList.remove('is-zooming');
      zoom.setAttribute('aria-hidden', 'true');
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(function () { zoom.hidden = true; }, 470);
    }
    boombox.addEventListener('click', openZoom);
    boombox.addEventListener('animationend', function () {
      boombox.classList.remove('is-popping');
    });
    zoomClose.addEventListener('click', closeZoom);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' || event.key === 'Esc') closeZoom();
    });
    mobileQuery.addEventListener('change', function () {
      if (isZoomed) zoomArt.src = zoomSource();
    });
  })();
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>

  var firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  var db = firebase.firestore(firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(firebaseConfig));
  function setMeta(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.setAttribute('content', value);
  }
  db.collection('chat_config').doc('seo').get().then(function (doc) {
    var data = doc.exists ? doc.data() : null;
    var page = data && data.pages && data.pages['music'];
    if (!page) return;
    if (page.title) {
      document.title = page.title;
      setMeta('meta[property="og:title"]', page.title);
    }
    if (page.description) {
      setMeta('meta[name="description"]', page.description);
      setMeta('meta[property="og:description"]', page.description);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
