<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/music">
<meta property="og:title" content="Music - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Music - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as videos.html. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the music widget's own gold palette (its --ink) instead of
       the tiled GeoCities GIF every other non-widget page here uses, so
       the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: #3a2a00;
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    /* Matching bottom padding to the gap the script leaves below the
       player, so a scrolled phone layout doesn't end flush against the
       bottom of the screen. */
    padding: clamp(8px, 2vw, 20px) 0 12px;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The box the player lives in, same as live.html's player-wrap — the
     widget draws its own frosted panel and scales its own layout to
     whatever room it's given, so it's meant to stretch on a tall/4K/8K
     window rather than being capped to a "natural" height.

     min-height (not height) keeps it usable on very short screens,
     where the page then scrolls instead of squashing. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  /* height:auto (not 100%) on purpose — a percentage height can't
     resolve against a flex container whose own height comes from
     flex-grow, so the iframe would collapse to its default 150px.
     Letting the parent's default align-items:stretch size it instead
     makes it fill the row properly. */
  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it grow/scroll — the widget's own stacked mobile content
     (video + Now Playing card + playlist) scrolls inside its own
     .layout now instead (see music-playlist-widget.html), so scrolling
     stays inside the widget instead of moving the logo off-screen.
     min-height:0 (replacing the desktop floor above) lets .player-wrap
     shrink to whatever's actually left below the logo on a very short
     phone, letterboxing the widget slightly rather than overflowing the
     locked page. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .player-wrap {
      min-height: 0;
    }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/" target="_top">
    <img src="/knobsock-music-logo.png" alt="KNOBSOCK MUSIC">
  </a>

  <div class="player-wrap">
    <iframe src="/music-playlist-widget.html"
            title="KNOBSOCK Music"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

</body>
</html>
