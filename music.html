<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #a69af2;
  }

  .music-scene {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
  }
  .music-scene.is-zooming {
    opacity: 1;
    transform: scale(var(--scene-zoom-scale, 2));
    pointer-events: none;
  }

  .scene-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Cover the viewport, preserving the drawing's coordinate system. */
    width: max(100vw, calc(100vh * 8000 / 4511));
    height: max(100vh, calc(100vw * 4511 / 8000));
    transform: translate(-50%, -50%);
  }

  .scene-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .music-scene .scene-art--room {
    position: absolute;
    inset: 0;
    /* Let the room lights dim and rise instead of cutting between scenes. */
    transition: opacity 0.62s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .music-scene .scene-art--night {
    opacity: 0;
  }
  .music-scene.is-playing .scene-art--day {
    opacity: 0;
  }
  .music-scene.is-playing .scene-art--night {
    opacity: 1;
  }

  /* A visual-only layer: all controls remain directly clickable beneath it. */
  .club-lights {
    position: fixed;
    z-index: 30;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.08s linear, visibility 0s linear 0.08s;
  }
  .club-lights img {
    position: absolute;
    /* Deliberately overscan the viewport so neither end of a beam is visible. */
    top: -22vh;
    height: 174vh;
    width: auto;
    max-width: none;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    mix-blend-mode: screen;
    opacity: 0;
    transform-origin: 50% 0;
  }
  .music-is-playing .club-lights {
    opacity: 1;
    visibility: visible;
    transition-delay: 0s;
  }
  .club-lights img.is-pulsing {
    /* A quick flash in, followed by a fade-out twice as long. */
    animation: club-beam-pulse 0.45s linear both;
  }
  /* The room owns the club lighting; the close-up stays clean and usable. */
  .music-zoom:not([hidden]) ~ .club-lights {
    opacity: 0;
    visibility: hidden;
    transition-delay: 0s;
  }
  .club-lights .club-light--blue {
    left: -5vw;
    --beam-opacity: 0.46;
    --beam-angle: -2deg;
  }
  .club-lights .club-light--green {
    left: 19vw;
    --beam-opacity: 0.42;
    --beam-angle: 1.5deg;
  }
  .club-lights .club-light--purple {
    right: 19vw;
    --beam-opacity: 0.43;
    --beam-angle: -1deg;
  }
  .club-lights .club-light--red {
    right: -5vw;
    --beam-opacity: 0.34;
    --beam-angle: 2deg;
  }
  @keyframes club-beam-pulse {
    0% { opacity: 0; transform: rotate(var(--beam-angle)) scaleX(0.94); }
    33% { opacity: var(--beam-opacity); transform: rotate(var(--beam-angle)) scaleX(1); }
    100% { opacity: 0; transform: rotate(var(--beam-angle)) scaleX(1.06); }
  }

  .music-logo-link {
    position: absolute;
    z-index: 2;
    /* Coordinates are relative to the illustration, not the browser. */
    top: 1%;
    left: 50%;
    display: block;
    width: 29.5%;
    transform: translateX(-50%);
    line-height: 0;
  }
  .music-logo-link img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }

  .boombox-overlay {
    position: absolute;
    z-index: 1;
    /* Matched to the boombox artwork in music-room-desktop.png. */
    left: 28.6875%;
    top: 20.3946%;
    width: 43.375%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .boombox-overlay img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @media (hover: hover) {
    .boombox-overlay:hover img {
      transform: scale(1.018);
    }
  }
  .boombox-overlay:active img { transform: scale(0.97); }
  .boombox-overlay.is-popping img {
    animation: boombox-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes boombox-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.055); }
    100% { transform: scale(1); }
  }
  .boombox-overlay.is-playing img {
    animation: boombox-party 0.68s cubic-bezier(.42, 0, .58, 1) infinite alternate;
    transform-origin: 50% 88%;
  }
  @keyframes boombox-party {
    0% { transform: translateY(2%) rotate(-.4deg) scale(.99, 1.015); }
    18% { transform: translateY(-10%) rotate(-1deg) scale(1.025, .975); }
    36% { transform: translateY(1%) rotate(.3deg) scale(.99, 1.015); }
    56% { transform: translateY(-7%) rotate(.8deg) scale(1.018, .982); }
    76% { transform: translateY(1%) rotate(-.2deg) scale(.99, 1.015); }
    100% { transform: translateY(-5%) rotate(.6deg) scale(1.01, .99); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boombox-overlay.is-playing img { animation: none; }
    .club-lights img { animation: none; }
    .club-lights img.is-pulsing { animation: none; }
  }

  .music-zoom {
    position: fixed;
    z-index: 10;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    /* Reveal the registered close-up before the room layer is hidden. */
    transition: opacity 0s linear 0.40s;
  }
  .music-zoom[hidden] { display: none; }
  .music-zoom.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .music-zoom.is-closing {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.08s linear;
  }
  .music-zoom .scene-canvas {
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
    will-change: transform;
  }
  .music-zoom-frame {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .music-zoom-night-art {
    opacity: 0;
    transition: opacity 0.62s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .music-zoom.is-night-mode .music-zoom-night-art {
    opacity: 1;
  }
  .music-zoom > .scene-canvas > .music-lcd {
    z-index: 1;
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .music-zoom.is-open > .scene-canvas > .music-lcd {
    opacity: 1;
    transition-delay: 0.42s;
  }
  .music-controls {
    position: absolute;
    z-index: 3;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .music-zoom.is-open .music-controls {
    opacity: 1;
    transition-delay: 0.42s;
  }
  .music-control {
    position: absolute;
    display: block;
    width: var(--control-width);
    aspect-ratio: var(--control-aspect, 2 / 1);
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    line-height: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .music-control img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
    transition: transform 0.16s ease;
  }
  @media (hover: hover) {
    .music-control:hover img {
      animation: boombox-pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  }
  .music-control:focus-visible {
    outline: 3px solid #fff45a;
    outline-offset: 2px;
  }
  .music-control:active img { transform: scale(0.998); }
  .music-wheel {
    touch-action: none;
    --control-aspect: 1 / 1;
  }
  .music-wheel.is-dragging { cursor: grabbing; }
  .music-wheel.is-dragging img { animation: none; }
  @media (hover: hover) {
    .music-wheel:hover img { animation: none; }
  }
  /* Coordinates are in the 8000 × 4511 close-up artwork. */
  .music-control--artist { left: 27.4375%; top: 21.125%; --control-width: 7.4%; }
  .music-control--album { left: 27.54%; top: 29.18%; --control-width: 7.575%; }
  .music-control--shuffle { left: 27.30%; top: 36.13%; --control-width: 7.875%; }
  .music-wheel { left: 63.3625%; top: 24.25%; --control-width: 8.30%; }
  .music-control--back { left: 70.30%; top: 35.20%; --control-width: 7.75%; --control-aspect: 1 / 1; }
  .music-control--select { left: 70.6625%; top: 18.40%; --control-width: 6.875%; --control-aspect: 1 / 1; }
  .music-action-bar {
    position: absolute;
    left: 26.375%;
    top: 44.934%;
    z-index: 2;
    width: 47.475%;
    aspect-ratio: 3798 / 550;
    pointer-events: auto;
  }
  .music-action-art {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  .music-action-hit {
    position: absolute;
    top: 14.5%;
    width: 25%;
    height: 71%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .music-action-hit--play { left: 0; }
  .music-action-hit--pause { left: 25%; }
  .music-action-hit--previous { left: 50%; }
  .music-action-hit--forward { left: 75%; }
  .music-action-hit:focus-visible { outline: 3px solid #fff45a; outline-offset: -3px; }
  .music-zoom-close {
    position: absolute;
    z-index: 1;
    top: 0;
    left: 0;
    width: 100%;
    height: 18%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  @media (max-width: 860px) and (orientation: portrait) {
    .scene-canvas {
      width: max(100vw, calc(100vh * 4511 / 8000));
      height: max(100vh, calc(100vw * 8000 / 4511));
      transform: translate(-50%, -50%);
    }
    .music-scene .scene-art--day { content: url('/music-room-mobile-no-boombox.png'); }
    .music-scene .scene-art--night { content: url('/music-room-mobile-night.png'); }
    .club-lights img {
      top: -30vh;
      height: 244vh;
    }
    .club-lights .club-light--blue { left: -16vw; }
    .club-lights .club-light--green { left: 12vw; }
    .club-lights .club-light--purple { right: 12vw; }
    .club-lights .club-light--red { right: -16vw; }
    .music-logo-link {
      top: 3.2%;
      width: 72%;
    }
    .boombox-overlay {
      /* Matched separately to the portrait illustration. */
      left: 15.1851%;
      top: 23.875%;
      width: 70.828%;
    }
    /* Matched independently to the 4511 × 8000 portrait close-up artwork. */
    .music-control--artist {
      left: 13.567%; top: 31.913%; --control-width: 12.280%;
    }
    .music-control--album {
      left: 13.744%; top: 36.175%; --control-width: 12.569%;
    }
    .music-control--shuffle {
      left: 13.345%; top: 39.850%; --control-width: 13.057%;
    }
    .music-wheel { left: 73.154%; top: 33.563%; --control-width: 13.767%; }
    .music-control--back { left: 84.20%; top: 40.20%; --control-width: 10.00%; --control-aspect: 1 / 1; }
    .music-control--select { left: 85.212%; top: 30.475%; --control-width: 11.394%; }
    .music-action-bar { left: 11.815%; top: 44.50%; width: 78.72%; }
    .music-zoom-close { height: 20%; }
  }
</style>
</head>
<body>

<main class="music-scene" id="musicScene">
  <div class="scene-canvas">
    <img class="scene-art scene-art--room scene-art--day" src="/music-room-desktop-no-boombox.png" alt="A room with a table between two windows">
    <img class="scene-art scene-art--room scene-art--night" src="/music-room-desktop-night.png" alt="">
    <button class="boombox-overlay" id="boomboxOverlay" type="button" aria-label="Animated boombox">
      <img src="/music-boombox-overlay.png" alt="">
    </button>
    <a class="music-logo-link" href="/index.html" aria-label="KNOBSOCK home">
      <img src="/knobsock-music-scene-logo.png" alt="KNOBSOCK Music">
    </a>
  </div>
</main>

<div class="music-zoom" id="musicZoom" hidden aria-hidden="true">
  <div class="scene-canvas" id="musicZoomCanvas">
    <section class="music-lcd" id="musicLcd" aria-label="Music library and player">
      <div class="lcd-inner"><header class="lcd-header"><button id="lcdBack" aria-label="Back to library">‹</button><span id="lcdTitle">KNOBSOCK</span><span id="lcdState">■</span></header><div id="lcdBody" class="lcd-body"></div><footer id="lcdFooter">Loading library...</footer></div>
    </section>
    <img class="scene-art music-zoom-frame" id="musicZoomArt" src="/music-boombox-zoom-desktop-frame.png" alt="Close-up of a boombox">
    <img class="scene-art music-zoom-frame music-zoom-night-art" id="musicZoomNightArt" src="/music-boombox-zoom-mobile-night.png" alt="">
    <div class="music-controls" aria-label="Boombox controls">
      <button class="music-control music-control--artist" type="button" data-control="artist" aria-label="Artist view">
        <img src="/music-button-artist.png" data-idle-src="/music-button-artist.png" data-active-src="/music-button-artist-active.png" alt="">
      </button>
      <button class="music-control music-control--album" type="button" data-control="album" aria-label="Album view">
        <img src="/music-button-album.png" data-idle-src="/music-button-album.png" data-active-src="/music-button-album-active.png" alt="">
      </button>
      <button class="music-control music-control--shuffle" type="button" data-control="shuffle" aria-label="Shuffle" aria-pressed="false">
        <img src="/music-button-shuffle.png" data-idle-src="/music-button-shuffle.png" data-active-src="/music-button-shuffle-active.png" alt="">
      </button>
      <button class="music-control music-control--back" id="musicBackButton" type="button" data-control="back" aria-label="Back">
        <img src="/music-button-back.png" data-idle-src="/music-button-back.png" data-active-src="/music-button-back-active.png" alt="">
      </button>
      <button class="music-control music-wheel" id="musicTracksWheel" type="button" aria-label="Scroll library; use arrow keys or drag to browse">
        <img src="/music-wheel-tracks.png" data-idle-src="/music-wheel-tracks.png" data-active-src="/music-wheel-tracks-active.png" alt="">
      </button>
      <button class="music-control music-control--select" id="musicSelectButton" type="button" aria-label="Select">
        <img src="/music-button-select.png" data-idle-src="/music-button-select.png" data-active-src="/music-button-select-active.png" alt="">
      </button>
      <div class="music-action-bar" id="musicActionBar" aria-label="Playback controls">
        <img class="music-action-art" id="musicActionArt" src="/music-NoneClicked.png" alt="">
        <button class="music-action-hit music-action-hit--play" type="button" data-action="play" aria-label="Play" aria-pressed="false"></button>
        <button class="music-action-hit music-action-hit--pause" type="button" data-action="pause" aria-label="Pause" aria-pressed="false"></button>
        <button class="music-action-hit music-action-hit--previous" type="button" data-action="previous" aria-label="Previous track"></button>
        <button class="music-action-hit music-action-hit--forward" type="button" data-action="forward" aria-label="Next track"></button>
      </div>
    </div>
  </div>
  <button class="music-zoom-close" id="musicZoomClose" type="button" aria-label="Zoom out to the full music room"></button>
</div>

<div class="club-lights" aria-hidden="true">
  <img class="club-light--blue" src="/music-club-laser-blue.png" alt="">
  <img class="club-light--green" src="/music-club-laser-green.png" alt="">
  <img class="club-light--purple" src="/music-club-laser-purple.png" alt="">
  <img class="club-light--red" src="/music-club-laser-red.png" alt="">
</div>

<script>
  (function () {
    var boombox = document.getElementById('boomboxOverlay');
    var scene = document.getElementById('musicScene');
    var zoom = document.getElementById('musicZoom');
    var zoomArt = document.getElementById('musicZoomArt');
    var zoomNightArt = document.getElementById('musicZoomNightArt');
    var zoomClose = document.getElementById('musicZoomClose');
    var controls = Array.prototype.slice.call(document.querySelectorAll('.music-control'));
    var tracksWheel = document.getElementById('musicTracksWheel');
    var selectButton = document.getElementById('musicSelectButton');
    var actionBar = document.getElementById('musicActionBar');
    var actionArt = document.getElementById('musicActionArt');
    var effectUrls = {
      buttonclick: '/buttonclick.mp3',
      singleclick: '/singleclick.mp3',
      woosh: '/woosh.m4a',
      play: '/PlayButtonSound.mp3',
      pause: '/PauseButtonSound.mp3',
      previous: '/Forward%20and%20Backward%20button%20sound.mp3',
      forward: '/Forward%20and%20Backward%20button%20sound.mp3'
    };
    var effectContext = null;
    var effectBuffers = {};
    var effectLoads = {};
    var legacyEffects = {};
    function getEffectContext() {
      if (effectContext && effectContext.state !== 'closed') return effectContext;
      var AudioContextCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextCtor) return null;
      try { effectContext = new AudioContextCtor(); } catch (_) { effectContext = null; }
      return effectContext;
    }
    function loadEffect(name) {
      var context = getEffectContext();
      var url = effectUrls[name];
      if (!context || !url) return Promise.reject(new Error('Audio effects unavailable'));
      if (effectBuffers[url]) return Promise.resolve(effectBuffers[url]);
      if (!effectLoads[url]) {
        effectLoads[url] = fetch(url, { cache: 'force-cache' })
          .then(function (response) {
            if (!response.ok) throw new Error('Audio effect unavailable');
            return response.arrayBuffer();
          })
          .then(function (data) { return context.decodeAudioData(data); })
          .then(function (buffer) { effectBuffers[url] = buffer; return buffer; })
          .catch(function (error) { delete effectLoads[url]; throw error; });
      }
      return effectLoads[url];
    }
    function primeEffect(name) {
      var context = getEffectContext();
      if (!context) return;
      if (context.state === 'suspended') context.resume().catch(function () {});
      loadEffect(name).catch(function () {});
    }
    function playLegacyEffect(name, volume) {
      if (!effectUrls[name]) return;
      var source = legacyEffects[name] || (legacyEffects[name] = new Audio(effectUrls[name]));
      source.preload = 'none';
      try { source.pause(); source.currentTime = 0; } catch (_) {}
      source.volume = volume;
      var playback = source.play();
      if (playback && playback.catch) playback.catch(function () {});
    }
    function startEffect(context, buffer, volume) {
      try {
        var source = context.createBufferSource();
        var gain = context.createGain();
        source.buffer = buffer;
        gain.gain.value = volume;
        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
      } catch (_) {}
    }
    function playEffect(name, volume) {
      var context = getEffectContext();
      if (!context) {
        playLegacyEffect(name, volume);
        return;
      }
      if (context.state === 'suspended') context.resume().catch(function () {});
      var url = effectUrls[name];
      if (effectBuffers[url]) {
        startEffect(context, effectBuffers[url], volume);
        return;
      }
      loadEffect(name).then(function (buffer) {
        startEffect(context, buffer, volume);
      }).catch(function () {
        playLegacyEffect(name, volume);
      });
    }
    function playControlClick() {
      playEffect('buttonclick', 0.7);
      if (navigator.vibrate) navigator.vibrate(8);
    }
    if (!boombox || !scene || !zoom || !zoomArt || !zoomNightArt || !zoomClose) return;
    var mobileQuery = window.matchMedia('(max-width: 860px) and (orientation: portrait)');
    var zoomTimer = null;
    var sceneHideTimer = null;
    var danceResumeTimer = null;
    var isZoomed = false;
    var isOpening = false;
