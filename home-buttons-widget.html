<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Buttons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
  }

  a { text-decoration: none; color: inherit; }

  .buttons-row {
    width: 100%;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: flex-start;
    justify-content: center;
    gap: 4vw;
  }

  .button-item {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    cursor: pointer;

    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

    --icon-width: 55%;
    --icon-top: 34%;
  }
  .button-item:hover {
    transform: scale(1.08) rotate(-2deg);
  }

  .btn-base {
    display: block;
    width: 100%;
    height: auto;
  }

  .btn-icon {
    position: absolute;
    left: 50%;
    top: var(--icon-top);
    width: var(--icon-width);
    height: auto;
    transform: translateX(-50%);
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="buttons-row">

    <a class="button-item" href="PASTE_VIDEOS_LINK_HERE" target="_top" style="--icon-width: 60%; --icon-top: 36%;">
      <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_3B78D67E-1306-47B2-B47F-CD20BFD335A9.PNG" width="1006" height="1436" alt="Videos">
      <img class="btn-icon" src="PASTE_VIDEOS_GIF_URL_HERE" alt="">
    </a>

    <a class="button-item" href="PASTE_PHOTOS_LINK_HERE" target="_top" style="--icon-width: 55%; --icon-top: 34%;">
      <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_DD40FE14-A89B-461D-A545-D25D2C068EF0.PNG" width="982" height="1408" alt="Photos">
      <img class="btn-icon" src="PASTE_PHOTOS_GIF_URL_HERE" alt="">
    </a>

    <a class="button-item" href="PASTE_MUSIC_LINK_HERE" target="_top" style="--icon-width: 50%; --icon-top: 34%;">
      <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_0E600FC4-6378-49CD-B81A-0AEF5BDE4858.PNG" width="961" height="1426" alt="Music">
      <img class="btn-icon" src="PASTE_MUSIC_GIF_URL_HERE" alt="">
    </a>

    <a class="button-item" href="PASTE_LIVE_LINK_HERE" target="_top" style="--icon-width: 55%; --icon-top: 32%;">
      <img class="btn-base" src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_EEB436D1-F728-456D-BEA8-1AE7ACE238BE.PNG" width="964" height="1377" alt="Live">
      <img class="btn-icon" src="PASTE_LIVE_GIF_URL_HERE" alt="">
    </a>

  </div>

</body>
</html>
