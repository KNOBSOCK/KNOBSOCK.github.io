name: Sync WordPress articles

# Polls WordPress for new/edited/deleted posts and regenerates the static
# pages under article/<slug>/. Pushing the result is what triggers the
# Pages rebuild, so a change is live a minute or two after this runs.
#
# Polling rather than a push webhook because WordPress.com only allows
# outgoing webhooks on paid plans — there's nothing to install on the
# blog side this way, and no credentials to store here.

on:
  schedule:
    # Hourly, at 20 past. Deliberately not :00 — GitHub queues every
    # cron scheduled for the top of the hour at once, so off-peak minutes
    # actually start sooner.
    - cron: "20 * * * *"
  # "Run workflow" button, for when you've just published and don't want
  # to wait for the next hourly run.
  workflow_dispatch:

# Least privilege: the job pushes commits and does nothing else.
permissions:
  contents: write

# If a run is already going, let it finish rather than having two runs
# generate and push the same files on top of each other.
concurrency:
  group: sync-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install — the script uses only Node builtins
      # and the global fetch that ships with Node 18+.
      - name: Generate article pages
        run: node scripts/build-articles.mjs

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --porcelain is empty when the generator produced no changes,
          # which is the normal case for most hourly runs. Committing
          # unconditionally would put an empty commit on main every hour.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No article changes — nothing to commit."
            exit 0
          fi

          git add -A
          git commit -m "Sync articles from WordPress

          Generated by .github/workflows/sync-articles.yml."

          # Another push may have landed since checkout; rebase onto it
          # rather than failing the run.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
