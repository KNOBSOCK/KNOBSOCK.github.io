name: Save finished streams to Past Streams

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be saved without writing anything"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: archive-past-streams
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --prefix scripts

      - name: Save finished streams
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.LIVE_FIREBASE_SERVICE_ACCOUNT_KEY }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            node scripts/archive-past-streams.mjs --dry-run
          else
            node scripts/archive-past-streams.mjs
          fi
