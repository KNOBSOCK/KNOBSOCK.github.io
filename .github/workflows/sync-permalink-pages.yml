name: Sync video permalink pages

# Regenerates the static per-video permalink pages under
# videos/hamburgernews/v/<id>/ from Firestore (playlist/hamburgerNews and
# playlist/hamburgerGames) — see scripts/build-permalink-pages.mjs.
# Pushing the result is what triggers the Pages rebuild.
#
# Same access pattern as purge-ip-logs.yml: a service-account key via the
# Admin SDK, which bypasses Firestore security rules entirely (see
# firestore.rules). No webhook exists for Firestore writes, so this
# polls on a schedule instead.

on:
  schedule:
    # Hourly, at 25 past — offset from sync-articles.yml's :20 so the two
    # don't queue at the same minute.
    - cron: "25 * * * *"
  # "Run workflow" button, for right after adding a new episode/game and
  # not wanting to wait for the next hourly run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-permalink-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --prefix scripts

      - name: Generate video permalink pages
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/build-permalink-pages.mjs

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No permalink page changes — nothing to commit."
            exit 0
          fi

          git add -A
          git commit -m "Sync video permalink pages

          Generated by .github/workflows/sync-permalink-pages.yml."

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
