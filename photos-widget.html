<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Photo Gallery</title>
<style>
  /* Same shell/theme system as video-playlist-widget.html and
     livestream-chat-widget.html (CSS vars, .bg-glow, .main-row split,
     a pill "chin" row across the bottom), just orange instead of blue,
     and with the side pane as an actual thumbnail GRID instead of a
     vertical "Up Next" list — per the two reference sketches: photo on
     one side, a grid to pick from on the other (right on desktop, below
     on mobile), full-grid at every size rather than the video widget's
     mobile horizontal-scroll strip. */
  :root {
    --ink: #431c00;
    --panel-2: rgba(67, 28, 0, 0.8);
    --line: rgba(255, 190, 130, 0.6);
    --accent: #ff7a1a;
    --accent-dim: #a34e0e;
    --accent-yellow: #ffdd00;
    --text: #ffffff;
    --text-dim: #ffd9b3;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;
    /* Shared between .bg-glow and .layout below so the panel's edges and
       the content's padding can never drift apart at any window size —
       both reference the exact same values instead of two independently
       written formulas that merely happened to match. */
    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { position: relative; }

  /* Full-bleed edge-to-edge (same as livestream-chat-widget.html's own
     .bg-glow) rather than capped at a fixed pixel width — a width cap
     here while .layout's height was free to grow unbounded is what made
     the widget elongate (get taller without getting wider) on a
     big/zoomed-out screen instead of scaling proportionally like
     live.html. */
  .bg-glow {
    position: absolute;
    inset: var(--inset-bottom);
    top: var(--inset-top);
    left: var(--inset-side);
    right: var(--inset-side);
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(255, 122, 26, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  .layout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 10px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  .main-row {
    display: flex;
    flex-direction: row;
    flex: 1 1 auto;
    min-height: 0;
    gap: 14px;
  }

  /* ---------- MAIN PHOTO PANE ----------
     Transparent instead of a solid fill — photos come in every aspect
     ratio, and object-fit:contain below always leaves some letterboxed
     space around whichever shape doesn't match the pane. A solid
     background there read as ugly "black bars"; transparent lets the
     page's own warm blurred glow (.bg-glow) show through instead, so
     the photo just floats on the page rather than sitting in a box. */
  .photo-pane {
    position: relative;
    overflow: hidden;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    flex: 1 1 62%;
    display: flex;
    flex-direction: column;
  }

  .photo-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 2vw, 16px);
  }
  .photo-stage img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
  }
  /* Only the actual photo (a direct child of #photoStage) is
     clickable-to-zoom — not the loading gif, which sits nested a
     level deeper inside #photoLoadingBar/#photoEmptyState. */
  #photoStage > img {
    cursor: zoom-in;
  }

  /* ---------- PHOTO LOADING BAR ----------
     The main pane loads each photo's untouched original (often several
     MB straight off a camera), which can take a moment — this sits over
     the stage, where the photo itself would render, so switching photos
     doesn't just look frozen while the bytes come in. */
  .photo-loading-bar {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90px, 30%);
    z-index: 2;
  }
  .photo-loading-bar[hidden] { display: none; }
  .photo-loading-bar-fill {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0.35;
  }

  .magnify-btn {
    position: absolute;
    top: clamp(8px, 2vw, 14px);
    right: clamp(8px, 2vw, 14px);
    z-index: 5;
    width: clamp(28px, 8vw, 36px);
    aspect-ratio: 1 / 1;
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    background: rgba(67, 28, 0, 0.75);
    border: 1px solid var(--line);
    color: var(--text);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s;
  }
  .magnify-btn:hover { background: var(--accent-dim); transform: scale(1.1) rotate(-4deg); }
  .magnify-btn svg { width: 58%; height: 58%; display: block; }

  /* ---------- LIGHTBOX (magnify / zoom+pan viewer) ----------
     A fixed overlay drawn in-page, covering the widget's own viewport —
     it does NOT request the browser's native Fullscreen API, so clicking
     a photo reads as the photo zooming up in place rather than the
     browser itself going fullscreen. Pinch/wheel/double-tap zoom and
     drag-to-pan are layered on top in JS. */
  @keyframes lightbox-zoom-in {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0, 0, 0, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .lightbox:not([hidden]) {
    animation: lightbox-zoom-in 0.22s ease-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: zoom-in;
  }
  .lightbox-stage.dragging { cursor: grabbing; }
  .lightbox-stage img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }
  .lightbox-toolbar {
    position: absolute;
    top: clamp(10px, 2.5vw, 20px);
    right: clamp(10px, 2.5vw, 20px);
    z-index: 5;
    display: flex;
    gap: 8px;
  }
  .lightbox-btn {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(32px, 8vw, 40px);
    aspect-ratio: 1 / 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 50%;
    background: rgba(67, 28, 0, 0.75);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    line-height: 1;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s;
  }
  .lightbox-btn:hover { background: var(--accent-dim); transform: scale(1.1); }
  .lightbox-hint {
    position: absolute;
    left: 50%;
    bottom: clamp(12px, 3vw, 22px);
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: clamp(10px, 2.6vw, 12px);
    color: var(--text-dim);
    background: rgba(67, 28, 0, 0.6);
    padding: 5px 12px;
    border-radius: 999px;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.4s ease;
  }

  .photo-caption {
    flex: 0 0 auto;
    padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 16px);
    background: rgba(67, 28, 0, 0.75);
    border-top: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-body);
  }
  .photo-caption .cap-title {
    font-size: clamp(12px, 3vw, 15px);
    font-weight: 700;
  }
  .photo-caption .cap-cat {
    font-size: clamp(10px, 2.4vw, 12px);
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .photo-caption .cap-meta {
    margin-top: 3px;
    font-size: clamp(9px, 2.1vw, 11px);
    color: var(--text-dim);
    opacity: 0.8;
    letter-spacing: 0.01em;
  }
  .photo-caption .cap-meta:empty { display: none; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: clamp(12px, 2.8vw, 15px);
    padding: 20px;
  }

  .gif-loader {
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
    margin: 0 auto;
  }

  /* ---------- GRID PANE ---------- */
  .grid-pane {
    flex: 1 1 38%;
    min-width: 280px;
    display: flex;
  }

  .grid-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .grid-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(8px, 2vw, 12px) clamp(10px, 2.4vw, 14px);
    border-bottom: 1px solid var(--line);
  }
  .grid-title {
    font-family: var(--font-display);
    font-size: clamp(12px, 2.6vw, 15px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .grid-count {
    font-family: var(--font-body);
    font-size: clamp(9px, 2.2vw, 12px);
    color: var(--text-dim);
  }

  /* Plain viewport-relative units, same as every other widget on this
     site (music/video playlist, recent articles, etc.) rather than CSS
     container queries — no functional difference here, just less new-ish
     surface area. */
  .grid-items {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: clamp(12px, 2.4vw, 16px);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 9vw, 116px), 1fr));
    /* Rows are sized off this custom property (kept in sync with the
       columns' own actual rendered width by JS below) rather than off
       "auto" + each item's own aspect-ratio contribution. Confirmed by
       direct measurement: when a column's final width comes from 1fr
       stretch (auto-fill fits fewer, wider tracks than the raw minmax()
       floor), Chromium's implicit row auto-sizing computes row height
       from that narrower pre-stretch floor instead of the actual
       rendered column width, undersizing every row so each square tile
       overflows into the next row by the difference — this is what read
       as photos "overlapping" once there were enough of them to need
       more than one screenful of rows. The var() falls back to "auto"
       (each item's own aspect-ratio square) before JS has measured
       anything, e.g. on first paint. */
    grid-auto-rows: var(--tile-size, auto);
    gap: clamp(10px, 2vw, 14px);
    align-content: start;
  }
  .grid-items::-webkit-scrollbar { width: 8px; }
  .grid-items::-webkit-scrollbar-track { background: transparent; }
  .grid-items::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }

  /* Every tile is the same 1:1 ratio with the same "matte" padding
     around the image, so the grid reads as evenly spaced regardless of
     each photo's own aspect ratio or the viewport size. min-width/
     min-height:0 removes the item's automatic content-based size floor —
     a standard Grid/Flexbox defensive default, cheap insurance even
     though the actual row-overlap bug (see .grid-items) turned out to be
     elsewhere. */
  .grid-item {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    aspect-ratio: 1 / 1;
    min-width: 0;
    min-height: 0;
    padding: 3px;
    border-radius: clamp(4px, 1vw, 8px);
    overflow: hidden;
    background: var(--panel-2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s;
  }
  .grid-item:hover,
  .grid-item:focus-visible {
    border-color: var(--accent);
    transform: scale(1.08) rotate(-2deg);
    z-index: 2;
  }
  .grid-item:active { transform: scale(0.96); }
  .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: clamp(2px, 0.7vw, 6px);
  }
  .grid-item.active {
    border-color: var(--accent-yellow);
    box-shadow: 0 0 0 2px var(--accent-yellow);
  }

  /* ---------- CATEGORY CHIN ---------- */
  .category-chin {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5vw, 10px);
    /* Equal breathing room above (from the header's divider line above)
       and below (before the grid starts). */
    margin: clamp(8px, 2vw, 12px) 0;
    padding: 0 2px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .category-chin::-webkit-scrollbar { display: none; }

  .category-chip {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    border-radius: 999px;
    padding: clamp(6px, 1.6vw, 9px) clamp(14px, 3vw, 18px);
    font-size: clamp(11px, 2.6vw, 13px);
    white-space: nowrap;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .category-chip:hover { background: var(--accent-dim); }
  .category-chip.active {
    background: var(--accent-yellow);
    border-color: var(--accent-yellow);
    color: var(--ink);
  }

  /* ---------- RESPONSIVE ----------
     Mobile: photo on top, full grid below (a real grid, not a
     horizontal strip — the sketch showed rows and columns at the
     bottom, same as desktop just narrower). */
  @media (max-width: 860px) {
    .main-row { flex-direction: column; }
    .photo-pane { flex: 0 0 40vh; }
    /* min-height:0 (not just min-width) is required here: .main-row is
       column-direction on mobile, so .grid-pane's relevant flex-shrink
       axis is now height, not width — without this override a flex item
       won't shrink below its content's natural height, so .grid-items'
       own overflow-y:auto never gets a bounded height to actually clip
       against and the grid just grows to fit every row, pushing the
       category tabs below it out past the widget's own visible bounds. */
    .grid-pane { flex: 1 1 auto; min-width: 0; min-height: 0; }
  }
  @media (min-width: 861px) {
    .main-row { align-items: stretch; }
  }
</style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>
<div class="layout" id="layout">
  <div class="main-row" id="mainRow">
    <div class="photo-pane" id="photoPane">
      <button type="button" class="magnify-btn" id="magnifyBtn" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <line x1="20" y1="20" x2="15.3" y2="15.3"></line>
        </svg>
      </button>
      <div class="photo-stage" id="photoStage">
        <div class="empty-state" id="photoEmptyState"><img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading photos…"></div>
        <div class="photo-loading-bar" id="photoLoadingBar" hidden>
          <img class="photo-loading-bar-fill" src="/KNOBSOCK-loading-animation.gif" alt="" aria-hidden="true">
        </div>
      </div>
      <div class="photo-caption" id="photoCaption" hidden>
        <div class="cap-title" id="capTitle"></div>
        <div class="cap-cat" id="capCat"></div>
        <div class="cap-meta" id="capMeta"></div>
      </div>
    </div>

    <div class="grid-pane" id="gridPane">
      <div class="grid-card">
        <div class="grid-header">
          <span class="grid-title">Photos</span>
          <span class="grid-count" id="gridCount"></span>
        </div>
        <!-- Auto-populated from each photo's folder — see renderChin()
             below. "All" chip clears the category filter. Lives here
             (not below the whole widget) so it never shares space with
             — or gets covered by — the main photo pane. -->
        <div class="category-chin" id="categoryChin"></div>
        <div class="grid-items" id="gridItems">
          <div class="empty-state"><img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading…"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-toolbar">
    <button type="button" class="lightbox-btn" id="lightboxZoomOut" title="Zoom out">&minus;</button>
    <button type="button" class="lightbox-btn" id="lightboxZoomIn" title="Zoom in">+</button>
    <button type="button" class="lightbox-btn" id="lightboxClose" title="Close">&times;</button>
  </div>
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImg" alt="" draggable="false">
  </div>
  <div class="lightbox-hint" id="lightboxHint">Scroll or pinch to zoom &middot; drag to pan</div>
</div>

<!-- Reads camera metadata (dimensions, make/model, f-stop, ISO, shutter
     speed) straight out of each photo's own EXIF data client-side — no
     manual per-photo metadata to maintain, same "auto-pulled" spirit as
     the photo discovery below. Lite build: TIFF+EXIF only, which covers
     every field used here. -->
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>

<!-- ============================================================
     FIREBASE — same project as the other widgets/admin.html, read-only
     here: this widget only ever reads the admin-set photo/category
     order, never writes it (that happens from admin.html, which signs
     in as the admin account). -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
  // Guarded: photo browsing worked with zero external dependencies besides
  // GitHub before this, and a blocked/failed Firebase load (ad blocker,
  // flaky network, gstatic.com down) shouldn't be able to take the whole
  // gallery down with it — PHOTO_ORDER_DOC_REF just stays null, and the
  // ordering code below treats that exactly like "no override saved yet".
  let PHOTO_ORDER_DOC_REF = null;
  if (window.firebase) {
    const firebaseConfig = {
      apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
      authDomain: "chat-for-website-efee2.firebaseapp.com",
      projectId: "chat-for-website-efee2",
      storageBucket: "chat-for-website-efee2.firebasestorage.app",
      messagingSenderId: "509309222193",
      appId: "1:509309222193:web:f487258cfba2f7f7b00410"
    };
    const firebaseApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // Firestore document that holds the admin-set category/photo order —
    // everyone reads this live; only a signed-in admin (per Firestore
    // rules, via admin.html) can write it. Categories/photos with no
    // entry here just keep the default alphabetical order
    // buildCategoriesFromTree already produces.
    PHOTO_ORDER_DOC_REF = db.collection('playlist').doc('photos');
  }
</script>

<script>
(function () {
  // ====================================================================
  // Photos are auto-pulled straight from this repo — no admin panel, no
  // manual index to maintain. Drop image files under photos/<Category>/
  // on GitHub (e.g. photos/NYFW25/img1.jpg) and they show up here on the
  // next page load; the folder name becomes the category tab. Files
  // dropped directly in photos/ with no subfolder land in "Uncategorized".
  //
  // Discovery uses GitHub's git-trees API (one request, recursive, lists
  // every path in the repo) rather than the contents API (one request
  // per folder) — much friendlier to the unauthenticated rate limit
  // (60 req/hr per visitor's own IP, since this all runs client-side).
  // The actual image bytes are then served the same way every other
  // image on this site is, via raw.githubusercontent.com.
  // ====================================================================
  const OWNER = 'KNOBSOCK';
  const REPO = 'KNOBSOCK.github.io';
  const BRANCH = 'main';
  const TREE_API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/refs/heads/${BRANCH}/`;
  const IMAGE_EXT = /\.(jpe?g|png|gif|webp|avif)$/i;
  // Grid thumbnails go through wsrv.nl (a free public image-resizing proxy)
  // instead of shipping each photo's full original — these are real camera
  // files (often several MB, 4000px+ on a side), and loading 15-20 of them
  // at once just to show ~100px squares was both slow and, under load,
  // visibly janky. The main pane and lightbox still use the untouched
  // original for full quality when a photo is actually opened.
  const THUMB_PX = 240; // ~2x the largest rendered tile size, for retina

  function rawUrl(path) {
    return RAW_BASE + path.split('/').map(encodeURIComponent).join('/');
  }

  function thumbUrl(path) {
    const src = rawUrl(path);
    return 'https://wsrv.nl/?url=' + encodeURIComponent(src) +
      '&w=' + THUMB_PX + '&h=' + THUMB_PX + '&fit=cover&output=webp&q=75';
  }

  const photoStage = document.getElementById('photoStage');
  const photoEmptyState = document.getElementById('photoEmptyState');
  const photoLoadingBar = document.getElementById('photoLoadingBar');
  const photoCaption = document.getElementById('photoCaption');
  const capTitle = document.getElementById('capTitle');
  const capCat = document.getElementById('capCat');
  const capMeta = document.getElementById('capMeta');
  const gridItemsEl = document.getElementById('gridItems');
  const gridCountEl = document.getElementById('gridCount');
  const chinEl = document.getElementById('categoryChin');

  let categories = [];       // [{ name, photos: [{ path, filename, title }] }]
  let activeCategory = 'All';
  let activePhoto = null;
  let mainImg = null;
  const metaCache = new Map(); // path -> formatted metadata string
  let metaRequestId = 0;

  function formatShutterSpeed(exposureTime) {
    if (!exposureTime || !isFinite(exposureTime)) return null;
    if (exposureTime >= 1) return Math.round(exposureTime * 10) / 10 + 's';
    return '1/' + Math.round(1 / exposureTime) + 's';
  }

  function formatCameraName(tags) {
    const make = (tags.Make || '').trim();
    const model = (tags.Model || '').trim();
    if (!make) return model || null;
    if (!model) return make;
    // Most models already repeat the make (e.g. "Canon EOS R6") — avoid "Canon Canon EOS R6".
    return model.toLowerCase().startsWith(make.toLowerCase()) ? model : make + ' ' + model;
  }

  function formatMeta(tags, width, height) {
    const parts = [];
    const w = (tags && (tags.ExifImageWidth || tags.PixelXDimension)) || width;
    const h = (tags && (tags.ExifImageHeight || tags.PixelYDimension)) || height;
    if (w && h) parts.push(w + ' × ' + h);

    if (tags) {
      const camera = formatCameraName(tags);
      if (camera) parts.push(camera);
      if (tags.FNumber) parts.push('f/' + tags.FNumber);
      if (tags.ISO) parts.push('ISO ' + tags.ISO);
      const shutter = formatShutterSpeed(tags.ExposureTime);
      if (shutter) parts.push(shutter);
    }
    return parts.join(' · ');
  }

  function loadMeta(photo, imgEl) {
    const path = photo.path;
    const requestId = ++metaRequestId;

    if (metaCache.has(path)) {
      capMeta.textContent = metaCache.get(path);
      return;
    }

    capMeta.textContent = '';
    const url = rawUrl(path);

    const exifPromise = (window.exifr && typeof window.exifr.parse === 'function')
      ? window.exifr.parse(url).catch(() => null)
      : Promise.resolve(null);
    // decode() resolves once this exact image request has actually finished
    // loading, so naturalWidth/Height are reliably populated by the time we
    // read them below — reading them straight off exifPromise.then() would
    // otherwise race the image's own load and could intermittently report 0.
    const readyPromise = (imgEl.decode ? imgEl.decode() : Promise.resolve()).catch(() => {});

    Promise.all([exifPromise, readyPromise]).then(([tags]) => {
      if (requestId !== metaRequestId) return; // a newer photo was selected meanwhile
      const text = formatMeta(tags, imgEl.naturalWidth || null, imgEl.naturalHeight || null);
      metaCache.set(path, text);
      if (activePhoto && activePhoto.path === path) capMeta.textContent = text;
    });
  }

  function naturalCompare(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  }

  function titleFromFilename(filename) {
    return filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
  }

  function buildCategoriesFromTree(tree) {
    const byCategory = new Map();
    tree.forEach((entry) => {
      if (entry.type !== 'blob') return;
      if (!entry.path.startsWith('photos/')) return;
      if (!IMAGE_EXT.test(entry.path)) return;

      const parts = entry.path.split('/'); // ["photos", "<category>", ...]
      const category = parts.length > 2 ? parts[1] : 'Uncategorized';
      const filename = parts[parts.length - 1];
      // Skip hidden/sidecar files — macOS's AppleDouble metadata files
      // (uploaded alongside real photos as e.g. "._IMG_1234.jpg") aren't
      // real images and fail to decode, showing up as broken thumbnails.
      if (filename.startsWith('.')) return;
      const photo = { path: entry.path, filename, title: titleFromFilename(filename) };

      if (!byCategory.has(category)) byCategory.set(category, []);
      byCategory.get(category).push(photo);
    });

    const cats = Array.from(byCategory.entries())
      .map(([name, photos]) => ({
        name,
        photos: photos.sort((a, b) => naturalCompare(a.filename, b.filename))
      }))
      .sort((a, b) => naturalCompare(a.name, b.name));

    const all = [];
    cats.forEach((c) => all.push(...c.photos));

    return [{ name: 'All', photos: all }, ...cats];
  }

  function currentList() {
    const cat = categories.find((c) => c.name === activeCategory);
    return cat ? cat.photos : [];
  }

  function renderChin() {
    chinEl.innerHTML = '';
    categories.forEach((cat) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-chip' + (cat.name === activeCategory ? ' active' : '');
      btn.textContent = cat.name + ' (' + cat.photos.length + ')';
      btn.addEventListener('click', () => {
        activeCategory = cat.name;
        renderChin();
        renderGrid();
      });
      chinEl.appendChild(btn);
    });
  }

  function renderGrid() {
    const list = currentList();
    gridCountEl.textContent = list.length ? list.length + (list.length === 1 ? ' photo' : ' photos') : '';
    gridItemsEl.innerHTML = '';

    if (!list.length) {
      gridItemsEl.innerHTML = '<div class="empty-state">No photos in this category yet.</div>';
      return;
    }

    list.forEach((photo) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'grid-item' + (activePhoto && activePhoto.path === photo.path ? ' active' : '');
      btn.title = photo.title;

      const img = document.createElement('img');
      img.src = thumbUrl(photo.path);
      img.alt = photo.title;
      img.loading = 'lazy';
      img.decoding = 'async';
      // If the thumbnail proxy ever fails, fall back to the full photo
      // rather than showing a broken thumbnail — once only, to avoid an
      // infinite loop if the fallback itself 404s.
      img.addEventListener('error', function onThumbError() {
        img.removeEventListener('error', onThumbError);
        img.src = rawUrl(photo.path);
      });
      btn.appendChild(img);

      btn.addEventListener('click', () => selectPhoto(photo));
      gridItemsEl.appendChild(btn);
    });

    syncGridRowHeight();
  }

  // See the grid-auto-rows comment on .grid-items — Chromium's implicit
  // row auto-sizing doesn't reliably track a column's actual 1fr-stretched
  // width when it comes from auto-fill/minmax(), so rows are instead sized
  // explicitly off a real measurement of the first tile's rendered width.
  function syncGridRowHeight() {
    const first = gridItemsEl.querySelector('.grid-item');
    if (!first) return;
    const w = first.getBoundingClientRect().width;
    if (w > 0) gridItemsEl.style.setProperty('--tile-size', w + 'px');
  }

  if (window.ResizeObserver) {
    new ResizeObserver(syncGridRowHeight).observe(gridItemsEl);
  } else {
    window.addEventListener('resize', syncGridRowHeight);
  }

  function selectPhoto(photo) {
    activePhoto = photo;

    if (!mainImg) {
      photoEmptyState.remove();
      mainImg = document.createElement('img');
      mainImg.addEventListener('load', function () {
        photoLoadingBar.hidden = true;
        mainImg.style.visibility = 'visible';
      });
      mainImg.addEventListener('error', function () {
        photoLoadingBar.hidden = true;
        mainImg.style.visibility = 'visible';
      });
      photoStage.appendChild(mainImg);
    }
    // Hidden (rather than left showing the outgoing photo) while the new
    // one loads, so the stage's own transparent/frosted panel shows
    // through behind the loading gif instead of a stale frame — makes
    // switching feel like a clean swap, not a freeze.
    mainImg.style.visibility = 'hidden';
    photoLoadingBar.hidden = false;
    mainImg.src = rawUrl(photo.path);
    mainImg.alt = photo.title;

    capTitle.textContent = photo.title;
    capCat.textContent = photo.path.split('/')[1] || '';
    photoCaption.hidden = false;
    loadMeta(photo, mainImg);

    // Re-render just to update the active/highlighted grid item.
    renderGrid();
  }

  function showFatalMessage(msg) {
    photoStage.innerHTML = '<div class="empty-state">' + msg + '</div>';
    gridItemsEl.innerHTML = '<div class="empty-state">' + msg + '</div>';
    gridCountEl.textContent = '';
  }

  // Applies the admin-set order (from admin.html, via PHOTO_ORDER_DOC_REF)
  // on top of buildCategoriesFromTree's default alphabetical categories —
  // any category/photo with no explicit position keeps its existing
  // (alphabetical) place, via a stable sort. cats[0] is always the
  // synthetic "All" aggregate; it's rebuilt from the real categories'
  // new order afterward rather than reordered itself.
  function applyPhotoOrderOverride(cats, orderData) {
    const catOrder = Array.isArray(orderData.categoryOrder) ? orderData.categoryOrder : [];
    const photoOrder = (orderData.photoOrder && typeof orderData.photoOrder === 'object') ? orderData.photoOrder : {};
    const real = cats.slice(1);

    real.sort((a, b) => {
      const ia = catOrder.indexOf(a.name);
      const ib = catOrder.indexOf(b.name);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return 0;
    });

    real.forEach((cat) => {
      const order = photoOrder[cat.name];
      if (!Array.isArray(order) || !order.length) return;
      cat.photos.sort((a, b) => {
        const ia = order.indexOf(a.filename);
        const ib = order.indexOf(b.filename);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
        return 0;
      });
    });

    const all = [];
    real.forEach((c) => all.push(...c.photos));
    cats[0].photos = all;
    cats.splice(0, cats.length, cats[0], ...real);
  }

  let rawTree = null;
  let photoOrderData = null;
  // True once the Firestore order listener has reported at least once
  // (found a saved order, found none, hit an error, or was never available
  // to begin with) — i.e. once we actually know what the "real" first
  // photo is, rather than just whatever the GitHub tree's default
  // alphabetical order happens to put first.
  let orderDataReady = false;
  let hasShownInitialPhoto = false;

  // Re-run whenever either the GitHub tree or the admin's saved order
  // changes (both arrive independently and asynchronously). Only picks an
  // initial photo once orderDataReady — landing on the GitHub tree's
  // alphabetically-first photo just because it happened to resolve before
  // Firestore did would leave a fresh visit stuck showing a photo that's
  // no longer actually first once the real saved order comes in a moment
  // later. Once the initial photo IS chosen, later reorders (a visitor
  // mid-browse while the admin changes the order) re-sort the chin/grid
  // under them without yanking their current photo out from under them.
  function applyOrderAndRender() {
    if (!rawTree) return;
    categories = buildCategoriesFromTree(rawTree);
    if (photoOrderData) applyPhotoOrderOverride(categories, photoOrderData);

    const totalPhotos = categories.length ? categories[0].photos.length : 0;
    if (!totalPhotos) {
      showFatalMessage('No photos yet — add some to the /photos folder on GitHub to see them here.');
      return;
    }
    if (!categories.some((c) => c.name === activeCategory)) activeCategory = 'All';

    renderChin();
    renderGrid();
    if (!hasShownInitialPhoto && orderDataReady) {
      hasShownInitialPhoto = true;
      selectPhoto(categories[0].photos[0]);
    }
  }

  if (PHOTO_ORDER_DOC_REF) {
    PHOTO_ORDER_DOC_REF.onSnapshot(function (doc) {
      photoOrderData = doc.exists ? doc.data() : null;
      orderDataReady = true;
      applyOrderAndRender();
    }, function (err) {
      console.error('Photo order listener failed:', err);
      orderDataReady = true; // don't block the initial photo forever over this
      applyOrderAndRender();
    });
  } else {
    orderDataReady = true; // Firebase never loaded — no override possible either way
  }

  fetch(TREE_API)
    .then((res) => {
      if (!res.ok) throw new Error('GitHub API returned ' + res.status);
      return res.json();
    })
    .then((data) => {
      rawTree = data.tree || [];
      applyOrderAndRender();
    })
    .catch((err) => {
      console.error(err);
      showFatalMessage("Couldn't load photos right now (GitHub may be rate-limiting). Try reloading in a bit.");
    });
})();
</script>

<!-- ---------- MAGNIFY / LIGHTBOX ----------
     Opens the current photo in a full-viewport overlay drawn in-page —
     no native browser Fullscreen API, so it reads as the photo zooming
     up rather than the browser itself going fullscreen. Zoom/pan is
     hand-rolled: wheel + pinch (two-finger) to zoom, drag to pan once
     zoomed, double click/tap to toggle a 2.5x zoom centered on the
     pointer. -->
<script>
(function () {
  const magnifyBtn = document.getElementById('magnifyBtn');
  const lightbox = document.getElementById('lightbox');
  const stage = document.getElementById('lightboxStage');
  const img = document.getElementById('lightboxImg');
  const hint = document.getElementById('lightboxHint');
  const closeBtn = document.getElementById('lightboxClose');
  const zoomInBtn = document.getElementById('lightboxZoomIn');
  const zoomOutBtn = document.getElementById('lightboxZoomOut');

  const MIN_SCALE = 1;
  const MAX_SCALE = 5;
  let scale = 1, tx = 0, ty = 0;
  let hintTimer = null;

  function applyTransform() {
    img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
    stage.style.cursor = scale > 1 ? 'zoom-out' : 'zoom-in';
  }

  function clampPan() {
    // Keep the image from being dragged entirely off-stage: bound the
    // translation by how much bigger than the stage the scaled image is.
    const stageRect = stage.getBoundingClientRect();
    const rect = img.getBoundingClientRect();
    const overX = Math.max(0, (rect.width - stageRect.width) / 2);
    const overY = Math.max(0, (rect.height - stageRect.height) / 2);
    tx = Math.min(overX, Math.max(-overX, tx));
    ty = Math.min(overY, Math.max(-overY, ty));
  }

  function setScale(next, originX, originY) {
    next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
    if (originX != null) {
      // Zoom around the pointer/pinch-midpoint rather than the image center.
      const rect = stage.getBoundingClientRect();
      const px = originX - rect.left - rect.width / 2 - tx;
      const py = originY - rect.top - rect.height / 2 - ty;
      const ratio = next / scale;
      tx -= px * (ratio - 1);
      ty -= py * (ratio - 1);
    }
    scale = next;
    if (scale === MIN_SCALE) { tx = 0; ty = 0; }
    clampPan();
    applyTransform();
  }

  function resetZoom() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  }

  function openLightbox() {
    // Direct-child combinator matters here: the loading bar's own <img>
    // (the gif) is nested a level deeper inside #photoLoadingBar, while
    // the actual photo is appended straight into #photoStage — a plain
    // descendant selector would match the loading gif first (it's
    // earlier in the DOM) and zoom that instead of the photo.
    const current = document.querySelector('#photoStage > img');
    if (!current || !current.src) return;
    img.src = current.src;
    img.alt = current.alt || '';
    resetZoom();
    lightbox.hidden = false;
    notifyParent('knobsock-lightbox-open');
    document.addEventListener('keydown', handleKeydown);
    clearTimeout(hintTimer);
    hint.style.opacity = '1';
    hintTimer = setTimeout(function () { hint.style.opacity = '0'; }, 2600);
  }

  function closeLightbox() {
    lightbox.hidden = true;
    img.src = '';
    notifyParent('knobsock-lightbox-close');
    document.removeEventListener('keydown', handleKeydown);
  }

  // The lightbox is `position: fixed`, but fixed positioning inside an
  // iframe is relative to the IFRAME's own box, not the browser window —
  // and photos.html sizes that box to the pane's natural content height,
  // not the full viewport. Without this, the lightbox just gets clipped
  // to that short box instead of covering the screen. So on open/close we
  // ask the host page to size the iframe itself to the full viewport (see
  // the matching listener in photos.html), then hand sizing back.
  function notifyParent(type) {
    try {
      parent.postMessage({ type: type }, window.location.origin);
    } catch (err) { /* embedded cross-origin — nothing to tell */ }
  }

  function handleKeydown(e) {
    if (e.key === 'Escape' || e.key === 'Esc') closeLightbox();
  }

  magnifyBtn.addEventListener('click', openLightbox);
  // Clicking the photo itself (not the loading gif, which sits nested a
  // level deeper — see the direct-child selector in openLightbox above)
  // opens the same fullscreen view as the magnify button, so you don't
  // have to aim for that small corner button.
  document.getElementById('photoStage').addEventListener('click', function (e) {
    if (e.target.matches('#photoStage > img')) openLightbox();
  });
  closeBtn.addEventListener('click', closeLightbox);
  zoomInBtn.addEventListener('click', function () { setScale(scale + 1); });
  zoomOutBtn.addEventListener('click', function () { setScale(scale - 1); });

  // ---- Wheel zoom (desktop) ----
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    const delta = -e.deltaY * 0.0025;
    setScale(scale * (1 + delta), e.clientX, e.clientY);
  }, { passive: false });

  // ---- Double-click / double-tap to toggle zoom ----
  let lastTapTime = 0;
  function toggleZoomAt(x, y) {
    if (scale > 1) setScale(1);
    else setScale(2.5, x, y);
  }
  stage.addEventListener('dblclick', function (e) { toggleZoomAt(e.clientX, e.clientY); });

  // ---- Pointer-based drag-to-pan + pinch-to-zoom ----
  const pointers = new Map();
  let dragging = false;
  let dragStart = null;
  let pinchStartDist = null;
  let pinchStartScale = 1;

  function pinchMidpoint() {
    const pts = Array.from(pointers.values());
    return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  }
  function pinchDistance() {
    const pts = Array.from(pointers.values());
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }

  stage.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stage.setPointerCapture(e.pointerId);

    if (pointers.size === 1) {
      const now = Date.now();
      if (now - lastTapTime < 300) { toggleZoomAt(e.clientX, e.clientY); }
      lastTapTime = now;
      if (scale > 1) {
        dragging = true;
        dragStart = { x: e.clientX - tx, y: e.clientY - ty };
        stage.classList.add('dragging');
      }
    } else if (pointers.size === 2) {
      dragging = false;
      stage.classList.remove('dragging');
      pinchStartDist = pinchDistance();
      pinchStartScale = scale;
    }
  });

  stage.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2 && pinchStartDist) {
      const mid = pinchMidpoint();
      const ratio = pinchDistance() / pinchStartDist;
      setScale(pinchStartScale * ratio, mid.x, mid.y);
    } else if (dragging && pointers.size === 1) {
      tx = e.clientX - dragStart.x;
      ty = e.clientY - dragStart.y;
      clampPan();
      applyTransform();
    }
  });

  function releasePointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = null;
    if (pointers.size === 0) { dragging = false; stage.classList.remove('dragging'); }
  }
  stage.addEventListener('pointerup', releasePointer);
  stage.addEventListener('pointercancel', releasePointer);
})();
</script>
