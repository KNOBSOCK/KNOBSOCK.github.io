<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forums Button</title>
<style>
  html, body { cursor: url("/cursor-hamburger.png?v=2") 24 17, auto; }
  a, button { cursor: url("/cursor-hamburger.png?v=2") 24 17, pointer; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  a { color: inherit; display: block; text-decoration: none; }
  .button-item { position: relative; width: 80%; height: 80%; }
  .button-float { width: 100%; height: 100%; animation: floatY 3.6s ease-in-out infinite; animation-delay: -0.9s; }
  @keyframes floatY { 0%, 100% { transform: translateY(-3%); } 50% { transform: translateY(3%); } }
  .button-pop { position: relative; width: 100%; height: 100%; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .button-item:hover .button-pop { transform: scale(1.2) rotate(-3deg); }
  .btn-base { display: block; width: 100%; height: 100%; object-fit: contain; }
  .btn-icon-wrap { position: absolute; top: 30%; left: 50%; width: 70%; height: 56%; display: flex; align-items: center; justify-content: center; pointer-events: none; transform: translateX(-50%); }
  .btn-icon { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
  @keyframes iconExcited { 0%, 100% { transform: scale(1) rotate(0deg); } 20% { transform: scale(1.08) rotate(-4deg); } 40% { transform: scale(0.96) rotate(3deg); } 60% { transform: scale(1.06) rotate(-3deg); } 80% { transform: scale(0.98) rotate(2deg); } }
  .button-item:hover .btn-icon { animation: iconExcited 0.35s ease-in-out infinite; }
</style>
</head>
<body>
  <a class="button-item" href="/forums" target="_top">
    <div class="button-float"><div class="button-pop">
      <img class="btn-base" src="/forums-button.png" width="1044" height="1509" alt="Forums">
      <div class="btn-icon-wrap"><img class="btn-icon" src="/forums-button-icon.gif" alt=""></div>
    </div></div>
  </a>
<script>
  if (window.parent !== window) document.addEventListener('mousemove', function (event) {
    window.parent.postMessage({ type: 'knobsock-chase-mousemove', x: event.clientX, y: event.clientY }, '*');
  }, { passive: true });
</script>
</body>
</html>
