<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Knobsock</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this file for any path it has no file for.

     That makes it the safety net for the gap between publishing a post
     and the hourly sync generating its page: the magazine reads
     WordPress live, so a brand-new article shows up in the listings
     immediately, but /article/<slug>/ doesn't exist on disk until
     .github/workflows/sync-articles.yml next runs. Without this, every
     freshly published post would 404 for up to an hour.

     So: if the path looks like an article, fetch it client-side from
     the same API the generator uses and switch over to #article-view,
     styled to match the generated page (scripts/build-articles.mjs) —
     change the two together. The visitor sees the article at its real
     URL, and once the sync runs the static file takes over and this
     page stops being involved.

     Anything else — a genuine wrong URL — stays on #notfound-view,
     themed like the site's own index page rather than the Truth Zone,
     since most 404s have nothing to do with an article. Note this page
     is still served with a 404 status, so it renders for people but
     won't be indexed. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    background: #000;
  }
  html, body {
    color-scheme: dark;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* ---------- NOT FOUND (default) ---------- */
  /* Themed like index.html: same tiled repeating background and the
     same site header logo, rather than the Truth Zone's video/blue-card
     look. The background lives on this container (not body) so it
     can't interfere with #article-view's own fixed bg-video below —
     see that section's comment for why body itself never gets an
     opaque background on this page. */
  #notfound-view {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000 url("https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/IMG_0661.GIF") repeat;
  }
  #notfound-view[hidden] { display: none; }

  .site-header { display: flex; justify-content: center; align-items: center; padding: 20px 0; }
  .site-header img { display: block; max-height: 90px; max-width: 100%; width: auto; height: auto; }

  .notfound-image-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px clamp(16px, 4vw, 40px) clamp(24px, 5vw, 56px);
  }
  .notfound-image-wrap img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(100%, 1100px);
    max-height: 100%;
  }

  /* ---------- ARTICLE FALLBACK (hidden unless a fetch succeeds) ---------- */
  /* Styles below are a copy of the generator's template
     (scripts/build-articles.mjs) so the two render identically; change
     them together.
     The fallback color goes on html ONLY, never on body — see the note
     at the top of this file. An opaque body background paints OVER the
     fixed video behind it: a z-index:-1 element paints beneath
     block-level backgrounds, so body's own background would hide the
     video everywhere except the strip below body's box, where its
     collapsed bottom margin left a gap. html's background is propagated
     to the canvas instead, which paints under everything — and
     #notfound-view above only ever paints its OWN box, never body's, so
     it can't cause that same problem while sitting hidden underneath. */
  #article-view[hidden] { display: none; }
  .bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
  #article-view h1, #article-view h2, #article-view h3 { color: yellow; }

  .page-wrapper {
    width: calc(100% - 24px);
    max-width: 820px;
    margin: 0 auto 40px;
    padding: 28px clamp(18px, 5vw, 44px) 40px;
    background: rgba(0, 19, 156, 0.5);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-radius: 28px;
  }

  .back-link { display: inline-block; margin-bottom: 24px; color: #fff; font-size: 14px; opacity: 0.85; }
  .back-link:hover { opacity: 1; }

  .cat-tag {
    display: inline-block;
    background: #333;
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .article-header {
    padding-bottom: 24px;
    margin-bottom: 28px;
    border-bottom: 2px solid rgba(255, 80, 80, 0.45);
  }
  .article-header h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 12px; line-height: 1.15; }
  .meta { color: #fff; font-size: 14px; opacity: 0.75; }

  .article-hero {
    padding-bottom: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid rgba(255, 80, 80, 0.3);
  }
  .article-hero img { width: 100%; height: auto; border-radius: 12px; display: block; }
  .photo-credit { color: #fff; font-size: 11px; opacity: 0.6; letter-spacing: 0.2px; margin-top: 6px; }

  .body-content { font-size: 17px; line-height: 1.8; color: #fff; }
  .body-content p { margin-bottom: 20px; }
  .body-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; display: block; }
  .body-content h2, .body-content h3 { margin: 28px 0 12px; line-height: 1.3; }
  .body-content iframe { max-width: 100%; }

  .share-bar {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .share-bar span.label { font-size: 14px; color: #fff; }
  .share-bar button {
    background: #fff;
    color: #111;
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .share-bar button:hover { background: #ddd; }
  .share-bar .copied-msg { font-size: 13px; color: #4ade80; display: none; }

  .bottom-actions {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .wp-link { color: #fff; font-size: 14px; }
  .back-btn {
    display: inline-block;
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 14px;
  }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
</style></head>
<body>
  <div id="notfound-view">
    <header class="site-header">
      <a href="/">
        <img src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/knobsock-main.PNG" alt="Knobsock">
      </a>
    </header>
    <div class="notfound-image-wrap">
      <img src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/404-error.png" alt="Error 404: the page you are looking for does not exist. Type it in correctly next time.">
    </div>
  </div>

  <div id="article-view" hidden>
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="https://onuniverse-assets.imgix.net/487354D6-DD76-4A92-9846-20C085F6252C.mp4" type="video/mp4">
    </video>
    <header class="site-header">
      <a href="/">
        <img src="https://raw.githubusercontent.com/KNOBSOCK/KNOBSOCK.github.io/refs/heads/main/SIX_23C00EE8-DE7A-43B0-AE17-4BDA7C3DA392.png" alt="Knobsock">
      </a>
    </header>

    <div class="page-wrapper">
      <a class="back-link" href="/truth/">&larr; Back to Knobsock</a>
      <main id="article-wrap"></main>
    </div>
  </div>

<script>
  const SITE = "knobsock4.wordpress.com";
  const API_BASE = "https://public-api.wordpress.com/rest/v1.1/sites/" + SITE;
  const NO_IMAGE_PLACEHOLDER = "data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27900%27%20height=%27500%27%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20fill=%27%23222%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20fill=%27%2339ff14%27%20font-family=%27sans-serif%27%20font-size=%2728%27%20text-anchor=%27middle%27%20dominant-baseline=%27middle%27%3ENo%20Image%3C/text%3E%3C/svg%3E";

  const notfoundView = document.getElementById("notfound-view");
  const articleView = document.getElementById("article-view");
  const wrap = document.getElementById("article-wrap");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toText(html) {
    const d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").trim();
  }
  function getCategoryName(post) {
    const cats = post.categories;
    if (!cats) return "";
    const first = Object.keys(cats)[0];
    return first ? cats[first].name : "";
  }

  function showArticleView() {
    notfoundView.hidden = true;
    articleView.hidden = false;
  }

  // Matches /article/<slug>/ and /article/<slug>, and keeps working if
  // the prefix later becomes /truth/article/ — it anchors on the
  // "article" segment rather than the start of the path.
  function slugFromPath() {
    const m = window.location.pathname.match(/\/article\/([^\/]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  async function load() {
    const slug = slugFromPath();
    // No article-shaped path: this is a genuine 404, so #notfound-view
    // (already showing by default) is the whole story — no need to hit
    // the WordPress API at all.
    if (!slug) return;

    let post;
    try {
      const res = await fetch(API_BASE + "/posts/slug:" + encodeURIComponent(slug));
      post = await res.json();
    } catch (e) {
      return; // Can't confirm the article exists — stay on #notfound-view.
    }
    if (!post || post.error) return;

    const title = toText(post.title) || "Untitled";
    const image = post.featured_image || NO_IMAGE_PLACEHOLDER;
    const credit = toText(post.excerpt || "");
    const author = (post.author && post.author.name) || "";
    const category = getCategoryName(post);

    document.title = title + " — Knobsock";

    wrap.innerHTML =
      '<div class="article-header">' +
        (category ? '<span class="cat-tag">' + esc(category) + '</span>' : '') +
        '<h1>' + esc(title) + '</h1>' +
        '<div class="meta">' + (author ? 'By ' + esc(author) + ' &middot; ' : '') +
          esc(new Date(post.date).toLocaleDateString()) + '</div>' +
      '</div>' +
      '<div class="article-hero">' +
        '<img src="' + esc(image) + '" alt="">' +
        (credit ? '<div class="photo-credit">' + esc(credit) + '</div>' : '') +
      '</div>' +
      '<div class="body-content">' + (post.content || "") + '</div>' +
      '<div class="share-bar">' +
        '<span class="label">Share this article:</span>' +
        '<button id="copy-link-btn">Copy Link</button>' +
        '<span class="copied-msg" id="copied-msg">Link copied!</span>' +
      '</div>' +
      '<div class="bottom-actions">' +
        '<a href="' + esc(post.URL || "#") + '" target="_blank" rel="noopener" class="wp-link">View original post &rarr;</a>' +
        '<a class="back-btn" href="/truth/">&larr; Back to Knobsock</a>' +
      '</div>';

    showArticleView();

    document.getElementById("copy-link-btn").addEventListener("click", function () {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(function () {
        const msg = document.getElementById("copied-msg");
        msg.style.display = "inline";
        setTimeout(function () { msg.style.display = "none"; }, 2000);
      }).catch(function () {
        alert("Couldn't copy automatically — link: " + url);
      });
    });
  }

  load();
</script>
<div style="text-align:center;padding:8px 0 6px;"><a href="/privacy" style="text-decoration:underline;color:#fff;font-size:9px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:rgba(0,0,0,0.55);padding:2px 7px;border-radius:7px;">Privacy Policy &amp; User Agreement</a></div>
</body>
</html>
