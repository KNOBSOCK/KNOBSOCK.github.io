<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News Player</title>
<style>
  /* Sits inside the "patty slot" cut into videos/hamburgernews.html's
     illustrated background (hamburger-news-bg.webp) — that page sizes
     and positions this iframe's box to land exactly in the transparent
     hole drawn into that artwork, scaling/repositioning together with
     it (contain-fit, never cropped) on resize, so nothing here needs to
     know about the surrounding burger art at all — it only ever fills
     its own rectangular box, same contract as every other embedded
     widget on this site. Mustard/ketchup accent instead of this site's
     usual per-page palette (blue Videos, gold Music, red Live) — this
     page earns its own condiment-colored identity. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Tahoma, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    /* Crops the iframe's own oversized edges below — see that rule's
       own comment for why. */
    overflow: hidden;
  }

  .stage iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Oversized 10% past the stage's own edges on all sides (a plain
       CSS overscan, not video-mini-player-widget.html's JS-driven
       sizePlayerToCover — that one has to handle an ARBITRARY box shape
       on mobile; this box is always exactly 16:9, guaranteed by
       videos/hamburgernews.html's own .patty-slot, so scaling both
       dimensions by the same factor never distorts the video, it just
       pushes a uniform margin of the iframe's own edges — where YouTube
       anchors its own hover chrome (the title bar up top, the "more
       videos" tray/logo at bottom-right) — out past .stage's
       overflow:hidden. Confirmed needed: without this, that chrome
       visibly showed through on hover despite controls:0. */
    width: 110%;
    height: 110%;
    border: 0;
    /* Blocks clicks reaching the embed itself — same reasoning as
       video-mini-player-widget.html's identical rule: with no way to
       interact with the raw player, YouTube's own center play/pause
       flash and hover branding never get a click to react to, so they
       never appear. Every real control here is a separate element on
       top, unaffected by this. */
    pointer-events: none;
  }

  /* Covers the stage before the first video is ready and again while
     switching episodes, so a stale frame never shows mid-switch — same
     pattern as every other player on this site. */
  .stage-loading {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: #000;
  }
  .stage-loading[hidden] { display: none; }
  .gif-loader { width: min(70px, 25%); height: auto; opacity: 0.4; }

  /* Empty state — no videos saved yet in admin.html's Hamburger News
     list. Reuses the same dark stage rather than trying to draw its
     own placeholder patty; the real bun art around this box already
     carries the theming. */
  .empty-state {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #ffd479;
    font-weight: 700;
    font-size: clamp(13px, 4cqw, 18px);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  .empty-state[hidden] { display: none; }

  /* Bottom overlay bar — a scrub bar over a row of mute/play/next
     buttons. Fades in on hover (desktop) or tap (touch), same auto-hide
     idiom used by video-mini-player-widget.html and livestream-chat-
     widget.html's own video controls, so a control never sits
     permanently over the video once you've stopped interacting with it. */
  .controls-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
    background: linear-gradient(to top, rgba(20, 8, 0, 0.85), rgba(20, 8, 0, 0));
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .stage.controls-visible .controls-bar { opacity: 1; }

  .buttons-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Polls playback position rather than relying on a player event — the
     YouTube IFrame API has no "time update" event, just onStateChange
     (see updateScrubber in the JS). A generous invisible hit area
     (this whole 14px-tall element) wraps the thin visible track below
     it, so it's easy to tap accurately on a phone without the bar
     itself looking oversized — same idiom video-mini-player-
     widget.html's own scrubber uses. */
  .scrubber {
    flex: none;
    display: flex;
    align-items: center;
    height: 14px;
    cursor: pointer;
  }
  .scrubber-track {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.25);
    overflow: hidden;
  }
  .scrubber-fill {
    width: 0%;
    height: 100%;
    background: #ffb400;
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    width: clamp(28px, 9cqw, 36px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 1px solid rgba(255, 210, 130, 0.6);
    background: #c1440e;
    color: #fff;
    font-size: clamp(12px, 4cqw, 15px);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .round-btn:hover { background: #e0590f; }
  .round-btn:active { background: #a3390b; }
  /* Without this, the [hidden] attribute (set via JS on nextBtn and
     pickerToggleBtn — see renderNowPlaying/updatePickerToggleVisibility)
     does nothing on a .round-btn: the browser's own [hidden]{display:
     none} rule lives in the UA stylesheet, and an author-origin rule
     always wins a tie against UA origin regardless of specificity — so
     .round-btn's own display:flex above was silently overriding it,
     leaving a "hidden" button fully visible and clickable the moment
     anything else (its own opacity fade included) made it look right
     by coincidence. Matching .round-btn[hidden] specifically overrides
     that override. */
  .round-btn[hidden] { display: none; }

  /* Fallback for browsers (iOS Safari) that don't support the real
     Fullscreen API on non-video elements — simulate it with CSS, same
     pattern as live.html's own fullscreen button (there, the analogous
     element is livestream-chat-widget.html's .video-pane; here it's
     this whole .stage, since the stage IS the entire player).
     This class alone only ever covers THIS document's own viewport —
     which, since this page always lives inside videos/hamburgernews.
     html's iframe, is just the iframe's own box, not the real phone
     screen. The postMessage alongside it (see enterPseudoFullscreen/
     exitPseudoFullscreen below) is what actually gets the real screen:
     it asks that parent page to resize the iframe ELEMENT itself, which
     this class's 100%-sized .stage then naturally fills too. */
  .stage.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }

  .now-playing-title {
    flex: 1 1 auto;
    min-width: 0;
    color: #ffd479;
    font-weight: 700;
    font-size: clamp(11px, 3.2cqw, 14px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  /* Only rendered at all once there's more than one video (see
     renderControls) — a Next button with nothing to advance to would
     just be a dead button. */
  .next-btn-label {
    font-size: clamp(9px, 2.6cqw, 11px);
    font-weight: 700;
  }

  /* ---------- VIDEO PICKER DRAWER ----------
     Jump straight to any saved video, not just step through them one at
     a time via Next — built right into the stage itself, same as
     everything else here, so it reads as part of the burger rather than
     a bolted-on page element. Takes over the whole stage when open
     (inset:0, same as .picker-panel itself) and slides down from the
     top via a single transform, rather than growing up from the bottom
     into a capped-height strip like the first version of this did —
     simpler than that version's layered max-height + translateY combo
     needed to be, since there's no longer a "partial reveal" height to
     animate open, just the one property. translateZ(0) plus a forced
     reflow on close (see the JS) still guard against the exact stale-
     compositor-tile bug that turned up on live.html's tap-in streak bar
     on mobile Safari — cheap insurance, same "frequently toggled
     overlay on a mobile-heavy page" shape of element.
     Horizontal scroll below a rough phone/desktop threshold, vertical
     above it — not just a stylistic flourish: a horizontal strip reads
     as a natural thumb-swipe on a phone, while a vertical list uses a
     wide desktop window's own taller-than-wide video area better. The
     threshold is checked against THIS IFRAME's own rendered width (set
     by videos/hamburgernews.html's .burger-stack, capped at 780px), not
     the phone's raw screen width — which already lines up correctly:
     a phone's ~92vw-wide burger-stack keeps this well under the
     threshold, a desktop's 780px-capped one clears it. */
  .picker-panel {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }
  .picker-drawer {
    pointer-events: auto;
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: rgba(20, 8, 0, 0.96);
    transform: translateY(-100%) translateZ(0);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .picker-panel.open .picker-drawer {
    transform: translateY(0) translateZ(0);
  }
  .picker-drawer-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 10px 6px;
  }
  .picker-drawer-title {
    color: #ffd479;
    font-weight: 700;
    font-size: clamp(12px, 3.4cqw, 15px);
  }
  .picker-list {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: 8px;
    padding: 0 10px 10px;
    /* Mobile default: horizontal strip, vertically centered in the now
       full-height drawer instead of sitting flush against its top. */
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
  }
  @media (min-width: 640px) {
    .picker-list {
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
      overflow-y: auto;
    }
  }
  .picker-item {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    width: clamp(140px, 40cqw, 180px);
    border: 1px solid transparent;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    padding: 6px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  @media (min-width: 640px) {
    .picker-item { width: 100%; }
  }
  .picker-item:hover { background: rgba(255, 255, 255, 0.12); }
  .picker-item.active { border-color: #ffb400; background: rgba(255, 180, 0, 0.18); }
  .picker-thumb {
    flex: none;
    width: 64px;
    aspect-ratio: 16 / 9;
    border-radius: 4px;
    object-fit: cover;
    background: #000;
  }
  .picker-title {
    min-width: 0;
    color: #ffd479;
    font-size: 12px;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  /* Hamburger-menu glyph doubling as the Hamburger News video picker's
     own icon — top-right of the stage now rather than inside the
     bottom button row, since opening it takes over the whole player
     instead of sharing space down there. Fades with the same
     .controls-visible group as everything else (hover on desktop, tap
     on touch), and is hidden outright (see the JS) while the drawer's
     actually open — .picker-close-btn inside the drawer itself takes
     over as the dismiss control at that point, rather than this same
     button trying to do double duty as both opener and closer. */
  .picker-toggle-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 7;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .stage.controls-visible .picker-toggle-btn { opacity: 1; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div id="ytPlayer"></div>
  <div class="stage-loading" id="stageLoading">
    <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
  </div>
  <div class="empty-state" id="emptyState" hidden>No Hamburger News yet — check back soon!</div>
  <div class="picker-panel" id="pickerPanel">
    <div class="picker-drawer" id="pickerDrawer">
      <div class="picker-drawer-head">
        <span class="picker-drawer-title">Pick a video</span>
        <button type="button" class="round-btn" id="pickerCloseBtn" title="Close">&#10005;</button>
      </div>
      <div class="picker-list" id="pickerList"></div>
    </div>
  </div>
  <button type="button" class="round-btn picker-toggle-btn" id="pickerToggleBtn" title="Pick a video" hidden><span class="picker-toggle-label">&#9776;</span></button>
  <div class="controls-bar" id="controlsBar" hidden>
    <div class="scrubber" id="scrubber">
      <div class="scrubber-track">
        <div class="scrubber-fill" id="scrubberFill"></div>
      </div>
    </div>
    <div class="buttons-row">
      <button type="button" class="round-btn" id="muteBtn" title="Unmute"><svg class="mute-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-.77-3.29-2-4.31v2.6l2 2c0-.1 0-.19 0-.29zm2.5 0c0 .91-.19 1.77-.51 2.55l1.47 1.47C20.63 14.86 21 13.48 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H4v6h4l5 5v-6.73l4.25 4.25c-.67.53-1.42.94-2.25 1.19v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg></button>
      <button type="button" class="round-btn" id="playBtn" title="Pause">&#10074;&#10074;</button>
      <div class="now-playing-title" id="nowPlayingTitle"></div>
      <button type="button" class="round-btn" id="nextBtn" title="Next episode" hidden><span class="next-btn-label">&#9654;&#9654;</span></button>
      <button type="button" class="round-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
    </div>
  </div>
</div>

<!-- ============================================================
     FIREBASE — same project as every other widget on this site.
     Read-only: whatever's saved through admin.html's Hamburger News
     section (its own playlist/hamburgerNews doc, separate from the
     main Video List's playlist/main) shows up here live.
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const HAMBURGER_NEWS_DOC_REF = db.collection('playlist').doc('hamburgerNews');

  function extractVideoId(input) {
    if (!input) return null;
    const trimmed = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
    const m = trimmed.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const stageEl = document.getElementById('stage');
  const stageLoadingEl = document.getElementById('stageLoading');
  const emptyStateEl = document.getElementById('emptyState');
  const controlsBarEl = document.getElementById('controlsBar');
  const muteBtn = document.getElementById('muteBtn');
  const playBtn = document.getElementById('playBtn');
  const nextBtn = document.getElementById('nextBtn');
  const nowPlayingTitleEl = document.getElementById('nowPlayingTitle');
  const pickerPanelEl = document.getElementById('pickerPanel');
  const pickerDrawerEl = document.getElementById('pickerDrawer');
  const pickerListEl = document.getElementById('pickerList');
  const pickerToggleBtn = document.getElementById('pickerToggleBtn');
  const pickerCloseBtn = document.getElementById('pickerCloseBtn');
  const scrubberEl = document.getElementById('scrubber');
  const scrubberFillEl = document.getElementById('scrubberFill');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let videos = [];       // [{id, title}]
  let activeIndex = 0;
  let hasLoadedInitialVideo = false;
  let pickerOpen = false;

  function showLoading() { stageLoadingEl.hidden = false; }
  function hideLoading() { stageLoadingEl.hidden = true; }

  // ---------- Auto-hiding controls (same idiom as video-mini-player-
  // widget.html/livestream-chat-widget.html: hover keeps them up on a
  // real mouse, a tap reveals them on touch and auto-hides again, and a
  // second tap anywhere else on the stage dismisses them early). ----------
  const CONTROLS_AUTO_HIDE_MS = 3000;
  const supportsHover = window.matchMedia('(hover: hover)').matches;
  let hideTimer = null;
  function showControls(autoHide) {
    if (!videos.length) return; // nothing to control in the empty state
    controlsBarEl.hidden = false;
    stageEl.classList.add('controls-visible');
    clearTimeout(hideTimer);
    if (autoHide) hideTimer = setTimeout(() => stageEl.classList.remove('controls-visible'), CONTROLS_AUTO_HIDE_MS);
  }
  function hideControlsNow() {
    clearTimeout(hideTimer);
    stageEl.classList.remove('controls-visible');
  }
  if (supportsHover) {
    stageEl.addEventListener('mouseenter', () => showControls(false));
    stageEl.addEventListener('mouseleave', () => hideControlsNow());
  } else {
    stageEl.addEventListener('touchstart', (e) => {
      if (e.target.closest('.controls-bar, .picker-panel, .picker-toggle-btn')) { showControls(true); return; }
      if (stageEl.classList.contains('controls-visible')) hideControlsNow();
      else showControls(true);
    }, { passive: true });
  }

  // ---------- YouTube IFrame Player API ----------
  let ytPlayer = null;
  let ytApiReady = false;
  let playerReady = false;
  let pendingVideoId = null;

  // Plain SVG glyphs (not emoji — a system emoji font renders wildly
  // differently across platforms/browsers, whereas this always draws
  // exactly the same way, in the button's own currentColor). Same
  // "volume" icon shape most players use: unmuted draws the speaker
  // with sound waves, muted draws it with an X instead.
  const MUTE_ICON_UNMUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34zM14 4.45v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4-.91 7-4.49 7-8.77s-3-7.86-7-8.77z"/></svg>';
  const MUTE_ICON_MUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-.77-3.29-2-4.31v2.6l2 2c0-.1 0-.19 0-.29zm2.5 0c0 .91-.19 1.77-.51 2.55l1.47 1.47C20.63 14.86 21 13.48 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H4v6h4l5 5v-6.73l4.25 4.25c-.67.53-1.42.94-2.25 1.19v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>';

  function updateMuteBtn() {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    const muted = ytPlayer.isMuted();
    muteBtn.innerHTML = muted ? MUTE_ICON_MUTED : MUTE_ICON_UNMUTED;
    muteBtn.title = muted ? 'Unmute' : 'Mute';
  }
  function updatePlayBtn(isPlaying) {
    playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
    playBtn.title = isPlaying ? 'Pause' : 'Play';
  }

  function renderNowPlaying() {
    const v = videos[activeIndex];
    nowPlayingTitleEl.textContent = v ? (v.title || 'Untitled') : '';
    nextBtn.hidden = videos.length < 2;
    updatePickerToggleVisibility();
    pickerListEl.querySelectorAll('.picker-item').forEach((el) => {
      el.classList.toggle('active', parseInt(el.dataset.index, 10) === activeIndex);
    });
  }

  // Nothing to pick between with 0 or 1 video, and hidden outright
  // while the drawer's already open (see togglePicker) — the close
  // button inside the drawer is the only dismiss control at that point.
  function updatePickerToggleVisibility() {
    pickerToggleBtn.hidden = videos.length < 2 || pickerOpen;
  }

  // ---------- VIDEO PICKER DRAWER ----------
  function renderPickerList() {
    pickerListEl.innerHTML = videos.map((v, i) => `
      <button type="button" class="picker-item${i === activeIndex ? ' active' : ''}" data-index="${i}">
        <img class="picker-thumb" src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
        <span class="picker-title">${escapeHtml(v.title)}</span>
      </button>
    `).join('');
  }

  function togglePicker(open) {
    pickerOpen = open;
    pickerPanelEl.classList.toggle('open', open);
    updatePickerToggleVisibility();
    if (open) {
      showControls(false); // stays up alongside the open drawer, no auto-hide fighting it
    } else {
      // Forces a synchronous repaint right as the drawer starts closing
      // — same fix, same reasoning, as live.html's tap-in streak bar
      // (see .picker-drawer's own comment): mobile Safari can otherwise
      // leave a stale painted sliver of the drawer's own border on
      // screen even once its real geometry is back to 0.
      void pickerDrawerEl.offsetHeight;
      showControls(true);
    }
  }

  pickerToggleBtn.addEventListener('click', () => togglePicker(true));
  pickerCloseBtn.addEventListener('click', () => togglePicker(false));

  pickerListEl.addEventListener('click', (e) => {
    const item = e.target.closest('.picker-item');
    if (!item) return;
    playIndex(parseInt(item.dataset.index, 10));
    togglePicker(false);
  });

  // ---------- SCRUBBER ----------
  // Polls playback position rather than relying on a player event — the
  // IFrame API has no "time update" event, just onStateChange (used
  // elsewhere here for loading/play-pause, not for this).
  function updateScrubber() {
    if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
    const duration = ytPlayer.getDuration();
    if (!duration) return;
    const pct = Math.min(100, Math.max(0, (ytPlayer.getCurrentTime() / duration) * 100));
    scrubberFillEl.style.width = pct + '%';
  }
  setInterval(updateScrubber, 250);

  scrubberEl.addEventListener('click', (e) => {
    showControls(true);
    if (!ytPlayer || !playerReady || typeof ytPlayer.getDuration !== 'function') return;
    const duration = ytPlayer.getDuration();
    if (!duration) return;
    const rect = scrubberEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    ytPlayer.seekTo(fraction * duration, true);
    scrubberFillEl.style.width = (fraction * 100) + '%';
  });

  function playIndex(index) {
    if (!videos.length) return;
    activeIndex = ((index % videos.length) + videos.length) % videos.length;
    renderNowPlaying();
    scrubberFillEl.style.width = '0%'; // reset immediately — the poll above would otherwise still show the PREVIOUS video's position for a moment
    const id = videos[activeIndex].id;
    if (ytPlayer && playerReady) {
      showLoading();
      ytPlayer.loadVideoById(id);
    } else if (ytApiReady && !ytPlayer) {
      createPlayer(id);
    } else {
      pendingVideoId = id;
    }
  }

  function createPlayer(id) {
    ytPlayer = new YT.Player('ytPlayer', {
      videoId: id,
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        enablejsapi: 1,
        iv_load_policy: 3,
        cc_load_policy: 0
      },
      events: {
        onReady: function () {
          playerReady = true;
          updateMuteBtn();
          updatePlayBtn(true);
          showControls(true);
          if (pendingVideoId) {
            showLoading();
            ytPlayer.loadVideoById(pendingVideoId);
            pendingVideoId = null;
          }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) { hideLoading(); updatePlayBtn(true); }
          else if (e.data === YT.PlayerState.BUFFERING) { showLoading(); }
          else if (e.data === YT.PlayerState.PAUSED) { updatePlayBtn(false); }
          // Advances to the next episode instead of sitting on YouTube's
          // own "more videos" end screen — if there's only one video,
          // this just loops it, matching every other autoplay embed on
          // this site.
          if (e.data === YT.PlayerState.ENDED) playIndex(activeIndex + 1);
        }
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    if (pendingVideoId && !ytPlayer) {
      const id = pendingVideoId;
      pendingVideoId = null;
      createPlayer(id);
    }
  };

  muteBtn.addEventListener('click', () => {
    showControls(true);
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) { ytPlayer.unMute(); ytPlayer.setVolume(100); }
    else { ytPlayer.mute(); }
    updateMuteBtn();
  });
  playBtn.addEventListener('click', () => {
    showControls(true);
    if (!ytPlayer || !playerReady || typeof ytPlayer.getPlayerState !== 'function') return;
    if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  });
  nextBtn.addEventListener('click', () => {
    showControls(true);
    playIndex(activeIndex + 1);
  });

  // ---------- FULLSCREEN ----------
  // Same real-Fullscreen-API-with-a-CSS-fallback approach as live.html's
  // own fullscreen button (livestream-chat-widget.html) — fullscreens
  // the whole .stage (video + controls + picker drawer all live inside
  // it), not just the bare video, so every control keeps working once
  // fullscreened.
  let usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen
    );
  }

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      let result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(() => enterPseudoFullscreen());
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleFsEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function notifyParentFullscreen(active) {
    // Lets videos/hamburgernews.html resize the actual iframe element to
    // cover the real screen — see this file's .stage.pseudo-fullscreen
    // comment for why that has to happen up there instead of down here.
    try { window.parent.postMessage({ type: 'knobsock-hamburger-fullscreen', active: active }, '*'); } catch (e) {}
  }

  function enterPseudoFullscreen() {
    stageEl.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleFsEscKey);
    updateFullscreenIcon();
    notifyParentFullscreen(true);
  }

  function exitPseudoFullscreen() {
    stageEl.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleFsEscKey);
    updateFullscreenIcon();
    notifyParentFullscreen(false);
  }

  function updateFullscreenIcon() {
    fullscreenBtn.title = isFullscreen() ? 'Exit Fullscreen' : 'Fullscreen';
  }

  fullscreenBtn.addEventListener('click', () => {
    showControls(true);
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(stageEl)) requestFs(stageEl);
    else enterPseudoFullscreen();
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach((evt) => {
    document.addEventListener(evt, updateFullscreenIcon);
  });

  // ---------- LIVE SYNC FROM FIRESTORE ----------
  HAMBURGER_NEWS_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const rawList = (data && Array.isArray(data.videos)) ? data.videos : [];
    videos = rawList
      .map(v => ({ id: extractVideoId(v.url), title: (v.title && v.title.trim()) ? v.title.trim() : 'Untitled' }))
      .filter(v => v.id);
    renderPickerList();

    if (!videos.length) {
      emptyStateEl.hidden = false;
      controlsBarEl.hidden = true;
      togglePicker(false);
      hideLoading();
      return;
    }
    emptyStateEl.hidden = true;

    // Only auto-load on the very first snapshot — a later edit from
    // admin.html (reordering, adding a video) shouldn't interrupt
    // whatever's already playing here.
    if (!hasLoadedInitialVideo) {
      hasLoadedInitialVideo = true;
      showLoading();
      playIndex(0);
    } else {
      renderNowPlaying();
    }
  }, function (err) {
    console.error('Hamburger News playlist sync error:', err);
    emptyStateEl.hidden = false;
    emptyStateEl.textContent = 'Could not load videos.';
  });
})();
</script>

<!-- YouTube IFrame Player API — required for controls:0 plus custom
     mute/play/next controls to work together. -->
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
