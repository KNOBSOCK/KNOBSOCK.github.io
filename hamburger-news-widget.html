<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News Player</title>
<style>

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Tahoma, Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;

    overflow: hidden;
  }

  .stage iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 110%;
    height: 110%;
    border: 0;

    pointer-events: none;
  }

  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
  }
  .stage video::-webkit-media-controls { display: none !important; }

  .stage-loading {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: #000;
  }
  .stage-loading[hidden] { display: none; }
  .gif-loader { width: min(70px, 25%); height: auto; opacity: 0.4; }

  .empty-state {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #ffd479;
    font-weight: 700;
    font-size: clamp(13px, 4cqw, 18px);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  .empty-state[hidden] { display: none; }

  .controls-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
    background: linear-gradient(to top, rgba(20, 8, 0, 0.85), rgba(20, 8, 0, 0));
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .stage.controls-visible .controls-bar { opacity: 1; }

  .buttons-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .scrubber {
    flex: none;
    display: flex;
    align-items: center;
    height: 14px;
    cursor: pointer;
  }
  .scrubber-track {
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.25);
    overflow: hidden;
  }
  .scrubber-fill {
    width: 0%;
    height: 100%;
    background: #ffb400;
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    width: clamp(28px, 9cqw, 36px);
    aspect-ratio: 1 / 1;
    border: 0;
    background: none;
    color: #c1440e;
    font-size: clamp(12px, 4cqw, 15px);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .round-btn:hover { color: #e0590f; }
  .round-btn:active { color: #a3390b; }

  .round-btn[hidden] { display: none; }

  .stage.pseudo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }

  .now-playing-title {
    flex: 1 1 auto;
    min-width: 0;
    color: #ffd479;
    font-weight: 700;
    font-size: clamp(11px, 3.2cqw, 14px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  .next-btn-label {
    font-size: clamp(9px, 2.6cqw, 11px);
    font-weight: 700;
  }

</style>
</head>
<body>

<div class="stage" id="stage">
  <div id="ytPlayer"></div>
  <video id="videoEl" playsinline webkit-playsinline muted disablePictureInPicture disableRemotePlayback controlsList="nodownload noplaybackrate noremoteplayback" style="display:none;"></video>
  <div class="stage-loading" id="stageLoading">
    <img class="gif-loader" src="/KNOBSOCK-loading-animation.gif" alt="Loading video…">
  </div>
  <div class="empty-state" id="emptyState" hidden>No Hamburger News yet — check back soon!</div>
  <div class="controls-bar" id="controlsBar" hidden>
    <div class="scrubber" id="scrubber">
      <div class="scrubber-track">
        <div class="scrubber-fill" id="scrubberFill"></div>
      </div>
    </div>
    <div class="buttons-row">
      <button type="button" class="round-btn" id="muteBtn" title="Unmute"><svg class="mute-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-.77-3.29-2-4.31v2.6l2 2c0-.1 0-.19 0-.29zm2.5 0c0 .91-.19 1.77-.51 2.55l1.47 1.47C20.63 14.86 21 13.48 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H4v6h4l5 5v-6.73l4.25 4.25c-.67.53-1.42.94-2.25 1.19v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg></button>
      <button type="button" class="round-btn" id="playBtn" title="Pause">&#10074;&#10074;</button>
      <div class="now-playing-title" id="nowPlayingTitle"></div>
      <button type="button" class="round-btn" id="nextBtn" title="Next episode" hidden><span class="next-btn-label">&#9654;&#9654;</span></button>
      <button type="button" class="round-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js"></script>
<script>
(function () {
  const firebaseConfig = {
    apiKey: "AIzaSyAPOqBlb2ZegRCAbBqIyHqziJywB453pTM",
    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const HAMBURGER_NEWS_DOC_REF = db.collection('playlist').doc('hamburgerNews');

  function parseSource(input) {
    if (!input) return null;
    const trimmed = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return { type: 'youtube', id: trimmed };
    const ytMatch = trimmed.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) return { type: 'youtube', id: ytMatch[1] };
    if (/^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed)) {
      return { type: 'video', url: trimmed };
    }
    return null;
  }
  const stageEl = document.getElementById('stage');
  const ytPlayerDiv = document.getElementById('ytPlayer');
  const videoEl = document.getElementById('videoEl');
  const stageLoadingEl = document.getElementById('stageLoading');
  const emptyStateEl = document.getElementById('emptyState');
  const controlsBarEl = document.getElementById('controlsBar');
  const muteBtn = document.getElementById('muteBtn');
  const playBtn = document.getElementById('playBtn');
  const nextBtn = document.getElementById('nextBtn');
  const nowPlayingTitleEl = document.getElementById('nowPlayingTitle');
  const scrubberEl = document.getElementById('scrubber');
  const scrubberFillEl = document.getElementById('scrubberFill');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let videos = [];
  let activeIndex = 0;
  let hasLoadedInitialVideo = false;

  function showLoading() { stageLoadingEl.hidden = false; }
  function hideLoading() { stageLoadingEl.hidden = true; }

  const CONTROLS_AUTO_HIDE_MS = 3000;
  const supportsHover = window.matchMedia('(hover: hover)').matches;
  let hideTimer = null;
  function showControls(autoHide) {
    if (!videos.length) return;
    controlsBarEl.hidden = false;
    stageEl.classList.add('controls-visible');
    clearTimeout(hideTimer);
    if (autoHide) hideTimer = setTimeout(() => stageEl.classList.remove('controls-visible'), CONTROLS_AUTO_HIDE_MS);
  }
  function hideControlsNow() {
    clearTimeout(hideTimer);
    stageEl.classList.remove('controls-visible');
  }
  if (supportsHover) {
    stageEl.addEventListener('mouseenter', () => showControls(false));
    stageEl.addEventListener('mouseleave', () => hideControlsNow());
  } else {
    stageEl.addEventListener('touchstart', (e) => {
      if (e.target.closest('.controls-bar')) { showControls(true); return; }
      if (stageEl.classList.contains('controls-visible')) hideControlsNow();
      else showControls(true);
    }, { passive: true });
  }

  let backend = null;
  let ytPlayer = null;
  let ytApiReady = false;
  let playerReady = false;
  let pendingVideoId = null;
  let videoReady = false;
  let hlsInstance = null;
  let seekGen = 0;

  function seekDirectVideo(t) {
    const myGen = ++seekGen;
    const wasPlaying = !videoEl.paused;
    videoEl.currentTime = t;
    if (!wasPlaying) return;

    let resumed = false;
    function resume() {
      if (resumed || myGen !== seekGen) return;
      resumed = true;
      videoEl.removeEventListener('seeked', onSeeked);
      videoEl.play().catch(() => {});
    }
    function onSeeked() { resume(); }
    videoEl.addEventListener('seeked', onSeeked);
    setTimeout(resume, 300);

    setTimeout(() => {
      if (myGen !== seekGen || videoEl.paused || videoEl.ended) return;
      if (Math.abs(videoEl.currentTime - t) > 0.75) return;
      if (hlsInstance) return;
      const resumeTarget = videoEl.currentTime;
      function onLoaded() {
        videoEl.removeEventListener('loadedmetadata', onLoaded);
        videoEl.currentTime = resumeTarget;
        videoEl.play().catch(() => {});
      }
      videoEl.addEventListener('loadedmetadata', onLoaded);
      videoEl.load();
    }, 2000);
  }

  const MUTE_ICON_UNMUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34zM14 4.45v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4-.91 7-4.49 7-8.77s-3-7.86-7-8.77z"/></svg>';
  const MUTE_ICON_MUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.5 12c0-1.77-.77-3.29-2-4.31v2.6l2 2c0-.1 0-.19 0-.29zm2.5 0c0 .91-.19 1.77-.51 2.55l1.47 1.47C20.63 14.86 21 13.48 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H4v6h4l5 5v-6.73l4.25 4.25c-.67.53-1.42.94-2.25 1.19v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>';

  const pf = {
    ready() {
      return backend === 'youtube' ? playerReady : videoReady;
    },
    play() {
      if (backend === 'youtube') { if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo(); }
      else videoEl.play().catch(() => {});
    },
    pause() {
      if (backend === 'youtube') { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); }
      else videoEl.pause();
    },
    isPlaying() {
      if (backend === 'youtube') {
        return !!(ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING);
      }
      return !videoEl.paused && !videoEl.ended;
    },
    isMuted() {
      if (backend === 'youtube') return !!(ytPlayer && ytPlayer.isMuted && ytPlayer.isMuted());
      return videoEl.muted;
    },
    mute() {
      if (backend === 'youtube') { if (ytPlayer && ytPlayer.mute) ytPlayer.mute(); }
      else videoEl.muted = true;
    },
    unmute() {
      if (backend === 'youtube') { if (ytPlayer && ytPlayer.unMute) { ytPlayer.unMute(); ytPlayer.setVolume(100); } }
      else { videoEl.muted = false; videoEl.volume = 1; }
    },
    getDuration() {
      if (backend === 'youtube') return ytPlayer && ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      return videoEl.duration || 0;
    },
    getCurrentTime() {
      if (backend === 'youtube') return ytPlayer && ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
      return videoEl.currentTime || 0;
    },
    seekTo(t) {
      if (backend === 'youtube') { if (ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(t, true); }
      else seekDirectVideo(t);
    }
  };

  function updateMuteBtn() {
    if (!pf.ready()) return;
    const muted = pf.isMuted();
    muteBtn.innerHTML = muted ? MUTE_ICON_MUTED : MUTE_ICON_UNMUTED;
    muteBtn.title = muted ? 'Unmute' : 'Mute';
  }

  let wantsUnmute = false;
  function applyUnmute() {
    if (!wantsUnmute || !pf.ready()) return;
    pf.unmute();
    updateMuteBtn();
    if (!pf.isMuted()) wantsUnmute = false;
  }
  function updatePlayBtn(isPlaying) {
    playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
    playBtn.title = isPlaying ? 'Pause' : 'Play';
  }

  function renderNowPlaying() {
    const v = videos[activeIndex];
    nowPlayingTitleEl.textContent = v ? (v.title || 'Untitled') : '';
    nextBtn.hidden = videos.length < 2;
  }

  function updateScrubber() {
    if (!pf.ready()) return;
    const duration = pf.getDuration();
    if (!duration) return;
    const pct = Math.min(100, Math.max(0, (pf.getCurrentTime() / duration) * 100));
    scrubberFillEl.style.width = pct + '%';
  }
  setInterval(updateScrubber, 250);

  scrubberEl.addEventListener('click', (e) => {
    showControls(true);
    if (!pf.ready()) return;
    const duration = pf.getDuration();
    if (!duration) return;
    const rect = scrubberEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    pf.seekTo(fraction * duration);
    scrubberFillEl.style.width = (fraction * 100) + '%';

    wantsUnmute = true;
    applyUnmute();
  });

  function showBackendEl(kind) {
    ytPlayerDiv.style.display = kind === 'youtube' ? '' : 'none';
    videoEl.style.display = kind === 'video' ? '' : 'none';
  }

  function stopVideoBackend() {
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    videoEl.removeAttribute('src');
    videoEl.load();
    videoReady = false;
  }

  function playIndex(index) {
    if (!videos.length) return;
    activeIndex = ((index % videos.length) + videos.length) % videos.length;
    renderNowPlaying();
    scrubberFillEl.style.width = '0%';
    const v = videos[activeIndex];
    showLoading();

    if (v.type === 'youtube') {
      backend = 'youtube';
      showBackendEl('youtube');
      stopVideoBackend();
      if (ytPlayer && playerReady) {
        ytPlayer.loadVideoById(v.id);
      } else if (ytApiReady && !ytPlayer) {
        createYtPlayer(v.id);
      } else {
        pendingVideoId = v.id;
      }
    } else {
      backend = 'video';
      showBackendEl('video');
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      loadVideoSource(v.url);
    }
  }

  function loadVideoSource(url) {
    videoReady = false;
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
    } else {
      videoEl.src = url;
    }
    videoEl.muted = true;
    videoEl.play().catch(() => {});
  }

  videoEl.addEventListener('loadeddata', () => {
    videoReady = true;
    hideLoading();
    updatePlayBtn(true);
    applyUnmute();
    updateMuteBtn();
  });
  videoEl.addEventListener('waiting', () => { if (backend === 'video') showLoading(); });
  videoEl.addEventListener('playing', () => { if (backend === 'video') { hideLoading(); updatePlayBtn(true); } });
  videoEl.addEventListener('pause', () => { if (backend === 'video') updatePlayBtn(false); });
  videoEl.addEventListener('ended', () => { if (backend === 'video') playIndex(activeIndex + 1); });
  videoEl.addEventListener('error', () => { if (backend === 'video') hideLoading(); });

  function createYtPlayer(id) {
    ytPlayer = new YT.Player('ytPlayer', {
      videoId: id,
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        enablejsapi: 1,
        iv_load_policy: 3,
        cc_load_policy: 0
      },
      events: {
        onReady: function () {
          playerReady = true;
          applyUnmute();
          updateMuteBtn();
          updatePlayBtn(true);

          if (pendingVideoId) {
            showLoading();
            ytPlayer.loadVideoById(pendingVideoId);
            pendingVideoId = null;
          } else {

            hideLoading();
          }
        },
        onStateChange: function (e) {

          if (e.data === YT.PlayerState.PLAYING) { hideLoading(); updatePlayBtn(true); applyUnmute(); }
          else if (e.data === YT.PlayerState.BUFFERING) { showLoading(); }
          else if (e.data === YT.PlayerState.PAUSED) { updatePlayBtn(false); }

          if (e.data === YT.PlayerState.ENDED) playIndex(activeIndex + 1);
        },

        onError: function () { hideLoading(); }
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    if (pendingVideoId && !ytPlayer) {
      const id = pendingVideoId;
      pendingVideoId = null;
      createYtPlayer(id);
    }
  };

  muteBtn.addEventListener('click', () => {
    showControls(true);
    if (!pf.ready()) return;
    if (pf.isMuted()) pf.unmute(); else pf.mute();
    updateMuteBtn();
  });
  playBtn.addEventListener('click', () => {
    showControls(true);
    if (!pf.ready()) return;
    if (pf.isPlaying()) pf.pause(); else pf.play();
  });
  nextBtn.addEventListener('click', () => {
    showControls(true);
    playIndex(activeIndex + 1);
  });

  let usingPseudoFullscreen = false;

  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    /iP(hone|od|ad)/.test(navigator.platform) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function hasNativeFullscreenSupport(el) {
    return !!(
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.mozRequestFullScreen ||
      el.msRequestFullscreen
    );
  }

  function isFullscreen() {
    return (
      usingPseudoFullscreen ||
      !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      )
    );
  }

  function requestFs(el) {
    try {
      let result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') {
        result.catch(() => enterPseudoFullscreen());
      }
    } catch (e) {
      enterPseudoFullscreen();
    }
  }

  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }

  function handleFsEscKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen();
  }

  function notifyParentFullscreen(active) {

    try { window.parent.postMessage({ type: 'knobsock-hamburger-fullscreen', active: active }, '*'); } catch (e) {}
  }

  function enterPseudoFullscreen() {
    stageEl.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleFsEscKey);
    updateFullscreenIcon();
    notifyParentFullscreen(true);
  }

  function exitPseudoFullscreen() {
    stageEl.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleFsEscKey);
    updateFullscreenIcon();
    notifyParentFullscreen(false);
  }

  function updateFullscreenIcon() {
    fullscreenBtn.title = isFullscreen() ? 'Exit Fullscreen' : 'Fullscreen';
  }

  fullscreenBtn.addEventListener('click', () => {
    showControls(true);
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (isIOS && backend === 'video' && typeof videoEl.webkitEnterFullscreen === 'function') {
      videoEl.webkitEnterFullscreen();
      return;
    }
    if (hasNativeFullscreenSupport(stageEl)) requestFs(stageEl);
    else enterPseudoFullscreen();
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach((evt) => {
    document.addEventListener(evt, updateFullscreenIcon);
  });

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-play') return;
    var i = parseInt(e.data.index, 10);
    if (isNaN(i) || !videos.length) return;
    hasLoadedInitialVideo = true;
    wantsUnmute = true;
    showLoading();
    playIndex(i);
    applyUnmute();
  });

  HAMBURGER_NEWS_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const rawList = (data && Array.isArray(data.videos)) ? data.videos : [];
    videos = rawList
      .map(v => {
        const src = parseSource(v.url);
        if (!src) return null;
        src.title = (v.title && v.title.trim()) ? v.title.trim() : 'Untitled';
        return src;
      })
      .filter(Boolean);

    if (!videos.length) {
      emptyStateEl.hidden = false;
      controlsBarEl.hidden = true;
      hideLoading();
      return;
    }
    emptyStateEl.hidden = true;

    if (!hasLoadedInitialVideo) {
      hasLoadedInitialVideo = true;
      showLoading();
      playIndex(0);
    } else {
      renderNowPlaying();
    }
  }, function (err) {
    console.error('Hamburger News playlist sync error:', err);
    emptyStateEl.hidden = false;
    emptyStateEl.textContent = 'Could not load videos.';
  });
})();
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
