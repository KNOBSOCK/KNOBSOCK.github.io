<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;

    background: #130303;
    font-family: Arial, Helvetica, sans-serif;
  }
  body { transition: background-color 1.6s ease; }
  body.is-live { background: #3a0a0a; }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  .logo-link {
    flex: 0 0 auto;
    display: block;
    width: min(70vw, 480px);
    margin: 0 auto;
  }
  .logo-link img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 50 / 19;
    object-fit: contain;
  }

  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  @media (min-width: 861px) {
    .player-wrap {
      flex: 0 0 auto;
      min-height: 0;
      /* 62% of the inner widget width is a 16:9 player. The fixed amount
         accounts for its horizontal gap plus the widget's top/bottom insets. */
      height: calc(34.875vw + 30px);
    }
    .player-wrap iframe { height: 100%; }
    .player-wrap.chat-hidden {
      /* A chat-hidden player spans the full widget width at 16:9. */
      height: min(calc(56.25vw + 31px), 100dvh);
    }
    .page.chat-hidden {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding-top: 0;
      overflow: hidden;
    }
    .page.chat-hidden .logo-link { display: none; }
    .privacy-footer {
      display: none;
    }
  }

  .privacy-footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 3px 0;
  }
  .privacy-footer a {
    display: inline-block;
    text-decoration: underline;
    color: #fff;
    font-size: 9px;
    opacity: 0.75;
  }
  .privacy-footer a:hover { opacity: 1; }

  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .player-wrap {
      min-height: 0;
    }
  }

  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      padding: 0;
      gap: 0;
    }
    .logo-link { display: none; }
    .player-wrap { min-height: 0; }
  }

  .tapin-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    pointer-events: none;
  }
  .tapin-overlay.is-active { display: block; }
  .tapin-overlay img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.375s ease;
  }
  .tapin-overlay img.is-visible { opacity: 1; }

  .tapin-overlay .tapin-text {
    position: absolute;
    left: 50%;
    top: 22vh;

    transform: translateX(-50%) scale(1);
    width: min(94vw, 1200px);
    margin: 0;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(26px, 7vw, 84px);
    line-height: 1.15;
    color: #fff;
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 8px 20px rgba(0, 0, 0, 0.6);
    opacity: 0;
    overflow-wrap: anywhere;

    transition: opacity 0.35s ease;
  }
  .tapin-overlay .tapin-name { color: #ffff00; }
  .tapin-overlay .tapin-text.is-visible {
    opacity: 1;
    animation: tapinTextPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes tapinTextPop {
    0%   { transform: translateX(-50%) scale(0.4); }
    65%  { transform: translateX(-50%) scale(1.1); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* Portrait fills the viewport; the child owns its fixed-ratio columns. */
  body:has(.page.layout-portrait) { overflow: hidden; }
  .page.layout-portrait,
  .page.layout-portrait.chat-hidden {
    width: 100%;
    height: var(--live-viewport-height, 100dvh);
    min-height: 0;
    margin: 0;
    padding: 8px 8px 0;
    gap: 0;
    overflow: hidden;
  }
  .page.layout-portrait .logo-link { display: none; }
  .page.layout-portrait .player-wrap,
  .page.layout-portrait .player-wrap.chat-hidden {
    flex: 1 1 0;
    min-height: 0;
    height: auto;
  }
  .page.layout-portrait .player-wrap iframe { height: 100%; min-height: 0; }
  .page.layout-portrait .privacy-footer {
    display: block;
    position: static;
    flex: 0 0 20px;
    height: 20px;
    padding: 3px 0;
    line-height: 14px;
  }
  @media (max-width: 600px) {
    html:has(.page.layout-portrait),
    body:has(.page.layout-portrait) {
      overflow: hidden;
      overscroll-behavior: none;
    }
    .page.layout-portrait,
    .page.layout-portrait.chat-hidden {
      position: fixed;
      inset: 0;
      padding: 0;
      overscroll-behavior: none;
    }
    .page.layout-portrait .privacy-footer {
      /* Portrait mobile keeps its policy link in the widget's Past Streams
         bar, so this outer row must not steal height from a 9:16 video. */
      display: none;
    }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/">
    <img src="/knobsock-live-logo.png" alt="KNOBSOCK LIVE">
  </a>

  <div class="player-wrap">
    <iframe src="/livestream-chat-widget.html?v=portrait-vod-controls-2"
            title="KNOBSOCK Live"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>

  <div class="privacy-footer"><a href="/privacy">Privacy Policy &amp; User Agreement</a></div>
</div>

<div class="tapin-overlay" id="tapinOverlay" aria-hidden="true">
  <img id="tapinImg" alt="">
  <div class="tapin-text" id="tapinText"><span class="tapin-name" id="tapinName"></span> has tapped in</div>
</div>
<audio id="tapinAudio" preload="auto" src="/beer%20can%20sound2.mp3"></audio>

<script>
(function () {
  var overlay = document.getElementById('tapinOverlay');
  var img = document.getElementById('tapinImg');
  var audio = document.getElementById('tapinAudio');
  var text = document.getElementById('tapinText');
  var nameEl = document.getElementById('tapinName');
  if (!overlay || !img || !audio || !text || !nameEl) return;

  var IMG_SRC = '/gif%20version.gif';
  var hideTimer = null;
  var textFadeTimer = null;
  var TEXT_FADE_OUT_MS = 350;

  var GIF_LOOP_MS = 6030;
  var GIF_CUTOFF_MS = GIF_LOOP_MS - 120;

  function playTapInEffect(username) {
    clearTimeout(hideTimer);
    clearTimeout(textFadeTimer);

    img.classList.remove('is-visible');
    img.removeAttribute('src');
    audio.pause();
    audio.currentTime = 0;

    nameEl.textContent = username || '';
    text.classList.remove('is-visible');
    void text.offsetWidth;

    overlay.classList.add('is-active');
    requestAnimationFrame(function () {
      img.src = IMG_SRC;
      img.classList.add('is-visible');
      text.classList.add('is-visible');
      audio.play().catch(function () {});
    });

    var durationMs = GIF_CUTOFF_MS;
    if (audio.duration && isFinite(audio.duration) && audio.duration * 1000 < durationMs) {
      durationMs = audio.duration * 1000;
    }
    hideTimer = setTimeout(function () {
      audio.pause();
      img.classList.remove('is-visible');
      text.classList.remove('is-visible');

      textFadeTimer = setTimeout(function () {
        overlay.classList.remove('is-active');
      }, TEXT_FADE_OUT_MS);
    }, durationMs);
  }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'knobsock-tapin') playTapInEffect(e.data.username);
    if (e.data && e.data.type === 'knobsock-live-state') {
      document.body.classList.toggle('is-live', !!e.data.isLive);
    }
    if (e.data && e.data.type === 'knobsock-layout-mode') {
      var page = document.querySelector('.page');
      if (page) page.classList.toggle('layout-portrait', e.data.mode === '9:16');
    }
    if (e.data && e.data.type === 'knobsock-vod-state') {
      var vodPath = e.data.vodId ? '/live/v/' + e.data.vodId + '/' : '/live';
      history.replaceState(null, '', vodPath);
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'knobsock-shell-update-route', path: vodPath }, window.location.origin);
      }
    }
  });

  window.addEventListener('load', function () {
    try { fetch(IMG_SRC, { priority: 'low' }).catch(function () {}); } catch (e) {}
  });
})();
</script>

<script>
(function () {

  function resetScroll() {
    if (window.visualViewport) {
      document.documentElement.style.setProperty('--live-viewport-height', window.visualViewport.height + 'px');
    }
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { window.scrollTo(0, 0); });
    /* Mobile Safari/Instagram can apply its input-scroll after the resize
       callback. A second frame catches that delayed adjustment. */
    setTimeout(function () { window.scrollTo(0, 0); }, 80);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resetScroll);
  }
  window.addEventListener('resize', resetScroll);
  window.addEventListener('scroll', function () {
    if (document.querySelector('.page.layout-portrait')) resetScroll();
  }, { passive: true });
  document.addEventListener('focusin', function () {
    if (document.querySelector('.page.layout-portrait')) resetScroll();
  });
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'knobsock-lock-live-scroll') resetScroll();
  });
  resetScroll();
})();
</script>
