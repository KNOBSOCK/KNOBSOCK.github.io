<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/live">
<meta property="og:title" content="Live - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Live - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone rebuild in the same style as music.html/videos.html. */

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Matches the live chat widget's own red palette (its --ink) instead
       of the tiled GeoCities GIF every other non-widget page here uses,
       so the page the widget sits in reads as part of the same color
       scheme instead of a mismatched backdrop behind it. */
    background: #3a0a0a;
    font-family: Arial, Helvetica, sans-serif;
  }

  html { overflow-x: hidden; }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    gap: 2px;
    padding: clamp(8px, 2vw, 20px) 0 0;
  }

  /* Header logo — capped by width AND by a share of the viewport height
     so it can't eat the player's room on a short/landscape screen. */
  .logo-link {
    flex: 0 0 auto;
    display: block;
    text-align: center;
    padding: 0 clamp(10px, 3vw, 24px);
  }
  .logo-link img {
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 760px;
    max-height: 18vh;
    height: auto;
    object-fit: contain;
  }

  /* The widget fills whatever room it's given (it's built at 100% width
     and height with its own frosted panels), so unlike the music/video
     playlist widgets this doesn't need a postMessage height contract —
     it just stretches to fill the flex row below the logo. */
  .player-wrap {
    flex: 1 1 auto;
    min-height: min(560px, 68vh);
    display: flex;
  }
  .player-wrap iframe {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    height: auto;
    min-height: 0;
    border: 0;
    background: transparent;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it grow/scroll — the widget's own chat message list already
     has its own internal overflow-y:auto (see
     livestream-chat-widget.html), so scrolling stays inside the widget
     instead of moving the logo off-screen. min-height:0 (replacing the
     desktop floor above) lets .player-wrap shrink to whatever's actually
     left below the logo on a very short phone, letterboxing the widget
     slightly rather than overflowing the locked page. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
    }
    .player-wrap {
      min-height: 0;
    }
  }

  /* Phone rotated to landscape: same one-screen lock as the portrait
     rule above (checked on max-height here since that's the dimension
     a phone's short side ends up on once rotated — its width can be
     well over 860px lying sideways), plus the logo and its padding/gap
     go away entirely so the player gets the whole screen instead of
     losing a chunk of an already-short viewport to a header. The
     widget itself still needs telling to give up its own portrait-
     shaped mobile stack — see livestream-chat-widget.html's own
     matching landscape query.
     hover:none + pointer:coarse (true only for touchscreens) are load-
     bearing, not belt-and-suspenders: a perfectly ordinary desktop
     browser window is "landscape" by nature and very often under
     860px tall too (a laptop screen minus its own chrome), so
     max-height + orientation alone was hiding the logo on regular
     desktop visits — confirmed by testing an actual 1400x900 window,
     not just guessing. The touch check is what actually scopes this to
     phones/tablets. */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      padding: 0;
      gap: 0;
    }
    .logo-link { display: none; }
    .player-wrap { min-height: 0; }
  }

  /* ---------- TAP IN (fullscreen effect) ----------
     Triggered by a postMessage from livestream-chat-widget.html's tap-in
     button (see that file's TAP IN section). Has to live in this
     top-level page rather than inside that iframe: position:fixed inside
     an iframe only ever covers the iframe's OWN box (livestream-chat-
     widget.html's own comment on .bg-glow notes the same constraint),
     and on desktop especially that box sits below the header logo, so it
     could never actually cover the real browser viewport the way "full
     screen, like a hand came off the side of the browser" calls for.
     pointer-events:none keeps it purely decorative — never blocks
     clicking the chat/video underneath while it plays. */
  .tapin-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: none;
    pointer-events: none;
  }
  .tapin-overlay.is-active { display: block; }
  .tapin-overlay img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.375s ease; /* 25% slower than the original 0.3s */
  }
  .tapin-overlay img.is-visible { opacity: 1; }

  /* "____ has tapped in", Streamlabs-alert style: giant bold text over
     the top of the animation, popping in exactly when it plays. A black
     stroke (the four offset shadows) plus a soft drop shadow keeps it
     readable regardless of what's behind it (video, offline card, chat
     panel), since unlike a normal caption this sits over arbitrary page
     content rather than a designed background. top:22vh (not a few
     percent) is deliberate: the gif is transparent up there for most of
     the animation, so the header logo (capped at max-height:18vh) shows
     straight through — both it and this text are bold yellow lettering,
     so anything higher up overlaps them into an unreadable jumble. */
  .tapin-overlay .tapin-text {
    position: absolute;
    left: 50%;
    top: 22vh;
    /* Resting scale matches the pop keyframe's OWN end state (100%
       below), not its starting one — so when is-visible is removed and
       the animation stops applying, transform falls back to exactly
       where the animation already had it, with no snap. The animation
       still starts from its own 0% (scale 0.4) on entry regardless of
       what's specified here, since an active keyframe animation
       overrides the base value for as long as it runs. */
    transform: translateX(-50%) scale(1);
    width: min(94vw, 1200px);
    margin: 0;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(26px, 7vw, 84px);
    line-height: 1.15;
    color: #fff;
    text-shadow:
      -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
      0 8px 20px rgba(0, 0, 0, 0.6);
    opacity: 0;
    overflow-wrap: anywhere;
    /* Deliberately the ONLY thing driving opacity — a transition here
       fades it smoothly both in and out as is-visible toggles. Opacity
       used to be part of the pop keyframe below instead, but a CSS
       transition can't pick up a smooth handoff from a property an
       animation was just driving: once the animation stops applying,
       the value just jumps to the next matching rule with no
       interpolation, which is why the fade-out wasn't visibly fading
       at all before this. Keeping the keyframe to ONLY transform
       (a different property) sidesteps that entirely. */
    transition: opacity 0.35s ease;
  }
  .tapin-overlay .tapin-name { color: #ffff00; }
  .tapin-overlay .tapin-text.is-visible {
    opacity: 1;
    animation: tapinTextPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes tapinTextPop {
    0%   { transform: translateX(-50%) scale(0.4); }
    65%  { transform: translateX(-50%) scale(1.1); }
    100% { transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body>

<div class="page">
  <a class="logo-link" href="/">
    <img src="/knobsock-live-logo.png" alt="KNOBSOCK LIVE">
  </a>

  <div class="player-wrap">
    <iframe src="/livestream-chat-widget.html"
            title="KNOBSOCK Live"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen></iframe>
  </div>
</div>

<div class="tapin-overlay" id="tapinOverlay" aria-hidden="true">
  <img id="tapinImg" alt="">
  <div class="tapin-text" id="tapinText"><span class="tapin-name" id="tapinName"></span> has tapped in</div>
</div>
<audio id="tapinAudio" preload="auto" src="/beer%20can%20sound2.mp3"></audio>

<script>
(function () {
  var overlay = document.getElementById('tapinOverlay');
  var img = document.getElementById('tapinImg');
  var audio = document.getElementById('tapinAudio');
  var text = document.getElementById('tapinText');
  var nameEl = document.getElementById('tapinName');
  if (!overlay || !img || !audio || !text || !nameEl) return;

  var IMG_SRC = '/gif%20version.gif';
  var hideTimer = null;
  var textFadeTimer = null;
  var TEXT_FADE_OUT_MS = 350; // keep in sync with .tapin-text's transition duration above

  // This gif's own native one-loop duration: 182 frames at ~30-40ms
  // each, measured by summing each frame's real delay (PIL:
  // im.info['duration'] per frame) rather than guessed — if the file
  // is ever swapped again, re-measure and update this. It loops
  // forever like most animated GIFs (its own loop count is 0 =
  // infinite), so waiting past this point lets it visibly wrap back to
  // frame 0 and start replaying before the effect gets hidden — cutting
  // it off a few frames early avoids that "restart flash" at the end.
  var GIF_LOOP_MS = 6030;
  var GIF_CUTOFF_MS = GIF_LOOP_MS - 120;

  function playTapInEffect(username) {
    clearTimeout(hideTimer);
    clearTimeout(textFadeTimer);

    // No src at all until the moment of playback (not even "", which in
    // some browsers re-requests the current page) — an animated image
    // just keeps playing from wherever it left off once it has a src, and
    // there's no JS seek/restart control for that format, so a fresh src
    // assignment is the only reliable way to guarantee it starts at frame
    // 0 every single time this is triggered, first tap-in or fiftieth.
    img.classList.remove('is-visible');
    img.removeAttribute('src');
    audio.pause();
    audio.currentTime = 0;

    // Same restart concern as the image above, but for the CSS pop
    // animation instead of a src: removing the class doesn't rewind an
    // already-finished animation on its own, so a forced reflow (reading
    // offsetWidth) is needed before re-adding it, or a second tap-in
    // wouldn't visibly pop at all. textContent (not innerHTML) is enough
    // to keep a username with HTML-looking characters inert.
    nameEl.textContent = username || '';
    text.classList.remove('is-visible');
    void text.offsetWidth;

    overlay.classList.add('is-active');
    requestAnimationFrame(function () {
      img.src = IMG_SRC;
      img.classList.add('is-visible');
      text.classList.add('is-visible');
      audio.play().catch(function () {}); // best-effort — a browser blocking autoplay-with-sound here still shows the animation
    });

    // Ends at the earlier of "the audio actually finished" or "the gif
    // is about to loop" — GIF_CUTOFF_MS on its own would be enough
    // since the two are pre-timed to match, but if the audio ever ends
    // up the shorter of the pair this still won't run the visual on
    // past it.
    var durationMs = GIF_CUTOFF_MS;
    if (audio.duration && isFinite(audio.duration) && audio.duration * 1000 < durationMs) {
      durationMs = audio.duration * 1000;
    }
    hideTimer = setTimeout(function () {
      audio.pause();
      img.classList.remove('is-visible'); // the gif itself still cuts off instantly - no fade-out asked for there
      text.classList.remove('is-visible'); // starts the text's own opacity transition (see its CSS)

      // The overlay's own display:none (see .tapin-overlay/.is-active)
      // would cut that transition off invisibly the instant it applies,
      // so it - and nothing else needs it, the gif's already gone -
      // waits for the text to actually finish fading first.
      textFadeTimer = setTimeout(function () {
        overlay.classList.remove('is-active');
      }, TEXT_FADE_OUT_MS);
    }, durationMs);
  }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'knobsock-tapin') playTapInEffect(e.data.username);
  });

  // The gif is a big (~18MB) full-animation file — fetching it eagerly
  // via a render-blocking-priority <link rel=preload> would tax mobile
  // data on every single visit just to shave latency off a feature most
  // visitors never click. Warming it in the background well after the
  // real page (logo/chat/video) has already loaded costs nothing on that
  // initial load, and a livestream page is a long-dwell-time page, so by
  // the time anyone actually taps in this has almost always already
  // finished — the fetch here shares the same HTTP cache img.src reads
  // from in playTapInEffect above, it just isn't attached to a live
  // <img> (which would risk it silently animating in the background well
  // before its first real trigger).
  window.addEventListener('load', function () {
    try { fetch(IMG_SRC, { priority: 'low' }).catch(function () {}); } catch (e) {}
  });
})();
</script>

</body>
</html>
