<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with a drawn-scene background — two of them, actually
     (see VARIANTS in the script below): hamburger-news-bg.webp is an
     8000x8000 illustrated room (door, window, floor, spotlight, burger),
     drawn edge-to-edge at that huge size specifically so cover-fit crop
     always has room to spare before it could ever reach the door/window/
     burger/plate; hamburger-news-bg-mobile.webp is the same burger art
     recomposited onto its own 9:16 phone-shaped canvas instead of a crop
     of the square one, so a phone screen doesn't waste most of its width
     on transparent padding the square version needs for wide desktop
     windows. Both leave the video's slot transparent — drawn with its
     own brown border frame on all four sides, and (like the lettuce
     fringe over the top edge) a few px of intentional overlap where the
     border/lettuce/condiment art dips into the slot rather than butting
     flush against it, so each variant's HOLE_RECT is sized to the FULL
     reach of that transparency (the shallowest point on each edge, not
     the safe common core) — the video is meant to peek out from
     underneath those overlapping bits, not sit inset from them.

     #stageBg and #pattySlot (the video) are both positioned by the same
     JS layout() below rather than CSS object-fit:cover — see that
     function's own comment for why a plain CSS cover-fit can't also
     guarantee the video a legible minimum size, which this needs on top
     of the base cover math (confirmed: without a floor, the video renders
     under 150px tall on an ordinary desktop window against a canvas this
     size — technically "not cropped", but unreadably small in practice). */
  * { box-sizing: border-box; }

  /* Site's display font — used here for the Back to Videos link and the
     Games pickle's empty-state message. */
  @font-face {
    font-family: 'Gratis Neue';
    src: url('/Gratis%20Neue.otf') format('opentype');
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* Sampled from the art's own floor color. Cover-fit means this
       should never actually show, but it's the fallback for the instant
       before the background image loads, and stops Safari's elastic
       overscroll bounce from flashing white in the meantime. */
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Positioned by layout() below — no CSS width/height/object-fit here,
     since those would fight the JS for control of this element's size. */
  .stage-bg {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }

  /* The video, likewise positioned by layout(). */
  .patty-slot {
    position: fixed;
    z-index: 1;
    background: #000;
    overflow: hidden;
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .back-link {
    position: fixed;
    top: clamp(10px, 2.5vw, 20px);
    left: clamp(10px, 2.5vw, 20px);
    z-index: 3;
    font-family: 'Gratis Neue', Arial, sans-serif;
    color: #ffd479;
    font-size: clamp(16.5px, 3.3vw, 19.5px);
    font-weight: 700;
    text-decoration: none;
    opacity: 0.85;
    /* Same black-outline technique as store.html's size selector
       (-webkit-text-stroke + 4-direction text-shadow) — the page behind
       this link is illustrated art, not a flat color, so it still needs
       its own legibility net; a crisp outline reads against both the
       light bun art and the dark room just as well as the old soft
       drop-shadow did. */
    -webkit-text-stroke: 0.5px #000;
    text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;
  }
  .back-link:hover { opacity: 1; }

  /* ---------- PICKLE BUTTONS ----------
     Two pickle-shaped buttons sitting on the scene — Episodes on the
     plate's left edge, Games out on the ketchup. Both are positioned by
     layout() from a rect held in the background art's OWN pixel space
     (VARIANTS[].pickles, same idea as the video slot's hole), so they
     stay welded to the artwork at every window size instead of drifting
     around as viewport percentages. Desktop and mobile carry their own
     rects because the two background variants frame the scene
     differently. */
  .pickle-btn {
    position: fixed;
    z-index: 3;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pickle-btn img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  .pickle-btn:hover { transform: scale(1.06); }
  .pickle-btn:active { transform: scale(0.97); }
  /* Only ever set while the video widget is fullscreen — the zoom leaves
     the pickles alone and lets them ride the stage in and out with the
     rest of the scene (see openZoom). */
  .pickle-btn[hidden] { display: none; }

  /* Everything that makes up the un-zoomed scene, wrapped so the zoom can
     push the whole thing in at once. Full-viewport and fixed, so giving it
     a transform doesn't move its position:fixed children — their
     containing block becomes this element, which occupies exactly the
     viewport anyway. */
  .stage-wrap {
    position: fixed;
    inset: 0;
    transform-origin: 50% 50%;
  }
  /* Same curve and duration as the overlay's own transform below — the two
     halves of the push-in have to stay locked together, and any mismatch
     between them shows up as the scene visibly sliding out from under the
     close-up. will-change promotes the stage to its own layer for the
     duration, so the browser rasterises it once and GPU-scales it instead
     of re-rendering an 8000px illustration every frame (which is what made
     the push-in stutter). It's set only while the class is on, since a
     permanent will-change would keep that layer around forever. */
  .stage-wrap.is-zooming {
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
    will-change: transform;
    backface-visibility: hidden;
  }

  /* ---------- PICKLE ZOOM OVERLAY ----------
     Clicking a pickle reads as the camera pushing in on it: the scene
     above scales up about that pickle, while this overlay grows out of the
     pickle's own on-screen position to full frame. The close-up art is a
     separate drawing of the same scene, positioned by the same cover-fit +
     focus-point maths layout() uses for everything else (see
     PICKLE_ART/zoomFrame), so it lands identically at any window size.

     Deliberately has NO background colour of its own. It used to be a flat
     dark panel, which is what made the zoom "blink": mid-animation the
     close-up is still scaled down to pickle size, so everywhere it doesn't
     reach was that dark fill washing over the scene as the overlay faded
     up. Transparent, the only thing crossing the frame is the close-up
     itself growing over a scene that's still fully opaque underneath, and
     once it settles the art covers the viewport on its own (its layout is
     cover-fit, so that's guaranteed at any window size). */
  .pickle-zoom {
    position: fixed;
    inset: 0;
    z-index: 20;
    overflow: hidden;
  }
  .pickle-zoom[hidden] { display: none; }
  .pickle-zoom-inner {
    position: absolute;
    inset: 0;
    transform-origin: 0 0;
  }
  .pickle-zoom.is-animating .pickle-zoom-inner {
    transition: transform 0.46s cubic-bezier(0.33, 0, 0.2, 1);
    will-change: transform;
    backface-visibility: hidden;
  }
  /* Opacity is eased separately from the transform on purpose. While the
     close-up is small it's a mismatched patch of a DIFFERENT drawing
     sitting over the scene, so it wants to stay faint until it's big
     enough to read as the same pickle; the curve below holds it low for
     the first half and brings it up late. is-closing flips to a curve that
     drops it early instead, so the patch is gone well before it shrinks
     back down to pickle size. */
  .pickle-zoom.is-animating { transition: opacity 0.46s cubic-bezier(0.62, 0, 0.86, 0.42); }
  .pickle-zoom.is-animating.is-closing { transition: opacity 0.34s cubic-bezier(0.2, 0.7, 0.4, 1); }
  .pickle-zoom-art {
    position: absolute;
    pointer-events: none;
  }

  /* The 3x3 slot grid, positioned in the CLOSE-UP art's pixel space and
     rotated to sit square on the pickle's own face — level for Games,
     tilted for Episodes, matching how each was drawn. */
  .pickle-slots {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    transform-origin: 50% 50%;
  }
  /* Thumbnail on top, title underneath — so a long episode name never
     covers the picture it belongs to. The split is driven from JS (--thumb-h,
     set in layoutZoom) rather than hard-coded here, because the same
     fraction also decides how tall each cell has to be for its thumbnail to
     come out square, and the grid's own height is derived from that. One
     number, one place. */
  .pickle-slot {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* Square, because the cell above it was sized to make it square — a
     thumbnail is cropped to fill it rather than letterboxed. */
  .pickle-slot-box {
    position: relative;
    flex: 0 0 var(--thumb-h, 78%);
    background: #000;
    overflow: hidden;
  }
  .pickle-slot-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Spills a little past its own cell's sides, so titles read across the
     pickle rather than being boxed into a column-wide strip. */
  .pickle-slot-label {
    flex: 1 1 auto;
    min-height: 0;
    width: 118%;
    margin-left: -9%;
    padding-top: 2%;
    text-align: center;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    /* Tight, because the strip is only as tall as LABEL_FRAC makes it and
       a two-line title has to clear its descenders inside that — any
       looser and the clamped second line gets sliced in half. */
    line-height: 1.02;
    letter-spacing: 0.02em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    /* Same outline treatment the back link uses — these sit on painted
       art, not a flat panel, so they need their own legibility net. */
    -webkit-text-stroke: 0.5px #000;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
  }
  .pickle-slot:not(:disabled):hover { transform: scale(1.05); }
  .pickle-slot:not(:disabled):active { transform: scale(0.96); }
  .pickle-slot:disabled { cursor: default; }
  .pickle-slot:disabled .pickle-slot-box { opacity: 0.45; }

  /* Games with nothing in it yet. Takes over the grid's own rect (and its
     rotation), so the message lands on the pickle's face exactly where the
     slots would have been. */
  .pickle-slots.is-empty {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pickle-empty {
    padding: 0 6%;
    text-align: center;
    color: #ffffff;
    font-family: 'Gratis Neue', Arial, sans-serif;
    font-size: 2.1em;
    line-height: 1.15;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
  }

  /* ---------- PAGE ARROWS ----------
     Only rendered when there's more than one page of something — the grid
     itself is fixed at the nine slots the art was drawn with. Sat either
     side of the zoomed pickle by layoutZoom, in the same close-up art space
     everything else up there uses, then clamped into the viewport so they
     stay reachable on a phone where the pickle runs off both edges. */
  .pickle-arrow {
    position: fixed;
    z-index: 21;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transform-origin: 50% 50%;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
  }
  .pickle-arrow[hidden] { display: none; }
  .pickle-arrow img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  .pickle-arrow:not(:disabled):hover { transform: scale(1.12); }
  .pickle-arrow:not(:disabled):active { transform: scale(0.95); }
  .pickle-arrow:disabled { opacity: 0.3; cursor: default; }
  /* The "jump out" on a tap. Runs as a keyframe rather than a class-swapped
     transform so it always plays to completion and resets itself, even when
     the pointer is still sitting on the button (where a :hover transform
     would otherwise hold it mid-pop). Each arrow leans the way it pages. */
  .pickle-arrow.is-jump { animation: pickleArrowJump 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #pickleNext.is-jump { animation-name: pickleArrowJumpNext; }
  @keyframes pickleArrowJump {
    0%   { transform: translateX(0) scale(1); }
    38%  { transform: translateX(-14%) scale(1.3); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes pickleArrowJumpNext {
    0%   { transform: translateX(0) scale(1); }
    38%  { transform: translateX(14%) scale(1.3); }
    100% { transform: translateX(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pickle-arrow.is-jump { animation: none; }
  }

  /* Real-viewport fullscreen fallback for hamburger-news-widget.html's
     own fullscreen button. That widget lives in an iframe, and on iOS
     Safari — which has no Fullscreen API at all for non-video elements —
     it falls back to a CSS position:fixed trick that can only ever cover
     the IFRAME'S OWN box, not the actual phone screen (position:fixed's
     containing block is the iframe's own viewport). The widget posts a
     message here instead, and this class — applied to the real iframe
     element in THIS top-level document — takes over the actual screen;
     the iframe's own contents (already 100% width/height inside it) grow
     to fill it right along with it. Needs its own z-index above
     #stageBg's 2, or the illustrated art would paint over the fullscreen
     video. */
  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }
  /* Belt-and-suspenders alongside the z-index above: reported as not
     actually covering the art on mobile, most likely the classic 100vh-
     vs-real-visible-height gap while iOS Safari's address bar is
     animating in/out — 100dvh should already account for that, but
     hiding the art outright removes any chance of it peeking through
     during that transition (or from any other stacking quirk) rather
     than relying solely on it staying strictly behind the fullscreen
     iframe. Toggled in lockstep with .hn-fullscreen itself, below. */
  .stage-bg.hn-bg-hidden {
    visibility: hidden;
  }
</style>
</head>
<body>

<a class="back-link" id="backLink" href="/videos">&larr; Back to Videos</a>

<div class="stage-wrap" id="stageWrap">
  <div class="patty-slot" id="pattySlot">

            title="Hamburger News"

            allowfullscreen></iframe>

  <img class="stage-bg" id="stageBg" alt="">

  <button type="button" class="pickle-btn" id="pickleEpisodes" aria-label="Episodes">

<div class="pickle-zoom" id="pickleZoom" hidden>

<!-- ============================================================
     FIREBASE — read-only here: this page only ever reads the Hamburger
     News episode list and the Games list (both admin.html-authored) to
     fill the pickles' slot grids. Same project every other page uses, and
     guarded the same way — if it fails to load, the pickles just come up

<script>

    authDomain: "chat-for-website-efee2.firebaseapp.com",
    projectId: "chat-for-website-efee2",
    storageBucket: "chat-for-website-efee2.firebasestorage.app",
    messagingSenderId: "509309222193",
    appId: "1:509309222193:web:f487258cfba2f7f7b00410"
  };
  var pattySlot = document.getElementById('pattySlot');
  var stageBg = document.getElementById('stageBg');
  var stageWrap = document.getElementById('stageWrap');
  var backLink = document.getElementById('backLink');
  var zoomEl = document.getElementById('pickleZoom');
  var zoomInner = document.getElementById('pickleZoomInner');
  var zoomArt = document.getElementById('pickleZoomArt');
  var slotsEl = document.getElementById('pickleSlots');
  var arrowPrev = document.getElementById('picklePrev');
  var arrowNext = document.getElementById('pickleNext');
  var ARROWS = [arrowPrev, arrowNext];
  var PICKLE_BTNS = {
    episodes: document.getElementById('pickleEpisodes'),
    games: document.getElementById('pickleGames')
  };
  // null while the scene is showing; 'episodes' / 'games' once zoomed in.
  var openPickle = null;
  var pickleItems = { episodes: [], games: [] };
  var picklePage = { episodes: 0, games: 0 };
  var SLOTS_PER_PAGE = 9;
  // Relayed from hamburger-news-widget.html's own fullscreen fallback —
  // see .patty-slot.hn-fullscreen's own comment above for why this has
  // to happen up here rather than inside that iframe. Also hides #stageBg
  // itself (see .stage-bg.hn-bg-hidden's own comment) and un-hides it
  // again on exit — easy to forget the reverse side of a toggle like
  // this, so it's written as one toggle() call per element rather than
  // as separate add/remove branches that could drift out of sync.
  //
  // The pickles need the same treatment for the same reason: they're
  // position:fixed siblings of the video, so hiding the art alone still
  // leaves two pickles floating over a fullscreen video. They're the only
  // thing that sets [hidden] on those buttons — the zoom deliberately
  // doesn't (see openZoom).
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-fullscreen') return;
    var active = !!e.data.active;
    pattySlot.classList.toggle('hn-fullscreen', active);
    stageBg.classList.toggle('hn-bg-hidden', active);
    Object.keys(PICKLE_BTNS).forEach(function (n) { PICKLE_BTNS[n].hidden = active; });
  });

  // ---------- STAGE LAYOUT ----------
  // #stageBg and #pattySlot are positioned by hand rather than via CSS
  // object-fit:cover, for two reasons: cover's own scale formula has no
  // notion of "never smaller than X" (see MIN_VIDEO_FRAC below), and the
  // background used object-fit:cover while the video used a floored
  // scale, they'd zoom at different rates and drift apart. A pure-CSS
  // version of "cover this box, but never go below a minimum size, while
  // keeping a sibling element's own coordinates locked to it" isn't
  // reliably solvable with aspect-ratio/min-width tricks across
  // browsers, so this is plain JS.
  //
  // Two separate source images, not one — a phone-shaped (9:16) canvas
  // wastes far less of itself on transparent padding than the square
  // desktop one does once actually cropped to a phone's own aspect
  // ratio, so mobile gets its own art drawn directly at that shape
  // rather than a crop of the square version. Both are the same burger
  // graphic at the same size (the video slot is pixel-for-pixel
  // identical, 1560x845, in both source files) — only the surrounding
  // canvas differs. IMG_W/IMG_H/HOLE_RECT below are each in their own
  // source file's own pixel space — easiest to re-derive from those
  // files directly if the art ever changes; the saved (smaller) .webp
  // files don't matter since this is all aspect-ratio math.
  //
  // 860px matches this site's own existing mobile breakpoint (see
  // videos.html/music.html/live.html's identical
  // `@media (max-width: 860px)`), reused here for the same "narrow
  // enough to count as a phone" cutoff rather than inventing a new one.
  var MOBILE_MAX_WIDTH = 860;
  // minVideoFrac floors the video's own size at a fraction of the
  // viewport on whichever axis binds, even if that means scaling past
  // plain cover-fit (and cropping further into whatever margin the art
  // has to spare) — desktop's square canvas genuinely needs this: plain
  // cover alone renders the video too small to read on an ordinary
  // desktop window once the background is this much bigger than the
  // video slot cut into it.
  //
  // Mobile's canvas doesn't have that problem, because it isn't a
  // generic oversized square being cropped down to a phone's shape — the
  // artist drew it AT roughly a phone's own aspect ratio on purpose, so
  // plain cover-fit already lands close to right on its own. A shared
  // floor value was tried across both variants (twice) and, each time,
  // ended up zooming mobile in far past what the art needed — confirmed
  // by checking the exact numbers: on a canvas already this close to a
  // real phone's shape, that floor's minimum-size guarantee was
  // routinely demanding MORE scale than cover-fit alone would ever
  // produce, not just topping it up when cover-fit fell short. minVideoFrac:
  // 0 for mobile means pure cover-fit, no artificial zoom via minVideoFrac
  // — zoom (below) is a separate, flat multiplier on top of whichever
  // scale (cover or floor) wins, for "just nudge it in/out a bit" asks
  // that aren't about guaranteeing a minimum size the way minVideoFrac
  // is. Mobile's zoom was requested directly, after pure cover-fit (1.0)
  // read as slightly too far zoomed OUT once seen live: first a nudge to
  // 1.15, then "25% more" on top of that (1.15 * 1.25 = 1.4375).
  //
  // pickles/zoomFrames are measured the same way HOLE_RECT was: by
  // registering the approved placement/zoom mockups against the art itself
  // (flat-colour landmarks — the door's glass strip, the window, the bun —
  // solved for uniform scale + translation), then expressing the result in
  // the art's own pixels. Desktop and mobile carry separate numbers on
  // purpose: the two variants frame the scene differently, and the mockups
  // put the pickles in deliberately different spots on each.
  //
  // zoomFrames are in the CLOSE-UP art's pixel space instead (see
  // PICKLE_ART) — a zoom multiplier over plain cover-fit, plus the point
  // that should sit dead centre of the viewport.
  var VARIANTS = {
    desktop: {
      src: '/hamburger-news-bg.webp',
      imgW: 8000, imgH: 8000,
      hole: { x: 3211, y: 3373, w: 1560, h: 845 },
      minVideoFrac: 0.25,
      zoom: 1,
      pickles: {
        episodes: { x: 3057, y: 4489, w: 678, h: 678 },
        games: { x: 4111, y: 4935, w: 726, h: 726 }
      },
      zoomFrames: {
        episodes: { zoom: 1.125, focusX: 1462, focusY: 1408 },
        games: { zoom: 1.123, focusX: 1541, focusY: 1519 }
      }
    },
    mobile: {
      src: '/hamburger-news-bg-mobile.webp',
      imgW: 4500, imgH: 8000,
      hole: { x: 1461, y: 3373, w: 1560, h: 845 },
      minVideoFrac: 0,
      zoom: 1.4375,
      pickles: {
        episodes: { x: 1313, y: 4700, w: 920, h: 920 },
        games: { x: 2109, y: 5448, w: 1198, h: 1198 }
      },
      zoomFrames: {
        episodes: { zoom: 1, focusX: 1378, focusY: 1514 },
        games: { zoom: 1, focusX: 1664, focusY: 1558 }
      }
    }
  };

  // Per-pickle facts that don't change with the breakpoint, all in the
  // CLOSE-UP art's own 3000x3000 pixel space.
  //
  // centre/faceW describe where the pickle actually sits inside that
  // drawing (measured off its green pixels) — the zoom animation needs
  // them to line the close-up's pickle up with the little button's pickle
  // at the moment it starts, so one grows out of the other instead of
  // cross-fading.
  //
  // btnGreen is the same thing for the BUTTON art: those PNGs carry
  // transparent padding, so the visible pickle is only a sub-rect of the
  // element, given here as fractions of it.
  //
  // grid is the 3x3 slot area, rotated to sit square on the pickle's face
  // — level for Games, tilted for Episodes, matching how each was drawn.
  // Only its WIDTH is given: the height falls out of LABEL_FRAC/GAP_FRAC
  // below, since each cell has to be tall enough for a square thumbnail
  // plus its title underneath. Moving the titles out from inside the
  // thumbnails made every cell taller, which is what pushed the old grids
  // (800/980 wide, square) over the pickle's outline — Episodes visibly
  // so, at the bottom-left, because rotating a now-tall block swings its
  // corners further out than a square one. So these were re-solved rather
  // than nudged: mask the pickle's own green face out of the close-up,
  // erode it for a margin, then take the largest grid whose rotated
  // corners all still land inside, backed off a little and re-centred on
  // the face. Hence the odd-looking exact numbers.
  var PICKLE_ART = {
    episodes: {
      closeup: '/hamburger-pickle-episodes-zoom.webp',
      centre: { x: 1378, y: 1514 }, faceW: 1472,
      btnGreen: { cx: 0.5190, cy: 0.4675, w: 0.9490 },
      grid: { cx: 1454, cy: 1457, w: 560, rot: -25.2 }
    },
    games: {
      closeup: '/hamburger-pickle-games-zoom.webp',
      centre: { x: 1664, y: 1558 }, faceW: 2085,
      btnGreen: { cx: 0.5168, cy: 0.4907, w: 0.9433 },
      grid: { cx: 1644, cy: 1444, w: 761, rot: 0 }
    }
  };
  var CLOSEUP_SIZE = 3000;
  // A splat as each pickle is hit, at the same half volume videos.html
  // plays its own click sounds at. Built once up front rather than as a
  // fresh Audio per click, so the file is already fetched and decoded when
  // the first pickle is hit and the sound lands with the zoom instead of
  // arriving after it.
  var PICKLE_SOUNDS = {};
  ['episodes:/splat1.mp3', 'games:/splat2.mp3'].forEach(function (pair) {
    var bits = pair.split(':');
    var a = new Audio(bits[1]);
    a.preload = 'auto';
    a.volume = 0.5;
    PICKLE_SOUNDS[bits[0]] = a;
  });
  function playSplat(name) {
    var a = PICKLE_SOUNDS[name];
    if (!a) return;
    // Rewind so a second hit re-triggers rather than doing nothing, and
    // swallow both failure modes — currentTime throws if the file never
    // loaded, play() rejects under an autoplay policy. Neither is worth
    // breaking the zoom over.
    try { a.currentTime = 0; } catch (err) {}
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  }
  // Share of each cell's height given over to the title strip under its
  // thumbnail, and the gutter between cells as a share of the grid's
  // width. Both are read back by layoutZoom — LABEL_FRAC also reaches the
  // CSS as --thumb-h, so the two can't drift apart.
  var LABEL_FRAC = 0.22;
  var GAP_FRAC = 0.035;
  // Arrow art's own aspect ratio, for sizing them from a width alone, plus
  // that width and the gap out to it — both as shares of the grid's width,
  // so the arrows scale with the pickle rather than with the window.
  var ARROW_RATIO = 473 / 560;
  var ARROW_FRAC = 0.42;
  var ARROW_GAP_FRAC = 0.18;

  // window.innerWidth/innerHeight lag behind on iOS Safari while the
  // address bar is animating in/out of view — visualViewport tracks the
  // actual visible area live and fires its own resize event when that
  // chrome changes, which plain 'resize' doesn't always do reliably.
  // Falls back to window sizing on browsers without the API.
  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  // Tracks which variant's src is currently loaded so layout() (called
  // on every resize/scroll tick) only ever touches stageBg.src when the
  // viewport actually crosses the mobile/desktop breakpoint, not on
  // every call — reassigning the same src repeatedly would otherwise
  // restart the image request/decode each time.
  var currentVariantName = null;

  function layout() {
    var vp = viewportSize();
    var variantName = vp.w <= MOBILE_MAX_WIDTH ? 'mobile' : 'desktop';
    var variant = VARIANTS[variantName];
    if (variantName !== currentVariantName) {
      currentVariantName = variantName;
      stageBg.src = variant.src;
    }
    var imgW = variant.imgW, imgH = variant.imgH, hole = variant.hole;
    var minVideoFrac = variant.minVideoFrac;
    var scale = Math.max(
      vp.w / imgW, vp.h / imgH,
      minVideoFrac * vp.w / hole.w, minVideoFrac * vp.h / hole.h
    ) * variant.zoom;
    var offX = (vp.w - imgW * scale) / 2;
    var offY = (vp.h - imgH * scale) / 2;
    stageBg.style.left = offX + 'px';
    stageBg.style.top = offY + 'px';
    stageBg.style.width = (imgW * scale) + 'px';
    stageBg.style.height = (imgH * scale) + 'px';
    pattySlot.style.left = (offX + hole.x * scale) + 'px';
    pattySlot.style.top = (offY + hole.y * scale) + 'px';
    pattySlot.style.width = (hole.w * scale) + 'px';
    pattySlot.style.height = (hole.h * scale) + 'px';

    // Pickles ride the same scale/offset as everything else, so they stay
    // pinned to their spots on the plate and the ketchup.
    Object.keys(PICKLE_BTNS).forEach(function (name) {
      var r = variant.pickles[name];
      var el = PICKLE_BTNS[name];
      el.style.left = (offX + r.x * scale) + 'px';
      el.style.top = (offY + r.y * scale) + 'px';
      el.style.width = (r.w * scale) + 'px';
      el.style.height = (r.h * scale) + 'px';
    });

    if (openPickle) layoutZoom(vp, variantName);
  }

  // ---------- ZOOM LAYOUT ----------
  // Cover-fit the close-up art, multiply by this variant's zoom, then put
  // the frame's focus point dead centre — the same shape of maths as
  // layout() above, just against the close-up's 3000x3000 space.
  function zoomFrame(vp, variantName, name) {
    var f = VARIANTS[variantName].zoomFrames[name];
    var scale = Math.max(vp.w / CLOSEUP_SIZE, vp.h / CLOSEUP_SIZE) * f.zoom;
    return {
      scale: scale,
      offX: vp.w / 2 - f.focusX * scale,
      offY: vp.h / 2 - f.focusY * scale
    };
  }

  function layoutZoom(vp, variantName) {
    var art = PICKLE_ART[openPickle];
    var fr = zoomFrame(vp, variantName, openPickle);
    zoomArt.style.left = fr.offX + 'px';
    zoomArt.style.top = fr.offY + 'px';
    zoomArt.style.width = (CLOSEUP_SIZE * fr.scale) + 'px';
    zoomArt.style.height = (CLOSEUP_SIZE * fr.scale) + 'px';

    // Cells are sized from the grid's width alone: three square thumbnails
    // across, then each cell grown taller by LABEL_FRAC to make room for
    // the title underneath. The grid's height is whatever that comes to,
    // which is why only the width is a tuned constant.
    var g = art.grid;
    var gw = g.w * fr.scale;
    var gap = gw * GAP_FRAC;
    var cw = (gw - 2 * gap) / 3;
    var ch = cw / (1 - LABEL_FRAC);
    var gh = 3 * ch + 2 * gap;
    slotsEl.style.width = gw + 'px';
    slotsEl.style.height = gh + 'px';
    slotsEl.style.left = (fr.offX + g.cx * fr.scale - gw / 2) + 'px';
    slotsEl.style.top = (fr.offY + g.cy * fr.scale - gh / 2) + 'px';
    slotsEl.style.transform = 'rotate(' + g.rot + 'deg)';
    slotsEl.style.gap = gap + 'px';
    slotsEl.style.setProperty('--thumb-h', (100 * (1 - LABEL_FRAC)).toFixed(3) + '%');
    // Sized off the CELL, not the whole grid, and specifically so that two
    // clamped lines still fit the strip under the thumbnail: that strip is
    // cw * LABEL_FRAC / (1 - LABEL_FRAC) tall, and 0.118 leaves room for
    // two lines of it plus the padding and descenders.
    slotsEl.style.fontSize = Math.max(8, cw * 0.118) + 'px';

    // Arrows sit just off the ends of the grid, along the GRID'S own
    // rotated axis rather than the viewport's — so they land at the two
    // ends of the pickle the way it was drawn: level either side for
    // Games, and up-right / down-left following the tilt for Episodes.
    // Only the placement rotates; the arrow art itself stays upright.
    var aw = Math.max(40, gw * ARROW_FRAC);
    var ah = aw * ARROW_RATIO;
    var off = gw / 2 + gw * ARROW_GAP_FRAC + aw / 2;
    var rad = g.rot * Math.PI / 180;
    var ox = Math.cos(rad) * off, oy = Math.sin(rad) * off;
    var gcx = fr.offX + g.cx * fr.scale;
    var gcy = fr.offY + g.cy * fr.scale;
    placeArrow(arrowPrev, gcx - ox, gcy - oy, aw, ah, vp);
    placeArrow(arrowNext, gcx + ox, gcy + oy, aw, ah, vp);
  }

  // Centred on the point worked out above, then nudged back inside the
  // viewport if the framing pushed it past an edge — on a phone the Games
  // pickle runs off both sides, which would otherwise leave half of an
  // arrow's tap target off-screen.
  function placeArrow(el, cx, cy, w, h, vp) {
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = Math.max(0, Math.min(vp.w - w, cx - w / 2)) + 'px';
    el.style.top = Math.max(0, Math.min(vp.h - h, cy - h / 2)) + 'px';
  }

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }

  // ---------- THE SLOT GRID ----------
  // Nine slots, because nine is what the art was drawn with. Anything past
  // that pages rather than shrinking the grid to fit.
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Same shapes of YouTube link admin.html accepts, reduced to the id so a
  // slot can show that episode's thumbnail (cropped square by the CSS).
  function extractVideoId(input) {
    if (!input) return null;
    var t = String(input).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
    var m = t.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function renderSlots() {
    if (!openPickle) return;
    var items = pickleItems[openPickle];

    // Games ships with nothing in it until admin.html has something to
    // point at, and nine dead slots read as broken rather than as empty.
    // Episodes keeps the plain grid — it's never actually empty, and its
    // greyed-out slots are the useful "this page isn't full" signal.
    var empty = openPickle === 'games' && !items.length;
    slotsEl.classList.toggle('is-empty', empty);
    if (empty) {
      slotsEl.innerHTML =
        '<div class="pickle-empty">sorry there’s no games added yet :( come back later</div>';
      setArrows(1);
      return;
    }

    var pages = Math.max(1, Math.ceil(items.length / SLOTS_PER_PAGE));
    if (picklePage[openPickle] > pages - 1) picklePage[openPickle] = pages - 1;
    var start = picklePage[openPickle] * SLOTS_PER_PAGE;

    var html = '';
    for (var i = 0; i < SLOTS_PER_PAGE; i++) {
      var item = items[start + i];
      var thumb = (item && item.thumb)
        ? '<img class="pickle-slot-thumb" src="' + escapeHtml(item.thumb) + '" alt="" loading="lazy">'
        : '';
      html += '<button type="button" class="pickle-slot" data-index="' + (start + i) + '"' +
        (item ? '' : ' disabled') + '>' +
        '<span class="pickle-slot-box">' + thumb + '</span>' +
        '<span class="pickle-slot-label">' + (item ? escapeHtml(item.title) : '') + '</span>' +
        '</button>';
    }
    slotsEl.innerHTML = html;
    setArrows(pages);
  }

  // With no page counter left on screen, the disabled states are the only
  // thing telling you where you are in the run, so they matter more than
  // they did when there was a "2 / 3" between them.
  function setArrows(pages) {
    var page = picklePage[openPickle] || 0;
    arrowPrev.hidden = arrowNext.hidden = pages < 2;
    arrowPrev.disabled = page === 0;
    arrowNext.disabled = page >= pages - 1;
  }

  function hideArrows() {
    ARROWS.forEach(function (a) { a.hidden = true; a.classList.remove('is-jump'); });
  }

  slotsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.pickle-slot') : null;
    if (!btn || btn.disabled || !openPickle || Date.now() < zoomReadyAt) return;
    var item = pickleItems[openPickle][parseInt(btn.dataset.index, 10)];
    if (!item) return;
    chooseItem(openPickle, item);
  });

  // Restarting the keyframe needs the class off, a reflow, then on again —
  // re-adding a class that's already there doesn't replay an animation, so
  // rapid paging would only pop the first press without this.
  function jump(el) {
    el.classList.remove('is-jump');
    void el.offsetWidth;
    el.classList.add('is-jump');
  }
  ARROWS.forEach(function (el) {
    el.addEventListener('animationend', function () { el.classList.remove('is-jump'); });
  });

  function turnPage(delta, el) {
    if (!openPickle) return;
    jump(el);
    var items = pickleItems[openPickle];
    var pages = Math.max(1, Math.ceil(items.length / SLOTS_PER_PAGE));
    var next = Math.min(pages - 1, Math.max(0, picklePage[openPickle] + delta));
    if (next === picklePage[openPickle]) return;
    picklePage[openPickle] = next;
    renderSlots();
  }
  // Click covers both a mouse click and a tap (touch has no hover, which
  // the CSS :hover pop handles on its own for pointers that do).
  arrowPrev.addEventListener('click', function () { turnPage(-1, arrowPrev); });
  arrowNext.addEventListener('click', function () { turnPage(1, arrowNext); });

  // Picking something zooms back out first, then hands it to the player —
  // the selection shouldn't happen behind a full-screen overlay.
  function chooseItem(kind, item) {
    closeZoom(function () {
      var frame = pattySlot.querySelector('iframe');
      if (!frame || !frame.contentWindow) return;
      if (kind === 'episodes') {
        frame.contentWindow.postMessage(
          { type: 'knobsock-hamburger-play', index: item.index }, '*');
      } else {
        // The game player isn't built yet; this is the handoff point for
        // when it is, and posting it now keeps that a one-sided change.
        frame.contentWindow.postMessage(
          { type: 'knobsock-hamburger-game', url: item.url, title: item.title }, '*');
      }
    });
  }

  // ---------- ZOOM IN / OUT ----------
  // The illusion is one continuous push-in: the scene scales up about the
  // pickle that was clicked, while the overlay starts life scaled down and
  // parked exactly over that same pickle, then settles to full frame. Both
  // halves are driven off the same factor, so they move together rather
  // than merely cross-fading.
  //
  // The scene deliberately does NOT fade out underneath. Fading both halves
  // at once left a window where neither was opaque and the page's own
  // background showed through the middle of the move — the "blink". Left at
  // full opacity it's simply overtaken by the close-up, which covers the
  // frame by the time it's done, and the stage is then hidden outright
  // rather than faded. That also keeps the pickles themselves on screen for
  // the whole of the way back out, since they ride the stage: they're
  // visible again the instant a zoom-out starts, rather than popping back
  // once it finishes.
  function openTransform(name) {
    var vp = viewportSize();
    var variantName = vp.w <= MOBILE_MAX_WIDTH ? 'mobile' : 'desktop';
    var art = PICKLE_ART[name];
    var btn = PICKLE_BTNS[name].getBoundingClientRect();
    var g = art.btnGreen;
    // where the button's own pickle actually is on screen right now
    var fromX = btn.left + g.cx * btn.width;
    var fromY = btn.top + g.cy * btn.height;
    var fromW = g.w * btn.width;
    // where that same pickle ends up once the close-up is full frame
    var fr = zoomFrame(vp, variantName, name);
    var toX = fr.offX + art.centre.x * fr.scale;
    var toY = fr.offY + art.centre.y * fr.scale;
    var toW = art.faceW * fr.scale;
    var k = toW > 0 ? fromW / toW : 0.2;
    return {
      k: k,
      // transform-origin is 0 0, so translate first, then scale about the
      // pickle's landing point
      inner: 'translate(' + (fromX - toX * k) + 'px, ' + (fromY - toY * k) + 'px) scale(' + k + ')',
      stage: { originX: fromX, originY: fromY, scale: 1 / k }
    };
  }

  var zoomAnimTimer = null;
  // The tap that opens the overlay can land a second time on whatever the
  // overlay just put under the pointer — a real touch-device behaviour (the
  // synthesised mouse click arrives after the element has appeared), not
  // just an automation quirk. Without this, opening a pickle could dismiss
  // it again, or worse, pick whichever slot happened to be under the thumb.
  var zoomReadyAt = 0;

  function openZoom(name) {
    if (openPickle) return;
    openPickle = name;
    picklePage[name] = 0;
    zoomReadyAt = Date.now() + 350;
    playSplat(name);

    zoomArt.src = PICKLE_ART[name].closeup;
    zoomEl.hidden = false;
    renderSlots();
    layout();

    var t = openTransform(name);
    zoomEl.classList.remove('is-animating', 'is-closing');
    zoomEl.style.opacity = '0';
    zoomInner.style.transform = t.inner;
    stageWrap.classList.remove('is-zooming');
    stageWrap.style.transformOrigin = t.stage.originX + 'px ' + t.stage.originY + 'px';

    // Commit the "from" state with a forced reflow rather than waiting on
    // requestAnimationFrame — rAF doesn't fire at all in a backgrounded
    // tab, which would strand the overlay mid-animation (invisible, still
    // scaled down) instead of just skipping the animation. Reading
    // offsetWidth flushes style synchronously, so the transition below
    // always has a previous value to run from, and the end state is
    // correct even where transitions never run at all.
    void zoomEl.offsetWidth;

    zoomEl.classList.add('is-animating');
    stageWrap.classList.add('is-zooming');
    zoomEl.style.opacity = '1';
    zoomInner.style.transform = 'translate(0px, 0px) scale(1)';
    stageWrap.style.transform = 'scale(' + t.stage.scale + ')';

    backLink.textContent = '← Back';
    backLink.setAttribute('href', '#');
    document.addEventListener('keydown', onZoomKey);

    clearTimeout(zoomAnimTimer);
    zoomAnimTimer = setTimeout(function () {
      // once settled, drop the overlay's transition so a resize repositions
      // it instantly rather than sliding to the new spot. The stage keeps
      // is-zooming: nothing else ever transforms it, and holding its
      // compositor layer means the way back out starts moving immediately
      // instead of spending its first frames being promoted again.
      zoomEl.classList.remove('is-animating');
      // Hidden rather than faded — the overlay covers it by now anyway, and
      // this is what stops the pickles underneath from taking a stray tap
      // while zoomed (visibility:hidden kills pointer events too), which is
      // why they don't need [hidden] of their own here.
      stageWrap.style.visibility = 'hidden';
    }, 500);
  }

  function closeZoom(done) {
    if (!openPickle) return;
    var name = openPickle;
    // Back on screen for the whole way out, pickles included.
    stageWrap.style.visibility = '';
    var t = openTransform(name);

    zoomEl.classList.add('is-animating', 'is-closing');
    stageWrap.classList.add('is-zooming');
    zoomEl.style.opacity = '0';
    zoomInner.style.transform = t.inner;
    stageWrap.style.transform = 'scale(1)';

    openPickle = null;
    hideArrows();
    document.removeEventListener('keydown', onZoomKey);
    backLink.textContent = '← Back to Videos';
    backLink.setAttribute('href', '/videos');

    clearTimeout(zoomAnimTimer);
    zoomAnimTimer = setTimeout(function () {
      zoomEl.hidden = true;
      zoomEl.classList.remove('is-animating', 'is-closing');
      stageWrap.classList.remove('is-zooming');
      stageWrap.style.transform = '';
      layout();
      if (done) done();
    }, 480);
  }

  function onZoomKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') closeZoom();
  }

  Object.keys(PICKLE_BTNS).forEach(function (name) {
    PICKLE_BTNS[name].addEventListener('click', function () { openZoom(name); });
  });

  // Tapping the art around the grid backs out, same as Escape — without
  // this the only way out of a zoom would be to pick something.
  zoomEl.addEventListener('click', function (e) {
    if (Date.now() < zoomReadyAt) return;
    if (e.target === zoomEl || e.target === zoomInner || e.target === zoomArt) closeZoom();
  });

  // The back link doubles as the way out while zoomed (it has nothing else
  // to do up there, and adding a second chip would just be more chrome).
  backLink.addEventListener('click', function (e) {
    if (!openPickle) return;
    e.preventDefault();
    closeZoom();
  });

  // ---------- LIVE DATA ----------
  // Episodes come from the same playlist/hamburgerNews doc the player
  // itself reads (admin.html's Hamburger News list); games from the Games
  // tab added alongside it. Both live-update, matching how every other
  // admin-fed surface on this site behaves.
  if (window.firebase) {
    var db = firebase.firestore(
      firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG));

    db.collection('playlist').doc('hamburgerNews').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var raw = (data && Array.isArray(data.videos)) ? data.videos : [];
      pickleItems.episodes = raw.map(function (v, i) {
        var id = extractVideoId(v.url);
        return {
          index: i,
          title: (v.title && v.title.trim()) ? v.title.trim() : ('Episode ' + (i + 1)),
          url: v.url || '',
          thumb: id ? ('https://img.youtube.com/vi/' + id + '/mqdefault.jpg') : ''
        };
      });
      if (openPickle === 'episodes') renderSlots();
    }, function (err) { console.error('Hamburger News episodes sync failed', err); });

    db.collection('playlist').doc('hamburgerGames').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var raw = (data && Array.isArray(data.games)) ? data.games : [];
      pickleItems.games = raw
        .filter(function (g) { return g && g.url; })
        .map(function (g, i) {
          return {
            index: i,
            title: (g.title && g.title.trim()) ? g.title.trim() : ('Game ' + (i + 1)),
            url: g.url,
            thumb: (g.thumb && g.thumb.trim()) ? g.thumb.trim() : ''
          };
        });
      if (openPickle === 'games') renderSlots();
    }, function (err) { console.error('Hamburger News games sync failed', err); });
  }
})();
</script>
