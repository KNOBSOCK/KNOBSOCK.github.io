<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos/hamburgernews">
<meta property="og:title" content="Hamburger News - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">

<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with a drawn-scene background: hamburger-news-bg.webp
     is a single 8000x8000 illustrated room (door, window, floor,
     spotlight, burger), drawn edge-to-edge at that huge size specifically
     so cover-fit crop always has room to spare before it could ever reach
     the door/window/burger/plate — the artist's own fix for the earlier,
     much-smaller-canvas version, which needed careful (and fragile)
     padding-amount math to get the same guarantee. The video's slot is
     the one part of that canvas left transparent (a clean rectangle,
     3200,3371 to 4781,4219 in the source file's own pixel space).

     #stageBg and #pattySlot (the video) are both positioned by the same
     JS layout() below rather than CSS object-fit:cover — see that
     function's own comment for why a plain CSS cover-fit can't also
     guarantee the video a legible minimum size, which this needs on top
     of the base cover math (confirmed: without a floor, the video renders
     under 150px tall on an ordinary desktop window against a canvas this
     size — technically "not cropped", but unreadably small in practice). */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* Sampled from the art's own floor color. Cover-fit means this
       should never actually show, but it's the fallback for the instant
       before the background image loads, and stops Safari's elastic
       overscroll bounce from flashing white in the meantime. */
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Positioned by layout() below — no CSS width/height/object-fit here,
     since those would fight the JS for control of this element's size. */
  .stage-bg {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }

  /* The video, likewise positioned by layout(). */
  .patty-slot {
    position: fixed;
    z-index: 1;
    background: #000;
    overflow: hidden;
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .back-link {
    position: fixed;
    top: clamp(10px, 2.5vw, 20px);
    left: clamp(10px, 2.5vw, 20px);
    z-index: 3;
    color: #ffd479;
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 700;
    text-decoration: underline;
    opacity: 0.85;
    /* The page behind this link is illustrated art, not a flat color —
       contrast isn't guaranteed (light bun art can sit right under it),
       so this needs its own legibility net. */
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  .back-link:hover { opacity: 1; }

  /* Real-viewport fullscreen fallback for hamburger-news-widget.html's
     own fullscreen button. That widget lives in an iframe, and on iOS
     Safari — which has no Fullscreen API at all for non-video elements —
     it falls back to a CSS position:fixed trick that can only ever cover
     the IFRAME'S OWN box, not the actual phone screen (position:fixed's
     containing block is the iframe's own viewport). The widget posts a
     message here instead, and this class — applied to the real iframe
     element in THIS top-level document — takes over the actual screen;
     the iframe's own contents (already 100% width/height inside it) grow
     to fill it right along with it. Needs its own z-index above
     #stageBg's 2, or the illustrated art would paint over the fullscreen
     video. */
  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }
</style>
</head>
<body>

<a class="back-link" href="/videos">&larr; Back to Videos</a>

<div class="patty-slot" id="pattySlot">
  <iframe src="/hamburger-news-widget.html"
          title="Hamburger News"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          allowfullscreen></iframe>
</div>

<img class="stage-bg" id="stageBg" src="/hamburger-news-bg.webp" alt="">

<script>
(function () {
  var pattySlot = document.getElementById('pattySlot');
  var stageBg = document.getElementById('stageBg');
  // Relayed from hamburger-news-widget.html's own fullscreen fallback —
  // see .patty-slot.hn-fullscreen's own comment above for why this has
  // to happen up here rather than inside that iframe.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-fullscreen') return;
    pattySlot.classList.toggle('hn-fullscreen', !!e.data.active);
  });

  // ---------- STAGE LAYOUT ----------
  // #stageBg and #pattySlot are positioned by hand rather than via CSS
  // object-fit:cover, for two reasons: cover's own scale formula has no
  // notion of "never smaller than X" (see MIN_VIDEO_FRAC_DESKTOP/MOBILE
  // below), and the two elements have to move in exact lockstep — if the
  // background used object-fit:cover while the video used a floored
  // scale, they'd zoom at different rates and drift apart. A pure-CSS
  // version of "cover this box, but never go below a minimum size, while
  // keeping a sibling element's own coordinates locked to it" isn't
  // reliably solvable with aspect-ratio/min-width tricks across
  // browsers, so this is plain JS.
  //
  // IMG_W/IMG_H and HOLE_RECT are in the source art's own pixel space
  // (8000x8000) — easiest to re-derive from the source file directly if
  // the art ever changes; the saved (smaller) hamburger-news-bg.webp
  // doesn't matter since this is all aspect-ratio math.
  var IMG_W = 8000, IMG_H = 8000;
  var HOLE_RECT = { x: 3200, y: 3371, w: 1581, h: 848 };
  // Plain cover-fit scale alone renders the video too small to read on
  // an ordinary desktop window once the background canvas is this much
  // bigger than the video slot cut into it — this floors the video's own
  // size at a fraction of the viewport on whichever axis binds, even if
  // that means scaling past cover-fit (and cropping further into the
  // huge margin the art already has to spare for exactly this).
  //
  // Two different fractions, not one shared constant: a mobile-specific
  // request (burger filling nearly the whole screen, spotlight cropped
  // at the bottom rather than tapering into empty space) previously got
  // implemented by raising this one number, which — being unconditional —
  // changed desktop too, along with overshooting on the actual phone it
  // was meant for (checked against a ~380x720 desktop-browser viewport
  // standing in for a phone, which isn't the same thing as one). 860px
  // is this site's own existing mobile breakpoint (see videos.html/
  // music.html/live.html's identical `@media (max-width: 860px)`), reused
  // here for the same "narrow enough to count as a phone" cutoff rather
  // than inventing a new one.
  var MIN_VIDEO_FRAC_DESKTOP = 0.25;
  var MIN_VIDEO_FRAC_MOBILE = 0.28;
  var MOBILE_MAX_WIDTH = 860;

  // window.innerWidth/innerHeight lag behind on iOS Safari while the
  // address bar is animating in/out of view — visualViewport tracks the
  // actual visible area live and fires its own resize event when that
  // chrome changes, which plain 'resize' doesn't always do reliably.
  // Falls back to window sizing on browsers without the API.
  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  function layout() {
    var vp = viewportSize();
    var minVideoFrac = vp.w <= MOBILE_MAX_WIDTH ? MIN_VIDEO_FRAC_MOBILE : MIN_VIDEO_FRAC_DESKTOP;
    var scale = Math.max(
      vp.w / IMG_W, vp.h / IMG_H,
      minVideoFrac * vp.w / HOLE_RECT.w, minVideoFrac * vp.h / HOLE_RECT.h
    );
    var offX = (vp.w - IMG_W * scale) / 2;
    var offY = (vp.h - IMG_H * scale) / 2;
    stageBg.style.left = offX + 'px';
    stageBg.style.top = offY + 'px';
    stageBg.style.width = (IMG_W * scale) + 'px';
    stageBg.style.height = (IMG_H * scale) + 'px';
    pattySlot.style.left = (offX + HOLE_RECT.x * scale) + 'px';
    pattySlot.style.top = (offY + HOLE_RECT.y * scale) + 'px';
    pattySlot.style.width = (HOLE_RECT.w * scale) + 'px';
    pattySlot.style.height = (HOLE_RECT.h * scale) + 'px';
  }

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }
})();
</script>

</body>
</html>
