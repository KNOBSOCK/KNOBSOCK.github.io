<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos/hamburgernews">
<meta property="og:title" content="Hamburger News - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hamburger News - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with its own condiment palette (mustard/ketchup)
     instead of reusing the plain Videos page's blue — this is a themed
     one-off, not another entry in the main Video List. The whole point
     of the page is the burger-stack below: BURGER TOP.PNG and BURGER
     BOTTOM.PNG sandwich hamburger-news-widget.html's iframe directly,
     with ZERO gap on either seam — both PNGs were exported with their
     bun art touching that exact edge of their own canvas (verified by
     inspecting each file's alpha channel: the top image's content runs
     all the way to its own bottom edge, the bottom image's content runs
     all the way to its own top edge), so simple edge-to-edge stacking
     is enough on its own to read as one continuous burger cross-
     section — no manual negative-margin tuning needed. */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #2b1204;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(10px, 2.5vw, 20px);
    padding: clamp(14px, 3vw, 28px) clamp(10px, 3vw, 24px) clamp(24px, 5vw, 48px);
  }

  /* The whole sandwich, sized by width alone by default (each piece's
     own height follows from its own aspect-ratio below) — fine on
     desktop and on a normal portrait phone, where this width already
     resolves to something short enough to fit one screen tall. The
     landscape media query further down swaps this to a height-driven
     size instead, for the case (a phone rotated sideways) where it
     wouldn't. */
  .burger-stack {
    width: min(92vw, 780px);
    flex: none;
  }

  /* Invisible by default (display:contents drops its own box, promoting
     .burger-stack to be .page's direct flex child, unchanged from before
     this wrapper existed) — only becomes a real flex box in the landscape
     query below, where it needs to be a sizing context of its own. */
  .burger-wrap {
    display: contents;
  }

  .burger-top,
  .burger-bottom {
    display: block;
    width: 100%;
    height: auto;
  }
  /* Intrinsic aspect-ratio of the source PNGs — reserves the right
     amount of vertical space before the image itself has loaded, so
     nothing jumps into place after the fact. */
  .burger-top { aspect-ratio: 2126 / 855; }
  .burger-bottom { aspect-ratio: 2126 / 670; }

  /* The "patty" — a true 16:9 embed sandwiched directly between the two
     bun images with no gap on either edge (see the top-of-file comment
     for why that's safe to do edge-to-edge). A soft border-radius
     rounds off what would otherwise be hard rectangular corners poking
     out from under the buns' own organic silhouette — enough to blend
     in at a glance, not enough to look like a rounded video player
     sitting on top of a burger photo. */
  .patty-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: clamp(6px, 1.6vw, 14px);
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .back-link {
    color: #ffd479;
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 700;
    text-decoration: underline;
    opacity: 0.85;
  }
  .back-link:hover { opacity: 1; }

  /* Real-viewport fullscreen fallback for hamburger-news-widget.html's
     own fullscreen button. That widget lives in an iframe, and on iOS
     Safari — which has no Fullscreen API at all for non-video elements —
     it falls back to a CSS position:fixed trick that can only ever cover
     the IFRAME'S OWN box, not the actual phone screen (position:fixed's
     containing block is the iframe's own viewport, same constraint
     live.html's tap-in overlay comment documents). The widget posts a
     message here instead, and this class — applied to the real iframe
     element in THIS top-level document — takes over the actual screen;
     the iframe's own contents (already 100% width/height inside it)
     grow to fill it right along with it. */
  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
    border-radius: 0;
  }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it scroll — same convention as videos.html/music.html/
     live.html, even though the top-of-file comment above originally
     argued scrolling here was harmless (true in isolation, but
     inconsistent with every other page on this site never scrolling on
     phone, which is the more important bar to match). A typical
     portrait phone already fits the width-driven .burger-stack below
     within one screen without any changes here — this mainly matters
     for the landscape case just below, where a short viewport needs
     the stack resized by HEIGHT instead of width to keep fitting. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page { height: 100vh; height: 100dvh; }
  }

  /* Phone rotated to landscape: same one-screen lock as the portrait
     rule above. An earlier version of this sized .burger-stack purely by
     HEIGHT, keeping the whole sandwich's own combined proportions (2126
     wide by 855 + patty-at-16:9 + 670 tall) intact — but that ratio is
     itself portrait-shaped (taller than wide), so on an actual landscape
     phone (always wider than it is tall) height was ALWAYS the binding
     constraint, and preserving that portrait-shaped ratio inside a wide
     short box left most of the screen's width empty with a narrow little
     video in the middle — confirmed by rendering it: a 812x375 viewport
     produced a stack barely 212px wide.
     Fixed by no longer keeping the buns and the video locked to one
     fixed combined ratio at all: the buns shrink to a small fixed strip
     (--bun-h, cropped via object-fit instead of scaling with the video),
     and .burger-stack's width is solved for directly — the larger of
     "fill the available width" or "the width that makes the video's own
     16:9 patty-slot exactly fill whatever height is left after the two
     bun strips" is capped by whichever is smaller via min(), so it never
     overflows either axis. That needs .burger-wrap as an explicitly
     sized (container-type:size) box to measure 100cqw/100cqh against —
     align-self:stretch gives it a definite height (.page's own align-
     items:center would otherwise only hug it to its content, which is
     circular: the content's size is what this is trying to solve for).
     hover:none + pointer:coarse (true only for touchscreens) matter
     here for the same reason as those other pages' identical guard: an
     ordinary desktop window is "landscape" by nature and often under
     860px tall too (a laptop screen minus its own chrome), so
     max-height + orientation alone would also catch a normal desktop
     visit. */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      flex-direction: row;
      justify-content: center;
      padding: clamp(8px, 2vh, 16px);
      gap: clamp(8px, 2vw, 16px);
    }
    .burger-wrap {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      container-type: size;
    }
    .burger-stack {
      --bun-h: clamp(8px, 3vh, 24px);
      width: min(100cqw, calc((100cqh - 2 * var(--bun-h)) * 16 / 9));
      height: auto;
    }
    .burger-top,
    .burger-bottom {
      height: var(--bun-h);
      aspect-ratio: auto;
      object-fit: cover;
    }
    .back-link { flex: none; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="back-link" href="/videos">&larr; Back to Videos</a>

  <div class="burger-wrap">
    <div class="burger-stack">
      <img class="burger-top" src="/BURGER%20TOP.PNG" alt="">
      <div class="patty-slot" id="pattySlot">
        <iframe src="/hamburger-news-widget.html"
                title="Hamburger News"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                allowfullscreen></iframe>
      </div>
      <img class="burger-bottom" src="/BURGER%20BOTTOM.PNG" alt="">
    </div>
  </div>
</div>

<script>
(function () {
  var pattySlot = document.getElementById('pattySlot');
  // Relayed from hamburger-news-widget.html's own fullscreen fallback —
  // see .patty-slot.hn-fullscreen's own comment above for why this has
  // to happen up here rather than inside that iframe.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-fullscreen') return;
    pattySlot.classList.toggle('hn-fullscreen', !!e.data.active);
  });
})();
</script>

</body>
</html>
