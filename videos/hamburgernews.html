  * { box-sizing: border-box; }

  @font-face {
    font-family: 'Gratis Neue';

    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;

    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Zoom animates left/top/width/height directly rather than CSS-
     transform-scaling a parent, so the browser always lays out and
     paints at the real final pixel size — a transform: scale() would
     instead stretch an already-rasterized bitmap captured at the
     smaller pre-zoom size, blurring it regardless of source
     resolution. Same technique as videos.html's room zoom. */
  .stage-bg,
  .patty-slot,
  .hn-header {
    transition: left 0.46s cubic-bezier(0.33, 0, 0.2, 1), top 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      width 0.46s cubic-bezier(0.33, 0, 0.2, 1), height 0.46s cubic-bezier(0.33, 0, 0.2, 1),
      opacity 0.3s ease;

  .stage-bg, .patty-slot, .hn-header, .pickle-btn {
    contain: layout paint;
  }

  .stage-bg {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }

  .patty-slot {
    position: fixed;
    z-index: 1;
    background: #000;
    overflow: hidden;
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* While a pickle is zoomed, only the background keeps moving (for a
     sense of the camera pushing in) — the header, the video hole, and
     both pickle buttons themselves just fade out in place rather than
     visibly scaling up. Scaling the button art to fill the screen
     looked like a big ugly zooming graphic; fading it out instead
     leaves only the thumbnail/label card (see #pickleSlots) as the
     thing that visibly animates in. */
  .stage-wrap.pickle-zoomed .patty-slot,
  .stage-wrap.pickle-zoomed .hn-header,
  .stage-wrap.pickle-zoomed .pickle-btn {
    opacity: 0;
    pointer-events: none;
  }

    color: #ffd479;
    font-size: clamp(16.5px, 3.3vw, 19.5px);
    font-weight: 700;
    text-decoration: none;
    opacity: 0.85;

    -webkit-text-stroke: 0.5px #000;
    text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;
  }
  .back-link:hover { opacity: 1; }

    background: none;
    border: 0;
    cursor: pointer;
    opacity: 0.85;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: -0.5px -0.5px 0 #000, 0.5px -0.5px 0 #000, -0.5px 0.5px 0 #000, 0.5px 0.5px 0 #000;

  .hn-copy-link:hover { opacity: 1; }
  .hn-copy-link[hidden] { display: none; }

  .hn-header {
    position: fixed;
    z-index: 3;
    display: block;

    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;

  .stage-wrap {

  .pickle-slots {

    grid-template-rows: 1fr;

    transform: scale(1);

  .pickle-slot:not(:disabled):active { transform: scale(0.96); }
  .pickle-slot:disabled { cursor: default; }

  .pickle-slots.is-empty {

    align-items: center;
    justify-content: center;
  }
  .pickle-empty {
    padding: 0 6%;
    text-align: center;
    color: #ffffff;
    font-family: 'Gratis Neue', Arial, sans-serif;

    font-size: var(--empty-font, 0.5em);

    -webkit-text-stroke: 0.5px #000;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;

  .pickle-arrow {
    position: fixed;
    z-index: 21;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transform-origin: 50% 50%;

    transform: rotate(var(--arrow-rot, 0deg));
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
  }
  .pickle-arrow[hidden] { display: none; }
  .pickle-arrow img {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-user-drag: none;
    user-select: none;
  }
  .pickle-arrow:not(:disabled):hover { transform: rotate(var(--arrow-rot, 0deg)) scale(1.12); }
  .pickle-arrow:not(:disabled):active { transform: rotate(var(--arrow-rot, 0deg)) scale(0.95); }
  .pickle-arrow:disabled { opacity: 0.3; cursor: default; }

  .pickle-arrow.is-jump { animation: pickleArrowJump 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #pickleNext.is-jump { animation-name: pickleArrowJumpNext; }
  @keyframes pickleArrowJump {
    0%   { transform: rotate(var(--arrow-rot, 0deg)) translateX(0) scale(1); }
    38%  { transform: rotate(var(--arrow-rot, 0deg)) translateX(-14%) scale(1.3); }
    100% { transform: rotate(var(--arrow-rot, 0deg)) translateX(0) scale(1); }
  }
  @keyframes pickleArrowJumpNext {
    0%   { transform: rotate(var(--arrow-rot, 0deg)) translateX(0) scale(1); }
    38%  { transform: rotate(var(--arrow-rot, 0deg)) translateX(14%) scale(1.3); }
    100% { transform: rotate(var(--arrow-rot, 0deg)) translateX(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pickle-arrow.is-jump { animation: none; }
  }

  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }

  .stage-bg.hn-bg-hidden {
    visibility: hidden;
  }
</style>

  });

  var MOBILE_MAX_WIDTH = 860;

  var VARIANTS = {
    desktop: {
      src: '/hamburger-news-bg.webp',
      imgW: 8000, imgH: 8000,
      hole: { x: 3211, y: 3373, w: 1560, h: 845 },
      minVideoFrac: 0.25,
      zoom: 1,
      // Also the box that gets cover-fit to the viewport when that
      // pickle is zoomed (same technique as videos.html's TV bezel) —
      // the pickle's own drawn box, art-space, no separate zoom-frame
      // measurement needed since we're zooming the real art now.
      pickles: {
        episodes: { x: 3057, y: 4489, w: 678, h: 678 },
        games: { x: 4111, y: 4935, w: 726, h: 726 }
      }
    },
    mobile: {
      src: '/hamburger-news-bg-mobile.webp',
      imgW: 4500, imgH: 8000,
      hole: { x: 1461, y: 3373, w: 1560, h: 845 },
      minVideoFrac: 0,
      zoom: 1.4375,
      pickles: {
        episodes: { x: 1313, y: 4700, w: 920, h: 920 },
        games: { x: 2109, y: 5448, w: 1198, h: 1198 }
      }
    }
  };

  // hole.y/w/h are identical between desktop and mobile (only hole.x
  // shifts), so the header is sized/placed purely off hole.w and the
  // gap up from hole.y, in the SAME art-space scale/offset layout()
  // already computes for everything else — no separate per-variant
  // measurement needed. Ratios were measured directly off the artist's
  // own placement mockup (title top / subtitle bottom relative to the
  // hole) rather than guessed.
  var HEADER = {
    aspect: 3945 / 959,
    widthFrac: 1.72,
    bottomGapFrac: 0.2205
  };

  // The pickle button itself fades out rather than staying on screen as
  // a frame (see the .pickle-zoomed CSS), so the thumbnail/label card
  // is just a modest, plain, screen-centered rectangle — only episodes
  // needs a fixed video aspect for its thumbnail; games has none and
  // falls back to a plain squarish card.
  var PICKLE_THUMB_ASPECT = { episodes: 16 / 9 };

  function loadSound(src, volume) {
    var a = new Audio(src);
    a.preload = 'auto';
    a.volume = volume;
    return a;
  }
  function playSound(a) {
    if (!a) return;
    try { a.currentTime = 0; } catch (err) {}
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  }

  var PICKLE_SOUNDS = {
    episodes: loadSound('/splat1.mp3', 0.5),
    games: loadSound('/splat2.mp3', 0.5)
  };
  function playSplat(name) { playSound(PICKLE_SOUNDS[name]); }

  var PICK_SOUND = loadSound('/squish3.m4a', 0.5);
  var ZOOM_OUT_SOUND = loadSound('/woosh.m4a', 0.5);

  var ARROW_RATIO = 473 / 560;
  var ARROW_FRAC = 0.42;
  var ARROW_GAP_FRAC = 0.18;

  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  var currentVariantName = null;
  var layoutBox = null;

  // Mobile Safari fires visualViewport resize/scroll repeatedly during an
  // ordinary tap (toolbar show/hide, elastic bounce), each re-running
  // layout(). Writing sub-pixel-different values every time restarts the
  // left/top/width/height transitions mid-flight — skip the write when
  // the value hasn't meaningfully changed so an in-progress transition
  // is left alone. Same fix as videos.html.
  function setStyleIfChanged(el, prop, px) {
    var current = parseFloat(el.style[prop]);
    if (!isNaN(current) && Math.abs(current - px) < 0.5) return;
    el.style[prop] = px + 'px';
  }

  function layout() {
    var vp = viewportSize();
    var variantName = vp.w <= MOBILE_MAX_WIDTH ? 'mobile' : 'desktop';
    var variant = VARIANTS[variantName];
    if (variantName !== currentVariantName) {
      currentVariantName = variantName;
      stageBg.src = variant.src;
    }
    var imgW = variant.imgW, imgH = variant.imgH, hole = variant.hole;
    var minVideoFrac = variant.minVideoFrac;
    var scale = Math.max(
      vp.w / imgW, vp.h / imgH,
      minVideoFrac * vp.w / hole.w, minVideoFrac * vp.h / hole.h
    ) * variant.zoom;
    var offX = (vp.w - imgW * scale) / 2;
    var offY = (vp.h - imgH * scale) / 2;
    stageBg.style.left = offX + 'px';
    stageBg.style.top = offY + 'px';
    stageBg.style.width = (imgW * scale) + 'px';
    stageBg.style.height = (imgH * scale) + 'px';
    pattySlot.style.left = (offX + hole.x * scale) + 'px';
    pattySlot.style.top = (offY + hole.y * scale) + 'px';
    pattySlot.style.width = (hole.w * scale) + 'px';
    pattySlot.style.height = (hole.h * scale) + 'px';

    var hdrWidthFrac = HEADER.widthFrac * (variantName === 'desktop' ? 0.5 : 1);
    var hdrW = hole.w * hdrWidthFrac * scale;
    var hdrH = hdrW / HEADER.aspect;
    var hdrBottomArt = hole.y - hole.w * HEADER.bottomGapFrac;
    var hdrTop = offY + hdrBottomArt * scale - hdrH;
    // The bun-overlap position above is tied to hole.y, which cover-fit
    // can push well down the viewport on a narrow/tall phone (a much
    // bigger crop of a SQUARE image is needed to cover a tall aspect,
    // and that crop's own math leaves more wall showing above the bun
    // there than on desktop's wider aspect) — clamped so the header
    // never sits lower than a small top inset, same idea as back-link's
    // own clamp() just below. Also guards the opposite failure on a very
    // wide/short desktop window, where the same hole.y-based math can
    // go negative and push the header off the top of the screen.
    hdrTop = Math.max(6, Math.min(hdrTop, vp.h * 0.045));
    hnHeader.style.width = hdrW + 'px';
    hnHeader.style.height = hdrH + 'px';
    hnHeader.style.left = (offX + (hole.x + hole.w / 2) * scale - hdrW / 2) + 'px';
    hnHeader.style.top = hdrTop + 'px';

    Object.keys(PICKLE_BTNS).forEach(function (name) {
      var r = variant.pickles[name];
      var el = PICKLE_BTNS[name];
      el.style.left = (offX + r.x * scale) + 'px';
      el.style.top = (offY + r.y * scale) + 'px';
      el.style.width = (r.w * scale) + 'px';
      el.style.height = (r.h * scale) + 'px';
    });

    layoutBox = { ox: offX, oy: offY, s: scale, v: variant };

    if (openPickle) applyPickleZoom();
  }

  function zoomedRect(el, tx, ty, k) {
    var left = parseFloat(el.style.left) || 0;
    var top = parseFloat(el.style.top) || 0;
    var w = parseFloat(el.style.width) || 0;
    var h = parseFloat(el.style.height) || 0;
    return { left: tx + left * k, top: ty + top * k, width: w * k, height: h * k };
  }

  function zoomifyElement(el, tx, ty, k) {
    var r = zoomedRect(el, tx, ty, k);
    setStyleIfChanged(el, 'left', r.left);
    setStyleIfChanged(el, 'top', r.top);
    setStyleIfChanged(el, 'width', r.width);
    setStyleIfChanged(el, 'height', r.height);
  }

  // Cover-fits the OPEN pickle's own art-space box to the viewport —
  // same technique videos.html uses for the TV bezel — and applies
  // that translate+scale to the background only, for a sense of the
  // camera pushing in. The pickle buttons themselves no longer scale
  // up with it (see the .pickle-zoomed CSS fade) — only the
  // thumbnail/label card visibly animates in, placed independently by
  // positionPickleSlots.
  function applyPickleZoom() {
    if (!layoutBox || !openPickle) return;
    var vp = viewportSize();
    var v = layoutBox.v, s = layoutBox.s, ox = layoutBox.ox, oy = layoutBox.oy;
    var b = v.pickles[openPickle];
    var k = Math.max(vp.w / b.w, vp.h / b.h) / s;
    var boxCenterX = ox + (b.x + b.w / 2) * s;
    var boxCenterY = oy + (b.y + b.h / 2) * s;
    var tx = vp.w / 2 - boxCenterX * k;
    var ty = vp.h / 2 - boxCenterY * k;

    zoomifyElement(stageBg, tx, ty, k);

    positionPickleSlots(vp);
  }

  // A modest, plain (unrotated) card centered on screen — sized off the
  // viewport, not off the pickle art, since the pickle itself just
  // fades away rather than staying visible as a frame to match.
  var CARD_MAX_W = 520;
  var CARD_LABEL_TO_THUMB_FRAC = 0.32;

  function positionPickleSlots(vp) {
    var thumbAspect = PICKLE_THUMB_ASPECT[openPickle];
    var gw = Math.max(220, Math.min(vp.w * 0.62, vp.h * 0.62, CARD_MAX_W));
    var thumbH, labelH, gh;
    if (thumbAspect) {
      thumbH = gw / thumbAspect;
      labelH = thumbH * CARD_LABEL_TO_THUMB_FRAC;
      gh = thumbH + labelH;
    } else {
      gh = gw * 0.82;
      labelH = gh;
      thumbH = 0;
    }
    var cx = vp.w / 2, cy = vp.h / 2;
    slotsEl.style.width = gw + 'px';
    slotsEl.style.height = gh + 'px';
    slotsEl.style.left = (cx - gw / 2) + 'px';
    slotsEl.style.top = (cy - gh / 2) + 'px';
    slotsEl.style.setProperty('--thumb-h', (100 * thumbH / gh).toFixed(3) + '%');
    slotsEl.style.fontSize = Math.max(10, labelH * 0.42) + 'px';
    slotsEl.style.setProperty('--empty-font', Math.max(10, gh * 0.09) + 'px');

    var aw = Math.max(36, gw * ARROW_FRAC * 0.6);
    var ah = aw * ARROW_RATIO;
    var offX = gw / 2 + gw * ARROW_GAP_FRAC + aw / 2;
    arrowPrev.style.setProperty('--arrow-rot', '0deg');
    arrowNext.style.setProperty('--arrow-rot', '0deg');
    placeArrow(arrowPrev, cx - offX, cy, aw, ah, vp);
    placeArrow(arrowNext, cx + offX, cy, aw, ah, vp);
  }

  function placeArrow(el, cx, cy, w, h, vp) {
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = Math.max(0, Math.min(vp.w - w, cx - w / 2)) + 'px';
    el.style.top = Math.max(0, Math.min(vp.h - h, cy - h / 2)) + 'px';
  }

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function extractVideoId(input) {
    if (!input) return null;
    var t = String(input).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
    var m = t.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function thumbForUrl(url) {
    var id = extractVideoId(url);
    if (id) return 'https://img.youtube.com/vi/' + id + '/mqdefault.jpg';
    var m = String(url || '').match(/^(https?:\/\/.+\/)playlist\.m3u8(\?.*)?$/i);
    return m ? (m[1] + 'thumbnail.jpg') : '';
  }

  function renderSlots() {
    if (!openPickle) return;
    var items = pickleItems[openPickle];

    var empty = openPickle === 'games' && !items.length;
    slotsEl.classList.toggle('is-empty', empty);
    if (empty) {
      slotsEl.innerHTML =
        '<div class="pickle-empty">sorry there’s no games added yet :( come back later</div>';
      setArrows(1);
      return;
    }

    var pages = Math.max(1, Math.ceil(items.length / SLOTS_PER_PAGE));
    if (picklePage[openPickle] > pages - 1) picklePage[openPickle] = pages - 1;
    var start = picklePage[openPickle] * SLOTS_PER_PAGE;

    var html = '';
    for (var i = 0; i < SLOTS_PER_PAGE; i++) {
      var item = items[start + i];
      var thumb = (item && item.thumb)
        ? '<img class="pickle-slot-thumb" src="' + escapeHtml(item.thumb) + '" alt="" loading="lazy">'
        : '';
      html += '<button type="button" class="pickle-slot" data-index="' + (start + i) + '"' +
        (item ? '' : ' disabled') + '>' +
        '<span class="pickle-slot-box">' + thumb + '</span>' +
        '<span class="pickle-slot-label">' + (item ? escapeHtml(item.title) : '') + '</span>' +
        '</button>';
    }
    slotsEl.innerHTML = html;
    setArrows(pages);
  }

  function setArrows(pages) {
    var page = picklePage[openPickle] || 0;
    arrowPrev.hidden = arrowNext.hidden = pages < 2;
    arrowPrev.disabled = page === 0;
    arrowNext.disabled = page >= pages - 1;
  }

  function hideArrows() {
    ARROWS.forEach(function (a) { a.hidden = true; a.classList.remove('is-jump'); });
  }

  slotsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.pickle-slot') : null;
    if (!btn || btn.disabled || !openPickle || Date.now() < zoomReadyAt) return;
    var item = pickleItems[openPickle][parseInt(btn.dataset.index, 10)];
    if (!item) return;
    chooseItem(openPickle, item);
  });

  function jump(el) {
    el.classList.remove('is-jump');
    void el.offsetWidth;
    el.classList.add('is-jump');
  }
  ARROWS.forEach(function (el) {
    el.addEventListener('animationend', function () { el.classList.remove('is-jump'); });
  });

  function turnPage(delta, el) {
    if (!openPickle) return;
    jump(el);
    var items = pickleItems[openPickle];
    var pages = Math.max(1, Math.ceil(items.length / SLOTS_PER_PAGE));
    var next = Math.min(pages - 1, Math.max(0, picklePage[openPickle] + delta));
    if (next === picklePage[openPickle]) return;
    picklePage[openPickle] = next;
    renderSlots();
  }

  arrowPrev.addEventListener('click', function () { turnPage(-1, arrowPrev); });
  arrowNext.addEventListener('click', function () { turnPage(1, arrowNext); });

  function chooseItem(kind, item) {
    playSound(PICK_SOUND);
    currentPlayingId = item.id || null;
    updateCopyLinkVisibility();
    if (currentPlayingId) {
      var playingPath = '/videos/hamburgernews/v/' + currentPlayingId + '/';
      history.replaceState(null, '', playingPath);
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'knobsock-shell-update-route', path: playingPath }, window.location.origin);
      }
    }
    closeZoom(function () {
      var frame = pattySlot.querySelector('iframe');
      if (!frame || !frame.contentWindow) return;
      if (kind === 'episodes') {
        frame.contentWindow.postMessage(
          { type: 'knobsock-hamburger-play', index: item.index }, '*');
      } else {

        frame.contentWindow.postMessage(
          { type: 'knobsock-hamburger-game', url: item.url, title: item.title }, '*');
      }
    });
  }

  var zoomAnimTimer = null;

  var zoomReadyAt = 0;

  function openZoom(name) {
    if (openPickle) return;
    openPickle = name;
    picklePage[name] = 0;
    zoomReadyAt = Date.now() + 350;
    playSplat(name);

    renderSlots();
    slotsEl.hidden = false;
    stageWrap.classList.add('pickle-zoomed');

    layout(); // recomputes base positions, then zooms via applyPickleZoom()

    requestAnimationFrame(function () { slotsEl.classList.add('is-open'); });

    backLink.textContent = '← Back';
    backLink.setAttribute('href', '#');
    document.addEventListener('keydown', onZoomKey);
  }

  function closeZoom(done) {
    if (!openPickle) return;
    playSound(ZOOM_OUT_SOUND);

    openPickle = null;
    slotsEl.classList.remove('is-open');
    hideArrows();
    stageWrap.classList.remove('pickle-zoomed');
    document.removeEventListener('keydown', onZoomKey);
    backLink.textContent = '← Back to Videos';
    backLink.setAttribute('href', '/videos');

    layout(); // snaps stageBg/pattySlot/hnHeader/pickle buttons back to unzoomed size/place

    clearTimeout(zoomAnimTimer);
    zoomAnimTimer = setTimeout(function () {
      slotsEl.hidden = true;
      if (done) done();
    }, 480);
  }

  function onZoomKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') { closeZoom(); return; }

    if (e.key === 'ArrowLeft') { e.preventDefault(); turnPage(-1, arrowPrev); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); turnPage(1, arrowNext); }
  }

  Object.keys(PICKLE_BTNS).forEach(function (name) {
    PICKLE_BTNS[name].addEventListener('click', function () { openZoom(name); });
  });

  // Click anywhere on the zoomed background — including the still-
  // visible pickle border around the thumbnail/label content — closes
  // the zoom, same "tap outside to go back" as before. pickleSlots and
  // the arrows are separate fixed elements outside stageWrap, so clicks
  // on them never reach this listener.
  stageWrap.addEventListener('click', function (e) {
    if (!openPickle || Date.now() < zoomReadyAt) return;
    closeZoom();
  });

  backLink.addEventListener('click', function (e) {
    if (!openPickle) return;
    e.preventDefault();
    closeZoom();
  });

  if (window.firebase) {
    var db = firebase.firestore(
      firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG));

    var deepLinkId = new URLSearchParams(location.search).get('v');
    var episodesLoaded = false, gamesLoaded = false, deepLinkHandled = !deepLinkId;

    function tryDeepLink() {
      if (deepLinkHandled || !episodesLoaded || !gamesLoaded) return;
      deepLinkHandled = true;
      var found = pickleItems.episodes.find(function (v) { return v.id === deepLinkId; });
      var kind = 'episodes';
      if (!found) {
        found = pickleItems.games.find(function (g) { return g.id === deepLinkId; });
        kind = 'games';
      }
      if (!found) return;
      openZoom(kind);
      chooseItem(kind, found);
    }

    db.collection('playlist').doc('hamburgerNews').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var raw = (data && Array.isArray(data.videos)) ? data.videos : [];
      pickleItems.episodes = raw.map(function (v, i) {
        return {
          index: i,
          id: v.id || '',
          title: (v.title && v.title.trim()) ? v.title.trim() : ('Episode ' + (i + 1)),
          url: v.url || '',
          thumb: (v.thumb && v.thumb.trim()) ? v.thumb.trim() : thumbForUrl(v.url)
        };
      });
      if (openPickle === 'episodes') renderSlots();
      episodesLoaded = true;
      tryDeepLink();
    }, function (err) { console.error('Hamburger News episodes sync failed', err); });

    db.collection('playlist').doc('hamburgerGames').onSnapshot(function (doc) {
      var data = doc.exists ? doc.data() : null;
      var raw = (data && Array.isArray(data.games)) ? data.games : [];
      pickleItems.games = raw
        .filter(function (g) { return g && g.url; })
        .map(function (g, i) {
          return {
            index: i,
            id: g.id || '',
            title: (g.title && g.title.trim()) ? g.title.trim() : ('Game ' + (i + 1)),
            url: g.url,
            thumb: (g.thumb && g.thumb.trim()) ? g.thumb.trim() : ''
          };
        });
      if (openPickle === 'games') renderSlots();
      gamesLoaded = true;
      tryDeepLink();
    }, function (err) { console.error('Hamburger News games sync failed', err); });
  }
})();
</script>
