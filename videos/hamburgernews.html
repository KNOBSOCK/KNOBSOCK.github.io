<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos/hamburgernews">
<meta property="og:title" content="Hamburger News - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hamburger News - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with its own condiment palette (mustard/ketchup)
     instead of reusing the plain Videos page's blue — this is a themed
     one-off, not another entry in the main Video List. The whole point
     of the page is the burger-stack below: BURGER TOP.PNG and BURGER
     BOTTOM.PNG sandwich hamburger-news-widget.html's iframe directly,
     with ZERO gap on either seam — both PNGs were exported with their
     bun art touching that exact edge of their own canvas (verified by
     inspecting each file's alpha channel: the top image's content runs
     all the way to its own bottom edge, the bottom image's content runs
     all the way to its own top edge), so simple edge-to-edge stacking
     is enough on its own to read as one continuous burger cross-
     section — no manual negative-margin tuning needed. */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #2b1204;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    gap: clamp(10px, 2.5vw, 20px);
    padding: clamp(14px, 3vw, 28px) clamp(10px, 3vw, 24px) clamp(24px, 5vw, 48px);
  }

  /* The whole sandwich, sized by width alone by default (each piece's
     own height follows from its own aspect-ratio below) — fine on
     desktop and on a normal portrait phone, where this width already
     resolves to something short enough to fit one screen tall. The
     landscape media query further down swaps this to a height-driven
     size instead, for the case (a phone rotated sideways) where it
     wouldn't. */
  .burger-stack {
    width: min(92vw, 780px);
    flex: none;
  }

  .burger-top,
  .burger-bottom {
    display: block;
    width: 100%;
    height: auto;
  }
  /* Intrinsic aspect-ratio of the source PNGs — reserves the right
     amount of vertical space before the image itself has loaded, so
     nothing jumps into place after the fact. */
  .burger-top { aspect-ratio: 2126 / 855; }
  .burger-bottom { aspect-ratio: 2126 / 670; }

  /* The "patty" — a true 16:9 embed sandwiched directly between the two
     bun images with no gap on either edge (see the top-of-file comment
     for why that's safe to do edge-to-edge). A soft border-radius
     rounds off what would otherwise be hard rectangular corners poking
     out from under the buns' own organic silhouette — enough to blend
     in at a glance, not enough to look like a rounded video player
     sitting on top of a burger photo. */
  .patty-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: clamp(6px, 1.6vw, 14px);
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .back-link {
    color: #ffd479;
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 700;
    text-decoration: underline;
    opacity: 0.85;
  }
  .back-link:hover { opacity: 1; }

  /* On mobile, lock the page itself to exactly one screen instead of
     letting it scroll — same convention as videos.html/music.html/
     live.html, even though the top-of-file comment above originally
     argued scrolling here was harmless (true in isolation, but
     inconsistent with every other page on this site never scrolling on
     phone, which is the more important bar to match). A typical
     portrait phone already fits the width-driven .burger-stack below
     within one screen without any changes here — this mainly matters
     for the landscape case just below, where a short viewport needs
     the stack resized by HEIGHT instead of width to keep fitting. */
  @media (max-width: 860px) {
    html, body { overflow: hidden; }
    .page { height: 100vh; height: 100dvh; }
  }

  /* Phone rotated to landscape: same one-screen lock as the portrait
     rule above, but the width-driven sizing on .burger-stack would make
     it far too tall for an already-short landscape viewport (a phone's
     width, once sideways, is nowhere near the constraint that matters).
     Switching to a height-driven size — aspect-ratio matches the whole
     stack's own combined proportions (2126 wide by 855 + patty-at-16:9
     + 670 tall, i.e. 2126/2722) so .burger-top/.patty-slot/.burger-
     bottom's own individual aspect-ratios below still divide up that
     resolved width exactly as they do at any other size — lets it
     shrink to fit the available height instead.
     hover:none + pointer:coarse (true only for touchscreens) matter
     here for the same reason as those other pages' identical guard: an
     ordinary desktop window is "landscape" by nature and often under
     860px tall too (a laptop screen minus its own chrome), so
     max-height + orientation alone would also catch a normal desktop
     visit. */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    html, body { overflow: hidden; }
    .page {
      height: 100vh;
      height: 100dvh;
      flex-direction: row;
      justify-content: center;
      padding: clamp(8px, 2vh, 16px);
      gap: clamp(8px, 2vw, 16px);
    }
    .burger-stack {
      width: auto;
      height: 100%;
      aspect-ratio: 2126 / 2722;
    }
    .back-link { flex: none; }
  }
</style>
</head>
<body>

<div class="page">
  <a class="back-link" href="/videos">&larr; Back to Videos</a>

  <div class="burger-stack">
    <img class="burger-top" src="/BURGER%20TOP.PNG" alt="">
    <div class="patty-slot">
      <iframe src="/hamburger-news-widget.html"
              title="Hamburger News"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
              allowfullscreen></iframe>
    </div>
    <img class="burger-bottom" src="/BURGER%20BOTTOM.PNG" alt="">
  </div>
</div>

</body>
</html>
