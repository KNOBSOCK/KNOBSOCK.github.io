<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos/hamburgernews">
<meta property="og:title" content="Hamburger News - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hamburger News - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with its own condiment palette (mustard/ketchup)
     instead of reusing the plain Videos page's blue — this is a themed
     one-off, not another entry in the main Video List. The scene photos
     (hamburger-news-bg-desktop.jpg / -mobile.jpg — floral wallpaper,
     diner booth or bare wall, wood table, an empty plate) already have
     BURGER TOP.PNG/BOTTOM.PNG's own burger baked into a reference render
     each was designed against, which is how .burger-stack's exact
     width/bottom percentages below were derived: measuring the burger's
     footprint in that reference render against the SAME spot's empty
     plate in the real (burger-free) photo used here. See .scene and
     .burger-stack's own comments for how that stays aligned at any size.
     BURGER TOP.PNG and BURGER BOTTOM.PNG still sandwich hamburger-news-
     widget.html's iframe directly with zero gap on either seam — both
     PNGs were exported with their bun art touching that exact edge of
     their own canvas (verified by inspecting each file's alpha channel),
     so plain edge-to-edge stacking still reads as one continuous burger
     cross-section. */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Full-viewport stand-in for whatever sliver of the scene photo
     .scene (below) doesn't cover — .scene is locked to the photo's own
     aspect ratio so the burger stays exactly on the plate (see its
     comment), which means it letterboxes rather than crops on a
     viewport shaped differently than the photo. A blurred, cover-
     cropped copy of that same photo behind it turns that letterbox
     margin into a deliberate-looking soft-focus surround instead of a
     bare color bar — position:fixed so it never has to negotiate size
     with .scene's own box, just fill the real screen behind it. */
  .scene-fill {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url(/hamburger-news-bg-desktop.jpg);
    background-size: cover;
    background-position: center;
    filter: blur(36px) brightness(0.85);
    transform: scale(1.15); /* pushes the blur's own soft edge past the viewport edge */
  }

  /* container-type:size (needed by .scene's width formula below) implies
     layout containment, which incidentally makes .page itself the
     containing block for the position:fixed elements inside it
     (.scene-fill, .back-link, and hamburger-news-widget.html's own
     fullscreen relay) instead of the real viewport — harmless here only
     because .page is deliberately sized to exactly match the viewport
     (100dvh/100%) already, so "relative to .page" and "relative to the
     viewport" resolve to the same box either way. */
  .page {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    container-type: size;
  }

  .back-link {
    position: fixed;
    top: clamp(10px, 2vw, 20px);
    left: clamp(10px, 3vw, 24px);
    z-index: 5;
    color: #ffd479;
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 700;
    text-decoration: underline;
    opacity: 0.85;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }
  .back-link:hover { opacity: 1; }

  /* The set this whole page performs on. Locked to the background
     photo's OWN aspect ratio (1:1 for the desktop photo, overridden to
     the mobile photo's own 1206:2622 below) via the same "fit within
     both axes, whichever binds" formula .burger-stack's landscape
     sizing further down uses — width shrinks to match the SHORTER of
     "fill available width" or "the width that exactly fills available
     height at this ratio" via min(), so it always renders at that
     exact ratio no matter the viewport's own shape, with zero cropping
     to disturb the plate's position inside it. That's what lets
     .burger-stack below sit on the plate using plain percentages: since
     this box is ALWAYS the photo scaled uniformly with nothing cropped
     off, a percentage of it is always the same point in the photo. */
  .scene {
    position: relative;
    width: min(100cqw, 100cqh);
    height: auto;
    aspect-ratio: 1 / 1;
    background-image: url(/hamburger-news-bg-desktop.jpg);
    background-size: 100% 100%;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.5);
  }

  /* Burger + video, positioned as a straight percentage of .scene.
     width/bottom were measured directly off the actual background
     photo: how wide the burger sits relative to the empty plate's own
     photographed width, and how far up from the very bottom of the
     photo its underside rests — left+translateX keeps it centered
     regardless. Height is left to the real asset's own aspect ratio
     (2126:2722, same PNGs as ever) rather than also pinned to a
     measured height, since matching the OTHER two axes (width, and
     where it sits) is what makes it read as "on the plate" — forcing a
     third, independently-measured ratio on top would only fight the
     asset's real proportions for no visible benefit. */
  .burger-stack {
    position: absolute;
    /* Centered via a plain left percentage (50% - width/2), NOT
       transform:translateX(-50%) — a transform here would make
       .burger-stack a containing block for its own fixed-position
       descendants, which breaks .patty-slot.hn-fullscreen's iframe
       above: instead of covering the real viewport, "fixed" would
       resolve relative to THIS box instead (confirmed by testing —
       the fullscreened iframe landed offset by exactly .burger-stack's
       own position instead of at the screen's real top-left corner). */
    left: 29.7%;
    width: 40.6%;
    bottom: 38.5%;
  }

  .burger-top,
  .burger-bottom {
    display: block;
    width: 100%;
    height: auto;
  }
  /* Intrinsic aspect-ratio of the source PNGs — reserves the right
     amount of vertical space before the image itself has loaded, so
     nothing jumps into place after the fact. */
  .burger-top { aspect-ratio: 2126 / 855; }
  .burger-bottom { aspect-ratio: 2126 / 670; }

  /* The "patty" — a true 16:9 embed sandwiched directly between the two
     bun images with no gap on either edge (see the top-of-file comment
     for why that's safe to do edge-to-edge). A soft border-radius
     rounds off what would otherwise be hard rectangular corners poking
     out from under the buns' own organic silhouette — enough to blend
     in at a glance, not enough to look like a rounded video player
     sitting on top of a burger photo. */
  .patty-slot {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: clamp(6px, 1.6vw, 14px);
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Real-viewport fullscreen fallback for hamburger-news-widget.html's
     own fullscreen button. That widget lives in an iframe, and on iOS
     Safari — which has no Fullscreen API at all for non-video elements —
     it falls back to a CSS position:fixed trick that can only ever cover
     the IFRAME'S OWN box, not the actual phone screen (position:fixed's
     containing block is the iframe's own viewport, same constraint
     live.html's tap-in overlay comment documents). The widget posts a
     message here instead, and this class — applied to the real iframe
     element in THIS top-level document — takes over the actual screen;
     the iframe's own contents (already 100% width/height inside it)
     grow to fill it right along with it. */
  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
    border-radius: 0;
  }

  /* Real phone held upright: swap in the taller mobile photo — same
     burger-on-plate relationship, measured the same way off ITS OWN
     empty-plate render, just a different width/bottom pair since the
     mobile photo's plate sits at a different spot/scale than the
     desktop one's. hover:none+pointer:coarse scope this to actual
     touchscreens (same guard the landscape query below uses) so a
     plain narrow desktop window doesn't get mistaken for a phone; the
     explicit orientation:portrait keeps a phone rotated sideways out of
     this block too — that case has its own rules below instead. */
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    .scene-fill,
    .scene {
      background-image: url(/hamburger-news-bg-mobile.jpg);
    }
    /* Real phones cluster tightly around this photo's own ~0.46 aspect
       ratio (roughly 0.45-0.46 across current iPhones/Android phones),
       so unlike desktop — where a freely resizable window can be ANY
       shape, which is why THAT gets letterboxed via .scene's contain-fit
       instead — mobile can just cover-fill edge to edge. That turned out
       to matter in practice: Safari's own address/tab bars shrink the
       *visible* viewport height without changing its width, nudging the
       effective ratio just wide enough that contain-fit's letterboxing
       showed as a visible gray bar down both sides. Cover crops instead
       of letterboxing, so any such nudge just trims a sliver of
       wallpaper off the top (background-position anchors the bottom, so
       the table/plate/burger stay put) rather than showing a bar. */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: unset;
      background-size: cover;
      background-position: center bottom;
      box-shadow: none;
    }
    .burger-stack {
      left: 3.9%;
      width: 92.2%;
      bottom: 37%;
    }
  }

  /* Phone rotated to landscape: the plate/burger photo above is
     portrait-shaped art — forcing it and its precise burger-on-plate
     alignment into a wide, short landscape screen would shrink the
     video back down to a sliver, the exact problem already fixed once
     on this page (see this file's git history). Simplest fix: landscape
     drops the photo/plate idea entirely and reuses that earlier fix's
     own layout untouched — .scene stops being an aspect-locked photo
     frame and goes back to a plain flex box that .burger-stack fills by
     solving for the video's own 16:9 directly, buns shrunk to a thin
     cropped strip either side of it. container-type:size moves from
     .page (still needed there for the non-landscape .scene formula
     above) onto .scene too, since .burger-stack's cqw/cqh units here
     need to measure against THIS box, not the whole page. */
  @media (orientation: landscape) and (max-height: 860px) and (hover: none) and (pointer: coarse) {
    .page {
      flex-direction: row;
      padding: clamp(8px, 2vh, 16px);
      gap: clamp(8px, 2vw, 16px);
    }
    .scene {
      position: static;
      width: 100%;
      height: 100%;
      aspect-ratio: unset;
      background-image: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
    }
    .burger-stack {
      position: static;
      left: auto;
      bottom: auto;
      --bun-h: clamp(8px, 3vh, 24px);
      width: min(100cqw, calc((100cqh - 2 * var(--bun-h)) * 16 / 9));
      height: auto;
    }
    .burger-top,
    .burger-bottom {
      height: var(--bun-h);
      aspect-ratio: auto;
      object-fit: cover;
    }
  }
</style>
</head>
<body>

<div class="scene-fill"></div>

<div class="page">
  <a class="back-link" href="/videos">&larr; Back to Videos</a>

  <div class="scene">
    <div class="burger-stack">
      <img class="burger-top" src="/BURGER%20TOP.PNG" alt="">
      <div class="patty-slot" id="pattySlot">
        <iframe src="/hamburger-news-widget.html"
                title="Hamburger News"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                allowfullscreen></iframe>
      </div>
      <img class="burger-bottom" src="/BURGER%20BOTTOM.PNG" alt="">
    </div>
  </div>
</div>

<script>
(function () {
  var pattySlot = document.getElementById('pattySlot');
  // Relayed from hamburger-news-widget.html's own fullscreen fallback —
  // see .patty-slot.hn-fullscreen's own comment above for why this has
  // to happen up here rather than inside that iframe.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-fullscreen') return;
    pattySlot.classList.toggle('hn-fullscreen', !!e.data.active);
  });
})();
</script>

</body>
</html>
