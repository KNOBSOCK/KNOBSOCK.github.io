<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamburger News - KNOBSOCK</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://knobsock.net/videos/hamburgernews">
<meta property="og:title" content="Hamburger News - KNOBSOCK">
<meta property="og:site_name" content="KNOBSOCK">
<meta property="og:description" content="Official Website for Knobsock">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hamburger News - KNOBSOCK">
<meta name="twitter:description" content="Official Website for Knobsock">
<meta name="description" content="Official Website for Knobsock">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<style>
  /* Standalone page, same rebuild approach as videos.html/music.html/
     live.html, but with a drawn-scene background: hamburger-news-bg.webp
     is the full illustrated room (door, window, floor, spotlight,
     burger) with the video's rectangular slot already cut transparent
     by the artist — including the lettuce fringe's own scalloped dip
     into that slot, preserved as partial/antialiased transparency
     rather than a hard rectangle, so it blends with the video
     underneath instead of needing a separate overlay sprite.

     #stageBg renders with object-fit:contain — the whole scene is
     ALWAYS fully visible, scaled to fit the viewport and letterboxed
     (not cropped) on whichever axis doesn't match its own aspect ratio.
     #pattySlot (the video) is repositioned to match on every resize by
     a small JS layout() that replicates that same contain-fit math —
     see its own comment below for why that needs JS at all rather than
     being pure CSS.

     IMG_W/IMG_H and HOLE_RECT in layout() are expressed in the source
     art's own original pixel space (4096x3276, before it was scaled
     down for the saved hamburger-news-bg.webp) — easiest to re-derive
     from the source file directly if the art ever changes; the saved
     image being smaller doesn't matter since contain-fit only cares
     about aspect ratio. */
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    /* Sampled from the art's own floor color — shows in the contain-fit
       letterbox bars, and stops Safari's elastic overscroll bounce from
       flashing white against the illustrated scene. */
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* The room + burger, always shown in full (object-fit:contain, never
     cover) — same behavior at every viewport size/aspect ratio, just
     more or less letterboxed depending on how far off-ratio the window
     is. pointer-events:none since this sits ABOVE #pattySlot in
     z-index (its own transparent video-slot needs the opaque lettuce
     fringe around the edges to visually overlap the video without
     ever intercepting clicks meant for it — same trick used site-wide
     for decorative art layered over interactive elements). */
  .stage-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    object-fit: contain;
    object-position: center;
    z-index: 2;
    pointer-events: none;
  }

  /* The video itself, sized/positioned every resize to land exactly in
     the transparent slot cut into #stage-bg above it. Solid black so
     the slot's own antialiased/partially-transparent edges (the
     lettuce scallops dipping into it) blend against a plausible
     "video screen" color rather than whatever would otherwise be
     behind this stage. */
  .patty-slot {
    position: fixed;
    z-index: 1;
    background: #000;
    overflow: hidden;
  }
  .patty-slot iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .back-link {
    position: fixed;
    top: clamp(10px, 2.5vw, 20px);
    left: clamp(10px, 2.5vw, 20px);
    z-index: 3;
    color: #ffd479;
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 700;
    text-decoration: underline;
    opacity: 0.85;
    /* The page behind this link is illustrated art, not a flat color —
       contrast isn't guaranteed (light bun art can sit right under it),
       so this needs its own legibility net. */
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  .back-link:hover { opacity: 1; }

  /* Real-viewport fullscreen fallback for hamburger-news-widget.html's
     own fullscreen button — unchanged from before this page's
     background was reworked. That widget lives in an iframe, and on
     iOS Safari — which has no Fullscreen API at all for non-video
     elements — it falls back to a CSS position:fixed trick that can
     only ever cover the IFRAME'S OWN box, not the actual phone screen
     (position:fixed's containing block is the iframe's own viewport).
     The widget posts a message here instead, and this class — applied
     to the real iframe element in THIS top-level document — takes over
     the actual screen; the iframe's own contents (already 100%
     width/height inside it) grow to fill it right along with it. Needs
     its own z-index above .stage-bg's 2, or the illustrated art (still
     covering the full viewport in its own letterboxed layout) would
     paint over the fullscreen video. */
  .patty-slot.hn-fullscreen iframe {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
  }
</style>
</head>
<body>

<a class="back-link" href="/videos">&larr; Back to Videos</a>

<div class="patty-slot" id="pattySlot">
  <iframe src="/hamburger-news-widget.html"
          title="Hamburger News"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          allowfullscreen></iframe>
</div>

<img class="stage-bg" id="stageBg" src="/hamburger-news-bg.webp" alt="">

<script>
(function () {
  var pattySlot = document.getElementById('pattySlot');
  // Relayed from hamburger-news-widget.html's own fullscreen fallback —
  // see .patty-slot.hn-fullscreen's own comment above for why this has
  // to happen up here rather than inside that iframe.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'knobsock-hamburger-fullscreen') return;
    pattySlot.classList.toggle('hn-fullscreen', !!e.data.active);
  });

  // ---------- STAGE LAYOUT ----------
  // #stageBg is shown with native object-fit:contain, which the browser
  // scales/letterboxes on its own with no way to ask it "where did the
  // pixel that used to be at (x, y) in the source image end up on
  // screen?" — #pattySlot can't land in the artwork's transparent video
  // slot without doing that same contain-fit math by hand and applying
  // it every time the viewport changes. A pure-CSS version of this
  // (sizing a real box, not just an img/video, to "contain" itself
  // within its container while preserving a child's own coordinates
  // inside it) isn't reliably solvable with aspect-ratio/min-width
  // tricks across browsers, so this is plain JS instead.
  var IMG_W = 4096, IMG_H = 3276;
  // The video's transparent slot in the source art, with a small margin
  // added on every side so #pattySlot's solid black fully backs even
  // the outermost antialiased pixels of the cut edge.
  var HOLE_RECT = { x: 1246, y: 1000, w: 1587, h: 865 };

  // window.innerWidth/innerHeight lag behind on iOS Safari while the
  // address bar is animating in/out of view — visualViewport tracks the
  // actual visible area live and fires its own resize event when that
  // chrome changes, which plain 'resize' doesn't always do reliably.
  // Falls back to window sizing on browsers without the API.
  function viewportSize() {
    var vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: window.innerWidth, h: window.innerHeight };
  }

  function layout() {
    var vp = viewportSize();
    // Same formula object-fit:contain uses internally: scale down by
    // whichever axis needs it more, so the whole image fits inside the
    // viewport on both axes with no cropping, then center it —
    // Math.min instead of cover's Math.max is the only difference.
    var scale = Math.min(vp.w / IMG_W, vp.h / IMG_H);
    var offX = (vp.w - IMG_W * scale) / 2;
    var offY = (vp.h - IMG_H * scale) / 2;
    pattySlot.style.left = (offX + HOLE_RECT.x * scale) + 'px';
    pattySlot.style.top = (offY + HOLE_RECT.y * scale) + 'px';
    pattySlot.style.width = (HOLE_RECT.w * scale) + 'px';
    pattySlot.style.height = (HOLE_RECT.h * scale) + 'px';
  }

  var rafPending = false;
  function scheduleLayout() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      layout();
    });
  }

  layout();
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout);
    window.visualViewport.addEventListener('scroll', scheduleLayout);
  }
})();
</script>

</body>
</html>
