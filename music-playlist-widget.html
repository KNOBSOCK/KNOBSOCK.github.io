<!-- SoundCloud Widget API — same one the homepage's standalone Listen
     widget uses, for the mini player added below. -->
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
// ============================================================
// SOUNDCLOUD "NOW PLAYING" ENGINE — an invisible SoundCloud widget (same
// profile as the homepage's standalone Listen widget) that only actually
// plays audio for a SoundCloud-only song (no matching video). The visible
// "Now Playing" panel above it mirrors whichever entry is active in the
// single merged "Music Videos" list — video or SoundCloud alike — via the
// activeKey/isScKey bridges declared at the top level of this file.
// ============================================================
(function () {
  const scFrame = document.getElementById('scWidgetFrame');
  const scArtworkLinkEl = document.getElementById('scArtworkLink');
  const scArtworkImgEl = document.getElementById('scArtwork');
  const scPlayBtn = document.getElementById('scPlayBtn');
  const scTitleWrapEl = document.getElementById('scTitleWrap');
  const scTitleEl = document.getElementById('scTitle');
  const scArtistEl = document.getElementById('scArtist');
  const scProgressTrackEl = document.getElementById('scProgressTrack');
  const scProgressFillEl = document.getElementById('scProgressFill');

  const scWidget = SC.Widget(scFrame);
  let scDuration = 0; // seconds — always seconds here, converted to ms only at the scWidget.seekTo() call sites
  // Last play state this widget itself reported, kept even while a video
  // is active so scPlayBtn has something sane to fall back on.
  let scIsPlaying = false;
  // Last play state reported for the active video (via notifyVideoPlayState),
  // used by scPlayBtn/updateScPlayIcon while a video is the active source.
  let lastKnownVideoPlaying = false;

  // Updates the title (with marquee), cover art, and the art's link to
  // the track's real SoundCloud page — called whenever a SoundCloud entry
  // becomes the active one.
  function setScNowPlayingFromSound(sound) {
    setScTitle(sound.title || 'Untitled');
    scArtistEl.textContent = getScAuthor(sound);
    scArtworkImgEl.src = getScArtworkUrl(sound);
    scArtworkLinkEl.href = sound.permalink_url || '#';
    scArtworkLinkEl.title = 'Open on SoundCloud';
  }

  // Same car-radio marquee technique as the homepage Listen widget: a
  // short title just sits still, a long one gets a second copy appended
  // and scrolls left on a seamless loop instead of wrapping mid-word.
  function setScTitle(text) {
    scTitleEl.classList.remove('scrolling');
    scTitleEl.style.animationDuration = '';
    scTitleEl.innerHTML = '';

    const firstCopy = document.createElement('span');
    firstCopy.className = 'sc-title-copy';
    firstCopy.textContent = text;
    scTitleEl.appendChild(firstCopy);

    requestAnimationFrame(function () {
      if (scTitleEl.scrollWidth <= scTitleWrapEl.clientWidth) return;
      const secondCopy = document.createElement('span');
      secondCopy.className = 'sc-title-copy';
      secondCopy.textContent = text;
      scTitleEl.appendChild(secondCopy);
      const pxPerSecond = 45;
      const duration = (scTitleEl.scrollWidth / 2) / pxPerSecond;
      scTitleEl.style.animationDuration = duration + 's';
      scTitleEl.classList.add('scrolling');
    });
  }

  function updateScPlayIcon(isPlaying) {
    scPlayBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9658;';
  }

  // Called from the video IIFE (via the playScByIndex bridge) when the
  // user picks a SoundCloud-only entry from the merged playlist.
  playScByIndex = function (idx) {
    if (idx < 0 || idx >= scSoundsList.length) return;
    const sound = scSoundsList[idx];
    scDuration = (sound.duration || 0) / 1000;
    setScNowPlayingFromSound(sound);
    scProgressFillEl.style.width = '0%';
    updateScPlayIcon(true);
    scWidget.skip(idx);
    scWidget.play();
  };
  pauseSc = function () {
    scWidget.pause();
  };
  resumeSc = function () {
    scWidget.play();
  };
  seekScToFraction = function (fraction) {
    if (!scDuration) return;
    scWidget.seekTo(fraction * scDuration * 1000);
    scProgressFillEl.style.width = (fraction * 100) + '%';
  };
  // Called from the video IIFE whenever a video entry becomes the active
  // one, so this panel mirrors it (title/artist/thumbnail/link) instead
  // of stale SoundCloud info.
  setNowPlayingFromVideo = function (info) {
    setScTitle(info.title);
    scArtistEl.textContent = info.author || '';
    scArtworkImgEl.src = info.thumbnail;
    scArtworkLinkEl.href = info.linkUrl || '#';
    scArtworkLinkEl.title = 'Open on YouTube';
  };
  // Continuous progress/play-state from the video IIFE, only meaningful
  // (and only sent) while a video is the active source.
  notifyVideoProgress = function (current, duration) {
    if (isScKey(activeKey) || !duration) return;
    scDuration = duration;
    scProgressFillEl.style.width = ((current / duration) * 100) + '%';
  };
  notifyVideoPlayState = function (isPlaying) {
    lastKnownVideoPlaying = isPlaying;
    updateScPlayIcon(isPlaying);
  };

  scWidget.bind(SC.Widget.Events.READY, function () {
    scPlayBtn.disabled = false;
    scWidget.getSounds(function (sounds) {
      scSoundsList = sounds || [];
      refreshMergedPlaylist();
    });
  });

  // These only ever fire as a direct result of our own playScByIndex/
  // pauseSc/resumeSc calls above — the widget itself is invisible and has
  // no controls of its own for a visitor to trigger PLAY/PAUSE with.
  scWidget.bind(SC.Widget.Events.PLAY, function () {
    scIsPlaying = true;
    if (isScKey(activeKey)) updateScPlayIcon(true);
  });
  scWidget.bind(SC.Widget.Events.PAUSE, function () {
    scIsPlaying = false;
    if (isScKey(activeKey)) updateScPlayIcon(false);
  });

  scWidget.bind(SC.Widget.Events.PLAY_PROGRESS, function (data) {
    if (!isScKey(activeKey) || !scDuration) return;
    scProgressFillEl.style.width = (data.relativePosition * 100) + '%';
    // Lets the video pane's own scrub bar/time label track this
    // SoundCloud track's playhead too (see notifyScProgress in the video
    // IIFE) — both sides agree scDuration/current are always seconds.
    notifyScProgress(data.relativePosition * scDuration, scDuration);
  });

  scWidget.bind(SC.Widget.Events.FINISH, function () {
    scProgressFillEl.style.width = '0%';
    if (isScKey(activeKey)) advanceToNextInMergedList();
  });

  // Explicit play()/pause() based on our own tracked scIsPlaying, rather
  // than the widget's toggle() — toggle() is unreliable on the very
  // first click before any play/pause state has been established with
  // the widget yet, which is what made this need two clicks to actually
  // start playing.
  scPlayBtn.addEventListener('click', function () {
    if (isScKey(activeKey)) {
      if (scIsPlaying) scWidget.pause();
      else scWidget.play();
    } else if (lastKnownVideoPlaying) {
      pauseCurrentVideo();
    } else {
      resumeCurrentVideo();
    }
  });

  scArtworkLinkEl.addEventListener('click', function (e) {
    // Nothing's loaded yet — don't navigate to a bare "#".
    if (!scArtworkLinkEl.getAttribute('href') || scArtworkLinkEl.getAttribute('href') === '#') {
      e.preventDefault();
      return;
    }
    // Same restart-the-animation trick as the homepage Listen widget's
    // play button: remove the class, force a reflow, then re-add it so
    // it replays even if clicked again before the last jump finished.
    scArtworkLinkEl.classList.remove('jump');
    void scArtworkLinkEl.offsetWidth;
    scArtworkLinkEl.classList.add('jump');
  });
  scArtworkLinkEl.addEventListener('animationend', function (e) {
    if (e.animationName === 'sc-artwork-jump') scArtworkLinkEl.classList.remove('jump');
  });

  scProgressTrackEl.addEventListener('click', function (e) {
    if (!scDuration) return;
    const rect = scProgressTrackEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    if (isScKey(activeKey)) {
      scWidget.seekTo(fraction * scDuration * 1000);
    } else {
      seekVideoToFraction(fraction);
    }
    scProgressFillEl.style.width = (fraction * 100) + '%';
  });
})();
</script>

<script>
// ---------- NATURAL-HEIGHT REPORTER ----------
// Same contract videos.html/video-playlist-widget.html already use: the
// widget measures the height its content actually wants and posts it to
// the host page, which sizes the iframe to that instead of handing it
// the whole window.
//
// Without this the widget just filled whatever it was given — which is
// exactly the "page runs all the way to the bottom" bug on a zoomed-out
// or 4K/8K display: .layout is height:100%, the SoundCloud row is a 1fr
// grid track and .sc-card flex-grows inside it, so every extra pixel of
// window became empty gold panel under the video.
//
// Everything here is derived from WIDTHS and from content-sized
// children, never from the rendered height of a box the parent just
// sized — measuring that would only ever report back the height we were
// already given, so the size could never correct itself downward.
//
// Same-origin only by design: posted with this page's own origin as the
// target, so it simply isn't delivered when the widget is embedded on
// another domain, which then keeps the plain fill-the-frame behavior.
(function () {
  const layout = document.getElementById('layout');
  const pane = document.getElementById('videoPane');
  const scCard = document.querySelector('.sc-card');
  const items = document.getElementById('playlistItems');
  const MOBILE = 860;
  let lastSent = 0;

  function px(v) { return parseFloat(v) || 0; }

  // Natural height of a flex column whose children are all content-sized
  // (flex: 0 0 auto). Summing the children rather than reading the
  // element's own height is the point: .sc-card is flex:1 1 auto on
  // desktop, so its rendered height is whatever room the grid row had.
  function contentHeight(el) {
    const cs = getComputedStyle(el);
    let total = px(cs.paddingTop) + px(cs.paddingBottom) +
                px(cs.borderTopWidth) + px(cs.borderBottomWidth);
    let shown = 0;
    for (let i = 0; i < el.children.length; i++) {
      const child = el.children[i];
      const ccs = getComputedStyle(child);
      // The hidden SoundCloud engine iframe is absolutely positioned and
      // takes no room in the flow.
      if (ccs.display === 'none' || ccs.position === 'absolute' || ccs.position === 'fixed') continue;
      total += child.getBoundingClientRect().height + px(ccs.marginTop) + px(ccs.marginBottom);
      shown++;
    }
    if (shown > 1) total += px(cs.rowGap) * (shown - 1);
    return total;
  }

  function report() {
    // Fullscreen re-parents the video pane to the whole window; nothing
    // about that state should be mistaken for the widget's own height.
    if (layout.classList.contains('fullscreen-active')) return;
    // The host page no longer sizes itself to this on mobile — .layout
    // scrolls its own overflow internally there instead (see the
    // .layout mobile media query above), so there's nothing for this
    // message to do once a phone-width host page ignores it anyway.
    if (window.innerWidth <= MOBILE) return;

    const cs = getComputedStyle(layout);
    const gap = px(cs.rowGap);
    // From a WIDTH, not a height: width is set purely by the horizontal
    // layout, so nothing downstream of this measurement can feed back
    // into it. Read off .sc-card rather than the video pane itself
    // because .layout.video-collapsed shrinks the pane to a hidden 1px
    // (see that rule's comment) — measuring the pane would then report
    // a near-zero video height and shrink the whole reported frame to
    // match, instead of leaving the space for the Now Playing card to
    // expand into. .sc-card shares the video pane's column/width in
    // both layouts and is never collapsed, so this keeps the reported
    // height the same whether or not the video is hidden.
    const video = (scCard.getBoundingClientRect().width * 9) / 16;

    let height = Math.ceil(px(cs.paddingTop) + px(cs.paddingBottom) + video + gap + contentHeight(scCard));

    // Only post on a real change — the parent resizing the iframe feeds
    // straight back into the observer below, so echoing an unchanged
    // height would have the two bouncing off each other indefinitely.
    if (!height || Math.abs(height - lastSent) < 2) return;
    lastSent = height;
    try {
      parent.postMessage(
        { type: 'knobsock-widget-height', height: height },
        window.location.origin
      );
    } catch (err) { /* embedded cross-origin — nothing to tell */ }
  }

  // Watches the things that actually drive the height: the player box
  // (16:9, so it follows the widget's width), the Now Playing card, and
  // the list (cards re-render as tracks and creator filters load).
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(report);
    ro.observe(pane);
    if (scCard) ro.observe(scCard);
    if (items) ro.observe(items);
  }
  if (items && window.MutationObserver) {
    new MutationObserver(report).observe(items, { childList: true, subtree: true });
  }
  window.addEventListener('resize', report);
  window.addEventListener('load', report);
  report();
})();
</script>

</body>
</html>
