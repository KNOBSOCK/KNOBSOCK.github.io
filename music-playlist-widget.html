<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Music Player + Playlist</title>
<style>
  :root {
    --ink: #3a2a00;
    --panel: rgba(58, 42, 0, 0.32);
    --panel-2: rgba(58, 42, 0, 0.8);
    --line: rgba(255, 220, 120, 0.6);
    --accent: #f2b705;
    --accent-dim: #b8890a;
    --lime: #a3e635;
    --lime-dim: #65a30d;
    --text: #ffffff;
    --text-dim: #f5e9c9;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { position: relative; }

  /* ---------- BACKDROP ----------
     A padded, rounded panel with a 50% frosted backdrop blur — same blur
     treatment as the truth zone page's card (our 1-100 scale: 100% = 20px,
     so 50% = 10px). It's a sibling of .layout (not nested inside it), so
     its width is capped/centered the same way .layout is — otherwise on a
     big monitor the glow panel would keep stretching edge-to-edge even
     after the content inside .layout got capped at 1200px. */
  .bg-glow {
    position: absolute;
    top: clamp(16px, 3vw, 32px);
    bottom: clamp(16px, 3vw, 32px);
    left: 50%;
    transform: translateX(-50%);
    width: min(calc(100% - clamp(32px, 6vw, 64px)), calc(1200px - clamp(32px, 6vw, 64px)));
    border-radius: clamp(10px, 2.5vw, 28px);
    background: rgba(242, 183, 5, 0.45);
    backdrop-filter: blur(10px) saturate(150%);
    -webkit-backdrop-filter: blur(10px) saturate(150%);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- PAGE LAYOUT ----------
     Desktop (CSS Grid, >= 861px): video, creator chin, and SoundCloud
     stacked in a left column; "Up Next" filling a right column that
     spans all three rows. Mobile (<= 860px): a single flex column in
     plain DOM order (video, playlist, creator chin, SoundCloud), so
     SoundCloud naturally lands flush at the very bottom, acting as a
     chin under the whole widget — no reordering needed. Capped at
     1200px and centered so the player doesn't stretch edge-to-edge on
     a big monitor.

     An earlier version grouped video/chin/SoundCloud in a wrapper div
     and used display:contents + order to reflow it for mobile — that
     combination has real cross-browser flexbox bugs (a positioned/
     display:contents child can lose its flex-grow sizing), which is
     what caused the "Up Next" list to collapse to zero height on a
     narrower window and SoundCloud to render misaligned. Grid
     placement on desktop plus plain DOM order on mobile avoids
     display:contents and flex reordering entirely. */
  .layout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    margin: 0 auto;
    gap: 10px;
    padding: clamp(18px, 3.5vw, 36px);
    background: transparent;
  }

  /* On mobile, the widget's own stacked content (video + Now Playing
     card + playlist) can be taller than whatever box the host page
     hands the iframe — .layout itself is the scroll container for
     that, rather than the host page growing/scrolling around an
     oversized iframe (that used to feel like scrolling a separate
     nested frame instead of the widget itself). Scoped to .layout
     specifically, not html/body, so .bg-glow — a sibling of .layout,
     not a descendant — stays put as a fixed backdrop instead of
     scrolling away with the content. */
  @media (max-width: 860px) {
    .layout {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  }

  @media (min-width: 861px) {
    .layout {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 34%);
      /* minmax(0, auto)/minmax(0, 1fr) — not plain auto/1fr — on the
         video and SoundCloud rows: plain "auto" never shrinks below its
         content's natural size, which is what let a wide-but-short
         window's aspect-ratio-driven video height overflow the layout
         and clip/hide "Music Videos" entirely. With a 0 floor, the
         video row still hugs its full 16:9 height whenever there's
         room (nothing changes in the common case) but can shrink first
         when the window doesn't have enough height for everything, so
         the video scales down to fit instead of overflowing.

         The SoundCloud row keeps a min-content floor for the same
         reason in reverse: when there isn't room for everything, the
         shrinking has to come out of the video — which letterboxes
         inside its own pane and still looks right — rather than out of
         the "Now Playing" card, which has nowhere to go and would just
         have its artwork and controls cropped off the bottom. */
      grid-template-rows: minmax(0, auto) minmax(min-content, 1fr);
      grid-template-areas:
        "video      playlist"
        "soundcloud playlist";
      gap: 14px;
    }
    /* Hide Playlist: let the video (and the Now Playing card below it)
       span both columns instead of redefining the whole grid template
       (rows/columns/areas together) — changing just this one property
       is a much smaller move for the browser to reconcile than swapping
       the entire template, which is what was making the video embed's
       sizing/positioning glitch and drift outside the background panel
       when the button was clicked. */
    .layout.playlist-hidden .video-pane,
    .layout.playlist-hidden .sc-section {
      grid-column: 1 / -1;
    }
    /* Collapse Video: the freed video row goes entirely to the "Now
       Playing" card below it — same idea as Hide Playlist just above,
       spanning grid rows instead of columns. */
    .layout.video-collapsed .sc-section {
      grid-row: 1 / -1;
    }
    /* max-height keeps the 16:9 box inside its grid row. aspect-ratio
       alone sizes the pane from its width and then simply overflows a
       row that turned out to be shorter — which is how the video used
       to end up sitting on top of the "Now Playing" card on a short
       window. Clamped to the row instead, the video letterboxes within
       the pane (that is what .video-frame-wrap's container units are
       for) and everything below it stays where it belongs. */
    .video-pane { grid-area: video; min-height: 0; max-height: 100%; }
    .sc-section {
      grid-area: soundcloud;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .playlist-pane { grid-area: playlist; min-height: 0; }
  }

  .video-pane {
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    width: 100%;
    /* Aspect-ratio (not a flex-stretched height) caps this at a true
       16:9 box — it previously stretched to match the "Up Next" column's
       full height, leaving a tall pane with far more room than the video
       itself needed. */
    aspect-ratio: 16 / 9;
    flex: 0 0 auto;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Sits over the video pane while the YouTube embed has nothing to show
     yet — before the player's first onReady, and again on a rebuffer —
     so switching/starting a video doesn't just look frozen on black.
     Hidden whenever showVideoCoverArt() takes over the pane for a
     SoundCloud-only track instead. */
  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }

  .gif-loader {
    display: block;
    width: min(120px, 40%);
    height: auto;
    opacity: 0.5;
  }

  /* ---------- COLLAPSE VIDEO / AUDIO-ONLY MODE ----------
     display:none can make a YouTube iframe actually stop playing, so
     instead of removing the pane this takes it out of flow (grid and
     flex alike) and shrinks it to a hidden 1x1px — the same "invisible
     but still alive" trick already used for the SoundCloud engine's own
     iframe below (.sc-widget-frame). The video keeps playing for its
     audio; the space it leaves behind goes to the "Now Playing" card —
     see .sc-section's grid-row override above, and on mobile this just
     closes the gap in the flex column on its own once the pane leaves
     it. */
  .layout.video-collapsed .video-pane {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    min-height: 0;
    max-height: none;
    aspect-ratio: auto;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-cover-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .video-cover-overlay[hidden] { display: none; }
  .video-cover-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .playlist-pane {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    display: flex;
    container-type: size;
    container-name: playlistbox;
  }

  .layout.playlist-hidden .playlist-pane { display: none; }
  @media (max-width: 860px) {
    .layout.playlist-hidden .video-pane { flex: 1 1 auto; aspect-ratio: auto; }
    /* Collapse Video: same growth the desktop .sc-card rule already gets
       (below, under the min-width query) — without it the freed video
       space would just sit empty above the playlist row instead of the
       Now Playing card filling it. .sc-section needs display:flex of
       its own here since it isn't a flex container outside desktop. */
    .layout.video-collapsed .sc-section { flex: 1 1 auto; display: flex; flex-direction: column; }
    .layout.video-collapsed .sc-card { flex: 1 1 auto; justify-content: center; }
  }


  /* ---------- CREATOR CHIN ----------
     A row of pill buttons across the bottom, one per creator seen in the
     playlist (plus "All"). Auto-populated as each track's author comes
     back from the oEmbed fetch below — clicking one filters the same
     "Up Next" list to just that creator's tracks, it doesn't touch
     what's currently playing. */
  .creator-chin {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5vw, 10px);
    /* Equal breathing room above (from the header's divider line below)
       and below (before the list starts) — was 2px all around, which
       read as cramped right under that line. */
    margin: clamp(8px, 2.6cqh, 12px) 0;
    padding: 0 2px;
    overflow-x: auto;
    overflow-y: hidden;
    /* Scrolling (swipe/drag/shift+wheel) still works when there are more
       chips than fit — this just hides the visible scrollbar itself, on
       every device, not just phones. */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* old Edge/IE */
  }
  .creator-chin::-webkit-scrollbar { display: none; } /* Chrome/Safari/new Edge */

  .creator-chip {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    border-radius: 999px;
    padding: clamp(6px, 1.6vw, 9px) clamp(14px, 3vw, 18px);
    font-size: clamp(11px, 2.6vw, 13px);
    white-space: nowrap;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .creator-chip:hover { background: var(--accent-dim); color: #ffffff; }
  .creator-chip.active {
    /* The selected chip (including "All") stands out using the same
       gold accent every other button already uses for its default
       state — text flips to the dark ink color here, same as the
       existing pill-btn/round-btn convention. */
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #1a1200;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .unmute-btn {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
  }

  .video-pane .unmute-btn,
  .video-pane .video-pane-actions,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane:hover .unmute-btn,
  .video-pane:hover .video-pane-actions,
  .video-pane:hover .video-controls,
  .video-pane:focus-within .unmute-btn,
  .video-pane:focus-within .video-pane-actions,
  .video-pane:focus-within .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- CUSTOM VIDEO PLAYBACK CONTROLS ---------- */
  .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(58, 42, 0, 0.85), rgba(58, 42, 0, 0));
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: var(--accent);
    border: 1px solid var(--line);
    color: #1a1200;
  }
  .round-btn:hover:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .round-btn:active:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
    /* Same spring-y "pop" as the homepage Listen widget's play button —
       overshoots past 1.0 before settling, so hovering gives it a little
       dance instead of a flat color swap. */
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .play-pause-btn:hover:not(:disabled) {
    transform: scale(1.22) rotate(-6deg);
  }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }

  /* Native Fullscreen API on a plain div (not a video/img element)
     doesn't reliably get full-viewport UA sizing/positioning on its own
     — explicit position:fixed + full-viewport sizing here matches
     .pseudo-fullscreen above (the JS fallback for when native
     fullscreen isn't available), so the video actually covers the
     screen instead of fullscreening at its existing grid-cell size. */
  .video-pane:fullscreen,
  .video-pane:-webkit-full-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh;
    aspect-ratio: auto;
    margin: 0;
    border-radius: 0;
  }

  /* Belt-and-suspenders alongside the sizing fix above: whichever
     fullscreen path is active, explicitly hide SoundCloud/the artist
     chips + "Music Videos" list (chips live inside .playlist-pane now,
     see the HTML) rather than relying on the video simply covering
     them, so there's no overlap even if a browser sizes fullscreen
     differently than expected. */
  .layout.fullscreen-active .sc-section,
  .layout.fullscreen-active .playlist-pane {
    display: none;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: transparent; }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -4.5px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid #ffffff; cursor: pointer;
  }
  .scrub-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--accent-dim); }
  .scrub-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .scrub-range::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #ffffff; cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  /* ---------- PLAYLIST WIDGET ---------- */
  .playlist-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .playlist-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(8px, 2.6cqh, 12px) clamp(10px, 3cqw, 14px);
    border-bottom: 1px solid var(--line);
  }

  .playlist-title {
    font-size: clamp(12px, 3.2cqw, 15px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .playlist-count {
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
  }

  .playlist-items {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(8px, 2.4cqh, 12px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2cqh, 10px);
    /* Scrolling still works (vertical on desktop, horizontal on mobile
       below) — this just hides the visible scrollbar itself, matching
       the creator chin and SoundCloud track list elsewhere on this page. */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* old Edge/IE */
  }
  .playlist-items::-webkit-scrollbar { display: none; } /* Chrome/Safari/new Edge */

  @media (max-width: 860px) {
    /* align-items: flex-start — NOT stretch. Stretching every card to
       the row's full height is what squashed the thumbnails on a phone:
       the card got whatever vertical room was left over, the thumbnail
       grew/shrank to fill it, and object-fit:cover then cropped the
       image down to a thin horizontal band. Content-height cards keep
       every thumbnail at a true 16:9 instead, and the widget asks its
       host page for exactly the height that needs (see the height
       reporter at the bottom of this file). */
    .playlist-items { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }
  }

  .playlist-item {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.4cqw, 12px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: clamp(6px, 2cqw, 10px);
    padding: clamp(6px, 1.8cqh, 8px);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
    flex: none;
    /* A gentler version of the round buttons' hover dance — just a
       soft lift, no rotation — on hover and on touch-tap (:active), so
       cards feel a little alive without competing with the more
       dramatic button animations elsewhere on the page. */
    transition: transform 0.2s ease, background 0.15s ease;
  }
  .playlist-item:hover,
  .playlist-item:active {
    transform: scale(1.03) translateY(-2px);
  }
  .playlist-item:hover { background: var(--lime-dim); }
  .playlist-item.active {
    background: var(--lime-dim);
    border-color: var(--lime);
    box-shadow: 0 0 8px rgba(163, 230, 53, 0.5);
  }

  @media (max-width: 860px) {
    /* Thumbnail on top, title + creator underneath, left-aligned — a
       different format than desktop's side-by-side row, since a bigger
       thumbnail reads much better on a phone. width/align-items only
       (the thumbnail/meta flex overrides live in a second media block
       AFTER the base .playlist-thumb-wrap rule below — same specificity
       or CSS rules, later source order wins, so this one has to come
       after the base rule, not before it, or the base rule's fixed
       aspect-ratio/flex:none silently wins back). */
    .playlist-item {
      flex-direction: column;
      align-items: stretch;
      /* cqw (this pane's own width), not vw (the raw viewport) — vw
         ignores the layout's own padding/max-width, so at in-between
         window sizes the card width could drift out of step with how
         much room the pane actually has. */
      width: clamp(150px, 46cqw, 210px);
    }
  }

  .playlist-thumb-wrap {
    position: relative;
    flex: none;
    width: clamp(72px, 24cqw, 108px);
    aspect-ratio: 16 / 9;
    border-radius: clamp(4px, 1cqw, 6px);
    overflow: hidden;
    background: #000;
  }
  .playlist-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 860px) {
    /* Full card width, but still a true 16:9 box — the base rule's
       aspect-ratio and flex:none are deliberately left alone here. An
       earlier version let the thumbnail flex-grow into whatever height
       the (stretched) card had; on a phone that height is whatever the
       screen has left over, so the box went wide-and-short and
       object-fit:cover cropped the artwork to a sliver. Fixed ratio +
       content-height cards (see .playlist-items above) keeps every
       thumbnail in proportion at any screen size. */
    .playlist-thumb-wrap { width: 100%; }
    .playlist-meta { flex: 0 0 auto; }
  }
  .playlist-item.active .playlist-thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--lime);
    border-radius: inherit;
  }
  .now-playing-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(58, 42, 0, 0.85);
    color: var(--lime);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    display: none;
  }
  .playlist-item.active .now-playing-badge { display: inline-block; }

  .playlist-meta {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;

     at the very bottom of the widget (a chin of its own); on desktop
     the min-width:861px block above puts it in the left grid column
     and lets it fill the leftover vertical room there instead. */
  .sc-widget-frame {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;

     base .sc-card rule above on purpose (same specificity, so source

     the unscoped rule it's meant to override gets silently undone by it,
     since scoping alone doesn't add specificity. On mobile .sc-section
     isn't a flex container, so this flex value has no effect there

  @media (min-width: 861px) {

<script>
// ============================================================
// DEFAULT PLAYLIST — used as a fallback only: before the Firestore
// document has ever been saved, or if it's temporarily unreachable.
// Once you sign in as admin and save changes, the Firestore document
// becomes the live source of truth for every visitor.

  { url: "https://youtube.com/watch?v=VuivQyVyKDM", title: "Track Two" },
  { url: "https://youtube.com/watch?v=Jc9Eay0tedo", title: "Track Three" }
];
// ============================================================

let currentVideoList = DEFAULT_VIDEO_LIST;

// Creator settings, editable from the admin panel's "Creators" section and
// synced the same way the track list is: creatorAliases renames/combines a
// raw detected author name into a display name (two raw names sharing the
// same display name become one chip), creatorOrder is the explicit chip
// order set there, and hiddenCreators removes a raw author from the chin
// entirely (their tracks still show under "All"). Declared at this outer
// script level — not inside either IIFE below — so both the player logic
// and the admin panel can read and update them directly.
let creatorAliases = {};
let creatorOrder = [];
let hiddenCreators = [];

// Which creator the chin is currently filtering to — null means "All".
let activeAuthorFilter = null;

// ---------- ONE LIST, ONE PLAYHEAD ----------
// activeKey is the single source of truth for "what's playing right
// now": a YouTube video id, or 'sc-' + a SoundCloud sound id, or null
// before anything has started. Both IIFEs below read it directly (same
// top-level cross-script-tag pattern as activeAuthorFilter above) to
// know which of the two real players is the active source.
let activeKey = null;
function isScKey(key) {
  return typeof key === 'string' && key.indexOf('sc-') === 0;
}

// Raw SoundCloud sounds, fetched once by the SoundCloud IIFE and read
// here by the video IIFE to build the single merged "Music Videos"
// list — every video, plus any SoundCloud-only song with no matching
// video, using that song's own cover art as its thumbnail.
let scSoundsList = [];

// ---------- CROSS-IIFE BRIDGES ----------
// Same no-op-until-ready pattern used throughout this file: each starts
// as a harmless placeholder and gets replaced with the real
// implementation once its owning IIFE runs, so whichever IIFE calls one
// first never throws.

// SoundCloud IIFE -> video IIFE
let refreshMergedPlaylist = function () {};      // call after scSoundsList is fetched
let advanceToNextInMergedList = function () {};  // call when a SoundCloud track finishes
let pauseCurrentVideo = function () {};
let resumeCurrentVideo = function () {};
let seekVideoToFraction = function () {};
// Lets the video pane's own scrub bar/play button reflect and control a
// SoundCloud track while it's the active source.
let notifyScProgress = function () {};
let notifyScPlayState = function () {};

// video IIFE -> SoundCloud IIFE (owns the real SoundCloud engine and
// the "Now Playing" panel that mirrors whichever kind is active)
let playScByIndex = function () {};
let pauseSc = function () {};
let resumeSc = function () {};
let seekScToFraction = function () {};
let setNowPlayingFromVideo = function () {};
let notifyVideoProgress = function () {};
let notifyVideoPlayState = function () {};

function resolveAuthorDisplay(rawAuthor) {
  if (!rawAuthor) return rawAuthor;
  return creatorAliases[rawAuthor] || rawAuthor;
}

// Shared between both IIFEs: the video IIFE needs these to build the
// merged "Music Videos" list's SoundCloud-only entries; the SoundCloud
// IIFE needs them for its own "Now Playing" panel.
function getScAuthor(sound) {
  return (sound && sound.user && sound.user.username) ? sound.user.username : 'Unknown';
}
// SoundCloud's default artwork_url points at a small "-large" (100x100)
// image — swapping in "-t500x500" gets a much sharper version at the
// same URL. Falls back to the uploader's avatar for tracks with no
// artwork of their own (SoundCloud does this too on the real site).
function getScArtworkUrl(sound) {
  const raw = (sound && (sound.artwork_url || (sound.user && sound.user.avatar_url))) || '';
  return raw ? raw.replace('-large.jpg', '-t500x500.jpg') : '';
}

function extractVideoId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed; // already a bare ID
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return null;
}

// previousPlaylist carries over already-resolved title/author data for any
// track that appears in both the old and new list, by id — instead of
// wiping every entry back to null and re-fetching from scratch every time
// this runs. This matters because Firestore's onSnapshot listener fires
// more than once on a normal page load (once immediately from its local
// cache, then again once the server confirms the same data), and without
// this, that second firing would reset every author back to null right as
// the first round's fetches were finishing — which is what would leave the
// creator chin stuck showing "Loading" even though the data had already
// been fetched successfully.
function buildPlaylist(list, previousPlaylist) {
  const previousById = new Map();
  (previousPlaylist || []).forEach(v => { if (v.id) previousById.set(v.id, v); });

  return list
    .map(v => {
      const id = extractVideoId(v.url);
      if (!id) return null;
      const prev = previousById.get(id);
      const manualTitle = (v.title && v.title.trim()) ? v.title.trim() : null;
      return {
        id,
        title: manualTitle || (prev ? prev.title : null),
        author: prev ? prev.author : null
      };
    })
    .filter(Boolean);
}

let VIDEO_PLAYLIST = buildPlaylist(currentVideoList);
// Highlights the first video as "active" from the very first paint,
// matching the fact that it starts autoplaying (muted) immediately.
activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;

(function () {
  const unmuteBtn = document.getElementById('unmuteBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const scrubRange = document.getElementById('scrubRange');
  const timeLabel = document.getElementById('timeLabel');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const videoPane = document.getElementById('videoPane');
  const playlistItemsEl = document.getElementById('playlistItems');
  const playlistCountEl = document.getElementById('playlistCount');
  const creatorChinEl = document.getElementById('creatorChin');
  const layoutEl = document.getElementById('layout');
  const ytFrame = document.getElementById('ytFrame');
  const videoLoading = document.getElementById('videoLoading');
  const videoCoverOverlay = document.getElementById('videoCoverOverlay');
  const videoCoverArt = document.getElementById('videoCoverArt');

  let ytPlayer = null;
  let isDragging = false;
  let pollTimer = null;
  let apiReady = false;       // true once the YT.Player instance has fired onReady
  let ytScriptReady = false;  // true once the YouTube iframe API script has loaded
  let firestoreDataReady = false; // true once the first Firestore snapshot has arrived
  let pendingLoadId = null;
  let pendingUnmute = false;
  let loadedVideoId = null;    // whichever video id is actually loaded into ytFrame right now
  let currentMergedList = [];  // the single "Music Videos" list actually on screen right now
  let scIsActivePlaying = false; // last play state reported via notifyScPlayState below

  unmuteBtn.disabled = true;

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateRangeFill() {
    const min = parseFloat(scrubRange.min) || 0;
    const max = parseFloat(scrubRange.max) || 100;
    const val = parseFloat(scrubRange.value) || 0;
    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
    scrubRange.style.background =
      'linear-gradient(to right, var(--accent) 0%, var(--accent) ' + pct +
      '%, var(--accent-dim) ' + pct + '%, var(--accent-dim) 100%)';
  }

  function updatePlayPauseIcon(isPlaying) {
    if (isPlaying) {
      playPauseBtn.innerHTML = '&#10074;&#10074;';
      playPauseBtn.title = 'Pause';
    } else {
      playPauseBtn.innerHTML = '&#9658;';
      playPauseBtn.title = 'Play';
    }
  }

  function updateProgress() {
    // A SoundCloud track is the active source — notifyScProgress below
    // drives this same scrub bar/time label from its progress instead.
    if (isScKey(activeKey)) return;
    if (!ytPlayer || isDragging) return;
    const duration = ytPlayer.getDuration();
    const current = ytPlayer.getCurrentTime();
    if (duration > 0) {
      scrubRange.max = duration;
      scrubRange.value = current;
      updateRangeFill();
      timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }
    // Lets the "Now Playing" panel's own progress bar track this video's
    // playhead whenever it's the active source.
    notifyVideoProgress(current, duration);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---------- ONE LIST, ONE PLAYHEAD ----------
  // Builds the single "Music Videos" list: every video, plus any
  // SoundCloud-only song (no matching video by title) using that song's
  // own cover art as its thumbnail. Matching happens once here, not at
  // playback time, so there's exactly one entry — and one key — per song
  // regardless of which platform(s) it's actually on.
  function normalizeTitleForMatch(t) {
    return (t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function buildMergedList() {
    const merged = [];
    const usedScIndexes = new Set();

    VIDEO_PLAYLIST.forEach(v => {
      merged.push({
        key: v.id,
        kind: 'video',
        videoId: v.id,
        title: v.title,
        author: v.author,
        thumbnail: 'https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg',
        linkUrl: 'https://www.youtube.com/watch?v=' + v.id
      });

      const vNorm = normalizeTitleForMatch(v.title);
      if (!vNorm) return;
      scSoundsList.forEach((sound, i) => {
        if (usedScIndexes.has(i)) return;
        const scNorm = normalizeTitleForMatch(sound.title);
        if (scNorm && (scNorm === vNorm || scNorm.includes(vNorm) || vNorm.includes(scNorm))) {
          usedScIndexes.add(i);
        }
      });
    });

    scSoundsList.forEach((sound, i) => {
      if (usedScIndexes.has(i)) return;
      merged.push({
        key: 'sc-' + sound.id,
        kind: 'sc',
        soundIndex: i,
        title: sound.title,
        author: getScAuthor(sound),
        thumbnail: getScArtworkUrl(sound),
        linkUrl: sound.permalink_url || '#'
      });
    });

    return merged;
  }

  // ---------- PLAYLIST RENDER ----------
  function renderPlaylist(merged) {
    if (!merged.length) {
      playlistItemsEl.innerHTML = '<div class="empty-state">No tracks added yet.</div>';
      playlistCountEl.textContent = '';
      return;
    }

    const visible = merged.filter(e => !activeAuthorFilter || resolveAuthorDisplay(e.author) === activeAuthorFilter);

    if (!visible.length) {
      playlistItemsEl.innerHTML = '<div class="empty-state">No tracks from this creator yet.</div>';
      playlistCountEl.textContent = '0 tracks';
      return;
    }

    playlistCountEl.textContent = visible.length + (visible.length === 1 ? ' track' : ' tracks');
    playlistItemsEl.innerHTML = visible.map(e => {
      const title = (typeof e.title === 'string' && e.title.trim()) ? e.title.trim() : 'Loading title…';
      const isActive = e.key === activeKey;
      // Shows who made it instead of a generic "Tap to play" once the
      // author's known — falls back to "Tap to play" only while it's
      // still being fetched.
      const sub = isActive
        ? 'Now playing'
        : (e.author ? escapeHtml(resolveAuthorDisplay(e.author)) : 'Tap to play');
      return `
      <button class="playlist-item${isActive ? ' active' : ''}" data-key="${escapeHtml(e.key)}" title="${escapeHtml(title)}">
        <div class="playlist-thumb-wrap">
          <img src="${escapeHtml(e.thumbnail)}" alt="${escapeHtml(title)}" loading="lazy" />
          <span class="now-playing-badge">Now Playing</span>
        </div>
        <div class="playlist-meta">
          <div class="playlist-item-title">${escapeHtml(title)}</div>
          <div class="playlist-item-sub">${sub}</div>
        </div>
      </button>
    `;
    }).join('');

    playlistItemsEl.querySelectorAll('.playlist-item').forEach(btn => {
      btn.addEventListener('click', function () {
        playMergedKey(this.getAttribute('data-key'));
      });
    });
  }

  // Switches which card is marked "active" in place — toggling classes
  // and text on the existing buttons — instead of rebuilding the whole
  // list's innerHTML. Rebuilding on every click reset playlistItemsEl's
  // own scroll position back to 0, which is what made picking a video
  // near the end of the mobile swipe list jump straight back to the
  // start right after the tap. Only actual content changes (a new/
  // reordered list, a filter change) should go through the full
  // renderPlaylist() rebuild above — a change in which entry is active
  // should not.
  function updateActiveHighlight() {
    playlistItemsEl.querySelectorAll('.playlist-item').forEach(btn => {
      const key = btn.getAttribute('data-key');
      const isActive = key === activeKey;
      btn.classList.toggle('active', isActive);
      const subEl = btn.querySelector('.playlist-item-sub');
      if (!subEl) return;
      if (isActive) {
        subEl.textContent = 'Now playing';
      } else {
        const entry = currentMergedList.find(e => e.key === key);
        subEl.textContent = entry && entry.author ? resolveAuthorDisplay(entry.author) : 'Tap to play';
      }
    });
  }

  // ---------- CREATOR CHIN RENDER ----------
  // Auto-populated from whichever authors have shown up in the merged
  // list so far (fetchTitles fills v.author in asynchronously for video
  // entries, so this gets called again each time one resolves — a
  // SoundCloud entry's author is already known as soon as it's fetched).
  // Clicking a chip only changes the filter used by renderPlaylist above
  // — it never touches what's currently playing.
  //
  // The "All" chip always renders immediately, even before any author has
  // loaded — a panel that only appears once the network fetch succeeds is
  // a panel that can silently never appear at all (one failed request and
  // there's nothing on screen to show something's wrong). "Unknown" is
  // kept as a real, clickable chip too instead of being hidden, so a
  // failed lookup still leaves a working filter rather than making the
  // whole feature vanish.
  function renderCreatorChin(merged) {
    const authors = [];
    let stillLoading = false;
    merged.forEach(e => {
      if (e.author === null) { stillLoading = true; return; }
      if (hiddenCreators.includes(e.author)) return; // hidden from the chin (its tracks still show under "All")
      const display = resolveAuthorDisplay(e.author);
      if (!authors.includes(display)) authors.push(display);
    });

    // Sorted by the admin-set creatorOrder first (from the "Creators"
    // section of the editor); anything not explicitly ordered falls back
    // to A→Z (case-insensitive) so the chin never looks scrambled just
    // because a brand-new creator hasn't been given a position yet.
    // "Unknown" always goes last since it's a fallback, not a real name.
    authors.sort((a, b) => {
      const ia = creatorOrder.indexOf(a);
      const ib = creatorOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      if (a === 'Unknown') return 1;
      if (b === 'Unknown') return -1;
      return a.localeCompare(b, undefined, { sensitivity: 'base' });
    });

    const allChip = `<button class="creator-chip${!activeAuthorFilter ? ' active' : ''}" data-author="">All</button>`;
    const authorChips = authors.map(a => {
      const label = a === 'Unknown' ? 'Unknown Channel' : a;
      return `<button class="creator-chip${activeAuthorFilter === a ? ' active' : ''}" data-author="${escapeHtml(a)}">${escapeHtml(label)}</button>`;
    });
    const loadingChip = stillLoading
      ? '<span class="creator-chip" style="opacity:0.5;cursor:default;">Loading</span>'
      : '';
    creatorChinEl.innerHTML = [allChip].concat(authorChips).join('') + loadingChip;

    creatorChinEl.querySelectorAll('.creator-chip[data-author]').forEach(btn => {
      btn.addEventListener('click', function () {
        activeAuthorFilter = this.getAttribute('data-author') || null;
        renderCreatorChin(currentMergedList);
        renderPlaylist(currentMergedList);
      });
    });
  }

  // Rebuilds the merged list and re-renders everything driven by it — the
  // single place a Firestore update (handlePlaylistSnapshot) and a fresh
  // SoundCloud fetch (via the refreshMergedPlaylist bridge) both funnel
  // through, so the list and chin never get out of sync with each other.
  function recomputeAndRenderAll() {
    currentMergedList = buildMergedList();
    renderCreatorChin(currentMergedList);
    renderPlaylist(currentMergedList);
    pushNowPlayingForActiveVideo();
  }
  refreshMergedPlaylist = recomputeAndRenderAll;

  // Keeps the "Now Playing" panel (owned by the SoundCloud IIFE) in sync
  // with whichever video entry is active — a no-op while a SoundCloud
  // entry is active instead, since that panel then drives itself.
  function pushNowPlayingForActiveVideo() {
    if (isScKey(activeKey)) return;
    const entry = currentMergedList.find(e => e.key === activeKey);
    if (!entry) return;
    setNowPlayingFromVideo({
      title: (typeof entry.title === 'string' && entry.title.trim()) ? entry.title.trim() : 'Loading title…',
      author: entry.author ? resolveAuthorDisplay(entry.author) : '',
      thumbnail: entry.thumbnail,
      linkUrl: entry.linkUrl
    });
  }

  // Pull each track's real title AND creator name from YouTube's oEmbed
  // data (via noembed.com, which mirrors YouTube's oEmbed response —
  // including author_name — but reliably sends the CORS headers a
  // browser needs; calling youtube.com/oembed directly often fails
  // silently or gets blocked cross-origin). Title-fetching is skipped for
  // entries where one was typed in manually, but the author is always
  // pulled since that's what drives the creator chin.
  //
  // This has to live in here (not at the top level of the script) so its
  // calls to recomputeAndRenderAll() below can actually see it — declared
  // inside this same IIFE. Calling it from an outer-scope fetchTitles()
  // would silently throw a ReferenceError on every fetch completion
  // (visible only in the browser console), leaving the creator chin
  // permanently stuck showing "Loading" even though the author data
  // itself had already been fetched successfully.
  function fetchTitles() {
    VIDEO_PLAYLIST.forEach((v, i) => {
      const needsTitle = !v.title;
      if (!needsTitle && v.author) return; // nothing left to fetch for this one
      const watchUrl = 'https://www.youtube.com/watch?v=' + v.id;

      // Some desktop setups (ad blockers, browser extensions, corporate
      // networks) silently hang a request to a third-party domain like
      // noembed.com instead of erroring outright — no CORS error, no
      // rejection, it just never comes back. Aborting after 8s guarantees
      // this always settles one way or the other.
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      fetch('https://noembed.com/embed?url=' + encodeURIComponent(watchUrl) + '&format=json', { signal: controller.signal })
        .then(res => { if (!res.ok) throw new Error('oEmbed request failed'); return res.json(); })
        .then(data => {
          clearTimeout(timeoutId);
          if (needsTitle) {
            const t = data && typeof data.title === 'string' ? data.title.trim() : '';
            v.title = t ? t : ('Track ' + (i + 1));
          }
          const a = data && typeof data.author_name === 'string' ? data.author_name.trim() : '';
          v.author = a || 'Unknown';
          recomputeAndRenderAll();
        })
        .catch(() => {
          clearTimeout(timeoutId);
          if (needsTitle) v.title = 'Track ' + (i + 1);
          v.author = v.author || 'Unknown';
          recomputeAndRenderAll();
        });
    });
  }

  function pauseAndMuteVideoLocal() {
    if (!ytPlayer) return;
    if (typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
    if (typeof ytPlayer.mute === 'function') ytPlayer.mute();
    unmuteBtn.textContent = 'Unmute';
    unmuteBtn.title = 'Unmute';
  }

  function doUnmute() {
    if (!ytPlayer || typeof ytPlayer.unMute !== 'function') return;
    ytPlayer.unMute();
    ytPlayer.setVolume(100);
    unmuteBtn.textContent = 'Mute';
    unmuteBtn.title = 'Mute';
  }

  // Covers the (paused, stale) video with the active SoundCloud track's
  // own cover art, so the pane doesn't just sit on whatever video frame
  // happened to be showing when SoundCloud took over.
  function showVideoCoverArt(artworkUrl) {
    videoCoverArt.src = artworkUrl;
    videoCoverOverlay.hidden = false;
    videoLoading.hidden = true;
  }
  function hideVideoCoverArt() {
    videoCoverOverlay.hidden = true;
  }

  // Loads a video into the (single, persistent) YouTube player instance.
  // autoUnmute is true for a direct click on a video entry, so it plays
  // with sound right away instead of needing a separate Unmute click.
  function loadVideo(id, autoUnmute) {
    loadedVideoId = id;
    if (ytPlayer && apiReady) {
      videoLoading.hidden = false;
      ytPlayer.loadVideoById(id);
      if (autoUnmute) doUnmute();
    } else {
      pendingLoadId = id;
      pendingUnmute = autoUnmute;
    }
  }

  // The one place a click (playlist item, or advancing to the next track)
  // turns into "this is what's playing now" — sets activeKey once, then
  // hands off to whichever real engine (YouTube or SoundCloud) owns that
  // kind of entry.
  function playMergedKey(key) {
    const entry = currentMergedList.find(e => e.key === key);
    if (!entry) return;
    if (entry.kind === 'sc') {
      pauseAndMuteVideoLocal();
      activeKey = key;
      updateActiveHighlight();
      showVideoCoverArt(entry.thumbnail);
      playScByIndex(entry.soundIndex);
    } else {
      activeKey = key;
      updateActiveHighlight();
      hideVideoCoverArt();
      pauseSc();
      loadVideo(entry.videoId, true);
      pushNowPlayingForActiveVideo();
    }
  }

  function advanceFromKey(key) {
    if (!currentMergedList.length) return;
    const idx = currentMergedList.findIndex(e => e.key === key);
    const nextIdx = idx === -1 ? 0 : (idx + 1) % currentMergedList.length;
    playMergedKey(currentMergedList[nextIdx].key);
  }
  advanceToNextInMergedList = function () { advanceFromKey(activeKey); };

  // ---------- YT IFRAME API ----------
  function tryInitPlayer() {
    if (ytPlayer || !ytScriptReady || !firestoreDataReady || !VIDEO_PLAYLIST.length) return;

    ytFrame.src = 'https://www.youtube.com/embed/' + VIDEO_PLAYLIST[0].id +
      '?rel=0&autoplay=1&mute=1&controls=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1';
    loadedVideoId = VIDEO_PLAYLIST[0].id;

    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          apiReady = true;
          // Set once here (rather than only on unmute) so the video is
          // always at full volume the first time it's actually heard,
          // regardless of which path unmutes it — YouTube's iframe can
          // otherwise carry over a quieter volume from an earlier
          // session/embed on the same page.
          ytPlayer.setVolume(100);
          unmuteBtn.disabled = false;
          playPauseBtn.disabled = false;
          scrubRange.disabled = false;
          updatePlayPauseIcon(true);
          updateProgress();
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(updateProgress, 500);
          if (pendingLoadId) {
            ytPlayer.loadVideoById(pendingLoadId);
            loadedVideoId = pendingLoadId;
            if (pendingUnmute) doUnmute();
            pendingLoadId = null;
            pendingUnmute = false;
          }
        },
        onStateChange: function (event) {
          if (isScKey(activeKey)) return; // a SoundCloud track owns playback right now
          if (event.data === YT.PlayerState.PLAYING) {
            videoLoading.hidden = true;
          } else if (event.data === YT.PlayerState.BUFFERING) {
            videoLoading.hidden = false;
          }
          updatePlayPauseIcon(event.data === YT.PlayerState.PLAYING);
          // Keeps the "Now Playing" panel's play icon in sync when this
          // video is the active source (e.g. paused/resumed from the
          // video pane's own controls instead of that panel's).
          notifyVideoPlayState(event.data === YT.PlayerState.PLAYING);
          if (event.data === YT.PlayerState.ENDED) {
            advanceFromKey(activeKey);
          }
        }
      }
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    ytScriptReady = true;
    tryInitPlayer();
  };

  unmuteBtn.addEventListener('click', function () {
    if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
    if (ytPlayer.isMuted()) {
      if (isScKey(activeKey)) {
        // Only one of the video/SoundCloud should have audio at a time —
        // reclaim the currently-loaded video as the active source.
        pauseSc();
        activeKey = loadedVideoId;
        updateActiveHighlight();
        hideVideoCoverArt();
        pushNowPlayingForActiveVideo();
        ytPlayer.playVideo();
      }
      doUnmute();
    } else {
      ytPlayer.mute();
      unmuteBtn.textContent = 'Unmute';
      unmuteBtn.title = 'Unmute';
    }
  });

  // ---------- ONE PLAYER, MANY SOURCES (SoundCloud IIFE -> here) ----------
  pauseCurrentVideo = function () {
    if (ytPlayer) ytPlayer.pauseVideo();
  };
  resumeCurrentVideo = function () {
    if (ytPlayer) ytPlayer.playVideo();
  };
  seekVideoToFraction = function (fraction) {
    if (!ytPlayer) return;
    const duration = ytPlayer.getDuration();
    if (duration > 0) ytPlayer.seekTo(fraction * duration, true);
  };
  // Lets the video pane's own scrub bar/play button reflect and control a
  // SoundCloud track while it's the active source — called from the
  // SoundCloud IIFE's own progress/play-state events.
  notifyScProgress = function (current, duration) {
    if (!isScKey(activeKey) || !duration || isDragging) return;
    scrubRange.max = duration;
    scrubRange.value = current;
    updateRangeFill();
    timeLabel.textContent = formatTime(current) + ' / ' + formatTime(duration);
  };
  notifyScPlayState = function (isPlaying) {
    scIsActivePlaying = isPlaying;
    if (isScKey(activeKey)) updatePlayPauseIcon(isPlaying);
  };

  playPauseBtn.addEventListener('click', function () {
    // A SoundCloud track is the active source — this button controls
    // that instead of the paused, irrelevant video.
    if (isScKey(activeKey)) {
      if (scIsActivePlaying) pauseSc();
      else resumeSc();
      return;
    }
    if (!ytPlayer) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  });

  scrubRange.addEventListener('input', function () {
    isDragging = true;
    updateRangeFill();
    const duration = ytPlayer ? ytPlayer.getDuration() : parseFloat(scrubRange.max);
    timeLabel.textContent = formatTime(parseFloat(scrubRange.value)) + ' / ' + formatTime(duration);
  });

  scrubRange.addEventListener('change', function () {
    if (isScKey(activeKey)) {
      const max = parseFloat(scrubRange.max) || 0;
      const fraction = max > 0 ? parseFloat(scrubRange.value) / max : 0;
      seekScToFraction(fraction);
    } else if (ytPlayer) {
      ytPlayer.seekTo(parseFloat(scrubRange.value), true);
    }
    isDragging = false;
  });

  // ---------- FULLSCREEN ----------
  let usingPseudoFullscreen = false;

  function hasNativeFullscreenSupport(el) {
    return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen);
  }
  function isFullscreen() {
    return usingPseudoFullscreen || !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  function requestFs(el) {
    try {
      let result;
      if (el.requestFullscreen) result = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) result = el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) result = el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) result = el.msRequestFullscreen();
      if (result && typeof result.catch === 'function') result.catch(() => enterPseudoFullscreen());
    } catch (e) { enterPseudoFullscreen(); }
  }
  function exitFs() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
  function handleEscKey(e) { if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen(); }
  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function updateFullscreenIcon() {
    const fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';
    // Lets the CSS hide SoundCloud/"Music Videos" (with the artist
    // chips now inside it), which would otherwise sit visible/
    // overlapping beside a fullscreened video.
    layoutEl.classList.toggle('fullscreen-active', fs);
  }
  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) requestFs(videoPane);
    else enterPseudoFullscreen();
  });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
    document.addEventListener(evt, updateFullscreenIcon);
  });

  // ---------- LIVE SYNC FROM FIRESTORE ----------
  // Every visitor (no sign-in required) subscribes to the shared playlist
  // document. The first snapshot boots the player; later snapshots (an
  // admin saving changes) update the on-screen list for everyone without
  // a page reload, and try to keep whatever's currently playing playing.
  function handlePlaylistSnapshot(list) {
    currentVideoList = list;
    const newVideoPlaylist = buildPlaylist(currentVideoList, VIDEO_PLAYLIST);

    if (!firestoreDataReady) {
      firestoreDataReady = true;
      VIDEO_PLAYLIST = newVideoPlaylist;
      activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;
      recomputeAndRenderAll();
      fetchTitles();
      tryInitPlayer();
      return;
    }

    // A SoundCloud entry's key doesn't depend on VIDEO_PLAYLIST, so it
    // stays active across an update; a video entry needs to be
    // re-checked in case it got removed.
    const wasActiveVideoId = !isScKey(activeKey) ? activeKey : null;
    VIDEO_PLAYLIST = newVideoPlaylist;
    if (wasActiveVideoId && !VIDEO_PLAYLIST.some(v => v.id === wasActiveVideoId)) {
      activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;
    }

    // If the creator currently filtered on has no tracks left in the
    // updated list, drop back to "All" instead of showing an empty list.
    const mergedForFilterCheck = buildMergedList();
    if (activeAuthorFilter && !mergedForFilterCheck.some(e => resolveAuthorDisplay(e.author) === activeAuthorFilter)) {
      activeAuthorFilter = null;
    }

    recomputeAndRenderAll();
    fetchTitles();

    if (wasActiveVideoId && activeKey !== wasActiveVideoId && VIDEO_PLAYLIST.length) {
      // The track that was playing got removed from the list — jump to the first one.
      loadVideo(activeKey, false);
    }
  }

  PLAYLIST_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const list = (data && Array.isArray(data.videos) && data.videos.length) ? data.videos : DEFAULT_VIDEO_LIST;
    creatorAliases = (data && data.creatorAliases && typeof data.creatorAliases === 'object') ? data.creatorAliases : {};
    creatorOrder = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
    hiddenCreators = (data && Array.isArray(data.hiddenCreators)) ? data.hiddenCreators : [];
    handlePlaylistSnapshot(list);
  }, function (err) {
    console.error('Playlist sync error:', err);
    handlePlaylistSnapshot(DEFAULT_VIDEO_LIST);
  });

  recomputeAndRenderAll();
})();
</script>

<script>
// ============================================================
// ADMIN — hidden sign-in + track list editor.
//
// Sign-in is real Firebase Authentication (email/password) — create
// your admin account once under Firebase console → Authentication →
// Users → Add user. Writes to the shared playlist are only allowed
// for signed-in users; enforce that with Firestore security rules
// (see the note at the bottom of this file for suggested rules).
// ============================================================
(function () {
  const adminTrigger = document.getElementById('adminTrigger');
  const loginOverlay = document.getElementById('loginOverlay');
  const loginClose = document.getElementById('loginClose');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginSubmit = document.getElementById('loginSubmit');
  const loginError = document.getElementById('loginError');

  const adminOverlay = document.getElementById('adminOverlay');
  const adminPanelClose = document.getElementById('adminPanelClose');
  const adminVideoList = document.getElementById('adminVideoList');
  const adminCreatorList = document.getElementById('adminCreatorList');
  const addVideoBtn = document.getElementById('addVideoBtn');
  const saveVideosBtn = document.getElementById('saveVideosBtn');
  const resetDefaultBtn = document.getElementById('resetDefaultBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const adminSaveStatus = document.getElementById('adminSaveStatus');

  let draftList = [];
  let draftCreators = [];

  function openLogin() {
    loginError.textContent = '';
    loginUser.value = '';
    loginPass.value = '';
    loginOverlay.hidden = false;
    loginUser.focus();
  }
  function closeLogin() { loginOverlay.hidden = true; }

  // One row per raw creator name VIDEO_PLAYLIST (the live, already-fetched
  // video list — a top-level variable shared with the player logic) has
  // seen an author come back as, plus any raw name already referenced by
  // saved settings so editing something mid-fetch or briefly absent
  // doesn't just disappear from the list.
  function collectKnownRawAuthors() {
    const seen = new Set();
    const list = [];
    VIDEO_PLAYLIST.forEach(v => {
      if (v.author && !seen.has(v.author)) { seen.add(v.author); list.push(v.author); }
    });
    Object.keys(creatorAliases).forEach(raw => { if (!seen.has(raw)) { seen.add(raw); list.push(raw); } });
    hiddenCreators.forEach(raw => { if (!seen.has(raw)) { seen.add(raw); list.push(raw); } });
    return list;
  }

  function buildDraftCreators() {
    const rows = collectKnownRawAuthors().map(raw => ({
      raw,
      displayAs: creatorAliases[raw] || raw,
      hidden: hiddenCreators.includes(raw)
    }));
    // Pre-sort rows to match the saved creatorOrder (by each row's current
    // Display As), so reopening the editor doesn't visually shuffle
    // creators that already have an explicit order set.
    rows.sort((a, b) => {
      const ia = creatorOrder.indexOf(a.displayAs);
      const ib = creatorOrder.indexOf(b.displayAs);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.raw.localeCompare(b.raw, undefined, { sensitivity: 'base' });
    });
    return rows;
  }

  function renderAdminCreatorList() {
    if (!draftCreators.length) {
      adminCreatorList.innerHTML = '<div class="empty-state">No creators detected yet.</div>';
      return;
    }
    adminCreatorList.innerHTML = draftCreators.map((row, i) => `
      <div class="admin-row" data-index="${i}">
        <div class="admin-row-top">
          <span class="admin-row-title">${escapeAttr(row.raw)}</span>
          <div class="admin-row-btns">
            <button class="round-btn admin-creator-up" title="Move up" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
            <button class="round-btn admin-creator-down" title="Move down" ${i === draftCreators.length - 1 ? 'disabled' : ''}>&darr;</button>
          </div>
        </div>
        <label>Display As</label>
        <input type="text" class="admin-creator-displayas-input" value="${escapeAttr(row.displayAs)}" />
        <label class="admin-checkbox-label">
          <input type="checkbox" class="admin-creator-hide-input" ${row.hidden ? 'checked' : ''} />
          Hide from creator filter
        </label>
      </div>
    `).join('');

    adminCreatorList.querySelectorAll('.admin-row').forEach(row => {
      const idx = parseInt(row.getAttribute('data-index'), 10);
      row.querySelector('.admin-creator-displayas-input').addEventListener('input', e => {
        draftCreators[idx].displayAs = e.target.value;
      });
      row.querySelector('.admin-creator-hide-input').addEventListener('change', e => {
        draftCreators[idx].hidden = e.target.checked;
      });
      row.querySelector('.admin-creator-up').addEventListener('click', () => {
        if (idx === 0) return;
        [draftCreators[idx - 1], draftCreators[idx]] = [draftCreators[idx], draftCreators[idx - 1]];
        renderAdminCreatorList();
      });
      row.querySelector('.admin-creator-down').addEventListener('click', () => {
        if (idx === draftCreators.length - 1) return;
        [draftCreators[idx + 1], draftCreators[idx]] = [draftCreators[idx], draftCreators[idx + 1]];
        renderAdminCreatorList();
      });
    });
  }

  function openAdminPanel() {
    draftList = currentVideoList.map(v => ({ url: v.url, title: v.title || '' }));
    draftCreators = buildDraftCreators();
    renderAdminList();
    renderAdminCreatorList();
    adminSaveStatus.textContent = '';
    adminOverlay.hidden = false;
  }
  function closeAdminPanel() { adminOverlay.hidden = true; }

  adminTrigger.addEventListener('click', function () {
    if (auth.currentUser) openAdminPanel();
    else openLogin();
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.altKey && (e.key === 'a' || e.key === 'A')) {
      if (auth.currentUser) openAdminPanel();
      else openLogin();
    }
  });

  loginClose.addEventListener('click', closeLogin);
  loginOverlay.addEventListener('click', function (e) { if (e.target === loginOverlay) closeLogin(); });

  async function handleLoginSubmit() {
    const email = loginUser.value.trim();
    const pass = loginPass.value;
    if (!email || !pass) {
      loginError.textContent = 'Enter an email and password.';
      return;
    }
    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Checking…';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      closeLogin();
      openAdminPanel();
    } catch (err) {
      loginError.textContent = 'Sign-in failed: ' + (err && err.message ? err.message : 'unknown error');
    } finally {
      loginSubmit.disabled = false;
      loginSubmit.textContent = 'Sign In';
    }
  }
  loginSubmit.addEventListener('click', handleLoginSubmit);
  loginPass.addEventListener('keydown', function (e) { if (e.key === 'Enter') handleLoginSubmit(); });

  adminPanelClose.addEventListener('click', closeAdminPanel);
  adminOverlay.addEventListener('click', function (e) { if (e.target === adminOverlay) closeAdminPanel(); });
  logoutBtn.addEventListener('click', function () {
    auth.signOut();
    closeAdminPanel();
  });

  function renderAdminList() {
    if (!draftList.length) {
      adminVideoList.innerHTML = '<div class="empty-state">No tracks yet. Add one below.</div>';
      return;
    }
    adminVideoList.innerHTML = draftList.map((v, i) => `
      <div class="admin-row" data-index="${i}">
        <div class="admin-row-top">
          <span class="admin-row-title">Track ${i + 1}</span>
          <div class="admin-row-btns">
            <button class="round-btn admin-move-up" title="Move up" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
            <button class="round-btn admin-move-down" title="Move down" ${i === draftList.length - 1 ? 'disabled' : ''}>&darr;</button>
            <button class="round-btn admin-remove" title="Remove">&times;</button>
          </div>
        </div>
        <label>YouTube Link</label>
        <input type="text" class="admin-url-input" placeholder="Paste a YouTube link" value="${escapeAttr(v.url)}" />
        <label>Title</label>
        <input type="text" class="admin-title-input" placeholder="Track title" value="${escapeAttr(v.title)}" />
      </div>
    `).join('');

    adminVideoList.querySelectorAll('.admin-row').forEach(row => {
      const idx = parseInt(row.getAttribute('data-index'), 10);
      row.querySelector('.admin-url-input').addEventListener('input', e => { draftList[idx].url = e.target.value; });
      row.querySelector('.admin-title-input').addEventListener('input', e => { draftList[idx].title = e.target.value; });
      row.querySelector('.admin-remove').addEventListener('click', () => {
        draftList.splice(idx, 1);
        renderAdminList();
      });
      row.querySelector('.admin-move-up').addEventListener('click', () => {
        if (idx === 0) return;
        [draftList[idx - 1], draftList[idx]] = [draftList[idx], draftList[idx - 1]];
        renderAdminList();
      });
      row.querySelector('.admin-move-down').addEventListener('click', () => {
        if (idx === draftList.length - 1) return;
        [draftList[idx + 1], draftList[idx]] = [draftList[idx], draftList[idx + 1]];
        renderAdminList();
      });
    });
  }

  function escapeAttr(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  addVideoBtn.addEventListener('click', function () {
    draftList.push({ url: '', title: '' });
    renderAdminList();
  });

  saveVideosBtn.addEventListener('click', async function () {
    const cleaned = draftList
      .map(v => ({ url: (v.url || '').trim(), title: (v.title || '').trim() }))
      .filter(v => v.url);

    const invalid = cleaned.filter(v => !extractVideoId(v.url));
    if (invalid.length) {
      adminSaveStatus.style.color = '#ff9b9b';
      adminSaveStatus.textContent = 'One or more links don’t look like valid YouTube links — fix those and save again.';
      return;
    }

    if (!auth.currentUser) {
      adminSaveStatus.style.color = '#ff9b9b';
      adminSaveStatus.textContent = 'You’ve been signed out — please sign in again.';
      return;
    }

    // Turn the Creators rows into the three fields the player reads:
    // aliases for any row renamed away from its raw detected name (giving
    // two rows the same Display As combines them), hiddenCreators for any
    // row checked "Hide," and creatorOrder as the surviving (non-hidden)
    // Display As values in their current row order, deduped so a combined
    // pair only claims one slot.
    const creatorAliasesToSave = {};
    const creatorOrderToSave = [];
    const hiddenCreatorsToSave = [];
    draftCreators.forEach(row => {
      const display = (row.displayAs || '').trim() || row.raw;
      if (display !== row.raw) creatorAliasesToSave[row.raw] = display;
      if (row.hidden) {
        hiddenCreatorsToSave.push(row.raw);
      } else if (!creatorOrderToSave.includes(display)) {
        creatorOrderToSave.push(display);
      }
    });

    saveVideosBtn.disabled = true;
    adminSaveStatus.style.color = 'var(--accent)';
    adminSaveStatus.textContent = 'Saving…';
    try {
      await PLAYLIST_DOC_REF.set({
        videos: cleaned,
        creatorAliases: creatorAliasesToSave,
        creatorOrder: creatorOrderToSave,
        hiddenCreators: hiddenCreatorsToSave,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy: auth.currentUser.email || auth.currentUser.uid
      });
      // No need to update local state manually — the onSnapshot listener
      // above will pick this up and refresh the player/playlist for
      // everyone, including this browser.
      adminSaveStatus.style.color = 'var(--accent)';
      adminSaveStatus.textContent = 'Saved — everyone will see the update.';
    } catch (err) {
      adminSaveStatus.style.color = '#ff9b9b';
      adminSaveStatus.textContent = 'Save failed: ' + (err && err.message ? err.message : 'unknown error') + ' (check your Firestore security rules).';
    } finally {
      saveVideosBtn.disabled = false;
    }
  });

  resetDefaultBtn.addEventListener('click', function () {
    draftList = DEFAULT_VIDEO_LIST.map(v => ({ url: v.url, title: v.title || '' }));
    renderAdminList();
    adminSaveStatus.style.color = 'var(--accent)';
    adminSaveStatus.textContent = 'Reset to default list — click Save Changes to apply.';
  });
})();
</script>
