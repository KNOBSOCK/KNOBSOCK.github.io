<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Music Player + Playlist</title>
<style>
  :root {
    --ink: #3a2a00;
    --panel: rgba(58, 42, 0, 0.32);
    --panel-2: rgba(58, 42, 0, 0.8);
    --line: rgba(255, 220, 120, 0.6);
    --accent: #f2b705;
    --accent-dim: #b8890a;
    --lime: #a3e635;
    --lime-dim: #65a30d;
    --text: #ffffff;
    --text-dim: #f5e9c9;
    --font-display: Arial, Helvetica, sans-serif;
    --font-body: Arial, Helvetica, sans-serif;

    --inset-top: clamp(4px, 1vw, 8px);
    --inset-side: clamp(4px, 1vw, 8px);
    --inset-bottom: clamp(16px, 3vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body { position: relative; }

  .layout {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 10px;
    padding: var(--inset-top) var(--inset-side) var(--inset-bottom);
    background: transparent;
  }

  @media (max-width: 860px) {
    .layout {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  }

  @media (min-width: 861px) {
    .layout {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 34%);

      grid-template-rows: 1fr;
      grid-template-areas: "video playlist";
      gap: 14px;
    }

    .layout.playlist-hidden .video-pane {
      grid-column: 1 / -1;
    }

    .video-pane { grid-area: video; min-height: 0; max-height: 100%; aspect-ratio: auto; }
    .playlist-pane { grid-area: playlist; min-height: 0; }
  }

  .video-pane {
    position: relative;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    width: 100%;

    aspect-ratio: 16 / 9;
    flex: 0 0 auto;
    container-type: size;
    container-name: videobox;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .video-loading {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .video-loading[hidden] { display: none; }
  .video-pane.is-loading .video-frame-wrap iframe,
  .video-pane.is-loading .video-frame-wrap video { visibility: hidden; }

  .gif-loader {
    display: block;
    width: min(90px, 30%);
    height: auto;
    opacity: 0.35;
  }

  .video-frame-wrap {
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
  }

  .video-frame-wrap iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-frame-wrap video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .video-frame-wrap video::-webkit-media-controls { display: none !important; }

  .video-cover-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .video-cover-overlay[hidden] { display: none; }
  .video-cover-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .playlist-pane {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    display: flex;
    container-type: size;
    container-name: playlistbox;
  }

  .layout.playlist-hidden .playlist-pane { display: none; }
  @media (max-width: 860px) {

    .video-pane {

      flex: 1 1 auto;
      min-height: 56px;

      max-height: calc((100vw - 2 * var(--inset-side)) * 9 / 16);
    }
    .playlist-pane {
      flex: 0 0 232px;
      min-height: 0;
    }
    .layout.playlist-hidden .video-pane { flex: 1 1 auto; aspect-ratio: auto; max-height: none; }
  }

  @media (max-height: 860px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .layout .playlist-pane { display: none; }
    .layout .video-pane { flex: 1 1 auto; aspect-ratio: auto; max-height: none; }
  }

  .creator-chin {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.5vw, 10px);

    margin: clamp(8px, 2.6cqh, 12px) 0;
    padding: 0 2px;
    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .creator-chin::-webkit-scrollbar { display: none; }

  .creator-chip {
    flex: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    border-radius: 999px;
    padding: clamp(6px, 1.6vw, 9px) clamp(14px, 3vw, 18px);
    font-size: clamp(11px, 2.6vw, 13px);
    white-space: nowrap;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .creator-chip:hover { background: var(--accent-dim); color: #ffffff; }
  .creator-chip.active {

    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
  }

  .pill-btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    border-radius: clamp(4px, 1.5cqw, 8px);
    padding: clamp(6px, 1.8cqh, 10px) clamp(12px, 3.4cqw, 18px);
    font-size: clamp(11px, 3cqw, 14px);
    white-space: nowrap;
    background: var(--accent);
    border: 1px solid var(--accent-dim);
    color: #1a1200;
  }
  .pill-btn:hover:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .pill-btn:active:not(:disabled) { background: var(--accent-dim); color: #ffffff; }
  .pill-btn:disabled { opacity: 0.5; cursor: default; }

  .video-pane-actions {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    right: clamp(8px, 2cqw, 14px);
    z-index: 5;
    display: flex;
    gap: clamp(6px, 1.5cqw, 10px);
  }

  .unmute-btn {
    position: absolute;
    top: clamp(8px, 2cqh, 14px);
    left: clamp(8px, 2cqw, 14px);
    z-index: 5;
  }

  .video-pane .unmute-btn,
  .video-pane .video-pane-actions,
  .video-pane .video-controls {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .video-pane.controls-visible .unmute-btn,
  .video-pane.controls-visible .video-pane-actions,
  .video-pane.controls-visible .video-controls {
    opacity: 1;
    pointer-events: auto;
  }

  .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 2cqw, 12px);
    padding: clamp(10px, 2.6cqh, 14px) clamp(10px, 3cqw, 16px);
    background: linear-gradient(to top, rgba(58, 42, 0, 0.85), rgba(58, 42, 0, 0));
  }

  .round-btn {
    -webkit-appearance: none;
    appearance: none;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    line-height: 1;
    background: none;
    border: 0;
    color: var(--accent);
  }
  .round-btn:hover:not(:disabled) { color: var(--accent-dim); }
  .round-btn:active:not(:disabled) { color: var(--accent-dim); }
  .round-btn:disabled { opacity: 0.5; cursor: default; }

  .play-pause-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;

    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .play-pause-btn:hover:not(:disabled) {
    transform: scale(1.22) rotate(-6deg);
  }

  .fullscreen-btn {
    width: clamp(26px, 7.5cqw, 34px);
    font-size: clamp(11px, 3.2cqw, 15px);
    flex: none;
  }

  .video-pane.pseudo-fullscreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh; height: 100dvh;

    max-height: none;
    margin: 0;
    border-radius: 0;
    z-index: 9999;
  }

  .video-pane.pseudo-fullscreen.is-loading,
  .video-pane:fullscreen.is-loading,
  .video-pane:-webkit-full-screen.is-loading {
    background: #000;
  }

  .video-pane:fullscreen,
  .video-pane:-webkit-full-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh;
    aspect-ratio: auto;
    max-height: none;
    margin: 0;
    border-radius: 0;
  }

  .layout.fullscreen-active .playlist-pane {
    display: none;
  }

  .scrub-range {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-dim);
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .scrub-range:disabled { opacity: 0.5; cursor: default; }
  .scrub-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: transparent; }
  .scrub-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; margin-top: -4.5px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid #ffffff; cursor: pointer;
  }
  .scrub-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--accent-dim); }
  .scrub-range::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  .scrub-range::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #ffffff; cursor: pointer;
  }

  .time-label {
    flex: none;
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--text-dim);
    font-family: var(--font-body);
    white-space: nowrap;
  }

  .playlist-card {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-body);
    color: var(--text);
  }

  .playlist-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(8px, 2.6cqh, 12px) clamp(10px, 3cqw, 14px);
    border-bottom: 1px solid var(--line);
  }

  .playlist-title {
    font-size: clamp(12px, 3.2cqw, 15px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .playlist-count {
    font-size: clamp(9px, 2.6cqw, 12px);
    color: var(--ink);
  }

  .playlist-items {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: clamp(8px, 2.4cqh, 12px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 2cqh, 10px);

    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .playlist-items::-webkit-scrollbar { display: none; }

  .album-heading,
  .creator-heading {
    flex: none;
    font-size: clamp(10px, 2.6cqw, 12px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink);
    padding: 0 2px;
    margin-top: clamp(2px, 1cqh, 6px);
  }
  .album-heading:first-child,
  .creator-heading:first-child {
    margin-top: 0;
  }

  @media (max-width: 860px) {

    .playlist-items { flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: flex-start; }

    .album-heading,
    .creator-heading {
      writing-mode: vertical-rl;
      text-orientation: mixed;

      transform: rotate(180deg);
      margin-top: 0;
      padding: 4px 0;
    }
  }

  .playlist-item {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.4cqw, 12px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: clamp(6px, 2cqw, 10px);
    padding: clamp(6px, 1.8cqh, 8px);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
    flex: none;

    transition: transform 0.2s ease, background 0.15s ease;
  }
  .playlist-item:hover,
  .playlist-item:active {
    transform: scale(1.03) translateY(-2px);
  }
  .playlist-item:hover { background: var(--lime-dim); }
  .playlist-item.active {
    background: var(--lime-dim);
    border-color: var(--lime);
    box-shadow: 0 0 8px rgba(163, 230, 53, 0.5);
  }

  @media (max-width: 860px) {

    .playlist-item {
      flex-direction: column;
      align-items: stretch;

      width: clamp(108px, 32cqw, 150px);
    }
  }

  .playlist-thumb-wrap {
    position: relative;
    flex: none;
    width: clamp(72px, 24cqw, 108px);
    aspect-ratio: 16 / 9;
    border-radius: clamp(4px, 1cqw, 6px);
    overflow: hidden;
    background: #000;
  }
  .playlist-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 860px) {

    .playlist-thumb-wrap { width: 100%; }
    .playlist-meta { flex: 0 0 auto; }
  }
  .playlist-item.active .playlist-thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--lime);
    border-radius: inherit;
  }
  .now-playing-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(58, 42, 0, 0.85);
    color: var(--lime);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 5px;
    border-radius: 3px;
    display: none;
  }
  .playlist-item.active .now-playing-badge { display: inline-block; }

  .playlist-meta {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .playlist-item-title {
    font-size: clamp(11px, 2.8cqw, 13px);
    font-weight: 700;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .playlist-item-sub {
    font-size: clamp(9px, 2.4cqw, 11px);
    color: var(--text-dim);
  }

  @media (max-width: 860px) {

    .playlist-item-title { min-height: calc(2 * 1.3em); }
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink);
    font-size: clamp(10px, 2.8cqw, 13px);
    padding: 20px;
  }

  .sc-widget-frame {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    border: 0;
  }

</style>
</head>

<script>

const DEFAULT_VIDEO_LIST = [
  { url: "https://youtube.com/watch?v=euMJknnSSqk", title: "Track One" },
  { url: "https://youtube.com/watch?v=VuivQyVyKDM", title: "Track Two" },
  { url: "https://youtube.com/watch?v=Jc9Eay0tedo", title: "Track Three" }
];

let currentVideoList = DEFAULT_VIDEO_LIST;

let creatorAliases = {};
let creatorOrder = [];
let hiddenCreators = [];

let albumOrder = [];

let activeAuthorFilter = null;

let activeKey = null;
function isScKey(key) {
  return typeof key === 'string' && key.indexOf('sc-') === 0;
}

let scSoundsList = [];

let refreshMergedPlaylist = function () {};
let advanceToNextInMergedList = function () {};

let notifyScProgress = function () {};
let notifyScPlayState = function () {};

let playScByIndex = function () {};
let pauseSc = function () {};
let resumeSc = function () {};
let seekScToFraction = function () {};

function resolveAuthorDisplay(rawAuthor) {
  if (!rawAuthor) return rawAuthor;
  return creatorAliases[rawAuthor] || rawAuthor;
}

function getScAuthor(sound) {
  return (sound && sound.user && sound.user.username) ? sound.user.username : 'Unknown';
}

function getScArtworkUrl(sound) {
  const raw = (sound && (sound.artwork_url || (sound.user && sound.user.avatar_url))) || '';
  return raw ? raw.replace('-large.jpg', '-t500x500.jpg') : '';
}

function extractVideoId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return null;
}

function isDirectVideoUrl(input) {
  if (!input) return false;
  const trimmed = input.trim();
  return /^https?:\/\//i.test(trimmed) && /\.(m3u8|mp4|webm|mov)(\?.*)?$/i.test(trimmed);
}

function buildPlaylist(list, previousPlaylist) {
  const previousById = new Map();
  (previousPlaylist || []).forEach(v => { if (v.id) previousById.set(v.id, v); });

  return list
    .map(v => {
      const ytId = extractVideoId(v.url);
      const directUrl = !ytId && isDirectVideoUrl(v.url) ? v.url.trim() : null;
      if (!ytId && !directUrl) return null;
      const id = ytId || directUrl;
      const prev = previousById.get(id);
      const manualTitle = (v.title && v.title.trim()) ? v.title.trim() : null;
      return {
        id,
        type: ytId ? 'youtube' : 'direct',
        url: directUrl,
        title: manualTitle || (prev ? prev.title : null),
        author: prev ? prev.author : null,
        album: (v.album && v.album.trim()) ? v.album.trim() : null,
        thumb: (v.thumb && v.thumb.trim()) ? v.thumb.trim() : '',
        addedAt: v.addedAt || 0
      };
    })
    .filter(Boolean);
}

let VIDEO_PLAYLIST = buildPlaylist(currentVideoList);

activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;

(function () {
  const layout = document.getElementById('layout');
  const toggleBtn = document.getElementById('togglePlaylistBtn');
  toggleBtn.addEventListener('click', function () {
    const hidden = layout.classList.toggle('playlist-hidden');
    toggleBtn.textContent = hidden ? 'Show Playlist' : 'Hide Playlist';

(function () {

  function escapeHtml(s) {

  }

  function normalizeTitleForMatch(t) {
    return (t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function buildMergedList() {
    const merged = [];
    const usedScIndexes = new Set();

    VIDEO_PLAYLIST.forEach(v => {
      const isDirect = v.type === 'direct';
      merged.push({
        key: v.id,

        linkUrl: isDirect ? v.url : ('https://www.youtube.com/watch?v=' + v.id)
      });

      const vNorm = normalizeTitleForMatch(v.title);
      if (!vNorm) return;
      scSoundsList.forEach((sound, i) => {
        if (usedScIndexes.has(i)) return;
        const scNorm = normalizeTitleForMatch(sound.title);
        if (scNorm && (scNorm === vNorm || scNorm.includes(vNorm) || vNorm.includes(scNorm))) {
          usedScIndexes.add(i);
        }
      });
    });

    scSoundsList.forEach((sound, i) => {
      if (usedScIndexes.has(i)) return;
      merged.push({
        key: 'sc-' + sound.id,
        kind: 'sc',
        soundIndex: i,
        title: sound.title,
        author: getScAuthor(sound),

        album: 'SoundCloud',
        thumbnail: getScArtworkUrl(sound),
        linkUrl: sound.permalink_url || '#'
      });
    });

    return merged;
  }

  function orderVisibleForFilter(visible) {
    if (!activeAuthorFilter) return visible;
    const groups = [];
    const byAlbum = new Map();
    visible.forEach(e => {
      const key = e.album || '';
      let g = byAlbum.get(key);
      if (!g) {
        g = { album: key, maxAdded: 0, items: [] };
        byAlbum.set(key, g);
        groups.push(g);
      }
      g.items.push(e);
      if ((e.addedAt || 0) > g.maxAdded) g.maxAdded = e.addedAt || 0;
    });

    groups.sort((a, b) => {
      const ia = albumOrder.indexOf(a.album);
      const ib = albumOrder.indexOf(b.album);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return b.maxAdded - a.maxAdded;
    });
    return groups.reduce((all, g) => all.concat(g.items), []);
  }

  function orderVisibleForAll(visible) {
    const groups = [];
    const byAuthor = new Map();
    visible.forEach(e => {
      const display = e.author ? resolveAuthorDisplay(e.author) : null;
      let g = byAuthor.get(display);
      if (!g) {
        g = { display: display, items: [] };
        byAuthor.set(display, g);
        groups.push(g);
      }
      g.items.push(e);
    });
    groups.sort((a, b) => {
      if (a.display === null || b.display === null) {
        if (a.display === b.display) return 0;
        return a.display === null ? 1 : -1;
      }
      const ia = creatorOrder.indexOf(a.display);
      const ib = creatorOrder.indexOf(b.display);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      if (a.display === 'Unknown') return 1;
      if (b.display === 'Unknown') return -1;
      return a.display.localeCompare(b.display, undefined, { sensitivity: 'base' });
    });
    return groups.reduce((all, g) => all.concat(g.items), []);
  }

  function renderPlaylist(merged) {

    playlistItemsEl.innerHTML = ordered.map(e => {

      if (activeAuthorFilter) {

        <div class="playlist-thumb-wrap">
          ${e.thumbnail ? `<img src="${escapeHtml(e.thumbnail)}" alt="${escapeHtml(title)}" loading="lazy" />` : ''}

      if (ia !== -1) return -1;

    const authorChips = authors.map(a => {

  function fetchTitles() {
    VIDEO_PLAYLIST.forEach((v, i) => {
      if (v.type === 'direct') {
        if (!v.title) v.title = 'Track ' + (i + 1);
        if (!v.author) v.author = 'Unknown';
        return;
      }
      const needsTitle = !v.title;
      if (!needsTitle && v.author) return;
      const watchUrl = 'https://www.youtube.com/watch?v=' + v.id;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      fetch('https://noembed.com/embed?url=' + encodeURIComponent(watchUrl) + '&format=json', { signal: controller.signal })
        .then(res => { if (!res.ok) throw new Error('oEmbed request failed'); return res.json(); })
        .then(data => {
          clearTimeout(timeoutId);
          if (needsTitle) {
            const t = data && typeof data.title === 'string' ? data.title.trim() : '';
            v.title = t ? t : ('Track ' + (i + 1));
          }
          const a = data && typeof data.author_name === 'string' ? data.author_name.trim() : '';
          v.author = a || 'Unknown';
          recomputeAndRenderAll();
        })
        .catch(() => {
          clearTimeout(timeoutId);
          if (needsTitle) v.title = 'Track ' + (i + 1);
          v.author = v.author || 'Unknown';
          recomputeAndRenderAll();
        });
    });
    recomputeAndRenderAll();
  }

  function requestFs(el) {

    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
  function handleEscKey(e) { if (e.key === 'Escape' || e.key === 'Esc') exitPseudoFullscreen(); }
  function enterPseudoFullscreen() {
    videoPane.classList.add('pseudo-fullscreen');
    usingPseudoFullscreen = true;
    document.addEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function exitPseudoFullscreen() {
    videoPane.classList.remove('pseudo-fullscreen');
    usingPseudoFullscreen = false;
    document.removeEventListener('keydown', handleEscKey);
    updateFullscreenIcon();
  }
  function updateFullscreenIcon() {
    const fs = isFullscreen();
    fullscreenBtn.title = fs ? 'Exit Fullscreen' : 'Fullscreen';

    layoutEl.classList.toggle('fullscreen-active', fs);
  }
  fullscreenBtn.addEventListener('click', function () {
    if (isFullscreen()) {
      if (usingPseudoFullscreen) exitPseudoFullscreen();
      else exitFs();
      return;
    }
    if (hasNativeFullscreenSupport(videoPane)) requestFs(videoPane);
    else enterPseudoFullscreen();
  });
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
    document.addEventListener(evt, updateFullscreenIcon);
  });

  function handlePlaylistSnapshot(list) {
    currentVideoList = list;
    const newVideoPlaylist = buildPlaylist(currentVideoList, VIDEO_PLAYLIST);

    if (!firestoreDataReady) {
      firestoreDataReady = true;
      VIDEO_PLAYLIST = newVideoPlaylist;
      activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;
      lastVideoKey = activeKey;
      recomputeAndRenderAll();
      fetchTitles();
      tryInitPlayer();
      return;
    }

    const wasActiveVideoId = !isScKey(activeKey) ? activeKey : null;
    VIDEO_PLAYLIST = newVideoPlaylist;
    if (wasActiveVideoId && !VIDEO_PLAYLIST.some(v => v.id === wasActiveVideoId)) {
      activeKey = VIDEO_PLAYLIST.length ? VIDEO_PLAYLIST[0].id : null;
      lastVideoKey = activeKey;
    }

    const mergedForFilterCheck = buildMergedList();
    if (activeAuthorFilter && !mergedForFilterCheck.some(e => resolveAuthorDisplay(e.author) === activeAuthorFilter)) {
      activeAuthorFilter = null;
    }

    recomputeAndRenderAll();
    fetchTitles();

    if (wasActiveVideoId && activeKey !== wasActiveVideoId && VIDEO_PLAYLIST.length) {
      playMergedKey(activeKey);
    }
  }

  PLAYLIST_DOC_REF.onSnapshot(function (doc) {
    const data = doc.exists ? doc.data() : null;
    const list = (data && Array.isArray(data.videos) && data.videos.length) ? data.videos : DEFAULT_VIDEO_LIST;
    creatorAliases = (data && data.creatorAliases && typeof data.creatorAliases === 'object') ? data.creatorAliases : {};
    creatorOrder = (data && Array.isArray(data.creatorOrder)) ? data.creatorOrder : [];
    hiddenCreators = (data && Array.isArray(data.hiddenCreators)) ? data.hiddenCreators : [];
    albumOrder = (data && Array.isArray(data.albumOrder)) ? data.albumOrder : [];
    handlePlaylistSnapshot(list);
  }, function (err) {
    console.error('Playlist sync error:', err);
    handlePlaylistSnapshot(DEFAULT_VIDEO_LIST);
  });

  recomputeAndRenderAll();
  pollTimer = setInterval(updateProgress, 500);
})();
</script>

<script>

(function () {
  const scFrame = document.getElementById('scWidgetFrame');

  let scWidget = null;
  let scDuration = 0;

  playScByIndex = function (idx) {
    if (idx < 0 || idx >= scSoundsList.length) return;
    const sound = scSoundsList[idx];
    scDuration = (sound.duration || 0) / 1000;
    scWidget.skip(idx);
    scWidget.play();
  };
  pauseSc = function () {
    scWidget.pause();
  };
  resumeSc = function () {
    scWidget.play();
  };
  seekScToFraction = function (fraction) {
    if (!scDuration) return;
    scWidget.seekTo(fraction * scDuration * 1000);
  };

  function bindScWidgetEvents() {
    scWidget.bind(SC.Widget.Events.READY, function () {
      scWidget.getSounds(function (sounds) {
        scSoundsList = sounds || [];
        refreshMergedPlaylist();
      });
    });

    scWidget.bind(SC.Widget.Events.PLAY, function () {
      notifyScPlayState(true);
    });
    scWidget.bind(SC.Widget.Events.PAUSE, function () {
      notifyScPlayState(false);
    });

    scWidget.bind(SC.Widget.Events.PLAY_PROGRESS, function (data) {
      if (!isScKey(activeKey) || !scDuration) return;

      notifyScProgress(data.relativePosition * scDuration, scDuration);
    });

    scWidget.bind(SC.Widget.Events.FINISH, function () {
      if (isScKey(activeKey)) advanceToNextInMergedList();
    });
  }

  db.collection('chat_config').doc('soundcloud').get().then(function (doc) {
    const data = doc.exists ? doc.data() : null;
    if (!data || !data.profileUrl) return;
    scFrame.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(data.profileUrl) + '&auto_play=false&show_artwork=false';
    scWidget = SC.Widget(scFrame);
    bindScWidgetEvents();
  }).catch(function () {});
})();
</script>
